<script>
(()=>{
'use strict';
/* ================= CONFIG ================= */
const RS=2, W=128, CELL=14, N=8, MINH=242, MAXH=310, BOT_H=18, TMAX=90;
let H=250, BX=(W-CELL*N)>>1, BY=0, FEVY=0, BOSS_BOT=0, SUPY=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FJ='16px "DotGothic16"', F8=FJ;
const OUT='#1a0f2e', WHITE='#ffffff', CREAM='#fff4e0', PANEL='#24124c';
const SP={NONE:0,H:1,V:2,BOMB:3,RAIN:4,CAP:5,CLOCK:6,JUNK:7};
const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
const FEVER_NAME=['脳汁タイム','脳汁ドバドバ','脳汁ビッグバン'];
const FEVER_DMG=[2,3,4], FEVER_SC=[3,5,8];
const AREAS=[
  {name:'ヒマヒマ星',boss:'ヒマドン',move:'ヒマビーム',fx:'row',waves:[2,3],hue:320,seed:1101,r:10,ring:false},
  {name:'ダラダラ星',boss:'ダラゴン',move:'ダラダラ波',fx:'steal',waves:[2,3],hue:28,seed:2203,r:10,ring:true},
  {name:'ネムネム星',boss:'ネムリーナ',move:'おやすみ光線',fx:'scatter',waves:[3,3],hue:250,seed:3307,r:11,ring:false},
  {name:'マンネリ星',boss:'マンネリオン',move:'マンネリ渦',fx:'shuffle',waves:[3,2,3],hue:175,seed:4409,r:11,ring:true},
  {name:'ムキリョク星',boss:'ムキリョクX',move:'ムキリョク砲',fx:'col',waves:[3,3,3],hue:95,seed:5521,r:12,ring:false},
  {name:'タイクツ大王星',boss:'タイクツ大王',move:'大タイクツ',fx:'king',waves:[3,3,3],hue:0,seed:6637,r:15,ring:true},
];

function layout(){BY=H-BOT_H-4-CELL*N;FEVY=BY-8;BOSS_BOT=FEVY-2;SUPY=BY+CELL*N+3;}
function fit(){
  const dpr=window.devicePixelRatio||1;
  const cs=getComputedStyle(wrap),vv=window.visualViewport;
  const vw=Math.min(wrap.clientWidth,vv?vv.width:Infinity),vh=Math.min(wrap.clientHeight,vv?vv.height:Infinity,window.innerHeight||Infinity);
  const aw=Math.max(100,vw-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)), ah=Math.max(150,vh-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-8);
  let s=Math.floor(Math.min(aw*dpr/W, ah*dpr/MINH)); s=Math.max(RS,s-(s%RS));
  let h=Math.floor(ah*dpr/s); h=Math.max(MINH,Math.min(MAXH,h));
  H=h; cv.width=W*RS; cv.height=H*RS;
  cv.style.width=(W*s/dpr)+'px'; cv.style.height=(H*s/dpr)+'px';
  ctx.imageSmoothingEnabled=false; layout(); ditherPat=null;
}

/* ================= SAVE ================= */
const SAVE_KEY='dopagaki_save_v1';
let save={op:false,lap:1,cleared:0,best:[0,0,0,0,0,0]};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')Object.assign(save,s);}catch(e){}
  if(!Array.isArray(save.best)||save.best.length<6)save.best=[0,0,0,0,0,0];save.cleared=Math.max(0,Math.min(5,save.cleared|0));save.lap=Math.max(1,save.lap|0);}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const diffMul=ai=>(1+0.45*ai)*Math.pow(1.7,save.lap-1);

/* ================= SPRITES ================= */
const HEART=["............","..##....##..",".####..####.","############","############","############",".##########.","..########..","...######...","....####....",".....##.....","............"];
const STAR=[".....##.....","....####....","....####....","############",".##########.","..########..","...######...","..########..","..###..###..",".###....###.",".##......##.","............"];
const DROP=[".....##.....","....####....","....####....","...######...","..########..",".##########.","############","############","############","############",".##########.","..########.."];
const DIAM=["............","............","..########..",".##########.","############","############",".##########.","..########..","...######...","....####....",".....##.....","............"];
const TRI=[".....##.....",".....##.....","....####....","....####....","...######...","...######...","..########..","..########..",".##########.",".##########.","############","############"];
const COIN=["....####....","..########..",".##########.",".##########.","############","############","############","############",".##########.",".##########.","..########..","....####...."];
const BLOCK=[".##########.","############","############","############","############","############","############","############","############","############","############",".##########."];
const UFO=["........########........","......############......",".....##############.....","..####################..","########################","########################","..####################..","....################....","....##...##..##...##...."];
const MINISTAR=["...#...","...#...","#######",".#####.","..###..",".##.##.","##...##"];
const GEMS=[
  {b:'#ff4f9a',h:'#ffb3d4',s:'#c2246c',m:HEART,e:4},
  {b:'#ffd23f',h:'#fff3a8',s:'#e09a00',m:STAR,e:5},
  {b:'#2fe0b8',h:'#b5ffe9',s:'#119b80',m:DROP,e:7},
  {b:'#4d7cff',h:'#b8caff',s:'#2a46c9',m:DIAM,e:4},
  {b:'#a35cff',h:'#dcbcff',s:'#6a2bc4',m:TRI,e:7},
  {b:'#ff8a3d',h:'#ffd0a8',s:'#c95314',m:COIN,e:5},
];
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const maskOf=(m,w,h)=>(x,y)=>y>=0&&y<h&&x>=0&&x<w&&m[y][x]==='#';
function shadeMask(mk,w,h,pal){
  const out=[];
  for(let y=0;y<h;y++){out[y]=[];for(let x=0;x<w;x++){
    if(!mk(x,y)){out[y][x]=null;continue;}
    let col;
    if(!mk(x-1,y)||!mk(x+1,y)||!mk(x,y-1)||!mk(x,y+1)) col=pal.o||OUT;
    else if(!mk(x,y-2)||!mk(x-2,y)||!mk(x-1,y-1)) col=pal.h;
    else if(!mk(x,y+2)||!mk(x+2,y)||!mk(x+1,y+1)) col=pal.s;
    else col=pal.b;
    out[y][x]=col;
  }}
  return out;
}
function paint(arr,w,h){const c=mkC(w,h),g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const col=arr[y][x];if(col){g.fillStyle=col;g.fillRect(x,y,1,1);}}return c;}
function silhouette(arr,w,h,col){const c=mkC(w,h),g=c.getContext('2d');g.fillStyle=col;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(arr[y][x])g.fillRect(x,y,1,1);return c;}
const inner=(a,x,y)=>a[y]&&a[y][x]&&a[y][x]!==OUT;

const GSPR=GEMS.map(G=>{
  const base=shadeMask(maskOf(G.m,12,12),12,12,G);
  let best=null;
  for(let y=0;y<12;y++)for(let x=0;x<12;x++){if(inner(base,x,y)&&(!best||x+y<best[0]+best[1]))best=[x,y];}
  if(best){base[best[1]][best[0]]=WHITE;if(inner(base,best[0]+1,best[1]))base[best[1]][best[0]+1]=WHITE;}
  const face=(a,open)=>{
    const e=G.e;
    if(open){for(const x of [4,7])for(const y of [e,e+1])if(a[y]&&a[y][x])a[y][x]=OUT;}
    else{for(const x of [3,4,7,8])if(a[e+1]&&a[e+1][x])a[e+1][x]=OUT;}
    for(const x of [3,8])if(inner(a,x,e+2))a[e+2][x]=G.h;
  };
  const v=fn=>{const a=base.map(r=>r.slice());fn(a);return paint(a,12,12);};
  return {
    n:v(a=>face(a,true)),
    blink:v(a=>face(a,false)),
    h:v(a=>{face(a,true);for(const y of [G.e-2,G.e+3])for(let x=0;x<12;x++)if(inner(a,x,y))a[y][x]=WHITE;}),
    v:v(a=>{face(a,true);for(const x of [2,9])for(let y=0;y<12;y++)if(inner(a,x,y))a[y][x]=WHITE;}),
    w:silhouette(base,12,12,WHITE),
  };
});
const ISPR={};
(()=>{
  const cm=maskOf(COIN,12,12);
  const top=shadeMask(cm,12,12,{b:'#ff4f9a',h:'#ffb3d4',s:'#c2246c'}),bot=shadeMask(cm,12,12,{b:'#fff4e0',h:WHITE,s:'#c9b8e8'});
  const cap=top.map((r,y)=>y<6?r:bot[y]);for(let x=0;x<12;x++)if(cap[6][x])cap[6][x]=OUT;
  cap[2][3]=WHITE;cap[2][4]=WHITE;
  for(const [x,y] of [[5,8],[6,8],[7,9],[6,10]])if(inner(cap,x,y))cap[y][x]='#a35cff';
  ISPR.cap=paint(cap,12,12);ISPR.capW=silhouette(cap,12,12,WHITE);
  const ck=shadeMask(cm,12,12,{b:'#fff4e0',h:WHITE,s:'#d9cdf2'});
  for(let y=0;y<12;y++)for(let x=0;x<12;x++){if(!inner(ck,x,y))continue;let edge=false;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const q=ck[y+dy]&&ck[y+dy][x+dx];if(q===OUT)edge=true;}if(edge)ck[y][x]='#2fe0b8';}
  for(const [x,y] of [[6,3],[6,4],[6,5],[6,6],[7,6],[8,6]])ck[y][x]=OUT;
  ck[6][5]='#ff4f9a';
  ISPR.clock=paint(ck,12,12);
  const jk=shadeMask(maskOf(BLOCK,12,12),12,12,{b:'#8a7aa8',h:'#c3b6dc',s:'#5a4a78'});
  for(const y of [3,9])for(let x=1;x<11;x++)if(inner(jk,x,y))jk[y][x]='#5a4a78';
  for(const [x,y] of [[6,1],[6,2],[3,10],[9,10],[2,1],[2,2]])if(inner(jk,x,y))jk[y][x]='#5a4a78';
  for(const [x,y] of [[3,6],[4,6],[7,6],[8,6],[5,8],[6,8]])jk[y][x]=OUT;
  ISPR.junk=paint(jk,12,12);ISPR.junkW=silhouette(jk,12,12,WHITE);
  const um=maskOf(UFO,24,9);
  const glass=shadeMask(um,24,9,{b:'#7ff0ff',h:WHITE,s:'#2fb8d0'}),body=shadeMask(um,24,9,{b:'#9a8ab8',h:'#d9cdf2',s:'#5a4a78'});
  ISPR.ufo=paint(glass.map((r,y)=>y<3?r:body[y]),24,9);
})();
const RAINCOL=[];for(let i=0;i<12;i++)RAINCOL.push(hsl(i*30,100,64));
const RAINPIX=[];(()=>{const mk=maskOf(COIN,12,12);
  for(let y=0;y<12;y++)for(let x=0;x<12;x++)if(mk(x,y)){
    RAINPIX.push({x,y,o:!mk(x-1,y)||!mk(x+1,y)||!mk(x,y-1)||!mk(x,y+1),eye:(x===4||x===7)&&(y===5||y===6),gl:(x===3||x===4)&&y===2});
  }})();

/* ---- monsters (タイクツ星人) ---- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genMonster(seed,w,h,hue,opt){
  opt=opt||{};
  const R=mulberry(seed),half=w>>1,cx=(w-1)/2,rx=w/2-1.2,cyy=h*(opt.crown?0.64:0.6),ry=h*(opt.crown?0.36:0.42);
  let m=[];for(let y=0;y<h;y++){m[y]=[];for(let x=0;x<w;x++){const dx=(x-cx)/rx,dy=(y-cyy)/ry,d=dx*dx+dy*dy;m[y][x]=d<0.5?1:(d<1.1?(R()<0.5?1:0):0);}}
  const sym=()=>{for(let y=0;y<h;y++)for(let x=half;x<w;x++)m[y][x]=m[y][w-1-x];};
  sym();
  for(let it=0;it<2;it++){const n2=m.map(r=>r.slice());
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const yy=y+dy,xx=x+dx;if(yy>=0&&yy<h&&xx>=0&&xx<w&&m[yy][xx])n++;}n2[y][x]=n>=5?1:(n<=2?0:m[y][x]);}
    m=n2;sym();}
  if(!opt.crown&&R()<0.75){const hx=2+((R()*Math.max(1,half-5))|0),hl=2+((R()*Math.max(2,h*0.16))|0);let top=0;while(top<h&&!m[top][hx])top++;for(let i=1;i<=hl;i++){const yy=top-i;if(yy<0)break;m[yy][hx]=1;if(i<hl&&w>=28)m[yy][hx+1]=1;}sym();}
  if(R()<0.6){const fx=Math.floor(half*0.45)+((R()*Math.max(1,half*0.3))|0);let bot=h-1;while(bot>0&&!m[bot][fx])bot--;for(let yy=bot+1;yy<h;yy++){m[yy][fx]=1;if(w>=28)m[yy][fx+1]=1;}sym();}
  if(R()<0.5){const ay=Math.floor(h*0.45)+((R()*h*0.2)|0);let side=0;while(side<half&&!m[ay][side])side++;const len=Math.max(2,(w*0.1)|0);for(let x=side-len;x<side;x++)if(x>=0){m[ay][x]=1;if(x===side-len&&ay>0)m[ay-1][x]=1;}sym();}
  const pal={b:hsl(hue,78,60),h:hsl(hue,90,80),s:hsl(hue,70,38),o:OUT};
  const mk=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&m[y][x]===1;
  const arr=shadeMask(mk,w,h,pal);
  const set=(x,y,c)=>{if(y>=0&&y<h&&x>=0&&x<w)arr[y][x]=c;};
  const es=opt.boss?5:(R()<0.5?3:2),gap=opt.boss?3:2,ey=Math.round(h*0.5);
  const xL=half-gap-es,xR=w-xL-es;
  const eye=(x0,left)=>{for(let y=ey-1;y<ey-1+es;y++)for(let x=x0;x<x0+es;x++)set(x,y,WHITE);
    if(es===2)set(left?x0+1:x0,ey,OUT);
    else if(es===3)set(x0+1,ey,OUT);
    else{const px=left?x0+es-3:x0+1;for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]])set(px+dx,ey+dy,OUT);}};
  eye(xL,true);eye(xR,false);
  if(opt.boss){for(let i=0;i<es+1;i++){const y=ey-3+(i>=(es+1)/2?1:0);set(xL-1+i,y,OUT);set(xR+es-i,y,OUT);}}
  const my=ey+es+(opt.boss?2:1),mw=opt.boss?8:4;
  if(my<h-1){for(let x=half-mw;x<half+mw;x++)set(x,my,OUT);set(half-mw+1,my+1,WHITE);set(half+mw-2,my+1,WHITE);
    if(opt.boss){for(let x=half-mw+4;x<half+mw-4;x+=3)set(x,my+1,WHITE);}}
  for(const x of [xL-1,xR+es])if(inner(arr,x,my-1))set(x,my-1,'#ff7fb0');
  if(opt.crown){let t=0;while(t<h&&!arr[t][half])t++;const b=t-1;
    for(let x=half-6;x<half+6;x++){set(x,b,'#e09a00');set(x,b-1,'#ffd23f');if((x-(half-6))%3===0){set(x,b-2,'#ffd23f');set(x,b-3,(x===half-3||x===half+2)?'#ff4f9a':'#fff3a8');}}
    for(let x=half-7;x<half+7;x++)if(!arr[b+1]||!arr[b+1][x])set(x,b+1,OUT);}
  const pix=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(arr[y][x])pix.push({x,y,c:arr[y][x]});
  return {spr:paint(arr,w,h),white:silhouette(arr,w,h,WHITE),dark:silhouette(arr,w,h,'#3b0a1a'),pix,w,h};
}
for(let i=0;i<AREAS.length;i++)AREAS[i].bg=genMonster(AREAS[i].seed,44,32,AREAS[i].hue,{boss:true,crown:i===5});
const STORY_MON=[genMonster(91,20,16,280),genMonster(92,20,16,200),genMonster(93,20,16,330)];

/* ---- planets ---- */
function genPlanet(r,hue,seed,ring,gray){
  const R=mulberry(seed),pad=ring?Math.ceil(r*0.7):1,S=2*r+1+pad*2,c=mkC(S,S),g=c.getContext('2d'),cx=S>>1,cy=S>>1;
  const sat=gray?0:72,cols=gray?['#1c1a24','#2a2834','#393644','#4a4656']:[hsl(hue,sat,20),hsl(hue,sat,36),hsl(hue,sat,52),hsl(hue,sat,70)];
  const freq=0.45+R()*0.5,ph=R()*6,cr=[];for(let i=0;i<3;i++)cr.push([R()*r*1.2-r*0.6,R()*r*1.2-r*0.6,1.5+R()*r*0.25]);
  const ringPx=(back)=>{const rx=r*1.6,ry=r*0.34;for(let i=0;i<120;i++){const a=i/120*Math.PI*2,s=Math.sin(a);if(back?s>0:s<0)continue;
    const x=Math.round(cx+Math.cos(a)*rx),y=Math.round(cy+s*ry);if(!back&&(x-cx)**2+(y-cy)**2<=r*r&&s<0)continue;
    g.fillStyle=gray?'#5a5666':hsl((hue+40)%360,70,72);g.fillRect(x,y,1,1);g.fillStyle=OUT;g.fillRect(x,y+1,1,1);}};
  if(ring)ringPx(true);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;if(d2>r*r)continue;
    if(d2>(r-0.9)*(r-0.9)){g.fillStyle=OUT;g.fillRect(x,y,1,1);continue;}
    const nz=Math.sqrt(1-d2/(r*r));let v=(-dx*0.5-dy*0.6)/r*0.8+nz*0.6+Math.sin(dy*freq+ph)*0.14;
    for(const [ox,oy,rr] of cr)if((dx-ox)**2+(dy-oy)**2<rr*rr)v-=0.22;
    g.fillStyle=cols[v>0.75?3:v>0.45?2:v>0.15?1:0];g.fillRect(x,y,1,1);
  }

function newBoard(){

  while(!ok&&tries<50){
    grid=[];

      let k,g=0;

      const gem=newGem(k);gem.y=r*CELL;grid[r][c]=gem;
    }}

}
function findRuns(){
  const runs=[];
  const kAt=(r,c)=>{const g=grid[r][c];return g&&g.sp<SP.RAIN?g.k:-1;};
  for(let r=0;r<N;r++){let c=0;while(c<N){const k=kAt(r,c);if(k<0){c++;continue;}let e=c+1;while(e<N&&kAt(r,e)===k)e++;if(e-c>=3){const cells=[];for(let x=c;x<e;x++)cells.push([r,x]);runs.push({cells,dir:'h',k});}c=e;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const k=kAt(r,c);if(k<0){r++;continue;}let e=r+1;while(e<N&&kAt(e,c)===k)e++;if(e-r>=3){const cells=[];for(let y=r;y<e;y++)cells.push([y,c]);runs.push({cells,dir:'v',k});}r=e;}}
  return runs;
}
function wouldMatch(r,c){
  const g=grid[r][c];if(!g||g.sp>=SP.RAIN||g.k<0)return false;const k=g.k;
  const same=(rr,cc)=>inB(rr,cc)&&grid[rr][cc]&&grid[rr][cc].sp<SP.RAIN&&grid[rr][cc].k===k;
  let h=1;for(let x=c-1;same(r,x);x--)h++;for(let x=c+1;same(r,x);x++)h++;if(h>=3)return true;
  let v=1;for(let y=r-1;same(y,c);y--)v++;for(let y=r+1;same(y,c);y++)v++;return v>=3;
}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;
    const a=grid[r][c],b=grid[r2][c2];if(!a||!b)continue;
    if(isRain(a)||isRain(b)||(isSG(a)&&isSG(b)))return [r,c,r2,c2];
    grid[r][c]=b;grid[r2][c2]=a;const ok=wouldMatch(r,c)||wouldMatch(r2,c2);grid[r][c]=a;grid[r2][c2]=b;
    if(ok)return [r,c,r2,c2];
  }

}

function shake(a){shakeA=Math.max(shakeA,a*(REDUCE?0.3:1)*(1+0.08*(hype-1)));}
function impact(){if(REDUCE)return;cv.style.filter='invert(1) hue-rotate(180deg)';setTimeout(()=>{cv.style.filter='';},70);}
function addTime(s){time=Math.min(99,time+s);popText('+'+s+'s',W-3,24,'#2fe0b8',800,F8,'r');}
function stealTime(s){time=Math.max(0.5,time-s);popText('-'+s+'s',W-3,24,'#ff2d55',900,F8,'r');sfx.steal();}
function popImg(g){if(g.sp===SP.JUNK)return ISPR.junkW;if(g.sp===SP.CAP)return ISPR.capW;return GSPR[g.k<0?5:g.k].w;}
function hypeUp(){if(hype>=8)return;hype++;hypeFlash=900;sfx.speed();popText('SPEED UP!',W/2,BOSS_BOT-26,'#2fe0b8',900,F8,'c');}
function addFever(v){
  if(state!=='play')return;
  if(feverT>0){feverT=Math.min(10000,feverT+v*12);return;}
  feverG+=v;
  if(feverG>=100){
    feverG=0;feverT=8000;feverCount++;feverStage=Math.min(3,feverCount);
    bigText(FEVER_NAME[feverStage-1],'rainbow',1000,'SCORE x'+FEVER_SC[feverStage-1]);
    impact();flashA=0.7;sfx.fever();vib(40);shake(4+feverStage);hypeUp();
  }
}
function addSuper(v){
  if(state!=='play'||superT>0)return;
  superG=Math.min(100,superG+v*(feverT>0?1.5:1));
  if(superG>=100&&!superAnnounced){superAnnounced=true;sfx.superReady();popText('必殺OK!',W/2,SUPY-8,'#ffd23f',900,FJ,'c',1);}
}

      atkT:0,atkI:Math.max(5200,9000-battle.ai*500),tele:0,spT:0,spI:Math.max(11000,18000-battle.ai*1000)};
  }
  const g=genMonster((Math.random()*1e9)|0,20,16,(A.hue+((Math.random()*80)|0)-40+360)%360);
  const xs=n===1?[64]:n===2?[40,88]:[22,64,106],mx=Math.round(45*dm);
  return {kind,g,w:20,h:16,cx:xs[i],hp:mx,max:mx,ghost:mx,gw:0,flash:0,enterT:-i*160,dead:false,deadT:0,lastPop:null,

function enemyPos(e){return {x:Math.round(e.cx-e.w/2),y:GY()-e.h};}
const alive=()=>battle?battle.en.filter(e=>!e.dead):[];
function getTarget(){
  if(!battle)return null;const en=battle.en,t=en[battle.tgt];
  if(t&&!t.dead&&t.enterT>=0)return t;
  for(let i=0;i<en.length;i++)if(!en[i].dead&&en[i].enterT>=0){battle.tgt=i;return en[i];}
  return null;
}
function nextWave(){
  const B=battle;B.wi++;B.en=[];B.tgt=0;
  const w=B.waves[B.wi];
  if(w==='B'){B.introT=2000;sfx.alarm();playBgm('boss');for(let i=texts.length-1;i>=0;i--)if(texts[i].kind==='big')texts.splice(i,1);}

function enemyHit(e,dmg,x,y){

function throwJunkFrom(e,n){

  const p=enemyPos(e);
  for(let i=0;i<n&&cand.length;i++){const j=(Math.random()*cand.length)|0,[r,c]=cand.splice(j,1)[0];jprojs.push({x0:e.cx,y0:p.y+e.h/2,r,c,t:-i*90,d:420});}

function landJunk(j){

function toJunk(r,c){const g=grid[r][c];if(g&&g.sp===SP.NONE){g.k=-1;g.sp=SP.JUNK;fxs.push({type:'pop',x:BX+c*CELL+1,y:BY+r*CELL+1,img:ISPR.junkW,t:-((r+c)*10),d:130});}}
function applyBossSpecial(fx){
  const rr=()=>(Math.random()*N)|0;
  const scatter=n=>{const cand=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c].sp===SP.NONE)cand.push([r,c]);for(let i=0;i<n&&cand.length;i++){const [r,c]=cand.splice((Math.random()*cand.length)|0,1)[0];toJunk(r,c);}};
  if(fx==='row'){const r=rr();for(let c=0;c<N;c++)toJunk(r,c);fxs.push({type:'dbeamH',v:r,t:0,d:400});}
  else if(fx==='steal'){stealTime(5);scatter(2);}

  else if(fx==='shuffle'){shuffleBoard();scatter(3);}
  else if(fx==='col'){const c=rr();for(let r=0;r<N;r++)toJunk(r,c);fxs.push({type:'dbeamV',v:c,t:0,d:400});stealTime(3);}
  else if(fx==='king'){const r=rr(),c=rr();for(let x=0;x<N;x++)toJunk(r,x);for(let y=0;y<N;y++)toJunk(y,c);fxs.push({type:'dbeamH',v:r,t:0,d:400},{type:'dbeamV',v:c,t:0,d:400});stealTime(5);}
  sfx.thud();sfx.bomb();shake(7);vib(60);

function updEnemies(dt){
  const B=battle;if(!B)return;
  const can=readyT<=0&&superT===0&&!B.cut&&B.introT<=0&&!B.winT&&!B.waveT&&time>0;
  for(const e of B.en){
    const pe=e.enterT;e.enterT+=dt;
    if(e.kind==='boss'&&pe<380&&e.enterT>=380){shake(8);sfx.thud();sfx.bomb();burst(e.cx,GY(),['#8a7aa8','#c3b6dc',WHITE],24,0.1,500,2);}
    e.flash-=dt;e.gw-=dt;
    if(e.gw<=0&&e.ghost>e.hp)e.ghost=Math.max(e.hp,e.ghost-(e.max*0.0016+(e.ghost-e.hp)*0.006)*dt);
    if(e.dead){e.deadT+=dt;continue;}
    if(!can||e.enterT<380||dt===0)continue;
    if(e.tele>0){e.tele-=dt;if(e.tele<=0){throwJunkFrom(e,e.kind==='boss'?Math.min(4,2+Math.floor(B.ai/2)):1);e.atkT=0;}}
    else{e.atkT+=dt;if(e.atkT>e.atkI){e.tele=800;sfx.warn();}}
    if(e.kind==='boss'){e.spT+=dt;if(e.spT>e.spI&&!B.cutPending){e.spT=0;B.cutPending=true;}}
  }
}

function area(g,r,c){
  const out=[];
  if(g.sp===SP.H){for(let x=0;x<N;x++)out.push(r*N+x);fxs.push({type:'beamH',v:r,t:0,d:240,col:GEMS[g.k].b});sfx.line();}
  else if(g.sp===SP.V){for(let y=0;y<N;y++)out.push(y*N+c);fxs.push({type:'beamV',v:c,t:0,d:240,col:GEMS[g.k].b});sfx.line();}
  else if(g.sp===SP.BOMB){for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(inB(y,x))out.push(y*N+x);fxs.push({type:'ring',x:cellCX(c),y:cellCY(r),t:0,d:300,r:24,col:GEMS[g.k].b});sfx.bomb();shake(4);vib(25);}
  else if(g.sp===SP.RAIN){
    const k=commonK();
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const q=grid[y][x];if(q&&q.sp<SP.RAIN&&q.k===k){out.push(y*N+x);fxs.push({type:'bolt',x0:cellCX(c),y0:cellCY(r),x1:cellCX(x),y1:cellCY(y),t:0,d:260});}}
    sfx.rain();
  }
  return out;
}
function commonK(){const cnt=[0,0,0,0,0,0];for(let y=0;y<N;y++)for(let x=0;x<N;x++){const q=grid[y][x];if(q&&q.sp<SP.RAIN&&q.k>=0)cnt[q.k]++;}return cnt.indexOf(Math.max(...cnt));}
const GACHA=[['ビーム!',30],['バクダン!',26],['ニジダマ!!',12],['+3秒!',12],['脳汁+30',10],['必殺+40',10]];
function rollGacha(r,c,creates){
  let tot=0;for(const g of GACHA)tot+=g[1];let x=Math.random()*tot,i=0;for(;i<GACHA.length;i++){x-=GACHA[i][1];if(x<0)break;}
  if(i>=GACHA.length)i=0;
  if(i===0)creates.push({r,c,k:rndK(),sp:Math.random()<0.5?SP.H:SP.V});
  else if(i===1)creates.push({r,c,k:rndK(),sp:SP.BOMB});
  else if(i===2)creates.push({r,c,k:-1,sp:SP.RAIN});
  else if(i===3)addTime(3);
  else if(i===4)addFever(30);
  else addSuper(40);
  popText(GACHA[i][0],cellCX(c),cellCY(r)-12,'#ffd23f',800,FJ,'c',1);
  fxs.push({type:'ring',x:cellCX(c),y:cellCY(r),t:0,d:300,r:16,col:'#ff4f9a'});
  sfx.gacha();
}
function executeClear(set,trig,creates){
  const q=[...set];
  while(q.length){const key=q.pop(),r=(key/N)|0,c=key%N,g=grid[r][c];if(!g||!isSG(g)||trig.has(key))continue;trig.add(key);for(const k2 of area(g,r,c))if(!set.has(k2)){set.add(k2);q.push(k2);}}
  const fev=feverT>0, st=feverStage-1, cm=comboMult();
  const mult=cm*(fev?FEVER_DMG[st]:1), dmg=Math.max(1,Math.round(7*mult*(trig.size?1.25:1)*(1+0.08*(hype-1))));
  let n=0,sx=0,sy=0,i=0,junk=0;
  const pspd=spd();
  for(const key of set){
    const r=(key/N)|0,c=key%N,g=grid[r][c];if(!g)continue;
    const x=cellCX(c),y=cellCY(r);
    fxs.push({type:'pop',x:x-6,y:y-6+Math.round(g.oy),img:popImg(g),t:0,d:130});
    if(isItem(g)){
      if(g.sp===SP.CLOCK){addTime(2);burst(x,y,['#2fe0b8','#b5ffe9',WHITE],10,0.09,500);sfx.clock();}
      else if(g.sp===SP.CAP){burst(x,y,['#ff4f9a',WHITE,'#a35cff'],12,0.1,500);rollGacha(r,c,creates);}
      else{junk++;burst(x,y,['#8a7aa8','#c3b6dc','#5a4a78'],10,0.1,500,2);burst(x,y,['#ffd23f','#fff3a8'],8,0.12,700,1,0.0004);}
      grid[r][c]=null;continue;
    }
    n++;sx+=x;sy+=y;
    const k=g.k<0?5:g.k, G=GEMS[k];
    burst(x,y,g.k<0?[RAINCOL[0],RAINCOL[4],RAINCOL[8],WHITE]:[G.b,G.h,WHITE],fev?9+feverStage*2:6,0.09,480);
    projs.push({x0:x,y0:y,cx:x+(Math.random()*90-45),cy:Math.min(y,60)-10-Math.random()*40,x1:0,y1:0,t:-i*Math.max(3,9/pspd),d:(240+Math.random()*160)/pspd,c:g.k<0?WHITE:G.b,dmg,tr:[],e:null,jx:(Math.random()*2-1),jy:(Math.random()*2-1)});
    i++;grid[r][c]=null;
  }
  for(const cr of creates){const g=newGem(cr.k,cr.sp);g.y=cr.r*CELL;grid[cr.r][cr.c]=g;fxs.push({type:'ring',x:cellCX(cr.c),y:cellCY(cr.r),t:0,d:220,r:10,col:WHITE});}
  if(creates.length)sfx.make();
  if(junk){score+=150*junk*hype;popText('破壊!',n?sx/n:W/2,(n?sy/n:BY+56)-14,'#c3b6dc',600,FJ,'c',1);sfx.crush();addSuper(5*junk);addFever(4*junk);}
  if(n){
    const pts=Math.round(n*10*cm*(fev?FEVER_SC[st]:1)*(n>=10?1.5:1)*(1+0.1*(hype-1)));score+=pts;
    popText('+'+pts,sx/n,sy/n-4,'#fff3a8',520,F8,'c');
    addFever(n*1.5+trig.size*4);
    addSuper(n*0.6+trig.size*6+(combo>1?3:0));
    if(n>=6||trig.size){stopT=Math.max(stopT,40+Math.min(80,n*2));shake(Math.min(7,1+n/6));}
    if(n>=24||(fev&&feverStage>=3&&combo>=2)){impact();flashA=Math.max(flashA,0.45);vib(50);}else if(n>=8)vib(15);
  }
  gravity();phase='fall';settle=0;
}
const WORDS=[null,null,'ナイス!','グレイト!','スーパー!!','ドパッ!!','ドパドパ!!','脳汁!!','脳汁MAX!!','ドパガキ!!'];
const WCOL=['#ffd23f','#ffd23f','#2fe0b8','#ffd23f','#4d7cff','#ff4f9a','#ff8a3d','#a35cff','rainbow','rainbow'];
function resolve(focus){
  const runs=findRuns();
  if(!runs.length){
    if(combo>=4)addTime(Math.round((combo-3)*0.5*10)/10);
    combo=0;phase='idle';idleT=0;hint=null;
    if(!findMove())shuffleBoard();
    return;
  }
  combo++;if(combo>maxCombo)maxCombo=combo;
  if(combo>=2){const w=combo<WORDS.length?WORDS[combo]:combo+'連鎖!!';bigText(w,combo<WCOL.length?WCOL[combo]:'rainbow',720,combo+' COMBO');}
  const focusKey=new Set((focus||[]).map(([r,c])=>r*N+c));
  const set=new Set(),cellRuns=new Map(),used=new Set(),creates=new Map();
  for(const run of runs)for(const [r,c] of run.cells){const k=r*N+c;set.add(k);if(!cellRuns.has(k))cellRuns.set(k,[]);cellRuns.get(k).push(run);}
  for(const k of [...set]){const r=(k/N)|0,c=k%N;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const rr=r+dr,cc=c+dc;if(inB(rr,cc)&&isItem(grid[rr][cc]))set.add(rr*N+cc);}}
  const pick=run=>{for(const [r,c] of run.cells)if(focusKey.has(r*N+c))return [r,c];return run.cells[run.cells.length>>1];};
  for(const run of runs)if(run.cells.length>=5){const [r,c]=pick(run);creates.set(r*N+c,{r,c,k:-1,sp:SP.RAIN});used.add(run);}
  for(const [k,rs] of cellRuns){if(rs.length<2)continue;const h=rs.find(x=>x.dir==='h'),v=rs.find(x=>x.dir==='v');if(!h||!v||used.has(h)||used.has(v))continue;const r=(k/N)|0,c=k%N;if(!creates.has(k))creates.set(k,{r,c,k:h.k,sp:SP.BOMB});used.add(h);used.add(v);}
  for(const run of runs)if(!used.has(run)&&run.cells.length===4){const [r,c]=pick(run);const k=r*N+c;if(!creates.has(k))creates.set(k,{r,c,k:run.k,sp:run.dir==='h'?SP.H:SP.V});used.add(run);}
  sfx.match(combo,set.size);
  executeClear(set,new Set(),[...creates.values()]);
}
function specialSwap(r,c,r2,c2){
  const A=grid[r][c],B=grid[r2][c2],ka=r*N+c,kb=r2*N+c2,set=new Set(),trig=new Set();
  combo=1;
  if(isRain(A)&&isRain(B)){
    trig.add(ka);trig.add(kb);
    for(let k=0;k<N*N;k++){set.add(k);if(k%3===0)fxs.push({type:'bolt',x0:cellCX(c),y0:cellCY(r),x1:cellCX(k%N),y1:cellCY((k/N)|0),t:0,d:320});}
    bigText('ぜんけし!!','rainbow',900,'ALL CLEAR');impact();flashA=0.9;sfx.rain();sfx.bomb();shake(8);vib([40,30,80]);
  }else if(isRain(A)||isRain(B)){
    const [rk,rr,rc,O,ok]=isRain(A)?[ka,r,c,B,kb]:[kb,r2,c2,A,ka];
    trig.add(rk);set.add(rk);set.add(ok);
    const k=O.k>=0?O.k:commonK(), conv=isSG(O);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const g=grid[y][x];if(g&&g.sp<SP.RAIN&&g.k===k){
      if(conv&&g!==O)g.sp=O.sp===SP.BOMB?SP.BOMB:(Math.random()<0.5?SP.H:SP.V);
      set.add(y*N+x);fxs.push({type:'bolt',x0:cellCX(rc),y0:cellCY(rr),x1:cellCX(x),y1:cellCY(y),t:0,d:300});}}
    bigText(conv?'ニジダマ乱舞':'ニジダマ!!','rainbow',800,conv?'MEGA RAINBOW':'RAINBOW');sfx.rain();impact();flashA=0.5;shake(5);vib(40);
  }else{
    trig.add(ka);trig.add(kb);set.add(ka);set.add(kb);
    const isL=s=>s===SP.H||s===SP.V;
    if(isL(A.sp)&&isL(B.sp)){
      for(let x=0;x<N;x++)set.add(r*N+x);for(let y=0;y<N;y++)set.add(y*N+c);
      fxs.push({type:'beamH',v:r,t:0,d:300,col:GEMS[A.k].b},{type:'beamV',v:c,t:0,d:300,col:GEMS[B.k].b});
      bigText('クロスビーム','#2fe0b8',720,'CROSS');sfx.line();shake(5);
    }else if(A.sp===SP.BOMB&&B.sp===SP.BOMB){
      for(let y=r-2;y<=r+2;y++)for(let x=c-2;x<=c+2;x++)if(inB(y,x))set.add(y*N+x);
      fxs.push({type:'ring',x:cellCX(c),y:cellCY(r),t:0,d:420,r:44,col:'#ff8a3d'});
      bigText('メガバクハツ','#ff8a3d',720,'BIG BOMB');sfx.bomb();sfx.bomb();shake(8);impact();vib(60);
    }else{
      for(let d=-1;d<=1;d++){if(inB(r+d,0)){for(let x=0;x<N;x++)set.add((r+d)*N+x);fxs.push({type:'beamH',v:r+d,t:0,d:320,col:'#ffd23f'});}
        if(inB(0,c+d)){for(let y=0;y<N;y++)set.add(y*N+c+d);fxs.push({type:'beamV',v:c+d,t:0,d:320,col:'#ffd23f'});}}
      bigText('ギガクロス','#ffd23f',720,'MEGA CROSS');sfx.line();sfx.bomb();shake(8);impact();vib(60);
    }
  }

function inputLocked(){return state!=='play'||readyT>0||time<=0||superT>0||!battle||battle.cut||battle.introT>0||battle.winT>0||battle.waveT>0;}
function trySwap(r1,c1,r2,c2){
  if(phase!=='idle'||inputLocked())return;
  if(!inB(r1,c1)||!inB(r2,c2))return;
  phase='swap';sw={r1,c1,r2,c2,t:0,dur:85/spd(),back:false};sfx.swap();idleT=0;hint=null;sel=null;
}
const easeOutBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function afterSwap(){
  if(sw.back){phase='idle';return;}
  const moved=grid[sw.r2][sw.c2],other=grid[sw.r1][sw.c1];
  if(isRain(moved)||isRain(other)||(isSG(moved)&&isSG(other))){specialSwap(sw.r2,sw.c2,sw.r1,sw.c1);return;}
  if(findRuns().length){combo=0;resolve([[sw.r2,sw.c2],[sw.r1,sw.c1]]);}
  else{sfx.bad();shake(1.5);sw={r1:sw.r1,c1:sw.c1,r2:sw.r2,c2:sw.c2,t:0,dur:110/spd(),back:true};}
}
function updBoard(dt){
  if(phase==='swap'&&sw){
    sw.t+=dt;const p=Math.min(1,sw.t/sw.dur),e=easeOutBack(p);
    const a=grid[sw.r1][sw.c1],b=grid[sw.r2][sw.c2],dx=(sw.c2-sw.c1)*CELL,dy=(sw.r2-sw.r1)*CELL;
    a.ox=dx*e;a.oy=dy*e;b.ox=-dx*e;b.oy=-dy*e;
    if(p>=1){a.ox=a.oy=b.ox=b.oy=0;grid[sw.r1][sw.c1]=b;grid[sw.r2][sw.c2]=a;afterSwap();}
  }
  const s=spd(),acc=0.0042*s*s,vmax=0.95*s;
  let moving=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const g=grid[r][c];if(!g)continue;if(g.land>0)g.land-=dt;
    const ty=r*CELL;
    if(g.y<ty){g.vy=Math.min(vmax,g.vy+acc*dt);g.y+=g.vy*dt;if(g.y>=ty){g.y=ty;if(g.vy>0.15)g.land=90;g.vy=0;}else moving=true;}
    else if(g.y>ty)g.y=ty;
  }
  if(phase==='fall'&&!moving){settle+=dt;if(settle>=35/s){settle=0;resolve(null);}}
}

function update(dt){
  T+=dt;

  if(hypeFlash>0)hypeFlash-=dt;
  if(state==='play')updPlay(dt);
  else{
    if(state==='story')updStory(dt);
    if(state==='map'&&mapS.unlock>=0&&mapS.ut<1700){const p=mapS.ut;mapS.ut+=dt;if(p<1150&&mapS.ut>=1150){const pp=planetPos(mapS.unlock);sfx.unlock();fxs.push({type:'ring',x:pp.x,y:pp.y,t:0,d:500,r:30,col:'#ffd23f'});burst(pp.x,pp.y,[WHITE,'#ffd23f','#ff4f9a'],30,0.12,700,1,0.0001);popText('NEW STAR!',pp.x,pp.y-AREAS[mapS.unlock].r-16,'#ffd23f',1400,F8,'c',1);}}
    if(state==='result')overT+=dt;
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.m+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.m>p.l)parts.splice(i,1);}
  }
  for(let i=fxs.length-1;i>=0;i--){fxs[i].t+=dt;if(fxs[i].t>fxs[i].d)fxs.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;if(t.t>t.d)texts.splice(i,1);}
  shakeA=Math.max(0,shakeA-dt*0.02);flashA=Math.max(0,flashA-dt*0.004);
  const fs=(feverT>0?3.5:1)*(1+0.25*(hype-1));
  for(const s of stars){s.x-=s.s*dt*(state==='play'?fs:0.3);if(s.x<0){s.x+=W;s.y=Math.random();}}
  if(result&&state==='result'&&overT>700&&result.disp<result.final){result.disp=Math.min(result.final,result.disp+Math.max(10,(result.final-result.base)*dt/700));}
}
function updPlay(dt){
  const B=battle;
  let frozen=false;
  if(superT>0){const prev=superT;superT+=dt;if(prev<700&&superT>=700)superFire();if(superT<700)frozen=true;if(superT>1250)superT=0;}
  if(B.introT>0){B.introT-=dt;frozen=true;if(B.introT<=0){B.introT=0;B.en=[makeEnemy('boss',0,1)];B.tgt=0;bigText(AREAS[B.ai].boss,'#ff2d55',900,'BOSS BATTLE');}}
  if(B.cut){B.cut.t+=dt;frozen=true;if(B.cut.t>=B.cut.d){const fx=B.cut.fx;B.cut=null;applyBossSpecial(fx);}}
  else if(B.cutPending&&phase==='idle'&&superT===0&&!B.winT&&readyT<=0){B.cutPending=false;B.cut={t:0,d:1300,fx:AREAS[B.ai].fx};sfx.bosscut();vib(30);sel=null;for(let i=texts.length-1;i>=0;i--)if(texts[i].kind==='big')texts.splice(i,1);}
  if(B.waveT>0){B.waveT-=dt;if(B.waveT<=0){B.waveT=0;nextWave();}}
  if(B.winT>0){B.winT-=dt;if(B.winT<=0){B.winT=0;finishBattle(true);return;}}
  if(readyT>0){const prev=readyT;readyT-=dt;if(prev>500&&readyT<=500)sfx.go();}
  else if(time>0&&!frozen&&!B.winT&&!B.waveT){
    time-=dt/1000;if(time<0)time=0;

  }

  if(feverT>0&&feverStage>=3&&Math.random()<dt*0.02)parts.push({x:Math.random()*W,y:18,vx:0,vy:0.05+Math.random()*0.05,l:1600,m:0,c:RAINCOL[(Math.random()*12)|0],s:1,g:0.00005});
  if(superQueued&&phase==='idle')fireSuper();
  if(time<=0&&phase==='idle'&&readyT<=0&&superT===0&&!B.winT&&!B.cut&&B.introT<=0){finishBattle(false);return;}

    else if(!p.x1){projs.splice(i,1);continue;}

    const x=iu*iu*p.x0+2*iu*e*p.cx+e*e*p.x1,y=iu*iu*p.y0+2*iu*e*p.cy+e*e*p.y1;

  }

  updEnemies(frozen?0:dt);
  if(disp<score){disp+=Math.max(1,(score-disp)*Math.min(1,dt*0.012));if(disp>score)disp=score;}else disp=score;
}

function toL(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function cellAt(p){const c=Math.floor((p.x-BX)/CELL),r=Math.floor((p.y-BY)/CELL);return inB(r,c)?{r,c}:null;}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x-3&&p.x<=b.x+b.w+3&&p.y>=b.y-3&&p.y<=b.y+b.h+3){b.fn();return true;}}return false;}
function onTitleTap(){sfx.select();if(!save.op)go(()=>startStory(OP,()=>{save.op=true;writeSave();enterMap();}));else go(enterMap);}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  if(trans)return;
  const p=toL(e);
  if(hitBtn(p))return;
  if(state==='title'){onTitleTap();return;}
  if(state==='story'){storyAdvance();return;}
  if(state==='map'){
    if(mapS.unlock>=0&&mapS.ut<1150){mapS.ut=1149;return;}
    for(let i=0;i<6;i++){const pp=planetPos(i),r=AREAS[i].r+7;if((p.x-pp.x)**2+(p.y-pp.y)**2<=r*r){
      if(i<=save.cleared){sfx.select();go(()=>enterDetail(i));}else{sfx.bad();popText('ロック中',pp.x,pp.y-AREAS[i].r-8,'#b8caff',700,FJ,'c');}return;}}
    return;
  }
  if(state!=='play')return;
  if(p.x>=108&&p.y>=17&&p.y<=29){setMute(!muted);return;}
  if(p.y>=SUPY-2){fireSuper();return;}
  if(p.y>36&&p.y<BOSS_BOT&&battle){const al=battle.en;for(let i=0;i<al.length;i++){const en=al[i];if(en.dead)continue;if(Math.abs(p.x-en.cx)<=en.w/2+4){battle.tgt=i;sfx.select();return;}}}
  const c=cellAt(p);
  if(c){drag={r:c.r,c:c.c,x:p.x,y:p.y,moved:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.moved)return;const p=toL(e),dx=p.x-drag.x,dy=p.y-drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>4.5){
    drag.moved=true;
    if(Math.abs(dx)>Math.abs(dy))trySwap(drag.r,drag.c,drag.r,drag.c+(dx>0?1:-1));
    else trySwap(drag.r,drag.c,drag.r+(dy>0?1:-1),drag.c);
  }
});
cv.addEventListener('pointerup',()=>{
  if(drag&&!drag.moved&&state==='play'&&!inputLocked()){
    if(sel&&Math.abs(sel.r-drag.r)+Math.abs(sel.c-drag.c)===1){trySwap(sel.r,sel.c,drag.r,drag.c);sel=null;}
    else if(sel&&sel.r===drag.r&&sel.c===drag.c)sel=null;
    else sel={r:drag.r,c:drag.c};
  }
  drag=null;
});
cv.addEventListener('pointercancel',()=>{drag=null;});
window.addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){setMute(!muted);return;}
  if(e.key==='s'||e.key==='S'){fireSuper();return;}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();audioInit();if(trans)return;
    if(state==='title')onTitleTap();else if(state==='story')storyAdvance();
    else if((state==='result'||state==='detail')&&btns.length)btns[btns.length-1].fn();}
});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= BOOT ================= */
loadSave();fit();newBoard();
if(document.fonts&&document.fonts.load){
  Promise.race([Promise.all([document.fonts.load(FJ,'0123ABCxyz'),document.fonts.load(FJ,'ドパガキ脳汁連鎖超砲極撃破星周目')]),new Promise(r=>setTimeout(r,2500))]).then(()=>tcache.clear());
  document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>tcache.clear());
}
let last=performance.now();
function frame(now){let dt=now-last;last=now;if(dt>50)dt=50;if(dt<0)dt=0;if(!document.hidden)update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
