:root{--bg:#07090f;--ink:#f4f1ea;--red:#ff2d36;--yel:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:500}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 22px calc(env(safe-area-inset-bottom,0px) + 26px);opacity:0;pointer-events:none;transition:opacity .35s;text-align:center}
.scr.on{opacity:1}
.scr.on .btn{pointer-events:auto}
.lab{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.32em;text-indent:.32em;opacity:.75}
.ttl{font-family:'ColaLogo','Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(34px,11.6vw,76px);letter-spacing:-.03em;white-space:nowrap;line-height:1.08;margin-top:14px;transform:skewX(-9deg);position:relative}
.sub{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:24px;letter-spacing:.34em;text-indent:.34em;color:var(--red);margin-top:10px}
.bt{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.note,.hint{font-size:13px;line-height:1.7;opacity:.8;letter-spacing:.06em}
.best{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:.18em;text-indent:.18em;color:var(--yel);min-height:24px}
.btn{width:100%;max-width:380px;height:58px;border:2px solid var(--ink);background:var(--ink);color:#07090f;font:900 17px 'Noto Sans JP',sans-serif;letter-spacing:.2em;text-indent:.2em;border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;touch-action:manipulation}
.btn{transform:skewX(-9deg);box-shadow:5px 5px 0 #9b968c;transition:transform .06s,box-shadow .06s}
.btn>*{transform:skewX(9deg)}
.btn:active{transform:skewX(-9deg) translate(4px,4px);box-shadow:1px 1px 0 #9b968c}
.btn.red{box-shadow:6px 6px 0 #8a0d14}.btn.red:active{box-shadow:1px 1px 0 #8a0d14}
.btn.ghost{box-shadow:5px 5px 0 rgba(244,241,234,.35)}.btn.ghost:active{box-shadow:1px 1px 0 rgba(244,241,234,.35)}
#bOpen{visibility:hidden}
#bStart{height:58px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.32em;text-indent:.32em;max-width:330px}
#bOpen,#bNow{height:58px;font-size:22px;letter-spacing:.32em;text-indent:.32em;max-width:330px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;height:70px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:.34em;text-indent:.34em}
/* play */
.topl{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:6px}
.small{font-size:11px;letter-spacing:.14em;opacity:.6}

<script>
const PUB=/(^|\.)uimemocho\.github\.io$/.test(location.hostname);
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- formatting / ranks ---------- */
function jp(x){return x>=10?Math.round(x).toLocaleString('ja-JP'):x.toFixed(1)}
function fmtAlt(m){
  if(m<1000) return (m<10?m.toFixed(1):Math.round(m))+' m';
  const km=m/1000, ly=m/9.4607e15;
  if(km<10000) return Math.round(km).toLocaleString('ja-JP')+' km';
  if(km<1e8) return jp(km/1e4)+'万 km';
  if(km<1e12 && ly<0.1) return jp(km/1e8)+'億 km';
  if(ly<1) return ly.toFixed(2)+' 光年';
  if(ly<1e4) return (ly<10?ly.toFixed(1):Math.round(ly).toLocaleString('ja-JP'))+' 光年';
  if(ly<1e8) return jp(ly/1e4)+'万 光年';

}
const RANKS=[
  [1.0,'E','気の抜けたコーラ','#9aa3b2'],

];
const rankOf=L=>RANKS.find(r=>L<r[0]);
const Lof=P=>-0.3+27.2*Math.pow(P,6);
const SCALE=6;
const Yof=L=>0.9+SCALE*(L+0.3);
const LM=[
  [2.52,'東京タワー','333 m'],[3.58,'富士山','3,776 m'],[4.0,'旅客機の高度','10 km'],
  [4.7,'成層圏','50 km'],[5.0,'宇宙の入口','100 km'],[5.6,'ISS','400 km'],
  [7.556,'静止衛星','36,000 km'],[8.58,'月','384,400 km'],[11.18,'太陽','1.5億 km'],
  [12.65,'海王星','45億 km'],[13.26,'太陽系の果て','180億 km'],[16.6,'ケンタウルス座α星','4.2 光年'],
  [20.39,'天の川の中心','2.6万 光年'],[22.38,'アンドロメダ銀河','250万 光年'],
  [23.7,'おとめ座銀河団','5,400万 光年'],[26.9,'観測可能な宇宙の果て','930億 光年']

/* ---------- audio ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function noise(dur,o){
  const a=ac();if(!a)return;o=o||{};
  const n=Math.max(1,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type=o.type||'bandpass';
  const t=a.currentTime;f.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  f.Q.value=o.q||1;
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(o.g||.3,t+(o.atk||.005));
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);
}
function tone(f0,f1,dur,gv,type){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(gv,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

function drawLabel(){
  const g=labelCv.getContext('2d'),W=labelCv.width,H=labelCv.height,r=seeded(7);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#e8202a');gr.addColorStop(.5,'#d10f1b');gr.addColorStop(1,'#8e0a12');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.09)';
  for(let i=0;i<150;i++){const x=r()*W,y=r()*H,rr=3+r()*r()*28;[x-W,x,x+W].forEach(xx=>{g.beginPath();g.arc(xx,y,rr,0,Math.PI*2);g.fill();});}
  /* halftone strip */
  g.fillStyle='rgba(0,0,0,.22)';
  {const st=W/Math.round(W/14);let row=0;for(let y=H*.80;y<H*.97;y+=14,row++)for(let x=(row%2)*st/2;x<W+st;x+=st){g.beginPath();g.arc(x%W,y,2.6,0,6.283);g.fill();if(x%W<3){g.beginPath();g.arc(x%W+W,y,2.6,0,6.283);g.fill();}if(x%W>W-3){g.beginPath();g.arc(x%W-W,y,2.6,0,6.283);g.fill();}}}
  /* tapered swoosh: zero thickness at both texture edges so the wrap seam never shows a cut */
  /* periodic swoosh: fully continuous across the wrap seam (no cut, no hard end) */
  const sw=(off,th,col)=>{const N=240,top=[],bot=[];
    for(let i=0;i<=N;i++){const t=i/N,x=t*W,w=.8+.2*Math.cos(4*Math.PI*t),cy=(.545-.035*Math.sin(4*Math.PI*t))*H;
      const o=off*H*(.5+.5*w),h=th*H*w*.5;top.push([x,cy+o-h]);bot.push([x,cy+o+h]);}
    g.fillStyle=col;g.beginPath();g.moveTo(top[0][0],top[0][1]);top.forEach(p=>g.lineTo(p[0],p[1]));for(let i=bot.length-1;i>=0;i--)g.lineTo(bot[i][0],bot[i][1]);g.closePath();g.fill();};
  sw(0,.19,'#0b0d12');
  sw(.12,.018,'#f4f1ea');
  sw(.145,.009,'#e6b94a');
  g.textAlign='center';g.textBaseline='middle';
  /* top marquee: evenly repeated so it tiles across the wrap seam */
  {g.font='600 34px "Barlow Condensed",sans-serif';g.fillStyle='rgba(244,241,234,.85)';if('letterSpacing' in g)g.letterSpacing='10px';
   const tx='SHAKE IT  ·  OPEN IT  ·  SEND IT  ·',tw=g.measureText(tx).width,n=Math.max(1,Math.floor(W/(tw+30))),seg=W/n;
   for(let k=-1;k<=n;k++)g.fillText(tx,seg*k+seg/2,H*.075);if('letterSpacing' in g)g.letterSpacing='0px';}
  [W*.5,0,W].forEach(x=>{
    g.fillStyle='rgba(0,0,0,.35)';g.font='800 italic 250px "Barlow Condensed",Impact,sans-serif';g.fillText('COLA',x+8,H*.32+8);
    g.fillStyle='#fff';g.fillText('COLA',x,H*.32);
    g.fillStyle='#f4f1ea';g.font='800 italic 120px "Barlow Condensed",Impact,sans-serif';
    if('letterSpacing' in g)g.letterSpacing='28px';
    g.fillText('SHAKE',x,H*.56);
    if('letterSpacing' in g)g.letterSpacing='10px';
    g.font='600 52px "Barlow Condensed",sans-serif';g.fillStyle='#f4f1ea';
    g.fillText('350 ml',x,H*.90);

    if('letterSpacing' in g)g.letterSpacing='0px';
  });
}

function facade(){

  g.fillStyle='#2b303b';g.fillRect(0,0,W,H);ge.fillStyle='#000';ge.fillRect(0,0,W,H);
  for(let row=0;row<6;row++)for(let col=0;col<4;col++){
    const x=col*128,y=row*128,lit=r()<.34,wx=x+12,wy=y+16,ww=104,wh=84;
    g.fillStyle='#3a404d';g.fillRect(x,y,128,128);
    let gl=g.createLinearGradient(0,wy,0,wy+wh);gl.addColorStop(0,'#5b6c8a');gl.addColorStop(1,'#1c2331');g.fillStyle=gl;g.fillRect(wx,wy,ww,wh);
    if(lit){
      const warm=r()<.7,c0=warm?'#ffd08a':'#cfe6ff',c1=warm?'#ffb866':'#9cc4ff';
      gl=g.createLinearGradient(0,wy,0,wy+wh);gl.addColorStop(0,c0);gl.addColorStop(1,c1);g.fillStyle=gl;g.fillRect(wx,wy,ww,wh);
      const ee=ge.createLinearGradient(0,wy,0,wy+wh);ee.addColorStop(0,c0);ee.addColorStop(1,c1);ge.fillStyle=ee;ge.fillRect(wx,wy,ww,wh);
      const cur=r()*46;g.fillStyle='rgba(20,15,10,.4)';g.fillRect(wx,wy,ww,cur);ge.fillStyle='rgba(0,0,0,.55)';ge.fillRect(wx,wy,ww,cur);
