<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c0c0b">
<meta name="description" content="60mのトイレットペーパーを坂で転がし、紙を使い切ったらゴールの3Dタイムアタック。地下駐車場・石畳・雨上がり・工事中の4ステージ。押しすぎると破れ、勢いがないと穴に落ちる。CPU戦とオンライン対戦つき。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="uimemocho">
<meta property="og:title" content="紙走">
<meta property="og:description" content="60mのトイレットペーパーを坂で転がし、紙を使い切ったらゴールの3Dタイムアタック。地下駐車場・石畳・雨上がり・工事中の4ステージ。押しすぎると破れ、勢いがないと穴に落ちる。CPU戦とオンライン対戦つき。">
<meta property="og:url" content="https://uimemocho.github.io/apps/paper-run/">
<meta property="og:image" content="https://uimemocho.github.io/apps/paper-run/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="紙走">
<meta name="twitter:description" content="60mのトイレットペーパーを坂で転がし、紙を使い切ったらゴールの3Dタイムアタック。地下駐車場・石畳・雨上がり・工事中の4ステージ。押しすぎると破れ、勢いがないと穴に落ちる。CPU戦とオンライン対戦つき。">
<meta name="twitter:image" content="https://uimemocho.github.io/apps/paper-run/ogp.png">
<title>紙走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: full-bleed 3D parking-garage ramp; UI floats like stencil paint over the concrete */
:root{
  --ink:#0c0c0b;
  --slab:rgba(14,14,13,.86);
  --bone:#efeae0;
  --ash:#948f86;
  --line:rgba(239,234,224,.18);
  --blood:#d4372b;
  --sodium:#f0b54a;
  --p1:#6d9be0;
  --p2:#d23b32;
  --f-disp:'Dela Gothic One','Hiragino Kaku Gothic StdN','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-num:'Oswald','Arial Narrow',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:5;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scr>.inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
#title{background:radial-gradient(ellipse at 50% 42%,rgba(12,12,11,.15),rgba(12,12,11,.82) 78%)}
#title>.inner{margin:0;min-height:100%;justify-content:space-between;padding-top:6vh}
.logoWrap{display:flex;flex-direction:column;align-items:center}
.logo{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(96px,31vw,190px);line-height:1;letter-spacing:-.02em;color:#f4f1ea;transform:skewX(-9deg);
  text-shadow:0 0 54px rgba(255,190,130,.16),0 4px 0 #000}
.latin{font-family:var(--f-num);font-weight:600;font-size:clamp(14px,3.8vw,19px);letter-spacing:.9em;margin-right:-.9em;color:#fff;margin-top:16px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.perf{width:min(64vw,340px);height:2px;margin-top:20px;background:repeating-linear-gradient(90deg,var(--bone) 0 7px,transparent 7px 12px);opacity:.45}
@media (prefers-reduced-motion:no-preference){
  .logo{animation:dash 1.1s cubic-bezier(.2,.9,.2,1) both}
  @keyframes dash{0%{transform:translateX(-30vw) skewX(-24deg);opacity:0}60%{opacity:1}100%{transform:translateX(0) skewX(-9deg)}}
}
.panel{display:grid;gap:10px;width:min(100%,300px)}
.btn{font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.24em;padding:14px 18px 14px calc(18px + .24em);background:rgba(12,12,11,.55);color:var(--bone);border:0;border-radius:0;
  box-shadow:inset 0 0 0 1.5px rgba(239,234,224,.7);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.2}
.btn.primary{background:var(--bone);color:var(--ink);box-shadow:none}
.btn:focus-visible,.mini:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;display:block}
.dbtn{flex-direction:column;gap:4px;letter-spacing:.2em}
.dbtn small{font-family:var(--f-body);font-size:12px;letter-spacing:.06em;color:var(--ash);font-weight:500}
.dhead{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--ash);margin-bottom:4px}
.best{display:flex;justify-content:center;gap:12px;align-items:baseline;font-family:var(--f-num);font-size:13px;letter-spacing:.2em;color:var(--ash);font-variant-numeric:tabular-nums;margin-top:6px}
.best b{font-size:20px;color:var(--bone);letter-spacing:.04em}
/* room */
#room{background:rgba(12,12,11,.72)}
.card{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,340px)}
.card h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:30px;letter-spacing:.06em}
.hintTxt{font-size:13px;line-height:1.7;color:#cfc9bd;max-width:24em}
.code{display:flex;gap:10px}
.code input{width:54px;height:66px;text-align:center;font-family:var(--f-num);font-size:36px;font-weight:600;background:rgba(0,0,0,.5);color:var(--bone);border:0;border-radius:0;box-shadow:inset 0 0 0 1.5px rgba(239,234,224,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.status{min-height:1.4em;font-size:13px;color:var(--sodium);line-height:1.6}
.roomno{font-family:var(--f-num);font-weight:600;font-size:64px;letter-spacing:.24em;margin-right:-.24em;line-height:1}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.seat{padding:14px 8px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;opacity:.45}
.seat.on{opacity:1}
.seat .tag{font-family:var(--f-num);font-weight:600;letter-spacing:.24em;font-size:15px}
#seatMe .tag{color:var(--p1)}#seatOpp .tag{color:var(--p2)}
.seat .st{font-size:13px;color:var(--ash)}
.seat.rdy .st{color:var(--bone);font-weight:700}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--ash);font-weight:700;display:block}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hTime{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-num);font-weight:600;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.6)}
#hSub{position:absolute;top:calc(86px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-num);font-size:12px;letter-spacing:.2em;color:var(--ash);font-variant-numeric:tabular-nums}
#rail{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));left:50%;width:min(52vw,280px);transform:translateX(-50%);height:2px;background:rgba(239,234,224,.3)}
#rail::after{content:"";position:absolute;right:-1px;top:-5px;width:2px;height:12px;background:var(--bone)}
#rail i{position:absolute;top:-4px;width:10px;height:10px;margin-left:-5px;background:var(--bone);transition:opacity .2s}
#rail i.opp{background:var(--p2)}
#rail i.gh{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bone);opacity:.6}
#rail i.x{opacity:.35}
#hLeft{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;text-align:left}
.val{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000}
.val small{font-size:12px;margin-left:2px;color:var(--ash)}
#gWrap{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#gauge{position:relative;width:12px;height:min(36vh,240px);background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(239,234,224,.45)}
#gFill{position:absolute;left:2px;right:2px;bottom:2px;height:0;background:var(--bone)}
#gLim{position:absolute;left:-7px;right:-7px;height:2px;background:var(--blood);bottom:calc(83.33% - 1px)}
#gPct{font-family:var(--f-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
#hSpeed{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px))}
#title.compact .logo{font-size:clamp(64px,18vw,110px)}#title.compact .latin{margin-top:8px}#title.compact>.inner{padding-top:2vh}
#hWarn{position:absolute;top:calc(108px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 4px #000;min-height:1em}
#hWarn.ok{color:#9fe0a8}#hWarn.bad{color:var(--blood)}#hWarn.mid{color:var(--sodium)}
#gWet{font-size:11px;font-weight:700;color:#9fc3e6;letter-spacing:.06em;min-height:1em;white-space:nowrap}
.val.big{font-size:28px}
.panel.wide{width:min(100%,380px)}
.stlist{display:grid;gap:8px}
.stbtn{justify-content:flex-start;gap:14px;padding:12px 14px;letter-spacing:.06em;text-align:left;font-size:17px}
.stbtn.cur{box-shadow:inset 0 0 0 1.5px var(--sodium)}
.stbtn .no{font-family:var(--f-num);font-weight:600;font-size:26px;width:1.2em;text-align:center;color:var(--ash)}
.stbtn .nm{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.stbtn .nm em{font-style:normal;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--sodium);letter-spacing:.1em}
.stbtn .bt{font-family:var(--f-num);font-weight:600;font-size:18px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.stbtn .bt small{font-size:11px;color:var(--ash);letter-spacing:.12em;font-family:var(--f-body)}
.stchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--f-body);font-weight:700;font-size:13px;padding:8px 10px;background:rgba(0,0,0,.4);color:var(--ash);border:0;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.chip.on{color:var(--ink);background:var(--bone)}
#rStage{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--ash);margin-bottom:-12px}
#hint{position:absolute;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--bone);text-shadow:0 1px 4px #000;transition:opacity .6s}
#hint svg{display:block;margin:0 auto 8px}
#vign{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(212,55,43,0) 45%,rgba(212,55,43,.55) 100%)}
#center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:4}
#cTxt{font-family:var(--f-disp);font-size:clamp(84px,27vw,190px);line-height:1;color:var(--bone);text-shadow:0 5px 0 #000,0 0 40px rgba(0,0,0,.6);opacity:0}
#cTxt.show{animation:stamp .7s cubic-bezier(.2,1.4,.3,1) both}
#cTxt.hold{animation:stampHold 1.6s cubic-bezier(.2,1.4,.3,1) both}
#cTxt.tear{color:var(--blood)}
#cSub{font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.3em;color:var(--bone);text-shadow:0 2px 0 #000;min-height:1em}
@keyframes stamp{0%{opacity:0;transform:scale(1.7)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
@keyframes stampHold{0%{opacity:0;transform:scale(1.8) rotate(var(--rot,0deg))}18%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}}
/* result */
#result{background:linear-gradient(180deg,rgba(12,12,11,.3),rgba(12,12,11,.9) 50%)}
#result>.inner{gap:20px;margin:auto 0 0}
#rHead{font-family:var(--f-disp);font-size:clamp(30px,9vw,46px);letter-spacing:.2em;margin-right:-.2em;line-height:1}
#rHead.win{color:var(--sodium)}#rHead.lose{color:var(--ash)}
.rkHead{display:flex;flex-direction:column;align-items:center;gap:4px}
.rkLbl{font-family:var(--f-num);font-size:13px;letter-spacing:.6em;margin-right:-.6em;color:var(--ash)}
#rRank{font-family:var(--f-disp);font-size:clamp(90px,28vw,160px);line-height:.95;transform:skewX(-9deg);text-shadow:0 5px 0 #000}
#rRank.dnf{color:var(--blood);font-size:clamp(70px,22vw,120px)}
.alias{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:30em}
#rName{font-family:var(--f-disp);font-size:clamp(26px,7.6vw,40px);line-height:1.15;text-wrap:balance}
#rFlav{margin:0;font-size:14px;line-height:1.7;color:#cfc9bd;text-wrap:balance}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);width:min(100%,420px)}
.vs div{background:rgba(12,12,11,.82);padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.vs b{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vs .me .lbl{color:var(--p1)}.vs .op .lbl{color:var(--p2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);width:min(100%,560px)}
.stats div{background:rgba(12,12,11,.82);padding:12px 6px;display:flex;flex-direction:column;gap:4px}
.stats b{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums}
@media (max-width:460px){.stats b{font-size:19px}.stats div{padding:10px 4px}.stats .lbl{letter-spacing:.06em}}
#rNew{font-family:var(--f-num);font-weight:600;font-size:14px;letter-spacing:.5em;margin-right:-.5em;color:var(--sodium)}
.shot{margin:0}.shot img{display:block;max-height:30vh;max-width:min(100%,260px);box-shadow:0 0 0 1px var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(100%,520px)}
.btns .btn{font-size:15px;padding:12px 16px 12px calc(16px + .24em);flex:1 1 auto}
#corner{position:fixed;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mini{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:12px;letter-spacing:.16em;background:rgba(12,12,11,.55);color:var(--ash);border:1px solid rgba(148,143,134,.5);padding:7px 10px;cursor:pointer}
.mini svg{width:14px;height:14px}
#bSnd[aria-pressed="false"] #sndWave{opacity:0}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vign"></div>

<div id="hud" hidden>
  <div id="hTime">0.00</div>
  <div id="hSub"></div>
  <div id="rail"><i class="gh" id="dGhost" hidden></i><i class="opp" id="dOpp" hidden></i><i id="dMe"></i></div>
  <div id="hLeft">
    <div><span class="lbl">残り紙　0でゴール</span><span class="val big" id="hPaper">60.0<small>m</small></span></div>
  </div>
  <div id="hWarn"></div>
  <div id="gWrap"><span class="lbl">張力</span><div id="gauge"><div id="gFill"></div><div id="gLim"></div></div><span id="gPct">0%</span><span id="gWet"></span></div>
  <div id="hSpeed"><span class="lbl">速度</span><span class="val" id="hV">0.0<small>m/s</small></span></div>
  <div id="hint"><svg width="22" height="30" viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M11 28V3M3 11l8-8 8 8"/></svg>上スワイプで加速　下スワイプで減速</div>
</div>

<div id="center"><div id="cTxt"></div><div id="cSub"></div></div>

<section id="title" class="scr">
  <div class="inner">
    <div class="logoWrap">
      <h1 class="logo">紙走</h1>
      <div class="latin" lang="en">SHI · SŌ</div>
      <div class="perf"></div>
    </div>
    <div class="panel" id="mainPanel">
      <button class="btn primary" id="bSolo" type="button">ソロ</button>
      <button class="btn" id="bCpu" type="button">CPU対戦</button>
      <button class="btn" id="bOnline" type="button"><span class="dots"><i style="background:var(--p1)"></i><i style="background:var(--p2)"></i></span>オンライン対戦</button>
    </div>
    <div class="panel" id="diffPanel" hidden>
      <div class="dhead">CPUの強さ</div>
      <button class="btn dbtn" type="button" data-d="easy">やさしい<small>安全運転</small></button>
      <button class="btn dbtn" type="button" data-d="normal">ふつう<small>ほどほどに攻める</small></button>
      <button class="btn dbtn" type="button" data-d="hard">つよい<small>張力ぎりぎりまで攻める</small></button>
      <button class="btn" type="button" id="bDiffBack">戻る</button>
    </div>
    <div class="panel wide" id="stagePanel" hidden>
      <div class="dhead" id="stHead">ステージ</div>
      <div class="stlist" id="stList"></div>
      <button class="btn" type="button" id="bStageBack">戻る</button>
    </div>
  </div>
</section>

<section id="room" class="scr" hidden>
  <div class="inner">
    <div class="card" id="roomEntry">
      <h2>オンライン対戦</h2>
      <div class="hintTxt">4桁の部屋番号で、ひとりと対戦します。部屋を作って番号を伝えるか、伝えられた番号を入力してください。</div>
      <div class="code">
        <input id="c0" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号1桁目">
        <input id="c1" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号2桁目">
        <input id="c2" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号3桁目">
        <input id="c3" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号4桁目">
      </div>
      <div class="two">
        <button class="btn primary" id="bJoin" type="button">入室</button>
        <button class="btn" id="bCreate" type="button">部屋を作る</button>
      </div>
      <div class="status" id="entryStatus"></div>
      <button class="btn" id="bRoomBack" type="button">戻る</button>
    </div>
    <div class="card" id="roomLobby" hidden>
      <span class="lbl">部屋番号</span>
      <div class="roomno" id="roomNo">0000</div>
      <span class="lbl">ステージ　最後に選んだ人のステージで走ります</span>
      <div class="stchips" id="lobbyStages"></div>
      <div class="seats">
        <div class="seat on" id="seatMe"><span class="tag">YOU</span><span class="st" id="stMe"></span></div>
        <div class="seat" id="seatOpp"><span class="tag">RIVAL</span><span class="st" id="stOpp"></span></div>
      </div>
      <div class="status" id="lobbyStatus"></div>
      <button class="btn primary" id="bReady" type="button">準備OK</button>
      <button class="btn" id="bLeave" type="button">退室</button>
    </div>
  </div>
</section>

<section id="result" class="scr" hidden>
  <div class="inner">
    <div id="rHead" hidden></div>
    <div id="rStage"></div>
    <div class="rkHead"><span class="rkLbl">RANK</span><div id="rRank">A</div></div>

<script>
'use strict';
/*PHYS-BEGIN*/
const G=9.81, DEG=Math.PI/180;
const L_ROLL=60, COURSE=60, R0=0.057, RC=0.019, PW=0.114;   // 60m single roll, 114mm wide, 38mm core; the goal is where the paper runs out
const TH=Math.PI*(R0*R0-RC*RC)/L_ROLL;
const rAt=s=>Math.sqrt(RC*RC+Math.max(0,L_ROLL-Math.max(0,s))*TH/Math.PI);
const M0=0.110, massAt=s=>0.010+0.100*Math.max(0,L_ROLL-Math.max(0,s))/L_ROLL;
const PH={K:0.6,CRR:0.022,DRAG:0.012,VTEAR:7.2,PK:0.11,PUSH:2.4,BRAKE:2.2,PULSE_T:0.32,GRACE:0.1,BUMP:0.32,WETK:0.4};
// stages: profile = [start s (m), downhill angle (deg)]; bumps = [from, to, strength]; puddles = [from, to]; holes = [start, length]
const STAGES=[
  {id:'garage',no:1,name:'地下駐車場',tag:'基本の坂',env:'garage',curve:[.2,40],
   profile:[[-99,0],[-1.4,5],[0,5],[6,13],[17,1],[24,-5],[28,0],[30,11],[41,.5],[47,6],[54,3],[60,0]]},
  {id:'stone',no:2,name:'石畳の坂',tag:'凸凹道',env:'stone',curve:[.24,34],
   profile:[[-99,0],[-1.4,6],[0,6],[8,10],[16,3],[25,9],[35,2],[43,8],[53,4],[60,0]],
   bumps:[[8.5,15,.8],[26,33,1],[44,51,1]]},
  {id:'rain',no:3,name:'雨上がりの坂',tag:'水たまり',env:'rain',curve:[.16,46],
   profile:[[-99,0],[-1.4,6],[0,6],[7,11],[18,2],[25,8],[35,1],[42,10],[52,3],[60,0]],
   puddles:[[9,10.6],[20,21.6],[30.5,32],[44,45.8],[53,54.4]]},
  {id:'works',no:4,name:'工事中の坂',tag:'穴あき道',env:'works',curve:[.12,50],
   profile:[[-99,0],[-1.4,5],[0,5],[6,9],[14,0],[20,-3],[24,7],[32,0],[38,-4],[42,8],[50,0],[54,4],[60,0]],
   holes:[[17,.3],[23,.35],[35,.4],[40.6,.4],[52,.45]]},
];
// reference times from the balance bot (it drives near the tear limit); ranks scale from these
STAGES.forEach((s,i)=>s.ref=[9.83,10.65,11.71,9.97][i]);
let STAGE=STAGES[0];
const S0=-6, S1=COURSE+16, DS=0.05, NP=Math.round((S1-S0)/DS)+1;
const PA=new Float32Array(NP), PX=new Float32Array(NP), PY=new Float32Array(NP), PZ=new Float32Array(NP);
function rawAng(s){let a=0;const P=STAGE.profile;for(let i=0;i<P.length;i++){if(s>=P[i][0])a=P[i][1];}return a;}
function psiAt(s){if(s<=0)return 0;const k=Math.min(1,s/6)*Math.max(0,Math.min(1,(COURSE+4-s)/6));return STAGE.curve[0]*Math.sin(2*Math.PI*s/STAGE.curve[1])*k;}
function buildPath(stage){
  STAGE=stage;
  let a=new Float64Array(NP);for(let i=0;i<NP;i++)a[i]=rawAng(S0+i*DS)*DEG;
  for(let pass=0;pass<2;pass++){
    const pre=new Float64Array(NP+1);for(let i=0;i<NP;i++)pre[i+1]=pre[i]+a[i];
    const H=12,b=new Float64Array(NP);
    for(let i=0;i<NP;i++){const l=Math.max(0,i-H),r=Math.min(NP-1,i+H);b[i]=(pre[r+1]-pre[l])/(r-l+1);}
    a=b;
  }
  let x=0,y=0,z=0;
  for(let i=0;i<NP;i++){
    PA[i]=a[i];
    if(i>0){const s=S0+(i-.5)*DS,an=(a[i-1]+a[i])/2,ps=psiAt(s),h=Math.cos(an)*DS;x+=Math.sin(ps)*h;z-=Math.cos(ps)*h;y-=Math.sin(an)*DS;}
    PX[i]=x;PY[i]=y;PZ[i]=z;
  }
}
buildPath(STAGES[0]);
function idxF(s){const f=(s-S0)/DS;return Math.min(NP-1.0001,Math.max(0,f));}
function angAt(s){const f=idxF(s),i=f|0,u=f-i;return PA[i]*(1-u)+PA[i+1]*u;}
function featAt(s){
  let bump=0,water=false;
  for(const b of STAGE.bumps||[])if(s>=b[0]&&s<=b[1])bump=Math.max(bump,b[2]*Math.min(1,(s-b[0])/.6,(b[1]-s)/.6));
  for(const w of STAGE.puddles||[])if(s>=w[0]&&s<=w[1])water=true;
  return{bump,water};
}
const vminHole=len=>1.8+len*7;
const limitOf=st=>PH.VTEAR*(1-PH.WETK*st.wet);
function tensionOf(st,v,bump){const x=v/limitOf(st);return x+st.pulse*PH.PK+PH.BUMP*bump*x*x;}
function newSt(){return{s:0,v:0,pulse:0,tension:0,extraBrake:0,wet:0,bump:0,fell:null};}
function physStep(st,dt){
  if(st.fell)return;
  const an=angAt(st.s),m=massAt(st.s),sa=Math.sin(an),ca=Math.cos(an),f=featAt(st.s);
  const drive=PH.K*G*sa, roll=(PH.CRR*(1+f.bump*1.5)+(f.water?.06:0))*G*ca;
  if(st.v<=1e-4&&drive<=roll+st.extraBrake){st.v=0;}
  else{const res=roll+PH.DRAG*st.v*st.v*Math.sqrt(M0/m)+st.extraBrake;st.v=Math.max(0,st.v+(drive-res)*dt);}
  const s0=st.s;st.s+=st.v*dt;const ds=st.s-s0;
  if(f.water)st.wet=Math.min(1,st.wet+ds*.35);else st.wet=Math.max(0,st.wet-ds/6);
  for(const h of STAGE.holes||[]){
    if(s0<h[0]&&st.s>=h[0]&&st.v<vminHole(h[1])){st.fell=h;st.s=h[0]+.06;st.v=0;break;}
    if(s0<h[0]+h[1]&&st.s>=h[0]+h[1])st.pulse+=.08+.025*st.v;
  }
  st.pulse*=Math.exp(-dt/PH.PULSE_T);
  st.bump=f.bump;st.tension=tensionOf(st,st.v,f.bump);
}
function physPush(st,p){if(st.fell)return 0;const dv=PH.PUSH*p*Math.pow(M0/massAt(st.s),0.3);st.v+=dv;st.pulse+=dv;return dv;}
function physBrake(st,p){st.v=Math.max(0,st.v-PH.BRAKE*p);}
// shared driving brain for the CPU rival (and the balance bot): hold a tension target, ease off before rough ground, carry speed into holes
function aiThink(st,tgt,err,rnd){
  // the speed that would sit exactly on the target tension over the ground d metres ahead
  const safeV=(d,t)=>{const f=featAt(st.s+d),wet=Math.min(1,st.wet+(f.water?.6:0)),L=PH.VTEAR*(1-PH.WETK*wet),b=PH.BUMP*f.bump,rest=Math.max(.05,t-st.pulse*PH.PK);
    const x=b>0?(-1+Math.sqrt(1+4*b*rest))/(2*b):rest;return x*L;};
  let vs=Infinity;for(let d=0;d<=3.5;d+=.5)vs=Math.min(vs,safeV(d,tgt+.05));
  let need=0;
  for(const h of STAGE.holes||[]){const d=h[0]-st.s;if(d>0&&d<5.5){need=vminHole(h[1])+.8;break;}}
  if(st.v>vs+.15&&!(need&&st.v<need+.3)){physBrake(st,Math.min(1,(st.v-vs)/PH.BRAKE+.05));return 'brake';}
  if(need&&st.v<need){
    const dvRoom=(.93-st.tension)/(1/limitOf(st)+PH.PK),dv=Math.min(need+.3-st.v,dvRoom);
    if(dv>.05){let q=dv/(PH.PUSH*Math.pow(M0/massAt(st.s),.3));q=Math.min(1,Math.max(.1,q));physPush(st,q);return 'push';}
  }
  if(st.tension<tgt-.04&&st.v<vs-.2){
    const want=tgt+(rnd()-.4)*err*2;
    const k=1/limitOf(st)+PH.PK;let q=Math.min((want-st.tension)/k,vs-st.v)/(PH.PUSH*Math.pow(M0/massAt(st.s),.3));q=Math.min(1,Math.max(.1,q));physPush(st,q);return 'push';
  }
  return null;
}
/*PHYS-END*/

// ================= renderer =================
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;

scene.background=new THREE.Color(0x090908);

const MAXANI=renderer.capabilities.getMaxAnisotropy();

// ================= path frames =================
const TX=new Float32Array(NP),TY=new Float32Array(NP),TZ=new Float32Array(NP);
function computeFrames(){for(let i=0;i<NP;i++){const a=Math.max(0,i-1),b=Math.min(NP-1,i+1);let x=PX[b]-PX[a],y=PY[b]-PY[a],z=PZ[b]-PZ[a];const l=Math.hypot(x,y,z)||1;TX[i]=x/l;TY[i]=y/l;TZ[i]=z/l;}}
computeFrames();
const UP=new V3(0,1,0);
function mkF(){return{p:new V3(),t:new V3(),r:new V3(),n:new V3()};}
function frameInto(s,F){
  const f=idxF(s),i=f|0,u=f-i;
  F.p.set(PX[i]+(PX[i+1]-PX[i])*u,PY[i]+(PY[i+1]-PY[i])*u,PZ[i]+(PZ[i+1]-PZ[i])*u);
  F.t.set(TX[i]+(TX[i+1]-TX[i])*u,TY[i]+(TY[i+1]-TY[i])*u,TZ[i]+(TZ[i+1]-TZ[i])*u).normalize();
  F.r.crossVectors(F.t,UP).normalize();F.n.crossVectors(F.r,F.t).normalize();return F;
}

// ================= procedural textures =================
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function makeNoise(seed){
  const R=rng(seed),p=[];for(let i=0;i<256;i++)p.push(i);
  for(let i=255;i>0;i--){const j=(R()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  const P=new Uint8Array(512);for(let i=0;i<512;i++)P[i]=p[i&255];
  const Gr=new Float32Array(256);for(let i=0;i<256;i++)Gr[i]=R();
  return(x,y,per)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const X=((xi%per)+per)%per,Y=((yi%per)+per)%per,X1=(X+1)%per,Y1=(Y+1)%per;
    const a=Gr[P[P[X]+Y]],b=Gr[P[P[X1]+Y]],c=Gr[P[P[X]+Y1]],d=Gr[P[P[X1]+Y1]];
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
function fbm(n,x,y,oct,per){let s=0,a=.5,f=1,t=0;for(let o=0;o<oct;o++){s+=a*n(x*f,y*f,per*f);t+=a;a*=.5;f*=2;}return s/t;}
function texOf(c,rep,srgb=true){const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;return t;}

function concreteCanvas(S,seed,base,var1,stain,warm){
  const c=cvs(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data,n=makeNoise(seed),n2=makeNoise(seed+5);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S,v=y/S;
    const f=fbm(n,u*8,v*8,4,8), st=fbm(n2,u*3,v*3,3,3);
    let val=base+(f-.5)*var1-Math.max(0,st-.58)*stain;
    const i=(y*S+x)*4;d[i]=Math.min(255,val*255*warm[0]);d[i+1]=Math.min(255,val*255*warm[1]);d[i+2]=Math.min(255,val*255*warm[2]);d[i+3]=255;
  }
  g.putImageData(im,0,0);return c;
}
function texFloor(){
  const small=concreteCanvas(256,7,.33,.2,.32,[1.03,1,.95]);
  const S=1024,c=cvs(S,S),g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(small,0,0,S,S);
  const R=rng(99);
  for(let i=0;i<46000;i++){const x=R()*S,y=R()*S,w=R()<.85?1:2;g.fillStyle=R()<.55?`rgba(0,0,0,${.08+R()*.22})`:`rgba(255,250,240,${.05+R()*.12})`;g.fillRect(x,y,w,w);}
  g.lineCap='round';
  for(let k=0;k<5;k++){let x=R()*S,y=R()*S;g.strokeStyle=`rgba(10,10,8,${.25+R()*.25})`;g.lineWidth=.8+R();g.beginPath();g.moveTo(x,y);for(let j=0;j<40;j++){x+=(R()-.5)*14;y+=R()*9-1;g.lineTo(x,y);}g.stroke();}
  for(let k=0;k<6;k++){const x=R()*S,y=R()*S,r=30+R()*90;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(8,8,6,.22)');gr.addColorStop(1,'rgba(8,8,6,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  return texOf(c,true);
}
function texWall(){ // 打ちっぱなし panel 1.8m x 0.9m with Pコン tie holes
  const W=512,H=256,c=cvs(W,H),g=c.getContext('2d'),base=concreteCanvas(256,21,.5,.16,.1,[1.0,1,.97]);

  for(let i=0;i<10;i++){const x=R()*W,w=4+R()*16,h=H*(.3+R()*.7);const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(30,28,24,.28)');gr.addColorStop(1,'rgba(30,28,24,0)');g.fillStyle=gr;g.fillRect(x,0,w,h);}
  g.fillStyle='rgba(20,20,18,.55)';g.fillRect(0,0,W,2);g.fillRect(0,0,2,H);
  for(const yy of[.25,.75])for(const xx of[1/6,.5,5/6]){
    const x=xx*W,y=yy*H;
    g.fillStyle='rgba(225,222,214,.35)';g.beginPath();g.arc(x,y,10,0,7);g.fill();
    const gr=g.createRadialGradient(x,y,0,x,y,7);gr.addColorStop(0,'#141412');gr.addColorStop(.7,'#2a2925');gr.addColorStop(1,'rgba(60,58,52,.8)');g.fillStyle=gr;g.beginPath();g.arc(x,y,7,0,7);g.fill();
  }

}
function paperCanvas(W,H,perf){
  const c=cvs(W,H),g=c.getContext('2d');g.fillStyle='#f2f0eb';g.fillRect(0,0,W,H);
  const R=rng(perf?3:4);
  for(let i=0;i<W*H/6;i++){g.fillStyle=`rgba(${R()<.5?'120,110,100':'255,255,255'},${R()*.06})`;g.fillRect(R()*W,R()*H,1+R()*2,1);}
  const step=W/26;
  for(let y=0,row=0;y<H+step;y+=step*.866,row++)for(let x=(row%2)*step/2;x<W+step;x+=step){
    const gr=g.createRadialGradient(x-1,y-1,0,x,y,step*.42);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.6,'rgba(200,192,180,.10)');gr.addColorStop(1,'rgba(200,192,180,0)');
    g.fillStyle=gr;g.fillRect(x-step/2,y-step/2,step,step);
  }
  if(perf){for(let x=1;x<W;x+=7){g.fillStyle='rgba(110,104,96,.55)';g.fillRect(x,1,4,2);g.fillStyle='rgba(255,255,255,.6)';g.fillRect(x,3,4,1);}}
  return c;
}
function texRingSide(){
  const S=256,c=cvs(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data,R=rng(8),bands=new Float32Array(400);
  for(let i=0;i<400;i++)bands[i]=R();
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const dx=(x+.5)/S*2-1,dy=(y+.5)/S*2-1,rr=Math.hypot(dx,dy);
    const b=bands[Math.min(399,(rr*360)|0)],b2=bands[Math.min(399,(rr*90)|0)];
    const v=232-b*16-b2*10-(rr>.98?30:0);
    const i=(y*S+x)*4;d[i]=v;d[i+1]=v-3;d[i+2]=v-9;d[i+3]=255;
  }
  g.putImageData(im,0,0);return texOf(c,false);
}
function texCard(){

function ribbon(o){
  const n=Math.max(1,Math.ceil((o.sB-o.sA)/o.seg)),pos=new Float32Array((n+1)*6),uv=new Float32Array((n+1)*4),idx=[];
  const T=mkF(),P=new V3();
  for(let i=0;i<=n;i++){
    const s=o.sA+(o.sB-o.sA)*i/n;frameInto(s,T);const L=s-o.sA;
    for(let j=0;j<2;j++){const q=j?o.b:o.a;P.copy(T.p).addScaledVector(T.r,q[0]).addScaledVector(o.up?UP:T.n,q[1]);const k=i*2+j;pos[k*3]=P.x;pos[k*3+1]=P.y;pos[k*3+2]=P.z;const w=o.uv(L,j,s);uv[k*2]=w[0];uv[k*2+1]=w[1];}
    if(i<n){const a=i*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;
}

function decal(sA,sB,latA,latB,tex,opts={}){

  const m=new THREE.MeshStandardMaterial({map:tex,transparent:true,depthWrite:false,roughness:opts.rough!=null?opts.rough:.85,metalness:opts.metal||0,color:opts.color||0xffffff,opacity:opts.opacity||1,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  return add(new THREE.Mesh(g,m));
}

let pd=null;
function onPush(p){
  if(state!=='run'||me.done)return;

  if(hintShown){hintShown=false;$('hint').style.opacity=0;}
}

const isUI=e=>e.target.closest&&e.target.closest('button,a,input,.card,.panel');
window.addEventListener('pointerdown',e=>{if(isUI(e))return;pd={y:e.clientY,t:performance.now(),id:e.pointerId,done:false};});
window.addEventListener('pointermove',e=>{
  if(!pd||pd.done||e.pointerId!==pd.id)return;
  const dy=pd.y-e.clientY;
  if(Math.abs(dy)>innerHeight*.3){pd.done=true;dy>0?onPush(1):onBrake(1);}
});
window.addEventListener('pointerup',e=>{
  if(!pd||e.pointerId!==pd.id)return;const q=pd;pd=null;if(q.done)return;
  const dy=q.y-e.clientY,dt=Math.max(16,performance.now()-q.t);
  if(Math.abs(dy)<22)return;
  const flick=Math.min(1.25,(Math.abs(dy)/dt)/1.6+.75);
  const p=Math.max(.12,Math.min(1,Math.abs(dy)/(innerHeight*.3)*flick));
  dy>0?onPush(p):onBrake(p);
});
window.addEventListener('pointercancel',()=>{pd=null;});
window.addEventListener('keydown',e=>{
  if(e.repeat||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){e.preventDefault();onPush(e.shiftKey?1:.45);}
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();onBrake(.5);}
});

const SLUG={'SSS':'sss','SS':'ss','S':'s','A+':'a-plus','A':'a','B+':'b-plus','B':'b','C+':'c-plus','C':'c','D+':'d-plus','D':'d','E':'e',
  '出オチ':'de-ochi','ゴール前の悲劇':'goal-mae','千切れた白':'chigireta','重力の申し子':'juryoku','紙一重':'kami-hitoe','連打の鬼':'renda','落とし穴':'otoshiana'};
const RANK_PAGE='https://uimemocho.github.io/apps/paper-run/r/';
function rankInfo(p){
  if(p.fin===null&&p.st.fell){const fs=p.st.fell[0];return{torn:true,fell:true,label:'穴落ち',name:'落とし穴',flav:`${fs.toFixed(1)}m地点の穴にはまった。勢いが足りなかった。`,slug:SLUG['落とし穴']};}
  if(p.fin===null){
    const ts=p.tearS;let name,flav;
    if(ts<COURSE*.28){name='出オチ';flav=`${ts.toFixed(1)}m地点。急坂の入口で紙が音を立てた。`;}
    else if(ts>COURSE*.85){name='ゴール前の悲劇';flav=`${ts.toFixed(1)}m地点。あと${(COURSE-ts).toFixed(1)}mだった。`;}
    else{name='千切れた白';flav=`${ts.toFixed(1)}m地点で破断。押しすぎた。`;}
    return{torn:true,label:'破断',name,flav,slug:SLUG[name]};
  }
  const rk=rankFor(p.fin);let name=rk[2],flav=rk[3],special=false;
  if(p.swipes===0){name='重力の申し子';flav='一度も押さずに坂を降りた。坂を信じた者だけが辿り着く。';special=true;}
  else if(p.peak>=.97){name='紙一重';flav=`最大張力${Math.round(p.peak*100)}%。破れる寸前を、平然と走り抜けた。`;special=true;}

  return{torn:false,label:rk[0],name,flav,slug:special?SLUG[name]:SLUG[rk[0]]};
}
const dnfS=p=>p.tearS>=0?p.tearS:p.st.s;
const score=p=>p.fin!==null?[1,-p.fin]:[0,p.done?dnfS(p):-1];
function vsOutcome(){
  if(!opp)return null;

  const a=score(me),b=score(opp);
  if(a[0]!==b[0])return a[0]>b[0]?'win':'lose';
  if(Math.abs(a[1]-b[1])<.005)return 'draw';
  return a[1]>b[1]?'win':'lose';
}

class MiniMQTT{constructor(url){this.url=url;this.ws=null;this.buf=new Uint8Array(0);this.onmessage=null;this.onclose=null;this.ping=null;this.byUs=false;}
 static str(s){const b=new TextEncoder().encode(s),o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;}
 static vl(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return new Uint8Array(o);}

  ws.onerror=()=>fail(new Error('ws'));ws.onclose=()=>{clearInterval(this.ping);if(!done)fail(new Error('closed'));else if(!this.byUs&&this.onclose)this.onclose();};
  ws.onopen=()=>{const w=MiniMQTT.str(willPayload);ws.send(MiniMQTT.pkt(0x10,MiniMQTT.str('MQTT'),Uint8Array.of(4),Uint8Array.of(0x06),Uint8Array.of(0,60),MiniMQTT.str(id),MiniMQTT.str(willTopic),w));};
  ws.onmessage=ev=>{this.buf=MiniMQTT.cat([this.buf,new Uint8Array(ev.data)]);let p;while((p=this.read())!==null){const t=p[0]>>4;
   if(t===2){if(p[3]===0){if(!done){done=true;clearTimeout(tm);this.ping=setInterval(()=>{try{this.ws.send(Uint8Array.of(0xC0,0))}catch(_){}},25000);res();}}else fail(new Error('connack'));}

async function mqttRoom(code){const d=parseInt(code[0],10);const bi=((isNaN(d)?1:d)+MQ_BROKERS.length-1)%MQ_BROKERS.length;
 const id='s'+Math.random().toString(36).slice(2,10),topic='shisou/1/'+code;
 const mq=new MiniMQTT(MQ_BROKERS[bi]);await mq.connect('shisou-'+id,topic,JSON.stringify({i:id,t:'leave'}),6000);mq.sub(topic);

  }else{
    chaseInto(me,_cp,_cl);
    if(state==='end'&&me.tearS>=0){frameInto(me.tearS,FA);_cl.lerp(FA.p.addScaledVector(FA.r,me.lat),Math.min(1,stateT*2)*.6);}

  }

  // HUD
  if(state==='count'||state==='run'||state==='end'||state==='intro'){

    $('hV').innerHTML=me.st.v.toFixed(1)+'<small>m/s</small>';
    const T=me.tearS>=0?1.2:me.fin!==null?0:me.st.tension+(state==='run'?(Math.random()-.5)*.06*me.st.bump:0),frac=Math.max(0,Math.min(1,T/1.2));

    $('gPct').textContent=Math.round(Math.min(T,1.5)*100)+'%';$('gPct').style.color=T>1?'var(--blood)':'';
    $('gWet').textContent=me.st.wet>.04&&!me.done?`湿り ${Math.round(me.st.wet*100)}%`:'';
    let warn='',wcls='';
    if(state==='run'&&!me.done){
      const h=(STAGE.holes||[]).find(q=>q[0]-me.st.s>0&&q[0]-me.st.s<9);
      if(h){const need=vminHole(h[1]);warn=`穴まで ${(h[0]-me.st.s).toFixed(1)}m　必要 ${need.toFixed(1)} m/s`;wcls=me.st.v<need?'bad':'ok';}
      else{const b=(STAGE.bumps||[]).find(q=>q[0]-me.st.s<5&&q[1]>me.st.s);if(b){warn=me.st.s<b[0]?`段差まで ${(b[0]-me.st.s).toFixed(1)}m　速度を落とせ`:'ガタガタ道　揺れで張力が上がる';wcls='mid';}
        const pdl=(STAGE.puddles||[]).find(q=>q[0]-me.st.s<4&&q[0]>me.st.s);if(!warn&&pdl){warn=`水たまりまで ${(pdl[0]-me.st.s).toFixed(1)}m　濡れると破れやすい`;wcls='mid';}}
    }
    $('hWarn').textContent=warn;$('hWarn').className=wcls;
    $('vign').style.opacity=me.tearS>=0||me.st.fell?Math.max(0,.9-stateT*.25):Math.max(0,Math.min(1,(me.st.tension-.78)/.25));
    const pos=s=>Math.max(0,Math.min(100,s/COURSE*100))+'%';
    $('dMe').style.left=pos(me.st.s);if(opp){$('dOpp').style.left=pos(opp.st.s);$('dOpp').classList.toggle('x',opp.tearS>=0);}
    if(ghostData)$('dGhost').style.left=pos(stepWorld.gs||0);$('dMe').classList.toggle('x',me.tearS>=0);
  }else $('vign').style.opacity=0;
  // audio
  if(AU.ctx){
    const v=(state==='title'||state==='room'||state==='intro'||state==='count')?0:me.st.v;
    setP(AU.rollG.gain,Math.pow(Math.min(1,v/7),.85)*.3*(state==='result'?.5:1),.06);setP(AU.rollF.frequency,180+v*120,.08);
    setP(AU.rustG.gain,Math.min(1,v/7)*.05,.08);
    setP(AU.ratG.gain,state==='run'||state==='end'?me.st.bump*Math.min(1,v/5)*.5:0,.03);
    setP(AU.creakG.gain,state==='run'&&!me.done?Math.pow(Math.max(0,(me.st.tension-.72)/.28),2)*.09:0,.04);
    AU.intense=state==='run'?Math.min(1,me.st.v/6.5):(state==='title'||state==='room')?0:.3;
    setP(AU.bgm.gain,state==='end'&&(me.tearS>=0||me.st.fell)?.08:.32,.3);
  }
}
toTitle();

const fontsDone=()=>{if(fontsReady)return;fontsReady=true;const go=()=>{decalsMade=false;makeTextDecals();};try{Promise.all(["60px 'Dela Gothic One'","700 30px 'Zen Kaku Gothic New'","500 30px 'Zen Kaku Gothic New'","600 30px 'Oswald'"].map(f=>document.fonts.load(f,GLYPHS))).then(()=>{if(state==='title'){builtStage=null;setStage(STAGE);}else{clearTextDecals();go();}},go);}catch(e){go();}};
