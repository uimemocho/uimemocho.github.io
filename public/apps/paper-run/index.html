<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c0c0b">
<meta name="description" content="地下駐車場の坂で、60mのトイレットペーパーを転がしてゴールまで運ぶ3Dタイムアタック。押せば速い、押しすぎると破れる。CPU戦とオンライン対戦、ランクと通り名つき。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="uimemocho">
<meta property="og:title" content="紙走">
<meta property="og:description" content="地下駐車場の坂で、60mのトイレットペーパーを転がしてゴールまで運ぶ3Dタイムアタック。押せば速い、押しすぎると破れる。CPU戦とオンライン対戦、ランクと通り名つき。">
<meta property="og:url" content="https://uimemocho.github.io/apps/paper-run/">
<meta property="og:image" content="https://uimemocho.github.io/apps/paper-run/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="紙走">
<meta name="twitter:description" content="地下駐車場の坂で、60mのトイレットペーパーを転がしてゴールまで運ぶ3Dタイムアタック。押せば速い、押しすぎると破れる。CPU戦とオンライン対戦、ランクと通り名つき。">
<meta name="twitter:image" content="https://uimemocho.github.io/apps/paper-run/ogp.png">
<title>紙走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: full-bleed 3D parking-garage ramp; UI floats like stencil paint over the concrete */
:root{
  --ink:#0c0c0b;
  --slab:rgba(14,14,13,.86);
  --bone:#efeae0;
  --ash:#948f86;
  --line:rgba(239,234,224,.18);
  --blood:#d4372b;
  --sodium:#f0b54a;
  --p1:#6d9be0;
  --p2:#d23b32;
  --f-disp:'Dela Gothic One','Hiragino Kaku Gothic StdN','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-num:'Oswald','Arial Narrow',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:5;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scr>.inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
#title{background:radial-gradient(ellipse at 50% 42%,rgba(12,12,11,.15),rgba(12,12,11,.82) 78%)}
#title>.inner{margin:0;min-height:100%;justify-content:space-between;padding-top:6vh}
.logoWrap{display:flex;flex-direction:column;align-items:center}
.logo{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(96px,31vw,190px);line-height:1;letter-spacing:-.02em;color:#f4f1ea;transform:skewX(-9deg);
  text-shadow:0 0 54px rgba(255,190,130,.16),0 4px 0 #000}
.latin{font-family:var(--f-num);font-weight:600;font-size:clamp(14px,3.8vw,19px);letter-spacing:.9em;margin-right:-.9em;color:#fff;margin-top:16px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.perf{width:min(64vw,340px);height:2px;margin-top:20px;background:repeating-linear-gradient(90deg,var(--bone) 0 7px,transparent 7px 12px);opacity:.45}
@media (prefers-reduced-motion:no-preference){
  .logo{animation:dash 1.1s cubic-bezier(.2,.9,.2,1) both}
  @keyframes dash{0%{transform:translateX(-30vw) skewX(-24deg);opacity:0}60%{opacity:1}100%{transform:translateX(0) skewX(-9deg)}}
}
.panel{display:grid;gap:10px;width:min(100%,300px)}
.btn{font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.24em;padding:14px 18px 14px calc(18px + .24em);background:rgba(12,12,11,.55);color:var(--bone);border:0;border-radius:0;
  box-shadow:inset 0 0 0 1.5px rgba(239,234,224,.7);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.2}
.btn.primary{background:var(--bone);color:var(--ink);box-shadow:none}
.btn:focus-visible,.mini:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;display:block}
.dbtn{flex-direction:column;gap:4px;letter-spacing:.2em}
.dbtn small{font-family:var(--f-body);font-size:12px;letter-spacing:.06em;color:var(--ash);font-weight:500}
.dhead{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--ash);margin-bottom:4px}
.best{display:flex;justify-content:center;gap:12px;align-items:baseline;font-family:var(--f-num);font-size:13px;letter-spacing:.2em;color:var(--ash);font-variant-numeric:tabular-nums;margin-top:6px}
.best b{font-size:20px;color:var(--bone);letter-spacing:.04em}
/* room */
#room{background:rgba(12,12,11,.72)}
.card{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,340px)}
.card h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:30px;letter-spacing:.06em}
.hintTxt{font-size:13px;line-height:1.7;color:#cfc9bd;max-width:24em}
.code{display:flex;gap:10px}
.code input{width:54px;height:66px;text-align:center;font-family:var(--f-num);font-size:36px;font-weight:600;background:rgba(0,0,0,.5);color:var(--bone);border:0;border-radius:0;box-shadow:inset 0 0 0 1.5px rgba(239,234,224,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.status{min-height:1.4em;font-size:13px;color:var(--sodium);line-height:1.6}
.roomno{font-family:var(--f-num);font-weight:600;font-size:64px;letter-spacing:.24em;margin-right:-.24em;line-height:1}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.seat{padding:14px 8px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;opacity:.45}
.seat.on{opacity:1}
.seat .tag{font-family:var(--f-num);font-weight:600;letter-spacing:.24em;font-size:15px}
#seatMe .tag{color:var(--p1)}#seatOpp .tag{color:var(--p2)}
.seat .st{font-size:13px;color:var(--ash)}
.seat.rdy .st{color:var(--bone);font-weight:700}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--ash);font-weight:700;display:block}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hTime{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-num);font-weight:600;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.6)}
#hSub{position:absolute;top:calc(66px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-num);font-size:12px;letter-spacing:.2em;color:var(--ash);font-variant-numeric:tabular-nums}
#rail{position:absolute;top:calc(90px + env(safe-area-inset-top,0px));left:50%;width:min(52vw,280px);transform:translateX(-50%);height:2px;background:rgba(239,234,224,.3)}
#rail::after{content:"";position:absolute;right:-1px;top:-5px;width:2px;height:12px;background:var(--bone)}
#rail i{position:absolute;top:-4px;width:10px;height:10px;margin-left:-5px;background:var(--bone);transition:opacity .2s}
#rail i.opp{background:var(--p2)}
#rail i.gh{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bone);opacity:.6}
#rail i.x{opacity:.35}
#hLeft{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;text-align:left}
.val{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000}
.val small{font-size:12px;margin-left:2px;color:var(--ash)}
#gWrap{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#gauge{position:relative;width:12px;height:min(36vh,240px);background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(239,234,224,.45)}
#gFill{position:absolute;left:2px;right:2px;bottom:2px;height:0;background:var(--bone)}
#gLim{position:absolute;left:-7px;right:-7px;height:2px;background:var(--blood);bottom:calc(83.33% - 1px)}
#gPct{font-family:var(--f-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
#hSpeed{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px))}
#hint{position:absolute;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--bone);text-shadow:0 1px 4px #000;transition:opacity .6s}
#hint svg{display:block;margin:0 auto 8px}
#vign{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(212,55,43,0) 45%,rgba(212,55,43,.55) 100%)}
#center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:4}
#cTxt{font-family:var(--f-disp);font-size:clamp(84px,27vw,190px);line-height:1;color:var(--bone);text-shadow:0 5px 0 #000,0 0 40px rgba(0,0,0,.6);opacity:0}
#cTxt.show{animation:stamp .7s cubic-bezier(.2,1.4,.3,1) both}
#cTxt.hold{animation:stampHold 1.6s cubic-bezier(.2,1.4,.3,1) both}
#cTxt.tear{color:var(--blood)}
#cSub{font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.3em;color:var(--bone);text-shadow:0 2px 0 #000;min-height:1em}
@keyframes stamp{0%{opacity:0;transform:scale(1.7)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
@keyframes stampHold{0%{opacity:0;transform:scale(1.8) rotate(var(--rot,0deg))}18%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}}
/* result */
#result{background:linear-gradient(180deg,rgba(12,12,11,.3),rgba(12,12,11,.9) 50%)}
#result>.inner{gap:20px;margin:auto 0 0}
#rHead{font-family:var(--f-disp);font-size:clamp(30px,9vw,46px);letter-spacing:.2em;margin-right:-.2em;line-height:1}
#rHead.win{color:var(--sodium)}#rHead.lose{color:var(--ash)}
.rkHead{display:flex;flex-direction:column;align-items:center;gap:4px}
.rkLbl{font-family:var(--f-num);font-size:13px;letter-spacing:.6em;margin-right:-.6em;color:var(--ash)}
#rRank{font-family:var(--f-disp);font-size:clamp(90px,28vw,160px);line-height:.95;transform:skewX(-9deg);text-shadow:0 5px 0 #000}
#rRank.dnf{color:var(--blood);font-size:clamp(70px,22vw,120px)}
.alias{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:30em}
#rName{font-family:var(--f-disp);font-size:clamp(26px,7.6vw,40px);line-height:1.15;text-wrap:balance}
#rFlav{margin:0;font-size:14px;line-height:1.7;color:#cfc9bd;text-wrap:balance}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);width:min(100%,420px)}
.vs div{background:rgba(12,12,11,.82);padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.vs b{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vs .me .lbl{color:var(--p1)}.vs .op .lbl{color:var(--p2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);width:min(100%,560px)}
.stats div{background:rgba(12,12,11,.82);padding:12px 6px;display:flex;flex-direction:column;gap:4px}
.stats b{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums}
@media (max-width:460px){.stats b{font-size:19px}.stats div{padding:10px 4px}.stats .lbl{letter-spacing:.06em}}
#rNew{font-family:var(--f-num);font-weight:600;font-size:14px;letter-spacing:.5em;margin-right:-.5em;color:var(--sodium)}
.shot{margin:0}.shot img{display:block;max-height:30vh;max-width:min(100%,260px);box-shadow:0 0 0 1px var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(100%,520px)}
.btns .btn{font-size:15px;padding:12px 16px 12px calc(16px + .24em);flex:1 1 auto}
#corner{position:fixed;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mini{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:12px;letter-spacing:.16em;background:rgba(12,12,11,.55);color:var(--ash);border:1px solid rgba(148,143,134,.5);padding:7px 10px;cursor:pointer}
.mini svg{width:14px;height:14px}
#bSnd[aria-pressed="false"] #sndWave{opacity:0}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vign"></div>

<div id="hud" hidden>
  <div id="hTime">0.00</div>
  <div id="hSub"></div>
  <div id="rail"><i class="gh" id="dGhost" hidden></i><i class="opp" id="dOpp" hidden></i><i id="dMe"></i></div>
  <div id="hLeft">
    <div><span class="lbl">ゴールまで</span><span class="val" id="hDist">55.0<small>m</small></span></div>
    <div><span class="lbl">残り紙</span><span class="val" id="hPaper">60.0<small>m</small></span></div>
  </div>
  <div id="gWrap"><span class="lbl">張力</span><div id="gauge"><div id="gFill"></div><div id="gLim"></div></div><span id="gPct">0%</span></div>
  <div id="hSpeed"><span class="lbl">速度</span><span class="val" id="hV">0.0<small>m/s</small></span></div>
  <div id="hint"><svg width="22" height="30" viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M11 28V3M3 11l8-8 8 8"/></svg>上スワイプで加速　下スワイプで減速</div>
</div>

<div id="center"><div id="cTxt"></div><div id="cSub"></div></div>

<section id="title" class="scr">
  <div class="inner">
    <div class="logoWrap">
      <h1 class="logo">紙走</h1>
      <div class="latin" lang="en">SHI · SŌ</div>
      <div class="perf"></div>
    </div>
    <div class="panel" id="mainPanel">
      <button class="btn primary" id="bSolo" type="button">ソロ</button>
      <button class="btn" id="bCpu" type="button">CPU対戦</button>
      <button class="btn" id="bOnline" type="button"><span class="dots"><i style="background:var(--p1)"></i><i style="background:var(--p2)"></i></span>オンライン対戦</button>
      <div class="best"><span>BEST</span><b id="bestT">--.--</b><span id="bestR"></span></div>
    </div>
    <div class="panel" id="diffPanel" hidden>
      <div class="dhead">CPUの強さ</div>
      <button class="btn dbtn" type="button" data-d="easy">やさしい<small>約14秒でゴール</small></button>
      <button class="btn dbtn" type="button" data-d="normal">ふつう<small>約10.7秒でゴール</small></button>
      <button class="btn dbtn" type="button" data-d="hard">つよい<small>約9.3秒でゴール、たまに破る</small></button>
      <button class="btn" type="button" id="bDiffBack">戻る</button>
    </div>
  </div>
</section>

<section id="room" class="scr" hidden>
  <div class="inner">
    <div class="card" id="roomEntry">
      <h2>オンライン対戦</h2>
      <div class="hintTxt">4桁の部屋番号で、ひとりと対戦します。部屋を作って番号を伝えるか、伝えられた番号を入力してください。</div>
      <div class="code">
        <input id="c0" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号1桁目">
        <input id="c1" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号2桁目">
        <input id="c2" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号3桁目">
        <input id="c3" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="部屋番号4桁目">
      </div>
      <div class="two">
        <button class="btn primary" id="bJoin" type="button">入室</button>
        <button class="btn" id="bCreate" type="button">部屋を作る</button>
      </div>
      <div class="status" id="entryStatus"></div>
      <button class="btn" id="bRoomBack" type="button">戻る</button>
    </div>
    <div class="card" id="roomLobby" hidden>
      <span class="lbl">部屋番号</span>
      <div class="roomno" id="roomNo">0000</div>
      <div class="seats">
        <div class="seat on" id="seatMe"><span class="tag">YOU</span><span class="st" id="stMe"></span></div>
        <div class="seat" id="seatOpp"><span class="tag">RIVAL</span><span class="st" id="stOpp"></span></div>
      </div>
      <div class="status" id="lobbyStatus"></div>
      <button class="btn primary" id="bReady" type="button">準備OK</button>
      <button class="btn" id="bLeave" type="button">退室</button>
    </div>
  </div>
</section>

<section id="result" class="scr" hidden>
  <div class="inner">
    <div id="rHead" hidden></div>
    <div class="rkHead"><span class="rkLbl">RANK</span><div id="rRank">A</div></div>
    <div class="alias"><span class="lbl">通り名</span><div id="rName"></div><p id="rFlav"></p></div>
    <div class="vs" id="rVs" hidden>
      <div class="me"><span class="lbl">YOU</span><b id="vsMe"></b></div>
      <div class="op"><span class="lbl" id="vsOppL">RIVAL</span><b id="vsOpp"></b></div>
    </div>
    <div class="stats">
      <div><span class="lbl">タイム</span><b id="rTime"></b><em id="rBest"></em></div>
      <div><span class="lbl">最高速</span><b id="rMax"></b><em>m/s</em></div>
      <div><span class="lbl">最大張力</span><b id="rTen"></b><em>限界 100%</em></div>
      <div><span class="lbl">スワイプ</span><b id="rSw"></b><em id="rBr"></em></div>
    </div>
    <div id="rNew" hidden>NEW RECORD</div>
    <div class="btns">
      <button class="btn primary" id="bRetry" type="button">もう一度</button>
      <button class="btn" id="bMenu" type="button">メニュー</button>
    </div>
    <figure class="shot" id="rShot" hidden><img id="rImg" alt="リザルト画像"></figure>
    <div class="btns">
      <a class="btn" id="bShareX" href="https://x.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>Xに投稿</a>
      <button class="btn" id="bSaveImg" type="button">画像を保存</button>
      <button class="btn" id="bCopy" type="button">コピー</button>
    </div>
    <div class="status" id="shareStatus"></div>
  </div>
</section>

<div id="corner">
  <button class="mini" id="bQuit" type="button" hidden>メニュー</button>
  <button class="mini" id="bSnd" type="button" aria-pressed="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path id="sndWave" d="M11.5 5.5c1 1.4 1 3.6 0 5M13.5 3.8c1.9 2.4 1.9 6 0 8.4"/></svg>
    <span id="sndLbl">SOUND ON</span>
  </button>

const isUI=e=>e.target.closest&&e.target.closest('button,a,input,.card,.panel');
window.addEventListener('pointerdown',e=>{if(isUI(e))return;pd={y:e.clientY,t:performance.now(),id:e.pointerId,done:false};});
window.addEventListener('pointermove',e=>{
  if(!pd||pd.done||e.pointerId!==pd.id)return;
  const dy=pd.y-e.clientY;
  if(Math.abs(dy)>innerHeight*.3){pd.done=true;dy>0?onPush(1):onBrake(1);}
});
window.addEventListener('pointerup',e=>{
  if(!pd||e.pointerId!==pd.id)return;const q=pd;pd=null;if(q.done)return;
  const dy=q.y-e.clientY,dt=Math.max(16,performance.now()-q.t);
  if(Math.abs(dy)<22)return;
  const flick=Math.min(1.25,(Math.abs(dy)/dt)/1.6+.75);
  const p=Math.max(.12,Math.min(1,Math.abs(dy)/(innerHeight*.3)*flick));
  dy>0?onPush(p):onBrake(p);
});

window.addEventListener('keydown',e=>{
  if(e.repeat||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){e.preventDefault();onPush(e.shiftKey?1:.45);}

function rankInfo(p){

  if(p.swipes===0){name='重力の申し子';flav='一度も押さずに坂を降りた。坂を信じた者だけが辿り着く。';special=true;}

const MQ_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
class MiniMQTT{constructor(url){this.url=url;this.ws=null;this.buf=new Uint8Array(0);this.onmessage=null;this.onclose=null;this.ping=null;this.byUs=false;}
 static str(s){const b=new TextEncoder().encode(s),o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;}
 static vl(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return new Uint8Array(o);}
 static cat(a){const L=a.reduce((x,y)=>x+y.length,0),o=new Uint8Array(L);let k=0;a.forEach(x=>{o.set(x,k);k+=x.length;});return o;}
 static pkt(type,...parts){const b=MiniMQTT.cat(parts),r=MiniMQTT.vl(b.length),o=new Uint8Array(1+r.length+b.length);o[0]=type;o.set(r,1);o.set(b,1+r.length);return o;}
 connect(id,willTopic,willPayload,ms){return new Promise((res,rej)=>{let done=false;const fail=e=>{if(!done){done=true;try{this.ws.close()}catch(_){}rej(e);}};const tm=setTimeout(()=>fail(new Error('timeout')),ms||6000);
  let ws;try{ws=new WebSocket(this.url,'mqtt');}catch(e){clearTimeout(tm);rej(e);return;}this.ws=ws;ws.binaryType='arraybuffer';
  ws.onerror=()=>fail(new Error('ws'));ws.onclose=()=>{clearInterval(this.ping);if(!done)fail(new Error('closed'));else if(!this.byUs&&this.onclose)this.onclose();};
  ws.onopen=()=>{const w=MiniMQTT.str(willPayload);ws.send(MiniMQTT.pkt(0x10,MiniMQTT.str('MQTT'),Uint8Array.of(4),Uint8Array.of(0x06),Uint8Array.of(0,60),MiniMQTT.str(id),MiniMQTT.str(willTopic),w));};
  ws.onmessage=ev=>{this.buf=MiniMQTT.cat([this.buf,new Uint8Array(ev.data)]);let p;while((p=this.read())!==null){const t=p[0]>>4;
   if(t===2){if(p[3]===0){if(!done){done=true;clearTimeout(tm);this.ping=setInterval(()=>{try{this.ws.send(Uint8Array.of(0xC0,0))}catch(_){}},25000);res();}}else fail(new Error('connack'));}
   else if(t===3)this.pub(p);}};});}
 read(){if(this.buf.length<2)return null;let rl=0,m=1,i=1;for(;;){if(i>=this.buf.length)return null;const d=this.buf[i];rl+=(d&127)*m;m*=128;i++;if(!(d&128))break;if(i>5){this.buf=new Uint8Array(0);return null;}}
  const tot=i+rl;if(this.buf.length<tot)return null;const p=this.buf.slice(0,tot);this.buf=this.buf.slice(tot);return p;}
 pub(p){let i=1;while(p[i]&128)i++;i++;const tl=(p[i]<<8)|p[i+1];i+=2;const topic=new TextDecoder().decode(p.slice(i,i+tl));i+=tl;if((p[0]>>1)&3)i+=2;if(this.onmessage)this.onmessage(topic,new TextDecoder().decode(p.slice(i)));}
 sub(t){this.ws.send(MiniMQTT.pkt(0x82,Uint8Array.of(0,1),MiniMQTT.str(t),Uint8Array.of(0)));}
 send(t,s){this.ws.send(MiniMQTT.pkt(0x30,MiniMQTT.str(t),new TextEncoder().encode(s)));}
 close(){this.byUs=true;clearInterval(this.ping);try{this.ws.send(Uint8Array.of(0xE0,0))}catch(_){}try{this.ws.close()}catch(_){}}}
async function mqttRoom(code){const d=parseInt(code[0],10);const bi=((isNaN(d)?1:d)+MQ_BROKERS.length-1)%MQ_BROKERS.length;
 const id='s'+Math.random().toString(36).slice(2,10),topic='shisou/1/'+code;
 const mq=new MiniMQTT(MQ_BROKERS[bi]);await mq.connect('shisou-'+id,topic,JSON.stringify({i:id,t:'leave'}),6000);mq.sub(topic);
 let mine={},others=new Map(),subs=[],closed=false,snap=[];
 const rebuild=()=>{snap=[{peer:id,sameTab:true,isMe:true,kind:'viewer',presence:mine},...[...others].map(([k,v])=>({peer:k,sameTab:false,isMe:false,kind:'viewer',presence:v.p}))];};
 const notify=()=>{rebuild();subs.forEach(f=>{try{f({peers:snap})}catch(_){}});};
 const say=()=>{if(!closed)try{mq.send(topic,JSON.stringify({i:id,t:'p',p:mine}));}catch(_){}};

async function getLobby(){if(NET.gotLobby)return NET.lobby;NET.gotLobby=true;try{NET.lobby=(window.claude&&window.claude.use)?await window.claude.use('room'):null;}catch(e){NET.lobby=null;}return NET.lobby;}

async function joinRoom(code,creating){
  setEntry('接続しています');$('bJoin').disabled=$('bCreate').disabled=true;const lobby=await getLobby();

    try{room=await mqttRoom(c2);code=c2;}catch(e){room=null;}}
    if(room)code.split('').forEach((ch,k)=>codeInputs[k].value=ch);}
  $('bJoin').disabled=$('bCreate').disabled=false;

function leaveRoom(){NET.offs.forEach(f=>{try{f()}catch(e){}});NET.offs=[];if(NET.room){try{NET.room.leave()}catch(e){}}NET.room=null;NET.ready=false;}
function pushPresence(patch){if(!NET.room)return;NET.room.presence(patch).catch(()=>{});}
function peerList(){if(!NET.room)return [];return NET.room.peers().filter(p=>p.kind==='viewer');}

function backToLobby(){
  hideScreens();show('room',true);show('roomEntry',false);show('roomLobby',true);state='room';NET.ready=false;
  pushPresence({st:'lobby',ready:false,fin:null,tear:-1,s:0,v:0,tn:0});setupPlayers('online');resetRace();show('hud',false);show('bQuit',false);clearStamp();renderLobby();

function onRoomChange(){
  const o=oppPeer(),op=o?o.presence:null;
  if(state==='room'){
    renderLobby();if(!o||isFull())return;
    if(amHost()){if(NET.ready&&op.ready&&op.st==='lobby'){NET.go=Math.max(NET.go,NET.lastGo,(op.go|0))+1;NET.lastGo=NET.go;NET.ready=false;pushPresence({st:'count',ready:false,go:NET.go,s:0,v:0,tn:0,tear:-1,fin:null});startOnline();}}

    return;
  }
  if(mode!=='online'||!opp)return;
  if(!o){if(!opp.done){oppLeft=true;}return;}
  if(state==='intro'||state==='count'||state==='run'||state==='end'||state==='result'){
    if(op.st==='run'||op.st==='end'){NET.rx={s:+op.s||0,v:+op.v||0,tn:+op.tn||0,at:performance.now()};
      if(op.tear>=0&&opp.tearS<0){opp.tearS=+op.tear;opp.done=true;spawnBits(opp.tearS,opp.lat,clock);sfxTear(.4);}
      if(op.fin!=null&&opp.fin===null){opp.fin=+op.fin;opp.done=true;}}
  }
}
function startOnline(){NET.rx=null;setupPlayers('online');startRace(true);}

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now(),clock=0;
function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function chaseInto(p,out,look){
  const s=p.st.s,v=p.st.v;
  frameInto(Math.max(S0+.1,s-.6-v*.03),FB);frameInto(s,FA);
  out.copy(FB.p).addScaledVector(FB.n,.19+v*.008).addScaledVector(FB.r,p.lat+(opp?-.06:.08));
  look.copy(FA.p).addScaledVector(FA.t,.95).addScaledVector(FA.n,.035).addScaledVector(FA.r,p.lat+(opp?.1:0));

function cpuThink(p,t){
  const d=DIFF[diff];if(t<cpuNext)return;cpuNext=t+d.iv*(1+(Math.random()-.5)*d.jit*2);
  if(p.st.tension<d.tgt-.04){const want=d.tgt+(Math.random()-.4)*d.err*2;const dv=(want-p.st.tension)/(1/PH.VTEAR+PH.PK);let q=dv/(PH.PUSH*Math.pow(M0/massAt(p.st.s),.3));q=Math.min(1,Math.max(.1,q));physPush(p.st,q);p.swipes++;}

function stepP(p,h,t,local){
  if(local){
    if(p.done&&p.fin!==null)p.st.extraBrake=p.st.s>COURSE+1?3.2:1.2;
    physStep(p.st,h);
    if(p.st.s>S1-1.1){p.st.s=S1-1.1;p.st.v=0;}
  }
  if(p.done||!local)return null;
  p.peak=Math.max(p.peak,p.st.tension);p.maxV=Math.max(p.maxV,p.st.v);
  if(t>=p.rec.length*.05)p.rec.push(p.st.s);
  if(p.st.tension>1){p.over+=h;if(p.over>PH.GRACE){p.done=true;p.tearS=p.st.s;return 'tear';}}

function fastForwardCpu(){
  if(mode!=='cpu'||!opp||opp.done)return;let t=runT;const h=1/240;
  while(!opp.done&&t<120){cpuThink(opp,t);t+=h;const r=stepP(opp,h,t,true);if(r==='tear')break;}
  if(!opp.done){opp.done=true;opp.tearS=opp.st.s;}
}
function onMyEnd(kind){
  state='end';stateT=0;
  if(kind==='tear'){sfxTear(1);spawnBits(me.tearS,me.lat,clock);setTimeout(()=>{if(state==='end'){stamp('破断','hold','-8deg');$('cTxt').classList.add('tear');}},280);}
  else{sfxGoal();stamp(me.fin.toFixed(2),'hold');const d=best&&mode==='solo'?me.fin-best.t:null;$('cSub').textContent=d===null?'GOAL':`GOAL　BEST ${d<0?'−':'+'}${Math.abs(d).toFixed(2)}`;}

const _cp=new V3(),_cl=new V3(),_ip=new V3(),_il=new V3();
function loop(now){
  requestAnimationFrame(loop);
  const dtR=Math.min(.05,(now-last)/1000);last=now;stepWorld(dtR);renderer.render(scene,cam);
}
function stepWorld(dtR){
  clock+=dtR;stateT+=dtR;
  if(state==='end'){const tear=me.tearS>=0;slow=stateT<(tear?1.3:.7)?(tear?.22:.4):Math.min(1,slow+dtR*(tear?.8:1.5));}else slow=1;
  const dt=dtR*slow;
  const racing=state==='run'||state==='end';
  if(racing||state==='result'){
    const H=1/240;let acc=dt;
    const prev=[P0,PL,PR].map(p=>p.st.s);
    while(acc>1e-9){const h=Math.min(H,acc);acc-=h;
      const anyRacing=!me.done||(opp&&!opp.done&&mode!=='online');
      if(racing&&anyRacing)runT+=h;
      if(mode==='cpu'&&opp&&!opp.done&&racing)cpuThink(opp,runT);
      const r=stepP(me,h,runT,true);
      if(opp&&mode==='cpu')stepP(opp,h,runT,true);

      if(r&&state==='run'){onMyEnd(r);}

  }

  if(mode==='online'&&opp&&NET.rx&&(racing||state==='result')){
    const rx=NET.rx,lag=Math.min(.4,(performance.now()-rx.at)/1000);

  }

    _cl.copy(FA.p).addScaledVector(FA.r,me.lat).addScaledVector(FA.n,.04);cam.position.copy(_cp);camLook.copy(_cl);cam.lookAt(camLook);cam.fov=55;
