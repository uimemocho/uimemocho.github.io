<style>
/* Layout: one GB screen (160x144, 4-tone) floating on a dark field; translucent puni-stick + A/B + MENU overlaid. */
:root{
  --field:#121712; --field-hi:#1d241c;
  --lcd0:#d3dcb4; --lcd1:#8f9f72;
  --glass:rgba(220,236,200,.10); --glass-on:rgba(220,236,200,.30); --glass-line:rgba(220,236,200,.42);
  --pixel:"DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--field);overscroll-behavior:none}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
  background:radial-gradient(ellipse at 50% 28%, var(--field-hi) 0%, var(--field) 72%)}
#scr{position:absolute;image-rendering:crisp-edges;image-rendering:pixelated;
  box-shadow:0 0 0 3px #0b0f0b,0 0 0 5px #2a3326,0 18px 50px rgba(0,0,0,.6)}
#pc,#ov{position:absolute;inset:0;width:100%;height:100%}
#pc{z-index:1;pointer-events:none}
#ov{z-index:3;touch-action:none}
.btn{position:absolute;z-index:2;border-radius:50%;border:2px solid var(--glass-line);background:var(--glass);
  color:rgba(230,240,215,.72);font-family:var(--pixel);display:grid;place-items:center;pointer-events:none;
  transform:translate(-50%,-50%);transition:transform .06s,background .06s}
.btn.on{background:var(--glass-on);transform:translate(-50%,-50%) scale(.9)}
.pill{position:absolute;z-index:2;border-radius:999px;border:1.5px solid var(--glass-line);background:var(--glass);
  color:rgba(230,240,215,.7);font:12px var(--pixel);letter-spacing:.12em;display:grid;place-items:center;pointer-events:none;
  transform:translate(-50%,-50%);width:76px;height:26px}
.pill.on{background:var(--glass-on)}
#mute{position:absolute;z-index:4;top:10px;right:12px;font:12px var(--pixel);color:var(--lcd1);
  background:rgba(220,236,200,.06);border:1px solid rgba(220,236,200,.25);border-radius:999px;padding:4px 12px;cursor:pointer}
#mute:focus-visible{outline:2px solid var(--lcd0);outline-offset:2px}
#help{position:absolute;z-index:2;left:16px;right:16px;bottom:10px;text-align:center;font:12px var(--pixel);
  color:rgba(200,215,180,.45);pointer-events:none}
@media (pointer:coarse){#help{display:none}}

<script>
(()=>{
'use strict';
/* ================= CORE ================= */
const app=document.getElementById('app'),scr=document.getElementById('scr'),ctx=scr.getContext('2d');
const pc=document.getElementById('pc'),pcx=pc.getContext('2d'),ov=document.getElementById('ov');
const bA=document.getElementById('bA'),bB=document.getElementById('bB'),bM=document.getElementById('bM'),muteBtn=document.getElementById('mute');
ctx.imageSmoothingEnabled=false;

const P=['#d3dcb4','#8f9f72','#4b5b45','#1b231f']; // 0 light … 3 dark
let FADE=0;
const clamp=v=>v<0?0:v>3?3:v;
const C=i=>P[clamp(i+FADE)];
function R(x,y,w,h,i){ctx.fillStyle=C(i);ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function line(x0,y0,x1,y1,i,w=1){const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy))|0||1;for(let k=0;k<=n;k++)R(x0+dx*k/n-(w>>1),y0+dy*k/n-(w>>1),w,w,i);}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
const FONT='"DotGothic16", monospace';
function txt(s,x,y,ci,o={}){ctx.save();ctx.setTransform(1,0,0,1,0,0);const sz=o.size||16;
  ctx.font=sz+'px '+FONT;ctx.textBaseline='top';ctx.textAlign=o.align||'left';
  const X=Math.round(x*2),Y=Math.round(y*2);
  if(o.shadow!=null){ctx.fillStyle=C(o.shadow);ctx.fillText(s,X+(o.sd||4),Y+(o.sd||4));}
  if(o.outline!=null){ctx.fillStyle=C(o.outline);const w=o.ow||2;for(const[a,b]of[[-w,0],[w,0],[0,-w],[0,w],[-w,-w],[w,w],[-w,w],[w,-w]])ctx.fillText(s,X+a,Y+b);}
  ctx.fillStyle=C(ci);ctx.fillText(s,X,Y);ctx.restore();}
function tw(s,sz=16){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.font=sz+'px '+FONT;const w=ctx.measureText(s).width;ctx.restore();return w/2;}
function wrap(s,max=18){const out=[];for(const para of String(s).split('\n')){let ln='',w=0;for(const ch of para){const cw=/[\x20-\x7e]/.test(ch)?.5:1;if(w+cw>max){out.push(ln);ln='';w=0;}ln+=ch;w+=cw;}out.push(ln);}return out;}
function win(x,y,w,h){R(x,y,w,h,3);R(x+1,y+1,w-2,h-2,0);R(x+2,y+2,w-4,h-4,3);R(x+3,y+3,w-6,h-6,0);}
function cursor(x,y){R(x,y,1,7,3);R(x+1,y+1,1,5,3);R(x+2,y+2,1,3,3);R(x+3,y+3,1,1,3);}

/* ---------- sprites ---------- */
const SPR={};
const sprCache=new Map();
function pad16(rows){const r=rows.map(s=>(s+'................').slice(0,16));while(r.length<16)r.push('................');return r;}
function sprCanvas(n,flip,f){const k=n+'|'+(flip?1:0)+'|'+f;let c=sprCache.get(k);if(c)return c;const rows=SPR[n];
  c=document.createElement('canvas');c.width=18;c.height=18;const g=c.getContext('2d');const op=new Uint8Array(18*18);
  if(rows)for(let y=0;y<rows.length&&y<16;y++){const r=rows[y];for(let x=0;x<16;x++){const ch=r[flip?15-x:x];if(ch==='.'||ch===undefined)continue;g.fillStyle=P[clamp(+ch+f)];g.fillRect(x+1,y+1,1,1);op[(y+1)*18+x+1]=1;}}
  g.fillStyle=P[clamp(3+f)];
  for(let y=0;y<18;y++)for(let x=0;x<18;x++){if(op[y*18+x])continue;
    if((x>0&&op[y*18+x-1])||(x<17&&op[y*18+x+1])||(y>0&&op[(y-1)*18+x])||(y<17&&op[(y+1)*18+x]))g.fillRect(x,y,1,1);}
  sprCache.set(k,c);return c;}
function spr(n,x,y,flip=false,f=FADE){ctx.drawImage(sprCanvas(n,flip,f),Math.round(x)-1,Math.round(y)-1);}
function remap(rows,m){return rows.map(r=>[...r].map(c=>m[c]!==undefined?m[c]:c).join(''));}

/* human templates: H hair, S skin, K skin shade, E eye, C clothes, A accent, P pants/skirt, F feet, O fixed dark */
const TP={
  shortD:['................','.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....','....HKSSSSKH....','....KSESSESK....','....KSSSSSSK....','.....KKSSKK.....'],
  shortU:['................','.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....','....HHHHHHHH....','....KHHHHHHK....','....KKHHHHKK....','.....KKKKKK.....'],
  shortS:['................','....HHHHHH......','...HHHHHHHH.....','...HHHHHHHHH....','...HHHHKSSS.....','...HHHKSSES.....','....HKSSSSS.....','.....KKSSK......'],
  longD:['................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHKSSSSKHH...','...HKSESSESKH...','...HKSSSSSSKH...','...HH.KSSK.HH...'],
  longU:['................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...'],
  longS:['................','....HHHHHH......','...HHHHHHHH.....','..HHHHHHHHHH....','..HHHHHKSSS.....','..HHHHKSSES.....','..HHHKSSSSS.....','..HHH.KKSSK.....'],
  capD:['................','.....HHHHHH.....','....HHHHHHHH....','...OOOOOOOOOO...','....KSSSSSSK....','....KSESSESK....','....KSSSSSSK....','.....KKSSKK.....'],
  bodyD:['....CCCAACCC....','...KCCCAACCCK...','...KCCCAACCCK...','...KKCCAACCKK...'],
  bodyLD:['...HCCCAACCCH...','...KCCCAACCCK...','...KCCCAACCCK...','...KKCCAACCKK...'],
  bodyU:['....CCCCCCCC....','...KCCCCCCCCK...','...KCCCCCCCCK...','...KKCCCCCCKK...'],
  bodyS:['.....CCCACC.....','....CCCCACC.....','....CCKKC.......','....CCKKC.......'],
  bodyLS:['..HH.CCCACC.....','..H.CCCCACC.....','....CCKKC.......','....CCKKC.......'],
  legA:['....PPPPPPPP....','....PPP..PPP....','....PPP..PPP....','....FFF..FFF....'],
  legB:['....PPPPPPPP....','....PPP..PP.....','....PPP..PP.....','....FFF..FF.....'],
  skA:['...PPPPPPPPPP...','....PPPPPPPP....','.....SS..SS.....','.....FF..FF.....'],
  skB:['...PPPPPPPPPP...','....PPPPPPPP....','.....SS...SS....','.....FF...FF....'],
  legSA:['.....PPPPP......','.....PP.PP......','.....PP.PP......','.....FF.FFF.....'],
  legSB:['.....PPPPP......','....PP...PP.....','...PP.....PP....','...FF.....FF....'],
  skSA:['....PPPPPPP.....','.....PPPPP......','......S.S.......','......F.FF......'],
  skSB:['....PPPPPPP.....','.....PPPPP......','.....S...S......','.....F...F......']
};
function colorize(rows,cm){return rows.map(r=>[...r].map(c=>c==='.'?'.':c==='O'?'3':String(cm[c]!==undefined?cm[c]:3)).join(''));}
function makeHuman(name,style,cm){
  const L=style==='long',cap=style==='cap';
  const hd=cap?TP.capD:L?TP.longD:TP.shortD,hu=L?TP.longU:TP.shortU,hs=L?TP.longS:TP.shortS;
  const bd=L?TP.bodyLD:TP.bodyD,bs=L?TP.bodyLS:TP.bodyS;
  const la=L?TP.skA:TP.legA,lb=L?TP.skB:TP.legB,sa=L?TP.skSA:TP.legSA,sb=L?TP.skSB:TP.legSB;
  SPR[name+'_d']=colorize([...hd,...bd,...la],cm);SPR[name+'_d2']=colorize([...hd,...bd,...lb],cm);
  SPR[name+'_u']=colorize([...hu,...TP.bodyU,...la],cm);SPR[name+'_u2']=colorize([...hu,...TP.bodyU,...lb],cm);
  SPR[name+'_s']=colorize([...hs,...bs,...sa],cm);SPR[name+'_s2']=colorize([...hs,...bs,...sb],cm);
}
makeHuman('yu','short',{H:3,S:0,K:1,E:3,C:0,A:3,P:2,F:3});
makeHuman('mina','long',{H:3,S:0,K:1,E:3,C:0,A:3,P:3,F:3});
makeHuman('kuro','short',{H:3,S:0,K:1,E:3,C:3,A:0,P:3,F:3});
makeHuman('staff','cap',{H:2,S:0,K:1,E:3,C:1,A:3,P:3,F:3});
makeHuman('man','short',{H:3,S:0,K:1,E:3,C:1,A:3,P:2,F:3});
makeHuman('woman','long',{H:2,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('granny','long',{H:1,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('kid','short',{H:3,S:0,K:1,E:3,C:0,A:1,P:3,F:3});
makeHuman('student','long',{H:3,S:0,K:1,E:3,C:0,A:3,P:2,F:3});
makeHuman('clerk','cap',{H:3,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('youth','short',{H:1,S:0,K:1,E:3,C:2,A:0,P:3,F:3});
makeHuman('zombie','short',{H:2,S:2,K:3,E:0,C:2,A:3,P:3,F:3});
makeHuman('mounter','short',{H:3,S:2,K:3,E:0,C:3,A:0,P:2,F:3});
makeHuman('stud','short',{H:3,S:1,K:2,E:1,C:3,A:0,P:3,F:3});
makeHuman('knight','cap',{H:1,S:2,K:3,E:0,C:1,A:3,P:3,F:3});
function humanFrame(base,dir,walk){const f=Math.floor(walk/7)%4;
  if(dir==='down')return[base+(f%2?'_d2':'_d'),f===3];
  if(dir==='up')return[base+(f%2?'_u2':'_u'),f===3];
  return[base+(f%2?'_s2':'_s'),dir==='left'];}

/* enemy shapes */
const E4='................';
SPR.blob=pad16([E4,E4,E4,E4,E4,E4,'......1111......','....11000011....','...1000000001...','..100300003001..','..103030030301..','.10000000000001.','.10000333300001.','.11000000000011.','..111111111111..']);
SPR.blob2=pad16([E4,E4,E4,E4,E4,E4,E4,E4,'...1111111111...','..100000000001..','.10030000003001.','1000000000000001','1000003333000001','1100000000000011','.11111111111111.']);
const PH=[E4,E4,'.....333333.....','.....300003.....'];
SPR.phone=pad16([...PH,'.11..301103..11.','.111.303303.111.','..11.300003.11..','.....300003.....','.....311113.....','.....300003.....','.....302203.....','.....333333.....']);
SPR.phone2=pad16([...PH,'.....301103.....','.....303303.....','..11.300003.11..','.111.300003.111.','.11..311113..11.','.....300003.....','.....302203.....','.....333333.....']);
const BUG=[E4,E4,E4,'.....333333.....','...3322222233...','..322000000223..','..320300003023..','..320000000023..','..322222222223..','...3333333333...'];
SPR.bug=pad16([...BUG,'..3.3..33..3.3..','.3..3..33..3..3.']);
SPR.bug2=pad16([...BUG,'...3.3.33.3.3...','...3..3..3..3...']);
const BOX=[E4,'..333333333333..','..300000000003..','..302222222203..','..302333333203..','..302222222203..','..300000000003..','..303300003303..','..300000000003..','..301111111103..'];
SPR.box=pad16([...BOX,'..303333333303..','..300000000003..','..333333333333..','...33......33...','...33......33...']);
SPR.box2=pad16([...BOX,'..300333333003..','..300000000003..','..333333333333..','..33........33..','..33........33..']);
SPR.board=remap(SPR.box,{'0':'2','2':'3','1':'0'});SPR.board2=remap(SPR.box2,{'0':'2','2':'3','1':'0'});
const PILE=[E4,'....11111111....','...1000000001...','...1022220201...','...1000000001...','..110000000011..'];
const PILEB=['..100000000001..','..122222222221..','..100000000001..','.11022002200211.','.10000000000001.','.12222222222221.','.10000000000001.','.11111111111111.'];
SPR.pile=pad16([...PILE,'..100300003001..',...PILEB]);
SPR.pile2=pad16([...PILE,'..100030030001..',...PILEB]);
const GH=[E4,'.....111111.....','....10000001....','...1000000001...','...1033003301...','...1033003301...','...1000000001...','...1000330001...','...1000000001...','...1000000001...','...1000000001...'];
SPR.ghost=pad16([...GH,'...1010010101...','...1.1..1.1.1...']);
SPR.ghost2=pad16([...GH,'...1001010011...','...1..1.1..1....']);
SPR.shade=remap(SPR.ghost,{'0':'3','1':'2','3':'0'});SPR.shade2=remap(SPR.ghost2,{'0':'3','1':'2','3':'0'});
SPR.bird=pad16([E4,E4,'.33..........33.','.333........333.','..3333....3333..','...3333333333...','....33303333....','.....333333.....','......3113......','.......11.......']);
SPR.bird2=pad16([E4,E4,E4,E4,'.....333333.....','...3333033333...','..333333333333..','.333..3333..333.','.33...3113...33.','.......11.......']);
SPR.paper=remap(SPR.bird,{'3':'1','0':'3'});SPR.paper2=remap(SPR.bird2,{'3':'1','0':'3'});
const FLB=['..11100000011...','...1000330001...','...1003003001...','..100000000001..','..100000000001..','..100003300001..','...1000000001...','....11000011....','......1111......'];
SPR.flame=pad16([E4,'.......1........','......101.......','.....10001..1...','..1..100001.11..',...FLB]);
SPR.flame2=pad16([E4,'........1.......','.......101......','...1..10001.....','..11.100001..1..',...FLB]);

/* ---------- audio ---------- */
let AC=null,master=null,muted=false,songName=null,song=null,stepN=0,nextT=0;
const mtof=n=>440*Math.pow(2,(n-69)/12);
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.2;master.connect(AC.destination);playSong(songName);}catch(e){AC=null;}}
function tone(fr,dur,type='square',vol=.3,when=0,slide){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(n){if(!AC||muted)return;switch(n){
  case 'blip':tone(1500,.025,'square',.05);break;
  case 'next':tone(990,.05,'square',.1);break;
  case 'start':[76,79,84,88].forEach((m,i)=>tone(mtof(m),.12,'square',.13,i*.07));break;
  case 'swing':tone(1400,.1,'sawtooth',.07,0,300);break;
  case 'heavy':tone(500,.16,'sawtooth',.1,0,90);break;
  case 'hit':tone(220,.1,'square',.2,0,70);break;
  case 'clink':tone(1800,.05,'square',.08,0,1200);break;
  case 'puff':tone(500,.25,'triangle',.25,0,60);break;
  case 'break':tone(300,.2,'sawtooth',.18,0,50);tone(120,.25,'square',.12,.05,40);break;
  case 'hurt':tone(400,.22,'square',.2,0,90);break;
  case 'door':tone(330,.08,'square',.12);tone(440,.1,'square',.12,.08);break;
  case 'get':[72,76,79,84,79,84].forEach((m,i)=>tone(mtof(m),.14,'square',.13,i*.09));break;
  case 'item':[79,84].forEach((m,i)=>tone(mtof(m),.1,'square',.12,i*.07));break;
  case 'coin':tone(1318,.05,'square',.1);tone(1760,.12,'square',.1,.05);break;
  case 'heal':[76,81,88].forEach((m,i)=>tone(mtof(m),.1,'triangle',.25,i*.06));break;
  case 'magic':tone(300,.3,'square',.12,0,1200);break;
  case 'barrier':[60,67,72,79].forEach((m,i)=>tone(mtof(m),.2,'triangle',.22,i*.05));break;
  case 'thunder':tone(80,.5,'sawtooth',.25,0,30);tone(1600,.2,'square',.08,0,200);break;
  case 'special':[72,79,84].forEach((m,i)=>tone(mtof(m),.08,'square',.14,i*.04));tone(200,.3,'sawtooth',.12,.12,900);break;
  case 'charged':tone(1760,.06,'square',.08);break;
  case 'lvup':[67,72,76,79,84].forEach((m,i)=>tone(mtof(m),.12,'square',.13,i*.07));break;
  case 'boom':tone(90,.6,'sawtooth',.28,0,25);break;
  case 'shot':tone(700,.06,'square',.06,0,400);break;
  case 'fanfare':[69,72,76,81,79,81].forEach((m,i)=>tone(mtof(m),.3,'square',.13,i*.18));break;}}

ov.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{ov.setPointerCapture(e.pointerId);}catch(_){}
  const[x,y]=rel(e);
  for(const k of['A','B']){const b=BTN[k];if(Math.hypot(x-b.x,y-b.y)<b.r*1.35){roles.set(e.pointerId,k);latch[k]=true;sync();return;}}
  const m=BTN.M;if(Math.abs(x-m.x)<m.w/2+8&&Math.abs(y-m.y)<m.h/2+8){roles.set(e.pointerId,'M');latch.M=true;sync();return;}
  if(!stickWanted()){roles.set(e.pointerId,'A');latch.A=true;sync();return;}
  if(!stick){stick={id:e.pointerId,bx:x,by:y,kx:x,ky:y};spring=null;roles.set(e.pointerId,'stick');sync();}
});
ov.addEventListener('pointermove',e=>{if(!stick||e.pointerId!==stick.id)return;const[x,y]=rel(e);
  let dx=x-stick.bx,dy=y-stick.by,d=Math.hypot(dx,dy);
  if(d>70){const k=(d-70)/d;stick.bx+=dx*k;stick.by+=dy*k;dx=x-stick.bx;dy=y-stick.by;d=70;}
  const mm=Math.min(d,44),s=d?mm/d:0;stick.kx=stick.bx+dx*s;stick.ky=stick.by+dy*s;sync();});
function release(e){const role=roles.get(e.pointerId);if(!role)return;roles.delete(e.pointerId);
  if(role==='stick'&&stick){spring={bx:stick.bx,by:stick.by,kx:stick.kx,ky:stick.ky,t:0};stick=null;}sync();}
ov.addEventListener('pointerup',release);ov.addEventListener('pointercancel',release);ov.addEventListener('lostpointercapture',release);
function sync(){const v=[...roles.values()];touch.A=v.includes('A');touch.B=v.includes('B');touch.M=v.includes('M');
  touch.up=touch.down=touch.left=touch.right=false;
  if(stick){const dx=stick.kx-stick.bx,dy=stick.ky-stick.by,d=Math.hypot(dx,dy);
    if(d>9){const ax=dx/d,ay=dy/d;touch.right=ax>.38;touch.left=ax<-.38;touch.down=ay>.38;touch.up=ay<-.38;}}
  bA.classList.toggle('on',touch.A);bB.classList.toggle('on',touch.B);bM.classList.toggle('on',touch.M);}

function drawPuni(bx,by,kx,ky,alpha=1){const dx=kx-bx,dy=ky-by,d=Math.hypot(dx,dy),rb=34-Math.min(9,d*.12),rk=23;
  pcx.lineWidth=2;pcx.strokeStyle=`rgba(220,236,200,${.5*alpha})`;pcx.fillStyle=`rgba(220,236,200,${.15*alpha})`;
  pcx.beginPath();
  if(d>4){const a=Math.atan2(dy,dx),n=Math.PI/2,neck=Math.max(7,rk*.8-d*.1),mx=(bx+kx)/2,my=(by+ky)/2;
    pcx.moveTo(bx+Math.cos(a+n)*rb,by+Math.sin(a+n)*rb);
    pcx.quadraticCurveTo(mx+Math.cos(a+n)*neck,my+Math.sin(a+n)*neck,kx+Math.cos(a+n)*rk,ky+Math.sin(a+n)*rk);
    pcx.arc(kx,ky,rk,a+n,a-n,true);
    pcx.quadraticCurveTo(mx+Math.cos(a-n)*neck,my+Math.sin(a-n)*neck,bx+Math.cos(a-n)*rb,by+Math.sin(a-n)*rb);
    pcx.arc(bx,by,rb,a-n,a+n,true);pcx.closePath();}
  else pcx.arc(bx,by,rb,0,Math.PI*2);
  pcx.fill();pcx.stroke();
  pcx.beginPath();pcx.arc(kx,ky,rk,0,Math.PI*2);pcx.fillStyle=`rgba(220,236,200,${.26*alpha})`;pcx.fill();pcx.stroke();
  pcx.beginPath();pcx.ellipse(kx-7,ky-8,7,4,-.5,0,Math.PI*2);pcx.fillStyle=`rgba(255,255,255,${.22*alpha})`;pcx.fill();}
function drawPad(show){pcx.setTransform(dpr,0,0,dpr,0,0);pcx.clearRect(0,0,pc.width,pc.height);
  if(!show)return;
  if(stick)drawPuni(stick.bx,stick.by,stick.kx,stick.ky);
  else if(spring&&spring.t<14){spring.t++;const p=spring.t/14,e=Math.exp(-5*p)*Math.cos(p*10);drawPuni(spring.bx,spring.by,spring.bx+(spring.kx-spring.bx)*e,spring.by+(spring.ky-spring.by)*e,1-p*.6);}
  else{pcx.beginPath();pcx.arc(HOME.x,HOME.y,34,0,Math.PI*2);pcx.strokeStyle='rgba(220,236,200,.16)';pcx.lineWidth=2;pcx.stroke();
    pcx.beginPath();pcx.arc(HOME.x,HOME.y,14,0,Math.PI*2);pcx.fillStyle='rgba(220,236,200,.08)';pcx.fill();}}

let fade={on:false,phase:'',t:0,cb:null};
function fadeTo(cb){if(fade.on)return false;fade={on:true,phase:'out',t:0,cb};return true;}
function updFade(){fade.t++;if(fade.phase==='out'){FADE=Math.min(3,fade.t>>2);if(fade.t>=18){const cb=fade.cb;fade.cb=null;cb&&cb();fade.phase='in';fade.t=0;}}
  else{FADE=3-Math.min(3,fade.t>>2);if(fade.t>=16){FADE=0;fade.on=false;}}}
let TIMERS=[];

function updTimers(){for(let i=TIMERS.length-1;i>=0;i--){if(--TIMERS[i].t<=0){const c=TIMERS[i].cb;TIMERS.splice(i,1);c();}}}

const D={active:false,q:[],lines:[],shown:0,total:0,cb:null,choice:null,ci:0};
function say(pages,cb,choice){D.q=[];for(const p of pages){const L=wrap(p);for(let i=0;i<L.length;i+=3)D.q.push(L.slice(i,i+3));}
  D.cb=cb||null;D.choice=choice||null;D.ci=0;D.active=true;nextPage();}
function nextPage(){if(!D.q.length){D.active=false;const cb=D.cb;D.cb=null;D.choice=null;cb&&cb();return;}D.lines=D.q.shift();D.total=D.lines.join('').length;D.shown=0;}
function updDialog(){
  if(D.shown<D.total){const b=Math.floor(D.shown);D.shown=Math.min(D.total,D.shown+(hd.B?3:.8));
    if(Math.floor(D.shown)!==b&&Math.floor(D.shown)%2===0)sfx('blip');if(pr.A)D.shown=D.total;return;}
  if(D.choice&&!D.q.length){const n=D.choice.opts.length;
    if(pr.up){D.ci=(D.ci+n-1)%n;sfx('blip');}if(pr.down){D.ci=(D.ci+1)%n;sfx('blip');}
    if(pr.A||pr.B){const i=pr.A?D.ci:n-1;const c=D.choice;D.choice=null;D.active=false;D.cb=null;sfx('next');c.on(i);}return;}
  if(pr.A||pr.B){sfx('next');nextPage();}}

 tree1:['枯れたイチョウの幹に\n無数の付箋が はりついている。','『言えなかったこと』\n『ほんとうは いやでした』\n『たすけて』','……木のかげから\nだれかが 出てきた。','制服の 少女が\nスケッチブックを こちらに むけた。','少女『たすけて』','少女は ページをめくる。','少女『わたしは ミナ。\n声が でないの』','ミナ『この木は 声の樹。\nまちじゅうの 言えなかった声が\nここに あつまってくる』','ミナ『でも 霧のヌシたちが\n声の種を 4つ もっていった』','ミナ『種を とりもどせば\nこの街は また しゃべれる』','ミナ『……いっしょに きて くれる？』','ユウ「……会社は、どうするんだ。」\n自分の声に すこし おどろいた。','ミナ『会社は もうないよ。\nこの街には 朝が こないから』','ミナが なかまに くわわった！','東の霧が うすくなった。\nオフィス街へ 行けそうだ。'],
 tree2:['ミナ『種が ひとつ もどった』','声の樹の 枝が ひとつ、\nかすかに 光った。','西の霧が うすくなった。\n団地へ 行けそうだ。'],
 tree3:['声の樹の 枝が ふたつ 光った。','ミナ『つぎは ……学校』\nミナの 手が すこし ふるえていた。','南西の霧が うすくなった。'],

 tree5:['4つの種が 声の樹に\nもどっていく。','枯れたイチョウが ……\nいっせいに 金色に そまった！','ミナ「……ユ……ウ……」','ミナ『こえ、すこし でた』','ビニール傘が 光に\nつつまれていく。','始発の傘 を手に入れた！','声の樹「……最後の霧は\n環状線の底で 朝を ふさいでいる」','声の樹「始発に のりなさい。\n駅で、あのひとが まっている」'],
 treeIdle:{2:['ミナ『オフィス街は 東。\n時計の 止まった ビルがある』'],3:['ミナ『西の 団地。\n読まれない手紙が たまってる』'],4:['ミナ『南西の 学校。\n……わたしの いた ところ』'],5:['ミナ『南東の 電波塔。\nずっと 燃えてる』'],6:['声の樹「始発に のりなさい。\n駅で あのひとが まっている」'],7:['声の樹は 金色に かがやいている。']},

 boss1out:['時計の針が ……うごきだした。','定時の鐘が 遠くで 鳴った。','『サケビ』の種 を手に入れた！','まほう「サケビ」を おぼえた！\nMENUの まほうで\nBボタンに セットしよう。','？？？「……まだ そんなもの\n振りまわしてるのか、ユウ」','スーツの男が 立っていた。\n元上司の クロカワだ。','クロカワ「声なんか 出しても\nつかれるだけだ。\nおれは やめた」','クロカワ「ミンナの ところへ 来い。\nあそこは しずかで、らくだぞ」','クロカワは 霧のなかへ 消えた。','ミナ『……あのひと、\nかなしい かお してた』','ミナ『声の樹に 種を もどそう』'],
 boss2in:['屋上には 読まれない手紙が\n山のように つもっていた。','？？？「だれも 来ない。\nだれも 来なくて いい」','ムエン が あらわれた！'],
 boss2out:['手紙の山が ほどけていく。','『あいたいね』『げんき？』\n『ありがとう』\n……ぜんぶ、とどかなかった\nことばだ。','『タスケテ』の種 を手に入れた！','まほう「タスケテ」を おぼえた！\nHPを かいふくできる。','ミナ『おばあちゃんも\nひとりだった。\nわたし、会いに いかなかった』','ミナ『……いまなら いえるのに』'],
 rivalIn:['クロカワ「やっぱり 来たか」','クロカワ「ここで 終わりにしろ、\nユウ。声を出すほど きずつくだけだ」','クロカワ が たちはだかった！'],
 rivalOut:['クロカワ「……くっ」','クロカワ「なんで おまえは\nまだ 声が 出せるんだ」','ユウ「……出せてない。\nいま、やっと 出しはじめた\nところだ」','クロカワは 背をむけて 去った。'],

 kuroTunnel:['クロカワ「……待たせたな」','クロカワ「このゲートは おれが\nこじあける。 先に行け、ユウ」','クロカワ「それと……\n『休め』。 ぜんぶ 終わったらな」','ゲートが ひらいた！'],

 finalMid:['ミンナ「さわぐな。目立つな。\nまちがえるな」','ミンナ「……みんなと おなじで いろ」','ミンナの 空気が\nユウを しめつける……！','ミナ「……い……」','ミナ「いや！！」','ミナの 声が 空気を ふるわせた！','ミンナ「……！」\n影が かたちを かえていく。'],
 finalOut:['ミンナ「……みんなって、\nだれ だったんだ」','影が ほどけて、\nたくさんの 人の すがたになった。','そのひとりひとりが、\nちいさな 声で\nなにかを つぶやいた。'],
 death:['……あしたも、会社だ。'],
 death2:['（気がつくと 見おぼえのある\n場所にいた。\nおかねが 半分に へっている）'],

 credits:['終電伝説','〜声のない街〜','','シナリオ・プログラム・ドット','Claude','','あそんだひと','あなた','','霧のむこうで','まだ 声を さがしている','すべての人へ','','THE END']

/* ================= GAME ================= */
let scene='boot',st=0,shake=0,FLASH=0,SWING=0;
let G=null,Pl=null,MAP=null,MID='',MS=null,MINA=null;
let ENT=[],BUL=[],PSH=[],FX=[],PICK=[],NPCS=[],BOSS=null,TOASTS=[],TRAIL=[],FOGP=[];
let camX=0,camY=0,MW=0,MH=0;
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const PB={ox:3,oy:9,w:10,h:6},EB={ox:2,oy:6,w:12,h:9};
const box=(o,B)=>({x:o.x+B.ox,y:o.y+B.oy,w:B.w,h:B.h});
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const SOLID=new Set('#=_bvkLgTdcmlnRxthGrKCOuqfpBYW1234567');
function stickWanted(){return scene==='game'&&!MN.open&&!SH.open&&!D.active;}

/* ---------- stats ---------- */
const maxHP=()=>30+(G.lv-1)*7, maxMP=()=>6+(G.lv-1)*2;
const STR=()=>3+Math.floor((G.lv-1)*1.3)+(G.eq.w?WEAP[G.eq.w].atk:0);
const DEF=()=>1+Math.floor((G.lv-1)*.8)+['head','body','bag'].reduce((s,k)=>s+(G.eq[k]?ARMOR[G.eq[k]].def:0),0);
const needExp=lv=>Math.floor(6*Math.pow(lv,1.6))+4;
function newGame(){G={lv:1,exp:0,hp:30,mp:6,yen:300,ch:1,f:{},inv:{onigiri:3},keys:0,weapons:[],armor:['shirt'],
  eq:{w:null,head:null,body:'shirt',bag:null},magic:[],bslot:null,seeds:0,ms:{},time:0,mina:false,stress:0,
  rp:{map:'station',x:9.5,y:6},gauge:100,charge:0,minaCD:0,cut:false,dying:0};newPlayer();}
function newPlayer(){Pl={x:0,y:0,dir:'down',walk:0,atk:0,atkDur:1,inv:0,kx:0,ky:0,barrier:0,sp:null,charging:false,pow:100,swing:0,tileHit:true,anim:false};}
function addItem(id,n){G.inv[id]=Math.max(0,Math.min(9,(G.inv[id]||0)+n));if(!G.inv[id]){delete G.inv[id];if(G.bslot&&G.bslot.k==='item'&&G.bslot.id===id)G.bslot=null;}}
function heal(n){G.hp=Math.min(maxHP(),G.hp+n);}
function learn(id){if(!G.magic.includes(id))G.magic.push(id);if(!G.bslot)G.bslot={k:'magic',id};sfx('get');}

/* ---------- toasts / fx ---------- */
function toast(t){TOASTS.push({text:t,t:0});}
function toastOnce(t){if(!TOASTS.some(x=>x.text===t))toast(t);}
function num(x,y,v,c){FX.push({k:'num',x,y,s:String(v),t:0,c,life:40});}

/* ---------- tiles ---------- */
function eff(x,y){if(!MAP||y<0||y>=MAP.rows.length||x<0||x>=MAP.rows[0].length)return '#';const c=MAP.rows[y][x],k=x+','+y;
  if(MS.rm[k])return MAP.ground||'.';
  if(c==='C'&&MS.op[k])return 'O';
  if(c==='G'&&MS.gate)return MAP.ground||'.';
  if(c>='1'&&c<='7')return G.ch>=+c?(MAP.ground||','):c;
  return c;}
const tileAt=(px,py)=>eff(Math.floor(px/16),Math.floor(py/16));
function solidBox(b){for(const[x,y]of[[b.x,b.y],[b.x+b.w-.01,b.y],[b.x,b.y+b.h-.01],[b.x+b.w-.01,b.y+b.h-.01]])if(SOLID.has(tileAt(x,y)))return true;return false;}
function npcBlock(b){for(const n of NPCS)if(overlap(b,{x:n.px+3,y:n.py+8,w:10,h:7}))return true;return false;}
function moveBox(o,dx,dy,B,pl){const test=()=>{const b=box(o,B);return solidBox(b)||(pl&&npcBlock(b));};
  if(dx){o.x+=dx;if(test())o.x-=dx;}if(dy){o.y+=dy;if(test())o.y-=dy;}}
const mapCache=new Map();function invalidate(){mapCache.clear();}
function paintTile(g,ch,tx,ty,CI,th){
  const R2=(x,y,w,h,i)=>{g.fillStyle=CI(i);g.fillRect(tx*16+x,ty*16+y,w,h);};
  const v=hash(tx,ty);
  const noise=(n,c)=>{for(let k=0;k<n;k++){const h=hash(tx*7+k,ty*13+k*3);R2(h%16,(h>>4)%16,1,1,c);}};
  const ground=()=>{if(th==='yard'){R2(0,0,16,16,1);noise(6,2);}else if(th==='loop'){R2(0,0,16,16,2);noise(8,3);noise(2,1);}else{R2(0,0,16,16,2);noise(5,3);}};
  const floor=()=>{switch(th){
    case 'station':case 'loop':case 'city':R2(0,0,16,16,1);R2(0,15,16,1,2);R2(15,0,1,16,2);if(v%3===0)R2(4+v%6,6,1,1,2);break;
    case 'shop':{const c=((tx+ty)&1)?0:1;R2(0,0,16,16,c);R2(0,15,16,1,c?2:1);break;}
    case 'office':R2(0,0,16,16,1);for(let y=1;y<16;y+=4)for(let x=((y>>2)&1)?3:1;x<16;x+=4)R2(x,y,1,1,2);break;
    case 'danchi':R2(0,0,16,16,1);noise(5,2);R2(0,0,16,1,2);break;
    case 'school':case 'yard':R2(0,0,16,16,1);for(let y=3;y<16;y+=4)R2(0,y,16,1,2);R2((v%3)*5,0,1,3,2);R2(((v>>2)%3)*5+2,4,1,3,2);R2(((v>>4)%3)*5+1,8,1,3,2);R2(((v>>6)%3)*5+3,12,1,3,2);break;
    case 'tower':R2(0,0,16,16,2);for(let i=0;i<16;i+=4){R2(i,0,1,16,3);R2(0,i,16,1,3);}break;
    default:R2(0,0,16,16,1);}};
  const under=()=>MAP.ground===','?ground():floor();
  const wall=()=>{switch(th){
    case 'city':R2(0,0,16,16,3);for(let i=0;i<4;i++){const wx=2+(i%2)*8,wy=2+(i>>1)*8;const lit=((v>>i)&1)&&((v>>(i+4))&1)&&((v>>(i+9))&1);R2(wx,wy,4,4,lit?1:2);}break;
    case 'station':R2(0,0,16,16,3);R2(0,7,16,1,2);R2(7,0,1,7,2);break;
    case 'shop':R2(0,0,16,16,1);R2(0,0,16,2,2);R2(0,12,16,4,2);R2(0,12,16,1,3);break;
    case 'office':R2(0,0,16,16,2);R2(0,0,16,1,3);R2(7,1,1,15,3);R2(0,15,16,1,3);break;
    case 'danchi':R2(0,0,16,16,2);R2(0,15,16,1,3);R2(3+v%8,2,1,4,3);R2(4+v%8,6,1,3,3);R2((v>>3)%12,10,3,2,1);break;
    case 'school':case 'yard':R2(0,0,16,16,0);R2(0,9,16,7,1);R2(0,9,16,1,2);R2(0,15,16,1,2);break;
    case 'tower':R2(0,0,16,16,3);R2(0,0,16,1,2);R2(0,8,16,1,2);R2(2,3,1,1,1);R2(13,3,1,1,1);R2(2,11,1,1,1);R2(13,11,1,1,1);break;

function give(code,silent){const[t,a,b]=code.split(':');let msg='',extra='';
  if(t==='key'){G.keys++;msg='カードキー を手に入れた！';}
  else if(t==='yen'){G.yen+=+a;msg=a+'円 を手に入れた！';}
  else if(t==='i'){const n=+(b||1);addItem(a,n);msg=ITEMS[a].name+(n>1?' ×'+n:'')+' を手に入れた！';}
  else if(t==='w'){if(!G.weapons.includes(a))G.weapons.push(a);G.eq.w=a;msg=WEAP[a].name+' を手に入れた！';extra=WEAP[a].desc+'\n（MENUの そうびで もちかえ）';}
  else if(t==='a'){if(!G.armor.includes(a))G.armor.push(a);msg=ARMOR[a].name+' を手に入れた！';extra='MENUの そうびで 身につけよう。';}
  sfx(t==='w'?'get':'item');if(!silent)say(extra?[msg,extra]:[msg]);}

function treeTalk(){

function tryInteract(){const v=DV[Pl.dir],ix=Pl.x+8+v[0]*14,iy=Pl.y+12+v[1]*14;

  const tx=Math.floor(ix/16),ty=Math.floor(iy/16),c=eff(tx,ty),k=tx+','+ty;

    case 'k':say([(MAP.signs||{})[k]||'かすれて 読めない。']);return true;

      else say(['ベンチだ。\nすこし すわりたい。']);return true;}
  }

/* ---------- player ---------- */
function updPlayer(){const p=Pl;
  if(p.inv>0)p.inv--;if(p.barrier>0)p.barrier--;
  if(G.stress>0){G.stress--;if(G.stress%90===0&&G.hp>1){G.hp--;}}
  if(G.minaCD>0)G.minaCD--;
  const w=G.eq.w?WEAP[G.eq.w]:null;
  if(G.gauge<100)G.gauge=Math.min(100,G.gauge+(w&&(w.type==='heavy'||w.type==='hammer')?1.5:2));
  if(p.sp){updSpecial();return;}
  if(Math.abs(p.kx)+Math.abs(p.ky)>.1){moveBox(p,p.kx,p.ky,PB,1);p.kx*=.75;p.ky*=.75;}else p.kx=p.ky=0;
  if(p.atk>0){p.atk--;attackFrame();if(!p.atk)p.anim=false;}
  if(p.charging&&hd.A&&w){if(G.gauge>=100&&p.atk===0){if(G.charge<40){G.charge++;if(G.charge===40)sfx('charged');}}}
  if(!hd.A){if(G.charge>=40&&w){startSpecial();}G.charge=0;p.charging=false;}
  let dx=(hd.right?1:0)-(hd.left?1:0),dy=(hd.down?1:0)-(hd.up?1:0);
  if(p.atk>0)dx=dy=0;
  if(dx||dy){if(dx&&!dy)p.dir=dx>0?'right':'left';else if(dy&&!dx)p.dir=dy>0?'down':'up';
    else{const keep=(p.dir==='right'&&dx>0)||(p.dir==='left'&&dx<0)||(p.dir==='down'&&dy>0)||(p.dir==='up'&&dy<0);if(!keep)p.dir=dx>0?'right':'left';}
    let sp=G.charge>0?.8:1.1;if(dx&&dy)sp*=.72;moveBox(p,dx*sp,dy*sp,PB,1);p.walk+=sp;}else p.walk=0;
  if(pr.A&&p.atk===0){if(!tryInteract()&&w)attack();}
  if(pr.B)useB();
  if(pr.M)openMenu();}
function attack(){const w=WEAP[G.eq.w];Pl.atk=Pl.atkDur=w.dur;Pl.swing=++SWING;Pl.pow=G.gauge;G.gauge=0;Pl.charging=true;Pl.tileHit=false;Pl.anim=false;

function updMina(){if(!G.mina||!MINA)return;

  if(p.sp&&p.sp.k==='spin'){const cx=p.x+8,cy=p.y+10;for(let i=0;i<8;i++){const a=p.sp.t*.5+i*Math.PI/4;line(cx,cy,cx+Math.cos(a)*15,cy+Math.sin(a)*15,i&1?1:3);R(cx+Math.cos(a)*16,cy+Math.sin(a)*16,2,2,0);}ring(cx,cy,24,0);return;}
  if(!p.atk||!w)return;const type=(p.sp&&p.sp.k==='lash')?'whip':w.type;const prog=1-p.atk/p.atkDur,v=DV[p.dir],hx=p.x+8,hy=p.y+10;
  if(type==='whip'||type==='spear'){const L=(type==='whip'?40:26)*Math.sin(Math.min(1,prog*1.4)*Math.PI);const ex=hx+v[0]*L,ey=hy+v[1]*L;
    line(hx,hy,ex,ey,type==='whip'?2:3,type==='whip'?1:2);if(type==='whip'){R(ex-2,ey-2,5,4,0);R(ex-2,ey-2,5,1,3);}else{R(ex-(v[1]?4:1),ey-(v[0]?4:1),v[1]?9:3,v[0]?9:3,3);}return;}
  const base={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[p.dir];
  if(type==='hammer'){const a=base+(prog<.5?-1.4+prog*2.8:0);const L=12;const ex=hx+Math.cos(a)*L,ey=hy+Math.sin(a)*L;line(hx,hy,ex,ey,2,1);R(ex-3,ey-3,7,7,3);R(ex-2,ey-2,5,5,1);return;}
  const big=type==='heavy',r=big?18:15,a0=base-1.2,a=a0+2.4*Math.min(1,prog*1.6);
  for(let s=a0;s<a;s+=.12)R(hx+Math.cos(s)*r,hy+Math.sin(s)*r,big?2:1,big?2:1,0);
  line(hx,hy,hx+Math.cos(a)*(r-1),hy+Math.sin(a)*(r-1),3,big?3:2);line(hx+Math.cos(a)*5,hy+Math.sin(a)*5,hx+Math.cos(a)*(r-2),hy+Math.sin(a)*(r-2),G.eq.w==='dawn'?0:1,1);}
function drawPlayer(){const p=Pl;shadow(p.x,p.y);
  if(p.barrier>0&&(p.barrier>60||(st&2)))ring(p.x+8,p.y+9,11,0);
  if(!(p.inv>0&&!p.sp&&((p.inv>>2)&1))){const[n,fl]=humanFrame('yu',p.dir,p.atk?0:p.walk);spr(n,p.x,p.y,fl,(G.charge>=40&&(st&4))?FADE-1:FADE);}
  if(G.charge>=40){const a=st*.3;R(p.x+8+Math.cos(a)*10,p.y+8+Math.sin(a)*10,1,1,0);R(p.x+8-Math.cos(a)*10,p.y+8-Math.sin(a)*10,1,1,0);}
  drawWeapon();}
function drawEnemy(e){if(e.dead)return;const d=e.d;shadow(e.x,e.y);const f=(e.flash&2)?-3:FADE+(d.tone||0);
  if(d.human){const[n,fl]=humanFrame(d.spr,e.dir,e.walk);spr(n,e.x,e.y,fl,f);}
  else{const bob=d.ai==='float'?Math.round(Math.sin(e.t*.1)*2):d.ai==='hop'&&e.t%36<22?-Math.round(Math.sin((e.t%36)/22*Math.PI)*3):0;
    spr(d.spr+(((e.t>>4)&1)?'2':''),e.x,e.y-1+bob,e.dir==='left',f);}
  if(e.st==='wind'&&(e.t&4))txt('!',e.x+6,e.y-9,0,{outline:3});}
function drawFX(f){switch(f.k){
  case 'puff':if(f.t<18){const r=2+f.t*.7;for(let k=0;k<8;k++){const a=k*Math.PI/4;R(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,2,2,f.t<9?0:1);}}break;
  case 'stamp':{const s=f.big?14:7;if(f.t<30){R(f.x-s,f.y-s,s*2,1,3);R(f.x-s,f.y+s,s*2+1,1,3);R(f.x-s,f.y-s,1,s*2,3);R(f.x+s,f.y-s,1,s*2,3);if(f.t<8)ring(f.x,f.y,s+f.t,0);}break;}
  case 'bolt':if(f.t<14){let x=f.x,y=camY;while(y<f.y){const nx=x+((hash(y,f.t)%5)-2);line(x,y,nx,y+6,0,2);x=nx;y+=6;}disc(f.x,f.y,4,0);}break;
  case 'spark':if(f.t>=0)R(f.x+Math.sin(f.t*.4)*3,f.y-f.t*.6,1,1,f.t&2?0:1);break;
  case 'after':if(f.t<10&&(f.t&1)){const[n,fl]=humanFrame('yu',f.dir,0);spr(n,f.x,f.y,fl,FADE+1);}break;
  case 'sketch':if(f.t<90){R(f.x-14,f.y-12,28,10,0);R(f.x-14,f.y-12,28,1,2);R(f.x-1,f.y-2,3,2,0);}break;}}

/* ---------- game update / render ---------- */
function updGame(ok){G.time++;
  for(const f of FX)f.t++;FX=FX.filter(f=>f.t<(f.life||40));
  if(TOASTS.length&&++TOASTS[0].t>100)TOASTS.shift();
  for(const f of FOGP){f.x+=f.s;if(f.x>MW+10)f.x=-10;}
  if(!ok)return;
  if(MN.open){updMenu();return;}
  if(SH.open){updShop();return;}
  if(D.active){updDialog();return;}
  if(G.cut){updCam();return;}
  updPlayer();if(scene!=='game'||G.cut||MN.open)return;
  for(const e of ENT)updEnemy(e);ENT=ENT.filter(e=>e.dead<=18);
  updBoss();updBullets();updPShots();updPickups();updMina();updNPCs();checkExits();if(!fade.on)checkTriggers();updCam();}
function renderGame(){const sx=shake?((st&1)?1:-1)*Math.min(3,Math.ceil(shake/4)):0;
  R(0,0,160,128,3);ctx.save();ctx.beginPath();ctx.rect(0,0,160,128);ctx.clip();ctx.translate(sx-camX,-camY);
  ctx.drawImage(mapC(FADE),0,0);
  for(const p of PICK)if(p.t<720||(p.t&4)){R(p.x+1,p.y+2,6,5,3);R(p.x+2,p.y+3,4,3,p.id==='onigiri'?0:1);if((p.t>>3)%4===0)R(p.x+6,p.y,1,1,0);}
  const list=[];
  for(const n of NPCS)list.push({y:n.py+15,d:()=>{shadow(n.px,n.py);const[nm,fl]=humanFrame(n.spr,n.face,0);spr(nm,n.px,n.py,fl);if(n.near&&!D.active)talkBubble(n.px,n.py);}});
  if(G.mina&&MINA)list.push({y:MINA.y+15,d:()=>{shadow(MINA.x,MINA.y);const[nm,fl]=humanFrame('mina',MINA.dir,MINA.mv>0?MINA.walk:0);spr(nm,MINA.x,MINA.y,fl);}});
  if(MAP.tree){const bx=(MAP.tree[0]+1)*16,by=(MAP.tree[1]+2)*16-2;list.push({y:by,d:()=>drawTree(bx,by,G.ch>=6?5:G.seeds+(G.ch>=2?1:0))});}
  for(const e of ENT)list.push({y:e.y+15,d:()=>drawEnemy(e)});
  if(BOSS&&!BOSS.dead)list.push({y:BOSS.y+BOSS.d.h,d:()=>drawBoss(BOSS)});
  list.push({y:Pl.y+15,d:drawPlayer});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  for(const s of PSH)drawPShot(s);for(const b of BUL)drawBullet(b);for(const f of FX)drawFX(f);
  if(MAP.fog){const n=Math.max(10,60-G.seeds*12-(G.ch>=2?8:0));for(let i=0;i<n&&i<FOGP.length;i++){const f=FOGP[i];R(f.x,f.y,f.w,1,1);}}
  ctx.restore();
  for(const f of FX){if(f.k==='num')txt(f.s,f.x-camX-tw(f.s)/2,f.y-camY-Math.min(12,f.t*.5),f.c,{outline:3});
    if(f.k==='sketch'&&f.t<90)txt('がんばれ',f.x-camX-12,f.y-camY-11,3,{size:12});}
  if(FLASH&&(FLASH&2))R(0,0,160,128,0);
  renderHUD();
  if(BOSS&&!BOSS.dead){R(30,2,100,6,3);R(31,3,Math.round(98*Math.max(0,BOSS.hp)/BOSS.d.hp),4,0);txt(BOSS.d.n,80,9,0,{align:'center',outline:3});}
  if(TOASTS.length){const t=TOASTS[0],ls=t.text.split('\n'),w=Math.max(...ls.map(l=>tw(l)))+12,h=ls.length*10+5,x=Math.round((160-w)/2),y=BOSS?20:4;
    R(x,y,w,h,1);R(x+1,y+1,w-2,h-2,3);ls.forEach((l,i)=>txt(l,80,y+3+i*10,0,{align:'center'}));}
  drawDialog(st);
  if(MN.open)renderMenu();if(SH.open)renderShop();}
function renderHUD(){R(0,128,160,16,3);R(0,128,160,1,2);
  txt('HP',2,132,1);txt(G.hp+'/'+maxHP(),13,132,G.hp<maxHP()*.25&&(st>>3)&1?1:0);
  txt('MP',52,132,1);txt(String(G.mp),63,132,0);
  if(G.stress>0&&(st>>4)&1)txt('ス',74,132,1);
  if(!G.eq.w){txt('Lv'+G.lv,157,132,1,{align:'right'});return;}
  const ready=G.charge>=40;R(84,133,46,6,2);R(85,134,Math.round(44*G.gauge/100),4,ready?((st>>2)&1?0:1):G.gauge>=100?0:1);
  if(G.charge>0&&!ready)R(85,134,Math.round(44*G.charge/40),1,3);
  txt(ready?'必殺':Math.floor(G.gauge)+'%',157,132,ready||G.gauge>=100?0:1,{align:'right'});}

/* ---------- city scenery (title/opening/ending) ---------- */
const RAIN=[];for(let i=0;i<46;i++){const h=hash(i,3);RAIN.push({x:h%170,y:(h>>8)%144,s:2+(h>>16)%3});}
function updRain(){for(const r of RAIN){r.y+=r.s;r.x-=r.s*.3;if(r.y>144){r.y=-4;r.x=(r.x+97)%180;}if(r.x<-4)r.x+=170;}}
function drawRain(){for(const r of RAIN)R(r.x,r.y,1,3,1);}
const BLD=[];(()=>{let x=-4,s=7;while(x<170){s=(s*1103515245+12345)&0x7fffffff;const w=10+s%14,h=22+(s>>5)%46;BLD.push({x,w,h});x+=w+1;}})();
function drawCity(t,g,sky=3,bld=2){R(0,0,160,144,sky);
  if(sky===3)for(let i=0;i<22;i++){const h=hash(i,7);if(((t>>5)+i)%11)R(h%160,(h>>8)%Math.max(8,g-34),1,1,2);}
  const tx=122;R(tx-3,g-80,6,80,bld);line(tx,g-70,tx-18,g-92,bld,2);line(tx,g-74,tx+16,g-96,bld,2);line(tx-9,g-81,tx-24,g-84,bld,1);
  line(tx+8,g-85,tx+26,g-86,bld,1);line(tx,g-78,tx+2,g-104,bld,1);line(tx-18,g-92,tx-22,g-102,bld,1);line(tx+16,g-96,tx+20,g-106,bld,1);
  for(const b of BLD){const hh=Math.round(b.h*g/108),top=g-hh;R(b.x,top,b.w,hh,bld);
    for(let wy=top+3;wy<g-3;wy+=5)for(let wx=b.x+2;wx<b.x+b.w-2;wx+=4){const h=hash(wx,wy+b.x*3);
      if(h%6===0)R(wx,wy,2,2,(((t>>6)+h)%13)?(sky===3?1:0):3);else if(h%6===1)R(wx,wy,2,2,3);}}
  for(let x=0;x<160;x+=2)R(x+((x>>1)&1),g-3,1,1,1);R(0,g,160,144-g,3);}

/* ---------- title ---------- */
let TI={cur:0};
function updTitle(ok){if(!ok||st<20)return;const hs=hasSave();
  if(hs&&(pr.up||pr.down)){TI.cur^=1;sfx('blip');}
  if(pr.A||pr.M){sfx('start');
    if(hs&&TI.cur===1)fadeTo(()=>{if(loadGame()){scene='game';}else{scene='opening';op={i:0,t:0,c:0};}st=0;});
    else fadeTo(()=>{scene='opening';op={i:0,t:0,c:0};st=0;});}}
function renderTitle(){drawCity(st,108);drawRain();
  txt('SHUDEN DENSETSU',80,14,1,{align:'center'});

  txt('〜 声のない街 〜',80,62,1,{align:'center',outline:3});

  else if(st<40||((st>>5)&1))txt('PRESS START',80,112,0,{align:'center',outline:3});
  txt('© 2026  ORIGINAL GB-STYLE RPG',80,133,2,{align:'center'});}

/* ---------- opening ---------- */
let op={i:0,t:0,c:0};
function opLen(){return T.op[op.i].replace(/\n/g,'').length;}
function updOpening(ok){op.t++;const len=opLen();if(op.c<len)op.c+=.4;if(!ok)return;
  if(pr.B||pr.M){endOpening();return;}
  if(pr.A){if(op.c<len)op.c=len;else nextOp();}else if(op.c>=len&&op.t>len*2.5+170)nextOp();}
function nextOp(){if(op.i>=T.op.length-1){endOpening();return;}fadeTo(()=>{op.i++;op.t=0;op.c=0;});}
function endOpening(){fadeTo(()=>{newGame();scene='game';st=0;loadMap('station',9.5,6,'down');});}
function crowd(t,bubbles){R(0,0,160,86,3);for(let x=0;x<160;x+=2)for(let y=72;y<86;y+=2)if(((x+y)>>1)&1)R(x,y,1,1,2);
  for(let row=0;row<2;row++){const by=row?82:66,c=row?1:2;for(let i=0;i<11;i++){const x=row?4+i*15:11+i*15;const bob=((t>>5)+i)&1;R(x,by-13,7,13,c);R(x+2+(row?1:0),by-17+bob,4,4,c);if(row)R(x+3,by-10,2,2,0);}}
  if(bubbles)for(const[x,y]of[[18,40],[64,36],[112,42]]){R(x,y,14,8,0);R(x+3,y+8,2,2,0);for(let k=0;k<3;k++)R(x+3+k*3,y+4,1,1,3);}}
function trainPic(t){drawCity(t,62);R(0,62,160,24,2);R(0,62,160,1,1);const x=18+t*.7;R(x,40,130,20,1);for(let k=0;k<9;k++)R(x+6+k*14,44,8,6,3);R(x,58,130,2,3);R(x,48,2,4,0);R(30,68,5,12,1);R(31,63,4,4,1);}
function umbrellaPic(t){R(0,0,160,86,3);R(0,70,160,16,2);for(let y=20;y<86;y++){const hw=(y-20)*.55;for(let x=Math.round(80-hw);x<80+hw;x++)if(((x+y)&1)===0)R(x,y,1,1,1);}
  R(79,20,2,50,2);R(74,16,12,4,2);R(76,19,8,1,0);R(86,56,6,14,3);R(87,50,5,5,3);line(93,55,99,70,3,1);R(98,69,2,2,3);drawRain();}
function renderOpening(){R(0,0,160,144,3);ctx.save();ctx.beginPath();ctx.rect(0,0,160,86);ctx.clip();
  [()=>drawCity(op.t,80),()=>crowd(op.t,false),()=>crowd(op.t,true),()=>trainPic(op.t),()=>umbrellaPic(op.t)][op.i]();ctx.restore();R(0,86,160,1,2);
  const L=wrap(T.op[op.i]);let left=Math.floor(op.c);const y0=94+(4-L.length)*5;
  L.forEach((ln,i)=>{const w=tw(ln);txt(ln.slice(0,Math.max(0,left)),(160-w)/2,y0+i*11,0);left-=ln.length;});txt('B:スキップ',156,2,2,{align:'right'});}

/* ---------- ending ---------- */
let EN={i:0,t:0,c:0,phase:'lines',cy:0};
function finale(){G.f.final=1;G.ch=7;G.cut=false;saveGame();fadeTo(()=>{scene='ending';st=0;EN={i:0,t:0,c:0,phase:'lines',cy:150};playSong('ending');});}
function updEnding(ok){EN.t++;if(!ok)return;
  if(EN.phase==='lines'){const len=T.ending[EN.i].replace(/\n/g,'').length;if(EN.c<len)EN.c+=.5;

    if(EN.i>=T.ending.length){EN.phase='credits';EN.cy=150;}}
  else if(EN.phase==='credits'){EN.cy-=hd.A?1.2:.3;if(EN.cy<-T.credits.length*14-10)EN.phase='end';}
  else if(EN.phase==='end'&&pr.A)fadeTo(()=>{scene='title';st=0;TI.cur=0;playSong('title');});}
function renderEnding(){const p=Math.min(1,(st)/1800);
  R(0,0,160,144,1);for(let y=0;y<60;y++)if(y>40-p*30)for(let x=(y&1);x<160;x+=2)R(x,y,1,1,0);
  disc(118,52-Math.round(p*16),9,0);
  drawCityLite();
  const tx=EN.phase==='lines'?Math.max(10,160-st*.5):10;R(tx,56,140,18,2);for(let k=0;k<9;k++)R(tx+6+k*15,59,8,6,0);R(tx,72,140,2,3);
  R(0,76,160,12,2);R(0,76,160,1,0);R(66,62,5,14,3);R(67,57,4,4,3);R(80,64,5,12,3);R(80,58,5,6,3);
  if(EN.phase==='lines'&&EN.i<T.ending.length){R(0,92,160,52,3);const L=wrap(T.ending[EN.i]);let left=Math.floor(EN.c);
    L.forEach((ln,i)=>{const w=tw(ln);txt(ln.slice(0,Math.max(0,left)),(160-w)/2,100+i*11+(3-L.length)*5,0);left-=ln.length;});}
  else{R(0,0,160,144,0);T.credits.forEach((l,i)=>{const y=EN.cy+i*14;if(y>-10&&y<144)txt(l,80,y,i<2?3:(l==='THE END'?3:2),{align:'center',size:i===0?32:16});});
    if(EN.phase==='end'){txt('Lv '+G.lv+'　プレイ '+Math.floor(G.time/216000)+':'+String(Math.floor(G.time/3600)%60).padStart(2,'0'),80,110,2,{align:'center'});
      if((st>>5)&1)txt('Aボタンで タイトルへ',80,126,3,{align:'center'});}}}
function drawCityLite(){for(const b of BLD){const hh=Math.round(b.h*.6),top=76-hh;R(b.x,top,b.w,hh,2);}}

/* ---------- loop ---------- */
function step(){st++;readInput();if(fade.on)updFade();const ok=!fade.on;if(shake>0)shake--;if(FLASH>0)FLASH--;updRain();updTimers();
  switch(scene){case 'title':updTitle(ok);break;case 'opening':updOpening(ok);break;case 'game':updGame(ok);break;case 'ending':updEnding(ok);break;}
  tickMusic();}
function render(){ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
  switch(scene){case 'boot':R(0,0,160,144,3);txt('LOADING…',80,68,1,{align:'center'});break;
    case 'title':renderTitle();break;case 'opening':renderOpening();break;case 'game':renderGame();break;case 'ending':renderEnding();break;}
  drawPad(scene==='game'&&!MN.open&&!SH.open);}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
const ALL=JSON.stringify(T)+JSON.stringify(WEAP)+JSON.stringify(ARMOR)+JSON.stringify(ITEMS)+JSON.stringify(MAGIC)+JSON.stringify(ENEMY)+JSON.stringify(BOSSDEF)+
  Object.values(MAPS).map(m=>m.name).join('')+'SHUDEN DENSETSU PRESS START ORIGINAL GB-STYLE RPG HP MP Lv%0123456789/©〜▶はじめからつづきからどうぐまほうそうびつよさきろくぶきあたまからだカバンなし×円必殺ストレスカギ声の種プレイけいけんつぎちからまもりおかねユウLOADING…B:スキップかうやめるとまるのるまだなにもないつかうBにセットはずすもちものがないAボタンでタイトルへこうげきぼうぎょ持E';
const fontsReady=document.fonts&&document.fonts.load?document.fonts.load('16px "DotGothic16"',ALL):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(()=>{scene='title';st=0;playSong('title');});

})();
