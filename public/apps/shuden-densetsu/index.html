<style>
/* Layout: one GB screen (160x144, 4-tone) floating on a dark field; translucent puni-stick + A/B + MENU overlaid. */
:root{
  --field:#121712; --field-hi:#1d241c;
  --lcd0:#d3dcb4; --lcd1:#8f9f72;
  --glass:rgba(220,236,200,.10); --glass-on:rgba(220,236,200,.30); --glass-line:rgba(220,236,200,.42);
  --pixel:"DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--field);overscroll-behavior:none}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
  background:radial-gradient(ellipse at 50% 28%, var(--field-hi) 0%, var(--field) 72%)}
#scr{position:absolute;image-rendering:crisp-edges;image-rendering:pixelated;
  box-shadow:0 0 0 3px #0b0f0b,0 0 0 5px #2a3326,0 18px 50px rgba(0,0,0,.6)}
#pc,#ov{position:absolute;inset:0;width:100%;height:100%}
#pc{z-index:1;pointer-events:none}
#ov{z-index:3;touch-action:none}
.btn{position:absolute;z-index:2;border-radius:50%;border:2px solid var(--glass-line);background:var(--glass);
  color:rgba(230,240,215,.72);font-family:var(--pixel);display:grid;place-items:center;pointer-events:none;
  transform:translate(-50%,-50%);transition:transform .06s,background .06s}
.btn.on{background:var(--glass-on);transform:translate(-50%,-50%) scale(.9)}
.pill{position:absolute;z-index:2;border-radius:999px;border:1.5px solid var(--glass-line);background:var(--glass);
  color:rgba(230,240,215,.7);font:12px var(--pixel);letter-spacing:.12em;display:grid;place-items:center;pointer-events:none;
  transform:translate(-50%,-50%);width:76px;height:26px}
.pill.on{background:var(--glass-on)}
#mute{position:absolute;z-index:4;top:10px;right:12px;font:12px var(--pixel);color:var(--lcd1);
  background:rgba(220,236,200,.06);border:1px solid rgba(220,236,200,.25);border-radius:999px;padding:4px 12px;cursor:pointer}
#mute:focus-visible{outline:2px solid var(--lcd0);outline-offset:2px}
#help{position:absolute;z-index:2;left:16px;right:16px;bottom:10px;text-align:center;font:12px var(--pixel);
  color:rgba(200,215,180,.45);pointer-events:none}
@media (pointer:coarse){#help{display:none}}

<div id="app">
  <canvas id="scr" width="640" height="576" aria-label="終電伝説 ゲーム画面"></canvas>
  <canvas id="pc"></canvas>

  <div id="help">移動 ←↑↓→ / WASD　A：Z（長押しで必殺技）　B：X（まほう・どうぐ）　MENU：Enter / C</div>

<script>
(()=>{
'use strict';
/* ================= CORE ================= */
const app=document.getElementById('app'),scr=document.getElementById('scr'),ctx=scr.getContext('2d');
const pc=document.getElementById('pc'),pcx=pc.getContext('2d'),ov=document.getElementById('ov');
const bA=document.getElementById('bA'),bB=document.getElementById('bB'),bM=document.getElementById('bM'),muteBtn=document.getElementById('mute');
ctx.imageSmoothingEnabled=false;

const P=['#d3dcb4','#8f9f72','#4b5b45','#1b231f']; // 0 light … 3 dark
let FADE=0;
const clamp=v=>v<0?0:v>3?3:v;
const C=i=>P[clamp(i+FADE)];
function R(x,y,w,h,i){ctx.fillStyle=C(i);ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function line(x0,y0,x1,y1,i,w=1){const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy))|0||1;for(let k=0;k<=n;k++)R(x0+dx*k/n-(w>>1),y0+dy*k/n-(w>>1),w,w,i);}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
/* ---------- i18n ---------- */
const SC=4; // canvas px per logical px
const LANGS=[['ja','日本語'],['en','English'],['zh-Hans','简体中文'],['zh-Hant','繁體中文'],['ko','한국어'],['fr','Français']];
const LFONT={ja:['','"DotGothic16", monospace'],en:['','"DotGothic16", monospace'],fr:['','"DotGothic16", monospace'],
  'zh-Hans':['500 ','"Noto Sans SC", "DotGothic16", sans-serif'],'zh-Hant':['500 ','"Noto Sans TC", "DotGothic16", sans-serif'],ko:['500 ','"Noto Sans KR", "DotGothic16", sans-serif']};
const SPACED={en:1,fr:1,ko:1};
let LANG='ja',DICT={};
function L(s,...a){let r=s;if(LANG!=='ja'&&typeof s==='string'){const t=DICT[s];if(t!=null)r=t;}
  return a.length?String(r).replace(/\{(\d)\}/g,(m,i)=>a[+i]):r;}
function fontFor(px,lang){const f=LFONT[lang||LANG]||LFONT.ja;return f[0]+px+'px '+f[1];}
function txt(s,x,y,ci,o={}){s=o.raw?String(s):L(String(s));ctx.save();ctx.setTransform(1,0,0,1,0,0);const sz=o.size||16,k=SC/2,px=sz*k;
  ctx.font=o.jp?px+'px "DotGothic16", monospace':fontFor(px,o.lang);ctx.textBaseline='alphabetic';ctx.textAlign=o.align||'left';
  const X=Math.round(x*SC),Y=Math.round(y*SC)+Math.round(px*.875);
  if(o.max){const w=ctx.measureText(s).width/SC;if(w>o.max){const f=o.max/w;ctx.translate(X,0);ctx.scale(f,1);ctx.translate(-X,0);}}
  if(o.shadow!=null){ctx.fillStyle=C(o.shadow);const d=(o.sd||4)*k;ctx.fillText(s,X+d,Y+d);}
  if(o.outline!=null){ctx.fillStyle=C(o.outline);const w=(o.ow||2)*k;for(const[a,b]of[[-w,0],[w,0],[0,-w],[0,w],[-w,-w],[w,w],[-w,w],[w,-w]])ctx.fillText(s,X+a,Y+b);}
  ctx.fillStyle=C(ci);ctx.fillText(s,X,Y);ctx.restore();}
const TWC=new Map();
function tw(s,sz=16,o={}){s=L(String(s));const key=LANG+'|'+sz+'|'+(o.jp?1:0)+'|'+s;let w=TWC.get(key);if(w!=null)return w;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);const px=sz*SC/2;ctx.font=o.jp?px+'px "DotGothic16", monospace':fontFor(px);w=ctx.measureText(s).width/SC;ctx.restore();
  if(TWC.size>4000)TWC.clear();TWC.set(key,w);return w;}
function wrap(s,max=18){const maxW=max*8+.5,out=[];
  for(const para of String(s).split('\n')){
    if(!SPACED[LANG]){let ln='';for(const ch of para){if(ln&&tw(ln+ch)>maxW){out.push(ln);ln='';}ln+=ch;}out.push(ln);continue;}
    let ln='';for(const word of para.split(/( +)/)){if(!word)continue;
      if(/^ +$/.test(word)){if(ln)ln+=word;continue;}
      if(!ln.trim()){ln='';}
      if(tw(ln+word)<=maxW){ln+=word;continue;}
      if(ln.trim()){out.push(ln.replace(/ +$/,''));ln='';}
      let w=word;while(tw(w)>maxW){let i=1;while(i<w.length&&tw(w.slice(0,i+1))<=maxW)i++;out.push(w.slice(0,i));w=w.slice(i);}ln=w;}
    out.push(ln.replace(/ +$/,''));}
  return out;}
function win(x,y,w,h){R(x,y,w,h,3);R(x+1,y+1,w-2,h-2,0);R(x+2,y+2,w-4,h-4,3);R(x+3,y+3,w-6,h-6,0);}
function cursor(x,y){y+=CURY;R(x,y,1,7,3);R(x+1,y+1,1,5,3);R(x+2,y+2,1,3,3);R(x+3,y+3,1,1,3);}
let CURY=0;

/* ---------- sprites ---------- */
const SPR={};
const sprCache=new Map();
function pad16(rows){const r=rows.map(s=>(s+'................').slice(0,16));while(r.length<16)r.push('................');return r;}
function sprCanvas(n,flip,f){const k=n+'|'+(flip?1:0)+'|'+f;let c=sprCache.get(k);if(c)return c;const rows=SPR[n];
  c=document.createElement('canvas');c.width=18;c.height=18;const g=c.getContext('2d');const op=new Uint8Array(18*18);
  if(rows)for(let y=0;y<rows.length&&y<16;y++){const r=rows[y];for(let x=0;x<16;x++){const ch=r[flip?15-x:x];if(ch==='.'||ch===undefined)continue;g.fillStyle=P[clamp(+ch+f)];g.fillRect(x+1,y+1,1,1);op[(y+1)*18+x+1]=1;}}
  g.fillStyle=P[clamp(3+f)];
  for(let y=0;y<18;y++)for(let x=0;x<18;x++){if(op[y*18+x])continue;
    if((x>0&&op[y*18+x-1])||(x<17&&op[y*18+x+1])||(y>0&&op[(y-1)*18+x])||(y<17&&op[(y+1)*18+x]))g.fillRect(x,y,1,1);}
  sprCache.set(k,c);return c;}
function spr(n,x,y,flip=false,f=FADE){ctx.drawImage(sprCanvas(n,flip,f),Math.round(x)-1,Math.round(y)-1);}
function remap(rows,m){return rows.map(r=>[...r].map(c=>m[c]!==undefined?m[c]:c).join(''));}

/* human templates: H hair, S skin, K skin shade, E eye, C clothes, A accent, P pants/skirt, F feet, O fixed dark */
const TP={
  shortD:['................','.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....','....HKSSSSKH....','....KSESSESK....','....KSSSSSSK....','.....KKSSKK.....'],
  shortU:['................','.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....','....HHHHHHHH....','....KHHHHHHK....','....KKHHHHKK....','.....KKKKKK.....'],
  shortS:['................','....HHHHHH......','...HHHHHHHH.....','...HHHHHHHHH....','...HHHHKSSS.....','...HHHKSSES.....','....HKSSSSS.....','.....KKSSK......'],
  longD:['................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHKSSSSKHH...','...HKSESSESKH...','...HKSSSSSSKH...','...HH.KSSK.HH...'],
  longU:['................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...','...HHHHHHHHHH...'],
  longS:['................','....HHHHHH......','...HHHHHHHH.....','..HHHHHHHHHH....','..HHHHHKSSS.....','..HHHHKSSES.....','..HHHKSSSSS.....','..HHH.KKSSK.....'],
  capD:['................','.....HHHHHH.....','....HHHHHHHH....','...OOOOOOOOOO...','....KSSSSSSK....','....KSESSESK....','....KSSSSSSK....','.....KKSSKK.....'],
  bodyD:['....CCCAACCC....','...KCCCAACCCK...','...KCCCAACCCK...','...KKCCAACCKK...'],
  bodyLD:['...HCCCAACCCH...','...KCCCAACCCK...','...KCCCAACCCK...','...KKCCAACCKK...'],
  bodyU:['....CCCCCCCC....','...KCCCCCCCCK...','...KCCCCCCCCK...','...KKCCCCCCKK...'],
  bodyS:['.....CCCACC.....','....CCCCACC.....','....CCKKC.......','....CCKKC.......'],
  bodyLS:['..HH.CCCACC.....','..H.CCCCACC.....','....CCKKC.......','....CCKKC.......'],
  legA:['....PPPPPPPP....','....PPP..PPP....','....PPP..PPP....','....FFF..FFF....'],
  legB:['....PPPPPPPP....','....PPP..PP.....','....PPP..PP.....','....FFF..FF.....'],
  skA:['...PPPPPPPPPP...','....PPPPPPPP....','.....SS..SS.....','.....FF..FF.....'],
  skB:['...PPPPPPPPPP...','....PPPPPPPP....','.....SS...SS....','.....FF...FF....'],
  legSA:['.....PPPPP......','.....PP.PP......','.....PP.PP......','.....FF.FFF.....'],
  legSB:['.....PPPPP......','....PP...PP.....','...PP.....PP....','...FF.....FF....'],
  skSA:['....PPPPPPP.....','.....PPPPP......','......S.S.......','......F.FF......'],
  skSB:['....PPPPPPP.....','.....PPPPP......','.....S...S......','.....F...F......']
};
function colorize(rows,cm){return rows.map(r=>[...r].map(c=>c==='.'?'.':c==='O'?'3':String(cm[c]!==undefined?cm[c]:3)).join(''));}
function makeHuman(name,style,cm){
  const L=style==='long',cap=style==='cap';
  const hd=cap?TP.capD:L?TP.longD:TP.shortD,hu=L?TP.longU:TP.shortU,hs=L?TP.longS:TP.shortS;
  const bd=L?TP.bodyLD:TP.bodyD,bs=L?TP.bodyLS:TP.bodyS;
  const la=L?TP.skA:TP.legA,lb=L?TP.skB:TP.legB,sa=L?TP.skSA:TP.legSA,sb=L?TP.skSB:TP.legSB;
  SPR[name+'_d']=colorize([...hd,...bd,...la],cm);SPR[name+'_d2']=colorize([...hd,...bd,...lb],cm);
  SPR[name+'_u']=colorize([...hu,...TP.bodyU,...la],cm);SPR[name+'_u2']=colorize([...hu,...TP.bodyU,...lb],cm);
  SPR[name+'_s']=colorize([...hs,...bs,...sa],cm);SPR[name+'_s2']=colorize([...hs,...bs,...sb],cm);
}
makeHuman('yu','short',{H:3,S:0,K:1,E:3,C:0,A:3,P:2,F:3});
makeHuman('mina','long',{H:3,S:0,K:1,E:3,C:0,A:3,P:3,F:3});
makeHuman('kuro','short',{H:3,S:0,K:1,E:3,C:3,A:0,P:3,F:3});
makeHuman('staff','cap',{H:2,S:0,K:1,E:3,C:1,A:3,P:3,F:3});
makeHuman('man','short',{H:3,S:0,K:1,E:3,C:1,A:3,P:2,F:3});
makeHuman('woman','long',{H:2,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('granny','long',{H:1,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('kid','short',{H:3,S:0,K:1,E:3,C:0,A:1,P:3,F:3});
makeHuman('student','long',{H:3,S:0,K:1,E:3,C:0,A:3,P:2,F:3});
makeHuman('clerk','cap',{H:3,S:0,K:1,E:3,C:0,A:2,P:2,F:3});
makeHuman('youth','short',{H:1,S:0,K:1,E:3,C:2,A:0,P:3,F:3});
makeHuman('zombie','short',{H:2,S:2,K:3,E:0,C:2,A:3,P:3,F:3});
makeHuman('mounter','short',{H:3,S:2,K:3,E:0,C:3,A:0,P:2,F:3});
makeHuman('stud','short',{H:3,S:1,K:2,E:1,C:3,A:0,P:3,F:3});
makeHuman('knight','cap',{H:1,S:2,K:3,E:0,C:1,A:3,P:3,F:3});
function humanFrame(base,dir,walk){const f=Math.floor(walk/7)%4;
  if(dir==='down')return[base+(f%2?'_d2':'_d'),f===3];
  if(dir==='up')return[base+(f%2?'_u2':'_u'),f===3];
  return[base+(f%2?'_s2':'_s'),dir==='left'];}

/* enemy shapes */
const E4='................';
SPR.blob=pad16([E4,E4,E4,E4,E4,E4,'......1111......','....11000011....','...1000000001...','..100300003001..','..103030030301..','.10000000000001.','.10000333300001.','.11000000000011.','..111111111111..']);
SPR.blob2=pad16([E4,E4,E4,E4,E4,E4,E4,E4,'...1111111111...','..100000000001..','.10030000003001.','1000000000000001','1000003333000001','1100000000000011','.11111111111111.']);
const PH=[E4,E4,'.....333333.....','.....300003.....'];
SPR.phone=pad16([...PH,'.11..301103..11.','.111.303303.111.','..11.300003.11..','.....300003.....','.....311113.....','.....300003.....','.....302203.....','.....333333.....']);
SPR.phone2=pad16([...PH,'.....301103.....','.....303303.....','..11.300003.11..','.111.300003.111.','.11..311113..11.','.....300003.....','.....302203.....','.....333333.....']);
const BUG=[E4,E4,E4,'.....333333.....','...3322222233...','..322000000223..','..320300003023..','..320000000023..','..322222222223..','...3333333333...'];
SPR.bug=pad16([...BUG,'..3.3..33..3.3..','.3..3..33..3..3.']);
SPR.bug2=pad16([...BUG,'...3.3.33.3.3...','...3..3..3..3...']);
const BOX=[E4,'..333333333333..','..300000000003..','..302222222203..','..302333333203..','..302222222203..','..300000000003..','..303300003303..','..300000000003..','..301111111103..'];
SPR.box=pad16([...BOX,'..303333333303..','..300000000003..','..333333333333..','...33......33...','...33......33...']);

SPR.board=remap(SPR.box,{'0':'2','2':'3','1':'0'});SPR.board2=remap(SPR.box2,{'0':'2','2':'3','1':'0'});
const PILE=[E4,'....11111111....','...1000000001...','...1022220201...','...1000000001...','..110000000011..'];
const PILEB=['..100000000001..','..122222222221..','..100000000001..','.11022002200211.','.10000000000001.','.12222222222221.','.10000000000001.','.11111111111111.'];
SPR.pile=pad16([...PILE,'..100300003001..',...PILEB]);
SPR.pile2=pad16([...PILE,'..100030030001..',...PILEB]);
const GH=[E4,'.....111111.....','....10000001....','...1000000001...','...1033003301...','...1033003301...','...1000000001...','...1000330001...','...1000000001...','...1000000001...','...1000000001...'];

SPR.shade=remap(SPR.ghost,{'0':'3','1':'2','3':'0'});SPR.shade2=remap(SPR.ghost2,{'0':'3','1':'2','3':'0'});
SPR.bird=pad16([E4,E4,'.33..........33.','.333........333.','..3333....3333..','...3333333333...','....33303333....','.....333333.....','......3113......','.......11.......']);
SPR.bird2=pad16([E4,E4,E4,E4,'.....333333.....','...3333033333...','..333333333333..','.333..3333..333.','.33...3113...33.','.......11.......']);
SPR.paper=remap(SPR.bird,{'3':'1','0':'3'});SPR.paper2=remap(SPR.bird2,{'3':'1','0':'3'});
const FLB=['..11100000011...','...1000330001...','...1003003001...','..100000000001..','..100000000001..','..100003300001..','...1000000001...','....11000011....','......1111......'];
SPR.flame=pad16([E4,'.......1........','......101.......','.....10001..1...','..1..100001.11..',...FLB]);
SPR.flame2=pad16([E4,'........1.......','.......101......','...1..10001.....','..11.100001..1..',...FLB]);

/* ---------- audio ---------- */
let AC=null,master=null,muted=false,songName=null,song=null,stepN=0,nextT=0;
const mtof=n=>440*Math.pow(2,(n-69)/12);
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.2;master.connect(AC.destination);playSong(songName);}catch(e){AC=null;}}
function tone(fr,dur,type='square',vol=.3,when=0,slide){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(n){if(!AC||muted)return;switch(n){

function drawPuni(bx,by,kx,ky,alpha=1){const dx=kx-bx,dy=ky-by,d=Math.hypot(dx,dy),rb=34-Math.min(9,d*.12),rk=23;
  pcx.lineWidth=2;pcx.strokeStyle=`rgba(220,236,200,${.5*alpha})`;pcx.fillStyle=`rgba(220,236,200,${.15*alpha})`;
  pcx.beginPath();
  if(d>4){const a=Math.atan2(dy,dx),n=Math.PI/2,neck=Math.max(7,rk*.8-d*.1),mx=(bx+kx)/2,my=(by+ky)/2;
    pcx.moveTo(bx+Math.cos(a+n)*rb,by+Math.sin(a+n)*rb);
    pcx.quadraticCurveTo(mx+Math.cos(a+n)*neck,my+Math.sin(a+n)*neck,kx+Math.cos(a+n)*rk,ky+Math.sin(a+n)*rk);
    pcx.arc(kx,ky,rk,a+n,a-n,true);
    pcx.quadraticCurveTo(mx+Math.cos(a-n)*neck,my+Math.sin(a-n)*neck,bx+Math.cos(a-n)*rb,by+Math.sin(a-n)*rb);
    pcx.arc(bx,by,rb,a-n,a+n,true);pcx.closePath();}
  else pcx.arc(bx,by,rb,0,Math.PI*2);
  pcx.fill();pcx.stroke();
  pcx.beginPath();pcx.arc(kx,ky,rk,0,Math.PI*2);pcx.fillStyle=`rgba(220,236,200,${.26*alpha})`;pcx.fill();pcx.stroke();
  pcx.beginPath();pcx.ellipse(kx-7,ky-8,7,4,-.5,0,Math.PI*2);pcx.fillStyle=`rgba(255,255,255,${.22*alpha})`;pcx.fill();}

傘がある。\n骨が一本、まがっている。":"长椅上放着一把塑料伞。\n有一根伞骨弯了。","ビニール傘 を手に入れた！":"得到了塑料伞！","Aボタンで ふりまわせる。\nゲージが たまるほど 強くなる。":"按A键挥动。\n计量槽越满，威力越强。","Aを おしっぱなしで ゲージをため、\n「必殺」が光ったら はなすと\n必殺技が でる。":"按住A键蓄力，\n等「必杀」闪烁时松开，\n就能使出必杀技。","MENUで どうぐ・そうび・\nきろく などが ひらける。":"按MENU可以打开\n道具、装备、记录等菜单。","手ぶらで 霧の中に出るのは\nさすがに こわい。":"空着手走进雾里，\n还是太可怕了。","改札を出ると、街は\n灰色の霧に しずんでいた。":"走出检票口，\n城市沉在灰色的浓雾之中。","信号は 青のまま。\nだれも 渡らない。":"信号灯一直是绿灯。\n却没有人过马路。","……なにか いる。":"……有什么东西。","ソンタク が あらわれた！\nうなずくことしか できない\n霧の魔物だ。":"忖度怪出现了！\n只会点头称是的\n雾之魔物。","ソンタクは\n「おっしゃるとおりです」と言って\n消えた。":"忖度怪说了一句\n“您说得对”\n就消失了。","霧が すこしだけ 晴れた。":"雾气稍微散开了一点。","広場の まんなかに\n枯れたイチョウが 見える。":"广场正中央\n能看到一棵枯萎的银杏。","霧が濃くて よく見えない。\nソンタクの気配がする。":"雾太浓了，看不清楚。\n能感觉到忖度怪的气息。","枯れたイチョウの幹に\n無数の付箋が はりついている。":"枯萎的银杏树干上\n贴满了无数便利贴。","『言えなかったこと』\n『ほんとうは いやでした』\n『たすけて』":"『没能说出口的话』\n『其实我很讨厌』\n『救救我』","……木のかげから\nだれかが 出てきた。":"……有人从树后\n走了出来。","制服の 少女が\nスケッチブックを こちらに むけた。":"一个穿校服的少女\n把素描本举向这边。","少女『たすけて』":"少女『救救我』","少女は ページをめくる。":"少女翻过一页。","少女『わたしは ミナ。\n声が でないの』":"少女『我叫美奈。\n我说不出话』","ミナ『この木は 声の樹。\nまちじゅうの 言えなかった声が\nここに あつまってくる』":"美奈『这棵树是声之树。\n全城说不出口的声音\n都会聚集到这里』","ミナ『でも 霧のヌシたちが\n声の種を 4つ もっていった』":"美奈『可是雾之主们\n抢走了4颗声之种』","ミナ『種を とりもどせば\nこの街は また しゃべれる』":"美奈『只要夺回种子，\n这座城市就能重新说话』","ミナ『……いっしょに きて くれる？』":"美奈『……你愿意和我一起去吗？』","ユウ「……会社は、どうするんだ。」\n自分の声に すこし おどろいた。":"悠：“……那公司怎么办。”\n自己的声音让他有点吃惊。","ミナ『会社は もうないよ。\nこの街には 朝が こないから』":"美奈『已经没有公司了。\n这座城市的早晨不会来』","ミナが なかまに くわわった！":"美奈加入了队伍！","東の霧が うすくなった。\nオフィス街へ 行けそうだ。":"东边的雾变淡了。\n似乎能去办公街区了。","ミナ『種が ひとつ もどった』":"美奈『夺回了一颗种子』","声の樹の 枝が ひとつ、\nかすかに 光った。":"声之树的一根枝条\n发出了微弱的光。","西の霧が うすくなった。\n団地へ 行けそうだ。":"西边的雾变淡了。\n似乎能去小区了。","声の樹の 枝が ふたつ 光った。":"声之树的两根枝条亮了。","ミナ『つぎは ……学校』\nミナの 手が すこし ふるえていた。":"美奈『下一个是……学校』\n美奈的手微微发抖。","南西の霧が うすくなった。":"西南边的雾变淡了。","声の樹の 枝が みっつ 光った。":"声之树的三根枝条亮了。","ミナ『最後の ヌシは 電波塔』\nミナ『いちばん うるさくて\nいちばん さびしい ところ』":"美奈『最后的主在电波塔』\n美奈『最吵闹，\n也最寂寞的地方』","南東の霧が うすくなった。":"东南边的雾变淡了。","4つの種が 声の樹に\nもどっていく。":"4颗种子\n回到了声之树。","枯れたイチョウが ……\nいっせいに 金色に そまった！":"枯萎的银杏……\n一下子染成了金色！","ミナ「……ユ……ウ……」":"美奈：“……悠……”","ミナ『こえ、すこし でた』":"美奈『声音，出来了一点』","ビニール傘が 光に\nつつまれていく。":"塑料伞被\n光芒  것.\n그것이 살아남는 방법이었다.","やがて街は 灰色の霧にしずみ、\n終電は 二度と来なくなった。":"이윽고 도시는 잿빛 안개에 잠기고\n막차는 두 번 다시 오지 않았다.","これは、終電を逃した\nひとりの会社員 ユウが\nビニール傘一本で\n声をとりもどす物語。":"이것은 막차를 놓친\n회사원 유가\n비닐우산 하나로\n목소리를 되찾는 이야기.","……。":"…….","最終電車、23時58分。\n通知に「承知しました」と\n返しているうちに、行ってしまった。":"막차, 23시 58분.\n메시지에 '확인했습니다'라고\n답하는 사이에 떠나 버렸다.","ホームには だれもいない。\n……いや、ひとりだけ。":"승강장에는 아무도 없다.\n……아니, 딱 한 사람.","駅員「おや、まだ人がいたのかい。」":"역무원 \"어이쿠, 아직 사람이 있었나.\"","駅員「電車なら、もう来ないよ。\n今日も、明日も。」":"역무원 \"전철이라면 이제 안 와.\n오늘도, 내일도.\"","駅員「この街じゃ みんな\n『すみません』しか言わなくなった。\n声の出しかたを 忘れたのさ。」":"역무원 \"이 도시 사람들은 다들\n'죄송합니다'밖에 말을 안 해.\n목소리 내는 법을 잊어버렸지.\"","駅員「外は霧だ。ソンタクが出る。\n丸腰じゃ あぶないよ。」":"역무원 \"밖은 안개야. 눈치꾼이 나와.\n맨손으로 나가면 위험해.\"","駅員「ベンチの忘れ物、もっていきな。\nどうせ だれも取りにこない。」":"역무원 \"벤치에 두고 간 물건, 가져가.\n어차피 아무도 찾으러 안 와.\"","駅員「大通りの先に\n枯れたイチョウがある。」":"역무원 \"큰길 끝에\n말라 죽은 은행나무가 있어.\"","駅員「昔は 待ち合わせの木だった。\n……今は だれも待たないがね。」":"역무원 \"옛날엔 약속 장소였지.\n……지금은 아무도 누굴 안 기다리지만.\"","ベンチの上に ビニール傘がある。\n骨が一本、まがっている。":"벤치 위에 비닐우산이 있다.\n우산살 하나가 휘어 있다.","ビニール傘 を手に入れた！":"비닐우산을 손에 넣었다!","Aボタンで ふりまわせる。\nゲージが たまるほど 強くなる。":"A 버튼으로 휘두를 수 있다.\n게이지가 찰수록 강해진다.","Aを おしっぱなしで ゲージをため、\n「必殺」が光ったら はなすと\n必殺技が でる。":"A를 누른 채 게이지를 모으고\n'필살'이 빛날 때 떼면\n필살기가 나간다.","MENUで どうぐ・そうび・\nきろく などが ひらける。":"MENU에서 도구·장비·\n기록 등을 열 수 있다.","手ぶらで 霧の中に出るのは\nさすがに こわい。":"맨손으로 안개 속에 나가는 건\n역시 무섭다.","改札を出ると、街は\n灰色の霧に しずんでいた。":"개찰구를 나서자 도시는\n잿빛 안개에 잠겨 있었다.","信号は 青のまま。\nだれも 渡らない。":"신호는 계속 파란불.\n아무도 건너지 않는다.","……なにか いる。":"……뭔가 있다.","ソンタク が あらわれた！\nうなずくことしか できない\n霧の魔物だ。":"눈치꾼이 나타났다!\n고개만 끄덕일 줄 아는\n안개의 마물이다.","ソンタクは\n「おっしゃるとおりです」と言って\n消えた。":"눈치꾼은\n\"지당하신 말씀입니다\"라고 말하며\n사라졌다.","霧が すこしだけ 晴れた。":"안개가 아주 조금 걷혔다.","広場の まんなかに\n枯れたイチョウが 見える。":"광장 한가운데에\n말라 죽은 은행나무가 보인다.","霧が濃くて よく見えない。\nソンタクの気配がする。":"안개가 짙어서 잘 안 보인다.\n눈치꾼의 기척이 느껴진다.","枯れたイチョウの幹に\n無数の付箋が はりついている。":"말라 죽은 은행나무 줄기에\n수많은 포스트잇이 붙어 있다.","『言えなかったこと』\n『ほんとうは いやでした』\n『たすけて』":"『말하지 못한 것』\n『사실은 싫었어요』\n『살려 주세요』","……木のかげから\nだれかが 出てきた。":"……나무 그늘에서\n누군가가 나왔다.","制服の 少女が\nスケッチブックを こちらに むけた。":"교복을 입은 소녀가\n스케치북을 이쪽으로 내밀었다.","少女『たすけて』":"소녀 『살려 줘』","少女は ページをめくる。":"소녀가 페이지를 넘긴다.","少女『わたしは ミナ。\n声が でないの』":"소녀 『나는 미나.\n목소리가 안 나와』","ミナ『この木は 声の樹。\nまちじゅうの 言えなかった声が\nここに あつまってくる』":"미나 『이 나무는 목소리 나무.\n도시에서 말하지 못한 목소리가\n여기로 모여들어』","ミナ『でも 霧のヌシたちが\n声の種を 4つ もっていった』":"미나 『그런데 안개의 주인들이\n목소리의 씨앗 4개를 가져갔어』","ミナ『種を とりもどせば\nこの街は また しゃべれる』":"미나 『씨앗을 되찾으면\n이 도시는 다시 말할 수 있어』","ミナ『……いっしょに きて くれる？』":"미나 『……같이 가 줄래?』","ユウ「……会社は、どうするんだ。」\n自分の声に すこし おどろいた。":"유 \"……회사는 어떡하고.\"\n자기 목소리에 조금 놀랐다.","ミナ『会社は もうないよ。\nこの街には 朝が こないから』":"미나 『회사는 이제 없어.\n이 도시엔 아침이 안 오니까』","ミナが なかまに くわわった！":"미나가 동료가 되었다!","東の霧が うすくなった。\nオフィス街へ 行けそうだ。":"동쪽 안개가 옅어졌다.\n오피스 거리로 갈 수 있을 것 같다.","ミナ『種が ひとつ もどった』":"미나 『씨앗 하나가 돌아왔어』","声の樹の 枝が ひとつ、\nかすかに 光った。":"목소리 나무의 가지 하나가\n희미하게 빛났다.","西の霧が うすくなった。\n団地へ 行けそうだ。":"서쪽 안개가 옅어졌다.\n아파트 단지로 갈 수 있을 것 같다.","声の樹の 枝が ふたつ 光った。":"목소리 나무의 가지 두 개가 빛났다.","ミナ『つぎは ……学校』\nミナの 手が すこし ふるえていた。":"미나 『다음은 ……학교』\n미나의 손이 조금 떨리고 있었다.","南西の霧が うすくなった。":"남서쪽 안개가 옅어졌다.","声の樹の 枝が みっつ 光った。":"목소리 나무의 가지 세 개가 빛났다.","ミナ『最後の ヌシは 電波塔』\nミナ『いちばん うるさくて\nいちばん さびしい ところ』":"미나 『마지막 주인은 전파탑』\n미나 『가장 시끄럽고\n가장 쓸쓸한 곳』","南東の霧が うすくなった。":"남동쪽 안개가 옅어졌다.","4つの種が 声の樹に\nもどっていく。":"4개의 씨앗이\n목소리 나무로 돌아간다.","枯れたイチョウが ……\nいっせいに 金色に そまった！":"말라 죽은 은행나무가……\n일제히 금빛으로 물들었다!","ミナ「……ユ……ウ……」":"미나 \"……유……\"","ミナ『こえ、すこし でた』":"미나 『목소리, 조금 나왔어』","ビニール傘が 光に\nつつまれていく。":"비닐우산이 빛에\n감싸여 간다.","始発の傘 を手に入れた！":"첫차의 우산을 손에 넣었다!","声の樹「……最後の霧は\n環状線の底で 朝を ふさいでいる」":"목소리 나무 \"……마지막 안개는\n순환선 밑바닥에서 아침을 막고 있다.\"","声の樹「始発に のりなさい。\n駅で、あのひとが まっている」":"목소리 나무 \"첫차를 타거라.\n역에서 그 사람이 기다리고 있다.\"","ミナ『オフィス街は 東。\n時計の 止まった ビルがある』":"미나 『오피스 거리는 동쪽.\n시계가 멈춘 빌딩이 있어』","ミナ『西の 団地。\n読まれない手紙が たまってる』":"미나 『서쪽의 아파트 단지.\n읽지 않은 편지가 쌓여 있어』","ミナ『南西の 学校。\n……わたしの いた ところ』":"미나 『남서쪽의 학교.\n……내가 있던 곳』","ミナ『南東の 電波塔。\nずっと 燃えてる』":"미나 『남동쪽의 전파탑.\n계속 불타고 있어』","声の樹「始発に のりなさい。\n駅で あのひとが まっている」":"목소리 나무 \"첫차를 타거라.\n역에서 그 사람이 기다리고 있다.\"","声の樹は 金色に かがやいている。":"목소리 나무가 금빛으로 빛나고 있다.","時計の 針の音が ひびいている。":"시곗바늘 소리가\n울려 퍼지고 있다.","？？？「まだ 帰るのか？」":"??? \"벌써 퇴근하나?\"","？？？「みんな のこってるぞ。\nおまえだけ 帰るのか？」":"??? \"다들 남아 있잖아.\n너만 퇴근하겠다고?\"","ザンギョウ が あらわれた！":"야근이 나타났다!","時計の針が ……うごきだした。":"시곗바늘이…… 움직이기 시작했다.","定時の鐘が 遠く const DEF=()=>1+Math.floor((G.lv-1)*.8)+['head','body','bag'].reduce((s,k)=>s+(G.eq[k]?ARMOR[G.eq[k]].def:0),0);
const needExp=lv=>Math.floor(6*Math.pow(lv,1.6))+4;
function newGame(){G={lv:1,exp:0,hp:30,mp:6,yen:300,ch:1,f:{},inv:{onigiri:3},keys:0,weapons:[],armor:['shirt'],
  eq:{w:null,head:null,body:'shirt',bag:null},magic:[],bslot:null,seeds:0,ms:{},time:0,mina:false,stress:0,
  rp:{map:'station',x:9.5,y:6},gauge:100,charge:0,minaCD:0,cut:false,dying:0};newPlayer();}
function newPlayer(){Pl={x:0,y:0,dir:'down',walk:0,atk:0,atkDur:1,inv:0,kx:0,ky:0,barrier:0,sp:null,charging:false,pow:100,swing:0,tileHit:true,anim:false};}
function addItem(id,n){G.inv[id]=Math.max(0,Math.min(9,(G.inv[id]||0)+n));if(!G.inv[id]){delete G.inv[id];if(G.bslot&&G.bslot.k==='item'&&G.bslot.id===id)G.bslot=null;}}
function heal(n){G.hp=Math.min(maxHP(),G.hp+n);}
function learn(id){if(!G.magic.includes(id))G.magic.push(id);if(!G.bslot)G.bslot={k:'magic',id};sfx('get');}

/* ---------- toasts / fx ---------- */
function toast(t){TOASTS.push({text:L(t),t:0});}
function toastOnce(t){t=L(t);if(!TOASTS.some(x=>x.text===t))toast(t);}
function num(x,y,v,c){FX.push({k:'num',x,y,s:String(v),t:0,c,life:40});}

/* ---------- tiles ---------- */
function eff(x,y){if(!MAP||y<0||y>=MAP.rows.length||x<0||x>=MAP.rows[0].length)return '#';const c=MAP.rows[y][x],k=x+','+y;
  if(MS.rm[k])return MAP.ground||'.';
  if(c==='C'&&MS.op[k])return 'O';
  if(c==='G'&&MS.gate)return MAP.ground||'.';
  if(c>='1'&&c<='7')return G.ch>=+c?(MAP.ground||','):c;
  return c;}
const tileAt=(px,py)=>eff(Math.floor(px/16),Math.floor(py/16));
function solidBox(b){for(const[x,y]of[[b.x,b.y],[b.x+b.w-.01,b.y],[b.x,b.y+b.h-.01],[b.x+b.w-.01,b.y+b.h-.01]])if(SOLID.has(tileAt(x,y)))return true;return false;}
function npcBlock(b){for(const n of NPCS)if(overlap(b,{x:n.px+3,y:n.py+8,w:10,h:7}))return true;return false;}
function moveBox(o,dx,dy,B,pl){const test=()=>{const b=box(o,B);return solidBox(b)||(pl&&npcBlock(b));};
  if(dx){o.x+=dx;if(test())o.x-=dx;}if(dy){o.y+=dy;if(test())o.y-=dy;}}
const mapCache=new Map();function invalidate(){mapCache.clear();}
function paintTile(g,ch,tx,ty,CI,th){
  const R2=(x,y,w,h,i)=>{g.fillStyle=CI(i);g.fillRect(tx*16+x,ty*16+y,w,h);};
  const v=hash(tx,ty);
  const noise=(n,c)=>{for(let k=0;k<n;k++){const h=hash(tx*7+k,ty*13+k*3);R2(h%16,(h>>4)%16,1,1,c);}};
  const ground=()=>{if(th==='yard'){R2(0,0,16,16,1);noise(6,2);}else if(th==='loop'){R2(0,0,16,16,2);noise(8,3);noise(2,1);}else{R2(0,0,16,16,2);noise(5,3);}};
  const floor=()=>{switch(th){
    case 'station':case 'loop':case 'city':R2(0,0,16,16,1);R2(0,15,16,1,2);R2(15,0,1,16,2);if(v%3===0)R2(4+v%6,6,1,1,2);break;
    case 'shop':{const c=((tx+ty)&1)?0:1;R2(0,0,16,16,c);R2(0,15,16,1,c?2:1);break;}
    case 'office':R2(0,0,16,16,1);for(let y=1;y<16;y+=4)for(let x=((y>>2)&1)?3:1;x<16;x+=4)R2(x,y,1,1,2);break;
    case 'danchi':R2(0,0,16,16,1);noise(5,2);R2(0,0,16,1,2);break;
    case 'school':case 'yard':R2(0,0,16,16,1);for(let y=3;y<16;y+=4)R2(0,y,16,1,2);R2((v%3)*5,0,1,3,2);R2(((v>>2)%3)*5+2,4,1,3,2);R2(((v>>4)%3)*5+1,8,1,3,2);R2(((v>>6)%3)*5+3,12,1,3,2);break;
    case 'tower':R2(0,0,16,16,2);for(let i=0;i<16;i+=4){R2(i,0,1,16,3);R2(0,i,16,1,3);}break;
    default:R2(0,0,16,16,1);}};
  const under=()=>MAP.ground===','?ground():floor();
  const wall=()=>{switch(th){
    case 'city':R2(0,0,16,16,3);for(let i=0;i<4;i++){const wx=2+(i%2)*8,wy=2+(i>>1)*8;const lit=((v>>i)&1)&&((v>>(i+4))&1)&&((v>>(i+9))&1);R2(wx,wy,4,4,lit?1:2);}break;
    case 'station':R2(0,0,16,16,3);R2(0,7,16,1,2);R2(7,0,1,7,2);break;
    case 'shop':R2(0,0,16,16,1);R2(0,0,16,2,2);R2(0,12,16,4,2);R2(0,12,16,1,3);break;
    case 'office':R2(0,0,16,16,2);R2(0,0,16,1,3);R2(7,1,1,15,3);R2(0,15,16,1,3);break;
    case 'danchi':R2(0,0,16,16,2);R2(0,15,16,1,3);R2(3+v%8,2,1,4,3);R2(4+v%8,6,1,3,3);R2((v>>3)%12,10,3,2,1);break;
    case 'school':case 'yard':R2(0,0,16,16,0);R2(0,9,16,7,1);R2(0,9,16,1,2);R2(0,15,16,1,2);break;
    case 'tower':R2(0,0,16,16,3);R2(0,0,16,1,2);R2(0,8,16,1,2);R2(2,3,1,1,1);R2(13,3,1,1,1);R2(2,11,1,1,1);R2(13,11,1,1,1);break;
    case 'loop':R2(0,0,16,16,3);for(let y=0;y<16;y+=4){const o=((y>>2)&1)?4:0;R2(0,y,16,1,2);for(let x=o;x<16;x+=8)R2(x,y,1,4,2);}break;
    default:R2(0,0,16,16,3);}};
  switch(ch){
    case '.':floor();break;
    case ',':case 'T':ground();break;
    case '*':R2(0,0,16,16,1);for(let k=0;k<6;k++){const h=hash(tx*5+k,ty*9+k);R2(h%14,(h>>4)%14,1,2,k&1?2:0);}break;
    case '#':wall();break;
    case 'W':R2(0,0,16,16,(th==='yard'||th==='school')?1:3);for(let i=0;i<4;i++){const wx=1+(i%2)*8,wy=2+(i>>1)*7;R2(wx,wy,6,5,(th==='yard'?2:((v>>i)&1)&&((v>>(i+5))&1)?1:2));}break;
    case 'w':ground();R2(2,1,5,14,1);R2(10,1,5,14,1);break;
    case ':':R2(0,0,16,16,0);for(let y=2;y<16;y+=4)for(let x=2;x<16;x+=4)R2(x,y,2,2,1);break;
    case '_':R2(0,0,16,16,1);R2(0,0,16,5,3);R2(0,5,16,2,0);R2(0,15,16,1,2);break;
    case '=':R2(0,0,16,16,2);noise(6,3);R2(1,0,3,16,3);R2(9,0,3,16,3);R2(0,3,16,2,1);R2(0,11,16,2,1);R2(0,3,16,1,0);R2(0,11,16,1,0);break;
    case 'b':under();R2(1,2,14,3,2);R2(1,2,14,1,3);R2(1,7,14,4,3);R2(1,7,14,1,2);R2(2,11,2,3,3);R2(12,11,2,3,3);break;
    case 'v':R2(0,0,16,16,3);R2(1,1,14,14,0);R2(2,2,12,7,1);for(let i=0;i<4;i++){R2(3+i*3,3,2,2,3);R2(3+i*3,6,2,2,2);}R2(3,11,7,2,3);R2(11,10,2,2,2);break;
    case 'k':under();R2(1,0,14,13,3);R2(2,1,12,11,2);R2(3,3,10,1,1);R2(3,6,10,1,1);R2(3,9,6,1,1);R2(3,13,2,3,3);R2(11,13,2,3,3);break;
    case 'S':R2(0,0,16,16,2);for(let y=0;y<16;y+=4){R2(0,y,16,2,1);R2(0,y,16,1,0);}break;
    case 'L':ground();R2(7,4,2,11,3);R2(5,1,6,3,3);R2(6,2,4,2,0);R2(6,13,4,3,3);break;
    case 'g':R2(0,0,16,16,3);R2(1,1,14,14,2);for(let k=0;k<7;k++){const h=hash(tx*11+k,ty*3+k);R2(1+h%12,1+(h>>4)%12,3,2,(h>>8)&1?1:3);}break;
    case 'd':under();R2(0,4,16,9,2);R2(0,4,16,2,1);R2(1,13,2,3,3);R2(13,13,2,3,3);if(v&1){R2(4,0,8,7,3);R2(5,1,6,4,1);}else{R2(3,5,6,3,0);R2(10,6,4,2,0);}break;
    case 'c':under();R2(1,1,14,14,3);R2(2,2,12,12,1);R2(2,2,12,3,0);R2(9,7,4,2,2);R2(3,9,8,3,2);break;
    case 'Y':under();R2(0,0,16,16,2);R2(0,5,16,1,3);R2(0,10,16,1,3);for(let i=0;i<5;i++){R2(1+i*3,1,2,4,(v>>i)&1?0:1);R2(1+i*3,6,2,4,(v>>(i+5))&1?0:3);R2(1+i*3,11,2,4,1);}break;
    case 'q':under();R2(0,7,16,9,2);R2(0,7,16,1,1);R2(3,0,10,8,3);R2(4,1,8,5,(v&1)?1:0);break;
    case 'u':under();R2(0,2,16,14,2);R2(0,2,16,2,1);R2(0,15,16,1,3);break;
    case 'p':under();R2(3,0,10,16,2);R2(3,0,2,16,1);R2(11,0,2,16,3);R2(2,13,12,3,3);break;
    case 'f':under();R2(0,5,16,2,3);R2(0,11,16,1,3);for(const x of[1,6,11])R2(x,2,2,13,3);break;
    case 'l':R2(0,0,16,16,2);R2(0,0,1,16,3);R2(15,0,1,16,3);R2(7,0,2,16,3);for(let y=0;y<4;y++){R2(2,2+y*2,4,1,3);R2(10,2+y*2,4,1,3);}R2(5,9,1,2,0);R2(13,9,1,2,0);break;
    case 'B':wall();R2(0,2,16,10,3);R2(0,2,16,1,1);R2(0,11,16,1,1);R2(3+v%4,5,6,1,0);R2(4,8,5+v%3,1,1);break;
    case 'R':R2(0,0,16,16,3);R2(1,1,14,14,2);for(let y=2;y<14;y+=3){R2(2,y,12,2,3);R2(11,y,1,1,(hash(tx,y+ty)&1)?0:1);}break;
    case 'm':R2(0,0,16,16,2);for(const y of[1,6,11])for(const x of[1,6,11]){R2(x,y,4,4,3);R2(x+1,y+1,2,1,(hash(x+tx,y+ty)%3===0)?0:2);}break;
    case 'n':under();for(let i=0;i<5;i++){R2(2,12-i*2,12,2,i&1?0:1);R2(2,12-i*2,12,1,2);}R2(4,3,8,1,0);break;
    case 'o':R2(0,0,16,16,3);if(v%4===0)R2(v%14,(v>>4)%14,1,1,2);break;
    case 'x':under();R2(1,2,14,13,2);R2(2,3,12,11,1);R2(7,3,2,11,0);R2(2,8,12,1,2);R2(1,14,14,1,3);break;
    case 't':under();R2(1,4,14,10,3);R2(0,6,16,6,3);R2(3,6,4,2,2);R2(9,9,3,1,2);break;
    case 'h':R2(0,0,16,16,3);R2(2,2,12,12,1);R2(3,3,10,10,0);for(let i=4;i<12;i++){R2(i,i,1,1,3);R2(15-i,i,1,1,3);}break;
    case 'G':under();R2(1,0,3,16,3);R2(12,0,3,16,3);R2(4,6,8,3,0);R2(4,6,8,1,1);break;
    case 'r':R2(0,0,16,16,3);R2(6,6,4,10,2);R2(4,2,8,6,1);R2(5,3,6,3,0);R2(9,7,1,1,0);break;
    case 'K':R2(0,0,16,16,3);R2(2,0,12,16,2);R2(3,1,10,15,1);R2(7,7,2,3,3);R2(11,8,2,1,3);break;
    case '+':R2(0,0,16,16,3);R2(0,0,16,2,2);R2(0,0,2,16,2);R2(14,0,2,16,2);R2(3,13,10,3,2);break;
    case 'C':under();R2(2,4,12,10,3);R2(3,5,10,8,2);R2(3,5,10,3,1);R2(3,8,10,1,3);R2(7,8,2,3,0);break;
    case 'O':under();R2(2,6,12,8,3);R2(3,7,10,6,2);R2(3,2,10,4,1);R2(3,2,10,1,3);R2(4,8,8,2,3);break;
    default:if(ch>='1'&&ch<='7'){ground();for(let y=0;y<16;y++)for(let x=(y&1);x<16;x+=2)R2(x,y,1,1,((x+y*3+v)%5)?1:0);}else under();}
}
function mapC(f){let c=mapCache.get(f);if(c)return c;c=document.createElement('canvas');c.width=MW;c.height=MH;
  const g=c.getContext('2d');const CI=i=>P[clamp(i+f)];const rows=MAP.rows;
  for(let ty=0;ty<rows.length;ty++)for(let tx=0;tx<rows[0].length;tx++)paintTile(g,eff(tx,ty),tx,ty,CI,MAP.theme);
  g.fillStyle=CI(1);
  for(let ty=0;ty<rows.length;ty++)for(let tx=0;tx<rows[0].length;tx++){if(rows[ty][tx]!=='L')continue;const lx=tx*16+8,ly=ty*16+3;
    for(let y=ly-2;y<ly+32;y++)for(let x=lx-28;x<lx+28;x++){const ch=tileAt(x,y);if(ch!==','&&ch!=='w')continue;const d=Math.hypot((x-lx)*.8,y-ly-10);
      if((d<12&&((x+y)&1)===0)||(d<24&&(x&1)===0&&(y&1)===0))g.fillRect(x,y,1,1);}}
  mapCache.set(f,c);return c;}

/* ---------- map load ---------- */
function loadMap(id,tx,ty,dir){SH.open=false;MN.open=false;MID=id;MAP=MAPS[id];MS=G.ms[id]||(G.ms[id]={rm:{},op:{},gate:false});
  MW=MAP.rows[0].length*16;MH=MAP.rows.length*16;invalidate();
  Pl.x=tx*16;Pl.y=ty*16;Pl.dir=dir||Pl.dir;Pl.kx=Pl.ky=0;Pl.atk=0;Pl.sp=null;Pl.anim=false;
  ENT=[];BUL=[];PSH=[];FX=[];PICK=[];BOSS=null;
  (MAP.enemies||[]).forEach(([k,x,y])=>spawnEnemy(k,x,y));
  if(id==='avenue'&&G.f.street&&!G.f.wave1clear)[[10,10],[21,10],[11,14],[20,14],[8,8]].forEach(([x,y],i)=>spawnEnemy(i<4?'sontaku':'kidoku',x,y));
  refreshNPCs();
  if(MAP.rp)G.rp={map:id,x:MAP.rp[0],y:MAP.rp[1]};
  FOGP=[];if(MAP.fog)for(let i=0;i<60;i++){const h=hash(i,99);FOGP.push({x:h%MW,y:(h>>9)%MH,w:3+(h>>4)%6,s:.1+((h>>12)%10)/40});}
  resetTrail();playSong(MAP.music);TOASTS=[];toast(MAP.name);
  if(MAP.onEnter)MAP.onEnter();updCam();}
function refreshNPCs(){NPCS=(MAP.npcs||[]).filter(n=>!n.if||n.if()).map(n=>({...n,px:n.x*16,py:n.y*16,face:'down'}));}
function warp(id,x,y,dir){if(fade.on)return;G.cut=true;sfx('door');fadeTo(()=>{G.cut=false;loadMap(id,x,y,dir);});}
function updCam(){const tx=Pl.x+8-80,ty=Pl.y+8-64;
  camX=MW<=160?Math.round((MW-160)/2):Math.round(Math.max(0,Math.min(MW-160,tx)));
  camY=MH<=128?Math.round((MH-128)/2):Math.round(Math.max(0,Math.min(MH-128,ty)));}
function resetTrail(){const v=DV[Pl.dir]||[0,1],bx=Pl.x-v[0]*17,by=Pl.y-v[1]*17;TRAIL=[{x:bx,y:by},{x:Pl.x,y:Pl.y}];MINA={x:bx,y:by,dir:Pl.dir,walk:0,mv:0};}
const onScreen=o=>o.x+16>camX&&o.x<camX+160&&o.y+16>camY&&o.y<camY+128;

/* ---------- interaction ---------- */
function give(code,silent){const[t,a,b]=code.split(':');let msg='',extra='';
  if(t==='key'){G.keys++;msg='カードキー を手に入れた！';}
  else if(t==='yen'){G.yen+=+a;msg=L('{0}円 を手に入れた！',a);}
  else if(t==='i'){const n=+(b||1);addItem(a,n);msg=L('{0} を手に入れた！',L(ITEMS[a].name)+(n>1?' ×'+n:''));}
  else if(t==='w'){if(!G.weapons.includes(a))G.weapons.push(a);G.eq.w=a;msg=L('{0} を手に入れた！',L(WEAP[a].name));extra=L(WEAP[a].desc)+'\n'+L('（MENUの そうびで もちかえ）');}
  else if(t==='a'){if(!G.armor.includes(a))G.armor.push(a);msg=L('{0} を手に入れた！',L(ARMOR[a].name));extra='MENUの そうびで 身につけよう。';}
  sfx(t==='w'?'get':'item');if(!silent)say(extra?[msg,extra]:[msg]);}
function openChest(tx,ty){const k=tx+','+ty;MS.op[k]=1;invalidate();sfx('door');give((MAP.chests||{})[k]||'yen:100');}
function vending(){say(['つめたいお茶 130円。'],null,{opts:['かう','やめる'],on:i=>{if(i)return;if(G.yen<130)return say(['おかねが たりない。']);
  G.yen-=130;heal(30);sfx('heal');say(['……ガコン。\nHPが 30 かいふくした！']);}});}
function inn(){say(['いらっしゃいませ。\nナイトパック 300円です。\n（かいふく＋きろく）'],null,{opts:['とまる','やめる'],on:i=>{
  if(i!==0)return say(['またの ごりようを。']);if(G.yen<300)return say(['おかねが たりない。']);
  G.yen-=300;G.cut=true;fadeTo(()=>{G.hp=maxHP();G.mp=maxMP();G.stress=0;G.cut=false;const ok=saveGame();
    wait(24,()=>say(['……ぐっすり ねむった。\nHPと MPが かいふくした。',ok?'（きろくしました）':'（きろくに 失敗しました。\nブラウザの 保存設定を\n確認してください）']));});}});}
function treeTalk(){
  if(G.ch===1){if(!G.f.wave1clear)return say(T.treeFog);
    return say(T.tree1,()=>{G.ch=2;G.mina=true;G.f.tree1=1;invalidate();resetTrail();sfx('get');});}
  for(const[n,key,ch]of[[1,'tree2',3],[2,'tree3',4],[3,'tree4',5],[4,'tree5',6]]){
    if(G.seeds>=n&&!G.f[key]){G.f[key]=1;return say(T[key],()=>{G.ch=ch;invalidate();sfx('get');
      if(key==='tree5'){if(!G.weapons.includes('dawn'))G.weapons.push('dawn');G.eq.w='dawn';FLASH=20;}});}}
  say(T.treeIdle[G.ch]||T.treeIdle[7]);}
function tryInteract(){const v=DV[Pl.dir],ix=Pl.x+8+v[0]*14,iy=Pl.y+12+v[1]*14;
  for(const n of NPCS)if(ix>=n.px&&ix<n.px+16&&iy>=n.py-2&&iy<n.py+16){n.face=OPP[Pl.dir];n.talk(n);return true;}
  const tx=Math.floor(ix/16),ty=Math.floor(iy/16),c=eff(tx,ty),k=tx+','+ty;
  switch(c){
    case 'C':openChest(tx,ty);return true;
    case 'O':say(['からっぽだ。']);return true;
    case 'K':if(G.keys>0){G.keys--;MS.rm[k]=1;invalidate();sfx('door');say(['カードキーを つかった。\nドアが ひらいた！']);}else say(['カギが かかっている。\nカードキーが いりそうだ。']);return true;
    case 'k':say([(MAP.signs||{})[k]||'かすれて 読めない。']);return true;
    case 'v':vending();return true;
    case 'u':if(MAP.shop)openShop(MAP.shop);else if(MAP.inn)inn();return true;
    case 'T':treeTalk();return true;
    case 'b':{const bn=(MAP.benches||{})[k];
      if(bn==='umb'&&!G.f.umb){say(T.umb.slice(0,1),()=>{G.f.umb=1;G.weapons.push('umb');G.eq.w='umb';sfx('get');say(T.umb.slice(1));});}

function bossIntro(lines,kind,tx,ty,onWin){const seen=G.f['bi_'+kind];G.f['bi_'+kind]=1;G.cut=true;playSong(null);
  wait(24,()=>say(seen?lines.slice(-1):lines,()=>{G.cut=false;spawnBoss(kind,tx,ty,onWin);playSong('boss');}));}
function spawnBoss(kind,tx,ty,onWin){const d=BOSSDEF[kind];BOSS={kind,d,x:tx*16,y:ty*16,hp:d.hp,t:0,flash:0,hit:-1,st:'',stT:60,vx:0,vy:0,dead:0,onWin,vis:true,dir:'down',walk:0};}
function bossBox(){const b=BOSS;return{x:b.x+2,y:b.y+2,w:b.d.w-4,h:b.d.h-4};}
function hitBoss(dmg){const b=BOSS;if(!b||b.dead||!b.vis)return;b.hp-=dmg;b.flash=8;num(b.x+b.d.w/2,b.y,dmg,0);sfx('hit');if(b.hp<=0){b.hp=0;bossDie();}}
function bossDie(){const b=BOSS;b.dead=1;BUL=[];ENT.forEach(e=>{if(!e.dead)e.dead=1;});G.cut=true;playSong(null);
  if(b.kind==='minna'){FLASH=20;shake=20;sfx('boom');wait(60,()=>{BOSS=null;say(T.finalMid,()=>{G.cut=false;spawnBoss('minna2',8,7,null);playSong('boss');});});return;}
  sfx('boom');shake=30;
  for(let i=0;i<10;i++)wait(i*6,()=>{FX.push({k:'puff',x:b.x+Math.random()*b.d.w,y:b.y+Math.random()*b.d.h,t:0});sfx('puff');});
  wait(80,()=>{BOSS=null;gainExp(b.d.exp);G.yen+=b.d.yen;if(b.d.exp)toast(L('{0}けいけんち',b.d.exp)+(b.d.yen?'  '+L('{0}円',b.d.yen):''));
    if(b.kind==='minna2'){finale();return;}
    playSong(MAP.music);G.cut=false;b.onWin&&b.onWin();});}
function clampBoss(b){b.x=Math.max(16,Math.min(MW-16-b.d.w,b.x));b.y=Math.max(16,Math.min(MH-16-b.d.h,b.y));}
function aliveN(){return ENT.filter(e=>!e.dead).length;}
function updBoss(){const b=BOSS;if(!b||b.dead)return;b.t++;if(b.flash)b.flash--;
  const cx=b.x+b.d.w/2,cy=b.y+b.d.h/2,px=Pl.x+8,py=Pl.y+12,dx=px-cx,dy=py-cy,dist=Math.hypot(dx,dy)||1;
  const aim=(sp,o=0)=>{const a=Math.atan2(dy,dx)+o;return[Math.cos(a)*sp,Math.sin(a)*sp];};
  const ring=(n,sp,k,off=0)=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2+off;fireBullet(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,k,b.d.atk*.8);}};
  const atk=b.d.atk,half=b.hp<b.d.hp/2;
  switch(b.kind){
    case 'zangyou':{const c=b.t%240;if(c<120||c>=180){b.x+=dx/dist*.4;b.y+=dy/dist*.4;b.walk++;}
      if(c===150)for(let i=-2;i<=2;i++){const[vx,vy]=aim(1.6,i*.25);fireBullet(cx,cy,vx,vy,'paper',atk*.8);}
      if(half&&b.t%300===0&&aliveN()<3)spawnEnemy('shachiku',Math.floor(b.x/16)+1,Math.floor(b.y/16)+2);break;}
    case 'muen':
      if(b.st==='out'){if(--b.stT<=0){b.vis=false;b.st='hide';b.stT=30;const r=hash(b.t,9);b.x=24+r%(MW-80);b.y=24+(r>>8)%(MH-96);}}
      else if(b.st==='hide'){if(--b.stT<=0){b.vis=true;b.st='in';b.stT=20;}}
      else if(b.st==='in'){if(--b.stT<=0)b.st='';}
      else{b.x+=Math.cos(b.t*.03)*.6+dx/dist*.15;b.y+=Math.sin(b.t*.045)*.5+dy/dist*.1;
        if(b.t%(half?80:100)===0)ring(half?12:8,half?1.5:1.2,'letter',b.t*.01);
        if(b.t%360===0){b.st='out';b.stT=20;}}break;
    case 'kurokawa':
      if(b.st==='wind'){if(--b.stT<=0){b.st='dash';b.stT=18;}}
      else if(b.st==='dash'){moveBox(b,b.vx,b.vy,EB);b.walk+=2;if(--b.stT<=0){b.st='throw';b.stT=20;}}
      else if(b.st==='throw'){if(b.stT===20)for(let i=-1;i<=1;i++){const[vx,vy]=aim(2,i*.3);fireBullet(cx,cy,vx,vy,'card',atk*.8);}if(--b.stT<=0){b.st='';b.stT=half?40:70;}}
      else{const s=Math.sin(b.t*.05);moveBox(b,dx/dist*.5-dy/dist*s*.6,dy/dist*.5+dx/dist*s*.6,EB);b.walk++;
        if(--b.stT<=0){b.st='wind';b.stT=24;b.vx=dx/dist*3.2;b.vy=dy/dist*3.2;}}
      b.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');break;
    case 'doucho':{const L=24,Rr=MW-24-b.d.w;b.x=L+(Rr-L)*(.5+.5*Math.sin(b.t*.012));b.y=24+Math.sin(b.t*.05)*4;
      if(b.t%120===60)ring(10,1.2,'chalk',b.t*.02);
      if(b.t%220===0&&aliveN()<3)spawnEnemy('douchousei',Math.floor(cx/16),Math.floor(b.y/16)+3);
      if(half&&b.t%60===30)for(let i=-1;i<=1;i++){const[vx,vy]=aim(1.8,i*.2);fireBullet(cx,cy,vx,vy,'chalk',atk*.8);}break;}
    case 'enjou':
      if(b.st==='dive'){b.x+=b.vx;b.y+=b.vy;if(--b.stT<=0)b.st='ret';}
      else if(b.st==='ret'){const tx=(MW-b.d.w)/2,ty=20;b.x+=(tx-b.x)*.05;b.y+=(ty-b.y)*.05;if(Math.abs(ty-b.y)<2)b.st='';}
      else if(b.st==='wind'){if(--b.stT<=0){b.st='dive';b.stT=40;b.vx=dx/dist*2.6;b.vy=dy/dist*2.6;}}
      else{b.x=(MW-b.d.w)/2+Math.sin(b.t*.015)*((MW-b.d.w)/2-20);b.y=20+Math.sin(b.t*.04)*8;
        if(b.t%70===0)for(let i=-1;i<=1;i++){const[vx,vy]=aim(1.6,i*.3);fireBullet(cx,cy,vx,vy,'fire',atk*.8);}
        if(b.t%150===75)fireBullet(px,py+2,0,0,'puddle',atk*.6,220);
        if(half&&b.t%400===200){b.st='wind';b.stT=30;}}break;
    case 'minna':b.x=(MW-b.d.w)/2;b.y=18+Math.sin(b.t*.03)*3;
      if(b.t%90===0)for(let i=-1;i<=1;i++){const[vx,vy]=aim(2,i*.15);fireBullet(cx+(i*14),cy,vx,vy,'beam',atk*.8);}
      if(b.t%170===0&&aliveN()<4){spawnEnemy('kage',3,8);spawnEnemy('kage',14,8);}
      if(b.t%240===120)ring(16,1,'beam',b.t*.01);break;
    case 'minna2':{const c=b.t%160;
      if(c<20){b.vis=(b.t&2)>0;}else if(c<40){b.vis=false;if(c===20){const r=hash(b.t,3);b.x=24+r%(MW-72);b.y=80+(r>>8)%Math.max(8,MH-140);}}
      else if(c<60){b.vis=(b.t&2)>0||c>55;}
      else{b.vis=true;b.x+=dx/dist*.3;b.y+=dy/dist*.3;if(c<120&&b.t%6===0)for(let k=0;k<3;k++){const a=b.t*.25+k*Math.PI*2/3;fireBullet(cx,cy,Math.cos(a)*1.5,Math.sin(a)*1.5,'beam',atk*.8);}}break;}}
  clampBoss(b);
  if(b.vis&&overlap(box(Pl,PB),bossBox()))hurt(atk,b,b.kind==='muen'||b.kind==='minna2');}

  txt('SHUDEN DENSETSU',80,14,1,{align:'center',jp:1});
  txt('終電伝説',80,24,0,{size:64,align:'center',outline:3,ow:3,shadow:2,sd:6,jp:1,raw:1});
  txt('〜 声のない街 〜',80,62,1,{align:'center',outline:3});
  if(hasSave()){const lab=['はじめから','つづきから'],w=Math.max(...lab.map(s=>tw(s))),x0=Math.round(80-w/2);
    lab.forEach((s,i)=>{txt(s,x0,98+i*12,i===TI.cur?0:1,{outline:3});if(i===TI.cur)cursor(x0-8,98+i*12);});}
  else if(st<40||((st>>5)&1))txt('PRESS START',80,106,0,{align:'center',outline:3});
  const ln=LANGS.find(l=>l[0]===LANG)[1],lw=tw(ln,16,{}),bx=Math.round(80-lw/2);
  txt(ln,80,123,0,{align:'center',outline:3,lang:LANG});txt('◀',bx-12,123,(st>>4)&1?0:1,{outline:3,jp:1});txt('▶',bx+lw+4,123,(st>>4)&1?0:1,{outline:3,jp:1});
  txt('© 2026  ORIGINAL GB-STYLE RPG',80,135,2,{align:'center',jp:1,size:12});}

/* ---------- opening ---------- */
let op={i:0,t:0,c:0};
function opLen(){return L(T.op[op.i]).replace(/\n/g,'').length;}
function updOpening(ok){op.t++;const len=opLen();if(op.c<len)op.c+=.4;if(!ok)return;
  if(pr.B||pr.M){endOpening();return;}
  if(pr.A){if(op.c<len)op.c=len;else nextOp();}else if(op.c>=len&&op.t>len*2.5+170)nextOp();}
function nextOp(){if(op.i>=T.op.length-1){endOpening();return;}fadeTo(()=>{op.i++;op.t=0;op.c=0;});}
function endOpening(){fadeTo(()=>{newGame();scene='game';st=0;loadMap('station',9.5,6,'down');});}
function crowd(t,bubbles){R(0,0,160,86,3);for(let x=0;x<160;x+=2)for(let y=72;y<86;y+=2)if(((x+y)>>1)&1)R(x,y,1,1,2);
  for(let row=0;row<2;row++){const by=row?82:66,c=row?1:2;for(let i=0;i<11;i++){const x=row?4+i*15:11+i*15;const bob=((t>>5)+i)&1;R(x,by-13,7,13,c);R(x+2+(row?1:0),by-17+bob,4,4,c);if(row)R(x+3,by-10,2,2,0);}}
  if(bubbles)for(const[x,y]of[[18,40],[64,36],[112,42]]){R(x,y,14,8,0);R(x+3,y+8,2,2,0);for(let k=0;k<3;k++)R(x+3+k*3,y+4,1,1,3);}}
function trainPic(t){drawCity(t,62);R(0,62,160,24,2);R(0,62,160,1,1);const x=18+t*.7;R(x,40,130,20,1);for(let k=0;k<9;k++)R(x+6+k*14,44,8,6,3);R(x,58,130,2,3);R(x,48,2,4,0);R(30,68,5,12,1);R(31,63,4,4,1);}
function umbrellaPic(t){R(0,0,160,86,3);R(0,70,160,16,2);for(let y=20;y<86;y++){const hw=(y-20)*.55;for(let x=Math.round(80-hw);x<80+hw;x++)if(((x+y)&1)===0)R(x,y,1,1,1);}
  R(79,20,2,50,2);R(74,16,12,4,2);R(76,19,8,1,0);R(86,56,6,14,3);R(87,50,5,5,3);line(93,55,99,70,3,1);R(98,69,2,2,3);drawRain();}
function renderOpening(){R(0,0,160,144,3);ctx.save();ctx.beginPath();ctx.rect(0,0,160,86);ctx.clip();
  [()=>drawCity(op.t,80),()=>crowd(op.t,false),()=>crowd(op.t,true),()=>trainPic(op.t),()=>umbrellaPic(op.t)][op.i]();ctx.restore();R(0,86,160,1,2);
  const OL=wrap(L(T.op[op.i]));let left=Math.floor(op.c);const y0=94+(4-Math.min(4,OL.length))*5;
  OL.forEach((ln,i)=>{const w=tw(ln);txt(ln.slice(0,Math.max(0,left)),(160-w)/2,y0+i*11,0);left-=ln.length;});txt('B:スキップ',156,2,2,{align:'right'});}

/* ---------- ending ---------- */
let EN={i:0,t:0,c:0,phase:'lines',cy:0};
function finale(){G.f.final=1;G.ch=7;G.cut=false;saveGame();fadeTo(()=>{scene='ending';st=0;EN={i:0,t:0,c:0,phase:'lines',cy:150};playSong('ending');});}
function updEnding(ok){EN.t++;if(!ok)return;
  if(EN.phase==='lines'){const len=L(T.ending[EN.i]).replace(/\n/g,'').length;if(EN.c<len)EN.c+=.5;
    if(pr.A){if(EN.c<len)EN.c=len;else{EN.i++;EN.c=0;EN.t=0;}}else if(EN.c>=len&&EN.t>len*2+150){EN.i++;EN.c=0;EN.t=0;}
    if(EN.i>=T.ending.length){EN.phase='credits';EN.cy=150;}}
  else if(EN.phase==='credits'){EN.cy-=hd.A?1.2:.3;if(EN.cy<-T.credits.length*14-10)EN.phase='end';}
  else if(EN.phase==='end'&&pr.A)fadeTo(()=>{scene='title';st=0;TI.cur=0;playSong('title');});}
function renderEnding(){const p=Math.min(1,(st)/1800);
  R(0,0,160,144,1);for(let y=0;y<60;y++)if(y>40-p*30)for(let x=(y&1);x<160;x+=2)R(x,y,1,1,0);
  disc(118,52-Math.round(p*16),9,0);
  drawCityLite();
  const tx=EN.phase==='lines'?Math.max(10,160-st*.5):10;R(tx,56,140,18,2);for(let k=0;k<9;k++)R(tx+6+k*15,59,8,6,0);R(tx,72,140,2,3);
  R(0,76,160,12,2);R(0,76,160,1,0);R(66,62,5,14,3);R(67,57,4,4,3);R(80,64,5,12,3);R(80,58,5,6,3);
  if(EN.phase==='lines'&&EN.i<T.ending.length){R(0,92,160,52,3);const EL=wrap(L(T.ending[EN.i]));let left=Math.floor(EN.c);
    EL.forEach((ln,i)=>{const w=tw(ln);txt(ln.slice(0,Math.max(0,left)),(160-w)/2,100+i*11+(3-Math.min(3,EL.length))*5,0);left-=ln.length;});}
  else{R(0,0,160,144,0);T.credits.forEach((l,i)=>{const y=EN.cy+i*14;if(y>-10&&y<144)txt(l,80,y,i<2?3:(l==='THE END'?3:2),{align:'center',size:i===0?32:16});});
    if(EN.phase==='end'){txt(L('Lv {0}　プレイ {1}',G.lv,Math.floor(G.time/216000)+':'+String(Math.floor(G.time/3600)%60).padStart(2,'0')),80,110,2,{align:'center'});
      if((st>>5)&1)txt('Aボタンで タイトルへ',80,126,3,{align:'center'});}}}
function drawCityLite(){for(const b of BLD){const hh=Math.round(b.h*.6),top=76-hh;R(b.x,top,b.w,hh,2);}}

/* ---------- loop ---------- */
function step(){st++;readInput();if(fade.on)updFade();const ok=!fade.on;if(shake>0)shake--;if(FLASH>0)FLASH--;updRain();updTimers();
  switch(scene){case 'title':updTitle(ok);break;case 'opening':updOpening(ok);break;case 'game':updGame(ok);break;case 'ending':updEnding(ok);break;}
  tickMusic();}
function render(){ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
  switch(scene){case 'boot':R(0,0,160,144,3);txt('LOADING…',80,68,1,{align:'center'});break;
    case 'title':renderTitle();break;case 'opening':renderOpening();break;case 'game':renderGame();break;case 'ending':renderEnding();break;}
  drawPad(scene==='game'&&!MN.open&&!SH.open);}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
const ALL=JSON.stringify(T)+JSON.stringify(WEAP)+JSON.stringify(ARMOR)+JSON.stringify(ITEMS)+JSON.stringify(MAGIC)+JSON.stringify(ENEMY)+JSON.stringify(BOSSDEF)+
  Object.values(MAPS).map(m=>m.name).join('')+'SHUDEN DENSETSU PRESS START ORIGINAL GB-STYLE RPG HP MP Lv%0123456789/©〜▶はじめからつづきからどうぐまほうそうびつよさきろくぶきあたまからだカバンなし×円必殺ストレスカギ声の種プレイけいけんつぎちからまもりおかねユウLOADING…B:スキップかうやめるとまるのるまだなにもないつかうBにセットはずすもちものがないAボタンでタイトルへこうげきぼうぎょ持E';
setLang(detectLang(),true);
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('16px "DotGothic16"',ALL),
  LFONT[LANG][0]?document.fonts.load(fontFor(32),Object.values(DICT).join('')+LANGS.map(l=>l[1]).join('')):null]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(()=>{scene='title';st=0;playSong('title');});

})();
</script>
