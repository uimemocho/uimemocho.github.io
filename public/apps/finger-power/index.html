<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>フィンガーパワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 地下格闘技場の湿った空気。無口で、叩いた瞬間だけ全部が爆発する。
IDEA: 薄暗いコンクリートとフェンスに囲まれた、指専用のパンチングマシーン。
PICTURE: 3Dの測定器そのもの。赤い7セグLEDとランクランプ、裸電球のスポット。
COLOUR and TYPE: 墨色の闇／骨白の文字／危険表示の黄色1色。Noto Sans JP 900 + Anton。
LAYOUT: 画面全体が3D。UIは中央揃えの最小限、結果は下部シート。
*/
:root{--bg:#070807;--ink:#efe9de;--dim:#8f8a80;--acc:#ffcc1a;--line:rgba(239,233,222,.16)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:500 15px/1.6 "Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#crack{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .6s}
.layer{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.layer>*{pointer-events:auto}
.hide{display:none!important}
button,a.btn{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
/* title */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;
  background:radial-gradient(ellipse at 50% 45%,rgba(7,8,7,.15),rgba(7,8,7,.72) 70%)}
.kicker{font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--dim);margin-bottom:14px}
.tgroup{filter:drop-shadow(0 6px 18px rgba(0,0,0,.85))}
h1{margin:0;font-weight:900;font-size:clamp(36px,10.6vw,104px);line-height:1.02;letter-spacing:-.02em;white-space:nowrap}
.en{font-family:Anton,sans-serif;font-size:clamp(16px,4.2vw,26px);letter-spacing:.42em;padding-left:.42em;margin-top:6px;color:var(--acc)}
.mode{display:flex;margin:34px 0 18px;border:1px solid var(--line);border-radius:999px;padding:4px;background:rgba(0,0,0,.45)}
.mode button{min-height:40px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--dim)}
.mode button.on{background:var(--ink);color:#0b0b0a}
#startBtn{min-width:220px;min-height:58px;padding:0 34px;background:var(--acc);color:#0b0b0a;font-weight:900;font-size:20px;letter-spacing:.06em;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#startBtn:active{transform:scale(.97)}
.best{margin-top:18px;font-size:14px;color:var(--dim)}
.best b{font-family:Anton,sans-serif;font-weight:400;font-size:20px;color:var(--ink);letter-spacing:.03em;margin:0 4px}
.howto{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:12.5px;line-height:1.75;color:var(--dim);padding:0 24px}
/* hud */
#hud{display:none}
#hud.on{display:block}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.hbest{font-size:12px;color:var(--dim);line-height:1.3}
.hbest b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:22px;color:var(--ink);letter-spacing:.03em}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:var(--dim);background:rgba(0,0,0,.4)}
#prompt{position:absolute;left:0;right:0;bottom:max(34px,calc(env(safe-area-inset-bottom) + 22px));text-align:center;pointer-events:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.9))}
#prompt .big{font-weight:900;font-size:clamp(38px,11vw,64px);line-height:1.05;animation:pulse 1.1s ease-in-out infinite}
#prompt .sub{margin-top:8px;font-size:13px;color:var(--dim);font-weight:700}
@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}
#gauge{width:min(86vw,440px);margin:0 auto 18px;position:relative;height:30px}
#gauge .bar{position:absolute;inset:9px 0;border-radius:2px;background:linear-gradient(90deg,#2b2b28 0%,#4a473c 55%,#9a7d1a 82%,var(--acc) 94%,#fff 100%)}
#gauge .tick{position:absolute;top:4px;bottom:4px;width:2px;background:rgba(255,255,255,.35)}
#needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 12px #fff}
#tapzone{position:fixed;inset:0;display:none}
#tapzone.on{display:block}
/* impact */
#boom{position:fixed;left:0;right:0;top:16%;text-align:center;font-weight:900;font-size:clamp(54px,17vw,150px);line-height:1;pointer-events:none;
  color:var(--ink);-webkit-text-stroke:2px #000;paint-order:stroke fill;filter:drop-shadow(0 8px 0 rgba(0,0,0,.55));opacity:0;white-space:nowrap}
#boom.go{animation:boom 1s cubic-bezier(.15,.9,.25,1) forwards}
#boom.hot{color:var(--acc)}
@keyframes boom{0%{opacity:0;transform:scale(2.6)}8%{opacity:1;transform:scale(.92)}16%{transform:scale(1.04)}24%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
#readout{position:fixed;left:0;right:0;top:56%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,top .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 6px 22px rgba(0,0,0,.9))}
#readout.on{opacity:1}
#readout.up{top:max(64px,9%)}
#num{font-family:Anton,sans-serif;font-size:clamp(76px,24vw,170px);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#readout .u{font-family:Anton,sans-serif;font-size:clamp(34px,10vw,70px);margin-left:.12em;color:var(--dim)}
#readout.slam #num{animation:slam .5s cubic-bezier(.2,1.6,.3,1)}
@keyframes slam{0%{transform:scale(1.45)}100%{transform:scale(1)}}
#newrec{display:block;margin-top:2px;font-weight:900;font-size:16px;color:var(--acc);letter-spacing:.06em;opacity:0}
#newrec.on{opacity:1}
#stamp{display:inline-block;margin-top:6px;font-family:Anton,sans-serif;font-size:clamp(54px,16vw,108px);line-height:1;opacity:0;letter-spacing:.02em}
#stamp.go{animation:stamp .55s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(3)}100%{opacity:1;transform:scale(1)}}
.rk-E,.rk-D,.rk-C{color:var(--ink)}.rk-B{color:#d9e6ff}.rk-A{color:var(--acc)}.rk-S{color:#ff9d2e}.rk-SS{color:#ff5a36}
.rk-SSS{background:linear-gradient(90deg,#ff5a36,#ffcc1a,#7dffb5,#6fb6ff,#d27dff,#ff5a36);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rain 2s linear infinite}
@keyframes rain{to{background-position:200% 0}}
/* result */
#result{position:fixed;left:50%;bottom:0;width:min(100%,520px);transform:translate(-50%,110%);transition:transform .5s cubic-bezier(.2,.9,.2,1);
  background:rgba(9,10,9,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:20px 20px max(20px,env(safe-area-inset-bottom));pointer-events:auto}
#result.on{transform:translate(-50%,0)}
.rhead{display:flex;gap:14px;align-items:center}
#rRank{font-family:Anton,sans-serif;font-size:54px;line-height:1;min-width:64px;text-align:center}
#rTitle{font-weight:900;font-size:22px;line-height:1.3}
#rComment{font-size:13.5px;color:var(--dim);margin-top:4px;line-height:1.6}
.rmeta{display:flex;gap:14px;align-items:center;margin:16px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#shot{width:42%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#111;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.rmeta p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.7}
.rmeta p b{color:var(--ink);font-family:Anton,sans-serif;font-weight:400;font-size:18px;letter-spacing:.03em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:4px;font-weight:900;font-size:16px}
#shareX{background:var(--ink);color:#0b0b0a}
#retry{background:var(--acc);color:#0b0b0a}
#toTitle{grid-column:1/-1;min-height:44px!important;font-size:14px!important;font-weight:700!important;color:var(--ink);border:1px solid var(--line)}
#saveImg{grid-column:1/-1;min-height:40px!important;font-size:13px!important;font-weight:700!important;color:var(--dim);border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:max(70px,12%);transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);padding:10px 16px;border-radius:4px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;width:max-content;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff8ea;opacity:0;pointer-events:none;mix-blend-mode:screen}
#dbg{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:9}
#dbg button{background:rgba(0,0,0,.7);border:1px solid #444;color:#ccc;font-size:11px;min-height:30px;padding:0 8px;border-radius:3px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Anton,sans-serif;letter-spacing:.3em;color:var(--dim);z-index:20;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){#prompt .big{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="crack"></canvas>
<div id="flash"></div>

<div id="title" class="layer">
  <div class="kicker">地下二階 指力測定</div>
  <div class="tgroup">
    <h1>フィンガーパワー</h1>
    <div class="en">FINGER POWER</div>
  </div>
  <div class="mode" id="mode">
    <button data-m="sensor">センサー判定</button>
    <button data-m="gauge">ゲージ判定</button>
  </div>
  <button id="startBtn">測定する</button>
  <div class="best">自己ベスト<b id="tBest">0</b>g</div>
  <div class="howto" id="howto"></div>
</div>

<div id="hud" class="layer">
  <div class="top">
    <div class="hbest">自己ベスト<b id="hBest">0 g</b></div>
    <button class="chip" id="muteBtn">SOUND ON</button>
  </div>
  <div id="prompt">
    <div id="gauge" class="hide"><div class="bar"></div><div class="tick" style="left:94%"></div><div id="needle"></div></div>
    <div class="big">叩け</div>
    <div class="sub" id="promptSub">画面のどこでも、指一本で</div>
  </div>
</div>
<div id="tapzone"></div>

<div id="boom"></div>
<div id="readout"><span id="num">0</span><span class="u">g</span><span id="newrec">自己ベスト更新</span><span id="stamp"></span></div>

<section id="result">
  <div class="rhead">
    <div id="rRank">A</div>
    <div><div id="rTitle"></div><div id="rComment"></div></div>
  </div>
  <div class="rmeta">
    <img id="shot" alt="シェア用の結果画像">
    <p>自己ベスト <b id="rBest">0</b> g<br><span id="saveHint">画像は長押しで保存できます</span></p>
  </div>
  <div class="btns">
    <a class="btn" id="shareX" href="#" target="_blank" rel="noopener">Xに投稿</a>
    <button class="btn" id="retry">もう一発</button>
    <button class="btn" id="toTitle">タイトルへ</button>
    <a class="btn hide" id="saveImg" download="finger-power.png">画像を保存</a>
  </div>
</section>
<div id="toast"></div>
<div id="loading">LOADING</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const GAME_URL='https://uimemocho.github.io/apps/finger-power/';
const TAG='フィンガーパワー';
const PUBLIC=location.hostname==='uimemocho.github.io';
const DEBUG=!PUBLIC&&/debug/.test(location.hash+location.search);
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const GAUGE_OK=!PUBLIC;
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const RANKS=[
 {r:'E',min:0,t:'押しただけ',c:'指先に、まだ迷いがある。',w:'ぺちっ'},
 {r:'D',min:500,t:'呼び鈴係',c:'ピンポンは鳴る。それだけだ。',w:'トンッ'},
 {r:'C',min:1000,t:'ノック職人',c:'扉の向こうの誰かが、振り返った。',w:'ドンッ'},
 {r:'B',min:1600,t:'地下の新人',c:'観客が、こっちを見始めた。',w:'ドゴッ!'},
 {r:'A',min:2400,t:'指先の喧嘩屋',c:'その一本で、場の空気が変わった。',w:'ドゴォッ!!'},
 {r:'S',min:3400,t:'鋼鉄の人差し指',c:'測定器が悲鳴を上げている。',w:'ズドォン!!'},
 {r:'SS',min:5400,t:'測定器クラッシャー',c:'修理代は、店主の奢りだそうだ。',w:'ゴガァン!!!'},
 {r:'SSS',min:9000,t:'人差し指の神話',c:'今夜、この地下で伝説が生まれた。',w:'ドッゴォォン!!!'}
];
const rankOf=g=>{let i=0;RANKS.forEach((r,k)=>{if(g>=r.min)i=k});return i};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3), easeIn=t=>t*t*t, easeExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
let best=0;try{best=+localStorage.getItem('fp_best')||0}catch(e){}

/* ================= AUDIO ================= */
const AU={ctx:null,muted:false,
 init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=this.ctx=new C();
  this.master=a.createGain();this.master.gain.value=.9;this.master.connect(a.destination);
  this.comp=a.createDynamicsCompressor();this.comp.threshold.value=-14;this.comp.ratio.value=5;this.comp.connect(this.master);
  const len=a.sampleRate*2,nb=a.createBuffer(1,len,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=nb;
  // underground reverb
  const rl=a.sampleRate*2.2,ir=a.createBuffer(2,rl,a.sampleRate);for(let c=0;c<2;c++){const ch=ir.getChannelData(c);for(let i=0;i<rl;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2)}
  this.rev=a.createConvolver();this.rev.buffer=ir;this.revG=a.createGain();this.revG.gain.value=.38;this.rev.connect(this.revG);this.revG.connect(this.comp);
  this.ambient()},
 bus(g=1,rev=true){const n=this.ctx.createGain();n.gain.value=g;n.connect(this.comp);if(rev)n.connect(this.rev);return n},
 noise(){const s=this.ctx.createBufferSource();s.buffer=this.nb;s.loop=true;s.loopStart=Math.random();return s},
 ambient(){const a=this.ctx;
  const n1=this.noise(),f1=a.createBiquadFilter();f1.type='lowpass';f1.frequency.value=260;const g1=a.createGain();g1.gain.value=.05;n1.connect(f1).connect(g1).connect(this.comp);n1.start();
  const n2=this.noise(),f2=a.createBiquadFilter();f2.type='bandpass';f2.frequency.value=520;f2.Q.value=.7;this.crowd=a.createGain();this.crowd.gain.value=.018;n2.connect(f2).connect(this.crowd).connect(this.comp);this.crowd.connect(this.rev);n2.start();
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=.31;lg.gain.value=.008;lfo.connect(lg).connect(this.crowd.gain);lfo.start();
  const h=a.createOscillator();h.type='sawtooth';h.frequency.value=50;const hf=a.createBiquadFilter();hf.type='lowpass';hf.frequency.value=180;const hg=a.createGain();hg.gain.value=.012;h.connect(hf).connect(hg).connect(this.comp);h.start()},
 env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)},
 tone(type,f0,f1,dur,peak,out,at=0){const a=this.ctx,t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);this.env(g,t,.004,peak,dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.05)},
 burst(type,freq,q,dur,peak,out,at=0,f1){const a=this.ctx,t=a.currentTime+at,s=this.noise(),f=a.createBiquadFilter(),g=a.createGain();f.type=type;f.frequency.setValueAtTime(freq,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;this.env(g,t,.003,peak,dur);s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+dur+.05)},
 heart(){if(!this.ctx)return;const b=this.bus(.9,false);this.tone('sine',70,38,.16,.5,b);this.tone('sine',62,34,.16,.32,b,.2)},
 whoosh(){if(!this.ctx)return;this.burst('bandpass',500,1.2,.16,.35,this.bus(1,false),0,3200)},
 impact(tier){if(!this.ctx)return;const b=this.bus(1);const k=tier/7;
  this.tone('sine',150+k*40,28,.45+k*.7,.75+k*.25,b);
  this.burst('lowpass',900+k*5000,.7,.18+k*.5,.55+k*.35,b);
  [317,472,689,1013].forEach((f,i)=>this.tone('triangle',f*(1+rnd(-.02,.02)),f*.97,.35+k*.6,.07+k*.05,b));
  if(tier>=4){const a=this.ctx,ws=a.createWaveShaper(),cv=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;cv[i]=Math.tanh(x*6)}ws.curve=cv;ws.connect(b);
   const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(24,t+1.2);this.env(g,t,.005,.5,1.2);o.connect(g).connect(ws);o.start(t);o.stop(t+1.3)}
  if(tier>=6)this.burst('highpass',2500,.5,1.1,.25,b,.03)},
 tick(){if(!this.ctx)return;this.tone('square',2300,0,.025,.035,this.bus(1,false))},
 ding(i){if(!this.ctx)return;this.tone('sine',520*Math.pow(1.122,i),0,.5,.16,this.bus(1))},
 slam(tier){if(!this.ctx)return;const b=this.bus(1);this.tone('sine',110,40,.6,.7,b);this.burst('lowpass',2400,.7,.3,.5,b);
  if(tier>=3){[1320,1980,2640].forEach((f,i)=>this.tone('sine',f,0,1.6,.09/(i+1),b,.02))}
  this.roar(tier)},
 roar(tier){if(!this.ctx||tier<2)return;const a=this.ctx,t=a.currentTime,lv=.03+tier*.03;this.crowd.gain.cancelScheduledValues(t);this.crowd.gain.setTargetAtTime(lv,t,.08);this.crowd.gain.setTargetAtTime(.018,t+1.4+tier*.25,.9);
  if(tier>=4)for(let i=0;i<tier*2;i++)this.burst('bandpass',900+rnd(1200),3,.12,.05,this.bus(1),rnd(.1,1.6))},
 mute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.9}
};

/* ================= THREE ================= */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
const PR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x060706);scene.fog=new THREE.Fog(0x060706,9,24);
const camera=new THREE.PerspectiveCamera(50,1,.05,60);
const rt=new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
const postU={tDiffuse:{value:rt.texture},uTime:{value:0},uChroma:{value:0},uFlash:{value:0},uFlick:{value:1},uRes:{value:new THREE.Vector2(1,1)},uWarp:{value:0}};
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:postU,depthTest:false,

  if(iv!==count.shown){count.shown=iv;drawLED(String(iv).slice(-5),.9+Math.random()*.2);$('#num').textContent=fmt(iv);count.tickT-=rdt;if(count.tickT<=0){AU.tick();count.tickT=.04}}
  const lv=rankOf(v);if(lv!==count.lamp&&v>=RANKS[lv].min&&lv>count.lamp){count.lamp=lv;drawLamps(lv);if(lv>0)AU.ding(lv)}
  if(p>=1){slamResult()}}
 ledBright=lerp(ledBright,1,.1);
 const ledOn=state==='count'||state==='slam'||state==='result'?1:.25;ledGlow.material.opacity=lerp(ledGlow.material.opacity,ledOn*.5,.1);ledL.intensity=lerp(ledL.intensity,ledOn*1.2,.1);
 // bulbs
 bulbs.forEach(b=>{b.vx+=-b.ax*9*rdt;b.vz+=-b.az*9*rdt;b.vx*=Math.pow(.6,rdt);b.vz*=Math.pow(.6,rdt);b.ax+=b.vx*rdt;b.az+=b.vz*rdt;b.piv.rotation.set(b.ax*.35,0,b.az*.35)});
 spot.position.x=Math.sin(bulbs[0].az*.35)*-5.2;spot.position.z=2+Math.sin(bulbs[0].ax*.35)*5.2;
 // flicker
 if(flickT>0){flickT-=rdt;flick=Math.random()<.35?rnd(.25,.7):1}else flick=lerp(flick,.97+Math.sin(now*.05)*.015*(Math.random()<.02?6:1),.3);
 spot.intensity=2.4*flick;bulbs.forEach(b=>{b.cone.material.opacity=b.baseOp*flick});
 const sf=Math.random()<.004?.2:1;drawSign.f=lerp(drawSign.f||1,sf,.5);signGlow.material.opacity=.35*drawSign.f*flick;if(sf<1||(drawSign.f<.95&&Math.random()<.3))drawSign(drawSign.f>.6?1:0);
 // sparks
 for(let i=0;i<SP;i++){const p=sp[i];if(p.life<=0)continue;p.life-=dt;p.vy-=6.5*dt;p.vx*=Math.pow(.5,dt);p.vz*=Math.pow(.5,dt);
  spPos[i*3]+=p.vx*dt;spPos[i*3+1]+=p.vy*dt;spPos[i*3+2]+=p.vz*dt;if(spPos[i*3+1]<.02){spPos[i*3+1]=.02;p.vy*=-.35}
  const f=Math.max(0,p.life/p.max);spCol[i*3]=p.r*f;spCol[i*3+1]=p.g*f;spCol[i*3+2]=p.b*f;if(p.life<=0)spPos[i*3+1]=-99}
 spGeo.attributes.position.needsUpdate=true;spGeo.attributes.color.needsUpdate=true;
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;if(r.t<0)continue;const p=r.t/r.dur;if(p>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);continue}
  const s=1+(r.scaleTo-1)*easeOut(p);r.m.scale.set(s,s,s);r.m.material.opacity=(1-p)*(1-p)*.9}
 for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.vy-=9.8*dt;d.m.position.x+=d.vx*dt;d.m.position.y+=d.vy*dt;d.m.position.z+=d.vz*dt;d.m.rotation.x+=d.rx*dt;d.m.rotation.y+=d.ry*dt;
  if(d.m.position.y<d.s/2){d.m.position.y=d.s/2;d.vy*=-.3;d.vx*=.6;d.vz*=.6;d.rx*=.5;d.ry*=.5}if(d.life<=0){scene.remove(d.m);debris.splice(i,1)}}
 // dust
 for(let i=0;i<DUST;i++){dPos[i*3]+=dVel[i*3]*rdt+Math.sin(now*.0004+i)*.0004;dPos[i*3+1]+=dVel[i*3+1]*rdt;dPos[i*3+2]+=dVel[i*3+2]*rdt;if(dPos[i*3+1]>4.4)dPos[i*3+1]=0;if(dPos[i*3+1]<0)dPos[i*3+1]=4.4}
 dGeo.attributes.position.needsUpdate=true;
 // crowd
 excite*=Math.pow(.55,rdt);
 crowd.forEach(c=>{c.vy-=9*rdt;c.jump+=c.vy*rdt;if(c.jump<0){c.jump=0;c.vy=excite>.35&&Math.random()<excite*.08?rnd(1,2.4)*excite:0}
  c.m.position.y=c.base+c.jump+Math.sin(now*.001*c.f+c.ph)*.015*(1+excite*6);c.m.material=excite>.3||c.jump>.05?crowdMatB:crowdMatA});
 // machine jolt
 M.position.x=shake>.01?rnd(-shake,shake)*.3:0;
 // post
 chroma*=Math.pow(.08,rdt);flash*=Math.pow(.002,rdt);
 postU.uTime.value=now/1000;postU.uChroma.value=chroma;postU.uFlash.value=flash*.8;postU.uFlick.value=.85+.15*flick;postU.uWarp.value=.08+chroma*.25;
 const fe=$('#flash');if(+fe.style.opacity>0)fe.style.opacity=Math.max(0,+fe.style.opacity-rdt*3.2);
 renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);
 if(pendingShot){const cb=pendingShot;pendingShot=null;cb(renderer.domElement)}}
requestAnimationFrame(loop);
const ld=$('#loading');setTimeout(()=>{ld.style.opacity=0;setTimeout(()=>ld.remove(),500)},350);
document.fonts&&document.fonts.ready.then(()=>{drawSign();drawLED();drawLamps(lampLv);if(window._stencil){const c=window._stencil.userData.stencil,x=c.getContext('2d');x.clearRect(0,0,1024,256);x.fillStyle='rgba(225,220,205,.5)';x.font='900 190px "Noto Sans JP",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('地下二階',512,128);grain(x,1024,256,60);window._stencil.material.map.needsUpdate=true}});

/* debug */
if(DEBUG){const d=document.createElement('div');d.id='dbg';RANKS.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.r;b.onclick=()=>{if(state==='aim')doTap(r.min+rnd(0,(RANKS[i+1]?RANKS[i+1].min-r.min:2500)))};d.appendChild(b)});
 const m=document.createElement('button');m.textContent='MODE';m.onclick=()=>{setMode(mode==='gauge'?'sensor':'gauge');showToast(mode)};d.appendChild(m);document.body.appendChild(d)}
}
