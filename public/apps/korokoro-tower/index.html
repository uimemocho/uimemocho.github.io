<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<title>コロコロタワー</title>
<meta name="description" content="コロコロタワー。スマホを傾けて珠を転がし、塔の上の階から1階のゴールを目指す3D箱庭迷路。ギミックだらけの全10ステージをスター3つで攻略しよう。">
<meta property="og:type" content="website"><meta property="og:site_name" content="uimemocho"><meta property="og:title" content="コロコロタワー">
<meta property="og:description" content="スマホを傾けて、珠を塔の最下階へ。ギミックだらけの3D箱庭迷路、全10ステージ。">
<meta property="og:url" content="https://uimemocho.github.io/apps/korokoro-tower/"><meta property="og:image" content="https://uimemocho.github.io/apps/korokoro-tower/ogp.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="コロコロタワー"><meta name="twitter:image" content="https://uimemocho.github.io/apps/korokoro-tower/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e1a2b;--navy2:#16314f;--y:#ffd60a;--sub:#d6dfec;--line:rgba(214,223,236,.26);--panel:rgba(14,26,43,.80)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:#fff;overflow:hidden;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","PingFang SC","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);touch-action:none}
.scr.on{display:flex}
.en{font-family:Oswald,"Zen Kaku Gothic New",sans-serif}
/* title */
#scrTitle{background:radial-gradient(ellipse at 50% 40%,rgba(14,26,43,0) 0%,rgba(14,26,43,.35) 60%,rgba(14,26,43,.85) 100%)}
.logoWrap{display:flex;flex-direction:column;align-items:center;margin-top:-8vh}
.logo{-webkit-touch-callout:none;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:min(12.2vw,84px);line-height:1.1;transform:skewX(-7deg);white-space:nowrap;letter-spacing:0;filter:drop-shadow(0 2px 14px rgba(9,17,29,.85)) drop-shadow(0 0 30px rgba(9,17,29,.6))}
.logo span{text-shadow:none}
.logo .y{color:var(--y)}
.logoSub{font-family:Oswald,sans-serif;font-size:15px;letter-spacing:.62em;padding-left:.62em;color:var(--sub);margin-top:16px;text-shadow:0 2px 12px var(--navy);white-space:nowrap}
.logoRule{width:min(64vw,300px);height:1px;background:linear-gradient(90deg,transparent,var(--y),transparent);margin-top:18px;opacity:.8}
.tapStart{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 118px);text-align:center;font-weight:900;font-size:15px;letter-spacing:.24em;padding-left:.24em;animation:blink 1.6s ease-in-out infinite;text-shadow:0 2px 10px var(--navy)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.titleMenu{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;gap:12px}
.chip{height:40px;padding:0 18px;border:1px solid var(--line);background:rgba(14,26,43,.6);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;border-radius:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* buttons */
.btn{font-weight:900;font-size:16px;color:var(--navy);background:var(--y);border:none;height:48px;padding:0 24px;border-radius:2px;min-width:210px;letter-spacing:.06em;box-shadow:0 8px 22px rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:rgba(14,26,43,.55);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn.x{background:#fff;color:#0e1a2b}
.btn:active,.chip:active,.stg:active{transform:scale(.97)}
/* select */
#scrSelect{justify-content:flex-start;background:linear-gradient(180deg,rgba(14,26,43,.92) 0%,rgba(14,26,43,.55) 40%,rgba(14,26,43,.8) 100%)}
.selHead{width:min(460px,100%);display:flex;align-items:flex-end;justify-content:space-between;padding:6px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.selHead .t1{font-family:Oswald;font-size:12px;letter-spacing:.42em;color:var(--y)}
.selHead .t2{font-weight:900;font-size:22px;margin-top:4px}
.selHead .tot{text-align:right;font-family:Oswald;font-size:12px;letter-spacing:.2em;color:var(--sub)}
.selHead .tot b{display:block;font-family:"Dela Gothic One";font-weight:400;font-size:24px;letter-spacing:.02em;color:#fff;margin-top:2px}
.backBtn{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 12px);height:36px;padding:0 14px;font-size:12px}
.stageList{width:min(460px,100%);flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 0 24px;position:relative}
.stg{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:#fff;padding:14px 14px 14px 58px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stg .node{position:absolute;left:21px;top:50%;width:15px;height:15px;margin-top:-7.5px;border:2px solid var(--y);background:var(--navy);transform:rotate(45deg)}
.stg.done .node{background:var(--y)}
.stg .num{font-family:"Dela Gothic One";font-size:28px;line-height:1;min-width:44px;transform:skewX(-7deg)}
.stg .info{flex:1;min-width:0}
.stg .name{font-weight:900;font-size:16px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .meta{font-family:Oswald;font-size:12px;letter-spacing:.14em;color:var(--sub);margin-top:4px}
.stg .stars{display:flex;gap:3px}
.stg.locked{opacity:.38}
.stg.locked .num{color:var(--sub)}
.star{width:18px;height:18px;display:inline-block}
.star path{fill:rgba(214,223,236,.22)}
.star.on path{fill:var(--y)}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;touch-action:none}
#hud .pe{pointer-events:auto}
#btnPause{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);width:44px;height:44px;border:1px solid var(--line);background:rgba(14,26,43,.55);border-radius:2px;display:flex;align-items:center;justify-content:center;gap:5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#btnPause i{display:block;width:4px;height:15px;background:#fff}
.hudCenter{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);text-align:center;text-shadow:0 2px 12px rgba(14,26,43,.9)}
.hudStage{font-family:Oswald;font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--y)}
#hudTimer{font-family:"Dela Gothic One";font-size:38px;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#hudTimer.warn{color:var(--y);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.hudRight{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 14px);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hudPill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;background:rgba(14,26,43,.6);border:1px solid var(--line);border-radius:2px;font-family:Oswald;font-size:14px;letter-spacing:.1em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hudPill svg{width:13px;height:13px}
#floorBar{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 100px);display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fl{display:flex;align-items:center;gap:8px;font-family:Oswald;font-size:12px;letter-spacing:.12em;color:rgba(230,236,245,.8);text-shadow:0 0 6px rgba(9,17,29,.9),0 1px 2px rgba(9,17,29,.9)}
.fl i{box-shadow:0 0 6px rgba(9,17,29,.6)}
.fl i{display:block;width:26px;height:4px;background:rgba(214,223,236,.25)}
.fl.cur{color:var(--y)}.fl.cur i{background:var(--y);width:38px}
.fl.past{color:rgba(214,223,236,.25)}.fl.past i{background:rgba(214,223,236,.12)}
#toast{position:absolute;left:0;right:0;top:32%;text-align:center;font-weight:900;font-size:18px;letter-spacing:.08em;opacity:0;transition:opacity .3s;text-shadow:0 2px 14px var(--navy)}
#toast.on{opacity:1}
#touchHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--sub);text-shadow:0 2px 10px var(--navy)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none;display:none}
#stick i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--y);opacity:.85}
/* countdown */
#scrCount{pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(14,26,43,.72) 0%,rgba(14,26,43,.35) 45%,rgba(14,26,43,0) 75%)}
#cdStage{font-family:Oswald;font-size:13px;letter-spacing:.46em;padding-left:.46em;color:var(--y);text-shadow:0 2px 12px var(--navy)}
#cdName{font-weight:900;font-size:26px;margin-top:6px;text-shadow:0 2px 16px var(--navy);text-align:center}
#cdNum{font-family:"Dela Gothic One";font-size:120px;line-height:1.1;margin-top:16px;transform:skewX(-7deg);text-shadow:0 6px 30px rgba(14,26,43,.95)}
#cdNum.go{color:var(--y)}
#cdHold{font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--sub);margin-top:8px;text-shadow:0 2px 10px var(--navy);text-align:center}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:skewX(-7deg) scale(1.8);opacity:0}to{transform:skewX(-7deg) scale(1);opacity:1}}
/* modal panels */
.dim{background:rgba(9,17,29,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{width:min(420px,100%);max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center}
.pTitle{font-family:Oswald;font-size:13px;letter-spacing:.46em;padding-left:.46em;color:var(--y)}
.pBig{font-family:"Dela Gothic One";font-size:min(8.4vw,34px);white-space:nowrap;margin-top:6px;transform:skewX(-7deg);letter-spacing:.04em;text-align:center}
.pBtns{display:flex;flex-direction:column;gap:9px;margin-top:18px;width:100%;align-items:center}
.pBtns .btn{width:100%;max-width:300px}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.row .lb{font-weight:700;font-size:14px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;height:34px;padding:0 14px}
.seg button.on{background:var(--y);color:var(--navy)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.langs button{height:34px;border:1px solid var(--line);background:none;color:var(--sub);font-size:12px;font-weight:700;border-radius:2px}
.langs button.on{background:var(--y);color:var(--navy);border-color:var(--y)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;background:var(--line);border-radius:2px;outline:none;touch-action:pan-x}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--y);border:none}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--y);border:none}
.howList{width:100%;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.howList p{font-size:14px;line-height:1.7;display:flex;gap:10px;font-weight:500}
.howList p b{font-family:Oswald;color:var(--y);min-width:18px}
.gimList{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gim{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.5;font-weight:700;padding:8px;border:1px solid var(--line);border-radius:2px}
.gim i{flex:none;width:14px;height:14px;border-radius:2px}
.secLb{width:100%;font-family:Oswald;font-size:11px;letter-spacing:.36em;color:var(--y);margin-top:18px}
/* result */
#resStage{font-family:Oswald;font-size:12px;letter-spacing:.3em;padding-left:.3em;color:var(--sub);margin-top:8px;text-align:center}
.resStars{display:flex;gap:10px;margin-top:18px}
.resStars .star{width:40px;height:40px;opacity:0;transform:scale(.3)}
.resStars .star.show{animation:starIn .5s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes starIn{to{opacity:1;transform:scale(1)}}
.conds{width:100%;margin-top:14px;display:flex;flex-direction:column;gap:6px}
.cond{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub);line-height:1.5}
.cond .star{width:15px;height:15px}
.resGrid{width:100%;margin-top:16px;border-top:1px solid var(--line)}
.rrow{display:flex;align-items:center;justify-content:space-between;height:40px;border-bottom:1px solid var(--line)}
.resGrid .k{font-weight:700;font-size:13px;color:var(--sub)}
.resGrid .v{font-family:Oswald;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.newBest{font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--navy);background:var(--y);padding:3px 10px;margin-top:10px}
.btnRow{display:flex;gap:10px;width:100%;max-width:300px}
.btnRow .btn{flex:1;min-width:0;padding:0 10px;font-size:14px}
#notice{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);margin:0 auto;max-width:420px;padding:14px 16px;background:var(--panel);border:1px solid var(--y);font-size:13px;font-weight:700;line-height:1.6;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
#notice.on{opacity:1}
.dbgGrid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.dbgGrid button{height:36px;border:1px solid var(--line);background:none;color:#fff;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.08em;border-radius:2px}
.dbgGrid button.on{background:var(--y);color:var(--navy);border-color:var(--y)}
#dbgStages,#dbgFloors{grid-template-columns:repeat(5,1fr)}
#btnDebug{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:25;height:34px;padding:0 12px;border:1px solid var(--y);background:rgba(14,26,43,.7);color:var(--y);font-family:Oswald;font-size:12px;letter-spacing:.2em;border-radius:2px}
#fps{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 54px);z-index:25;font-family:Oswald;font-size:12px;color:var(--y);text-shadow:0 1px 4px #000}
.selBanner{width:min(460px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--y);background:rgba(255,214,10,.08);font-weight:900;font-size:13px;line-height:1.5}
.selBanner b{font-family:Oswald;font-size:15px;color:var(--y);letter-spacing:.06em;white-space:nowrap}
.selBanner.pf{background:var(--y);color:var(--navy)}.selBanner.pf b{color:var(--navy)}
#scrCele{background:radial-gradient(ellipse at 50% 45%,rgba(22,49,79,.92) 0%,rgba(9,17,29,.96) 70%);z-index:22;pointer-events:auto}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele{position:relative;width:min(420px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}
.celeHead{font-size:13px;letter-spacing:.5em;padding-left:.5em;color:var(--y)}
.celeBig{font-family:"Dela Gothic One";font-size:min(11vw,48px);line-height:1.15;margin-top:6px;transform:skewX(-7deg);white-space:nowrap;filter:drop-shadow(0 0 22px rgba(255,214,10,.45))}
.celeBig.pf{color:var(--y)}
.celeStars{display:flex;gap:10px;margin-top:18px}
.celeStars .star{width:52px;height:52px;opacity:0;transform:scale(.3)}
.celeStars .star.show{animation:starIn .55s cubic-bezier(.2,1.7,.4,1) forwards}
.celeMsg{font-weight:900;font-size:20px;line-height:1.6;margin-top:20px}
.cele .btnRow{margin:0 auto}
.celeSub{font-weight:500;font-size:14px;line-height:1.8;color:var(--sub);margin-top:10px;max-width:340px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Oswald;letter-spacing:.5em;color:var(--sub);font-size:13px;background:var(--navy);z-index:30}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<div id="loading">LOADING</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <button id="btnPause" class="pe" aria-label="pause"><i></i><i></i></button>
  <div class="hudCenter"><div class="hudStage" id="hudStage">STAGE 01</div><div id="hudTimer">0:00.00</div></div>
  <div class="hudRight">
    <div class="hudPill"><svg viewBox="0 0 14 12" style="width:16px;height:14px"><path d="M1 4.2L3.8 1H10.2L13 4.2L7 11Z" fill="#3fb6ff"/><path d="M1 4.2H13M3.8 1L5.4 4.2L7 11L8.6 4.2L10.2 1M5.4 4.2L7 1L8.6 4.2" fill="none" stroke="#d8f4ff" stroke-width=".7" stroke-linejoin="round"/></svg><span id="hudGem">0/0</span></div>
    <div class="hudPill hidden" id="hudKey"><svg viewBox="0 0 10 10"><circle cx="3" cy="5" r="2.2" fill="none" stroke="#ffd60a" stroke-width="1.4"/><path d="M5 5H9.5M8 5V7.2" stroke="#ffd60a" stroke-width="1.4" fill="none"/></svg><span>KEY</span></div>
  </div>
  <div id="floorBar"></div>
  <div id="toast"></div>
  <div id="touchHint" class="hidden"></div>
</div>
<div id="stick"><i></i></div>

<!-- TITLE -->
<section id="scrTitle" class="scr">
  <div class="logoWrap">
    <h1 class="logo"><span>コロコロ</span><span class="y">タワー</span></h1>
    <div class="logoSub">KOROKORO TOWER</div>
    <div class="logoRule"></div>
  </div>
  <div class="tapStart" data-i18n="tap"></div>
  <div class="titleMenu">
    <button class="chip" data-act="howto" data-i18n="howto"></button>
    <button class="chip" data-act="settings" data-i18n="settings"></button>
  </div>
</section>

<!-- SELECT -->
<section id="scrSelect" class="scr">
  <div style="height:44px;flex:none"></div>
  <button class="chip backBtn" data-act="toTitle" data-i18n="back"></button>
  <div class="selHead">
    <div><div class="t1">SELECT STAGE</div><div class="t2" data-i18n="select"></div></div>
    <div class="tot"><span data-i18n="total"></span><b id="totStars">0 / 30</b></div>
  </div>
  <div class="selBanner hidden" id="selBanner"></div>
  <div class="stageList" id="stageList"></div>
</section>

<!-- COUNTDOWN -->
<section id="scrCount" class="scr">
  <div id="cdStage">STAGE 01</div>
  <div id="cdName"></div>
  <div id="cdNum">3</div>
  <div id="cdHold"></div>
</section>

<!-- PAUSE -->
<section id="scrPause" class="scr dim">
  <div class="panel">
    <div class="pTitle">PAUSE</div>
    <div class="pBig" id="pauseName"></div>
    <div class="pBtns">
      <button class="btn" data-act="resume" data-i18n="resume"></button>
      <button class="btn ghost" data-act="recal" data-i18n="recal"></button>
      <button class="btn ghost" data-act="retry" data-i18n="retry"></button>
      <button class="btn ghost" data-act="settings" data-i18n="settings"></button>
      <button class="btn ghost" data-act="quit" data-i18n="quit"></button>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="scrResult" class="scr dim">

function scrAngle(){let a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);if(a===270)a=-90;return a;}
function onOri(e){if(e.beta==null||e.gamma==null)return;const a=scrAngle(),b=e.beta,g=e.gamma;let X,Y;
  if(a===0){X=g;Y=b;}else if(a===90){X=b;Y=-g;}else if(a===-90){X=-b;Y=g;}else{X=-g;Y=-b;}
  gyro.raw={X,Y};if(!gyro.ok){gyro.ok=true;}if(!gyro.base)gyro.base={X,Y};}
function calibrate(){if(gyro.raw)gyro.base={X:gyro.raw.X,Y:gyro.raw.Y};}
function enableGyro(){ // must be called inside a user gesture
  if(gyro.asked)return;gyro.asked=true;
  if(typeof DeviceOrientationEvent==='undefined')return;
  const listen=()=>{if(!gyro.listening){window.addEventListener('deviceorientation',onOri);gyro.listening=true;}};
  try{if(typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')listen();}).catch(()=>{});}else listen();}catch(e){}
}

    x.globalAlpha=0.18;x.fillStyle='#fff';for(let i=-2;i<=2;i++){x.save();x.beginPath();x.arc(px,py,pr,0,6.28);x.clip();x.translate(px,py);x.rotate(rot);x.fillRect(-pr,i*pr*0.3-pr*0.05,pr*2,pr*0.08);x.restore();}x.globalAlpha=1;

function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

      if('<>^v'.includes(ch)){const g=new THREE.Group();const p=new THREE.Mesh(GEO.arrow,mkMat(fo,{map:arrowTex,transparent:true,emissive:0xffb800,emissiveMap:arrowTex,emissiveIntensity:0.6,roughness:0.5,depthWrite:false}));p.rotation.x=-Math.PI/2;g.add(p);

        const s=new THREE.Mesh(new THREE.BoxGeometry(1.01,0.08,1.01),mkMat(fo,{color:0xffd60a,emissive:0xffb800,emissiveIntensity:0.8}));s.position.y=0.3;d.add(s);fo.group.add(d);fo.doors.push({c,r,mesh:d,y:0});}
      if(ch==='H'){const gm=new THREE.Mesh(GEO.gate,mkMat(fo,{color:0xff9f43,emissive:0xff7a00,emissiveIntensity:0.35,roughness:0.4,transparent:true,opacity:0.92}));gm.position.set(x,0,z);gm.castShadow=true;fo.group.add(gm);fo.gates.push({c,r,mesh:gm,h:1,phase:((c+r)%2)*2});}
      if(ch==='R'){const g=new THREE.Group();const bm=mkMat(fo,{color:0xff6b3d,roughness:0.35,metalness:0.3,emissive:0x501000});const hub=new THREE.Mesh(GEO.hub,mkMat(fo,{color:0xe9eef5,roughness:0.3,metalness:0.6}));hub.position.y=0.25;const bar=new THREE.Mesh(GEO.bar,bm);bar.position.y=0.32;bar.castShadow=true;hub.castShadow=true;g.add(hub,bar);g.position.set(x,0,z);fo.group.add(g);
        fo.bars.push({c,r,cx:c+0.5,cz:r+0.5,a:(c*1.3+r)%Math.PI,w:(c+r)%2?1.5:-1.5,mesh:g});}

function addTree(fo,x,y,z,rnd){const g=new THREE.Group();const tr=new THREE.Mesh(GEO.trunk,mkMat(fo,{color:0x7a5536,roughness:0.9}));tr.position.y=0.12;

/* ---------------- game state ---------------- */
let state='loading';
const game={si:0,f:0,px:0,pz:0,vx:0,vz:0,mode:'idle',elapsed:0,gems:0,entry:{x:0,z:0},fall:null,resp:0,tpLock:false,rootY:0,tilt:{x:0,z:0},goalT:0,hitCool:0,count:0,countStep:-1,overT:0,result:null};
function cellAt(fo,c,r){if(r<0||c<0||r>=level.H||c>=level.W)return '#';return fo.grid[r][c];}
function gateUp(g,time){return ((time+g.phase)%4)<2;}
function solid(fo,c,r){const ch=cellAt(fo,c,r);if(ch==='#')return true;if(ch==='D'&&!fo.doorsOpen)return true;if(ch==='H'){const g=fo.gates.find(q=>q.c===c&&q.r===r);return g&&g.h>0.5;}return false;}

function startStage(si){
  AU.resume();game.si=si;buildLevel(si);const fo0=level.floors[0];
  game.f=0;game.px=fo0.start.c+0.5;game.pz=fo0.start.r+0.5;game.vx=game.vz=0;game.elapsed=0;game.gems=0;game.entry={x:game.px,z:game.pz};game.fall=null;game.tpLock=false;game.rootY=0;game.tilt.x=game.tilt.z=0;game.mode='count';game.count=0;game.countStep=-1;game.goalT=0;game.overT=0;game.result=null;ballGlow.intensity=0;
  ball.scale.set(1,1,1);ball.quaternion.identity();pivot.rotation.set(0,0,0);
  showScreen(null);$('hud').classList.remove('hidden');
  $('hudStage').textContent='STAGE '+String(si+1).padStart(2,'0');$('hudTimer').classList.remove('warn');$('hudKey').classList.add('hidden');
  $('touchHint').textContent=t('dragHint');$('touchHint').classList.toggle('hidden',useGyro());
  buildFloorBar();updateHud();
  $('cdStage').textContent='STAGE '+String(si+1).padStart(2,'0');$('cdName').textContent=stageName(si);$('cdHold').textContent=useGyro()?t('hold'):t('dragHint');$('cdNum').textContent='';
  showScreen('scrCount',true);state='play';
}
function buildFloorBar(){const fb=$('floorBar');fb.innerHTML='';for(let f=0;f<level.N;f++){const d=document.createElement('div');d.className='fl';d.innerHTML='<span>'+(level.N-f)+'F</span><i></i>';fb.appendChild(d);}}
function updateFloorBar(){const ch=$('floorBar').children;for(let i=0;i<ch.length;i++){ch[i].className='fl'+(i===game.f?' cur':i<game.f?' past':'');}}
function updateHud(){$('hudGem').textContent=game.gems+'/'+level.gemTotal;updateFloorBar();}
let toastTimer=0;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1800);}
let noticeTimer=0;function notice(msg){const el=$('notice');el.textContent=msg;el.classList.add('on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('on'),3600);}

/* ---------------- physics ---------------- */
const CONV={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};
function collideBox(c,r){const qx=clamp(game.px,c,c+1),qz=clamp(game.pz,r,r+1);let dx=game.px-qx,dz=game.pz-qz;let d=Math.hypot(dx,dz);
  if(d>=R)return;if(d<1e-5){dx=game.px-(c+0.5);dz=game.pz-(r+0.5);if(Math.abs(dx)>Math.abs(dz)){dx=Math.sign(dx)||1;dz=0;}else{dz=Math.sign(dz)||1;dx=0;}d=1;game.px+=dx*0.02;game.pz+=dz*0.02;}
  const nx=dx/d,nz=dz/d;const pen=R-Math.min(d,R);game.px+=nx*pen;game.pz+=nz*pen;const vn=game.vx*nx+game.vz*nz;
  if(vn<0){game.vx-=1.38*vn*nx;game.vz-=1.38*vn*nz;if(-vn>1.6&&game.hitCool<=0){AU.hit(-vn);game.hitCool=0.06;}}}
function stepRoll(h){
  const fo=level.floors[game.f];
  for(const b of fo.bars)b.a+=b.w*h;
  let ax=G*Math.sin(game.tilt.x),az=G*Math.sin(game.tilt.z);
  const cc=Math.floor(game.px),cr=Math.floor(game.pz);const ch=cellAt(fo,cc,cr);
  let k=0.55,vmax=10;
  if(ch==='I')k=0.07;else if(ch==='M'){k=3.4;vmax=2.6;}
  if(CONV[ch]){ax+=CONV[ch][0]*8;az+=CONV[ch][1]*8;}
  if(ch==='O'){const dx=cc+0.5-game.px,dz=cr+0.5-game.pz;ax+=dx*14;az+=dz*14;}
  game.vx+=ax*h;game.vz+=az*h;const dm=Math.exp(-k*h);game.vx*=dm;game.vz*=dm;
  const sp=Math.hypot(game.vx,game.vz);if(sp>vmax){const s=lerp(1,vmax/sp,ch==='M'?0.2:1);game.vx*=s;game.vz*=s;}
  game.px+=game.vx*h;game.pz+=game.vz*h;
  for(let pass=0;pass<2;pass++){const c0=Math.floor(game.px),r0=Math.floor(game.pz);
    for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++)if(solid(fo,c,r))collideBox(c,r);}
  // bumpers
  for(const b of fo.bumpers){const dx=game.px-(b.c+0.5),dz=game.pz-(b.r+0.5),d=Math.hypot(dx,dz),m=R+0.31;if(d<m&&d>1e-5){const nx=dx/d,nz=dz/d;game.px+=nx*(m-d);game.pz+=nz*(m-d);const vn=game.vx*nx+game.vz*nz;
      if(vn<0.5){game.vx-=vn*nx*2;game.vz-=vn*nz*2;const out=game.vx*nx+game.vz*nz;const add=Math.max(0,6.5-out);game.vx+=nx*add;game.vz+=nz*add;b.pulse=1;AU.bump();hintOnce('g_bump');}}}
  // spinning bars
  for(const b of fo.bars){const ux=Math.cos(b.a),uz=Math.sin(b.a);const rx=game.px-b.cx,rz=game.pz-b.cz;const tt=clamp(rx*ux+rz*uz,-1.3,1.3);const qx=b.cx+ux*tt,qz=b.cz+uz*tt;
    const dx=game.px-qx,dz=game.pz-qz,d=Math.hypot(dx,dz),m=R+0.08;if(d<m&&d>1e-5){const nx=dx/d,nz=dz/d;game.px+=nx*(m-d);game.pz+=nz*(m-d);
      const vbx=-b.w*(qz-b.cz),vbz=b.w*(qx-b.cx);const rvx=game.vx-vbx,rvz=game.vz-vbz;const vn=rvx*nx+rvz*nz;if(vn<0){game.vx-=1.6*vn*nx;game.vz-=1.6*vn*nz;if(-vn>1.6&&game.hitCool<=0){AU.hit(-vn);game.hitCool=0.06;}}}}
  // re-check walls after pushes
  {const c0=Math.floor(game.px),r0=Math.floor(game.pz);for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++)if(solid(fo,c,r))collideBox(c,r);}
  triggers(fo);
}
function triggers(fo){
  const c=Math.floor(game.px),r=Math.floor(game.pz);const ch=cellAt(fo,c,r);const dc=Math.hypot(game.px-(c+0.5),game.pz-(r+0.5));
  {const gk=ch==='I'?'g_ice':ch==='M'?'g_mud':CONV[ch]?'g_conv':ch==='T'?'g_warp':null;if(gk)hintOnce(gk);}
  for(const g of fo.gems){if(!g.got&&Math.hypot(game.px-(g.c+0.5),game.pz-(g.r+0.5))<0.44){g.got=true;game.gems++;AU.gem();updateHud();{const wp=fxPos(g.mesh);burst(wp,0x8fdcff);sparkBurst(wp);}}}
  for(const k of fo.keys){if(!k.got&&Math.hypot(game.px-(k.c+0.5),game.pz-(k.r+0.5))<0.44){k.got=true;fo.doorsOpen=true;AU.key();setTimeout(()=>AU.door(),250);toast(t('keyGet'));$('hudKey').classList.remove('hidden');burst(fxPos(k.mesh),0xffd60a);}}
  if(game.tpLock){let far=true;for(const p of fo.tps)if(Math.hypot(game.px-(p.c+0.5),game.pz-(p.r+0.5))<0.55)far=false;if(far)game.tpLock=false;}
  if(ch==='T'&&!game.tpLock&&dc<0.3){const other=fo.tps.find(p=>p.c!==c||p.r!==r);if(other){game.px=other.c+0.5;game.pz=other.r+0.5;game.tpLock=true;AU.warp();flash=0.5;}}
  if(ch==='X'&&dc<0.42){game.mode='resp';game.resp=0;AU.spike();hintOnce('g_spike');game.vx=game.vz=0;return;}
  if(ch==='O'&&dc<0.27){startFall(c,r);return;}
  if(ch==='G'&&dc<0.33){game.mode='goal';game.goalT=0;AU.goal();game.fall={hx:c+0.5,hz:r+0.5};snapPending=true;return;}
}

  const p=save.prog[si]||{stars:[false,false,false],best:null,gems:0};let newBest=false;

  {const n=r.stars.filter(Boolean).length;for(let i=0;i<3;i++)starPath(x,i<n?'#ffd60a':'rgba(214,223,236,.22)',L+30+i*68,372,30);}
  x.font='400 18px Oswald';x.fillStyle='#d6dfec';drawSpaced(x,'TIME',L,446,4);drawSpaced(x,'CRYSTAL',L+330,446,4);

function drawSpaced(x,s,px,py,sp){for(const ch of s){x.fillText(ch,px,py);px+=x.measureText(ch).width+sp;}}
function fitText(x,s,maxW){if(x.measureText(s).width<=maxW)return s;while(s.length>1&&x.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';}

function startConfetti(n,dur){const cv=$('confetti'),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const C=['#ffd60a','#ffffff','#3fb6ff','#e0102f','#a04dff'];const P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.8,vx:(Math.random()-0.5)*60,vy:80+Math.random()*140,r:Math.random()*6,vr:(Math.random()-0.5)*8,w:5+Math.random()*6,h:8+Math.random()*8,c:C[i%C.length]});
  cancelAnimationFrame(confRAF);let t0=performance.now(),last=t0;const step=now=>{const dt=Math.min(0.05,(now-last)/1000);last=now;const el=(now-t0)/1000;x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=40*dt;p.x+=p.vx*dt+Math.sin(el*3+p.r)*0.6;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.y>innerHeight+20&&el<dur){p.y=-20;p.x=Math.random()*innerWidth;p.vy=80+Math.random()*140;}
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=el>dur?Math.max(0,1-(el-dur)/1.5):1;x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.r*1.3)),p.w,p.h*Math.abs(Math.cos(p.r*1.3)));x.restore();}
    if(el<dur+1.6&&$('scrCele').classList.contains('on'))confRAF=requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight);};confRAF=requestAnimationFrame(step);}

const PUBLIC_BUILD=/uimemocho\.github\.io$/.test(location.hostname);
const DBG={on:false,auto:false,freeze:false,speed:1,unlock:false,fps:false,stage:0};

function closeDebug(){if(state==='paused'){resumeGame();}else showScreen(dbgReturn&&dbgReturn!=='scrDebug'?dbgReturn:(state==='select'?'scrSelect':state==='result'?'scrResult':'scrTitle'));}
function renderDebug(){const st=$('dbgStages');st.innerHTML='';STAGES.forEach((s,i)=>{const b=document.createElement('button');b.textContent='S'+String(i+1).padStart(2,'0');b.className=i===DBG.stage?'on':'';b.onclick=()=>{DBG.stage=i;renderDebug();};st.appendChild(b);});
  const fl=$('dbgFloors');fl.innerHTML='';const N=STAGES[DBG.stage].floors.length;for(let f=0;f<N;f++){const b=document.createElement('button');b.textContent=(N-f)+'F';b.onclick=()=>{debugJump(DBG.stage,f);};fl.appendChild(b);}
  document.querySelectorAll('[data-dbg]').forEach(b=>{const k=b.dataset.dbg;if(k in DBG&&typeof DBG[k]==='boolean')b.classList.toggle('on',DBG[k]);if(k==='speed')b.textContent='SPEED x'+DBG.speed;});}
function debugJump(si,f){startStage(si);game.countStep=3;game.count=3;game.mode='roll';showScreen(null);
  if(f>0){for(let i=0;i<f;i++){const fo=level.floors[i];const h=fo.holes[0];level.floors[i].fadeT=0;level.floors[i].fade=0.001;game.px=h.c+0.5;game.pz=h.r+0.5;}
    game.f=f;game.entry={x:game.px,z:game.pz};game.rootY=f*FH;game.tpLock=true;updateHud();}}
function entryOf(f){if(f===0){const s=level.floors[0].start;return {x:s.c+0.5,z:s.r+0.5};}const h=level.floors[f-1].holes[0];return {x:h.c+0.5,z:h.r+0.5};}
function inPlay(){return level&&(state==='play'||state==='paused');}

$('scrDebug').addEventListener('click',e=>{const b=e.target.closest('[data-dbg]');if(!b)return;e.stopPropagation();const k=b.dataset.dbg;AU.init();AU.ui();
  switch(k){
    case 'close':closeDebug();return;
    case 'hide':DBG.on=false;save.dbg=false;persist();$('btnDebug').classList.add('hidden');closeDebug();return;
    case 'auto':DBG.auto=!DBG.auto;if(!DBG.auto)input.drag=null;break;
    case 'freeze':DBG.freeze=!DBG.freeze;break;

    case 'fps':DBG.fps=!DBG.fps;$('fps').classList.toggle('hidden',!DBG.fps);break;
    case 'unlock':DBG.unlock=!DBG.unlock;if(state==='select')renderSelect();break;
    case 'allstar':STAGES.forEach((s,i)=>{save.prog[i]={stars:[true,true,true],best:s.par-1,gems:0};});persist();if(state==='select')renderSelect();notice('ALL STARS');break;
    case 'allclearfx':showScreen(null);showCele('allclear');return;
    case 'perfectfx':showScreen(null);showCele('perfect');return;
    case 'allclear':STAGES.forEach((s,i)=>{save.prog[i]={stars:[true,i%3!==0,i%2===0],best:s.par+3,gems:0};});save.flags={allClear:true};persist();if(state==='select')renderSelect();notice('ALL CLEARED (not perfect)');break;
    case 'reset':save.prog={};save.flags={};persist();notice('SAVE RESET');if(state==='select')renderSelect();break;
    case 'gems':if(inPlay()){level.floors.forEach(fo=>fo.gems.forEach(g=>{if(!g.got){g.got=true;game.gems++;}}));updateHud();AU.gem();}break;
    case 'key':if(inPlay()){const fo=level.floors[game.f];fo.keys.forEach(q=>q.got=true);fo.doorsOpen=true;$('hudKey').classList.remove('hidden');closeDebug();AU.key();toast(t('keyGet'));return;}break;
    case 'clear3':case 'clear1':if(!inPlay())startStage(DBG.stage);closeDebug();showScreen(null);
      if(k==='clear3'){level.floors.forEach(fo=>fo.gems.forEach(g=>{if(!g.got){g.got=true;game.gems++;}}));game.elapsed=Math.min(level.st.par-0.5,8.88);}else{game.elapsed=level.st.par+5;}
      {const L=level.N-1;const gl=level.floors[L].goal;for(let i=0;i<L;i++){level.floors[i].fadeT=0;}game.f=L;game.rootY=L*FH;game.px=gl.c+0.5;game.pz=gl.r+0.5;game.mode='goal';game.goalT=0;game.fall={hx:game.px,hz:game.pz};AU.goal();snapPending=true;updateHud();}return;
    case 'timeup':if(!inPlay())startStage(DBG.stage);closeDebug();showScreen(null);game.mode='roll';game.elapsed=level.st.limit-1.2;return;
    case 'fall':if(inPlay()&&game.f<level.N-1){closeDebug();const h=level.floors[game.f].holes[0];game.px=h.c+0.5;game.pz=h.r+0.5;startFall(h.c,h.r);return;}break;
    case 'spike':if(inPlay()){closeDebug();game.mode='resp';game.resp=0;AU.spike();return;}break;
    case 'warpfx':if(inPlay()){closeDebug();AU.warp();flash=0.5;return;}break;
    case 'countdown':if(inPlay()){startStage(game.si);return;}startStage(DBG.stage);return;
    case 'burst':if(inPlay()){closeDebug();const p=ball.position.clone();p.y+=0.3;sparkBurst(p);burst(p,0xdff8ff);AU.gem();return;}break;
    case 'toast':closeDebug();toast(t('keyGet'));notice(t('gyroNG'));return;
  }

/* auto-play bot */
const BOT={path:null,pf:-1,idx:0,opened:false};
function botPlan(){const g=game,fo=level.floors[g.f];const H=level.H,W=level.W;const at=(c,r)=>(r<0||c<0||r>=H||c>=W)?'#':fo.grid[r][c];const tps=fo.tps.map(p=>[p.c,p.r]);
  const CV={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};
  function bfs(goal){const s=[Math.floor(g.px),Math.floor(g.pz)];const prev=new Map();prev.set(s+'',null);const q=[s];
    while(q.length){const [c,r]=q.shift();if(goal(c,r)){const out=[];let k=c+','+r;while(k){out.unshift(k.split(',').map(Number));k=prev.get(k);}return out;}
      const ch=at(c,r);const nb=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]];if(ch==='T'&&!(c===s[0]&&r===s[1])){const o=tps.find(p=>p[0]!==c||p[1]!==r);if(o)nb.push(o);}
      for(const [nc,nr] of nb){const n=at(nc,nr),mx=nc-c,mz=nr-r;if(Math.abs(mx)+Math.abs(mz)===1){if(CV[ch]&&CV[ch][0]===-mx&&CV[ch][1]===-mz)continue;if(CV[n]&&CV[n][0]===-mx&&CV[n][1]===-mz)continue;}
        if(n==='#'||n==='X'||n==='B')continue;if(n==='D'&&!fo.doorsOpen)continue;if(n==='O'&&!goal(nc,nr))continue;const k=nc+','+nr;if(!prev.has(k)){prev.set(k,[c,r]+'');q.push([nc,nr]);}}}return null;}
  const isT=(c,r)=>g.f===level.N-1?at(c,r)==='G':at(c,r)==='O';
  let p=bfs(isT);if(!p){const k=fo.keys.find(k=>!k.got);if(k)p=bfs((c,r)=>c===k.c&&r===k.r);}
  BOT.path=p;BOT.idx=1;BOT.pf=g.f;BOT.opened=fo.doorsOpen;}
function botTick(){const g=game;if(state!=='play'||g.mode!=='roll'||!level){BOT.path=null;if(input.drag&&input.drag.id===-9)input.drag=null;return;}
  const fo=level.floors[g.f];if(!BOT.path||BOT.pf!==g.f||fo.doorsOpen!==BOT.opened)botPlan();const P=BOT.path;if(!P){input.drag={id:-9,dx:0,dy:0};return;}
  let best=BOT.idx,bd=1e9;for(let i=Math.max(0,BOT.idx-1);i<Math.min(P.length,BOT.idx+3);i++){const d=Math.hypot(g.px-P[i][0]-0.5,g.pz-P[i][1]-0.5);if(d<bd){bd=d;best=i;}}if(best>BOT.idx)BOT.idx=best;
  const cur=P[Math.min(BOT.idx,P.length-1)];if(Math.hypot(g.px-cur[0]-0.5,g.pz-cur[1]-0.5)<0.35&&BOT.idx<P.length-1)BOT.idx++;
  const tg=P[Math.min(BOT.idx,P.length-1)];if(Math.hypot(g.px-tg[0]-0.5,g.pz-tg[1]-0.5)>2.2){botPlan();return;}
  const dx=tg[0]+0.5-g.px,dz=tg[1]+0.5-g.pz,d=Math.hypot(dx,dz)||1;const nx=P[Math.min(BOT.idx+1,P.length-1)];const nd=Math.hypot(nx[0]-tg[0],nx[1]-tg[1])||1;
  const turn=((nx[0]-tg[0])*dx+(nx[1]-tg[1])*dz)/(nd*d)<0.5||BOT.idx>=P.length-1;const ch=cellAt(fo,Math.floor(g.px),Math.floor(g.pz));
  let vd=3.4;if(turn)vd=Math.min(vd,0.9+d*2.5);if(ch==='I')vd*=0.7;const wx=dx/d*vd,wz=dz/d*vd;
  input.drag={id:-9,dx:clamp((wx-g.vx)*0.2,-TILT_MAX,TILT_MAX),dy:clamp((wz-g.vz)*0.2,-TILT_MAX,TILT_MAX)};}

function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;for(let i=0;i<DBG.speed;i++)update(dt);renderer.render(scene,camera);
  if(DBG.fps){fpsAcc+=dt;fpsN++;if(fpsAcc>0.5){$('fps').textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0;}}
  if(snapPending){snapPending=false;try{const c=renderer.domElement;snapCanvas.width=c.width;snapCanvas.height=c.height;snapCanvas.getContext('2d').drawImage(c,0,0);}catch(e){}}
  requestAnimationFrame(loop);}
