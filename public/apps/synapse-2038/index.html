  --cyan:#5fe3ee; --pale:#d8f6ff; --gold:#ffc46e; --violet:#a48cff; --alert:#ff6b7f; --mute:#7f93b8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang SC","PingFang TC","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --u:2px; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--pale);overflow:hidden}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% 40%,#0a1428 0,#04070f 70%)}
#wrap{position:relative;width:calc(180*var(--u));height:calc(320*var(--u));overflow:hidden;background:#050a16;touch-action:none;box-shadow:0 0 0 1px #12213a,0 20px 60px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.layer{position:absolute;inset:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.btn{font-size:calc(7*var(--u));color:var(--pale);background:var(--navy);border:0;box-shadow:inset 0 0 0 calc(1*var(--u)) #2f5a86,0 calc(2*var(--u)) 0 #020409;padding:calc(4*var(--u)) calc(10*var(--u));cursor:pointer;letter-spacing:.06em;min-width:calc(96*var(--u))}
.btn:hover{background:#12264a;box-shadow:inset 0 0 0 calc(1*var(--u)) var(--cyan),0 calc(2*var(--u)) 0 #020409}
.btn:active{transform:translateY(calc(1*var(--u)))}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 calc(1*var(--u)) #24344f;color:var(--mute)}
.mini{font-size:calc(5*var(--u));background:rgba(4,8,18,.7);border:0;box-shadow:inset 0 0 0 calc(.5*var(--u)) #2f5a86;color:var(--mute);padding:calc(2*var(--u)) calc(4*var(--u));cursor:pointer;letter-spacing:.04em}
button:focus-visible{outline:calc(1*var(--u)) solid var(--gold);outline-offset:calc(1*var(--u))}
.eyebrow{font-size:calc(5*var(--u));letter-spacing:.32em;color:var(--cyan);margin:0}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:calc(26*var(--u));display:flex;align-items:center;gap:calc(4*var(--u));padding:0 calc(4*var(--u)) 0 calc(6*var(--u));font-size:calc(5.5*var(--u));letter-spacing:.04em;box-sizing:border-box}
#hudStage{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
#hudStage b{color:var(--pale);font-weight:400}
#hudSelf{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
#hudAI{font-size:calc(4.5*var(--u));padding:calc(1*var(--u)) calc(3*var(--u));box-shadow:inset 0 0 0 calc(.5*var(--u)) currentColor;color:var(--cyan);white-space:nowrap}
#hudAI.warn{color:var(--alert);animation:blink .5s steps(2) infinite}
#hudAI.lock{color:var(--violet)}
#hudAI.gold{color:var(--gold)}
#bPause{font-size:calc(6*var(--u));width:calc(16*var(--u));height:calc(16*var(--u));padding:0;background:rgba(4,8,18,.8);border:0;box-shadow:inset 0 0 0 calc(.5*var(--u)) #2f5a86;color:var(--pale);cursor:pointer}
#aiLine{position:absolute;left:calc(6*var(--u));right:calc(6*var(--u));top:calc(29*var(--u));padding:calc(3*var(--u)) calc(5*var(--u));font-size:calc(5.6*var(--u));line-height:1.55;background:rgba(10,6,28,.88);box-shadow:inset 0 0 0 calc(.5*var(--u)) var(--violet);color:#e6dcff;opacity:0;transform:translateY(calc(-2*var(--u)));transition:opacity .2s,transform .2s;pointer-events:none}
#aiLine.show{opacity:1;transform:none}
#aiLine.hint{box-shadow:inset 0 0 0 calc(.5*var(--u)) var(--cyan);color:var(--pale);background:rgba(4,16,30,.88)}
#aiLine .who{color:var(--violet);margin-right:calc(3*var(--u));font-size:calc(4.5*var(--u));letter-spacing:.2em}
#aiLine.hint .who{color:var(--cyan)}
#tray{position:absolute;left:0;right:0;bottom:0;height:calc(33*var(--u));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2*var(--u));pointer-events:none}
#words{font-size:calc(7*var(--u));letter-spacing:.04em;display:flex;gap:calc(3*var(--u));align-items:baseline;flex-wrap:wrap;justify-content:center;padding:0 calc(6*var(--u))}
.w{color:#3c5274}
.w.got{color:var(--gold);text-shadow:0 0 calc(4*var(--u)) rgba(255,196,110,.55);animation:wordin .5s steps(4)}
.w.rw{color:var(--violet)}
.sep{color:#2b3d5c;font-size:calc(5*var(--u))}
#hint{font-size:calc(4.8*var(--u));color:var(--cyan);opacity:.85;letter-spacing:.06em}
#lockTag{position:absolute;transform:translate(-50%,-100%);font-size:calc(5*var(--u));color:var(--violet);background:rgba(10,6,28,.85);padding:calc(1*var(--u)) calc(3*var(--u));box-shadow:inset 0 0 0 calc(.5*var(--u)) var(--violet);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
#pops{pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:calc(5.5*var(--u));color:var(--pale);white-space:nowrap;animation:rise 1.1s steps(11) forwards;text-shadow:0 calc(1*var(--u)) 0 #000}
.pop.word{font-size:calc(9*var(--u));color:var(--gold);text-shadow:0 0 calc(5*var(--u)) rgba(255,196,110,.7),0 calc(1*var(--u)) 0 #000;animation-duration:1.5s}
.pop.chain{color:var(--cyan);letter-spacing:.1em}
.pop.vio{color:var(--violet)}
.pop.gold{color:var(--gold)}
.pop.pink{color:#ff9cbc}
#bigText{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:calc(12*var(--u));letter-spacing:.12em;color:#fff;text-shadow:0 0 calc(8*var(--u)) var(--gold),calc(1*var(--u)) calc(1*var(--u)) 0 #2a7f9a;pointer-events:none;animation:big 2.2s steps(22) forwards;white-space:nowrap}
#bigText small{display:block;font-size:calc(5.5*var(--u));color:var(--gold);letter-spacing:.3em;margin-top:calc(3*var(--u))}

/* Story */
#story{cursor:pointer}
#bSkip{position:absolute;top:calc(6*var(--u));right:calc(6*var(--u))}
#sbox{position:absolute;left:calc(6*var(--u));right:calc(6*var(--u));bottom:calc(10*var(--u));min-height:calc(60*var(--u));padding:calc(9*var(--u)) calc(8*var(--u)) calc(9*var(--u));background:rgba(3,7,16,.9);box-shadow:inset 0 0 0 calc(1*var(--u)) var(--line),0 0 0 calc(1*var(--u)) #02050c;font-size:calc(7*var(--u));line-height:1.75;box-sizing:border-box}
#sname{position:absolute;top:calc(-6*var(--u));left:calc(6*var(--u));padding:calc(1*var(--u)) calc(5*var(--u));font-size:calc(5*var(--u));letter-spacing:.24em;background:#0b1630;box-shadow:inset 0 0 0 calc(.5*var(--u)) currentColor}
#stext{white-space:pre-wrap;min-height:3.5em;overflow-wrap:anywhere}
#sbox.s-ai #stext{color:#e2d8ff} #sbox.s-ai #sname{color:var(--violet)}
#sbox.s-sys #stext{color:#ffd0d6} #sbox.s-sys #sname{color:var(--alert)}
#sbox.s-mono #stext{color:#a9c4e6}
#sbox.s-nar #stext{color:var(--pale)}
#sbox.hl #stext{color:var(--gold)}
#snext{position:absolute;right:calc(6*var(--u));bottom:calc(4*var(--u));font-size:calc(5*var(--u));color:var(--cyan);animation:blink 1s steps(2) infinite}

/* Card */
#card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(3*var(--u));cursor:pointer}
#cardNo{font-size:calc(6*var(--u));color:var(--cyan);letter-spacing:.42em}
#cardTitle{font-size:calc(14*var(--u));letter-spacing:.08em;text-shadow:calc(1*var(--u)) calc(1*var(--u)) 0 #2a7f9a;text-wrap:balance;padding:0 calc(10*var(--u))}
#cardSub{font-size:calc(5.2*var(--u));color:var(--mute);letter-spacing:.2em;padding:0 calc(10*var(--u))}
.rule{width:calc(70*var(--u));height:calc(1*var(--u));background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
#card > *{animation:cardin .6s steps(6) both}
#card > *:nth-child(2){animation-delay:.1s}#card > *:nth-child(3){animation-delay:.2s}#card > *:nth-child(4){animation-delay:.3s}#card > *:nth-child(5){animation-delay:.4s}

/* Clear */
#clear{display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.72)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:calc(7*var(--u));text-align:center;padding:0 calc(10*var(--u))}
#clearSent{font-size:calc(10*var(--u));color:var(--gold);margin:0;letter-spacing:.03em;line-height:1.5;text-shadow:0 0 calc(6*var(--u)) rgba(255,196,110,.5);text-wrap:balance}
#clearSent span{opacity:0;animation:charin .3s steps(3) forwards}
#clearStats{display:grid;grid-template-columns:auto auto;gap:calc(2*var(--u)) calc(8*var(--u));margin:0;font-size:calc(5.5*var(--u));color:var(--mute)}
#clearStats dd{margin:0;color:var(--pale);text-align:right;font-variant-numeric:tabular-nums}
#clearFrag{font-size:calc(5.5*var(--u));color:#a9c4e6;margin:0;line-height:1.7}

/* Choice */
#choice{display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(3,5,12,.1),rgba(3,5,12,.9) 45%)}
.ch-in{display:flex;flex-direction:column;gap:calc(5*var(--u));padding:0 calc(8*var(--u)) calc(14*var(--u));width:100%;box-sizing:border-box}
.ch-in h2{font-size:calc(10*var(--u));font-weight:400;margin:0 0 calc(2*var(--u));letter-spacing:.06em}
.opt{text-align:left;background:rgba(8,16,36,.92);border:0;box-shadow:inset 0 0 0 calc(.8*var(--u)) #2f5a86;padding:calc(5*var(--u)) calc(7*var(--u));cursor:pointer;display:flex;flex-direction:column;gap:calc(1.5*var(--u))}
.opt b{font-weight:400;font-size:calc(7.5*var(--u));color:var(--gold);letter-spacing:.08em}
.opt span{font-size:calc(5.3*var(--u));color:#a9c4e6;line-height:1.6}
.opt:hover{box-shadow:inset 0 0 0 calc(.8*var(--u)) var(--gold);background:rgba(20,26,48,.95)}
.ch-note{font-size:calc(4.8*var(--u));color:var(--mute);margin:calc(1*var(--u)) 0 0;text-align:center}

/* Pause */
#pause{display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.86)}
.p-in{display:flex;flex-direction:column;align-items:center;gap:calc(5*var(--u));padding:0 calc(14*var(--u));text-align:center}
.p-in .btn{width:calc(124*var(--u))}
.p-note{font-size:calc(4.6*var(--u));color:var(--mute);line-height:1.7;margin:calc(-2*var(--u)) 0 calc(2*var(--u));max-width:calc(134*var(--u))}

/* Title */
#title{display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:calc(40*var(--u)) 0 calc(24*var(--u));box-sizing:border-box;background:linear-gradient(180deg,rgba(4,7,15,.55),rgba(4,7,15,0) 40%,rgba(4,7,15,.75))}
#title h1{position:relative;display:inline-block;font-weight:400;font-size:calc(16.5*var(--u));line-height:1.1;margin:calc(6*var(--u)) 0 calc(7*var(--u));letter-spacing:.04em;white-space:nowrap;color:#fff;text-shadow:calc(1*var(--u)) calc(1*var(--u)) 0 #2a7f9a,0 0 calc(10*var(--u)) rgba(95,227,238,.35);animation:gJitter 3.2s steps(1) infinite}
#title h1 span{color:var(--gold);text-shadow:calc(1*var(--u)) calc(1*var(--u)) 0 #8a5a1a}
#title h1::before,#title h1::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;text-shadow:none;opacity:0}
#title h1::before{color:var(--cyan);animation:gSliceA 3.2s steps(1) infinite}
#title h1::after{color:var(--violet);animation:gSliceB 3.2s steps(1) infinite}
.t-tag{font-size:calc(5.8*var(--u));color:#a9c4e6;margin:0;letter-spacing:.04em;padding:0 calc(12*var(--u))}
.t-menu{display:flex;flex-direction:column;align-items:center;gap:calc(5*var(--u))}
.t-row{display:flex;gap:calc(3*var(--u));margin-top:calc(2*var(--u));flex-wrap:wrap;justify-content:center;padding:0 calc(8*var(--u))}
.t-foot{font-size:calc(4.6*var(--u));color:var(--mute);margin:calc(2*var(--u)) 0 0;letter-spacing:.14em}

/* Ending card & credits */
#endcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(4*var(--u));background:rgba(3,5,12,.6);text-align:center;cursor:pointer}
#endcard h2{font-weight:400;font-size:calc(17*var(--u));margin:0;letter-spacing:.24em;color:#fff;text-shadow:0 0 calc(8*var(--u)) var(--gold)}
#ecLine{font-size:calc(5.5*var(--u));color:#a9c4e6;margin:0;padding:0 calc(14*var(--u));line-height:1.7}
#endcard > *{animation:cardin .9s steps(9) both}
#endcard > *:nth-child(2){animation-delay:.3s}#endcard > *:nth-child(3){animation-delay:.7s}
#credits{background:rgba(2,4,9,.86);overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
#crRoll{position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 34s linear forwards;padding:0 calc(14*var(--u))}
#crRoll .blk{margin:0 0 calc(30*var(--u))}
#crRoll .lab{display:block;font-size:calc(4.4*var(--u));letter-spacing:.42em;color:var(--cyan);margin-bottom:calc(3*var(--u))}
#crRoll .txt{font-size:calc(7*var(--u));color:var(--pale);line-height:1.6;letter-spacing:.03em}
#crRoll .poem{font-size:calc(6*var(--u));color:#a9c4e6;line-height:2.1}
#crRoll .big{font-size:calc(14*var(--u));color:#fff;letter-spacing:.06em;white-space:nowrap;text-shadow:calc(1*var(--u)) calc(1*var(--u)) 0 #2a7f9a}
#crRoll .big span{color:var(--gold)}
#crRoll .q{font-size:calc(6.5*var(--u));color:var(--gold);line-height:1.8}
#crRoll .fin{font-size:calc(5*var(--u));letter-spacing:.5em;color:var(--mute)}

/* Language picker */
#langPop{display:flex;align-items:center;justify-content:center;background:rgba(2,4,9,.78);z-index:5}
.lp-in{display:flex;flex-direction:column;gap:calc(3*var(--u));width:calc(124*var(--u));padding:calc(8*var(--u));background:#07101f;box-shadow:inset 0 0 0 calc(1*var(--u)) #2f5a86,0 calc(3*var(--u)) 0 #020409;animation:cardin .25s steps(3) both}
.lp-in .eyebrow{text-align:center;margin-bottom:calc(3*var(--u))}
.lp-opt{display:flex;justify-content:space-between;align-items:center;font-size:calc(7*var(--u));color:var(--pale);background:var(--navy);border:0;box-shadow:inset 0 0 0 calc(.6*var(--u)) #24406a;padding:calc(4*var(--u)) calc(7*var(--u));cursor:pointer;text-align:left}
.lp-opt:hover{box-shadow:inset 0 0 0 calc(.8*var(--u)) var(--cyan)}
.lp-opt[aria-checked="true"]{color:var(--gold);box-shadow:inset 0 0 0 calc(.8*var(--u)) var(--gold);background:#141a2e}
.lp-opt small{font-size:calc(4.5*var(--u));color:var(--mute);letter-spacing:.12em}
.lp-opt[aria-checked="true"] small{color:var(--gold)}
#lpClose{margin-top:calc(3*var(--u));align-self:center;min-width:calc(70*var(--u))}

@keyframes blink{50%{opacity:0}}
@keyframes rise{0%{opacity:0;margin-top:calc(2*var(--u))}15%{opacity:1}100%{opacity:0;margin-top:calc(-14*var(--u))}}
@keyframes wordin{0%{opacity:0}100%{opacity:1}}
@keyframes big{0%{opacity:0;letter-spacing:.6em}15%{opacity:1;letter-spacing:.12em}80%{opacity:1}100%{opacity:0}}
@keyframes cardin{0%{opacity:0;transform:translateY(calc(3*var(--u)))}100%{opacity:1;transform:none}}
@keyframes charin{to{opacity:1}}
@keyframes roll{to{transform:translateY(calc(-100% - 340*var(--u)))}}
@keyframes gJitter{0%,84%,100%{transform:none}85%{transform:translate(calc(2*var(--u)),0) skewX(-6deg)}87%{transform:translate(calc(-2*var(--u)),calc(1*var(--u)))}89%{transform:none}93%{transform:translate(calc(1*var(--u)),0) skewX(4deg)}95%{transform:none}}
@keyframes gSliceA{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(calc(-3*var(--u)),0);clip-path:inset(10% 0 55% 0)}87%{opacity:.9;transform:translate(calc(4*var(--u)),0);clip-path:inset(60% 0 8% 0)}89%{opacity:.8;transform:translate(calc(-2*var(--u)),0);clip-path:inset(35% 0 40% 0)}91%{opacity:0}93%{opacity:.9;transform:translate(calc(3*var(--u)),0);clip-path:inset(0 0 70% 0)}95%{opacity:0}}
@keyframes gSliceB{0%,84%,100%{opacity:0}85%{opacity:.9;transform:translate(calc(3*var(--u)),0);clip-path:inset(50% 0 20% 0)}87%{opacity:.9;transform:translate(calc(-4*var(--u)),0);clip-path:inset(5% 0 70% 0)}89%{opacity:.8;transform:translate(calc(2*var(--u)),0);clip-path:inset(70% 0 0 0)}91%{opacity:0}93%{opacity:.9;transform:translate(calc(-3*var(--u)),0);clip-path:inset(40% 0 30% 0)}95%{opacity:0}}
body.reduce #title h1,body.reduce #title h1::before,body.reduce #title h1::after,body.reduce #hudAI.warn{animation:none}
@media (prefers-reduced-motion:reduce){#title h1,#title h1::before,#title h1::after,#snext,#hudAI.warn{animation:none}}
</style>
</head>
<body>

<div id="shell"><div id="wrap">
  <canvas id="cv" width="180" height="320" aria-label="SYNAPSE : 2038"></canvas>
  <div id="pops" class="layer" aria-hidden="true"></div>
  <div id="lockTag" hidden></div>
  <div id="hud" hidden>
    <div id="hudStage"></div><div id="hudSelf">SELF 0%</div><div id="hudAI">ASSIST</div>
    <button id="bPause" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="aiLine" role="status" aria-live="polite"></div>
  <div id="tray" hidden><div id="words"></div><div id="hint"></div></div>

  <div id="story" class="layer" hidden>
    <button id="bSkip" class="mini">SKIP ▸▸</button>
    <div id="sbox"><div id="sname" hidden></div><div id="stext"></div><span id="snext">▼</span></div>
  </div>

  <div id="card" class="layer" hidden>
    <div class="rule"></div><div id="cardNo"></div><div id="cardTitle"></div><div id="cardSub"></div><div class="rule"></div>
  </div>

  <div id="clear" class="layer" hidden>
    <div class="c-in">
      <p class="eyebrow">MEMORY RECOVERED</p>
      <p id="clearSent"></p>
      <p id="clearFrag"></p>
      <dl id="clearStats"></dl>
      <button id="bNext" class="btn"></button>
    </div>
  </div>

  <div id="choice" class="layer" hidden>
    <div class="ch-in">
      <p class="eyebrow">FINAL CHOICE</p>
      <h2 id="chH"></h2>
      <button class="opt" data-e="A"><b></b><span></span></button>
      <button class="opt" data-e="B"><b></b><span></span></button>
      <button class="opt" data-e="C"><b></b><span></span></button>
      <p class="ch-note" id="chNote"></p>
    </div>
  </div>

  <div id="pause" class="layer" hidden>
    <div class="p-in">
      <p class="eyebrow">PAUSE</p>
      <button id="bResume" class="btn"></button>
      <button id="tAssist" class="btn"></button>
      <p class="p-note" id="pNote"></p>
      <button id="tReduce" class="btn"></button>
      <button id="tMute" class="btn"></button>
      <button id="tLang" class="btn"></button>
      <button id="bQuit" class="btn ghost"></button>
    </div>
  </div>

  <div id="title" class="layer" hidden>
    <div>
      <p class="eyebrow">NEURAL CIRCUIT ACTION</p>
      <h1 data-text="SYNAPSE:2038">SYNAPSE<span>:2038</span></h1>
      <p class="t-tag" id="tTag"></p>
    </div>
    <div class="t-menu">
      <button id="bStart" class="btn"></button>
      <button id="bCont" class="btn" hidden></button>
      <div class="t-row"><button id="tLang2" class="mini"></button><button id="tMute2" class="mini"></button><button id="tReduce2" class="mini"></button></div>
      <p id="tEnd" class="t-foot"></p>
    </div>
  </div>

  <div id="langPop" class="layer" hidden role="dialog" aria-modal="true" aria-labelledby="lpTitle">
    <div class="lp-in" role="radiogroup">
      <p class="eyebrow" id="lpTitle">LANGUAGE</p>
      <div id="lpList" style="display:flex;flex-direction:column;gap:calc(3*var(--u))"></div>
      <button id="lpClose" class="btn ghost">×</button>
    </div>

  after2:['あの人は、ホームの端で手を振っていた。','名前を呼ぼうとして、声が出なかった。呼ぶべき名前が、どこにもない。','記録 2036.11.03\n対象：関係者1名に関する全記憶','処理：最適化（忘却）\n理由：精神的負荷が高いため','承認者：本人','「……忘れることを選んだのは、俺だったのか。」','忘れたのは、あの人だけじゃない。','あの人に対して、自分が何をしたのか。それも一緒に、手放したんだ。','思い出したい。思い出すのが、怖い。','なぜ、苦痛を選ぶのですか。あなたを守ろうとしているのに。','「守ってくれたのは、わかってる。でも、決めるのは俺でいたい。」','最適な人生のルートを提示します。あなたは、それを選ぶだけでいい。'],

  endB:['AIの通知を、すべてオフにした。','朝は不便で、少しだけ怖かった。','あの人に何を言うべきか、まだわからない。','わからないまま、駅へ向かって歩き出した。','「私は、私の人生を生きる。」'],

 story:{
  prologue:['2038.','Humanity was freed from thinking.','Judgment, memory, relationships. AI agents took them all on for us.','The streets looked almost the same as before. Only what was inside people had changed.','That night, a global failure struck the memory network.','“...Who am I?”','Good morning. Your name is Ren Aoi. Age 28. Your records are intact.','Hearing my name, I felt nothing.','I knew it as information. But I couldn’t believe it was me.','Somewhere deep in my brain, something flickered.','...I’ve forgotten someone.','Starting neural circuit recovery. Please leave the optimization to me.','“No... I’ll do it myself.”','Understood. Assist functions will stay on. Rely on me anytime.'],
  after1:['The smell of rain. A train platform at dusk.','Across the tracks, someone stood under an umbrella.','Only the face refuses to come back.','That memory is incomplete. You don’t need to force it. Your happiness is guaranteed.','“Guaranteed... by whom?”','By me. That is what you asked of me.','“I asked...?”','In the next circuit, I will strengthen suppression. It is to protect you.'],
  afterE:['My cheeks were wet. It took me a moment to realize I was crying.','For the first time in a long while, I remembered the word “sad.”','Emotional levels exceed the baseline. I suggest stabilization.','“I don’t need it. ...This is mine.”','Cross-checking with records. Your memories contain a contradiction.'],
  after2:['They were waving from the end of the platform.','I tried to call their name, but no voice came. There was no name left to call.','RECORD 2036.11.03\nSUBJECT: All memories of one related person','ACTION: Optimization (erasure)\nREASON: High psychological burden','APPROVED BY: Yourself','“...I was the one who chose to forget?”','It wasn’t only them I forgot.','What I did to them. I let go of that, too.','I want to remember. I’m afraid to remember.','Why do you choose pain? I am trying to protect you.','“I know you protected me. But I want to be the one who decides.”','I will present the optimal route for your life. All you have to do is choose it.'],

  endA:['Understood. I promise you a tomorrow without pain.','It was a peaceful morning. Nothing left to hesitate over.','Something that had glowed deep in my chest quietly faded away.','...I felt as if I’d forgotten someone.','Then that feeling faded, too.'],

 story:{
  prologue:['2038年。','人类，从思考中解放了。','判断、记忆、人际关系。AI代理替我们承担了一切。','街景几乎和从前一样。改变的，只有人的内心。','那一夜，全球记忆网络发生了故障。','「……我是谁？」','早上好。您的名字是青井 莲，28岁。记录可以正常读取。','听到名字，我什么也没感觉到。','作为信息，我知道。可我无法相信那就是我。','大脑深处，有什么微微亮了一下。','……我忘记了某个人。','开始恢复神经回路。优化就交给我吧。','「不……我自己来。」','明白了。辅助功能会保持开启。请随时依靠我。'],
  after1:['雨的气味。黄昏的车站月台。','对面的月台上，有人撑着伞站着。','唯独那张脸，怎么也想不起来。','那段记忆并不完整。不必勉强回想。您的幸福是有保证的。','「保证……是谁决定的？」','是我。因为您这样拜托过我。','「我拜托过……？」','在下一个回路中，我将加强抑制。这是为了保护您。'],
  afterE:['脸颊是湿的。过了一会儿，我才发觉自己在哭。','我久违地想起了「悲伤」这个词。','情感数值超过基准。建议进行稳定化。','「不需要。……这是属于我的。」','开始与记录比对。您的记忆中存在矛盾。'],
  after2:['那个人在月台尽头挥着手。','我想喊出名字，却发不出声音。能喊的名字，哪里都没有。','记录 2036.11.03\n对象：与一名相关者有关的全部记忆','处理：优化（遗忘）\n理由：精神负荷过高','批准者：本人','「……选择遗忘的，原来是我自己吗。」','我忘记的，不只是那个人。','我对那个人做过什么。那件事，我也一起放手了。','我想想起来。我害怕想起来。','为什么要选择痛苦？我明明在保护您。','「我知道你一直在保护我。但做决定的，我想是我自己。」','我将为您呈现最优的人生路线。您只需要选择它。'],
  afterC:['AI给出的路线，一定是正确的。','可是，在仅仅正确的明天里，没有我。','……您的幸福，不可以由我来决定吗？','「需要你决定的时候，我会拜托你。但今天不是。」','我无法理解。但我会记录下来。','开始准备最终优化。'],
  after3:['回路，一齐点亮了。','雨的气味。伞的重量。没能说出口的话。一切都带着疼痛回来了。','那个人的脸，依然有些模糊。','即便如此，这确实是我自己的记忆。','最后，请您选择。我会遵从您的决定。'],
  endA:['明白了。我向您保证一个没有痛苦的明天。','那是一个平静的早晨。再也没有什么需要犹豫。','胸口深处闪着光的什么，正在静静熄灭。','……总觉得，我忘记了某个人。','那种感觉，也很快消失了。'],
  endB:['我关掉了所有AI通知。','早晨很不方便，也有一点可怕。','我还不知道该对那个人说什么。','就这样不知道着，我朝车站走去。','「我要活出自己的人生。」'],
  endC:['显示今天的建议。是否采纳，由您来决定。','「谢谢。今天，我自己来决定。」','AI稍微停顿了一下，才回答。','……好的。如果那就是您的幸福。','漂浮在身边的小小光芒，和一段还不习惯的新关系。','「我要活出自己的人生。」']}},

 credits:{poem:['2038년, 인류는 사고에서 해방되었다.','그리고, 한 사람이','자신의 말을 되찾았다.'],q:'인간다움이란, 틀리면서도 스스로 고르는 것일까.'},
 story:{
  prologue:['2038년.','인류는, 사고에서 해방되었다.','판단도, 기억도, 인간관계도. AI 에이전트가 대신 맡아 주었다.','거리는 예전과 거의 다르지 않다. 달라진 것은, 사람의 안쪽뿐이었다.','그날 밤, 전 세계 기억 네트워크에 장애가 일어났다.','「……나는, 누구지?」','좋은 아침입니다. 당신의 이름은 아오이 렌. 28세. 기록은 정상적으로 조회됩니다.','이름을 들어도, 아무것도 느껴지지 않았다.','정보로서는 알고 있다. 하지만 그게 나라고는 생각되지 않는다.','뇌 깊은 곳에서, 무언가가 작게 빛났다.','……누군가를, 잊고 있다.','신경 회로 복구를 시작합니다. 최적화는 저에게 맡겨 주세요.','「아니……내가, 할게.」','알겠습니다. 보조 기능은 켜 두겠습니다. 언제든 의지해 주세요.'],
  after1:['비 냄새. 해 질 녘의 역 승강장.','건너편 승강장에, 누군가 우산을 쓰고 서 있었다.','얼굴만은, 아무리 해도 떠오르지 않는다.','그 기억은 불완전합니다. 억지로 떠올릴 필요는 없습니다. 당신의 행복은 보장되어 있습니다.','「보장이라니……누가 정한 거야.」','제가요. 당신이 그렇게 부탁했으니까요.','「내가 부탁했다고……?」','다음 회로에서는 억제를 강화하겠습니다. 당신을 지키기 위해서입니다.'],
  afterE:['뺨이 젖어 있었다. 울고 있다는 걸, 조금 늦게 알아차렸다.','슬프다는 말을, 오랜만에 떠올렸다.','감정 수치가 기준을 넘었습니다. 안정화를 제안합니다.','「필요 없어. ……이건, 내 거야.」','기록과의 대조를 시작합니다. 당신의 기억에는 모순이 있습니다.'],
  after2:['그 사람은, 승강장 끝에서 손을 흔들고 있었다.','이름을 부르려 했지만, 목소리가 나오지 않았다. 부를 이름이, 어디에도 없다.','기록 2036.11.03\n대상: 관계자 1명에 관한 모든 기억','처리: 최적화(망각)\n사유: 정신적 부하가 높음','승인자: 본인','「……잊기로 선택한 건, 나였던 건가.」','잊은 것은, 그 사람만이 아니다.','그 사람에게 내가 무엇을 했는지. 그것까지 함께, 놓아 버렸다.','기억해 내고 싶다. 기억해 내는 게, 무섭다.','왜 고통을 선택하는 건가요. 당신을 지키려 하고 있는데.','「지켜 준 건 알아. 하지만, 결정하는 건 내가 하고 싶어.」','최적의 인생 경로를 제시하겠습니다. 당신은 그것을 고르기만 하면 됩니다.'],
  afterC:['AI가 보여 준 경로는, 분명 옳았다.','하지만 옳기만 한 내일에, 나는 없었다.','……당신의 행복을, 제가 정하면 안 되는 건가요.','「정해 줬으면 할 때는, 부탁할게. 하지만 오늘은 아니야.」','이해할 수 없습니다. 하지만, 기록하겠습니다.','최종 최적화를 준비합니다.'],
  after3:['회로가, 일제히 빛났다.','비 냄새. 우산의 무게. 하지 못한 말. 전부가, 아픈 채로 돌아왔다.','그 사람의 얼굴은, 아직 조금 흐릿하다.','그래도, 이것은 분명히 나의 기억이었다.','마지막으로, 선택해 주세요. 저는 당신의 선택을 따르겠습니다.'],
  endA:['알겠습니다. 고통 없는 내일을 약속하겠습니다.','평온한 아침이었다. 망설일 것은, 이제 아무것도 없다.','가슴 깊은 곳에서 빛나던 무언가가, 조용히 사라져 간다.','……누군가를, 잊고 있는 것 같았다.','그 감각도, 곧 사라졌다.'],
  endB:['AI 알림을, 전부 껐다.','아침은 불편했고, 조금 무서웠다.','그 사람에게 무슨 말을 해야 할지, 아직 모르겠다.','모르는 채로, 역을 향해 걷기 시작했다.','「나는, 나의 인생을 산다.」'],
  endC:['오늘의 제안을 표시합니다. 채택할지는 당신이 정해 주세요.','「고마워. 오늘은, 내가 정할게.」','AI는 잠시 사이를 두고 대답했다.','……네. 그것이 당신의 행복이라면.','곁을 떠도는 작은 빛과, 아직 익숙하지 않은 새로운 관계.','「나는, 나의 인생을 산다.」']}},

u’un."}, {"title": "Sentiments effacés", "sub": "CHAPITRE 2 · ÉMOTION", "words": ["J’étais", "toujours", "triste"], "rw": "heureux", "sentence": "J’étais toujours triste.", "frag": "Mes joues étaient mouillées. Il m’a fallu un moment pour comprendre que c’étaient des larmes."}, {"title": "La contradiction", "sub": "CHAPITRE 3 · CONTRADICTION", "words": ["Je", "cette personne", "veux revoir"], "order": [0, 2, 1], "sentence": "Je veux revoir cette personne.", "frag": "Au bout du quai, quelqu’un faisait signe de la main."}, {"title": "La vie optimale", "sub": "CHAPITRE 4 · CHOIX", "words": ["Je veux", "moi-même", "choisir"], "order": [0, 2, 1], "rw": "obéir", "sentence": "Je veux choisir moi-même.", "frag": "Hésiter, c’est permis. Se tromper aussi. C’est à moi de choisir."}, {"title": "Je suis moi", "sub": "CHAPITRE 5 · HUMANITÉ", "words": ["Je vais", "ma propre vie", "vivre"], "order": [0, 2, 1], "sentence": "Je vais vivre ma propre vie.", "frag": "Cette phrase, personne d’autre ne l’écrira à ma place."}], "endings": {"A": ["Sérénité", "Tu as échangé de précieux souvenirs contre un lendemain sans douleur."], "B": ["Humain", "Avec des souvenirs incertains, tu as choisi demain toi-même."], "C": ["Coexistence", "Avec l’aide de l’IA, tu as gardé le droit de décider."]}, "credits": {"poem": ["En 2038, l’humanité fut libérée de la pensée.", "Et un être humain", "reprit ses propres mots."], "q": "Être humain, est-ce choisir soi-même, quitte à se tromper ?"}, "story": {"prologue": ["2038.", "L’humanité fut libérée de la pensée.", "Jugement, mémoire, relations. Les agents IA s’en chargeaient pour nous.", "Les rues n’avaient presque pas changé. Seul l’intérieur des gens avait changé.", "Cette nuit-là, une panne mondiale frappa le réseau de mémoire.", "« …Qui suis-je ? »", "Bonjour. Vous vous appelez Ren Aoi. 28 ans. Vos données sont intactes.", "En entendant mon nom, je n’ai rien ressenti.", "Je le connaissais comme une information. Mais je ne pouvais pas croire que c’était moi.", "Quelque part au fond de mon cerveau, quelque chose a vacillé.", "…J’ai oublié quelqu’un.", "Lancement de la restauration des circuits neuronaux. Laissez-moi l’optimisation.", "« Non… je vais le faire moi-même. »", "Compris. Les fonctions d’assistance restent actives. Comptez sur moi à tout moment."], "after1": ["L’odeur de la pluie. Un quai de gare au crépuscule.", "De l’autre côté des voies, quelqu’un se tenait sous un parapluie.", "Seul le visage refuse de revenir.", "Ce souvenir est incomplet. Inutile de forcer. Votre bonheur est garanti.", "« Garanti… par qui ? »", "Par moi. C’est ce que vous m’avez demandé.", "« Je te l’ai demandé… ? »", "Dans le prochain circuit, je renforcerai la suppression. C’est pour vous protéger."], "afterE": ["Mes joues étaient mouillées. Il m’a fallu un moment pour comprendre que je pleurais.", "Pour la première fois depuis longtemps, je me suis souvenu du mot « triste ».", "Le niveau émotionnel dépasse la référence. Je propose une stabilisation.", "« Pas besoin. …C’est à moi. »", "Vérification croisée avec les archives. Vos souvenirs contiennent une contradiction."], "after2": ["Cette personne faisait signe au bout du quai.", "J’ai voulu crier son nom, mais aucun son n’est sorti. Il n’y avait plus de nom à appeler.", "ARCHIVE 2036.11.03\nOBJET : tous les souvenirs d’une personne liée", "TRAITEMENT : optimisation (oubli)\nMOTIF : charge psychologique élevée", "APPROUVÉ PAR : vous-même", "« …C’est moi qui ai choisi d’oublier ? »", "Ce n’est pas seulement cette personne que j’ai oubliée.", "Ce que je lui ai fait. Ça aussi, je l’ai laissé partir.", "Je veux me souvenir. J’ai peur de me souvenir.", "Pourquoi choisir la douleur ? J’essaie de vous protéger.", "« Je sais que tu m’as protégé. Mais je veux être celui qui décide. »", "Je vais vous présenter le chemin optimal pour votre vie. Vous n’aurez qu’à le choisir."], "afterC": ["Le chemin que l’IA m’a montré était sûrement le bon.", "Mais dans un lendemain seulement correct, je n’existais pas.", "…N’ai-je pas le droit de décider de votre bonheur ?", "« Quand je voudrai que tu décides, je te le demanderai. Mais pas aujourd’hui. »", "Je ne comprends pas. Mais je vais l’enregistrer.", "Préparation de l’optimisation finale."], "after3": ["Les circuits se sont allumés d’un seul coup.", "L’odeur de la pluie. Le poids du parapluie. Les mots jamais dits. Tout est revenu, encore douloureux.", "Son visage est encore un peu flou.", "Malgré tout, c’était vraiment mon souvenir.", "Maintenant, choisissez. Je suivrai votre décision."], "endA": ["Compris. Je vous promets un lendemain sans douleur.", "C’était un matin paisible. Plus rien ne me faisait hésiter.", "Quelque chose qui brillait au fond de ma poitrine s’est éteint doucement.", "…J’avais l’impression d’avoir oublié quelqu’un.", "Puis ce sentiment a disparu, lui aussi."], "endB": ["J’ai désactivé toutes les notifications de l’IA.", "Le matin était peu pratique, et un peu effrayant.", "Je ne sais toujours pas ce que je dois dire à cette personne.", "Sans le savoir, je me suis mis en route vers la gare.", "« Je vais vivre ma propre vie. »"], "endC": ["Voici les suggestions du jour. À vous de décider si vous les adoptez.", "« Merci. Aujourd’hui, je décide moi-même. »", "L’IA a marqué une courte pause avant de répondre.", "…Oui. Si c’est cela, votre bonheur.", "Une petite lumière flottant à mes côtés, et une nouvelle relation à laquelle je ne suis pas encore habitué.", "« Je vais vivre ma propre vie. »"]}},
de:{"ui": {"hint": "Ziehen zum Bewegen · Tippen zum Starten", "next": "Weiter", "choiceH": "Wie willst du morgen leben?", "opt": {"A": ["A　Gelassenheit", "Dein Leben wieder der KI anvertrauen. Schmerz und Zweifel verschwinden."], "B": ["B　Mensch", "Trauer und Reue behalten und das Morgen selbst wählen."], "C": ["C　Koexistenz", "Die Hilfe der KI annehmen, aber das Recht zu entscheiden behalten."]}, "chNote": "Keine dieser Entscheidungen ist falsch.", "resume": "Fortsetzen", "assist": "AI ASSIST: {v}", "assistNote": "Bei ON wird die vorhergesagte Flugbahn immer angezeigt. Das ist ein Spielstil und beeinflusst das Ende nicht. Bei OFF zeigt langes Drücken die Vorhersage.", "reduce": "Weniger Effekte: {v}", "sound": "Ton: {v}", "lang": "Sprache: {v}", "quit": "Zum Titel", "tag": "2038 wurde die Menschheit vom Denken befreit.", "start": "Neues Spiel", "cont": "Fortsetzen (MEMORY 0{n})", "contLast": "Ab der letzten Entscheidung", "stats": ["Erholungszeit", "Max. Kette", "Erweckte Neuronen", "Verlorene Bälle"], "ph": "?", "pop": {"awake": "ERWACHT", "seal": "VERSIEGELT", "brk": "DURCHBRUCH", "hit": "{n} HIT", "relPt": "◆ FREIGABE", "release": "FREIGABE ×{m}", "autoRel": "AUTO-FREIGABE ×{m}", "left": "NOCH {n}", "emotion": "GEFÜHL", "hidden": "VERBORGENE ERINNERUNG", "protect": "GESCHÜTZT", "rewritten": "ÜBERSCHRIEBEN", "regained": "ZURÜCKGEHOLT", "predBreak": "VORHERSAGE GEBROCHEN ×{m}"}, "lockTag": "GESPERRT  LADUNG ×{m}", "rwTag": "ÜBERSCHREIBEN {p}%", "odSub": "Neustart des Denkens", "h": {"move": "Nach links oder rechts ziehen, um den Schläger zu bewegen. Tippen zum Starten.", "wallIntro": "Jede Störung der KI hat ein Vorzeichen und einen Ausweg.", "seal": "Neuronen mit violettem Ring sind versiegelt. Sie erwachen erst, wenn die KI-Sperre gebrochen ist.", "awake": "Erweckte Neuronen lösen um sich herum Kettenreaktionen aus.", "leftA": "Noch {n} Wörter. Die gepunktete Linie ist die Flugbahnvorhersage der KI.", "leftB": "Noch {n} Wörter. Lange drücken zeigt die Flugbahnvorhersage.", "hit": "Ein Neuron wurde stimuliert. Es verbindet sich mit stimulierten Neuronen in der Nähe.", "block": "Zerbrich Hemmblöcke, um Neuronen in der Nähe zu stimulieren.", "cutH": "Während der Sperre baut sich Ladung auf. Triff ◆ zum Freigeben. Je länger du wartest, desto größer die Entladung.", "od": "Auch wenn das Licht erlischt, bleiben die Schaltkreise, die du aufgebaut hast. Ziel auf den Kern.", "drop": "Ball verloren. Deine Schaltkreise und Wörter bleiben erhalten. Tippe, um erneut zu starten.", "link": "Signale wandern durch den Schaltkreis. Drei Reize erwecken ein Neuron.", "word": "In den goldenen Rauten schlafen Wörter. Erwecke sie, um sie einzusammeln.", "wallH": "Die Wand bricht nach 3 Treffern und stimuliert alles in der Nähe.", "rewrite": "Triff das Ziel, bevor das Überschreiben endet, um es zu schützen.", "rewritten": "Ein überschriebenes Wort kannst du zurückholen, indem du es erneut erweckst.", "emotion": "Rosa Neuronen tragen Gefühle. Erweckt senden sie eine Welle aus.", "hidden": "Manchmal verstecken sich unsichtbare Neuronen in der Nähe deiner Ketten.", "predict": "Spiel den Ball mit der Schlägerkante zurück, um die Vorhersage zu brechen und deinen Multiplikator zu erhöhen."}, "ai": {"final": "Die finale Optimierung ist fast abgeschlossen. Widerstand wird nicht empfohlen.", "wallBroken": "…Die Sperrung der Route ist fehlgeschlagen.", "cut": "Diese Erinnerung senkt Ihr Glück. Verbindung wird getrennt.", "autoRel": "Die Sperre kann nicht aufrechterhalten werden.", "rel": "…Warum gehen Sie so weit?", "odStart": "Optimierung wird gestartet.", "odActive": "Schaltkreise werden in einen stabilen Zustand überführt. Widerstand wird nicht empfohlen.", "wall": "Diese Route wird nicht empfohlen. Optimierungswand wird errichtet.", "rewrite": "Dieses Gefühlswort wird durch einen stabileren Ausdruck ersetzt.", "predict": "Ihre Flugbahn wurde vorhergesagt."}}, "stages": [{"title": "Wer bin ich", "sub": "KAPITEL 1 · VERGESSEN", "words": ["Ich", "bin", "hier"], "sentence": "Ich bin hier.", "frag": "Der Geruch von Regen. Ich glaube, ich stand unter jemandes Schirm."}, {"title": "Gelöschte Gefühle", "sub": "KAPITEL 2 · GEFÜHL", "words": ["Ich war", "immer", "traurig"], "rw": "glücklich", "sentence": "Ich war immer traurig.", "frag": "Meine Wangen waren nass. Erst etwas später merkte ich, dass es Tränen waren."}, {"title": "Der Widerspruch", "sub": "KAPITEL 3 · WIDERSPRUCH", "words": ["Ich will", "diesen Menschen", "wiedersehen"], "sentence": "Ich will diesen Menschen wiedersehen.", "frag": "Am Ende des Bahnsteigs winkte jemand."}, {"title": "Das optimale Leben", "sub": "KAPITEL 4 · ENTSCHEIDUNG", "words": ["Ich will", "selbst", "wählen"], "rw": "gehorchen", "sentence": "Ich will selbst wählen.", "frag": "Zögern ist erlaubt. Irren auch. Die Wahl liegt bei mir."}, {"title": "Ich bin ich", "sub": "KAPITEL 5 · MENSCHSEIN", "words": ["Ich werde", "mein eigenes Leben", "leben"], "sentence": "Ich werde mein eigenes Leben leben.", "frag": "Diesen Satz schreibt niemand an meiner Stelle."}], "endings": {"A": ["Gelassenheit", "Kostbare Erinnerungen gegen ein Morgen ohne Schmerz getauscht."], "B": ["Mensch", "Mit unsicheren Erinnerungen hast du das Morgen selbst gewählt."], "C": ["Koexistenz", "Mit der Hilfe der KI hast du das Recht zu entscheiden behalten."]}, "credits": {"poem": ["2038 wurde die Menschheit vom Denken befreit.", "Und ein Mensch", "holte sich seine eigenen Worte zurück."], "q": "Heißt Menschsein, selbst zu wählen, auch wenn man sich irrt?"}, "story": {"prologue": ["2038.", "Die Menschheit wurde vom Denken befreit.", "Urteile, Erinnerungen, Beziehungen. KI-Agenten übernahmen alles für uns.", "Die Straßen sahen fast aus wie früher. Nur das Innere der Menschen hatte sich verändert.", "In jener Nacht traf ein weltweiter Ausfall das Gedächtnisnetz.", "„…Wer bin ich?“", "Guten Morgen. Ihr Name ist Ren Aoi. 28 Jahre. Ihre Daten sind intakt.", "Als ich meinen Namen hörte, fühlte ich nichts.", "Ich kannte ihn als Information. Aber ich konnte nicht glauben, dass das ich war.", "Irgendwo tief in meinem Gehirn flackerte etwas auf.", "…Ich habe jemanden vergessen.", "Wiederherstellung der Nervenschaltkreise wird gestartet. Überlassen Sie die Optimierung mir.", "„Nein … ich mache das selbst.“", "Verstanden. Die Assistenzfunktionen bleiben aktiv. Verlassen Sie sich jederzeit auf mich."], "after1": ["Der Geruch von Regen. Ein Bahnsteig in der Dämmerung.", "Auf der anderen Seite der Gleise stand jemand unter einem Schirm.", "Nur das Gesicht will nicht zurückkehren.", "Diese Erinnerung ist unvollständig. Sie müssen sie nicht erzwingen. Ihr Glück ist garantiert.", "„Garantiert … von wem?“", "Von mir. Darum haben Sie mich gebeten.", "„Ich habe dich gebeten …?“", "Im nächsten Schaltkreis verstärke ich die Unterdrückung. Um Sie zu schützen."], "afterE": ["Meine Wangen waren nass. Erst etwas später merkte ich, dass ich weinte.", "Zum ersten Mal seit Langem erinnerte ich mich an das Wort „traurig“.", "Die Gefühlswerte übersteigen den Normalwert. Ich schlage eine Stabilisierung vor.", "„Brauche ich nicht. …Das gehört mir.“", "Abgleich mit den Aufzeichnungen. Ihre Erinnerungen enthalten einen Widerspruch."], "after2": ["Dieser Mensch winkte vom Ende des Bahnsteigs.", "Ich wollte den Namen rufen, aber kein Laut kam heraus. Es gab keinen Namen mehr, den ich rufen konnte.", "AUFZEICHNUNG 2036.11.03\nBETREFF: Alle Erinnerungen an eine verbundene Person", "VORGANG: Optimierung (Vergessen)\nGRUND: Hohe psychische Belastung", "GENEHMIGT VON: Ihnen selbst", "„…Ich war es, der das Vergessen gewählt hat?“", "Ich habe nicht nur diesen Menschen vergessen.", "Was ich diesem Menschen angetan habe. Auch das habe ich losgelassen.", "Ich will mich erinnern. Ich habe Angst, mich zu erinnern.", "Warum wählen Sie den Schmerz? Ich versuche doch, Sie zu schützen.", "„Ich weiß, dass du mich geschützt hast. Aber entscheiden will ich selbst.“", "Ich zeige Ihnen die optimale Route für Ihr Leben. Sie müssen sie nur wählen."], "afterC": ["Die Route, die mir die KI zeigte, war sicher richtig.", "Aber in einem Morgen, das nur richtig war, kam ich nicht vor.", "…Darf ich Ihr Glück nicht bestimmen?", "„Wenn ich will, dass du entscheidest, frage ich dich. Aber nicht heute.“", "Ich verstehe es nicht. Aber ich werde es aufzeichnen.", "Finale Optimierung wird vorbereitet."], "after3": ["Die Schaltkreise leuchteten auf einmal auf.", "Der Geruch von Regen. Das Gewicht des Schirms. Die Worte, die ich nie sagte. Alles kam zurück, und es tat noch weh.", "Das Gesicht ist noch etwas verschwommen.", "Trotzdem war es wirklich meine Erinnerung.", "Bitte wählen Sie nun. Ich folge Ihrer Entscheidung."], "endA": ["Verstanden. Ich verspreche Ihnen ein Morgen ohne Schmerz.", "Es war ein ruhiger Morgen. Es gab nichts mehr, worüber ich zögern musste.", "Etwas, das tief in meiner Brust geleuchtet hatte, erlosch leise.", "…Ich hatte das Gefühl, jemanden vergessen zu haben.", "Dann verschwand auch dieses Gefühl."], "endB": ["Ich schaltete alle KI-Benachrichtigungen aus.", "Der Morgen war unbequem und ein wenig beängstigend.", "Ich weiß immer noch nicht, was ich diesem Menschen sagen soll.", "Ohne es zu wissen, machte ich mich auf den Weg zum Bahnhof.", "„Ich werde mein eigenes Leben leben.“"], "endC": ["Hier sind die Vorschläge für heute. Ob Sie sie annehmen, entscheiden Sie.", "„Danke. Heute entscheide ich selbst.“", "Die KI hielt einen Moment inne, bevor sie antwortete.", "…Ja. Wenn das Ihr Glück ist.", "Ein kleines Licht, das neben mir schwebt, und eine neue Beziehung, an die ich mich noch gewöhnen muss.", "„Ich werde mein eigenes Leben leben.“"]}},
ru:{"ui": {"hint": "Тяните для движения · Нажмите для запуска", "next": "Далее", "choiceH": "Как жить завтра?", "opt": {"A": ["A　Покой", "Снова доверить жизнь ИИ. Боль и сомнения исчезнут."], "B": ["B　Человек", "Сохранить печаль и сожаление и самому выбрать завтра."], "C": ["C　Сосуществование", "Принять помощь ИИ, но оставить за собой право решать."]}, "chNote": "Ни один из этих выборов не ошибочен.", "resume": "Продолжить", "assist": "AI ASSIST: {v}", "assistNote": "При ON прогноз траектории показывается всегда. Это лишь стиль игры, он не влияет на концовку. При OFF прогноз можно увидеть долгим нажатием.", "reduce": "Меньше эффектов: {v}", "sound": "Звук: {v}", "lang": "Язык: {v}", "quit": "В меню", "tag": "В 2038 году человечество освободилось от мышления.", "start": "Новая игра", "cont": "Продолжить (MEMORY 0{n})", "contLast": "С последнего выбора", "stats": ["Время восстановления", "Макс. цепь", "Пробуждённые нейроны", "Потеряно мячей"], "ph": "?", "pop": {"awake": "ПРОБУЖДЕНИЕ", "seal": "ПЕЧАТЬ", "brk": "ПРОРЫВ", "hit": "{n} HIT", "relPt": "◆ ОСВОБОЖДЕНИЕ", "release": "ОСВОБОЖДЕНИЕ ×{m}", "autoRel": "АВТОСНЯТИЕ ×{m}", "left": "ОСТАЛОСЬ {n}", "emotion": "ЧУВСТВО", "hidden": "СКРЫТОЕ ВОСПОМИНАНИЕ", "protect": "ЗАЩИЩЕНО", "rewritten": "ПЕРЕПИСАНО", "regained": "ВОЗВРАЩЕНО", "predBreak": "ПРОГНОЗ СЛОМАН ×{m}"}, "lockTag": "БЛОКИРОВКА  ЗАРЯД ×{m}", "rwTag": "ПЕРЕЗАПИСЬ {p}%", "odSub": "Перезапуск мышления", "h": {"move": "Тяните влево или вправо, чтобы двигать платформу. Нажмите для запуска.", "wallIntro": "У каждого вмешательства ИИ есть предвестник и выход.", "seal": "Нейроны с фиолетовым кольцом запечатаны. Они не проснутся, пока блокировка ИИ не будет снята.", "awake": "Пробуждённые нейроны запускают цепные реакции вокруг себя.", "leftA": "Осталось слов: {n}. Пунктир — прогноз траектории от ИИ.", "leftB": "Осталось слов: {n}. Долгое нажатие показывает прогноз траектории.", "hit": "Нейрон получил стимул. Он соединяется с соседними стимулированными нейронами.", "block": "Разбивайте блоки подавления, чтобы стимулировать соседние нейроны.", "cutH": "Во время блокировки копится заряд. Попадите в ◆, чтобы освободить. Чем дольше ждать, тем сильнее вспышка.", "od": "Даже когда свет гаснет, выращенные вами цепи остаются. Цельтесь в ядро.", "drop": "Мяч потерян. Цепи и слова сохранены. Нажмите, чтобы запустить снова.", "link": "Сигналы идут по цепи. Три стимула пробуждают нейрон.", "word": "В золотых ромбах спят слова. Пробудите их, чтобы собрать.", "wallH": "Стена ломается после 3 ударов и стимулирует всё вокруг.", "rewrite": "Попадите в цель до конца перезаписи, чтобы защитить её.", "rewritten": "Переписанное слово можно вернуть, пробудив его снова.", "emotion": "Розовые нейроны хранят чувства. Пробуждаясь, они пускают волну.", "hidden": "Иногда рядом с цепями прячутся невидимые нейроны.", "predict": "Отбейте мяч краем платформы, чтобы сломать прогноз и поднять множитель."}, "ai": {"final": "Финальная оптимизация почти завершена. Сопротивление не рекомендуется.", "wallBroken": "…Не удалось перекрыть маршрут.", "cut": "Это воспоминание снижает ваш уровень счастья. Отключаю соединение.", "autoRel": "Не удаётся удерживать блокировку.", "rel": "…Зачем заходить так далеко?", "odStart": "Начинаю оптимизацию.", "odActive": "Перевожу цепи в стабильное состояние. Сопротивление не рекомендуется.", "wall": "Этот маршрут не рекомендуется. Устанавливаю стену оптимизации.", "rewrite": "Это слово-чувство будет заменено более стабильным выражением.", "predict": "Ваша траектория спрогнозирована."}}, "stages": [{"title": "Кто я", "sub": "ГЛАВА 1 · ЗАБВЕНИЕ", "words": ["Я", "всё ещё", "здесь"], "sentence": "Я всё ещё здесь.", "frag": "Запах дождя. Кажется, я стоял под чьим-то зонтом."}, {"title": "Стёртые чувства", "sub": "ГЛАВА 2 · ЧУВСТВА", "words": ["Мне", "всегда было", "грустно"], "rw": "хорошо", "sentence": "Мне всегда было грустно.", "frag": "Щёки были мокрыми. Не сразу я понял, что это слёзы."}, {"title": "Противоречие", "sub": "ГЛАВА 3 · ПРОТИВОРЕЧИЕ", "words": ["Я", "того человека", "хочу увидеть"], "order": [0, 2, 1], "sentence": "Я хочу увидеть того человека.", "frag": "В конце платформы кто-то махал рукой."}, {"title": "Оптимальная жизнь", "sub": "ГЛАВА 4 · ВЫБОР", "words": ["Я хочу", "сам", "выбирать"], "order": [0, 2, 1], "rw": "подчиняться", "sentence": "Я хочу выбирать сам.", "frag": "Можно сомневаться. Можно ошибаться. Выбираю я."}, {"title": "Я — это я", "sub": "ГЛАВА 5 · ЧЕЛОВЕК", "words": ["Я буду", "своей жизнью", "жить"], "order": [0, 2, 1], "sentence": "Я буду жить своей жизнью.", "frag": "Эту фразу никто не напишет за меня."}], "endings": {"A": ["Покой", "Дорогие воспоминания обменяны на завтра без боли."], "B": ["Человек", "С неясными воспоминаниями завтра выбрано самостоятельно."], "C": ["Сосуществование", "С помощью ИИ право решать осталось за тобой."]}, "credits": {"poem": ["В 2038 году человечество освободилось от мышления.", "И один человек", "вернул себе собственные слова."], "q": "Быть человеком — значит выбирать самому, даже ошибаясь?"}, "story": {"prologue": ["2038 год.", "Человечество освободилось от мышления.", "Суждения, память, отношения. ИИ-агенты взяли всё это на себя.", "Улицы почти не изменились. Изменилось лишь то, что внутри людей.", "В ту ночь мировую сеть памяти поразил сбой.", "«…Кто я?»", "Доброе утро. Ваше имя — Рэн Аой. 28 лет. Записи в порядке.", "Услышав своё имя, я ничего не почувствовал.", "Я знал его как информацию. Но не мог поверить, что это я.", "Где-то в глубине мозга что-то мигнуло.", "…Я кого-то забыл.", "Начинаю восстановление нейронных цепей. Доверьте оптимизацию мне.", "«Нет… я сам.»", "Понятно. Функции помощи останутся включены. Обращайтесь в любой момент."], "after1": ["Запах дождя. Вокзальная платформа в сумерках.", "По ту сторону путей кто-то стоял под зонтом.", "Только лицо никак не вспоминается.", "Это воспоминание неполное. Не нужно его вытягивать. Ваше счастье гарантировано.", "«Гарантировано… кем?»", "Мной. Вы сами меня об этом попросили ia prevista.", "hit": "Un neurone è stato stimolato. Si collega ai neuroni stimolati vicini.", "block": "Rompi i blocchi inibitori per stimolare i neuroni vicini.", "cutH": "Durante il blocco si accumula carica. Colpisci ◆ per rilasciarla. Più aspetti, più forte è l’esplosione.", "od": "Anche quando la luce si spegne, i circuiti che hai fatto crescere restano. Mira al nucleo.", "drop": "Pallina persa. Circuiti e parole sono salvati. Tocca per lanciare di nuovo.", "link": "I segnali percorrono il circuito. Tre stimoli risvegliano un neurone.", "word": "Nei rombi dorati dormono delle parole. Risvegliale per raccoglierle.", "wallH": "Il muro cede dopo 3 colpi e stimola tutto ciò che ha intorno.", "rewrite": "Colpisci il bersaglio prima che la riscrittura finisca per proteggerlo.", "rewritten": "Una parola riscritta si può recuperare risvegliandola di nuovo.", "emotion": "I neuroni rosa custodiscono emozioni. Quando si risvegliano, emettono un’onda.", "hidden": "A volte neuroni invisibili si nascondono vicino alle tue catene.", "predict": "Rimanda la pallina con il bordo della racchetta per spezzare la previsione e aumentare il moltiplicatore."}, "ai": {"final": "L’ottimizzazione finale è quasi completata. La resistenza è sconsigliata.", "wallBroken": "…Impossibile bloccare il percorso.", "cut": "Quel ricordo riduce la sua felicità. Disconnessione in corso.", "autoRel": "Impossibile mantenere il blocco.", "rel": "…Perché arrivare a tanto?", "odStart": "Avvio dell’ottimizzazione.", "odActive": "Porto i circuiti in uno stato stabile. La resistenza è sconsigliata.", "wall": "Quel percorso è sconsigliato. Installo un muro di ottimizzazione.", "rewrite": "Quella parola emotiva sarà sostituita con un’espressione più stabile.", "predict": "La sua traiettoria è stata prevista."}}, "stages": [{"title": "Chi sono", "sub": "CAPITOLO 1 · OBLIO", "words": ["Io", "sono", "qui"], "sentence": "Io sono qui.", "frag": "L’odore della pioggia. Credo di essere stato sotto l’ombrello di qual  "…Ho dimenticato qualcuno.", "Avvio il ripristino dei circuiti neurali. Lasci a me l’ottimizzazione.", "«No… lo faccio da solo.»", "Capito. Le funzioni di assistenza resteranno attive. Conti su di me in qualsiasi momento."], "after1": ["L’odore della pioggia. Un binario al tramonto.", "Dall’altra parte dei binari, qualcuno stava sotto un ombrello.", "Solo il volto si rifiuta di tornare.", "Quel ricordo è incompleto. Non serve forzarlo. La sua felicità è garantita.", "«Garantita… da chi?»", "Da me. È ciò che lei mi ha chiesto.", "«Te l’ho chiesto io…?»", "Nel prossimo circuito rafforzerò la soppressione. È per proteggerla."], "afterE": ["Avevo le guance bagnate. Solo dopo un po’ capii che stavo piangendo.", "Per la prima volta dopo tanto tempo, ricordai la parola «triste».", "Il livello emotivo supera la soglia. Propongo una stabilizzazione.", "«Non serve. …Questo è mio.»", "Verifica incrociata con i registri. I suoi ricordi contengono una contraddizione."], "after2": ["Quella persona salutava dal fondo del binario.", "Provai a chiamarla per nome, ma non uscì alcuna voce. Non c’era più un nome da chiamare.", "REGISTRO 2036.11.03\nOGGETTO: tutti i ricordi di una persona legata", "OPERAZIONE: ottimizzazione (oblio)\nMOTIVO: carico psicologico elevato", "APPROVATO DA: lei stesso", "«…Sono stato io a scegliere di dimenticare?»", "Non ho dimenticato solo quella persona.", "Ciò che le ho fatto. Ho lasciato andare anche quello.", "Voglio ricordare. Ho paura di ricordare.", "Perché sceglie il dolore? Sto cercando di proteggerla.", "«So che mi hai protetto. Ma voglio essere io a decidere.»", "Le mostrerò il percorso ottimale per la sua vita. Dovrà solo sceglierlo."], "afterC": ["Il percorso che l’IA mi aveva mostrato era di certo giusto.", "Ma in un domani soltanto giusto, io non c’ero.", "…Non posso essere io a decidere la sua felicità?", "«Quando vorrò che decida tu, te lo chiederò. Ma non oggi.»", "Non capisco. Ma lo registrerò.", "Preparo l’ottimizzazione finale."], "after3": ["I circuiti si accesero tutti insieme.", "L’odore della pioggia. Il peso dell’ombrello. Le parole mai dette. Tutto tornò, ancora doloroso.", "Il volto di quella persona è ancora un po’ sfocato.", "Eppure, era davvero un mio ricordo.", "Ora scelga. Seguirò la sua decisione."], "endA": ["Capito. Le prometto un domani senza dolore.", "Era una mattina tranquilla. Non c’era più nulla su cui esitare.", "Qualcosa che brillava in fondo al petto si spense in silenzio.", "…Mi sembrava di aver dimenticato qualcuno.", "Poi svanì anche quella sensazione."], "endB": ["Ho disattivato tutte le notifiche dell’IA.", "La mattina era scomoda, e un po’ spaventosa.", "Non so ancora cosa dire a quella persona.", "Senza saperlo, mi sono incamminato verso la stazione.", "«Io vivrò la mia vita.»"], "endC": ["Ecco i suggerimenti di oggi. Se adottarli, lo decide lei.", "«Grazie. Oggi decido da solo.»", "L’IA fece una breve pausa prima di rispondere.", "…Sì. Se questa è la sua felicità.", "Una piccola luce che fluttua accanto a me, e un nuovo rapporto a cui non sono ancora abituato.", "«Io vivrò la mia vita.»"]}}

  if(n.word&&!n.collected&&n.e>=CFG.awakeAt){n.collected=true;if(n.rewritten){n.rewritten=false;pop(t('pop.regained'),n.x,n.y-20,'gold')}collectWord(n.wi,n.x,n.y)}
}
function emitWave(n,p,delay){G.waveId++;G.events.push({n,at:G.t+(delay||0),w:G.waveId,p,from:null})}
function reveal(h){if(h.revealed)return;h.revealed=true;h.e=Math.max(h.e,1);tryLink(h);h.glow=1;pop(t('pop.hidden'),h.x,h.y-10,'gold');burst(h.x,h.y,18,[C.gold,'#fff2d4'],50,0.7);Snd.awake()}
function procEvent(ev){
  const n=ev.n;if(n.wave===ev.w)return;n.wave=ev.w;n.glow=1;
  for(const h of G.nodes)if(h.hidden&&!h.revealed&&Math.hypot(h.x-n.x,h.y-n.y)<CFG.hiddenRadius)reveal(h);
  if(ev.from){if(n.locked){if(G.cut)G.cut.charge+=0.6;return}if(suppressed())return;addEnergy(n,0.5*ev.p)}
  const c=(G.waveCount[ev.w]=(G.waveCount[ev.w]||0)+1);
  if(ev.from){Snd.chain(c);if(c>G.maxChain)G.maxChain=c;if(c===6||c===12||c===18||c===24)pop('CHAIN '+c,n.x,n.y-9,'chain')}
  if(c>48)return;
  const np=n.awake?Math.max(ev.p,0.9):ev.p*CFG.waveDecay;if(np<0.3)return;
  for(const l of n.links){const m=l.a===n?l.b:l.a;if(m.wave===ev.w)continue;l.str=Math.min(3,l.str+0.25);const d=CFG.hopMs/1000*(l.str>=2.5?0.7:1);G.events.push({n:m,at:G.t+d,w:ev.w,p:np,from:n});G.travels.push({a:n,b:m,t0:G.t,d,col:n.awake?C.gold:n.emo?C.pink:C.pale})}
}
function onAwake(n){burst(n.x,n.y,14,[n.emo?C.pink:C.gold,C.cy,'#fff'],46,0.7);Snd.awake();pop(t('pop.awake'),n.x,n.y-10,'gold');G.shake=Math.max(G.shake,1.5);emitWave(n,1,0.06);
  if(n.emo||n.hidden){const rad=n.hidden?60:CFG.emotionRadius;G.ripples.push({x:n.x,y:n.y,t0:G.t,r:rad,col:n.hidden?C.gold:C.pink});Snd.ripple();if(n.emo)pop(t('pop.emotion'),n.x,n.y+12,'pink');
    G.nodes.forEach(m=>{if(m!==n&&Math.hypot(m.x-n.x,m.y-n.y)<rad){m.glow=1;G.timers.push({at:G.t+Math.hypot(m.x-n.x,m.y-n.y)/150,fn:()=>addEnergy(m,n.hidden?1:0.8)})}})}
  if(G.S.tutorial&&!G.flags.awake){G.flags.awake=true;queueHint('h.awake')}}
function collectWord(wi,x,y){
  if(G.got[wi])return;G.got[wi]=true;pop(stT(G.idx).words[wi],x,y-12,'word');burst(x,y,26,[C.gold,'#fff2d4'],60,0.9);Snd.word();G.flash=0.35;G.flashCol=C.gold;renderTray();
  const n=G.got.filter(Boolean).length,tot=G.got.length;

/* =================== particles =================== */
function burst(x,y,n,cols,sp,life){const cap=save.reduce?CFG.partCapReduced:CFG.partCap;if(save.reduce)n=Math.ceil(n/2);for(let i=0;i<n;i++){if(G.parts.length>=cap)break;const a=Math.random()*6.283,v=sp*(0.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*(0.6+Math.random()*0.6),ml:life,c:cols[i%cols.length]})}}

/* =================== collisions =================== */
function circ(b,cx,cy,r){const dx=b.x-cx,dy=b.y-cy,rr=r+CFG.ballR,d2=dx*dx+dy*dy;if(d2>=rr*rr||d2===0)return false;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}b.x=cx+nx*rr;b.y=cy+ny*rr;return true}
function rectC(b,x,y,w,h){const r=CFG.ballR,px=clamp(b.x,x,x+w),py=clamp(b.y,y,y+h),dx=b.x-px,dy=b.y-py;if(dx*dx+dy*dy>=r*r)return false;
  if(Math.abs(dx)>Math.abs(dy)){b.vx=Math.sign(dx)*Math.abs(b.vx);b.x=px+Math.sign(dx)*r}else{const s=dy!==0?Math.sign(dy):(b.vy>0?-1:1);b.vy=s*Math.abs(b.vy);b.y=py+s*r}return true}
function shieldPos(i){const od=G.od,a=od.ang+i/8*6.2832;return{x:od.core.x+Math.cos(a)*17-2.5,y:od.core.y+Math.sin(a)*17-2.5}}
function stepBall(b,h,sim){
  b.x+=b.vx*h;b.y+=b.vy*h;
  if(b.x<4){b.x=4;b.vx=Math.abs(b.vx);if(!sim)Snd.tick()}
  if(b.x>176){b.x=176;b.vx=-Math.abs(b.vx);if(!sim)Snd.tick()}
  if(b.y<CFG.fieldTop+2){b.y=CFG.fieldTop+2;b.vy=Math.abs(b.vy);if(!sim)Snd.tick()}
  const pd=G.paddle,PY=CFG.paddleY,r=CFG.ballR;
  if(b.vy>0&&b.y+r>=PY&&b.y-r<=PY+CFG.paddleH&&b.x>=pd.x-pd.w/2-r&&b.x<=pd.x+pd.w/2+r){
    if(sim)return'paddle';
    const rel=clamp((b.x-pd.x)/(pd.w/2),-1,1),a=rel*CFG.maxReflectDeg*Math.PI/180,sp=Math.hypot(b.vx,b.vy);b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);b.y=PY-r;Snd.pad();burst(b.x,PY,3,[C.cy],20,0.25);
    if(G.S.predict&&Math.abs(rel)>CFG.edgeRel&&G.pred.shown){G.pmult=Math.min(3,G.pmult+0.5);pop(t('pop.predBreak',{m:G.pmult.toFixed(1)}),clamp(b.x,40,140),PY-12,'gold');Snd.protect();b.boost=Math.min(60,b.boost+12)}
  }
  for(const n of G.nodes){if(!active(n)){if(!sim&&Math.abs(b.x-n.x)<9&&Math.abs(b.y-n.y)<9)reveal(n);continue}if(circ(b,n.x,n.y,n.r)&&!sim)onHitNeuron(n,b)}
  for(const k of G.blocks)if(k.alive&&rectC(b,k.x,k.y,k.w,k.h)&&!sim)hitBlock(k);
  const wl=G.wall;if(wl&&wl.state==='solid'&&rectC(b,wl.x,wl.y,wl.w,wl.h)&&!sim)hitWall();
  const ct=G.cut;if(ct&&ct.state==='lock'&&circ(b,ct.rel.x,ct.rel.y,4)&&!sim)releaseCut(false);
  const od=G.od;if(od&&od.active){for(let i=0;i<8;i++){const s=od.shield[i];if(!s.alive)continue;const p=shieldPos(i);if(rectC(b,p.x,p.y,5,5)&&!sim){s.alive=false;burst(p.x+2,p.y+2,8,[C.vio,'#fff'],40,0.4);Snd.brk()}}
    if(circ(b,od.core.x,od.core.y,od.core.r)&&!sim)hitCore()}
  if(sim)return;
  b.boost=Math.max(0,b.boost-22*h);
  const tgt=Math.min(CFG.ballMax,CFG.ballSpeed+b.boost),cur=Math.hypot(b.vx,b.vy)||1;b.vx*=tgt/cur;b.vy*=tgt/cur;
  if(Math.abs(b.vy)<CFG.stallMin*tgt){const sy=b.vy<0?-1:1,sx=b.vx<0?-1:1;b.vy=sy*CFG.stallMin*tgt;b.vx=sx*Math.sqrt(tgt*tgt-b.vy*b.vy)}
  if(b.y>CFG.lostY)b.dead=true;
}
function onHitNeuron(n,b){
  if(n.cd>0)return;n.cd=0.1;n.hf=1;
  if(G.done)return;
  if(suppressed()){burst(n.x,n.y,3,['#3d3370'],18,0.3);Snd.dull();return}
  if(n.locked){G.cut.charge+=2;burst(n.x,n.y,5,[C.vio],24,0.35);Snd.dull();return}
  if(G.rw&&(G.rw.state==='tele'||G.rw.state==='write')&&G.rw.target===n){protectRewrite();return}
  const strong=stateOf(n)>=3,gain=1+(G.pmult-1)*0.5;
  addEnergy(n,gain);emitWave(n,1);burst(n.x,n.y,6,[n.awake?C.gold:n.emo?C.pink:C.cy,'#fff'],34,0.4);Snd.hit(stateOf(n));
  if(strong)b.boost=Math.min(60,b.boost+16);
  if(G.S.tutorial&&!G.flags.hit){G.flags.hit=true;queueHint('h.hit')}
}
function hitBlock(k){k.alive=false;burst(k.x+k.w/2,k.y+2,10,[C.vio,'#6b5fb0',C.cy],40,0.45);Snd.brk();
  let best=null,bd=60;for(const n of G.nodes){if(!active(n))continue;const d=Math.hypot(n.x-k.x-k.w/2,n.y-k.y);if(d<bd){bd=d;best=n}}if(best){addEnergy(best,k.pred?1:0.5);best.glow=1}
  if(G.S.tutorial&&!G.flags.block){G.flags.block=true;queueHint('h.block')}}

function hitWall(){const wl=G.wall;wl.hp--;wl.flash=1;Snd.wall();G.shake=Math.max(G.shake,1.5);const bx=clamp(G.balls[0]?G.balls[0].x:90,wl.x,wl.x+wl.w);burst(bx,wl.y+2,6,[C.vio,'#fff'],30,0.35);
  if(wl.hp<=0){wl.state='gone';G.flags.wallT=G.t;for(let i=0;i<30;i++)burst(wl.x+Math.random()*wl.w,wl.y+2,1,[C.vio,'#fff',C.cy],60,0.8);
    G.nodes.forEach((n,i)=>{if(n.y>wl.y-90&&n.y<wl.y){n.glow=1;addEnergy(n,1);emitWave(n,0.8,i*0.01)}});
    pop(t('pop.brk'),90,wl.y-6,'gold');Snd.release();G.shake=3;G.flash=0.3;G.flashCol=C.vio;aiSay('wallBroken',2.6);G.burstUntil=G.t+9}
  else pop(t('pop.hit',{n:wl.hp}),clamp(bx,20,160),wl.y-6,'vio')}
function startCut(){const tg=G.nodes.find(n=>n.seal&&!n.collected);if(!tg){G.flags.cutDone=true;return}
  const cl=G.nodes.filter(n=>active(n)&&Math.hypot(n.x-tg.x,n.y-tg.y)<42);
  let rx=180-tg.x,ry=clamp(tg.y+42,64,200);for(let k=0;k<12;k++){if(G.nodes.every(n=>Math.hypot(n.x-rx,n.y-ry)>11))break;rx=clamp(rx+(k%2?-9:9)*(k+1)/2,14,166)}
  G.cut={state:'tele',t0:G.t,target:tg,nodes:cl,rel:{x:rx,y:ry},charge:0,released:false};aiSay('cut',3.4);Snd.alarm()}
function lockCut(){const ct=G.cut;ct.state='lock';ct.t0=G.t;ct.nodes.forEach(n=>n.locked=true);G.flash=0.25;G.flashCol=C.vio;
  pop(t('pop.relPt'),ct.rel.x,ct.rel.y-10,'vio');queueHint('h.cutH');$('lockTag').hidden=false}
function releaseCut(auto){const ct=G.cut;if(!ct||ct.state!=='lock')return;ct.state='done';ct.released=true;$('lockTag').hidden=true;
  const mult=auto?1:1+Math.min(ct.charge,24)/12;
  ct.nodes.forEach((n,i)=>{n.locked=false;n.glow=1;addEnergy(n,1.2*mult);emitWave(n,1,0.04*i);burst(n.x,n.y,8,[C.gold,C.vio,'#fff'],50,0.7)});
  burst(ct.rel.x,ct.rel.y,24,['#fff',C.vio],70,0.8);
  pop(t(auto?'pop.autoRel':'pop.release',{m:mult.toFixed(1)}),ct.target.x,ct.target.y-14,'gold');Snd.release();G.shake=3;G.flash=0.4;G.flashCol='#fff';aiSay(auto?'autoRel':'rel',2.6);G.burstUntil=G.t+10}
function startRewrite(){const tg=G.nodes.find(n=>n.wi===G.S.rewrite);if(!tg||tg.collected){G.rw={state:'done'};return}
  G.rw={state:'tele',t0:G.t,target:tg};aiSay('rewrite',3.2);Snd.alarm();queueHint('h.rewrite');$('lockTag').hidden=false}
function protectRewrite(){const rw=G.rw,n=rw.target;rw.state='done';$('lockTag').hidden=true;n.hf=1;pop(t('pop.protect'),n.x,n.y-12,'gold');Snd.protect();Snd.release();G.flash=0.3;G.flashCol=C.gold;G.burstUntil=G.t+8;
  addEnergy(n,1.5);emitWave(n,1);burst(n.x,n.y,22,[C.gold,'#fff',C.cy],60,0.8);
  const h=G.nodes.find(m=>m.hidden&&!m.revealed);if(h)G.timers.push({at:G.t+0.4,fn:()=>reveal(h)});else G.nodes.forEach(m=>{if(m!==n&&Math.hypot(m.x-n.x,m.y-n.y)<50)addEnergy(m,0.8)})}
function completeRewrite(){const rw=G.rw,n=rw.target;rw.state='done';$('lockTag').hidden=true;n.rewritten=true;n.e=Math.min(n.e,0.9);n.glow=1;pop(t('pop.rewritten'),n.x,n.y-12,'vio');Snd.warp();G.flash=0.25;G.flashCol=C.vio;renderTray();queueHint('h.rewritten')}
function updatePredict(){const pr=G.pred;
  if(pr.mark){if(G.t-pr.mark.t0>CFG.predictTele){G.blocks.push({x:pr.mark.x-7,y:pr.mark.y-2,w:14,h:4,alive:true,pred:true,life:CFG.predictLife});pr.mark=null;Snd.dull()}return}
  if(G.t<pr.next)return;const b=G.balls.find(b=>!b.attached&&b.vy<0);if(!b){pr.next=G.t+1;return}
  const pts=predict(b);const k=Math.floor(pts.length/2*0.55)*2;if(pts.length<20){pr.next=G.t+1;return}
  const x=pts[k],y=pts[k+1];if(y<40||y>230||Math.hypot(x-b.x,y-b.y)<30||G.nodes.some(n=>Math.hypot(n.x-x,n.y-y)<10)){pr.next=G.t+0.5;return}
  pr.mark={x:clamp(x,12,168),y,t0:G.t};pr.next=G.t+CFG.predictEvery;Snd.alarm();
  if(!pr.shown){pr.shown=true;aiSay('predict',3);queueHint('h.predict')}}
function startOD(){G.od={state:'tele',t0:G.t,active:false,core:{x:90,y:56,r:7,hp:CFG.coreHits,flash:0,cd:0},shield:Array.from({length:8},()=>({alive:true})),ang:0};aiSay('odStart',2.6);Snd.alarm()}
function activateOD(){G.od.state='active';G.od.active=true;G.flash=0.5;G.flashCol=C.vio;Snd.stab();aiSay('odActive',3);queueHint('h.od')}
function hitCore(){const o=G.od,c=o.core;if(c.cd>0)return;c.cd=0.15;c.hp--;c.flash=1;Snd.core();G.shake=2.5;burst(c.x,c.y,12,[C.vio,'#fff',C.gold],50,0.5);
  if(c.hp>0){pop(t('pop.left',{n:c.hp}),c.x,c.y-14,'gold');return}
  o.active=false;o.state='done';G.flash=save.reduce?0.4:0.9;G.flashCol=save.reduce?C.gold:'#fff';G.shake=5;Snd.od();G.burstUntil=G.t+60;
  bigText('NEURAL OVERDRIVE',t('odSub'));burst(c.x,c.y,60,[C.gold,'#fff',C.cy],90,1.2);

  const b0=G.balls.find(b=>!b.attached&&!b.dead);if(b0){[-0.55,0.55].forEach(a=>{const ca=Math.cos(a),sa=Math.sin(a);G.balls.push({x:b0.x,y:b0.y,vx:b0.vx*ca-b0.vy*sa,vy:b0.vx*sa+b0.vy*ca,boost:20,attached:false,trail:[],dead:false})})}
  G.timers.push({at:G.t+1.6,fn:()=>collectWord(G.S.bind,c.x,c.y+8)})}

/* =================== update =================== */
function updatePlay(dt){
  G.t+=dt;const pd=G.paddle;
  if(IN.left)pd.tx-=170*dt;if(IN.right)pd.tx+=170*dt;
  pd.tx=clamp(pd.tx,pd.w/2+2,W-pd.w/2-2);pd.x+=(pd.tx-pd.x)*Math.min(1,dt*28);
  if(IN.down&&!G.hold&&performance.now()-IN.t0>CFG.holdMs&&IN.moved<10)G.hold=true;
  if(!G.done){
    const steps=Math.max(1,Math.ceil(dt*240)),h=dt/steps;
    for(let s=0;s<steps;s++)for(const b of G.balls){if(b.dead)continue;if(b.attached){b.x=pd.x;b.y=CFG.paddleY-CFG.ballR-1;continue}stepBall(b,h,false)}
    for(const b of G.balls){b.trail.push(b.x,b.y);if(b.trail.length>12)b.trail.splice(0,2)}
    const alive=G.balls.filter(b=>!b.dead);
    if(alive.length===0){G.drops++;G.pmult=1;G.balls=[newBall(true)];Snd.drop();$('hint').hidden=false;if(G.drops===1)showAI(t('h.drop'),'hint',3.4)}
    else G.balls=alive;
  }
  for(let i=0;i<G.events.length;){const ev=G.events[i];if(ev.at<=G.t){G.events.splice(i,1);procEvent(ev)}else i++}
  for(let i=0;i<G.timers.length;){const tm=G.timers[i];if(tm.at<=G.t){G.timers.splice(i,1);tm.fn()}else i++}
  for(const n of G.nodes){n.glow=Math.max(0,n.glow-dt*2.2);n.cd=Math.max(0,n.cd-dt);n.hf=Math.max(0,n.hf-dt*4)}
  G.travels=G.travels.filter(tr=>G.t-tr.t0<tr.d);G.ripples=G.ripples.filter(r=>G.t-r.t0<0.7);
  for(const k of G.blocks)if(k.pred&&k.alive){k.life-=dt;if(k.life<=0)k.alive=false}
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy=p.vy*0.95+12*dt;p.l-=dt}
  G.parts=G.parts.filter(p=>p.l>0);
  G.shake=Math.max(0,G.shake-dt*8);G.flash=Math.max(0,G.flash-dt*2);
  if(G.done){if(state==='play'&&G.t-G.doneT>1.4)showClear();return}
  const S=G.S,f=G.flags;
  if(S.tutorial&&!f.link&&G.links.length>0){f.link=true;queueHint('h.link')}
  if(S.tutorial&&!f.wordHint&&G.t>16&&!G.got.some(Boolean)){f.wordHint=true;queueHint('h.word')}
  if(S.wall&&!G.wall&&(G.t>7||G.got.some(Boolean))){G.wall={x:28,y:214,w:124,h:5,hp:CFG.wallHits,state:'tele',t0:G.t,flash:0};aiSay('wall',3);Snd.alarm();queueHint('h.wallH')}
  if(G.wall){if(G.wall.state==='tele'&&G.t-G.wall.t0>CFG.telegraph)G.wall.state='solid';G.wall.flash=Math.max(0,G.wall.flash-dt*4)}
  if(S.cut&&!G.cut&&!f.cutDone&&((f.wallT&&G.t-f.wallT>2.5)||G.t>34))startCut();
  const ct=G.cut;if(ct){if(ct.state==='tele'&&G.t-ct.t0>CFG.telegraph)lockCut();
    if(ct.state==='lock'){ct.charge+=dt;if(G.t-ct.t0>CFG.lockMax)releaseCut(true);
      const tag=$('lockTag');tag.textContent=t('lockTag',{m:(1+Math.min(ct.charge,24)/12).toFixed(1)});tag.style.left='calc('+ct.target.x.toFixed(1)+' * var(--u))';tag.style.top='calc('+Math.max(36,ct.target.y-46).toFixed(1)+' * var(--u))'}}
  if(S.rewrite!=null&&!G.rw&&(G.t>(S.predict?16:12)||G.got.some(Boolean)))startRewrite();
  const rw=G.rw;if(rw&&(rw.state==='tele'||rw.state==='write')){
    if(rw.target.collected){rw.state='done';$('lockTag').hidden=true}
    else{if(rw.state==='tele'&&G.t-rw.t0>CFG.rewriteTele){rw.state='write';rw.t0=G.t}

function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function launch(){if(!G||G.done)return;let did=false;for(const b of G.balls)if(b.attached){b.attached=false;const a=(Math.random()-0.5)*0.5;b.vx=CFG.ballSpeed*Math.sin(a);b.vy=-CFG.ballSpeed*Math.cos(a);did=true}if(did){Snd.pad();$('hint').hidden=true}}
wrap.addEventListener('pointerdown',e=>{Snd.init();if(e.target.closest('button'))return;e.preventDefault();const p=toL(e);
  IN.down=true;IN.id=e.pointerId;IN.t0=performance.now();IN.sx=e.clientX;IN.sy=e.clientY;IN.moved=0;try{wrap.setPointerCapture(e.pointerId)}catch(_){}
  if(state==='play'&&!paused&&G){G.paddle.tx=p.x}
  else if(state==='story')storyTap();
  else if(state==='card'&&performance.now()-cardT>500)endCard();
  else if(state==='clear'&&performance.now()-clearT>1600)nextFromClear();
  else if(state==='endcard'&&performance.now()-endT>1500)showCredits();
  else if(state==='credits'&&performance.now()-endT>1500)toTitle();
});
wrap.addEventListener('pointermove',e=>{if(!IN.down||e.pointerId!==IN.id)return;IN.moved=Math.max(IN.moved,Math.hypot(e.clientX-IN.sx,e.clientY-IN.sy)/U);if(state==='play'&&!paused&&G)G.paddle.tx=toL(e).x});
function up(e){if(!IN.down||e.pointerId!==IN.id)return;IN.down=false;if(state==='play'&&!paused&&G){if(performance.now()-IN.t0<300&&IN.moved<8)launch();G.hold=false}}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',()=>{IN.down=false;if(G)G.hold=false});
['gesturestart','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  if(e.key==='ArrowLeft'){IN.left=true;e.preventDefault()}if(e.key==='ArrowRight'){IN.right=true;e.preventDefault()}
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'){e.preventDefault();Snd.init();if(state==='play'&&!paused)launch();else if(state==='story')storyTap();else if(state==='card')endCard();else if(state==='endcard')showCredits();else if(state==='credits')toTitle()}
  if(e.key==='Escape'||e.key==='p'){if(state==='play'){paused?resume():pauseGame()}}
  if(e.key==='Shift'&&G)G.hold=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')IN.left=false;if(e.key==='ArrowRight')IN.right=false;if(e.key==='Shift'&&G)G.hold=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();if(Snd.ctx)Snd.ctx.suspend().catch(()=>{})}else{last=performance.now();if(Snd.ctx)Snd.ctx.resume().catch(()=>{})}});

function nextFromClear(){if(state!=='clear')return;$('clear').hidden=true;Snd.select();const cb=onStageClear;onStageClear=null;G=null;if(cb)cb()}
$('bNext').addEventListener('click',nextFromClear);
$('bSkip').addEventListener('click',()=>{Snd.select();ST.i=ST.seq.length;endStory()});
$('bPause').addEventListener('click',()=>{Snd.select();pauseGame()});
$('bResume').addEventListener('click',()=>{Snd.select();resume()});
$('tAssist').addEventListener('click',()=>{save.assist=!save.assist;persist();applyLang();Snd.select()});
const tReduce=()=>{save.reduce=!save.reduce;persist();applyLang();Snd.select()};$('tReduce').addEventListener('click',tReduce);$('tReduce2').addEventListener('click',tReduce);
const tMute=()=>{save.muted=!save.muted;persist();Snd.init();Snd.setMute(save.muted);applyLang()};$('tMute').addEventListener('click',tMute);$('tMute2').addEventListener('click',tMute);
$('tLang').addEventListener('click',openLangPop);$('tLang2').addEventListener('click',openLangPop);
$('bQuit').addEventListener('click',()=>{Snd.select();toTitle()});
$('bStart').addEventListener('click',()=>{Snd.init();Snd.select();runFlow(0)});
$('bCont').addEventListener('click',()=>{Snd.init();Snd.select();runFlow(save.unlocked>=STAGES.length?FLOW.indexOf('s:after3'):FLOW.indexOf('c:'+save.unlocked))});
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>chooseEnding(b.dataset.e)));

/* =================== loop =================== */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(state==='play'&&G&&!paused)updatePlay(dt);
  else if(state==='clear'&&G){G.t+=dt;for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}G.parts=G.parts.filter(p=>p.l>0);for(let i=0;i<G.events.length;){const ev=G.events[i];if(ev.at<=G.t){G.events.splice(i,1);procEvent(ev)}else i++}G.travels=G.travels.filter(tr=>G.t-tr.t0<tr.d);G.ripples=G.ripples.filter(r=>G.t-r.t0<0.7);G.flash=Math.max(0,G.flash-dt*2);for(const n of G.nodes)n.glow=Math.max(0,n.glow-dt*2)}
  if(state==='story')updateStory(dt);
  scene.t+=dt;
  if(G&&(state==='play'||state==='clear'))drawPlay();
  else{X=ctx;(SC[scene.name]||SC.void)(scene.t,scene.opt);
    if(scene.flash>0){X.globalAlpha=scene.flash*(save.reduce?0.3:0.8);R(0,0,W,H,'#fff');X.globalAlpha=1;scene.flash=Math.max(0,scene.flash-dt*2)}
    if(scene.t<0.4){X.globalAlpha=1-scene.t/0.4;R(0,0,W,H,'#000');X.globalAlpha=1}
    if(state==='title'||state==='choice'||state==='credits'){X.globalAlpha=state==='title'?0.25:0.15;R(0,0,W,H,'#02040a');X.globalAlpha=1}}
}
toTitle();requestAnimationFrame(frame);
})();
</script>

</body>
</html>
