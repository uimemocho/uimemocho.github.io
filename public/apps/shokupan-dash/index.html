<style>
/* Layout: one fixed 9:16 pixel stage (180x320 game px) centered on an ink ground; HTML overlays scale with --s */
:root{
  --ink:#151327;
  --ink2:#221f3d;
  --paper:#fff6e6;
  --toast:#f3c46e;
  --crust:#b4652a;
  --ribbon:#e2414c;
  --sky:#6fb7ec;
  --pink:#ff7aa8;
  --font-jp:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-num:'Silkscreen','DotGothic16',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-jp);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:radial-gradient(ellipse at 50% 30%,#24204a 0%,var(--ink) 70%)}
#stage{--s:2;position:relative;width:calc(180px * var(--s));height:calc(320px * var(--s));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 calc(var(--s)*1px) #000,0 calc(var(--s)*6px) calc(var(--s)*20px) #0008}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.px{font-size:calc(var(--s) * 8px);line-height:1.25}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#clock{position:absolute;left:calc(var(--s)*7px);top:calc(var(--s)*5px);font-family:var(--font-num);font-weight:700;font-size:calc(var(--s)*15px);line-height:1;color:var(--paper);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #1b2a55;font-variant-numeric:tabular-nums;letter-spacing:calc(var(--s)*.5px)}
#clock.warn{color:#ff5a64;animation:blink .5s steps(2) infinite}
#clocklabel{position:absolute;left:calc(var(--s)*8px);top:calc(var(--s)*22px);font-size:calc(var(--s)*6px);color:#e8f4ff;text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #1b2a55}
#score{position:absolute;right:calc(var(--s)*6px);top:calc(var(--s)*16px);font-family:var(--font-num);font-size:calc(var(--s)*6px);color:var(--paper);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #1b2a55;text-align:right;font-variant-numeric:tabular-nums}
#combo{position:absolute;left:50%;top:calc(var(--s)*48px);transform:translateX(-50%);font-family:var(--font-jp);font-size:calc(var(--s)*8px);color:var(--toast);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #5a2a10;white-space:nowrap;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo b{font-family:var(--font-num);font-size:calc(var(--s)*11px)}
#ctlhint{position:absolute;left:0;right:0;bottom:calc(var(--s)*8px);display:flex;justify-content:space-between;padding:0 calc(var(--s)*8px);font-size:calc(var(--s)*7px);color:#fff;opacity:0;transition:opacity .6s}
#ctlhint.on{opacity:.85}
#ctlhint span{background:#0006;padding:calc(var(--s)*2px) calc(var(--s)*5px);border:calc(var(--s)*1px) solid #fff5}
#mute{position:absolute;right:calc(var(--s)*5px);bottom:calc(var(--s)*5px);pointer-events:auto;background:#0007;color:#fff;border:calc(var(--s)*1px) solid #fff6;font-family:var(--font-num);font-size:calc(var(--s)*5px);padding:calc(var(--s)*2px) calc(var(--s)*3px);cursor:pointer;z-index:5}
#mute:focus-visible,.btn:focus-visible{outline:calc(var(--s)*1px) solid #fff;outline-offset:calc(var(--s)*1px)}

/* popups */
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:calc(var(--s)*8px);color:#fff;text-shadow:calc(var(--s)*1px) 0 0 #1a1530,calc(var(--s)*-1px) 0 0 #1a1530,0 calc(var(--s)*1px) 0 #1a1530,0 calc(var(--s)*-1px) 0 #1a1530;animation:rise 1s steps(10) forwards}
.pop.cancel{color:var(--toast);font-size:calc(var(--s)*9px)}
.pop.perfect{color:#7ff0ff}
.pop.doki{color:var(--pink);font-size:calc(var(--s)*16px);animation:dokipop 1.3s steps(12) forwards}
.pop.big{font-size:calc(var(--s)*12px);color:#fff;animation:dokipop 1.3s steps(12) forwards}
.pop.item{color:#bdf27a}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-180%)}}
@keyframes dokipop{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}12%{opacity:1;transform:translate(-50%,-50%) scale(.9)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@keyframes blink{50%{opacity:.25}}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:4}
#title{justify-content:space-between;padding-block:calc(var(--s)*26px) calc(var(--s)*18px);background:linear-gradient(#0000 0%,#0000 55%,#151327cc 72%,#151327f2 100%)}
.logo{text-align:center;transform:rotate(-4deg);margin-top:calc(var(--s)*2px)}
.logo .l1{display:block;font-size:calc(var(--s)*30px);line-height:1;color:var(--toast);letter-spacing:calc(var(--s)*1px);text-shadow:
  calc(var(--s)*2px) 0 0 var(--crust),calc(var(--s)*-2px) 0 0 var(--crust),0 calc(var(--s)*2px) 0 var(--crust),0 calc(var(--s)*-2px) 0 var(--crust),
  calc(var(--s)*2px) calc(var(--s)*2px) 0 var(--crust),calc(var(--s)*-2px) calc(var(--s)*2px) 0 var(--crust),calc(var(--s)*2px) calc(var(--s)*-2px) 0 var(--crust),calc(var(--s)*-2px) calc(var(--s)*-2px) 0 var(--crust),
  calc(var(--s)*2px) calc(var(--s)*5px) 0 #3a1a08}
.logo .l2{display:inline-block;margin-top:calc(var(--s)*6px);font-size:calc(var(--s)*16px);line-height:1;color:#fff;background:var(--ribbon);padding:calc(var(--s)*3px) calc(var(--s)*6px) calc(var(--s)*2px);box-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 #6a1220}
.logo .l3{display:block;margin-top:calc(var(--s)*7px);font-size:calc(var(--s)*7px);color:#fff;text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #1b2a55}
.howto{width:calc(var(--s)*156px);font-size:calc(var(--s)*6.5px);line-height:1.55;color:#f2ecff;display:grid;gap:calc(var(--s)*2px)}
.howto .row{display:flex;justify-content:space-between;gap:calc(var(--s)*4px)}
.howto .k{color:var(--toast)}
.howto p{margin:0}
.btn{font-family:var(--font-jp);font-size:calc(var(--s)*10px);color:var(--ink);background:var(--toast);border:0;padding:calc(var(--s)*4px) calc(var(--s)*14px) calc(var(--s)*3px);box-shadow:0 calc(var(--s)*3px) 0 var(--crust),0 calc(var(--s)*3px) 0 calc(var(--s)*1px) #2a1306;cursor:pointer;margin-top:calc(var(--s)*6px)}
.btn:active{transform:translateY(calc(var(--s)*2px));box-shadow:0 calc(var(--s)*1px) 0 var(--crust)}
.btn.sub{background:#d6d3ec;box-shadow:0 calc(var(--s)*3px) 0 #6c6890;font-size:calc(var(--s)*8px)}
.best{font-family:var(--font-num);font-size:calc(var(--s)*5.5px);color:#c8c2ea;margin-top:calc(var(--s)*4px)}
.tapstart{animation:blink 1s steps(2) infinite}

#result{justify-content:center;background:#151327e0;gap:calc(var(--s)*3px);text-align:center}
#result .kind{font-size:calc(var(--s)*7px);color:#c8c2ea;letter-spacing:calc(var(--s)*1px)}
#result .rank{font-family:var(--font-num);font-weight:700;font-size:calc(var(--s)*48px);line-height:1;color:var(--toast);text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--crust)}
#result .rank.fail{color:var(--pink);text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 #7a1f45;font-size:calc(var(--s)*20px);font-family:var(--font-jp);font-weight:400;margin-block:calc(var(--s)*6px)}
#result .rtitle{font-size:calc(var(--s)*11px);color:#fff}
#result .desc{font-size:calc(var(--s)*6.5px);color:#e4defa;width:calc(var(--s)*150px);line-height:1.5}
#result table{border-collapse:collapse;font-size:calc(var(--s)*6.5px);margin-top:calc(var(--s)*4px);width:calc(var(--s)*130px)}
#result td{padding:calc(var(--s)*1.5px) 0;border-bottom:calc(var(--s)*1px) dashed #ffffff30}
#result td:last-child{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--toast)}
#result .total td{color:#fff;font-size:calc(var(--s)*8px);border-bottom:0}
#result .total td:last-child{color:var(--toast)}
#result .newbest{font-family:var(--font-num);font-size:calc(var(--s)*6px);color:#7ff0ff;animation:blink .6s steps(2) infinite}
#result .btns{display:flex;gap:calc(var(--s)*6px)}
#paused{justify-content:center;background:#151327c0;font-size:calc(var(--s)*10px)}
@media (prefers-reduced-motion:reduce){.tapstart,#clock.warn,#result .newbest{animation:none}}
</style>

<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="180" height="320"></canvas>
    <div id="hud" hidden>
      <div id="clock">8:24</div>
      <div id="clocklabel">始業 8:30 ／ 学校まで <span id="distm">1500</span>m</div>
      <div id="score">SCORE 0</div>
      <div id="combo">出会いキャンセル <b>×2</b></div>
      <div id="ctlhint"><span>◀ スライディング</span><span>ジャンプ ▶</span></div>
    </div>
    <div id="pops"></div>
    <button id="mute" type="button" aria-label="サウンド切り替え">SOUND ON</button>

    <div id="title" class="screen">
      <div class="logo">
        <span class="l1">食パン</span>
        <span class="l2">遅刻ダッシュ</span>
        <span class="l3">出会いフラグ、ぜんぶ回避。</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="howto">
          <p>曲がり角の「！」から、運命の出会いが飛び出してくる。ぶつからずに駆け抜けて、8:30までに校門を突破せよ。</p>
          <div class="row"><span><span class="k">右タップ</span> ジャンプ（長押しで高く）</span></div>
          <div class="row"><span><span class="k">左タップ</span> スライディング（長押しで延長）</span></div>
          <div class="row"><span><span class="k">PC</span> ↑/Space ジャンプ・↓ スライディング</span></div>
        </div>
        <button class="btn" id="startBtn" type="button">いってきます！</button>
        <div class="best" id="bestTitle"></div>
      </div>
    </div>

    <div id="result" class="screen" hidden></div>
    <div id="paused" class="screen" hidden><div class="tapstart">タップで再開</div></div>
  </div>
</div>

<script>
(()=>{
'use strict';
// ============ constants ============
const W=180,H=320,GROUND=262,GIRL_SX=46;
const GOAL=9000, DEADLINE=360, GSEC=5/60; // 1 real sec = 5 game sec, 8:24:00 -> 8:30:00
const GRAV=0.3, JUMP_V=-5.7;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
const hudEl=$('hud'),clockEl=$('clock'),distEl=$('distm'),scoreEl=$('score'),comboEl=$('combo'),popsEl=$('pops'),ctlEl=$('ctlhint');
let scale=2;

// ============ palette ============
const C={
  k:'#1b1626',hair:'#2a2132',hairHi:'#4b3b58',skin:'#f6cfa8',skinSh:'#de9f7c',blush:'#f39aa0',
  bl:'#c9a574',blSh:'#9a774c',shirt:'#f4f0e6',rib:'#d8363f',sk:'#2e3766',skSh:'#1f264d',sock:'#20243f',shoe:'#5a3426',
  toast:'#f2c878',toastHi:'#fbe0a4',crust:'#b4652a',bag:'#262a4b',bagHi:'#3a3f6a',
  gak:'#1f2440',gakSh:'#151931',btn:'#d8b14a',pants:'#1a1d33',bshoe:'#2c2420',
  jersey:'#2b3c78',jerseySh:'#1e2b5a',tan:'#d9a77a',tanSh:'#b9825a'
};

// ============ helpers ============
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=mulberry32(Date.now()&0xffff);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function S(ox,oy,flip,sw){ox=Math.round(ox);oy=Math.round(oy);return(dx,dy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(flip?ox+sw-dx-w:ox+dx,oy+dy,w,h)}}
function disc(c2,cx,cy,r,col){c2.fillStyle=col;for(let y=-r;y<=r;y++){const hw=Math.floor(Math.sqrt(r*r-y*y+r*0.8));c2.fillRect(cx-hw,cy+y,hw*2+1,1)}}
function line(x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);ctx.fillStyle=col;const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<200;i++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x]}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}

// ============ prerendered layers ============
let SKY,CLOUDS,FAR,MID,ROAD;
function buildLayers(){
  // sky with ordered dithering between bands
  {const [c,x]=mk(W,H);const top=hex2rgb('#4f9de0'),bot=hex2rgb('#d4ecf8');const N=9;const bands=[];
   for(let i=0;i<N;i++){const t=i/(N-1);bands.push([0,1,2].map(k=>Math.round(lerp(top[k],bot[k],Math.pow(t,0.9)))))}
   const img=x.createImageData(W,H);const bay=[[0,2],[3,1]];
   for(let y=0;y<H;y++){const v=clamp(y/245,0,1)*(N-1);const b=Math.floor(v),f=v-b;
     for(let xx=0;xx<W;xx++){const th=(bay[y&1][xx&1]+0.5)/4;const bi=Math.min(N-1,b+(f>th?1:0));const p=(y*W+xx)*4;const col=bands[bi];img.data[p]=col[0];img.data[p+1]=col[1];img.data[p+2]=col[2];img.data[p+3]=255}}
   x.putImageData(img,0,0);
   // sun
   disc(x,150,34,15,'#fff3c9');disc(x,150,34,11,'#fffbe8');
   SKY=c;}
  // clouds strip
  {const [c,x]=mk(360,140);const r=mulberry32(7);
   const cloud=(cx,cy,s)=>{const parts=[[0,0,9],[10,-4,11],[22,0,8],[-9,3,6],[30,4,5]];
     for(const p of parts)disc(x,cx+p[0]*s|0,cy+p[1]*s+3|0,Math.round(p[2]*s),'#c6deef');
     for(const p of parts)disc(x,cx+p[0]*s|0,cy+p[1]*s|0,Math.round(p[2]*s),'#ffffff');
     x.fillStyle='#c6deef';x.fillRect(cx-14*s|0,cy+6*s|0,48*s|0,2)};
   cloud(30,40,1);cloud(140,70,0.7);cloud(230,30,1.2);cloud(320,95,0.6);cloud(90,110,0.5);
   // wrap duplicates
   const [c2,x2]=mk(360,140);x2.drawImage(c,0,0);x2.drawImage(c,-360,0);x2.drawImage(c,360,0);
   CLOUDS=c2;}
  // far apartments
  {const [c,x]=mk(360,H);const r=mulberry32(11);let px=0;const cols=['#a3bfd4','#adc7da','#97b5cb','#b6cfe0'];
   const bld=(bx,w,top,col)=>{x.fillStyle=col;x.fillRect(bx,top,w,240-top);x.fillStyle='#c9dbe8';
     for(let wy=top+4;wy<236;wy+=5)for(let wx=bx+3;wx<bx+w-3;wx+=4)x.fillRect(wx,wy,2,2);
     x.fillStyle='#8fadc4';x.fillRect(bx,top,w,1);x.fillRect(bx+w-2,top,2,240-top)};
   while(px<360){const w=16+Math.floor(r()*22);const top=150+Math.floor(r()*48);const col=cols[Math.floor(r()*cols.length)];
     bld(px,w,top,col);if(px+w>360)bld(px-360,w,top,col);
     if(r()<0.4){x.fillStyle='#8fadc4';x.fillRect(px+4,top-5,6,5);if(px+w>360)x.fillRect(px+4-360,top-5,6,5)}
     px+=w+Math.floor(r()*6)}
   FAR=c;}
  // mid houses, trees, poles, wires
  {const [c,x]=mk(480,H);const r=mulberry32(23);
   const walls=['#efe4cb','#e6d6b8','#d6e2d2','#f2eadc','#e9d2c0'];const roofs=['#4b5b7c','#7e4a3b','#56664a','#5d4f6e','#3f4a5c'];
   const house=(hx,w)=>{const top=192+Math.floor(r()*14);const wall=walls[Math.floor(r()*walls.length)];const roof=roofs[Math.floor(r()*roofs.length)];
     const draw=(ox)=>{x.fillStyle=wall;x.fillRect(ox,top,w,240-top);x.fillStyle='#00000018';x.fillRect(ox,top,3,240-top);
       // roof stepped
       const rh=9+Math.floor(w/10);for(let i=0;i<rh;i++){const inset=Math.floor(i*w*0.42/rh);x.fillStyle=i%3===0?'#00000030':roof;x.fillRect(ox-3+inset,top-i-1,w+6-inset*2,1);x.fillStyle=roof;x.fillRect(ox-3+inset,top-i-1,w+6-inset*2,1);if(i%3===0){x.fillStyle='#ffffff22';x.fillRect(ox-3+inset,top-i-1,w+6-inset*2,1)}}
       x.fillStyle='#00000035';x.fillRect(ox-3,top,w+6,1);

function noise(dur,vol,when,hp,dest,t0){if(!AC)return;const t=t0!==undefined?t0:AC.currentTime+(when||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1000;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+0.02)}

const LEAD=[76,79,84,79,76,79,81,79, 76,0,72,76,81,0,79,76, 77,81,84,81,77,76,74,72, 74,0,79,0,83,81,79,0,

const ROOTS=[48,45,41,43,48,45,41,43];
function startBGM(){if(!AC||bgm)return;const step=60/164/2;let n=0,next=AC.currentTime+0.1;
  bgm=setInterval(()=>{if(!AC)return;while(next<AC.currentTime+0.15){const i=n%64,bar=Math.floor(i/8),s=i%8;
      if(LEAD[i])toneAt(next,n2f(LEAD[i]),step*0.9,'square',0.32,musicGain);
      if(s%2===0){const m=ROOTS[bar]+(s%4===2?12:0);toneAt(next,n2f(m),step*1.6,'triangle',0.7,musicGain)}
      if(s===0||s===4){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,next);o.frequency.exponentialRampToValueAtTime(40,next+0.1);g.gain.setValueAtTime(0.6,next);g.gain.exponentialRampToValueAtTime(0.0001,next+0.12);o.connect(g);g.connect(musicGain);o.start(next);o.stop(next+0.13)}
      if(s%2===1)noise(0.04,0.25,0,6000,musicGain,next);
      n++;next+=step}},25)}

function part(x,y,vx,vy,life,col,type){G.parts.push({x,y,vx,vy,life,max:life,col,type:type||'px'})}

// ============ world generation ============
function genCorners(){
  while(G.nextCorner<G.camX+W+140){
    const cx=G.nextCorner;
    if(cx>GOAL-560){G.nextCorner=Infinity;break}
    const n=G.cornerCount++;
    let kind=null;
    if(G.mode!=='title'){
      if(n===0)kind='walker';else if(n===1)kind='books';else if(n===2)kind='bike';
      else{const r=rng();kind=r<0.38?'walker':r<0.68?'books':'bike'}
    }
    G.corners.push({x:cx,w:38,kind,spawned:false,hint:n<3,warnT:0});
    const p=clamp(cx/GOAL,0,1);
    const gap=(n<3?110:0)+lerp(200,140,p)+rng()*lerp(110,70,p);
    if(G.mode!=='title'&&n>=2&&gap>150&&rng()<0.42){
      const type=rng()<0.22?'milk':'toast';
      G.items.push({type,x:cx+38+gap*0.5,y:rng()<0.5?GROUND-8:GROUND-40,got:false,t:rng()*60});
    }
    G.nextCorner=cx+38+gap;
  }
}
function trigDist(c){
  const sp=curSpeed();const T=(c.hint?62:47)*(1-0.22*progress());
  if(c.kind==='walker')return T*(sp+0.55)-10;
  if(c.kind==='bike')return T*0.92*(sp+2)-3;
  return sp*10+T*0.85*(sp+2.6)-10;
}
function spawnFromCorner(c){
  c.spawned=true;const g=++G.gid;
  const hc=HAIRS[Math.floor(rng()*HAIRS.length)];
  if(c.kind==='walker'){G.obs.push({type:'walker',x:c.x+19,y:GROUND,vx:-0.55,hw:5,h:26,g,f:0,hc,emerge:10,collide:true});G.groups[g]={left:1,hit:false,minGap:99};sfx.pop()}
  else if(c.kind==='bike'){G.obs.push({type:'bike',x:c.x+19,y:GROUND,vx:-2,hw:12,h:24,g,rot:0,hc,emerge:6,collide:true});G.groups[g]={left:1,hit:false,minGap:99};sfx.bell();pop('チリンッ',c.x+19-G.camX,GROUND-44,'')}
  else{G.obs.push({type:'thrower',x:c.x+19,y:GROUND-8,g,t:0,next:10,thrown:0,hc,collide:false});G.groups[g]={left:3,hit:false,minGap:99};pop('うわっ',c.x+19-G.camX,GROUND-50,'')}
}

function getBest(){try{return +localStorage.getItem('shokupan_dash_best')||0}catch(e){return 0}}

function cancelGroup(grp,o){
  G.combo++;G.cancels++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const perfect=grp.minGap<=6;let pts=100+20*Math.min(G.combo,20);if(perfect){pts+=80;G.perfects++}
  G.score+=pts;
  pop(perfect?'PERFECT キャンセル!':'出会いキャンセル!',GIRL_SX+8,G.gy-36,perfect?'cancel perfect':'cancel');
  if(perfect)sfx.perfect();else sfx.cancel(G.combo);
  for(let i=0;i<6;i++)part(G.gx,G.gy-14,rng()*2-1,-rng()*2-0.5,24,perfect?'#7ff0ff':'#ffd36b');
}
function hitBy(o){
  const grp=G.groups[o.g];grp.hit=true;
  for(const q of G.obs){if(q.g===o.g&&q.type==='book'){q.scatter=true;q.vy=-2-rng()*2;q.vx=rng()*2-1;q.collide=false}}
  if(o.type==='walker'||o.type==='bike'){o.state='doki';o.collide=false}
  G.mode='doki';G.doki={t:0,o};G.lives--;G.hits++;G.combo=0;G.clock+=15;G.shake=10;G.slideT=0;
  sfx.doki();stopBGM();
  pop('ドキッ…♡',W/2,140,'doki');
  pop('-15秒',GIRL_SX,G.gy-40,'');
}
function endGame(kind){
  G.mode='result';stopBGM();hudEl.hidden=true;
  const remain=Math.max(0,Math.floor(DEADLINE-G.clock));
  let clearB=0,timeB=0,lifeB=0,leapB=0;
  if(kind==='clear'){clearB=1000;timeB=remain*20;lifeB=G.lives*300;leapB=G.leapPerfect?500:0}
  const total=G.score+clearB+timeB+lifeB+leapB;
  const best=getBest();const isBest=total>best;if(isBest)setBest(total);
  let rank='',rtitle='',desc='',kindLabel='';
  if(kind==='clear'){
    kindLabel='遅刻回避 成功';
    if(G.hits===0&&remain>=30){rank='S';rtitle='伝説の出会いキャンセラー';desc='すべての出会いをかわし、余裕をもって校門を越えた。運命のほうが遅刻した。'}
    else if(G.hits<=1){rank='A';rtitle='朝の疾風';desc='ほぼ無傷で登校完了。食パンもまだ温かい。'}
    else{rank='B';rtitle='ギリギリセーフ';desc='何度か運命とぶつかりかけたけど、なんとか間に合った。'}
    sfx.fanfare();
  }else{
    sfx.fail();
    if(kind==='love'){kindLabel='GAME OVER';rank='出会いルート突入';rtitle='物語が始まってしまった';desc='曲がり角の出会いに3回つかまり、食パンを食べきった。今日はもう、恋愛ドラマの第1話。'}
    else if(kind==='late'){kindLabel='GAME OVER';rank='遅刻';rtitle='8:30のチャイム';desc='校門まであと少し。牛乳を拾うと一時的に加速できる。'}
    else{kindLabel='GAME OVER';rank='生活指導';rtitle='校門の番人に捕獲';desc='先生が見えたらタップ。ギリギリまで引きつけるほど高得点。'}
  }
  const rows=[['出会いキャンセル',G.cancels+'回'],['最大コンボ','×'+G.maxCombo],['PERFECT',G.perfects+'回'],['キャンセル得点',G.score.toLocaleString()]];
  if(kind==='clear'){rows.push(['校門突破ボーナス',clearB.toLocaleString()],['残り時間 '+remain+'秒',timeB.toLocaleString()],['残り食パン ×'+G.lives,lifeB.toLocaleString()]);if(leapB)rows.push(['PERFECT LEAP',leapB.toLocaleString()])}
  const r=$('result');
  r.innerHTML=`<div class="kind">${kindLabel}</div><div class="rank ${kind==='clear'?'':'fail'}">${rank}</div><div class="rtitle">${rtitle}</div><div class="desc">${desc}</div>
  <table>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}<tr class="total"><td>TOTAL</td><td>${total.toLocaleString()}</td></tr></table>
  ${isBest?'<div class="newbest">NEW BEST!</div>':`<div class="best">BEST ${Math.max(best,total).toLocaleString()}</div>`}
  <div class="btns"><button class="btn" type="button" id="retryBtn">もう一回</button><button class="btn sub" type="button" id="toTitleBtn">タイトル</button></div>`;
  r.hidden=false;
  $('retryBtn').addEventListener('click',startGame);$('toTitleBtn').addEventListener('click',showTitle);
  setTimeout(()=>{const b=$('retryBtn');if(b)b.focus({preventScroll:true})},50);
}

// ============ update ============
function updateGirlPhysics(ts){
  const g=G;
  if(inp.jumpP){
    if(g.onGround){g.vy=JUMP_V;g.onGround=false;g.slideT=0;sfx.jump();dust(g.gx-3,g.gy,3)}
    else g.jumpBuf=8;
  }
  if(inp.slideP){
    if(g.onGround){if(g.slideT<=0){sfx.slide();dust(g.gx-6,g.gy,4)}g.slideT=26;g.slideHeldT=0}
    else{g.vy=Math.max(g.vy,5);g.slideQ=true}
  }
  if(g.slideT>0){
    g.slideHeldT+=ts;
    if(inp.slideH&&g.slideHeldT<62&&g.slideT<4)g.slideT=4;
    g.slideT-=ts;if((G.t%5)===0)dust(g.gx-8,g.gy,1);
  }
  if(!g.onGround){
    g.vy+=GRAV*ts;if(!inp.jumpH&&g.vy<-2.2)g.vy=-2.2;
    g.gy+=g.vy*ts;
    if(g.gy>=GROUND){g.gy=GROUND;g.vy=0;g.onGround=true;dust(g.gx-2,g.gy,3);
      if(g.jumpBuf>0){g.vy=JUMP_V;g.onGround=false;sfx.jump();g.jumpBuf=0}
      else if(g.slideQ||inp.slideH){g.slideT=26;g.slideHeldT=0;sfx.slide()}
      g.slideQ=false}
  }
  if(g.jumpBuf>0)g.jumpBuf-=ts;
}
function girlBox(){const g=G;if(g.slideT>0&&g.onGround)return{x0:g.gx-8,x1:g.gx+8,y0:g.gy-10,y1:g.gy};return{x0:g.gx-4,x1:g.gx+4,y0:g.gy-23,y1:g.gy}}
function obsBox(o){if(o.type==='book')return{x0:o.x-3,x1:o.x+3,y0:o.y-3,y1:o.y+3};return{x0:o.x-o.hw,x1:o.x+o.hw,y0:o.y-o.h,y1:o.y}}

function update(){
  const g=G;g.t++;
  g.cloudOff+=0.05;
  if(g.mode==='title'){g.gx+=1.6;g.camX=g.gx-GIRL_SX;g.runAcc+=1.6;if(g.runAcc>5){g.runAcc=0;g.runF=(g.runF+1)&3}genCorners();prune();return}
  if(g.mode==='result')return;
  if(g.shake>0)g.shake-=1;
  updateParticles();

  if(g.mode==='doki'){
    const d=g.doki;d.t++;
    if(d.t%4===0)part(g.gx+4+rng()*14,g.gy-24-rng()*8,rng()*0.6-0.3,-0.6-rng()*0.6,40,rng()<0.5?'#ff7aa8':'#ffb3cf','heart');
    if(d.t===48){pop(g.lives>0?'…って遅刻する！！':'…はじまっちゃった',W/2,175,'big')}
    if(d.t>=82){
      if(g.lives<=0){endGame('love');return}
      g.mode='play';g.inv=70;g.vy=-3;g.onGround=false;g.doki=null;startBGM();
    }
    return;
  }

  let ts=1;
  if(g.mode==='finale')ts=0.32;

  if(g.mode==='play'||g.mode==='finale'){
    const sp=curSpeed()*ts;
    g.gx+=sp;g.runAcc+=sp;if(g.runAcc>5.5){g.runAcc=0;g.runF=(g.runF+1)&3;if(g.onGround&&g.slideT<=0&&g.runF%2===0&&rng()<0.4)dust(g.gx-4,g.gy,1)}
    g.clock+=GSEC*ts;
    const curMin=Math.floor(g.clock/60);if(DEADLINE-g.clock<60&&Math.floor(g.clock)!==g.lastMin){g.lastMin=Math.floor(g.clock);if(g.lastMin%5===0)sfx.tick()}
    if(g.boostT>0){g.boostT-=ts;if(g.t%2===0)part(g.gx-10,g.gy-4-rng()*20,-3,0,10,'#ffffffcc','line')}
    if(g.inv>0)g.inv-=ts;
    if(g.mode==='play')updateGirlPhysics(ts);
    else{ // finale: girl keeps running on the ground
      if(!g.onGround){g.vy+=GRAV*ts;g.gy+=g.vy*ts;if(g.gy>=GROUND){g.gy=GROUND;g.onGround=true;g.vy=0}}
      g.slideT=0;
    }
    if(g.clock>=DEADLINE){g.clock=DEADLINE;g.mode='late';g.endT=0;stopBGM();sfx.chime(true);pop('キーンコーンカーンコーン',W/2,120,'big');inp.jumpP=inp.slideP=false;return}
  }
  g.camX=g.gx-GIRL_SX;

  if(g.mode==='play'){
    genCorners();
    for(const c of g.corners){
      if(c.kind&&!c.spawned){if(c.x-g.camX<W+10)c.warnT++;if(c.x-g.gx<trigDist(c))spawnFromCorner(c)}
    }
    // finale trigger
    if(TEACHER_X-g.gx<84){g.mode='finale';g.teacherMode='ready';pop('TAP!',W/2,120,'big');g.slideT=0}
  }
  if(g.mode==='finale'){
    g.gateClose=clamp(g.gateClose+0.006,0,1);
    const d=TEACHER_X-g.gx;
    if(inp.jumpP||inp.slideP){
      g.leapPerfect=d<=40;g.finaleTapDist=d;
      g.mode='leap';g.leap={t:0,x0:g.gx,y0:g.gy,x1:GOAL+104,L:96};g.teacherMode='up';
      sfx.jump();tone(200,0.6,'sawtooth',0.06,0,1400);stopBGM();
      pop(g.leapPerfect?'PERFECT LEAP!!':'とりゃーっ！',W/2,110,'big');
      dust(g.gx,g.gy,8);
    }else if(d<12){g.mode='caught';g.endT=0;g.teacherMode='grab';stopBGM();pop('つかまえたぞ！',W/2,150,'big');G.shake=6}
  }
  if(g.mode==='leap'){
    const L=g.leap;L.t++;const e=clamp(L.t/L.L,0,1);const ee=e<0.5?e*e*2:1-Math.pow(-2*e+2,2)/2;
    g.gx=lerp(L.x0,L.x1,e*0.35+ee*0.65);g.gy=L.y0-96*Math.sin(Math.PI*e);g.onGround=false;g.camX=g.gx-GIRL_SX-Math.sin(Math.PI*e)*20;
    if(L.t%3===0)part(g.gx-6,g.gy-12,-1,0.3,20,'#fff4c8','px');
    if(L.t>=L.L){g.gy=GROUND;g.onGround=true;g.mode='clear';g.clearT=0;dust(g.gx,g.gy,12);sfx.land();G.shake=4;setTimeout(()=>{if(G.mode==='clear'){sfx.chime(false)}},300);pop('セーフ！！',W/2,140,'big')}
  }
  if(g.mode==='clear'){g.clearT++;g.gateClose=clamp(g.gateClose+0.02,0,1);if(g.clearT>150)endGame('clear');inp.jumpP=inp.slideP=false;return}
  if(g.mode==='caught'){g.endT++;if(g.endT>90)endGame('caught');inp.jumpP=inp.slideP=false;return}
  if(g.mode==='late'){g.endT++;g.camX=g.gx-GIRL_SX;if(g.endT>170)endGame('late');inp.jumpP=inp.slideP=false;return}

  // obstacles
  if(g.mode==='play'||g.mode==='finale'){
    const gb=girlBox();
    for(const o of g.obs){
      if(o.emerge>0)o.emerge-=ts;
      if(o.type==='walker'){if(o.state==='doki'){o.state='dazed'}else if(o.state!=='dazed'&&!o.knock){o.x+=o.vx*ts;o.f=(o.f+0.12*ts)%2}}
      else if(o.type==='bike'){if(o.state==='doki')o.state='dazed';else if(o.state!=='dazed'&&!o.knock){o.x+=o.vx*ts;o.rot+=0.35*ts}}
      else if(o.type==='thrower'){o.t+=ts;if(o.t>=o.next&&o.thrown<3){o.thrown++;o.next+=9;o.throwAnim=6;
          g.obs.push({type:'book',x:o.x-5,y:GROUND-19,vx:-2.6,vy:0,g:o.g,col:BOOKCOL[Math.floor(rng()*BOOKCOL.length)],rot:0,collide:true,hw:3,h:6});sfx.pop()}
        if(o.throwAnim>0)o.throwAnim-=ts}
      else if(o.type==='book'){o.x+=o.vx*ts;o.rot+=ts;if(o.scatter){o.vy+=0.25;o.y+=o.vy;if(o.y>GROUND-3){o.y=GROUND-3;o.vy=0;o.vx=0}}}
      if(o.knock){o.x+=o.kvx;o.y+=o.kvy;o.kvy+=0.25}
      if(o.collide&&!o.passed){
        const ob=obsBox(o);
        const xo=ob.x0<gb.x1&&ob.x1>gb.x0;
        if(xo){
          const yo=ob.y0<gb.y1&&ob.y1>gb.y0;
          if(yo){
            if(g.boostT>0||g.inv>0){
              if(g.boostT>0){o.knock=true;o.kvx=3.5;o.kvy=-4;o.collide=false;o.passed=true;const grp=g.groups[o.g];grp.left--;if(grp.left<=0&&!grp.hit){grp.minGap=99;cancelGroup(grp,o);pop('ふっとばし！',GIRL_SX+20,g.gy-30,'item')}}
            }else{hitBy(o);return}
          }else{
            const gap=Math.max(ob.y0-gb.y1,gb.y0-ob.y1);const grp=g.groups[o.g];if(grp&&gap<grp.minGap)grp.minGap=gap;
          }
        }
        if(o.collide&&ob.x1<gb.x0){o.passed=true;const grp=g.groups[o.g];grp.left--;if(grp.left<=0&&!grp.hit)cancelGroup(grp,o)}
      }
    }
    // items
    for(const it of g.items){
      if(it.got)continue;it.t+=ts;
      const bx0=it.x-5,bx1=it.x+5,by0=it.y-6,by1=it.y+6;
      if(bx0<gb.x1+2&&bx1>gb.x0-2&&by0<gb.y1&&by1>gb.y0-2){
        it.got=true;sfx.item();
        if(it.type==='toast'){if(g.lives<3){g.lives++;pop('おかわり！',GIRL_SX+10,g.gy-40,'item')}else{g.score+=150;pop('+150',GIRL_SX+10,g.gy-40,'item')}}
        else{g.boostT=150;g.inv=Math.max(g.inv,10);sfx.boost();pop('牛乳ブースト！',GIRL_SX+10,g.gy-40,'item')}
        for(let i=0;i<8;i++)part(it.x,it.y,rng()*2-1,-rng()*2,20,'#fff6c0');
      }
    }
  }
  prune();
  inp.jumpP=false;inp.slideP=false;
}
function prune(){
  const cut=G.camX-60;
  if(G.corners.length&&G.corners[0].x+40<cut)G.corners=G.corners.filter(c=>c.x+40>=cut);
  G.obs=G.obs.filter(o=>o.x>cut&&o.y<H+40);
  G.items=G.items.filter(i=>i.x>cut);
}
function updateParticles(){for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;if(p.type==='heart')p.vx+=Math.sin(p.life*0.2)*0.03;else p.vy+=0.04;p.life--}G.parts=G.parts.filter(p=>p.life>0)}

// ============ render ============
function render(){
  const g=G;
  ctx.save();
  let shx=0,shy=0;if(g.shake>0){shx=(rng()*2-1)*Math.min(3,g.shake*0.4)|0;shy=(rng()*2-1)*Math.min(3,g.shake*0.4)|0}
  ctx.translate(shx,shy);
  const cam=Math.floor(g.camX);
  ctx.drawImage(SKY,0,0);
  // clouds
  {const off=Math.floor((cam*0.06+g.cloudOff)%360);ctx.drawImage(CLOUDS,-off,10);ctx.drawImage(CLOUDS,360-off,10)}
  {const off=((Math.floor(cam*0.22))%360+360)%360;ctx.drawImage(FAR,-off,0);ctx.drawImage(FAR,360-off,0)}
  {const off=((Math.floor(cam*0.55))%480+480)%480;ctx.drawImage(MID,-off,0);if(480-off<W)ctx.drawImage(MID,480-off,0)}
  // school building (near background)
  drawSchool(cam);
  drawWall(cam);
  for(const c of g.corners){const sx=c.x-cam;if(sx>-50&&sx<W+10)drawCorner(c,sx)}
  // road
  {const off=((cam%240)+240)%240;ctx.drawImage(ROAD,-off,GROUND);ctx.drawImage(ROAD,240-off,GROUND)}
  drawSchoolGround(cam);
  // throwers (in alley)
  for(const o of g.obs)if(o.type==='thrower')drawBoy(o.x-cam+4,o.y,0,o.hc,o.throwAnim>0?'throw2':(o.thrown<3?'throw':'walk'));
  drawGate(cam);
  // items
  for(const it of g.items){if(it.got)continue;const sx=it.x-cam;const by=Math.round(Math.sin(it.t*0.12)*1.5);
    R(sx-4,GROUND+1,9,2,'#00000025');
    if(it.type==='toast'){drawToastIcon(Math.round(sx-4),it.y-4+by,true);if((g.t>>3)&1)R(sx+3,it.y-5+by,1,1,'#ffffff')}else drawMilk(sx-3,it.y-6+by)}
  // obstacles
  for(const o of g.obs){
    const sx=o.x-cam;
    if(o.type==='walker'){R(sx-6,GROUND,12,2,'#00000030');drawBoy(sx,o.y,Math.floor(o.f),o.hc,o.state==='dazed'?'dazed':(o.emerge>0||(o.x-g.gx<34&&o.x>g.gx)?'surprised':'walk'))}
    else if(o.type==='bike'){R(sx-12,GROUND,24,2,'#00000030');drawBike(sx,o.y,o.rot,o.hc,o.state==='dazed'||(o.x-g.gx<44&&o.x>g.gx)?'surprised':'ride')}
    else if(o.type==='book')drawBook(sx,o.y,o.col,o.rot);
    if(o.emerge>0&&o.type!=='book'){for(let i=0;i<3;i++)R(sx-8+i*6,o.y-30-(10-o.emerge),2,2,'#ffffff')}
  }
  // stars over dazed
  for(const o of g.obs)if(o.state==='dazed'){const sx=o.x-cam;for(let i=0;i<3;i++){const a=g.t*0.12+i*2.1;drawHeart(sx-3+Math.cos(a)*8,o.y-30+Math.sin(a)*2,'#ff9ec0')}}
  // teacher
  if(TEACHER_X-cam<W+40&&TEACHER_X-cam>-60){let tx=TEACHER_X-cam;if(g.teacherMode==='grab')tx-=Math.min(8,g.endT);R(tx-16,GROUND,32,3,'#00000030');drawTeacher(tx,GROUND,g.teacherMode==='up'||g.mode==='clear'?'up':g.teacherMode==='grab'?'grab':'idle',g.t)}
  // girl
  drawGirlNow(cam);
  // particles
  for(const p of g.parts){const sx=p.x-cam;if(p.type==='heart')drawHeart(sx,p.y,p.col);else if(p.type==='line')R(sx,p.y,6,1,p.col);else{ctx.globalAlpha=clamp(p.life/p.max,0,1);R(sx,p.y,2,2,p.col);ctx.globalAlpha=1}}
  // warnings
  for(const c of g.corners){if(!c.kind||c.spawned||c.warnT<=0)continue;const sx=c.x-cam+19;if(sx>W+4)continue;drawWarn(sx,206,c)}
  // finale ring
  if(g.mode==='finale'){const d=TEACHER_X-g.gx;const k=clamp((d-12)/72,0,1);const r=Math.round(6+k*24);ringPx(GIRL_SX,g.gy-14,r,d<=40?'#7ff0ff':'#ffffff');ringPx(GIRL_SX,g.gy-14,6,'#ffd36b')}
  ctx.restore();
  // doki overlay
  if(g.mode==='doki'){const a=Math.min(0.35,g.doki.t/40);ctx.fillStyle=`rgba(255,120,170,${a})`;ctx.fillRect(0,0,W,H);
    // sparkle frame
    for(let i=0;i<10;i++){const a2=g.t*0.05+i*0.628;drawHeart(W/2+Math.cos(a2)*70-3,150+Math.sin(a2)*50,i%2?'#ffffff':'#ff9ec0')}}
  if(g.mode==='late'){ctx.fillStyle=`rgba(20,16,40,${Math.min(0.5,g.endT/120)})`;ctx.fillRect(0,0,W,H)}
  if(g.boostT>0&&g.mode==='play'){ctx.fillStyle='#ffffff18';ctx.fillRect(0,0,W,H)}
  // canvas HUD
  if(g.mode!=='title'&&g.mode!=='result')drawHudCanvas();
}
function ringPx(cx,cy,r,col){ctx.fillStyle=col;const n=Math.max(16,r*5);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)}}
function drawGirlNow(cam){
  const g=G;const sx=g.gx-cam,sy=g.gy;
  if(g.mode!=='leap'&&g.mode!=='title'){R(sx-6,GROUND,12,2,'#00000030')}
  if(g.inv>0&&g.mode==='play'&&g.boostT<=0&&((g.t>>2)&1))return;
  let pose='run';
  if(g.mode==='doki')pose='doki';
  else if(g.mode==='clear')pose=g.clearT>20?'win':'stand';
  else if(g.mode==='caught'||g.mode==='late')pose='stand';
  else if(!g.onGround)pose=g.vy<0||g.mode==='leap'&&g.leap.t<g.leap.L/2?'jump':'fall';
  else if(g.slideT>0)pose='slide';
  if(g.boostT>0&&pose!=='slide'){ctx.globalAlpha=0.35;drawGirl(sx-5,sy,pose,g.runF,g.lives);drawGirl(sx-10,sy,pose,(g.runF+1)&3,g.lives);ctx.globalAlpha=1}
  drawGirl(sx,sy,pose,g.runF,g.lives,g.mode==='doki');
  if(g.mode==='late'&&((g.t>>4)&1))R(sx+8,sy-28,2,3,'#7fc8ff');
}
function drawWarn(sx,sy,c){
  const bl=(c.warnT>>3)&1;const jump=c.kind!=='books';
  const col=jump?'#ffcf3a':'#46c3ff';
  sx=Math.round(sx);
  R(sx-6,sy-10,13,14,'#1b1626');R(sx-5,sy-11,11,16,'#1b1626');R(sx-5,sy-9,11,12,bl?col:'#ffffff');R(sx-4,sy-10,9,14,bl?col:'#ffffff');
  R(sx-1,sy-8,3,6,'#1b1626');R(sx-1,sy-1,3,2,'#1b1626');
  R(sx-1,sy+5,3,3,'#1b1626');
  // arrow hint
  const ay=sy+9;
  if(jump){R(sx,ay,1,1,col);R(sx-1,ay+1,3,1,col);R(sx-2,ay+2,5,1,col);R(sx-1,ay+3,3,3,col)}
  else{R(sx-1,ay,3,3,col);R(sx-2,ay+3,5,1,col);R(sx-1,ay+4,3,1,col);R(sx,ay+5,1,1,col)}
  if(c.hint){const txt=jump?'JUMP':'SLIDE';drawTinyText(txt,sx-txt.length*2,ay+9,col)}
}
// 3x5 tiny font for hint labels
const FONT={J:'001001001101111',U:'101101101101111',M:'101111111101101',P:'111101111100100',S:'111100111001111',L:'100100100100111',I:'111010010010111',D:'110101101101110',E:'111100110100111'};
function drawTinyText(t,x,y,col){x=Math.round(x);for(let i=0;i<t.length;i++){const f=FONT[t[i]];if(!f)continue;for(let k=0;k<15;k++)if(f[k]==='1'){R(x+i*4+(k%3),y+Math.floor(k/3),1,1,'#1b1626');}
  for(let k=0;k<15;k++)if(f[k]==='1')R(x+i*4+(k%3),y-1+Math.floor(k/3),1,1,col)}}
function drawWall(cam){
  const end=GOAL-44;const x0=0,x1=Math.min(W,end-cam);if(x1<=x0)return;
  R(x0,236,x1-x0,26,'#bab7ad');R(x0,236,x1-x0,2,'#d6d3ca');R(x0,236,x1-x0,1,'#e6e3db');R(x0,261,x1-x0,1,'#8f8c83');
  ctx.fillStyle='#a19e94';
  for(const y of [244,250,256])ctx.fillRect(x0,y,x1-x0,1);
  for(let row=0;row<4;row++){const off=(row%2)*6;const y=238+row*6;let wx=Math.floor((cam-off)/12)*12+off;
    for(;wx-cam<x1;wx+=12){const sx=wx-cam;if(sx<x0-1)continue;ctx.fillRect(sx,y,1,6);
      const bi=Math.floor(wx/12);
      if(row===1&&hash(bi)%9===0){R(sx+2,y+1,8,4,'#7d7a72');R(sx+4,y+2,4,2,'#bab7ad');R(sx+5,y+1,2,4,'#bab7ad')}
      if(row===3&&hash(bi*7)%5===0){R(sx+3,y+3,4,2,'#9fae8a')}
      ctx.fillStyle='#a19e94'}}
  // hedges on top of wall
  let hx=Math.floor(cam/48)*48;for(;hx-cam<x1;hx+=48){if(hash(Math.floor(hx/48)+999)%3!==0)continue;const sx=hx-cam;
    for(let i=0;i<5;i++){const bx=sx+i*9;if(bx-cam<-20)continue;disc(ctx,bx+4,232,5,'#4c8a3c')}
    R(sx,232,44,4,'#4c8a3c');for(let i=0;i<6;i++)R(sx+3+i*7,229+(i%2),2,1,'#7cbc5c')}
}
function drawCorner(c,sx){
  sx=Math.round(sx);const w=c.w;

  R(sx+8,229,w-16,10,'#a8a297');R(sx+8,229,w-16,2,'#c4bdb0');

  R(sx+6,257,w-12,1,'#e8e8e0');
  R(sx-2,234,3,28,'#a5a298');R(sx-2,234,3,1,'#dcd9d0');R(sx+w-1,234,3,28,'#a5a298');R(sx+w-1,234,3,1,'#dcd9d0');
  // stop sign
  R(sx+3,224,1,38,'#9a9a92');R(sx,218,7,1,'#d23a3a');R(sx+1,219,5,1,'#d23a3a');R(sx+2,220,3,1,'#d23a3a');R(sx+3,221,1,1,'#d23a3a');R(sx+1,218,5,1,'#e95a5a');
  // curve mirror
  const mx=sx+w-6;R(mx,206,2,56,'#e8742a');R(mx+1,206,1,56,'#c25a1a');
  disc(ctx,mx+1,201,5,'#e8742a');disc(ctx,mx+1,201,4,'#c8e3f2');R(mx-1,199,2,2,'#ffffff');R(mx+2,203,2,1,'#8fb6cc');
}
function drawSchool(cam){
  const bx=GOAL-30-cam;if(bx>W||bx<-300)return;const x=Math.round(bx);

  R(x,150,270,90,'#ece6d8');R(x,150,270,3,'#c9c1ae');R(x,238,270,2,'#c9c1ae');
  for(let row=0;row<3;row++)for(let i=0;i<16;i++){const wx=x+8+i*16,wy=160+row*24;R(wx,wy,11,13,'#6e8aa3');R(wx+1,wy+1,9,11,'#a7cbe3');R(wx+1,wy+1,9,2,'#d8ecf7');R(wx+5,wy+1,1,11,'#6e8aa3')}

  R(x+96,128,40,24,'#ece6d8');R(x+96,128,40,2,'#c9c1ae');disc(ctx,x+116,140,9,'#5a5040');disc(ctx,x+116,140,8,'#ffffff');
  const mins=24+G.clock/60;const ma=(mins/60)*Math.PI*2-Math.PI/2;const ha=((8+mins/60)/12)*Math.PI*2-Math.PI/2;
  line(x+116,140,x+116+Math.cos(ma)*7,140+Math.sin(ma)*7,'#1b1626');line(x+116,140,x+116+Math.cos(ha)*4,140+Math.sin(ha)*4,'#d23a3a');

  for(let fx=x+76;fx<x+270;fx+=2){R(fx,222,1,18,'#4a8a6a')}R(x+76,222,194,1,'#3a6a52');R(x+76,230,194,1,'#3a6a52');R(x+76,239,194,1,'#3a6a52');
  // ginkgo trees
  for(const t of [x+40,x+180,x+240]){R(t,214,3,26,'#6b4a32');disc(ctx,t+1,206,10,'#e2b52a');disc(ctx,t-4,210,6,'#d19a1e');R(t-3,200,3,2,'#f6d65a');R(t+4,204,2,2,'#f6d65a')}
}
function drawSchoolGround(cam){const x=GOAL-6-cam;if(x>W)return;const xs=Math.max(0,Math.round(x));R(xs,GROUND,W-xs,58,'#cdb58a');R(xs,GROUND,W-xs,1,'#e0cca4');
  for(let i=0;i<40;i++){const px=GOAL+(hash(i)%300)-cam;if(px>=xs&&px<W)R(px,GROUND+4+(hash(i*3)%50),1,1,'#b39a6e')}
  R(xs,GROUND+20,W-xs,1,'#f2ece0')}
function drawGate(cam){
  const gx=GOAL-cam;if(gx>W+60||gx<-120)return;const x=Math.round(gx);
  // pillars
  for(const px of [x-6,x+60]){R(px,214,8,48,'#cbc4b6');R(px,214,8,3,'#e2dccf');R(px+6,214,2,48,'#a9a293');}
  R(x-5,224,6,14,'#e8e2d2');R(x-4,226,4,10,'#2c3a2c');for(let i=0;i<4;i++)R(x-3,227+i*2,2,1,'#c6b98a');
  // sliding gate
  const open=1-G.gateClose;const gx0=x+2+Math.round(56*open*0.6);
  R(gx0,234,x+60-gx0,2,'#5f6873');R(gx0,256,x+60-gx0,2,'#5f6873');for(let bx=gx0;bx<x+60;bx+=4)R(bx,234,1,24,'#6f7884');
  R(gx0,258,x+60-gx0,2,'#3b414a');
}
function drawHudCanvas(){
  const g=G;
  for(let i=0;i<3;i++)drawToastIcon(144+i*11,6,i<g.lives);
  // progress
  const y=34,x0=96,x1=172;
  R(x0,y,x1-x0,3,'#1b2a5588');R(x0,y,Math.round((x1-x0)*progress()),3,'#ffd36b');
  R(x1+1,y-4,6,7,'#ece6d8');R(x1+1,y-4,6,1,'#c9c1ae');R(x1+3,y-7,1,3,'#d23a3a');R(x1+3,y,2,3,'#6e8aa3');
  const px=Math.round(x0+(x1-x0)*progress());R(px-2,y-3,4,4,C.hair);R(px,y-2,2,2,C.skin);
}

// ============ HUD text ============
let lastHud='';
function updateHud(){
  const g=G;if(g.mode==='title'||g.mode==='result')return;
  const total=24*60+g.clock;const m=Math.floor(total/60),s=Math.floor(total%60);
  const colon=':';
  const txt='8'+colon+String(m).padStart(2,'0');
  if(clockEl.textContent!==txt)clockEl.textContent=txt;
  clockEl.classList.toggle('warn',DEADLINE-g.clock<60&&g.mode!=='clear'&&g.mode!=='leap');
  const dm=Math.max(0,Math.ceil((TEACHER_X-g.gx)/6));if(distEl.textContent!==String(dm))distEl.textContent=dm;
  const sc='SCORE '+g.score.toLocaleString();if(scoreEl.textContent!==sc)scoreEl.textContent=sc;
  const on=g.combo>=2&&(g.mode==='play'||g.mode==='finale');
  comboEl.classList.toggle('on',on);if(on){const h='出会いキャンセル <b>×'+g.combo+'</b>';if(lastHud!==h){comboEl.innerHTML=h;lastHud=h}}
}

// ============ loop / resize / pause ============
function fit(){
  const r=$('app').getBoundingClientRect();
  const cs=getComputedStyle($('app'));const pw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const ph=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let s=Math.min(pw/W,ph/H);if(s>=3)s=Math.floor(s);else if(s>=2)s=Math.floor(s*2)/2;
  scale=Math.max(1,s);stage.style.setProperty('--s',scale);
}
window.addEventListener('resize',fit);fit();
let paused=false;
function resume(){paused=false;$('paused').hidden=true;last=performance.now();acc=0;if(AC&&AC.state==='suspended')AC.resume();if(G.mode==='play')startBGM()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.mode==='play'||G.mode==='finale'||G.mode==='doki')){paused=true;$('paused').hidden=false;stopBGM()}});
$('paused').addEventListener('pointerdown',e=>{e.stopPropagation();resume()});
$('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame()});

buildLayers();
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-last;last=now;if(dt>100)dt=100;
  if(!paused){acc+=dt;let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++}if(n>=5)acc=0}
  render();updateHud();
}
requestAnimationFrame(frame);
window.__G=()=>G;
})();
