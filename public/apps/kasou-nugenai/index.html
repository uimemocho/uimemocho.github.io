<script>
'use strict';
/* =========================================================
   仮装が脱げない。 — TRICK OR STREAM
   Single-file pixel horror RPG. All audio is procedural WebAudio.
   ========================================================= */
const VW=256,VH=192,TS=16;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return c;}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+a,0,255),g=clamp(((n>>8)&255)+a,0,255),b=clamp((n&255)+a,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
class Abort extends Error{}

/* ---------- pixel helpers ---------- */
const F35={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000','L':'100100100100111','I':'111010010010111','V':'101101101101010','E':'111100110100111','A':'010101111101101','K':'101110100110101','M':'101111111101101','N':'110101101101101','O':'111101101101111','F':'111100110100100','R':'110101110101101','C':'111100100100111'};
function t35(c,s,x,y,col,sc=1){c.fillStyle=col;for(const ch of String(s)){const g=F35[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1')c.fillRect(x+(i%3)*sc,y+((i/3)|0)*sc,sc,sc);x+=4*sc;}}
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));c.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}}
function oval(c,cx,cy,rx,ry,col){c.fillStyle=col;for(let dy=-ry;dy<=ry;dy++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));c.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}}
function ring(c,cx,cy,r,th,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const wo=Math.floor(Math.sqrt(r*r-dy*dy));const ri2=r-th;if(Math.abs(dy)>=ri2){c.fillRect(Math.round(cx-wo),Math.round(cy+dy),wo*2+1,1);}else{const wi=Math.floor(Math.sqrt(ri2*ri2-dy*dy));c.fillRect(Math.round(cx-wo),Math.round(cy+dy),wo-wi,1);c.fillRect(Math.round(cx+wi+1),Math.round(cy+dy),wo-wi,1);}}}
function pline(c,x0,y0,x1,y1,col,w=1){c.fillStyle=col;x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;for(;;){c.fillRect(x0,y0,w,w);if(x0===x1&&y0===y1||n++>600)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fill();}

/* =========================================================
   AUDIO — procedural BGM sequencer + SFX
   ========================================================= */
const n2f=m=>440*Math.pow(2,(m-69)/12);
const AU={ctx:null,trk:null,want:null,heart:0,heartNext:0,bgmV:.75,sfxV:.9};
AU.init=function(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let c;try{c=this.ctx=new C();}catch(e){return;}
  this.comp=c.createDynamicsCompressor();this.comp.threshold.value=-15;this.comp.knee.value=12;this.comp.ratio.value=4;this.comp.attack.value=.004;this.comp.release.value=.25;
  this.master=c.createGain();this.master.gain.value=.92;this.master.connect(this.comp);this.comp.connect(c.destination);
  this.bgm=c.createGain();this.bgm.gain.value=this.bgmV;this.bgm.connect(this.master);
  this.sfx=c.createGain();this.sfx.gain.value=this.sfxV;this.sfx.connect(this.master);
  this.rev=c.createConvolver();this.rev.buffer=this.impulse(3.6,2.4);this.revOut=c.createGain();this.revOut.gain.value=.5;this.rev.connect(this.revOut);this.revOut.connect(this.master);
  const len=c.sampleRate*2;const wb=c.createBuffer(1,len,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<len;i++)wd[i]=Math.random()*2-1;this.white=wb;
  const bb=c.createBuffer(1,len,c.sampleRate),bd=bb.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;bd[i]=l*3.5;}this.brown=bb;
  const n=1024;this.crush=new Float32Array(n);this.dist=new Float32Array(n);for(let i=0;i<n;i++){const x=i/n*2-1;this.crush[i]=Math.round(x*6)/6;this.dist[i]=(3+30)*x*20*Math.PI/180/(Math.PI+30*Math.abs(x));}
  setInterval(()=>this.tick(),25);
  if(this.want){const w=this.want;this.want=null;this.playBGM(w,1.5);}
};
AU.impulse=function(sec,dec){const c=this.ctx,r=c.sampleRate,l=Math.floor(r*sec),b=c.createBuffer(2,l,r);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,dec);}return b;};
AU.tone=function(o){const c=this.ctx;if(!c)return;const t=Math.max(o.t??c.currentTime,c.currentTime);const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(Math.max(1,o.f),t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.glide??o.dur??.2));if(o.det)os.detune.value=o.det;const g=c.createGain();const v=o.v??.2,a=o.a??.003,dur=Math.max(o.dur??.2,a+.01);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.sus){g.gain.setValueAtTime(v,t+Math.max(a,dur-(o.r??.05)));g.gain.linearRampToValueAtTime(.0001,t+dur);}else g.gain.exponentialRampToValueAtTime(.0001,t+dur);let n=os;if(o.shaper){const w=c.createWaveShaper();w.curve=o.shaper;n.connect(w);n=w;}if(o.ft){const f=c.createBiquadFilter();f.type=o.ft;f.frequency.setValueAtTime(o.ff||1000,t);if(o.ff2)f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur);f.Q.value=o.q??1;n.connect(f);n=f;}n.connect(g);let out=g;if(o.pan!=null&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=o.pan;g.connect(p);out=p;}out.connect(o.dest||this.sfx);if(o.rev){const r=c.createGain();r.gain.value=o.rev;out.connect(r);r.connect(this.rev);}os.start(t);os.stop(t+dur+.05);return os;};
AU.noise=function(o){const c=this.ctx;if(!c)return;const t=Math.max(o.t??c.currentTime,c.currentTime);const s=c.createBufferSource();s.buffer=o.brown?this.brown:this.white;s.loop=true;let n=s;if(o.ft!==null){const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide??o.dur??.2));f.Q.value=o.q??1;n.connect(f);n=f;}if(o.shaper){const w=c.createWaveShaper();w.curve=o.shaper;n.connect(w);n=w;}const g=c.createGain();const v=o.v??.2,a=o.a??.002,dur=Math.max(o.dur??.2,a+.01);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.sus){g.gain.setValueAtTime(v,t+Math.max(a,dur-(o.r||.05)));g.gain.linearRampToValueAtTime(.0001,t+dur);}else g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(g);let out=g;if(o.pan!=null&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=o.pan;g.connect(p);out=p;}out.connect(o.dest||this.sfx);if(o.rev){const r=c.createGain();r.gain.value=o.rev;out.connect(r);r.connect(this.rev);}s.start(t,Math.random()*1.5);s.stop(t+dur+.05);};
AU.osc=function(type,f,det=0){const o=this.ctx.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;return o;};
AU.lfo=function(param,rate,depth){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g);g.connect(param);o.start();return o;};
AU.send=function(node,amt){const g=this.ctx.createGain();g.gain.value=amt;node.connect(g);g.connect(this.rev);};
AU.bed=function(o,st,{brown=false,ft='bandpass',f=600,q=1,v=.03}={}){const c=this.ctx,s=c.createBufferSource();s.buffer=brown?this.brown:this.white;s.loop=true;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(o);s.start(0,Math.random());st.nodes.push(s);return{src:s,fl,g};};
AU.drone=function(o,st,m,type,v,cut,det=0){const c=this.ctx,os=this.osc(type,n2f(m),det),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;const g=c.createGain();g.gain.value=v;os.connect(f);f.connect(g);g.connect(o);this.send(g,.5);os.start();st.nodes.push(os);return{os,f,g};};
AU.playBGM=function(name,fade=1.2){if(!this.ctx){this.want=name;return;}if(this.trk&&this.trk.name===name)return;this.stopBGM(fade);const def=TR[name];if(!def)return;const c=this.ctx,out=c.createGain();out.gain.setValueAtTime(.0001,c.currentTime);out.gain.linearRampToValueAtTime(1,c.currentTime+Math.max(.05,fade));out.connect(this.bgm);const st={nodes:[]};try{def.init&&def.init(out,st);}catch(e){console.warn(e);}this.trk={name,def,out,st,s:0,next:c.currentTime+.08,spb:60/def.bpm/4};};
AU.stopBGM=function(fade=1){const T=this.trk;if(!T){this.want=null;return;}this.trk=null;const c=this.ctx,now=c.currentTime;T.out.gain.cancelScheduledValues(now);T.out.gain.setValueAtTime(Math.max(.0001,T.out.gain.value),now);T.out.gain.linearRampToValueAtTime(.0001,now+Math.max(.02,fade));setTimeout(()=>{T.st.nodes.forEach(n=>{try{n.stop();}catch(e){}});try{T.out.disconnect();}catch(e){}},fade*1000+300);};
AU.tick=function(){const c=this.ctx;if(!c)return;const T=this.trk;if(T){if(T.next<c.currentTime-.25)T.next=c.currentTime+.05;let guard=0;while(T.next<c.currentTime+.15&&guard++<16){try{T.def.step(T.s,T.next,T.out,T.st);}catch(e){}T.next+=T.spb;T.s++;}}
  if(this.heart>0){if(this.heartNext<c.currentTime-.25)this.heartNext=c.currentTime+.05;while(this.heartNext<c.currentTime+.15){const t=this.heartNext,v=.12+.28*this.heart;this.tone({t,f:66,f2:38,dur:.18,v});this.tone({t:t+.23,f:58,f2:36,dur:.16,v:v*.65});this.heartNext+=60/(62+this.heart*72);}}};
AU.setVol=function(k,v){this[k+'V']=v;if(this.ctx)this[k].gain.setTargetAtTime(v,this.ctx.currentTime,.05);};
/* instruments */
AU.mbox=function(m,t,o,dd=0){const det=(Math.random()-.5)*18+(Math.random()<.5?-dd:dd),f=n2f(m);this.tone({t,f,det,dur:1.9,v:.075,dest:o,rev:.55});this.tone({t,f:f*2.004,det,dur:.7,v:.024,dest:o,rev:.4});this.tone({t,type:'triangle',f:f*3.01,det,dur:.1,v:.012,dest:o});};
AU.bell=function(m,t,o,v=.08,dur=3.5){const f=n2f(m);[[1,1],[2.76,.45],[5.4,.22],[8.93,.1]].forEach(([p,a])=>this.tone({t,f:f*p,dur:dur/(p*.5+.5),v:v*a,dest:o,rev:.6}));};
AU.swell=function(t,o,dur,v=.05){this.noise({t,f:350,f2:3600,glide:dur,q:3,a:dur*.92,dur,v,dest:o,rev:.5});};
AU.kick=function(t,o,v=.6){this.tone({t,f:155,f2:42,glide:.12,dur:.22,v,dest:o});this.noise({t,ft:'highpass',f:3000,dur:.012,v:v*.18,dest:o});};
AU.snare=function(t,o,v=.22){this.noise({t,f:2100,q:.7,dur:.13,v,dest:o,rev:.12});this.tone({t,type:'triangle',f:210,f2:150,dur:.08,v:v*.7,dest:o});};
AU.hat=function(t,o,v=.03,d=.025){this.noise({t,ft:'highpass',f:7600,dur:d,v,dest:o});};
AU.bass=function(m,t,o,dur=.11,v=.15,cut=800){this.tone({t,type:'sawtooth',f:n2f(m),dur,v,dest:o,shaper:this.dist,ft:'lowpass',ff:cut,q:3,sus:true,r:.03});this.tone({t,f:n2f(m),dur,v:v*.7,dest:o,sus:true,r:.03});};
AU.pad=function(notes,t,dur,o,v=.016,cut=900){const c=this.ctx;notes.forEach(m=>{[-9,9].forEach(d=>{const os=this.osc('sawtooth',n2f(m),d),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*.35);g.gain.setValueAtTime(v,t+dur*.65);g.gain.linearRampToValueAtTime(.0001,t+dur*1.05);os.connect(f);f.connect(g);g.connect(o);this.send(g,.55);os.start(t);os.stop(t+dur*1.1);});});};
AU.choir=function(notes,t,dur,o,v=.022){const c=this.ctx;notes.forEach(m=>{[-11,0,11].forEach(d=>{const os=this.osc('sawtooth',n2f(m),d),g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+dur*.25);g.gain.setValueAtTime(v,t+dur*.7);g.gain.linearRampToValueAtTime(.0001,t+dur);[[700,8],[1150,9]].forEach(([fr,q])=>{const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;f.Q.value=q;os.connect(f);f.connect(g);});g.connect(o);this.send(g,.6);os.start(t);os.stop(t+dur+.05);});});};
AU.piano=function(m,t,o,v=.07,dur=2.6){const f=n2f(m);this.tone({t,f,dur,v,dest:o,rev:.55});this.tone({t,f:f*2,dur:dur*.6,v:v*.35,dest:o,rev:.4});this.tone({t,f:f*3,dur:dur*.3,v:v*.12,dest:o});this.noise({t,ft:'highpass',f:4000,dur:.015,v:v*.25,dest:o});};
AU.cuckoo=function(t,o,pitch=1,slow=1,rev=.25,v=.07){[1318.5,1046.5].forEach((f,i)=>{const tt=t+i*.32*slow;this.tone({t:tt,f:f*pitch,f2:pitch<1?f*pitch*.97:undefined,glide:.2*slow,dur:.2*slow,v,dest:o,rev,sus:true,r:.04});this.tone({t:tt,type:'square',f:f*pitch,dur:.2*slow,v:v*.12,dest:o,ft:'bandpass',ff:1600,q:1,sus:true,r:.04});});};
AU.chirp=function(t,o,v=.03){const n=ri(2,4);for(let i=0;i<n;i++)this.tone({t:t+i*.07,f:rnd(2800,3400),f2:rnd(3800,4600),glide:.04,dur:.05,v,dest:o,pan:rnd(-.7,.7),rev:.3});};
AU.crow=function(t,o){for(let i=0;i<2;i++)this.tone({t:t+i*.45,type:'sawtooth',f:560,f2:380,glide:.3,dur:.34,v:.035,dest:o,ft:'bandpass',ff:950,q:3,rev:.5,pan:.5});};

/* ---------- BGM tracks ---------- */
const TITLE_MEL=[81,0,84,0,88,0,87,0,88,0,0,0,83,0,0,0, 79,0,81,0,83,0,84,0,83,0,80,0,76,0,0,0, 81,0,84,0,88,0,91,0,89,0,88,0,86,0,0,0, 84,0,83,0,80,0,81,0,0,0,76,0,81,0,0,0];

  if(G.mapId==='station'){if(!f.faceOK)return long?`改札を通る方法を探す。昔のプリを3枚集める（いま ${prints()}/3：ロッカー・掲示板・トイレの鏡）か、左の大型広告のAIに相談する。`:`改札を通る方法を探す（プリ ${prints()}/3）`;return'改札を抜けて、奥の出口A0から地上へ';}
  if(G.mapId==='alley'){if(!f.enjouDone)return f.momo?'北の雑居ビルの前にいる「炎上」をしずめる':'雑居ビルの扉を開ける方法を探す（路地の西に生存者）';return'雑居ビルの扉から中へ';}
  if(G.mapId==='bldg'){if(!f.kiriDone)return keys()<3?(long?`編集キーを探す（${keys()}/3）。壁のモニターのサムネイルも調べられる。`:`編集キーを探す（${keys()}/3）`):'奥のエレベーターへ';return'エレベーターで上へ';}
  if(G.mapId==='archive'){if(!f.algoDone)return long?'光る足場をたどって出口をめざす。台座の記録で、ミオの記憶を取り戻せる。':'光る足場をたどって出口をめざす';return'非常階段から屋上へ';}
  if(G.mapId==='roof'&&!f.bossDone)return long?'フェンスのそばのミオに近づく。Lv13以上推奨。きびしければ非常扉から前のエリアへ戻ってレベル上げ。':'フェンスのそばのミオに近づく（Lv13以上推奨）';return null;}
function objTarget(){const f=G.flags;if(!f.prologue||G.dawn)return null;
  if(G.mapId==='cross')return f.phone?[15,18]:[22,14];
  if(G.mapId==='station'){if(f.faceOK)return[13,2];const c=[];if(!f.p1)c.push([25,10]);if(!f.p2)c.push([9,17]);if(!f.p3)c.push([1,13]);if(!f.metAI)c.push([4,8]);if(!c.length)return[4,8];const p=G.p;c.sort((a,b)=>Math.hypot(a[0]-p.x,a[1]-p.y)-Math.hypot(b[0]-p.x,b[1]-p.y));return c[0];}
  if(G.mapId==='alley'){if(!f.enjouDone)return f.momo?[12,3]:[4,10];return[12,2];}
  if(G.mapId==='bldg'){if(f.kiriDone||keys()>=3)return[19,2];const p=G.p,c=[[2,6,'key1'],[13,9,'key2'],[19,13,'key3']].filter(k=>!f[k[2]]);c.sort((a,b)=>Math.hypot(a[0]-p.x,a[1]-p.y)-Math.hypot(b[0]-p.x,b[1]-p.y));return c[0];}
  if(G.mapId==='archive'){const p=G.p;f.wp=f.wp||0;while(f.wp<ARC_WP.length-1&&Math.hypot(ARC_WP[f.wp][0]-p.x,ARC_WP[f.wp][1]-p.y)<1.6)f.wp++;return ARC_WP[f.wp];}
  if(G.mapId==='roof'&&!f.bossDone)return[9,5];return null;}
let objLast='',objTimer=null;
function showObj(force){const t=objective();if(!t){$('obj').hidden=true;objLast='';return;}if(t===objLast&&!force)return;objLast=t;const O=$('obj');$('objT').textContent=t;O.hidden=false;O.classList.remove('fade');O.style.animation='none';void O.offsetWidth;O.style.animation='';
  clearTimeout(objTimer);objTimer=setTimeout(()=>{O.classList.add('fade');setTimeout(()=>{if(O.classList.contains('fade'))O.hidden=true;},650);},5200);}
function drawGuide(sx,sy){const t=objTarget();if(!t||G.mode!=='field'||G.busy||UI.active)return;const p=G.p;const dx=t[0]-p.x,dy=t[1]-p.y,d=Math.hypot(dx,dy);if(d<2.5)return;
  const a=Math.atan2(dy,dx),cx=p.fx+8-sx+Math.cos(a)*(17+Math.sin(G.t*.12)*2),cy=p.fy+8-sy+Math.sin(a)*(17+Math.sin(G.t*.12)*2);
  ctx.save();ctx.translate(Math.round(cx),Math.round(cy));ctx.rotate(a);ctx.globalAlpha=.55+.35*Math.sin(G.t*.12);ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-4,-5);ctx.lineTo(-2,0);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff9a3a';ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(-3,-4);ctx.lineTo(-1,0);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();ctx.restore();}
function showGuide(){const o=objective(true)||'いまは物語を進めよう。';const tips=['<li>強くて勝てないときは、階段や扉から前のエリアへ戻ってレベル上げ。ラスボスはLv13以上推奨。</li>','<li>取り戻した記憶が多いほど「すっぴん」と「よびかける」が強くなる。</li>','<li>敵を倒すと「いいね」が手に入る。コンビニや自販機で買い物に使える。</li>','<li>硬い敵には「撮影」、危ないときは「フラッシュ」で足止め。</li>','<li>「晒す」は強いが侵食+8。侵食60%未満で最後に「電源を切る」とベストエンド。</li>','<li>ボスはHP半分で「よびかける」が解禁。プリ3枚で大ダメージ。</li>'];
  return infoPanel(`<div class="lt">いまの目的</div><div class="now">${esc(o)}</div><ul class="tip">${tips.join('')}</ul><div class="ft">A / B で とじる</div>`);}

const DX={up:0,down:0,left:-1,right:1},DY={up:-1,down:1,left:0,right:0};
function setMap(id,x,y,dir){G.mapId=id;G.map=MAPS[id];const p=G.p;p.x=x;p.y=y;p.fx=x*TS;p.fy=y*TS;p.dir=dir||'down';p.moving=false;if(G.map.setup)G.map.setup();}
function blocked(x,y){const m=G.map;if(x<0||y<0||x>=m.w||y>=m.h)return true;const ch=m.g[y][x];if(ch==='g'&&G.flags.faceOK)return false;if(SOLID.has(ch))return true;return m.objs.some(o=>!o.hidden&&o.solid&&o.x===x&&o.y===y);}
function heldDir(){if(IN.last&&IN.held[IN.last])return IN.last;return DIRS.find(k=>IN.held[k])||null;}
function canControl(){return G.mode==='field'&&!G.busy&&!UI.active&&!G.dawn;}
function updatePlayer(dt){const p=G.p;
  if(p.moving){const sp=(IN.held.b?2.7:1.4)*dt;const tx=p.tx*TS,ty=p.ty*TS;const dx=tx-p.fx,dy=ty-p.fy,d=Math.hypot(dx,dy);p.anim+=dt*(IN.held.b?1.8:1);
    if(d<=sp){p.fx=tx;p.fy=ty;p.x=p.tx;p.y=p.ty;p.moving=false;onArrive();}else{p.fx+=dx/d*sp;p.fy+=dy/d*sp;}}
  if(!p.moving&&canControl()){const d=heldDir();if(d){p.dir=d;const nx=p.x+DX[d],ny=p.y+DY[d];if(!blocked(nx,ny)){p.moving=true;p.tx=nx;p.ty=ny;}}}}
function onArrive(){const p=G.p,m=G.map;p.steps++;SFX.step(m.surf);
  if(p.steps%6===0&&G.st.bat>0){G.st.bat--;updHUD();if(G.st.bat===20&&!G.flags.low20){G.flags.low20=1;notify('バッテリー残量が少なくなっています（20%）',false,'システム');}if(G.st.bat===0)runScript(async()=>{await msg('ライトが消えた。……充電スポットを探さないと。');});}
  const key=p.x+','+p.y;if(m.steps&&m.steps[key]){runScript(m.steps[key]);return;}
  if(m.id==='roof'&&!G.flags.bossDone&&p.y<=7){runScript(bossIntro);return;}
  if(m.id==='alley'&&!G.flags.enjouDone&&p.y<=3){runScript(enjouIntro);return;}
  if(m.id==='archive'&&!G.flags.algoDone&&p.y<=4&&p.x>=15){runScript(algoIntro);return;}
  if(m.enc&&G.flags.prologue&&m.encT.includes(m.g[p.y][p.x])&&!G.flags.noEnc){G.enc--;if(G.enc<=0){G.enc=ri(18,32);runScript(()=>battle(pick(m.enc)));}}}
function fieldKey(k){if(k==='menu'){runScript(fieldMenu);return;}
  if(k==='a'){const p=G.p,m=G.map,fx=p.x+DX[p.dir],fy=p.y+DY[p.dir];const o=m.objs.find(o=>!o.hidden&&o.x===fx&&o.y===fy);
    if(o){runScript(()=>talkObj(o));return;}const ev=m.events&&m.events[fx+','+fy];if(ev){runScript(ev);return;}
    const ch=tileAt(m,fx,fy);const T=TILE_TEXT[ch];if(T){runScript(async()=>{await msg(typeof T==='function'?T():T);});}}}
const TILE_TEXT={'H':'シャッターに、スプレーの落書き。「顔をかえせ」','J':'電柱の貼り紙。','L':'街灯。羽虫のかわりに、赤い通知バッジが群がっている。','P':'歩行者信号。0時からずっと、赤のまま点滅している。','N':'ネオン看板。「KAMEN」の文字が、まばたきするように点滅している。','E':()=>G.map.id==='roof'?'大型ビジョン。ミオの配信が映っている。コメントが滝のように流れていく。':'大型ビジョンに、ミオの配信が映っている。……背景はどこかの屋上だ。','X':'ハロウィンのゴミ袋。カボチャの被り物が、こちらを見ている気がする。','S':'地下鉄の入口。青い看板の下から、階段が地下へ続いている。','k':'柱の広告。「あなたの顔、最適化しませんか？」','b':'ベンチ。誰かのスマホが置いてある。画面はまだ温かい。','h':'室外機。ファンの音にまじって、通知音が聞こえる。','f':'フェンスの向こうに、止まったままの街が見える。','l':'コインロッカー。中から、かすかにシャッター音がする。','r':'トイレ。','g':'自動改札機。'};
function runScript(fn){if(G.busy)return;G.busy=true;Promise.resolve().then(fn).catch(e=>{if(!(e instanceof Abort))console.error(e);}).finally(()=>{G.busy=false;if(fn!==fieldMenu)autoSave();});}
async function talkObj(o){
  if(o.kind==='npc'){if(!G.flags.zero){await msg(pick(['（はしゃいでいる）','（スマホで自撮りしている）','ハッピーハロウィーン！']),{who:'npc',name:'通行人'});return;}
    o.dir=({up:'down',down:'up',left:'right',right:'left'})[G.p.dir];if(Math.random()<.25)SFX.whisper();await msg(o.line,{who:'npc',name:'仮装の人',style:'scary'});
    if(Math.random()<.3)cmt(pick(CM.cross));return;}
  if(o.kind==='vol'){await msg(pick(['おはよう。昨日はすごかったねえ','ゴミ、分別おねがいしまーす','君たち、徹夜？　気をつけて帰りなよ']),{who:'npc',name:'ボランティア'});return;}
  if(o.kind==='item'&&o.id==='mphone'){await evPhone(o);return;}
  if(o.kind==='item'&&o.id.startsWith('key')){await evKey(o);return;}
  if(o.kind==='momo'){await evMomo(o);return;}
  if(o.kind==='mio')await msg('……',{who:'mio'});
}

async function itemMenu(inB){const ids=Object.keys(ITEMS).filter(k=>G.items[k]>0);if(!ids.length){await msg('つかえるアイテムがない。',{auto:inB?700:0});return null;}

const OLD_KEY='kasou-nugenai-v1',END_KEY='kasou-nugenai-ends',SLOTS=['auto','1','2','3'];
const slotKey=id=>'kasou-nugenai-'+(id==='auto'?'auto':'s'+id);
const CHAP={cross:['第一章','0時の交差点'],station:['第二章','顔のない改札'],alley:['第三章','さらされた路地'],bldg:['第四章','切り抜き工場'],archive:['第五章','アーカイブの海'],roof:['最終章','百万人の屋上']};
try{if(localStorage.getItem(OLD_KEY)&&!localStorage.getItem(slotKey('auto')))localStorage.setItem(slotKey('auto'),localStorage.getItem(OLD_KEY));localStorage.removeItem(OLD_KEY);}catch(e){}
function saveData(){return{map:G.mapId,x:G.p.x,y:G.p.y,dir:G.p.dir,st:G.st,items:G.items,likes:G.likes,flags:G.flags,viewers:G.viewers,max:G.maxViewers,pt:G.playT||0,at:Date.now()};}
function saveGame(id='auto'){try{localStorage.setItem(slotKey(id),JSON.stringify(saveData()));return true;}catch(e){return false;}}
function readSlot(id){try{const s=localStorage.getItem(slotKey(id));return s?JSON.parse(s):null;}catch(e){return null;}}
function anySave(){return SLOTS.some(id=>readSlot(id));}
function fmtPT(sec){sec=Math.floor(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,s2=sec%60;return h+':'+String(m).padStart(2,'0')+':'+String(s2).padStart(2,'0');}
function fmtAt(t){if(!t)return'';const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function slotOpt(id,mode){const sv=readSlot(id),nm=id==='auto'?'オート':'スロット'+id;
  if(!sv)return{label:nm+'　─ 空き ─',disabled:mode==='load',desc:mode==='save'?'ここにセーブする':'セーブデータがありません'};
  const c=sv.flags&&sv.flags.atChoice?['最終章','エンディング分岐']:(CHAP[sv.map]||['','']);
  return{label:`${nm}　${c[0]}　${c[1]}`,note:'Lv'+sv.st.lv,desc:`${fmtAt(sv.at)} 保存　プレイ ${fmtPT(sv.pt)}　侵食 ${sv.st.ero}%`};}
async function pickSlot(mode){const ids=mode==='save'?['1','2','3']:SLOTS;
  const i=await listSelect(ids.map(id=>slotOpt(id,mode)),{title:mode==='save'?'セーブ先をえらぶ':'ロードするデータをえらぶ',pos:'center'});return i<0?null:ids[i];}
async function saveFlow(){const id=await pickSlot('save');if(!id)return false;
  if(readSlot(id)){const j=await listSelect([{label:'上書きする'},{label:'やめる'}],{title:'スロット'+id+'に上書きしますか？',pos:'center'});if(j!==0)return false;}
  const ok=saveGame(id);SFX.gateOK();await msg(ok?`スロット${id}にセーブしました。`:'このブラウザでは保存できませんでした。');return ok;}
async function loadFlow(){const id=await pickSlot('load');if(!id)return null;return readSlot(id);}
let lastAuto=-1e9;
function showAutoBadge(){const A=$('as');A.hidden=true;void A.offsetWidth;A.style.animation='none';void A.offsetWidth;A.style.animation='';A.hidden=false;clearTimeout(showAutoBadge.t);showAutoBadge.t=setTimeout(()=>{A.hidden=true;},2200);}
function autoSave(force){const now=performance.now();if(!force&&now-lastAuto<6000)return;if(G.mode!=='field'||G.dawn||!G.flags.prologue||G.flags.bossDone)return;if(!saveGame('auto'))return;lastAuto=now;showAutoBadge();}

function dmgCalc(atk,def,mul=1,ign=false){return Math.max(1,Math.round(atk*rnd(.9,1.1)*mul-(ign?0:def*.5)));}
async function battle(type){
  const D=ENEMIES[type];const E=Object.assign({type,mhp:D.hp,stun:0,phase:1,turn:0,boost:0,heals:0},D);E.hp=E.mhp;
  const P=G.st;P.blind=0;P.block=false;
  SFX.encounter();G.glitch=1.3;G.shake=3;
  for(let i=0;i<=10;i++){G.mosaic=i/10;await wait(40);}
  G.B={E,bg:G.map.bbg,eflash:0,lunge:0,slash:0,shut:0,dead:false,ehit:0,calls:0};G.mode='battle';AU.playBGM(E.boss?'boss':(E.bgm||'battle'),.15);G.flash=1;G.flashC='#fff';
  for(let i=10;i>=0;i--){G.mosaic=i/10;await wait(30);}G.mosaic=0;
  $('ui').classList.add('inb');$('ebar').hidden=false;$('eName').textContent=E.name;updE();showHUD(true);
  await msg(E.boss?`${E.name}が、配信を開始した！`:`${E.name}が、あらわれた！`,{auto:700});
  if(Math.random()<.5||E.boss)cmtBurst(CM.battle,E.boss?8:3);
  let res=null;
  while(!res){
    const act=await battleCommand(E);
    const r=await playerAct(act,E);
    if(r==='run'){res='run';break;}
    if(E.hp<=0){res='win';break;}
    if(checkEro()){res='ero';break;}
    if(E.boss)await bossPhase(E);
    await enemyAct(E);
    if(P.hp<=0){res='lose';break;}
    if(checkEro()){res='ero';break;}
    if(P.blind>0)P.blind--;
  }
  if(res==='win'){await winBattle(E);}
  else if(res==='lose'||res==='ero'){await gameOver(res);throw new Abort();}
  $('ebar').hidden=true;$('ui').classList.remove('inb');
  if(E.boss)return 'win';
  await fade(1,250);G.mode='field';G.B=null;AU.playBGM(G.map.bgm,.8);await fade(0,350);G.glitch=.3;return res;
}

async function battleCommand(E){
  for(;;){const call=E.boss&&E.phase>=2;
    const i=await listSelect([{label:'たたく',desc:'自撮り棒でたたく'},{label:'スキル',desc:'バッテリーを使って配信スキルを使う'},{label:'アイテム',desc:'持ち物を使う'},call?{label:'よびかける',desc:'ミオに、ことばを届ける'}:{label:'にげる',disabled:!!(E.boss||E.big),desc:(E.boss||E.big)?'にげられない':'その場から走って逃げる'}],{pos:'battle',cols:2,cancel:false,measure:true});
    if(i===0)return{k:'attack'};
    if(i===3)return call?{k:'call'}:{k:'run'};
    if(i===1){const sk=SKILLS.filter(s=>G.st.lv>=s.lv);const j=await listSelect(sk.map(s=>({label:s.name,note:s.cost?('BAT '+s.cost):'侵食+8',disabled:G.st.bat<s.cost,desc:s.desc})),{title:'スキル',pos:'battle',cols:2});if(j>=0)return{k:'skill',id:sk[j].id};}

async function winBattle(E){const B=G.B;B.eflash=1;SFX.glitch(.5);SFX.shatter();await wait(160);

  await msg(`${E.name}を、ログアウトさせた！`,{auto:600});G.st.exp+=E.exp;const lk=E.likes??(E.exp*2+ri(0,4));G.likes+=lk;await msg(`フォロワーが${E.exp}人ふえた。いいね +${lk}`,{auto:700});G.viewers+=E.exp*ri(40,120);

async function levelCheck(){const s=G.st;while(s.lv<LV_EXP.length-1&&s.exp>=LV_EXP[s.lv+1]){s.lv++;s.mhp+=9;s.hp=Math.min(s.mhp,s.hp+15);s.atk+=2;s.def+=1;updHUD();SFX.level();G.flash=.4;G.flashC='#ffd84a';

  await endCard(3,'#永久配信','同時接続数 ∞');}
function buildScreen(E,parts){if(E.id==='end')$('title').hidden=true;$('msg').hidden=true;$('list').hidden=true;$('info').hidden=true;E.innerHTML='';const hero=document.createElement('div');hero.className='hero';E.appendChild(hero);
  for(const[c,t]of parts){const d=document.createElement('div');d.className=c;if(Array.isArray(t)){t.forEach((x,i)=>{const sp=document.createElement('span');sp.className='l'+(i+1);sp.textContent=x;d.appendChild(sp);});}else d.innerHTML=t;hero.appendChild(d);}
  const host=document.createElement('div');host.className='host';E.appendChild(host);return host;}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
async function endCard(n,t,s){addEnd(n);setLB(false);showHUD(false);$('comments').innerHTML='';G.mode='end';
  const E=$('end');const mv=isFinite(G.maxViewers)?fmtV(Math.floor(G.maxViewers)):'∞';
  const host=buildScreen(E,[['eyebrow','END '+n+' / 3'],['logo',esc(t)],['sub',esc(s)],['stat',`<span>Lv <b>${G.st.lv}</b></span><span>侵食 <b>${G.st.ero}%</b></span><span>最大同接 <b>${mv}</b></span><span>プレイ <b>${fmtPT(G.playT)}</b></span>`],['note2','オートセーブから、エンディング分岐をやり直せます']]);E.hidden=false;SFX.boom();
  await listSelect([{label:'タイトルへ'}],{host,cancel:false});E.hidden=true;toTitle();}
async function gameOver(kind){$('ui').classList.remove('inb');showHUD(false);$('ebar').hidden=true;$('comments').innerHTML='';SFX.down();G.glitch=1.5;
  if(kind==='ero'){G.flash=1;G.flashC='#ff7a1a';}await wait(900);G.mode='over';G.B=null;AU.playBGM('over',1);AU.heart=0;
  const E=$('end');const host=buildScreen(E,[['eyebrow','GAME OVER'],['logo',kind==='ero'?'仮装が完了しました':'通信が切断されました'],['sub',kind==='ero'?'あなたの顔は、もうフィルターと区別がつかない。':'電波の届かない場所で、ユウは目を閉じた。']]);E.hidden=false;
  for(;;){const i=await listSelect([{label:'ロードする',disabled:!anySave()},{label:'タイトルへ'}],{host,cancel:false});
    if(i===0){const sv=await loadFlow();if(!sv)continue;E.hidden=true;await fade(1,500);continueGame(sv);return;}E.hidden=true;toTitle();return;}}

/* =========================================================
   TITLE / FLOW
   ========================================================= */
function toTitle(){objLast='';$('obj').hidden=true;setTimeout(titleScreen,0);}
async function titleScreen(){
  G.mode='press';G.B=null;G.dawn=false;G.blackout=false;G.black=0;G.js=null;AU.heart=0;freshStats();G.flags.zero=1;G.flags.prologue=1;setMap('cross',14,10,'down');G.map.obj('mphone').hidden=true;G.map.obj('mio').hidden=true;
  G.hidePlayer=true;G.camLock={x:100,y:60};showHUD(false);setLB(false);$('ebar').hidden=true;$('card').hidden=true;$('end').hidden=true;
  const T=$('title');const host=buildScreen(T,[['eyebrow','TRICK OR STREAM'],['logo',['ハロウィン','仮装が脱げない。']],['sub','令和ホラーRPG']]);
  const ends=getEnds();const foot=document.createElement('div');foot.className='foot';const e=document.createElement('div');e.className='ends';e.append('回収したエンド');[1,2,3].forEach(n=>{const i=document.createElement('i');i.className=ends.includes(n)?'got':'';i.textContent=n;e.appendChild(i);});
  const wn=document.createElement('div');wn.className='warn';wn.textContent='イヤホン推奨・点滅と大きな音があります';foot.append(e,wn);T.appendChild(foot);
  const pr=document.createElement('div');pr.className='press';pr.textContent='タップしてはじめる';host.appendChild(pr);T.hidden=false;$('fade').style.opacity=0;
  AU.playBGM('title',2);
  await new Promise(res=>{UI.active={key(k){if(k==='a'||k==='menu'){UI.active=null;res();}}};});
  AU.init();AU.playBGM('title',1.5);SFX.notify();G.mode='title';
  const has=anySave();let sv=null;
  for(;;){host.innerHTML='';const i=await listSelect([{label:'はじめから'},{label:'つづきから',disabled:!has}],{host,cancel:false,start:has?1:0});
    if(i===1){sv=await loadFlow();if(!sv)continue;}break;}
  SFX.boom();G.glitch=1;await fade(1,900);T.hidden=true;G.hidePlayer=false;G.camLock=null;G.flags={};
  if(sv)continueGame(sv);else{G.black=0;runScript(prologue);}
}
function continueGame(sv){freshStats();UI.active=null;UI.msg=null;['msg','list','info','end','ebar','card'].forEach(k=>$(k).hidden=true);$('ui').classList.remove('inb','lbon');G.blackout=false;G.flags.ledOff=0;G.likes=sv.likes||0;Object.assign(G.st,sv.st);G.st.blind=0;G.st.block=false;Object.assign(G.items,sv.items);G.flags=sv.flags||{};G.viewers=sv.viewers||13204;G.maxViewers=sv.max||G.viewers;G.playT=sv.pt||0;
  G.dawn=false;G.blackout=false;G.black=0;G.js=null;G.hidePlayer=false;G.camLock=null;setMap(sv.map,sv.x,sv.y,sv.dir);G.mode='field';G.B=null;$('title').hidden=true;$('end').hidden=true;
  showHUD(true);AU.playBGM(G.map.bgm,1.5);checkEro();fade(0,800);lastAuto=performance.now();
  if(G.flags.atChoice&&G.flags.bossDone)runWhenFree(endingChoice);}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last=performance.now(),uiT=0;
function frame(now){const dt=clamp((now-last)/16.667,0,3);last=now;G.t+=dt;
  for(const k of DIRS)if(IN.held[k]&&UI.active&&now>(IN.rep[k]||0)){IN.q.push(k);IN.rep[k]=now+120;}
  while(IN.q.length){const k=IN.q.shift();if(UI.active)UI.active.key(k);else if(canControl())fieldKey(k);}
  G.shake=Math.max(0,G.shake-.35*dt);G.glitch=Math.max(0,G.glitch-.035*dt);G.flash=Math.max(0,G.flash-.06*dt);
  if(G.B){const B=G.B;B.eflash=Math.max(0,B.eflash-.12*dt);B.lunge=Math.max(0,B.lunge-.08*dt);B.slash=Math.max(0,B.slash-.07*dt);B.shut=Math.max(0,B.shut-.06*dt);B.ehit=Math.max(0,B.ehit-dt);}
  if(G.js)G.js.t+=dt;
  tickMsg(dt);
  if(G.mode==='field')updatePlayer(dt);
  if(G.mode==='title'||G.mode==='press'){G.camLock={x:110+Math.sin(G.t*.004)*90,y:70+Math.sin(G.t*.003)*30};}
  // ambience
  if(G.mode==='field'&&G.flags.prologue&&!G.busy&&!G.dawn){G.ambT-=dt;if(G.ambT<=0){G.ambT=rnd(220,520);const pool=[...(CM[G.mapId]||CM.cross),...(G.st.ero>=50?CM.ero:[])];cmt(pick(pool),Math.random()<.15?'red':'');}
    G.ntT-=dt;if(G.ntT<=0){G.ntT=rnd(1800,3200);const n=NT[G.mapId];if(n&&G.mapId!=='roof')notify(pick(n),Math.random()<.4);}
    if(G.st.ero>=75&&Math.random()<.0015){SFX.whisper();G.glitch=.6;}}
  if(isFinite(G.viewers)){G.viewers+=Math.random()<.3?ri(0,3):0;G.maxViewers=Math.max(G.maxViewers,G.viewers);}else G.maxViewers=Infinity;
  if(G.mode==='field'||G.mode==='battle')G.playT=(G.playT||0)+dt/60;
  if(canControl()){G.autoT=(G.autoT||0)+dt;if(G.autoT>3600){G.autoT=0;autoSave(true);}}
  uiT+=dt;if(uiT>20){uiT=0;if(canControl())showObj();else if(G.mode!=='field'||G.dawn||UI.active)$('obj').hidden=true;$('viewers').textContent=isFinite(G.viewers)?fmtV(Math.floor(G.viewers)):'∞';}
  // particles
  for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=.01*dt;q.l-=dt;if(q.l<=0)G.parts.splice(i,1);}
  // render
  if(G.mode==='battle')renderBattle();else if(G.mode==='over'){ctx.fillStyle='#050208';ctx.fillRect(0,0,VW,VH);}else renderField();
  for(const q of G.parts){ctx.globalAlpha=Math.min(1,q.l/30);ctx.fillStyle=q.c;ctx.fillRect(q.x|0,q.y|0,2,2);}ctx.globalAlpha=1;
  post();
  requestAnimationFrame(frame);}

/* boot */
buildMaps();
try{window.claude?.hot?.snapshot?.(()=>G.mode==='field'&&!G.busy?saveData():null);}catch(e){}
function start(data){if(data&&data.map&&MAPS[data.map]){continueGame(data);}else titleScreen();requestAnimationFrame(frame);}
try{if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??null);}catch(e){start(null);}
