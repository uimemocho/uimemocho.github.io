<style>
/* Layout: one fixed 270x480 pixel screen scaled by --p (CSS px per art pixel); canvas world + pixel-window UI on top. Single night look by design. */
:root{
  --p:1.333px;
  --ink:#0B0618; --win1:#2C2266; --win2:#17103C; --gold:#F2D27A; --gold2:#A8742C;
  --txt:#FFF4DC; --sub:#B9AEE6; --hl:#FFE59A; --red:#FF6B6B; --grn:#7FE0A0; --yel:#FFD35A;
  --f:'DotGothic16','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#07040F;color:var(--txt);overflow:hidden}
#app{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#fit{position:relative;width:100%;height:100%}
#screen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--p)*270);height:calc(var(--p)*480);overflow:hidden;
  font-family:var(--f);font-size:calc(var(--p)*12);line-height:1.5;color:var(--txt);background:#000;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.a{position:absolute;left:calc(var(--p)*var(--x,0));top:calc(var(--p)*var(--y,0));width:calc(var(--p)*var(--w,10));box-sizing:border-box}
.ah{height:calc(var(--p)*var(--h,10))}
.t8{font-size:calc(var(--p)*8);line-height:1.5}
.t16{font-size:calc(var(--p)*16);line-height:1.35}
.t24{font-size:calc(var(--p)*24);line-height:1.2}
.gold{color:var(--hl)} .sub{color:var(--sub)} .cen{text-align:center}
p{margin:0}
.notch{clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pw{background:linear-gradient(180deg,var(--win1),var(--win2));
  box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 0 0 calc(var(--p)*2) var(--gold),inset 0 0 0 calc(var(--p)*3) var(--gold2),inset 0 0 0 calc(var(--p)*4) var(--ink);
  padding:calc(var(--p)*7);
  clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pw.thin{padding:calc(var(--p)*4)}
.inset{background:#0F0A2A;box-shadow:inset 0 0 0 var(--p) #3C3170;padding:calc(var(--p)*5)}
.pb{font:inherit;color:#2A1606;background:linear-gradient(180deg,#FFEDB4 0%,#F2C55A 100%);border:0;cursor:pointer;
  box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-3) 0 #C08A2E,inset 0 calc(var(--p)*2) 0 #FFF8DC;
  padding:calc(var(--p)*4) calc(var(--p)*8) calc(var(--p)*5);display:block;width:100%;text-align:center;
  clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pb:active{transform:translateY(var(--p));box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-1) 0 #C08A2E}
.pb.sub{background:linear-gradient(180deg,#E2DAFF,#A396E6);color:#120A2E;box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-3) 0 #6B5FB8,inset 0 calc(var(--p)*2) 0 #F4F0FF}

.stack{display:flex;flex-direction:column;gap:calc(var(--p)*5)}

@keyframes bob{50%{transform:translateY(calc(var(--p)*-2))}}

/* HUD */

/* command bar */

.ucw{position:absolute}
.ts{display:flex;align-items:center;justify-content:center;gap:calc(var(--p)*3);height:calc(var(--p)*28);padding:calc(var(--p)*4);border:0;font:inherit;color:var(--txt);cursor:pointer;position:relative}
.ts .cd{position:absolute;left:calc(var(--p)*4);right:calc(var(--p)*4);bottom:calc(var(--p)*4);background:rgba(6,3,18,.78);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.ts.ready{--gold:#FFF4B8;animation:rdy .8s steps(2) infinite}
@keyframes rdy{50%{filter:brightness(1.25)}}
.ts.empty{opacity:.4;cursor:default}

/* hint / toast / bubble */
.hint{color:var(--hl);text-align:center;animation:bob .7s steps(2) infinite;pointer-events:none}
.hint::after{content:'';display:block;width:calc(var(--p)*14);height:calc(var(--p)*10);margin:calc(var(--p)*3) auto 0;background:var(--icDown) center/100% 100% no-repeat;image-rendering:pixelated}
.hint.up::after{content:none}.hint.up::before{content:'';display:block;width:calc(var(--p)*14);height:calc(var(--p)*10);margin:0 auto calc(var(--p)*3);background:var(--icUp) center/100% 100% no-repeat;image-rendering:pixelated}
.toast{text-align:center;pointer-events:none}

/* dialog */
#dlg{pointer-events:none}
#dlgName{color:var(--hl);padding:calc(var(--p)*3) calc(var(--p)*9);width:auto;white-space:nowrap}
#dlgBox{height:calc(var(--p)*104)}
#dlgBox.narr #dlgText{color:#E6DEFF}
#dlgText{min-height:calc(var(--p)*70);white-space:pre-wrap;text-shadow:0 var(--p) 0 rgba(6,3,18,.75)}
.adv{position:absolute;right:calc(var(--p)*10);bottom:calc(var(--p)*8);width:calc(var(--p)*14);height:calc(var(--p)*10);background:var(--icDown) center/100% 100% no-repeat;image-rendering:pixelated;animation:blink .8s steps(1) infinite}
.ic{display:inline-block;vertical-align:middle;background:center/100% 100% no-repeat;image-rendering:pixelated}
.ic.ff{width:calc(var(--p)*16);height:calc(var(--p)*14);background-image:var(--icFF);margin-left:calc(var(--p)*3)}
.ic.pz{width:calc(var(--p)*14);height:calc(var(--p)*14);background-image:var(--icPause)}
.ic.st{width:calc(var(--p)*9);height:calc(var(--p)*8);background-image:var(--icStar);margin-right:var(--p);vertical-align:-0.05em}
#btnPause{display:grid;place-items:center}

/* menu lists */
.opt{display:grid;grid-template-columns:calc(var(--p)*30) 1fr;align-items:center;gap:calc(var(--p)*5);width:100%;font:inherit;color:var(--txt);text-align:left;background:transparent;border:0;padding:calc(var(--p)*3) calc(var(--p)*4) calc(var(--p)*3) calc(var(--p)*12);cursor:pointer;position:relative}
.opt::before{content:'';position:absolute;left:calc(var(--p)*2);top:50%;transform:translateY(-50%);color:var(--hl)}
.opt.sel{background:rgba(242,210,122,.14)}
.opt.sel::before{content:'';width:calc(var(--p)*10);height:calc(var(--p)*14);background:var(--icRight) center/100% 100% no-repeat;image-rendering:pixelated;animation:blink .8s steps(1) infinite}
.opt .ic{display:grid;place-items:center;height:calc(var(--p)*28);background:#0F0A2A;box-shadow:inset 0 0 0 var(--p) #3C3170}
.tag{display:inline-block;padding:0 calc(var(--p)*3);margin-right:calc(var(--p)*3);color:var(--ink)}
.tag.trial{background:var(--hl)} .tag.up{background:#9EE7F2} .tag.prep{background:var(--grn)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--p)*6)}
.item{font:inherit;color:var(--txt);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*3);padding:calc(var(--p)*8) calc(var(--p)*2) calc(var(--p)*6)}
.item.real{--gold:#FFF4B8;background:linear-gradient(180deg,#6A5A1E,#3A2E10)}
.item.wrong{--gold:#FF9A9A;background:linear-gradient(180deg,#5A1E36,#2E0E1E)}
.pulse{animation:glow var(--pd,1.1s) steps(6) infinite}
@keyframes glow{0%,100%{filter:brightness(.42) saturate(.5)}50%{filter:brightness(1.3) drop-shadow(0 0 calc(var(--p)*4) #FFD34A)}}
.timer{display:flex;gap:var(--p)}
.timer i{flex:1;height:calc(var(--p)*6);background:var(--hl);box-shadow:inset 0 0 0 var(--p) var(--ink)}
.timer i.off{background:#2A1E4A}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*5)}
.hr{height:var(--p);background:#4A3D8A;margin:calc(var(--p)*5) 0}
@media (prefers-reduced-motion:reduce){.hint,.uc.sel::after,.ts.ready{animation:none}.win{animation:none}}
[hidden]{display:none!important}
.pw.glass{background:linear-gradient(180deg,rgba(52,40,120,.58),rgba(20,14,54,.72));-webkit-backdrop-filter:blur(calc(var(--p)*1.2));backdrop-filter:blur(calc(var(--p)*1.2));
  box-shadow:inset 0 0 0 var(--p) rgba(11,6,24,.8),inset 0 0 0 calc(var(--p)*2) rgba(242,210,122,.85),inset 0 0 0 calc(var(--p)*3) rgba(11,6,24,.5)}
.opt.lang{grid-template-columns:1fr;padding-top:calc(var(--p)*5);padding-bottom:calc(var(--p)*5)}
body.nl #hudPhase{font-size:calc(var(--p)*8)}
body.nl .uc .nm{font-size:calc(var(--p)*8);white-space:normal;line-height:1.3}
body.nl .uc .nm .t8{font-size:inherit}
body.nl .uc .nm .sub{display:none}
body.nl .ts{flex-direction:column;gap:var(--p);padding:calc(var(--p)*3)}
body.nl .ts span{font-size:calc(var(--p)*7);line-height:1;white-space:nowrap;letter-spacing:-0.02em}
body.nl .ts img{width:calc(var(--p)*11)!important;height:auto!important}
body.nl #dlgText{font-size:calc(var(--p)*11)}
#ltBox.bump{animation:hudbump .18s steps(3)}
@keyframes hudbump{50%{transform:scale(1.14);filter:brightness(1.35)}}
#screen{overflow:clip}
.pb.a,.uc.a,.ts.a{width:calc(var(--p)*var(--w,10))}
.ts.a,.uc.a{position:absolute}
.t8{font-size:calc(var(--p)*8);line-height:1.5}
.t16{font-size:calc(var(--p)*16);line-height:1.35}
.t24{font-size:calc(var(--p)*24);line-height:1.2}
#hud .box span{white-space:nowrap}
.uc .nm{line-height:1.35;white-space:nowrap}
</style>

</head>
<body>

<div id="app"><div id="fit"><div id="screen">
  <canvas id="cv" width="270" height="480" aria-label="十五夜"></canvas>

  <div id="hud" hidden>
    <div class="pw box a" style="--x:4;--y:4;--w:80"><img class="px" id="hudMoon" alt=""><span id="hudPhase">十一夜</span></div>
    <div class="pw box a" style="--x:86;--y:4;--w:110"><span class="t8 sub" data-i18n>屋敷</span><div class="gauge" id="hpG"></div></div>

  <div id="cmd" hidden>
    <div id="units"></div>
    <div id="trs"></div>

  <div id="hint" class="pw thin hint a" hidden></div>

<script>
(()=>{

'use strict';
// ===== core =====
const LW=270,LH=480;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(a,al){return al==null?`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`:`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;}

const OL_INK='#0B0618';

const SPC={};
function sprite(name,o={}){
 const key=name+'|'+(o.sw?JSON.stringify(o.sw):'')+'|'+(o.m||'n')+'|'+(o.ol||'')+'|'+(o.col||'')+'|'+(o.rim||'');
 if(SPC[key])return SPC[key];
 const rows=SPR[name];const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
 const grid=[];
 for(let j=0;j<h;j++){grid[j]=[];for(let i=0;i<w;i++){let ch=rows[j][i]||'.';if(o.sw&&o.sw[ch])ch=o.sw[ch];grid[j][i]=PAL[ch]||null;}}
 const [c,x]=mk(w+2,h+2);
 if(o.ol){x.fillStyle=o.m==='s'?o.col:o.ol;
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(grid[j]&&grid[j][i])continue;
   if((grid[j]&&(grid[j][i-1]||grid[j][i+1]))||(grid[j-1]&&grid[j-1][i])||(grid[j+1]&&grid[j+1][i]))x.fillRect(i+1,j+1,1,1);}}
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=grid[j][i];if(col){x.fillStyle=o.m==='w'?'#FFFFFF':o.m==='s'?o.col:col;x.fillRect(i+1,j+1,1,1);}}
 if(o.rim&&!o.m){x.fillStyle=o.rim;for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!grid[j][i])continue;const top=!(grid[j-1]&&grid[j-1][i]),lef=!grid[j][i-1],rig=!grid[j][i+1];
  if(top){x.globalAlpha=.75;x.fillRect(i+1,j+1,1,1);}else if(lef||rig){x.globalAlpha=lef?.42:.22;x.fillRect(i+1,j+1,1,1);}}x.globalAlpha=1;}
 let bp=0;for(let j=h-1;j>=0;j--){if(grid[j].some(v=>v))break;bp++;}c.pad=bp+1;
 return SPC[key]=c;
}
const URLC={};
function sURL(name,ol=OL_INK){const k=name+ol;return URLC[k]||(URLC[k]=sprite(name,{ol}).toDataURL());}
function sImg(name,scale=1,ol=OL_INK){const c=sprite(name,{ol});return `<img class="px" alt="" src="${sURL(name,ol)}" style="width:calc(var(--p)*${c.width*scale});height:calc(var(--p)*${c.height*scale})">`;}
function moonURL(frac,r=6){
 const n=r*2+3;const [c,x]=mk(n,n);const cx=r+1.5,cy=r+1.5;const sx=cx-2*r*frac-.5;
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=i+.5-cx,dy=j+.5-cy;const d=Math.hypot(dx,dy);
  if(d<=r){const sh=Math.hypot(i+.5-sx,dy)<r;x.fillStyle=sh?'#2A2458':(dx+dy>r*.5?'#F5C842':'#FFF1A8');x.fillRect(i,j,1,1);}
  else if(d<=r+1.2){x.fillStyle=OL_INK;x.fillRect(i,j,1,1);}}
 return c.toDataURL();
}

Emperor. The Emperor sent his General with soldiers to the house.","中将である。帝の仰せにより、十五夜まで姫をお守りいたす。":"I am the General. By the Emperor's command, I will guard the princess until the full moon.","弓と槍を並べておけば、天人とて通れまい。":"Line up the bows and spears, and not even moon folk will get through.","ありがたい。ただ、光る星が落ちとったら拾うてくだされ。":"Thank you. Only, if you see light stars on the ground, do pick them up.","わしが光る竹から集めますでな。兵を雇う足しになる。":"I gather them from glowing bamboo. They'll help pay for soldiers.","……光る、星？":"...Light... stars?","見ればわかる。":"You'll know when you see one.","三日目の夜明け前。兵たちが眠るあいだ、翁と姫は縁側にいた。":"Before dawn on the third day. While the soldiers slept, Grandpa and the princess sat on the veranda.","お爺さん、その手。どうしたの。":"Grandpa, your hands. What happened?","竹の切り口でやった。毎晩、光る竹を探して割っとるからな。":"Bamboo edges. I split glowing bamboo every night, looking for them.","そんなにたくさん、光る竹なんてないでしょう。":"There can't be that much glowing bamboo.","探せばある。おまえが入っとったくらいじゃ。":"There is if you look. You were in one, after all.","月の人たちはね、悪い人じゃないの。ただ、あそこでは誰も泣かないの。":"The moon people aren't bad people. It's just that nobody there ever cries.","わたし、こっちに来てから泣くようになった。たぶん、それがいけないの。":"I started crying after I came here. Maybe that's what's wrong.","難しいことはわからん。それより朝飯、何がええ。":"I don't understand the hard stuff. What do you want for breakfast?","……お粥。梅のやつ。":"...Rice porridge. With a plum.","よし。":"Right.","十五夜。月が昇ると、あたりは昼のように明るくなった。":"The full moon. When it rose, the night grew as bright as day.","……どうしたことだ。弓を引く腕に、力が入らん。":"...What is this? My arms won't draw the bow.","翁よ。姫は罪をつぐなうため、しばらく下界に預けていたにすぎぬ。":"Old man. We only left the princess in the lower world for a time, to make up for a wrong she did.","期限は満ちた。こちらへ渡してもらおう。":"Her time is up. Hand her over.","罪とは、何をしたんで。":"And what wrong did she do?","おまえたちに話して、わかることではない。":"It is nothing you would understand.","なら、わしらにも渡す理由はありませんな。":"Then we've got no reason to hand her over, either.","お爺さん……。":"Grandpa...","ええい、動け！ 弓を取れ、射よ！":"Move, curse it! Take up your bows! Shoot!","天の羽衣を着せかけられる いの。":"다음 보름에 데리러 와요. 거절할 수 있는 게 아니에요.","断れないって、あんた……。":"거절할 수 없다니, 얘야…","来るなら来ればええ。戸を閉めて、わしが前に座っとる。":"올 테면 오라지. 문 닫고 내가 그 앞에 앉아 있으마.","相手は人じゃないのよ。":"상대는 사람이 아니에요.","わしだって、竹から娘が出てくるとは思っとらんかった。":"나도 대나무에서 딸이 나올 줄은 몰랐다.","翁は帝に願い出た。帝は中将に命じ、兵をつけて屋敷へ向かわせた。":"할아버지는 임금께 청했다. 임금은 중장에게 명해 병사를 붙여 저택으로 보냈다.","中将である。帝の仰せにより、十五夜まで姫をお守りいたす。":"중장이오. 임금의 명에 따라 보름까지 공주를 지키겠소.","弓と槍を並べておけば、天人とて通れまい。":"활과 창을 늘어놓으면 천인이라도 지나가지 못할 것이오.","ありがたい。ただ、光る星が落ちとったら拾うてくだされ。":"고맙소. 다만 빛나는 별이 떨어져 있으면 주워 주시오.","わしが光る竹から集めますでな。兵を雇う足しになる。":"내가 빛나는 대나무에서 모아 오지요. 병사 부리는 데 보탬이 될 거요.","……光る、星？":"…빛나는, 별?","見ればわかる。":"보면 압니다.","三日目の夜明け前。兵たちが眠るあいだ、翁と姫は縁側にいた。":"사흘째 새벽 전. 병사들이 자는 동안 할아버지와 공주는 툇마루에 있었다.","お爺さん、その手。どうしたの。":"할아버지, 그 손. 어떻게 된 거예요.","竹の切り口でやった。毎晩、光る竹を探して割っとるからな。":"대나무 단면에 베였지. 매일 밤 빛나는 대나무를 찾아 쪼개니까.","そんなにたくさん、光る竹なんてないでしょう。":"빛나는 대나무가 그렇게 많을 리 없잖아요.","探せばある。おまえが入っとったくらいじゃ。":"찾으면 있다. 너도 들어 있었으니까.","月の人たちはね、悪い人じゃないの。ただ、あそこでは誰も泣かないの。":"달 사람들은요, 나쁜 사람들이 아니에요. 다만 거기선 아무도 울지 않아요.","わたし、こっちに来てから泣くようになった。たぶん、それがいけないの。":"저, 여기 오고 나서 울게 됐어요. 아마 그게 안 되는 거겠죠.","難しいことはわからん。それより朝飯、何がええ。":"어려운 건 모르겠다. 그보다 아침은 뭘 먹고 싶으냐.","……お粥。梅のやつ。":"…죽이요. 매실 넣은 거.","よし。":"그래.","十五夜。月が昇ると、あたりは昼のように明るくなった。":"보름밤. 달이 뜨자 주위는 대낮처럼 밝아졌다.","……どうしたことだ。弓を引く腕に、力が入らん。":"…어찌 된 일이냐. 활을 당기는 팔에 힘이 들어가지 않는다.","翁よ。姫は罪をつぐなうため、しばらく下界に預けていたにすぎぬ。":"노인이여. 공주는 잘못을 갚기 위해 잠시 하계에 맡겨 두었을 뿐이다.","期限は満ちた。こちらへ渡してもらおう。":"기한이 찼다. 이쪽으로 넘겨라.","罪とは、何をしたんで。":"잘못이라니, 무얼 했는데요.","おまえたちに話して、わかることではない。":"너희에게 말한다고 알 일이 아니다.","なら、わしらにも渡す理由はありませんな。":"그럼 우리도 넘겨줄 이유가 없겠소.","お爺さん……。":"할아버지…","ええい、動け！ 弓を取れ、射よ！":"에잇, 움직여라! 활을 들어라, 쏴라!","天の羽衣を着せかけられると、姫はもう泣かなかった。":"하늘의 날개옷이 덮이자 공주는 더 이상 울지 않았다.","お爺さん。……あれ。わたし、何を言おうとしたんだっけ。":"할아버지. …어라. 제가 무슨 말을 하려고 했더라.","飛ぶ車は音もなく、月のほうへ小さくなっていった。":"날아가는 수레는 소리도 없이 달 쪽으로 작아져 갔다.","天人たちは光をたたむようにして、雲の上へ引き上げていった。":"천인들은 빛을 접듯이 구름 위로 물러갔다.","……退いた。退いたぞ。":"…물러갔다. 물러갔다!","ふう。腰が抜けるかと思うたわい。":"휴우. 허리가 빠지는 줄 알았네.","これ……あの人が置いていったの。不死の薬。":"이거… 그 사람이 두고 갔어요. 불사의 약.","飲めば年を取らない。病にもならない。ずっと、このまま。":"마시면 늙지 않아요. 병도 안 걸려요. 계속 이대로.","わしもか。":"나도냐.","お爺さんも、お婆さんも。わた const LANGS=[['ja','日本語'],['en','English'],['zh-Hans','简体中文'],['zh-Hant','繁體中文'],['ko','한국어'],['fr','Français'],['de','Deutsch'],['ru','Русский'],['it','Italiano']];
function detectLang(){
 try{const q=new URLSearchParams(location.search).get('lang');if(q){const m=LANGS.find(([c])=>c.toLowerCase()===q.toLowerCase());if(m)return m[0];}}catch(e){}
 const s=store.get('jugoya_lang',null);if(s&&LANGS.some(([c])=>c===s))return s;
 const n=((navigator.languages&&navigator.languages[0])||navigator.language||'ja').toLowerCase();
 if(n.startsWith('zh'))return /tw|hk|mo|hant/.test(n)?'zh-Hant':'zh-Hans';
 for(const [c] of LANGS)if(n.startsWith(c.toLowerCase()))return c;return 'en';
}
let LANG=detectLang();
function tr(s){if(LANG==='ja')return s;const d=I18N[LANG];return (d&&d[s]!=null)?d[s]:s;}
function trf(s,...a){return tr(s).replace(/\{(\d)\}/g,(_,i)=>a[i]!=null?a[i]:'');}
function numL(n){return LANG==='ja'?KN[n]:String(n+1);}
function nightL(n){return trf('第{0}夜',numL(n));}
function phaseL(n){return tr(PHASE[n]);}

function audioInit(){

 AU.master=ac.createGain();AU.master.gain.value=.85;AU.master.connect(AU.comp);AU.comp.connect(ac.destination);
 AU.music=ac.createGain();AU.music.gain.value=0;AU.music.connect(AU.master);
 AU.sfx=ac.createGain();AU.sfx.gain.value=AU.se?.7:0;AU.sfx.connect(AU.master);
 AU.musicIn=ac.createGain();AU.musicIn.connect(AU.music);
 const dl=ac.createDelay(1);dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.3;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;
 const wet=ac.createGain();wet.gain.value=.32;AU.musicIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(AU.music);
 const len=ac.sampleRate;const b=ac.createBuffer(1,len,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;

function eg(g,t,a,peak,end){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,end);}
function noiseSrc(t,dur,type,freq,q,gain,out,dec){const ac=AU.ac;const n=ac.createBufferSource();n.buffer=AU.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(Math.max(.0002,gain),t);g.gain.exponentialRampToValueAtTime(.0001,t+dec);n.connect(f);f.connect(g);g.connect(out);n.start(t,Math.random()*.5);n.stop(t+dur);}

 koto(t,m,d,v,out){const ac=AU.ac,f=mtof(m);const o1=ac.createOscillator(),o2=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain(),g2=ac.createGain();

// ===== scene engine =====
let SC=null;
function runScene(name,onDone){
 SC={cmds:SCN[name],i:0,actors:{},stage:'house',n:0,flags:{},fadeA:1,fadeT:1,fadeSpd:1,block:null,emotes:[],flash:0,shake:0,line:null,onDone};
 setState('scene');scStep();
}
function scExec(c){
 if(c.stage){SC.stage=c.stage;SC.n=c.n!=null?c.n:SC.n;SC.flags={};}
 if(c.music)playMusic(c.music);
 if(c.del)for(const id of c.del)delete SC.actors[id];
 if(c.set)for(const id in c.set){const a=SC.actors[id]||{x:0,y:null,flip:false,scale:2,ph:Math.random()*6};Object.assign(a,c.set[id]);SC.actors[id]=a;}
 if(c.flag)SC.flags[c.flag]=1;
 if(c.sfx&&sfx[c.sfx])sfx[c.sfx]();
 if(c.flash)SC.flash=c.flash;if(c.shake)SC.shake=c.shake;
 if(c.emote)SC.emotes.push({id:c.emote,k:c.k,t:1.3});
 if(c.move){const a=SC.actors[c.move];a.mv={fx:a.x,tx:c.x!=null?c.x:a.x,fy:a.y,ty:c.y!=null?c.y:a.y,t:0,d:c.dur||1};if(c.x!=null&&c.x!==a.x)a.flip=c.x<a.x;if(c.wait!==false)SC.block={k:'move',a};}
 if(c.fade){SC.fadeT=c.fade==='out'?1:0;SC.fadeSpd=1/(c.dur||.6);SC.block={k:'fade'};}
 if(c.wait)SC.block={k:'wait',t:c.wait};
 if(c.say!==undefined||c.narr!==undefined){showLine(c);SC.block={k:'line'};}
}
function scStep(){while(SC&&!SC.block&&SC.i<SC.cmds.length)scExec(SC.cmds[SC.i++]);if(SC&&!SC.block&&SC.i>=SC.cmds.length)endScene();}
function endScene(){const cb=SC&&SC.onDone;SC=null;$('dlg').hidden=true;$('btnSkip').hidden=true;if(cb)cb();}
function skipScene(){if(!SC)return;sfx.tap();endScene();}
function showLine(c){
 const narr=c.narr!==undefined;SC.line={text:tr(narr?c.narr:c.text),shown:0,who:c.who||null,acc:0};
 $('dlg').hidden=false;$('dlgName').hidden=narr;$('dlgName').textContent=c.say?tr(c.say):'';$('dlgBox').classList.toggle('narr',narr);$('dlgText').textContent='';
}
function scTap(){
 if(!SC||!SC.block)return;
 if(SC.block.k==='line'){const L=SC.line;if(L.shown<L.text.length){L.shown=L.text.length;$('dlgText').textContent=L.text;}else{SC.block=null;SC.line=null;$('dlg').hidden=true;sfx.cursor();scStep();}}
}
function updateScene(dt){
 const s=SC;if(!s)return;
 if(s.fadeA!==s.fadeT){const d=s.fadeSpd*dt;s.fadeA=s.fadeA<s.fadeT?Math.min(s.fadeT,s.fadeA+d):Math.max(s.fadeT,s.fadeA-d);}
 for(const id in s.actors){const a=s.actors[id];a.ph+=dt*3;if(a.mv){a.mv.t+=dt;const k=clamp(a.mv.t/a.mv.d,0,1);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;a.x=lerp(a.mv.fx,a.mv.tx,e);if(a.mv.fy!=null&&a.mv.ty!=null)a.y=lerp(a.mv.fy,a.mv.ty,e);a.walk=k<1;if(k>=1)a.mv=null,a.walk=false;}}
 s.emotes=s.emotes.filter(e=>(e.t-=dt)>0);if(s.flash>0)s.flash-=dt*1.5;if(s.shake>0)s.shake-=dt;
 const L=s.line;if(L&&L.shown<L.text.length){L.acc+=dt*28;const n=Math.floor(L.acc);if(n>0){L.acc-=n;L.shown=Math.min(L.text.length,L.shown+n);$('dlgText').textContent=L.text.slice(0,L.shown);if(L.shown%2===0)sfx.type();}}
 const b=s.block;if(b){if(b.k==='move'&&!b.a.mv)s.block=null;else if(b.k==='fade'&&s.fadeA===s.fadeT)s.block=null;else if(b.k==='wait'&&(b.t-=dt)<=0)s.block=null;}
 if(!s.block)scStep();
}
function drawScene(t){
 const s=SC;let sx=0,sy=0;if(s.shake>0){sx=Math.round(rnd(-2,2));sy=Math.round(rnd(-2,2));}ctx.translate(sx,sy);
 drawStage(s.stage,s.n,t,s.flags);
 const baseY=STAGE_Y[s.stage];
 const list=Object.entries(s.actors).sort((a,b)=>(a[1].y??baseY)-(b[1].y??baseY));
 for(const [id,a] of list){const y=(a.y??baseY)-(a.float?(3+Math.sin(a.ph)*2):0)-(a.walk?Math.abs(Math.sin(a.ph*4))*2:0);
  const talking=SC.line&&SC.line.who===id&&SC.line.shown<SC.line.text.length;
  if(!a.float)shadow(a.x,(a.y??baseY),12*a.scale,.4);
  if(id==='king')glow(a.x,y-30,60,'255,226,160',.4);
  if(id==='pot')glow(a.x,y-10,24,'255,226,160',.5);
  drawSpr(a.spr,a.x,y,a.scale,{flip:a.flip,sy:1+(talking?.03*Math.sin(t*20):.015*Math.sin(a.ph))});}
 for(const e of s.emotes){const a=s.actors[e.id];if(!a)continue;const y=(a.y??baseY)-26*a.scale-6-(e.t>1.1?(e.t-1.1)*20:0);ctx.fillStyle='#FFF4DC';ctx.fillRect(a.x-6,y-10,13,12);ctx.fillStyle='#0B0618';ctx.fillRect(a.x-7,y-10,1,12);ctx.fillRect(a.x+7,y-10,1,12);ctx.fillRect(a.x-6,y-11,13,1);ctx.fillRect(a.x-6,y+2,13,1);ctx.fillRect(a.x-1,y+3,3,2);ptxt(e.k,a.x+.5,y-1,'#2A1606',8,'center','#FFF4DC');}
 if(s.stage==='house'||s.stage==='grove')drawFireflies(t,200,320);
 drawStageFg(s.stage,s.n);
 ctx.translate(-sx,-sy);
}
function drawSceneFx(){const s=SC;if(s.flash>0){ctx.globalAlpha=Math.min(1,s.flash);ctx.fillStyle='#FFF8EC';ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}
 if(s.fadeA>0){ctx.globalAlpha=s.fadeA;ctx.fillStyle='#05030C';ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}}

// ===== UI =====
let state='boot',VIEW={k:'title'};
const WINS=['wTitle','wDay','wMini','wResult','wChoice','wCard','wPause','wLang'];
function showWin(id){WINS.forEach(w=>$(w).hidden=w!==id);}
function setState(s){state=s;
 $('hud').hidden=!['night','paused','day','mini','result'].includes(s);
 $('cmd').hidden=!['night','paused'].includes(s);
 $('btnSkip').hidden=s!=='scene';if(s!=='scene')$('dlg').hidden=true;
 if(s!=='night'){hideBubble();hideHint();}
 if(s==='scene')showWin(null);
}
let toastT=null;function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1300);}
let hintShown=false;function showHint(m,x,y,w,up){const h=$('hint');h.textContent=m;h.style.setProperty('--x',Math.round(clamp(x,4,266-w)));h.style.setProperty('--y',Math.round(y));h.style.setProperty('--w',w);h.classList.toggle('up',!!up);h.hidden=false;hintShown=true;}
function hideHint(){$('hint').hidden=true;hintShown=false;}
let bubbleUnit=null;function showBubble(u){bubbleUnit=u;const p=cellPos(u.lane,u.row);const b=$('ubub');b.style.setProperty('--x',Math.round(clamp(p.x-32,4,202)));b.style.setProperty('--y',Math.round(p.y-30*SK*zs(u.z)-30));$('btnRetreat').innerHTML=`${tr('撤収')} <i class="ic st"></i>+${Math.floor(UNITS[u.type].cost/2)}`;b.hidden=false;}
function hideBubble(){bubbleUnit=null;$('ubub').hidden=true;}
function syncSoundBtns(){['btnBgm','btnBgm2'].forEach(i=>$(i).textContent=trf('音楽 {0}',tr(AU.bgm?'オン':'オフ')));['btnSe','btnSe2'].forEach(i=>$(i).textContent=trf('効果音 {0}',tr(AU.se?'オン':'オフ')));}

function buildCmd(){
 const u=$('units');u.innerHTML='';['okina','archer','guard'].forEach((k,i)=>{const d=UNITS[k];const b=document.createElement('button');b.className='pw uc a';b.style.cssText=`--x:${4+i*88};--y:412;--w:86`;b.dataset.u=k;
  b.innerHTML=`${sImg(d.spr,1)}<span class="nm"><span>${tr(d.name)} <span class="t8 cost"><i class="ic st"></i>${d.cost}</span></span><span class="t8 sub">${tr(d.info)}</span></span>`;
  b.addEventListener('pointerdown',ev=>cardDown(ev,k));u.appendChild(b);});
 const trBox=$('trs');trBox.innerHTML='';TREASURES.forEach((t,i)=>{const own=G&&G.owned.includes(t.id);const b=document.createElement('button');b.className='pw ts a'+(own?'':' empty');b.style.cssText=`--x:${4+i*53};--y:449;--w:51`;b.dataset.t=t.id;
  b.innerHTML=own?`${sImg(t.icon,1)}<span>${tr(t.skill)}</span><span class="cd t8" hidden></span>`:`<span class="t8 sub">${tr('宝')}</span>`;
  b.setAttribute('aria-label',own?`${tr(t.skill)}: ${tr(t.desc)}`:trf('{0}（未入手）',tr(t.name)));if(own)b.onclick=()=>useSkill(t.id);else b.disabled=true;trBox.appendChild(b);});
 lastHud='';
}
let lastHud='';
function hudUpdate(){
 if(!G)return;const light=N?N.light:startLight();const key=[G.night,light,Math.ceil(G.houseHP),G.houseMax,sel].join('|');
 if(key!==lastHud){lastHud=key;$('hudPhase').textContent=phaseL(Math.min(4,G.night));$('hudMoon').src=moonURL(FRAC[Math.min(4,G.night)]);$('hudMoon').style.cssText='width:calc(var(--p)*15);height:calc(var(--p)*15)';
  $('hudLight').textContent=light;const g=$('hpG');if(!g.children.length)for(let i=0;i<12;i++)g.appendChild(document.createElement('i')).className='seg';
  const f=G.houseHP/G.houseMax;[...g.children].forEach((s,i)=>{s.className='seg'+((i+.5)/12<=f?(f<.3?' r':f<.6?' y':' g'):'');});
  document.querySelectorAll('.uc').forEach(b=>{b.classList.toggle('sel',b.dataset.u===sel);b.classList.toggle('poor',light<UNITS[b.dataset.u].cost);});}
 if(N)document.querySelectorAll('.ts[data-t]').forEach(b=>{const id=b.dataset.t;if(!G.owned.includes(id))return;const cd=N.cds[id]||0;const el=b.querySelector('.cd');if(el){el.hidden=cd<=0;el.style.height=`calc(100% - var(--p)*8)`;el.textContent=Math.ceil(cd);}b.classList.toggle('ready',cd<=0&&state==='night');});
}
// ===== flow =====
function toTitle(){G=null;N=null;VIEW={k:'title'};setState('title');showWin('wTitle');playMusic('title');
 $('memTxt').textContent=memory>0?trf('月の記憶 {0}（はじめの光 +{1}）',memory,memBonus()):tr('負けても「月の記憶」が残る');syncSoundBtns();}
function startGame(){newRun();runScene('opening',()=>showDay());}
let dayOpts=[],daySel=0;
function showDay(){
 N=null;VIEW={k:'stage',name:'grove',n:0};setState('day');showWin('wDay');playMusic('day');buildCmd();hudUpdate();
 $('dayHead').textContent=trf('第{0}日 昼　今宵は{1}',numL(G.night),phaseL(G.night));$('dayStory').textContent=tr(DAY_TEXT[G.night]);
 dayOpts=makeOptions();daySel=0;renderOpts();
}
function makeOptions(){
 const opts=[];const left=TREASURES.filter(t=>!G.owned.includes(t.id));
 if(left.length){const t=pick(left);opts.push({kind:'trial',t,icon:t.icon,tag:tr('難題'),cls:'trial',title:trf('{0}の難題',tr(t.suitor)),desc:trf('「{0}」の真贋を見極める。本物なら夜の技「{1}」が使える。{2}。',tr(t.name),tr(t.skill),tr(t.desc))});}
 const LV=G.lv;const pool=[
  {kind:'up',key:'archer',icon:'archer',tag:tr('鍛錬'),cls:'up',title:tr('弓兵を鍛える'),desc:trf('弓兵の攻撃が35%上がる。いま Lv{0}。',LV.archer)},
  {kind:'up',key:'guard',icon:'guard',tag:tr('鍛錬'),cls:'up',title:tr('槍兵を鍛える'),desc:trf('槍兵の体力と攻撃が35%上がる。いま Lv{0}。',LV.guard)},
  {kind:'up',key:'okina',icon:'okina',tag:tr('鍛錬'),cls:'up',title:tr('翁と竹を取る'),desc:trf('翁が光の星を生む間隔が短くなる。いま Lv{0}。',LV.okina)},
  {kind:'repair',icon:'pot',tag:tr('備え'),cls:'prep',title:tr('屋敷を修繕する'),desc:tr('屋敷の最大体力が20増え、体力が40もどる。')},
  {kind:'bamboo',icon:'i_take',tag:tr('備え'),cls:'prep',title:tr('光る竹を探す'),desc:trf('毎夜はじめの光が3増える。いま +{0}。',G.bonus)}];
 shuffle(pool);while(opts.length<3)opts.push(pool.pop());return opts;
}
function renderOpts(){const box=$('dayOpts');box.innerHTML='';
 dayOpts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===daySel?' sel':'');b.innerHTML=`<span class="ic">${sImg(o.icon,1)}</span><span><span class="tag t8 ${o.cls}">${o.tag}</span>${o.title}</span>`;
  b.onclick=()=>{if(daySel===i){chooseOpt();return;}daySel=i;sfx.cursor();renderOpts();};box.appendChild(b);});
 const o=dayOpts[daySel];$('dayDetT').textContent=o.title;$('dayDet').textContent=o.desc;}
function chooseOpt(){const o=dayOpts[daySel];sfx.ok();
 if(o.kind==='trial'){startTrial(o.t);return;}
 if(o.kind==='up')G.lv[o.key]++;if(o.kind==='repair'){G.houseMax+=20;G.houseHP=Math.min(G.houseMax,G.houseHP+40);}if(o.kind==='bamboo')G.bonus+=3;
 toNight();}
function toNight(){if(G.night===4)runScene('boss',()=>startNight());else startNight();}
let miniTO=null,miniItems=[],miniDone=false,miniTick=null;
function startTrial(t){
 setState('mini');showWin('wMini');miniDone=false;
 $('miniSuitor').textContent=trf('{0}の難題',tr(t.suitor));$('miniTitle').textContent=tr(t.name);
 const P=1.1;const mm=$('miniMoon');mm.src=moonURL(1,10);mm.style.cssText=`width:calc(var(--p)*46);height:calc(var(--p)*46);--pd:${P}s`;mm.classList.remove('pulse');void mm.offsetWidth;mm.classList.add('pulse');
 miniItems=shuffle([{real:1,p:P},{real:0,p:P*.62},{real:0,p:P*1.6}]);const box=$('miniItems');box.innerHTML='';
 miniItems.forEach(it=>{const b=document.createElement('button');b.className='pw item';b.innerHTML=`<span class="pulse" style="--pd:${it.p}s">${sImg(t.icon,3)}</span><span class="t8 lb">　</span>`;b.onclick=()=>resolveTrial(t,it.real,b);it.el=b;box.appendChild(b);});
 $('miniRes').textContent='';$('miniNext').hidden=true;
 const tm=$('miniTimer');tm.innerHTML='';for(let i=0;i<14;i++)tm.appendChild(document.createElement('i'));
 let left=14;clearInterval(miniTick);miniTick=setInterval(()=>{left--;[...tm.children].forEach((e,i)=>e.classList.toggle('off',i>=left));if(left<=0){clearInterval(miniTick);resolveTrial(t,0,null);}},500);
}
function resolveTrial(t,ok,btn){if(miniDone)return;miniDone=true;clearInterval(miniTick);
 miniItems.forEach(it=>{it.el.disabled=true;const lb=it.el.querySelector('.lb');lb.textContent=tr(it.real?'本物':'偽物');if(it.real)it.el.classList.add('real');});
 if(ok){G.owned.push(t.id);$('miniRes').innerHTML=`<span class="gold">${trf('本物だ。夜の技「{0}」を覚えた',tr(t.skill))}</span>`;sfx.win();}
 else{if(btn)btn.classList.add('wrong');G.consol=2;$('miniRes').innerHTML=`<span style="color:var(--red)">${tr(btn?'偽物をつかまされた。':'時間切れ。')}${trf('慰めに光 +{0}',2)}</span>`;sfx.ng();}
 $('miniNext').hidden=false;}
function startNight(){
 beginNight();VIEW={k:'battle'};setState('night');showWin(null);buildCmd();playMusic('night');hudUpdate();
 if(tut<1)showHint(tr('兵を選び、光るマスに置こう。ドラッグでも置ける'),30,330,210);
}
function onNightClear(){
 setState('result');G.kills+=N.kills;const n=G.night;G.night++;const heal=Math.min(15,G.houseMax-G.houseHP);G.houseHP+=heal;sfx.win();
 if(G.night>=5){setTimeout(()=>runScene('endA',()=>{VIEW={k:'stage',name:'field',n:4};setState('end');showWin('wChoice');}),900);return;}
 showWin('wResult');$('resHead').textContent=`${nightL(n)} ${phaseL(n)}`;
 $('resStats').innerHTML=`<div class="inset"><p class="t8 sub">${tr('退けた使い')}</p><p class="t16">${N.kills}</p></div><div class="inset"><p class="t8 sub">${tr('最大連撃')}</p><p class="t16">${G.maxCombo}</p></div>`;
 $('resLine').textContent=RES_LINE[n]?tr(RES_LINE[n]):'';$('resHeal').textContent=trf('夜明けに屋敷を手当てした（+{0}）',Math.round(heal));
}
function afterDawn(){if(G.night===2)runScene('mid',()=>showDay());else showDay();}
function onLose(){setState('result');sfx.lose();const earned=G.night+G.owned.length+1;memory+=earned;store.set('jugoya_memory',memory);
 setTimeout(()=>runScene('over',()=>{VIEW={k:'stage',name:'sky',n:0};setState('end');showCard('月へ',trf('{0} {1}にて',nightL(G.night),phaseL(G.night)),tr('姫は月へ帰った'),trf('月の記憶 +{0}（合計 {1}）。次は、はじめの光 +{2}',earned,memory,memBonus()),tr('もう一度'));}),700);}
function finishEnd(drink){const earned=8+G.owned.length;memory+=earned;store.set('jugoya_memory',memory);
 runScene(drink?'drink':'burn',()=>{VIEW={k:'stage',name:drink?'house':'fuji',n:4};setState('end');
  showCard('end',tr(drink?'結末 その一':'結末 その二'),tr(drink?'終わらない十五夜':'限りある日々'),trf('月の記憶 +{0}（合計 {1}）',earned,memory),tr('タイトルへ'));});}
let cardMode='';function showCard(mode,head,title,mem,btn){cardMode=mode;showWin('wCard');$('cardHead').textContent=head;$('cardTitle').textContent=title;$('cardText').textContent=tr(mode==='end'?'ここまで遊んでくれて、ありがとう。':'迎えの光は、今夜も満ちる。');$('cardMem').textContent=mem;$('btnCard').textContent=btn;}

// ===== input =====
const scr=$('screen');
function toLogical(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*LW,y:(ev.clientY-r.top)/r.height*LH};}
function nearestCell(x,y){let best=null,bd=1e9;for(let r=0;r<4;r++)for(let l=0;l<3;l++){const z=ROWZ[r],s=zs(z);const p=cellPos(l,r);const hw=LN*s*.5,hh=Math.max(10,(PY(z-.05)-PY(z+.05))/2);const d=Math.hypot((x-p.x)/hw,(y-p.y)/hh);if(d<bd){bd=d;best={l,r};}}return bd<1.25?best:null;}
let drag=null;
function cardDown(ev,k){ev.preventDefault();audioInit();if(state!=='night')return;sel=k;sfx.cursor();lastHud='';hideBubble();drag={k,moved:false,id:ev.pointerId,sx:ev.clientX,sy:ev.clientY};}
window.addEventListener('pointermove',ev=>{if(!drag||state!=='night')return;if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>8)drag.moved=true;if(!drag.moved)return;const p=toLogical(ev);N.ghost=drag.k;N.hover=p.y<408?nearestCell(p.x,p.y):null;});
window.addEventListener('pointerup',ev=>{if(!drag)return;const d=drag;drag=null;if(state==='night'&&N){if(d.moved&&N.hover)placeUnit(d.k,N.hover.l,N.hover.r);N.ghost=null;N.hover=null;}});
cv.addEventListener('pointerdown',ev=>{
 ev.preventDefault();audioInit();
 if(state==='scene'){scTap();return;}
 if(state!=='night')return;const p=toLogical(ev);
 let bo=null,bd=18;for(const o of N.orbs){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;bo=o;}}
 if(bo){N.orbs.splice(N.orbs.indexOf(bo),1);absorb(bo.x,bo.y,bo.v);addText(bo.x,bo.y-8,`+${bo.v}`,'#FFE59A',.6,12,true);burst(bo.x,bo.y,['#FFE59A','#FFFFFF','#F48FB6'],8,22,true);ring(bo.x,bo.y,'#FFE59A',12);sfx.orb();if(tut<2&&tut>=1){tut=2;store.set('jugoya_tut2',2);hideHint();}return;}
 const c=nearestCell(p.x,p.y);if(!c){hideBubble();return;}
 const u=N.units.find(u=>u.lane===c.l&&u.row===c.r);if(u){if(bubbleUnit===u)hideBubble();else showBubble(u);sfx.cursor();return;}
 hideBubble();placeUnit(sel,c.l,c.r);
});
$('dlg').addEventListener('pointerdown',()=>{});
scr.addEventListener('pointerdown',ev=>{if(state==='scene'&&ev.target!==$('btnSkip')&&ev.target!==cv){audioInit();scTap();}});
$('btnSkip').onclick=ev=>{ev.stopPropagation();skipScene();};
$('btnRetreat').onclick=()=>{if(bubbleUnit&&N){retreat(bubbleUnit);hideBubble();}};
$('btnStart').onclick=()=>{audioInit();sfx.ok();startGame();};
const tgB=()=>{audioInit();setBgm(!AU.bgm);syncSoundBtns();sfx.tap();},tgS=()=>{audioInit();setSe(!AU.se);syncSoundBtns();sfx.tap();};
$('btnBgm').onclick=tgB;$('btnBgm2').onclick=tgB;$('btnSe').onclick=tgS;$('btnSe2').onclick=tgS;
$('btnDayOk').onclick=()=>chooseOpt();
$('miniNext').onclick=()=>{sfx.ok();toNight();};
$('btnDawn').onclick=()=>{sfx.ok();afterDawn();};
$('btnDrink').onclick=()=>{sfx.ok();finishEnd(true);};$('btnBurn').onclick=()=>{sfx.ok();finishEnd(false);};
$('btnCard').onclick=()=>{sfx.ok();if(cardMode==='end')toTitle();else startRetry();};
function startRetry(){newRun();showDay();}
$('btnPause').onclick=()=>{if(state==='night'){setState('paused');showWin('wPause');syncSoundBtns();sfx.tap();}};
$('btnResume').onclick=()=>{setState('night');showWin(null);sfx.tap();};
$('btnGiveUp').onclick=()=>{setState('night');showWin(null);G.houseHP=0;};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='night'){setState('paused');showWin('wPause');syncSoundBtns();}});

// ===== main loop =====
let last=performance.now(),TT=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;TT+=dt;
 updAmb(dt);
 if(state==='night')updateNight(dt);
 if(state==='scene'&&SC)updateScene(dt);
 ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,LW,LH);
 try{
  if(state==='scene'&&SC){drawScene(TT);post(.26);drawSceneFx();}
  else if(N&&['night','paused','result'].includes(state)&&VIEW.k==='battle'){drawBattle(TT);post(.24);drawBattleOverlay(TT);}
  else if(VIEW.k==='stage'){drawStage(VIEW.name,VIEW.n,TT,{});drawStageFg(VIEW.name,VIEW.n);post(.26);ctx.fillStyle='rgba(5,3,12,.35)';ctx.fillRect(0,0,LW,LH);}
  else{drawTitle(TT);post(.3);}
 }catch(err){console.error(err);}
 if(G&&['night','paused','day','mini','result'].includes(state))hudUpdate();
 requestAnimationFrame(frame);
}
{const R=document.documentElement.style;const u=n=>`url(${sprite(n,{}).toDataURL()})`;R.setProperty('--icDown',u('ic_down'));R.setProperty('--icUp',u('ic_up'));R.setProperty('--icRight',u('ic_right'));R.setProperty('--icFF',u('ic_ff'));R.setProperty('--icPause',u('ic_pause'));R.setProperty('--icStar',u('star'));}
$('hudStar').src=sURL('star');$('hudStar').style.cssText='width:calc(var(--p)*11);height:calc(var(--p)*10)';
layout();window.addEventListener('resize',layout);if(window.ResizeObserver)new ResizeObserver(layout).observe($('fit'));
buildLogo();if(document.fonts&&document.fonts.load)document.fonts.load('40px DotGothic16').then(()=>buildLogo()).catch(()=>{});
toTitle();requestAnimationFrame(frame);

// ===== language UI =====
function applyStatic(){
 document.documentElement.lang=LANG;
 document.body.classList.toggle('nl',LANG!=='ja');
 document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.dataset.ja==null)el.dataset.ja=el.textContent;el.textContent=tr(el.dataset.ja);});
 const cur=LANGS.find(([c])=>c===LANG);$('btnLang').textContent=(LANG==='ja'?'言語：':'Language: ')+cur[1];
 syncSoundBtns();
}
function openLang(){
 showWin('wLang');const box=$('langList');box.innerHTML='';
 LANGS.forEach(([c,name])=>{const b=document.createElement('button');b.className='opt lang'+(c===LANG?' sel':'');b.lang=c;b.textContent=name;
  b.onclick=()=>{LANG=c;store.set('jugoya_lang',c);sfx.ok();applyStatic();toTitle();};box.appendChild(b);});
}
$('btnLang').onclick=()=>{audioInit();sfx.tap();openLang();};
applyStatic();

})();
</script>
</body>
</html>
