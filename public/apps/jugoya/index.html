<style>
/* Layout: one fixed 270x480 pixel screen scaled by --p (CSS px per art pixel); canvas world + pixel-window UI on top. Single night look by design. */
:root{
  --p:1.333px;
  --ink:#0B0618; --win1:#2C2266; --win2:#17103C; --gold:#F2D27A; --gold2:#A8742C;
  --txt:#FFF4DC; --sub:#B9AEE6; --hl:#FFE59A; --red:#FF6B6B; --grn:#7FE0A0; --yel:#FFD35A;
  --f:'DotGothic16','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#07040F;color:var(--txt);overflow:hidden}
#app{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#fit{position:relative;width:100%;height:100%}
#screen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--p)*270);height:calc(var(--p)*480);overflow:hidden;
  font-family:var(--f);font-size:calc(var(--p)*12);line-height:1.5;color:var(--txt);background:#000;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.a{position:absolute;left:calc(var(--p)*var(--x,0));top:calc(var(--p)*var(--y,0));width:calc(var(--p)*var(--w,10));box-sizing:border-box}
.ah{height:calc(var(--p)*var(--h,10))}
.t8{font-size:calc(var(--p)*8);line-height:1.5}
.t16{font-size:calc(var(--p)*16);line-height:1.35}
.t24{font-size:calc(var(--p)*24);line-height:1.2}
.gold{color:var(--hl)} .sub{color:var(--sub)} .cen{text-align:center}
p{margin:0}
.notch{clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pw{background:linear-gradient(180deg,var(--win1),var(--win2));
  box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 0 0 calc(var(--p)*2) var(--gold),inset 0 0 0 calc(var(--p)*3) var(--gold2),inset 0 0 0 calc(var(--p)*4) var(--ink);
  padding:calc(var(--p)*7);
  clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pw.thin{padding:calc(var(--p)*4)}
.inset{background:#0F0A2A;box-shadow:inset 0 0 0 var(--p) #3C3170;padding:calc(var(--p)*5)}
.pb{font:inherit;color:#2A1606;background:linear-gradient(180deg,#FFEDB4 0%,#F2C55A 100%);border:0;cursor:pointer;
  box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-3) 0 #C08A2E,inset 0 calc(var(--p)*2) 0 #FFF8DC;
  padding:calc(var(--p)*4) calc(var(--p)*8) calc(var(--p)*5);display:block;width:100%;text-align:center;
  clip-path:polygon(var(--p) 0,calc(100% - var(--p)) 0,100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,0 calc(100% - var(--p)),0 var(--p))}
.pb:active{transform:translateY(var(--p));box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-1) 0 #C08A2E}
.pb.sub{background:linear-gradient(180deg,#E2DAFF,#A396E6);color:#120A2E;box-shadow:inset 0 0 0 var(--p) var(--ink),inset 0 calc(var(--p)*-3) 0 #6B5FB8,inset 0 calc(var(--p)*2) 0 #F4F0FF}
.pb:focus-visible{filter:brightness(1.18)}
.pb:disabled{filter:grayscale(.85) brightness(.65);cursor:default}
.stack{display:flex;flex-direction:column;gap:calc(var(--p)*5)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*5)}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(calc(var(--p)*-2))}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.win{animation:pop .16s steps(3)}

/* HUD */
#hud .box{display:flex;align-items:center;gap:calc(var(--p)*3);height:calc(var(--p)*22);padding:0 calc(var(--p)*6)}
.gauge{display:flex;gap:var(--p);flex:1}
.seg{flex:1;height:calc(var(--p)*7);background:#2A1E4A;box-shadow:inset 0 0 0 var(--p) var(--ink)}
.seg.g{background:var(--grn)} .seg.y{background:var(--yel)} .seg.r{background:var(--red)}
#btnPause{padding:0;height:calc(var(--p)*22)}

/* command bar */
.uc{display:flex;align-items:center;gap:calc(var(--p)*4);height:calc(var(--p)*34);padding:calc(var(--p)*4) calc(var(--p)*6);cursor:pointer;border:0;font:inherit;color:var(--txt);text-align:left}
.uc .nm{display:flex;flex-direction:column;line-height:1.3}
.uc .cost{color:var(--hl)}
.uc.poor .cost{color:var(--red)}
.uc.sel{--gold:#FFF4B8;--gold2:#E8A93A;background:linear-gradient(180deg,#4A3A9A,#2A1F66)}
.uc.sel::after{content:'';position:absolute;left:50%;top:calc(var(--p)*-1);transform:translate(-50%,-80%);width:calc(var(--p)*14);height:calc(var(--p)*10);background:var(--icDown) center/100% 100% no-repeat;image-rendering:pixelated;animation:bob .6s steps(2) infinite}
.ucw{position:absolute}
.ts{display:flex;align-items:center;justify-content:center;gap:calc(var(--p)*3);height:calc(var(--p)*28);padding:calc(var(--p)*4);border:0;font:inherit;color:var(--txt);cursor:pointer;position:relative}
.ts .cd{position:absolute;left:calc(var(--p)*4);right:calc(var(--p)*4);bottom:calc(var(--p)*4);background:rgba(6,3,18,.78);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.ts.ready{--gold:#FFF4B8;animation:rdy .8s steps(2) infinite}
@keyframes rdy{50%{filter:brightness(1.25)}}
.ts.empty{opacity:.4;cursor:default}

/* hint / toast / bubble */
.hint{color:var(--hl);text-align:center;animation:bob .7s steps(2) infinite;pointer-events:none}
.hint::after{content:'';display:block;width:calc(var(--p)*14);height:calc(var(--p)*10);margin:calc(var(--p)*3) auto 0;background:var(--icDown) center/100% 100% no-repeat;image-rendering:pixelated}
.hint.up::after{content:none}.hint.up::before{content:'';display:block;width:calc(var(--p)*14);height:calc(var(--p)*10);margin:0 auto calc(var(--p)*3);background:var(--icUp) center/100% 100% no-repeat;image-rendering:pixelated}
.toast{text-align:center;pointer-events:none}

/* dialog */
#dlg{pointer-events:none}
#dlgName{color:var(--hl);padding:calc(var(--p)*3) calc(var(--p)*9);width:auto;white-space:nowrap}
#dlgBox{height:calc(var(--p)*104)}
#dlgBox.narr #dlgText{color:#E6DEFF}
#dlgText{min-height:calc(var(--p)*70);white-space:pre-wrap;text-shadow:0 var(--p) 0 rgba(6,3,18,.75)}
.adv{position:absolute;right:calc(var(--p)*10);bottom:calc(var(--p)*8);width:calc(var(--p)*14);height:calc(var(--p)*10);background:var(--icDown) center/100% 100% no-repeat;image-rendering:pixelated;animation:blink .8s steps(1) infinite}
.ic{display:inline-block;vertical-align:middle;background:center/100% 100% no-repeat;image-rendering:pixelated}
.ic.ff{width:calc(var(--p)*16);height:calc(var(--p)*14);background-image:var(--icFF);margin-left:calc(var(--p)*3)}
.ic.pz{width:calc(var(--p)*14);height:calc(var(--p)*14);background-image:var(--icPause)}
.ic.st{width:calc(var(--p)*9);height:calc(var(--p)*8);background-image:var(--icStar);margin-right:var(--p);vertical-align:-0.05em}
#btnPause{display:grid;place-items:center}

/* menu lists */
.opt{display:grid;grid-template-columns:calc(var(--p)*30) 1fr;align-items:center;gap:calc(var(--p)*5);width:100%;font:inherit;color:var(--txt);text-align:left;background:transparent;border:0;padding:calc(var(--p)*3) calc(var(--p)*4) calc(var(--p)*3) calc(var(--p)*12);cursor:pointer;position:relative}
.opt::before{content:'';position:absolute;left:calc(var(--p)*2);top:50%;transform:translateY(-50%);color:var(--hl)}
.opt.sel{background:rgba(242,210,122,.14)}
.opt.sel::before{content:'';width:calc(var(--p)*10);height:calc(var(--p)*14);background:var(--icRight) center/100% 100% no-repeat;image-rendering:pixelated;animation:blink .8s steps(1) infinite}
.opt .ic{display:grid;place-items:center;height:calc(var(--p)*28);background:#0F0A2A;box-shadow:inset 0 0 0 var(--p) #3C3170}
.tag{display:inline-block;padding:0 calc(var(--p)*3);margin-right:calc(var(--p)*3);color:var(--ink)}
.tag.trial{background:var(--hl)} .tag.up{background:#9EE7F2} .tag.prep{background:var(--grn)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--p)*6)}
.item{font:inherit;color:var(--txt);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*3);padding:calc(var(--p)*8) calc(var(--p)*2) calc(var(--p)*6)}
.item.real{--gold:#FFF4B8;background:linear-gradient(180deg,#6A5A1E,#3A2E10)}
.item.wrong{--gold:#FF9A9A;background:linear-gradient(180deg,#5A1E36,#2E0E1E)}
.pulse{animation:glow var(--pd,1.1s) steps(6) infinite}
@keyframes glow{0%,100%{filter:brightness(.42) saturate(.5)}50%{filter:brightness(1.3) drop-shadow(0 0 calc(var(--p)*4) #FFD34A)}}
.timer{display:flex;gap:var(--p)}
.timer i{flex:1;height:calc(var(--p)*6);background:var(--hl);box-shadow:inset 0 0 0 var(--p) var(--ink)}
.timer i.off{background:#2A1E4A}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*5)}
.hr{height:var(--p);background:#4A3D8A;margin:calc(var(--p)*5) 0}
@media (prefers-reduced-motion:reduce){.hint,.uc.sel::after,.ts.ready{animation:none}.win{animation:none}}
[hidden]{display:none!important}
.pw.glass{background:linear-gradient(180deg,rgba(52,40,120,.58),rgba(20,14,54,.72));-webkit-backdrop-filter:blur(calc(var(--p)*1.2));backdrop-filter:blur(calc(var(--p)*1.2));
  box-shadow:inset 0 0 0 var(--p) rgba(11,6,24,.8),inset 0 0 0 calc(var(--p)*2) rgba(242,210,122,.85),inset 0 0 0 calc(var(--p)*3) rgba(11,6,24,.5)}
.opt.lang{grid-template-columns:1fr;padding-top:calc(var(--p)*5);padding-bottom:calc(var(--p)*5)}
body.nl #hudPhase{font-size:calc(var(--p)*8)}
body.nl .uc .nm{font-size:calc(var(--p)*8);white-space:normal;line-height:1.3}
body.nl .uc .nm .t8{font-size:inherit}
body.nl .uc .nm .sub{display:none}
body.nl .ts{flex-direction:column;gap:var(--p);padding:calc(var(--p)*3)}
body.nl .ts span{font-size:calc(var(--p)*7);line-height:1;white-space:nowrap;letter-spacing:-0.02em}
body.nl .ts img{width:calc(var(--p)*11)!important;height:auto!important}
body.nl #dlgText{font-size:calc(var(--p)*11)}
#ltBox.bump{animation:hudbump .18s steps(3)}
@keyframes hudbump{50%{transform:scale(1.14);filter:brightness(1.35)}}
#screen{overflow:clip}
.pb.a,.uc.a,.ts.a{width:calc(var(--p)*var(--w,10))}
.ts.a,.uc.a{position:absolute}
.t8{font-size:calc(var(--p)*8);line-height:1.5}
.t16{font-size:calc(var(--p)*16);line-height:1.35}
.t24{font-size:calc(var(--p)*24);line-height:1.2}
#hud .box span{white-space:nowrap}
.uc .nm{line-height:1.35;white-space:nowrap}
</style>

</head>
<body>

<div id="app"><div id="fit"><div id="screen">
  <canvas id="cv" width="270" height="480" aria-label="十五夜"></canvas>

  <div id="hud" hidden>
    <div class="pw box a" style="--x:4;--y:4;--w:80"><img class="px" id="hudMoon" alt=""><span id="hudPhase">十一夜</span></div>
    <div class="pw box a" style="--x:86;--y:4;--w:110"><span class="t8 sub" data-i18n>屋敷</span><div class="gauge" id="hpG"></div></div>
    <div class="pw box a" id="ltBox" style="--x:198;--y:4;--w:46"><img class="px" id="hudStar" alt=""><span id="hudLight">0</span></div>
    <button class="pb a" id="btnPause" style="--x:246;--y:4;--w:20" aria-label="一時停止"><i class="ic pz"></i></button>
  </div>

  <div id="cmd" hidden>
    <div id="units"></div>
    <div id="trs"></div>
  </div>

  <div id="hint" class="pw thin hint a" hidden></div>
  <div id="ubub" class="pw thin a" style="--w:64" hidden><button class="pb t8" id="btnRetreat">撤収</button></div>
  <div id="toast" class="pw thin toast a" style="--x:35;--y:32;--w:200" hidden></div>

  <div id="dlg" hidden>
    <div id="dlgName" class="pw thin glass a" style="--x:8;--y:342"></div>
    <div id="dlgBox" class="pw glass a" style="--x:6;--y:362;--w:258"><p id="dlgText"></p><i class="adv"></i></div>
  </div>
  <button class="pb sub t8 a" id="btnSkip" style="--x:198;--y:6;--w:66" hidden><span data-i18n>スキップ</span><i class="ic ff"></i></button>

  <div id="wTitle" class="a win" style="--x:60;--y:292;--w:150" hidden>
    <div class="pw stack">
      <button class="pb" id="btnStart" data-i18n>はじめる</button>
      <div class="row2"><button class="pb sub t8" id="btnBgm">音楽 オン</button><button class="pb sub t8" id="btnSe">効果音 オン</button></div>
      <button class="pb sub t8" id="btnLang"></button>
      <p class="t8 sub cen" id="memTxt"></p>
    </div>
  </div>

  <div id="wDay" class="a win" style="--x:6;--y:30;--w:258" hidden>
    <div class="pw">
      <p class="t8 gold" id="dayHead"></p>
      <p id="dayStory" style="margin-top:calc(var(--p)*3)"></p>
      <div class="hr"></div>
      <div id="dayOpts"></div>
      <div class="inset" style="margin-top:calc(var(--p)*5);min-height:calc(var(--p)*58)"><p class="t8 gold" id="dayDetT"></p><p id="dayDet"></p></div>
      <button class="pb" id="btnDayOk" style="margin-top:calc(var(--p)*6)" data-i18n>これにする</button>
    </div>
  </div>

  <div id="wMini" class="a win" style="--x:15;--y:56;--w:240" hidden>
    <div class="pw stack cen">
      <p class="t8 gold" id="miniSuitor"></p>
      <p class="t16" id="miniTitle"></p>
      <p class="t8 sub" data-i18n>偽物が混ざっている。月と同じ間合いで光るものが本物。</p>
      <div style="display:grid;place-items:center"><img class="px pulse" id="miniMoon" alt="月"></div>
      <div class="items" id="miniItems"></div>
      <div class="timer" id="miniTimer"></div>
      <p id="miniRes" style="min-height:1.5em"></p>
      <button class="pb" id="miniNext" hidden data-i18n>夜を迎える</button>
    </div>
  </div>

  <div id="wResult" class="a win" style="--x:22;--y:96;--w:226" hidden>
    <div class="pw stack">
      <p class="t8 gold cen" id="resHead"></p>
      <p class="t16 cen" data-i18n>夜をしのいだ</p>
      <div class="stats" id="resStats"></div>
      <div class="inset"><p id="resLine"></p></div>
      <p class="t8 sub" id="resHeal"></p>
      <button class="pb" id="btnDawn" data-i18n>夜が明ける</button>
    </div>
  </div>

  <div id="wChoice" class="a win" style="--x:30;--y:300;--w:210" hidden>
    <div class="pw stack">
      <p class="cen gold" data-i18n>不死の薬を、どうする？</p>
      <button class="pb" id="btnDrink" data-i18n>薬を飲む</button>
      <button class="pb sub" id="btnBurn" data-i18n>薬を燃やす</button>
    </div>
  </div>

  <div id="wCard" class="a win" style="--x:22;--y:150;--w:226" hidden>

      <p class="t8 gold" id="cardHead"></p>

      <button class="pb" id="btnCard">タイトルへ</button>

  </div>

  <div id="wLang" class="a win" style="--x:45;--y:110;--w:180" hidden>
    <div class="pw"><div id="langList"></div></div>
  </div>

  <div id="wPause" class="a win" style="--x:45;--y:150;--w:180" hidden>
    <div class="pw stack">
      <p class="cen gold" data-i18n>ひと休み</p>
      <button class="pb" id="btnResume" data-i18n>続ける</button>
      <div class="row2"><button class="pb sub t8" id="btnBgm2">音楽 オン</button><button class="pb sub t8" id="btnSe2">効果音 オン</button></div>
      <button class="pb sub" id="btnGiveUp" data-i18n>あきらめる</button>
    </div>
  </div>
</div></div></div>
<script>
(()=>{

'use strict';
// ===== core =====
const LW=270,LH=480;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

const OL_INK='#0B0618';

const SPC={};
function sprite(name,o={}){
 const key=name+'|'+(o.sw?JSON.stringify(o.sw):'')+'|'+(o.m||'n')+'|'+(o.ol||'')+'|'+(o.col||'')+'|'+(o.rim||'');
 if(SPC[key])return SPC[key];
 const rows=SPR[name];const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
 const grid=[];
 for(let j=0;j<h;j++){grid[j]=[];for(let i=0;i<w;i++){let ch=rows[j][i]||'.';if(o.sw&&o.sw[ch])ch=o.sw[ch];grid[j][i]=PAL[ch]||null;}}
 const [c,x]=mk(w+2,h+2);
 if(o.ol){x.fillStyle=o.m==='s'?o.col:o.ol;
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(grid[j]&&grid[j][i])continue;
   if((grid[j]&&(grid[j][i-1]||grid[j][i+1]))||(grid[j-1]&&grid[j-1][i])||(grid[j+1]&&grid[j+1][i]))x.fillRect(i+1,j+1,1,1);}}
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=grid[j][i];if(col){x.fillStyle=o.m==='w'?'#FFFFFF':o.m==='s'?o.col:col;x.fillRect(i+1,j+1,1,1);}}
 if(o.rim&&!o.m){x.fillStyle=o.rim;for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!grid[j][i])continue;const top=!(grid[j-1]&&grid[j-1][i]),lef=!grid[j][i-1],rig=!grid[j][i+1];
  if(top){x.globalAlpha=.75;x.fillRect(i+1,j+1,1,1);}else if(lef||rig){x.globalAlpha=lef?.42:.22;x.fillRect(i+1,j+1,1,1);}}x.globalAlpha=1;}
 let bp=0;for(let j=h-1;j>=0;j--){if(grid[j].some(v=>v))break;bp++;}c.pad=bp+1;
 return SPC[key]=c;
}
const URLC={};
function sURL(name,ol=OL_INK){const k=name+ol;return URLC[k]||(URLC[k]=sprite(name,{ol}).toDataURL());}
function sImg(name,scale=1,ol=OL_INK){const c=sprite(name,{ol});return `<img class="px" alt="" src="${sURL(name,ol)}" style="width:calc(var(--p)*${c.width*scale});height:calc(var(--p)*${c.height*scale})">`;}
function moonURL(frac,r=6){
 const n=r*2+3;const [c,x]=mk(n,n);const cx=r+1.5,cy=r+1.5;const sx=cx-2*r*frac-.5;
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=i+.5-cx,dy=j+.5-cy;const d=Math.hypot(dx,dy);
  if(d<=r){const sh=Math.hypot(i+.5-sx,dy)<r;x.fillStyle=sh?'#2A2458':(dx+dy>r*.5?'#F5C842':'#FFF1A8');x.fillRect(i,j,1,1);}
  else if(d<=r+1.2){x.fillStyle=OL_INK;x.fillRect(i,j,1,1);}}
 return c.toDataURL();
}

それを売って暮らす翁がいた。":"很久以前，有一位老翁，以砍竹编篮编筐、拿去卖为生。","あいたた……腰が。今日はこのへんで切り上げるか。":"哎哟哟……我的腰。今天就到这儿吧。","……なんじゃ。あの竹、根元が光っとる。":"……怎么回事。那根竹子，根部在发光。","節の中に、手のひらに乗るほどの女の子が座っていた。":"竹节之中，坐着一个只有手掌大小的女孩。","それから翁が竹を切るたび、節から黄金がこぼれ出た。":"从那以后，老翁每砍一次竹子，竹节里就会滚出黄金。","媼":"老妪","あんた、また金。もう米びつに入らないよ。":"又是金子。米缸都装不下了。","米びつが足りんなら蔵を建てりゃええ。蔵が足りんなら、もう一棟じゃ。":"米缸装不下就盖仓库。仓库装不下，再盖一栋。","婆さん、明日から竹林を三つ買い足すぞ。":"老婆子，明天起再买三片竹林。","三月で、姫は大人の背丈になった。そのあいだに屋敷は三回建て替わり、三回とも金箔張りになった。":"三个月，公主就长成了大人。这期间，宅邸翻修了三次，每次都贴满了金箔。","その年の秋。姫は夜になると縁側に出て、月ばかり見るようになった。":"那年秋天，公主一到夜里就坐到廊下，只是望着月亮。","冷えるぞ。何ぞ、あったか。":"天凉了。出什么事了？","かぐや":"辉夜","お爺さん。わたし、月の都から来たの。次の十五夜に、迎えが来る。":"爷爷。我是从月亮上的都城来的。下一个十五夜，会有人来接我。","迎えって、あんた……。":"来接你？你这孩子……","……迎えの者は、手ぶらで来るんかの。":"……来接人的，会空着手来吗？","お爺さん。":"爷爷。","冗談じゃ。来るなら来ればええ。金ならある。":"开玩笑的。要来就让他们来。咱有的是钱。","そういう問題じゃないのよ。":"不是钱的问题。","金で片づかん問題は、たいてい金が足りとらんのじゃ。":"钱解决不了的问题，多半是钱不够。","翁は黄金で兵を雇った。足軽が百人、門の前に並んだ。":"老翁用黄金雇了兵。一百名足轻在门前排开。","中将":"中将","帝の命で参った中将である。……百人？ 私兵の数ではないな。":"我乃奉帝命而来的中将。……一百人？这可不是私兵的规模。","足りんかったら、また竹を切ります。百本でも千本でも。":"不够的话，我再去砍竹子。一百根，一千根都行。","あと、光る星が落ちとったら拾うてくだされ。一粒でも落としたら給金から引きますでな。":"还有，看到地上有发光的星星，请捡起来。掉一颗就从工钱里扣。","……この家は、どうなっておるのだ。":"……这一家到底是怎么回事。","一夜目を退けた朝。屋敷の前に、金ぴかの牛車が止まった。":"撑过第一夜的早晨，一辆金光闪闪的牛车停在了宅邸前。","姫に求婚しに参った！ 見よ、蓬莱の玉の枝じゃ！":"我是来向公主求婚的！看，蓬莱玉枝！","……枝に、職人さんの請求書が挟まってるわよ。":"……枝上还夹着工匠的账单呢。","なっ。……ま、まあ、戦の役には立つかもしれん。置いていく！":"什么。……嗯、嗯，说不定打仗用得上。放这儿了！","……この枝、なんぼで売れるかの。":"……这根树枝，能卖多少钱呢。","偽物の枝は、なぜか夜になると光り出した。":"不知为何，那根假树枝一到夜里就发光。","三日目の夜明け前。翁と姫は縁側にいた。":"第三天黎明前。老翁和公主坐在廊下。","お爺さん。その黄金、どこから出てると思う？":"爷爷。你觉得那些黄金是从哪儿来的？","竹からじゃ。":"从竹子里。","竹の向こうはね、月の蔵なの。":"竹子的另一头，是月亮的宝库。","わたしが竹に入れられてから、ずっと漏れてたのよ。":"自从我被放进竹子里，就一直在漏。","つまり、わしは。":"也就是说，我……","毎日、月の国庫に穴をあけてたの。":"每天都在给月亮的国库打洞。","……その穴、もう少し広げられんかの。":"……那个洞，能不能再开大一点。","お爺さん！":"爷爷！","冗談じゃ。半分はな。……朝飯、何がええ。":"开玩笑的。一半是。……早饭，想吃什么？","話をそらさないで。……お粥。梅のやつ。":"别岔开话题。……粥。放梅子的。","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"听到传闻的帝，把都城的兵全派来了。足足一万。","帝からの書状です。「面白そうだから全部出す」と。":"这是帝的书信。“看起来很有趣，全派出去。”","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"接着，被公主拒绝的五位皇子，各自扛着宝物出现了。","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"发光的钵！这回是真品。大概。","龍は見 砍過來的。」","車持皇子「見たか！ 偽物でも役に立ったであろう！」":"車持皇子：「看到了吧！假貨也派上用場了！」","翁「数えるのはやめた。桁が足りん。……いや、やっぱり数える」":"老翁：「不數了。位數不夠。……不，還是要數。」","大伴御行「龍の絵、思ったより効いたな」":"大伴御行：「那幅龍畫，比想像中管用。」","屋敷":"宅邸","スキップ":"跳過","はじめる":"開始","これにする":"就選這個","偽物が混ざっている。月と同じ間合いで光るものが本物。":"其中混有假貨。與月亮同節奏閃光的才是真品。","夜を迎える":"迎接夜晚","夜をしのいだ":"撐過了這一夜","夜が明ける":"天亮了","不死の薬を、どうする？":"不死之藥，要怎麼處置？","薬を飲む":"喝下藥","薬を燃やす":"燒掉藥","ひと休み":"稍作休息","続ける":"繼續","あきらめる":"放棄","十一夜":"十一夜","十二夜":"十二夜","十三夜":"十三夜","十四夜":"十四夜","十五夜":"十五夜"},"ko":{"翁":"할아버지","光の星を生む":"빛의 별을 만든다","弓兵":"궁병","遠くを射る":"멀리 쏜다","槍兵":"창병","前で止める":"앞에서 막는다","仏の御石の鉢":"빛나는 돌 그릇","石作皇子":"이시츠쿠리 황자","結界":"결계","6秒のあいだ屋敷が傷つかない":"6초 동안 저택이 피해를 받지 않는다","蓬莱の玉の枝":"봉래의 옥가지","車持皇子":"구라모치 황자","玉実":"옥열매","光を8得る":"빛을 8 얻는다","火鼠の皮衣":"불쥐 가죽옷","阿倍御主人":"아베노 미우시","火炎":"화염","すべての敵に40の炎":"모든 적에게 40의 불꽃","龍の首の珠":"용의 목 구슬","大伴御行":"오토모노 미유키","雷鳴":"뇌명","すべての敵を4秒止める":"모든 적을 4초 멈춘다","燕の子安貝":"제비의 조개","石上麻呂足":"이소노카미노 마로타리","癒し":"치유","屋敷を30なおす":"저택을 30 고친다","いまは昔。竹を取っては籠や笊に編み、それを売って暮らす翁がいた。":"옛날 옛적, 대나무를 베어 바구니와 소쿠리를 엮어 팔며 사는 할아버지가 있었다.","あいたた……腰が。今日はこのへんで切り上げるか。":"아이고고… 허리야. 오늘은 이쯤에서 접을까.","……なんじゃ。あの竹、根元が光っとる。":"…뭐지. 저 대나무, 밑동이 빛나고 있네.","節の中に、手のひらに乗るほどの女の子が座っていた。":"마디 속에, 손바닥에 올라갈 만한 여자아이가 앉아 있었다.","それから翁が竹を切るたび、節から黄金がこぼれ出た。":"그 뒤로 할아버지가 대나무를 벨 때마다 마디에서 황금이 쏟아졌다.","媼":"할머니","あんた、また金。もう米びつに入らないよ。":"영감, 또 금이에요? 이제 쌀독에도 안 들어가요.","米びつが足りんなら蔵を建てりゃええ。蔵が足りんなら、もう一棟じゃ。":"쌀독이 모자라면 곳간을 지으면 돼. 곳간이 모자라면 한 채 더.","婆さん、明日から竹林を三つ買い足すぞ。":"할멈, 내일부터 대나무 숲 세 개 더 사들인다.","三月で、姫は大人の背丈になった。そのあいだに屋敷は三回建て替わり、三回とも金箔張りになった。":"석 달 만에 공주는 어른이 되었다. 그동안 저택은 세 번 새로 지어졌고, 세 번 모두 금박을 입혔다.","その年の秋。姫は夜になると縁側に出て、月ばかり見るようになった。":"그해 가을. 공주는 밤이 되면 툇마루에 나가 달만 바라보게 되었다.","冷えるぞ。何ぞ、あったか。":"쌀쌀하다. 무슨 일 있느냐.","かぐや":"가구야","お爺さん。わたし、月の都から来たの。次の十五夜に、迎えが来る。":"할아버지. 저, 달의 도성에서 왔어요. 다음 보름에 데리러 와요.","迎えって、あんた……。":"데리러 온다니, 얘야…","……迎えの者は、手ぶらで来るんかの。":"…데리러 오는 자들은 빈손으로 오려나.","お爺さん。":"할아버지.","冗談じゃ。来るなら来ればええ。金ならある。":"농담이다. 올 테면 오라지. 돈은 있다.","そういう問題じゃないのよ。":"그런 문제가 아니에요.","金で片づかん問題は、たいてい金が足りとらんのじゃ。":"돈으로 안 풀리는 문제는, 대개 돈이 모자란 거다.","翁は黄金で兵を雇った。足軽が百人、門の前に並んだ。":"할아버지는 황금으로 병사를 샀다. 보병 백 명이 문 앞에 늘어섰다.","中将":"중장","帝の命で参った中将である。……百人？ 私兵の数ではないな。":"임금의 명으로 온 중장이오. …백 명? 사병 규모가 아니로군.","足りんかったら、また竹を切ります。百本でも千本でも。":"모자라면 대나무를 더 베겠습니다. 백 그루든 천 그루든.","あと、光る星が落ちとったら拾うてくだされ。一粒でも落としたら給金から引きますでな。":"그리고 빛나는 별이 떨어져 있으면 주워 주시오. 한 알이라도 흘리면 급료에서 깝니다.","……この家は、どうなっておるのだ。":"…이 집은 대체 어떻게 된 거요.","一夜目を退けた朝。屋敷の前に、金ぴかの牛車が止まった。":"첫날 밤을 버틴 아침. 번쩍이는 금빛 소달구지가 저택 앞에 멈췄다.","姫に求婚しに参った！ 見よ、蓬莱の玉の枝じゃ！":"공주에게 청혼하러 왔소! 보시오, 봉래의 옥가지요!","……枝に、職人さんの請求書が挟まってるわよ。":"…가지에 장인의 청구서가 끼어 있네요.","なっ。……ま、まあ、戦の役には立つかもしれん。置いていく！":"뭣. …뭐, 뭐어, 싸움에는 쓸모 있을지도 모르지. 두고 가겠소!","……この枝、なんぼで売れるかの。":"…이 가지, 얼마에 팔릴까.","偽物の枝は、なぜか夜になると光り出した。":"가짜 가지는 웬일인지 밤이 되면 빛나기 시작했다.","三日目の夜明け前。翁と姫は縁側にいた。":"사흘째 새벽 전. 할아버지와 공주는 툇마루에 있었다.","お爺さん。その黄金、どこから出てると思う？":"할아버지. 그 황금, 어디서 나온다고 생각해요?","竹からじゃ。":"대나무에서지.","竹の向こうはね、月の蔵なの。":"대나무 건너편은요, 달의 곳간이에요.","わたしが竹に入れられてから、ずっと漏れてたのよ。":"제가 대나무에 넣어진 뒤로 계속 새고 있었어요.","つまり、わしは。":"그러니까 나는…","毎日、月の国庫に穴をあけてたの。":"매일 달의 국고에 구멍을 내고 있었던 거예요.","……その穴、もう少し広げられんかの。":"…그 구멍, 조금 더 넓힐 수 없을까.","お爺さん！":"할아버지!","冗談じゃ。半分はな。……朝飯、何がええ。":"농담이다. 반쯤은. …아침은 뭘 먹고 싶으냐.","話をそらさないで。……お粥。梅のやつ。":"말 돌리지 마세요. …죽이요. 매실 넣은 거.","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"소문을 들은 임금은 도성의 병사를 몽땅 보냈다. 그 수가 무려 만.","帝からの書状です。「面白そうだから全部出す」と。":"임금의 서신입니다. \"재밌어 보이니 전부 보낸다\"고.","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"게다가 공주에게 차인 다섯 황자가 저마다 보물을 메고 나타났다.","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"빛나는 그릇이오! 이번엔 진짜요. 아마도.","龍は見つからなんだ。代わりに龍の絵を描いてきた！":"용은 못 찾았소. 대신 용 그림을 그려 왔소!","日当は出来高払いじゃ。倒した数だけ払う。並んでくだされ。":"일당은 성과급이오. 쓰러뜨린 만큼 드리지. 줄 서 주시오.","月は、目に見えて大きくなっていた。":"달은 눈에 띄게 커지고 있었다.","十五夜。月は空の半分を覆っていた。":"보름밤. 달이 하늘의 절반을 덮고 있었다.","近い……！ 月が、落ちてくる！":"가깝다…! 달이 떨어진다!","天人の王":"천인의 왕","地上の者よ。この三月で、月の国庫から黄金が三億両消えた。":"지상의 자들이여. 이 석 달 동안 달의 국고에서 황금 삼억 냥이 사라졌다.","姫は、漏れを塞ぐ栓として竹に詰めておいたのだ。":"공주는 새는 구멍을 막는 마개로 대나무에 넣어 두었던 것이다.","三億？ わしの帳簿じゃ、五億はあったがの。":"삼억? 내 장부엔 적어도 오억은 있었는데.","……いや待て。栓？ わしの娘を、栓に。":"…아니, 잠깐. 마개? 내 딸을 마개로.","栓を返せ。さもなくば、月ごと取り立てに参る。":"마개를 돌려 다오. 아니면 달째로 받으러 가겠다.","金は返す。……三割くらいなら。娘は一厘も返さん。":"금은 돌려주지. …삼 할 정도라면. 딸은 한 푼도 못 준다.","お爺さん……！":"할아버지…!","全軍、構え！ 相手は月だ！":"전군, 준비! 상대는 달이다!","天の羽衣を着せかけられると、姫はもう泣かなかった。":"하늘의 날개옷이 덮이자 공주는 더 이상 울지 않았다.","お爺さん。……あれ。わたし、何を言おうとしたんだっけ。":"할아버지. …어라. 제가 무슨 말을 하려고 했더라.","栓が戻ると、竹から黄金が出ることは二度となかった。":"마개가 돌아가자, 대나무에서 황금이 나오는 일은 두 번 다시 없었다.","月はゆっくりと空へ戻っていった。あとに降ってきたのは、黄金の雨だった。":"달은 천천히 하늘로 돌아갔다. 뒤이어 내린 것은 황금의 비였다.","……退いた。月が、退いたぞ！":"…물러갔다. 달이 물러갔다!","拾え！ 全部拾え！ 腰なんぞ後でええ！":"주워라! 전부 주워라! 허리는 나중에!","これ……あの人が置いていったの。不死の薬。「利子だ」って。":"이거… 그 사람이 두고 갔어요. 불사의 약. \"이자\"래요.","利子なら、元本はどこじゃ。":"이자라면, 원금은 어디 있소.","飲めば年を取らない。病にもならない。ずっと、このまま。":"마시면 늙지 않아요. 병도 안 걸려요. 계속 이대로.","わしもか。":"나도냐.","お爺さんも、お婆さんも。わたしも。":"할아버지도, 할머니도. 저도요.","それからというもの、月は一度も欠けなかった。":"그 뒤로 달은 한 번도 이지러지지 않았다.","今夜も満月だねえ。":"오늘 밤도 보름달이구먼.","昨日も、その前もね。":"어제도, 그 전날도요.","……ええ月じゃ。":"…좋은 달이구나.","三人は同じ夜を、何度でも迎えた。竹からは、今も黄金が出続けている。":"셋은 같은 밤을 몇 번이고 맞이했다. 대나무에서는 지금도 황금이 나온다.","薬は、天にいちばん近い山の頂で焚かれた。":"약은 하늘에 가장 가까운 산꼭대기에서 태워졌다.","帝も、それがよいと仰せでした。あと、黄金を少し分けてほしいと。":"임금께서도 그게 좋겠다고 하셨소. 그리고 황금을 조금 나눠 달라고.","煙、月まで届くかな。":"연기, 달까지 닿을까요.","もったいない……売れば国が買えたのに。":"아깝다… 팔았으면 나라를 샀을 텐데.","まあええ。腹が減った。帰って粥にしよう。":"뭐, 됐다. 배고프다. 돌아가서 죽 쑤자.","梅のやつね。":"매실 넣은 거요.","その山はのちに「ふじ」と呼ばれるようになった、という。":"그 산은 훗날 '후지'라 불리게 되었다고 한다.","かぐや姫 防衛記":"가구야 공주 달빛 수호기","降臨":"강림","そこにはもう兵がいる":"거기엔 이미 병사가 있다","光が足りない（あと{0}）":"빛이 부족하다 ({0} 더 필요)","光 +{0}":"빛 +{0}","連撃 光+{0}":"연격 빛+{0}","屋敷 +{0}":"저택 +{0}","羽衣の魅了":"날개옷의 매혹","結界！":"결계!","光の星をタップ！":"빛의 별을 탭!","のこり {0}":"남은 적 {0}","連撃":"연격","黄金竹ラッシュ":"황금 대나무 러시","光の星が降ってくる":"빛의 별이 쏟아진다","帝の援軍":"임금의 원군","一万騎の矢の雨":"만 기의 화살비","偽物だった！":"가짜였다!","蓬莱の玉の枝（偽）が大爆発":"가짜 봉래 옥가지 대폭발","桁が上がった！":"자릿수가 올랐다!","すべての数が ×{0}":"모든 숫자 ×{0}","撤収":"철수","音楽 {0}":"음악 {0}","効果音 {0}":"효과음 {0}","宝":"보물","{0}（未入手）":"{0} (미획득)","月の記憶 {0}（はじめの光 +{1}）":"달의 기억 {0} (시작 빛 +{1})","負けても「月の記憶」が残る":"져도 '달의 기억'은 남는다","第{0}日 昼　今宵は{1}":"{0}일째 낮　오늘 밤은 {1}","難題":"난제","{0}の難題":"{0}의 난제","「{0}」の真贋を見極める。本物なら夜の技「{1}」が使える。{2}。":"'{0}'의 진위를 가린다. 진짜라면 밤의 기술 '{1}'을 쓸 수 있다: {2}.","鍛錬":"단련","弓兵を鍛える":"궁병을 단련한다","弓兵の攻撃が35%上がる。いま Lv{0}。":"궁병 공격 35% 상승. 현재 Lv{0}.","槍兵を鍛える":"창병을 단련한다","槍兵の体力と攻撃が35%上がる。いま Lv{0}。":"창병 체 일 달","十三夜":"13일 달","十四夜":"14일 달","十五夜":"보름달"},"fr":{"翁":"Grand-père","光の星を生む":"Crée des étoiles","弓兵":"Archer","遠くを射る":"Tire de loin","槍兵":"Lancier","前で止める":"Bloque devant","仏の御石の鉢":"Bol de pierre lumineux","石作皇子":"Prince Ishitsukuri","結界":"Garde","6秒のあいだ屋敷が傷つかない":"La maison ne subit aucun dégât pendant 6 s","蓬莱の玉の枝":"Branche de Hôrai","車持皇子":"Prince Kuramochi","玉実":"Fruit","光を8得る":"Gagne 8 de lumière","火鼠の皮衣":"Robe du rat de feu","阿倍御主人":"Abe no Miushi","火炎":"Brasier","すべての敵に40の炎":"40 de feu à tous les ennemis","龍の首の珠":"Joyau du dragon","大伴御行":"Ôtomo no Miyuki","雷鳴":"Tonnerre","すべての敵を4秒止める":"Fige tous les ennemis 4 s","燕の子安貝":"Coquille d'hirondelle","石上麻呂足":"Isonokami no Marotari","癒し":"Soin","屋敷を30なおす":"Répare la maison de 30","いまは昔。竹を取っては籠や笊に編み、それを売って暮らす翁がいた。":"Il était une fois un vieil homme qui coupait le bambou, en tressait des paniers et vivait de leur vente.","あいたた……腰が。今日はこのへんで切り上げるか。":"Aïe, aïe... mon dos. J'arrête là pour aujourd'hui.","……なんじゃ。あの竹、根元が光っとる。":"... Qu'est-ce que c'est ? Ce bambou brille à sa base.","節の中に、手のひらに乗るほどの女の子が座っていた。":"Dans la tige était assise une petite fille, pas plus grande que sa paume.","それから翁が竹を切るたび、節から黄金がこぼれ出た。":"Dès lors, chaque fois que Grand-père coupait un bambou, de l'or s'en échappait.","媼":"Grand-mère","あんた、また金。もう米びつに入らないよ。":"Encore de l'or ? Il ne rentre plus dans le coffre à riz.","米びつが足りんなら蔵を建てりゃええ。蔵が足りんなら、もう一棟じゃ。":"Si le coffre à riz est trop petit, on bâtit un grenier. Si le grenier ne suffit pas, un autre.","婆さん、明日から竹林を三つ買い足すぞ。":"Mémé, dès demain on achète trois bambouseraies de plus.","三月で、姫は大人の背丈になった。そのあいだに屋敷は三回建て替わり、三回とも金箔張りになった。":"En trois mois, la princesse devint adulte. Entre-temps, la maison fut reconstruite trois fois, et dorée à la feuille chaque fois.","その年の秋。姫は夜になると縁側に出て、月ばかり見るようになった。":"Cet automne-là, la princesse se mit à sortir chaque nuit sur la véranda, pour ne regarder que la lune.","冷えるぞ。何ぞ、あったか。":"Il fait frais. Il s'est passé quelque chose ?","かぐや":"Kaguya","お爺さん。わたし、月の都から来たの。次の十五夜に、迎えが来る。":"Grand-père. Je viens de la cité de la lune. À la prochaine pleine lune, on viendra me chercher.","迎えって、あんた……。":"Te chercher ? Mais ma petite...","……迎えの者は、手ぶらで来るんかの。":"... Ceux qui viennent te chercher, ils viendront les mains vides ?","お爺さん。":"Grand-père.","冗談じゃ。来るなら来ればええ。金ならある。":"Je plaisante. Qu'ils viennent. On a de l'argent.","そういう問題じゃないのよ。":"Ce n'est pas la question.","金で片づかん問題は、たいてい金が足りとらんのじゃ。":"Quand l'argent ne règle pas un problème, c'est qu'il n'y en a pas assez.","翁は黄金で兵を雇った。足軽が百人、門の前に並んだ。":"Grand-père engagea des soldats avec son or. Cent fantassins s'alignèrent devant la porte.","中将":"Général","帝の命で参った中将である。……百人？ 私兵の数ではないな。":"Je suis le général envoyé par l'Empereur. ... Cent ? Ce n'est pas une garde privée.","足りんかったら、また竹を切ります。百本でも千本でも。":"Si ça ne suffit pas, je couperai encore du bambou. Cent tiges, mille tiges.","あと、光る星が落ちとったら拾うてくだされ。一粒でも落としたら給金から引きますでな。":"Et si vous voyez des étoiles lumineuses par terre, ramassez-les. Une seule perdue, et c'est retenu sur la solde.","……この家は、どうなっておるのだ。":"... Mais qu'est-ce que c'est que cette famille ?","一夜目を退けた朝。屋敷の前に、金ぴかの牛車が止まった。":"Au matin de la première nuit, un char à bœufs doré s'arrêta devant la maison.","姫に求婚しに参った！ 見よ、蓬莱の玉の枝じゃ！":"Je viens demander la main de la princesse ! Voyez la Branche de Hôrai !","……枝に、職人さんの請求書が挟まってるわよ。":"... Il y a la facture de l'artisan coincée dans la branche.","なっ。……ま、まあ、戦の役には立つかもしれん。置いていく！":"Quoi ! B-bon, elle servira peut-être au combat. Je la laisse !","……この枝、なんぼで売れるかの。":"... Combien pourrait-on vendre cette branche ?","偽物の枝は、なぜか夜になると光り出した。":"Sans raison, la fausse branche se mit à briller la nuit.","三日目の夜明け前。翁と姫は縁側にいた。":"Avant l'aube du troisième jour, Grand-père et la princesse étaient sur la véranda.","お爺さん。その黄金、どこから出てると思う？":"Grand-père. D'où crois-tu que vient cet or ?","竹からじゃ。":"Du bambou.","竹の向こうはね、月の蔵なの。":"De l'autre côté du bambou, il y a le coffre de la lune.","わたしが竹に入れられてから、ずっと漏れてたのよ。":"Ça fuit depuis qu'on m'a mise dans le bambou.","つまり、わしは。":"Autrement dit, moi...","毎日、月の国庫に穴をあけてたの。":"Tu perçais un trou dans le trésor de la lune tous les jours.","……その穴、もう少し広げられんかの。":"... Ce trou, on ne pourrait pas l'agrandir un peu ?","お爺さん！":"Grand-père !","冗談じゃ。半分はな。……朝飯、何がええ。":"Je plaisante. À moitié. ... Tu veux quoi pour le petit-déjeuner ?","話をそらさないで。……お粥。梅のやつ。":"Ne change pas de sujet. ... Du gruau de riz. Avec une prune.","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"Ayant eu vent de l'affaire, l'Empereur envoya tous les soldats de la capitale. Dix mille.","帝からの書状です。「面白そうだから全部出す」と。":"Une lettre de l'Empereur : « Ça a l'air amusant, envoyez tout le monde. »","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"Puis les cinq princes éconduits arrivèrent, chacun portant un trésor.","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"Un bol lumineux ! Le vrai, cette fois. Sans doute.","龍は見つからなんだ。代わりに龍の絵を描いてきた！":"Pas trouvé de dragon. Alors j'en ai peint un !","日当は出来高払いじゃ。倒した数だけ払う。並んでくだされ。":"Payé au résultat. Une pièce par ennemi. En rang.","月は、目に見えて大きくなっていた。":"La lune grossissait à vue d'œil.","十五夜。月は空の半分を覆っていた。":"La pleine lune. Elle couvrait la moitié du ciel.","近い……！ 月が、落ちてくる！":"Si proche... ! La lune tombe !","天人の王":"Roi de la lune","地上の者よ。この三月で、月の国庫から黄金が三億両消えた。":"Gens de la terre. En trois mois, trois cents millions de ryō d'or ont disparu du trésor de la lune.","姫は、漏れを塞ぐ栓として竹に詰めておいたのだ。":"Nous avions placé la princesse dans le bambou comme bouchon pour la fuite.","三億？ わしの帳簿じゃ、五億はあったがの。":"Trois cents millions ? Dans mes livres, il y en avait au moins cinq cents.","……いや待て。栓？ わしの娘を、栓に。":"... Attendez. Un bouchon ? Vous avez fait de ma fille un bouchon.","栓を返せ。さもなくば、月ごと取り立てに参る。":"Rendez le bouchon. Sinon, nous viendrons nous servir avec la lune entière.","金は返す。……三割くらいなら。娘は一厘も返さん。":"L'or, je le rends. ... Disons trente pour cent. Ma fille, pas un brin.","お爺さん……！":"Grand-père... !","全軍、構え！ 相手は月だ！":"Toutes les troupes, en position ! On affronte la lune !","天の羽衣を着せかけられると、姫はもう泣かなかった。":"Une fois le voile céleste posé sur elle, la princesse ne pleura plus.","お爺さん。……あれ。わたし、何を言おうとしたんだっけ。":"Grand-père... Tiens. Qu'est-ce que je voulais dire, déjà ?","栓が戻ると、竹から黄金が出ることは二度となかった。":"Le bouchon remis en place, plus jamais le bambou ne donna d'or.","月はゆっくりと空へ戻っていった。あとに降ってきたのは、黄金の雨だった。":"La lune remonta lentement dans le ciel. Derrière elle tomba une pluie d'or.","……退いた。月が、退いたぞ！":"... Elle recule. La lune recule !","拾え！ 全部拾え！ 腰なんぞ後でええ！":"Ramassez ! Ramassez tout ! Mon dos attendra !","これ……あの人が置いていったの。不死の薬。「利子だ」って。":"Ça... il l'a laissé. L'élixir d'immortalité. « Les intérêts », a-t-il dit.","利子なら、元本はどこじゃ。":"Si c'est l'intérêt, où est le capital ?","飲めば年を取らない。病にもならない。ずっと、このまま。":"Si on le boit, on ne vieillit plus. On ne tombe plus malade. Toujours comme maintenant.","わしもか。":"Moi aussi ?","お爺さんも、お婆さんも。わたしも。":"Toi, et Grand-mère. Et moi.","それからというもの、月は一度も欠けなかった。":"Depuis ce jour, la lune ne décrut plus jamais.","今夜も満月だねえ。":"Encore la pleine lune ce soir.","昨日も、その前もね。":"Comme hier. Et avant-hier.","……ええ月じゃ。":"... Belle lune.","三人は同じ夜を、何度でも迎えた。竹からは、今も黄金が出続けている。":"Tous les trois accueillirent la même nuit, encore et encore. Le bambou donne toujours de l'or.","薬は、天にいちばん近い山の頂で焚かれた。":"L'élixir fut brûlé au sommet de la montagne la plus proche du ciel.","帝も、それがよいと仰せでした。あと、黄金を少し分けてほしいと。":"L'Empereur aussi a dit que c'était mieux ainsi. Et il voudrait un peu d'or.","煙、月まで届くかな。":"La fumée atteindra-t-elle la lune ?","もったいない……売れば国が買えたのに。":"Quel gâchis... on aurait pu s'acheter un pays.","まあええ。腹が減った。帰って粥にしよう。":"Bon. J'ai faim. Rentrons faire du gruau.","梅のやつね。":"Avec une prune.","その山はのちに「ふじ」と呼ばれるようになった、という。":"On dit que cette montagne fut plus tard appelée « Fuji ».","かぐや姫 防衛記":"Kaguya : la défense du clair de lune","降臨":"descend","そこにはもう兵がいる":"Il y a déjà un soldat ici","光が足りない（あと{0}）":"Pas assez de lumière (encore {0})","光 +{0}":"Lumière +{0}","連撃 光+{0}":"Combo : lumière +{0}","屋敷 +{0}":"Maison +{0}","羽衣の魅了":"Charme du voile","結界！":"Garde !","光の星をタップ！":"Touchez l'étoile !","のこり {0}":"Restants {0}","連撃":"Combo","黄金竹ラッシュ":"Ruée du bambou d'or","光の星が降ってくる":"Des étoiles tombent du ciel","帝の援軍": in","限りある日々":"Des jours comptés","ここまで遊んでくれて、ありがとう。":"Merci d'avoir joué jusqu'au bout.","迎えの光は、今夜も満ちる。":"La lumière qui vient la chercher montera encore ce soir.","光る鉢、投げる！":"Bol lumineux, attention !","燃えない皮衣、燃えたぞ！":"La robe ininflammable a brûlé !","龍の絵を見よ！":"Admirez mon dragon peint !","燕の貝、落としてしもうた！":"Oups, la coquille est tombée !","枝なら、もう一本ある！":"J'ai une autre branche !","拾え！ 一粒残らず拾え！":"Ramassez ! Jusqu'à la dernière !","見よ、蓬莱の玉の枝じゃ！":"Voyez la Branche de Hôrai !","足軽百人が庭に陣を張った。今夜から、月の使いが来る。":"Cent fantassins campent dans le jardin. Dès ce soir, les envoyés de la lune arrivent.","門の脇に、偽物の枝が立てかけてある。夜になると光るらしい。":"Une fausse branche est posée près de la porte. Elle brillerait la nuit.","黄金は月の蔵から漏れていた。翁は聞かなかったことにして、竹林を買い足した。":"L'or fuyait du coffre de la lune. Grand-père fit la sourde oreille et acheta d'autres bambouseraies.","一万の兵と五人の皇子が、庭に入りきらない。月がやけに大きい。":"Dix mille soldats et cinq princes ne tiennent pas dans le jardin. La lune est énorme.","今宵は十五夜。月そのものが、取り立てに来る。":"Ce soir, c'est la pleine lune. La lune elle-même vient se faire payer.","中将「天人というのは、ずいぶんきれいな顔で斬りかかってくるのだな」":"Général : « Ces gens de la lune vous frappent avec un si joli visage. »","車持皇子「見たか！ 偽物でも役に立ったであろう！」":"Prince Kuramochi : « Vous voyez ? Même un faux a servi ! »","翁「数えるのはやめた。桁が足りん。……いや、やっぱり数える」":"Grand-père : « J'ai arrêté de compter. Pas assez de chiffres. ... Non, je compte quand même. »","大伴御行「龍の絵、思ったより効いたな」":"Ôtomo no Miyuki : « Ce dragon peint a mieux marché que prévu. »","屋敷":"Maison","スキップ":"Passer","はじめる":"Commencer","これにする":"Je choisis ça","偽物が混ざっている。月と同じ間合いで光るものが本物。":"Il y a des faux. Le vrai brille au rythme de la lune.","夜を迎える":"Affronter la nuit","夜をしのいだ":"Nuit tenue","夜が明ける":"L'aube se lève","不死の薬を、どうする？":"Que faire de l'élixir ?","薬を飲む":"Le boire","薬を燃やす":"Le brûler","ひと休み":"Pause","続ける":"Reprendre","あきらめる":"Abandonner","十一夜":"Lune du 11","十二夜":"Lune du 12","十三夜":"Lune du 13","十四夜":"Lune du 14","十五夜":"Pleine lune"},"de":{"翁":"Großvater","光の星を生む":"Erzeugt Lichtsterne","弓兵":"Bogenschütze","遠くを射る":"Schießt weit","槍兵":"Speerträger","前で止める":"Hält die Linie","仏の御石の鉢":"Leuchtende Steinschale","石作皇子":"Prinz Ishitsukuri","結界":"Bann","6秒のあいだ屋敷が傷つかない":"Das Haus nimmt 6 s keinen Schaden","蓬莱の玉の枝":"Juwelenzweig von Hōrai","車持皇子":"Prinz Kuramochi","玉実":"Frucht","光を8得る":"8 Licht erhalten","火鼠の皮衣":"Feuerrattengewand","阿倍御主人":"Abe no Miushi","火炎":"Flamme","すべての敵に40の炎":"40 Feuerschaden an allen Gegnern","龍の首の珠":"Drachenjuwel","大伴御行":"Ōtomo no Miyuki","雷鳴":"Donner","すべての敵を4秒止める":"Lähmt alle Gegner 4 s","燕の子安貝":"Schwalbenmuschel","石上麻呂足":"Isonokami no Marotari","癒し":"Heilen","屋敷を30なおす":"Repariert das Haus um 30","いまは昔。竹を取っては籠や笊に編み、それを売って暮らす翁がいた。":"Es war einmal ein alter Mann, der Bambus schnitt, Körbe daraus flocht und davon lebte.","あいたた……腰が。今日はこのへんで切り上げるか。":"Au, au... mein Rücken. Für heute ist Schluss.","……なんじゃ。あの竹、根元が光っとる。":"...Was ist das? Der Bambus leuchtet am Fuß.","節の中に、手のひらに乗るほどの女の子が座っていた。":"Im Halm saß ein kleines Mädchen, nicht größer als seine Handfläche.","それから翁が竹を切るたび、節から黄金がこぼれ出た。":"Von da an fiel jedes Mal Gold aus dem Halm, wenn Großvater Bambus schnitt.","媼":"Großmutter","あんた、また金。もう米びつに入らないよ。":"Schon wieder Gold? Es passt nicht mehr in die Reiskiste.","米びつが足りんなら蔵を建てりゃええ。蔵が足りんなら、もう一棟じゃ。":"Ist die Reiskiste zu klein, baut man einen Speicher. Ist der zu klein, noch einen.","婆さん、明日から竹林を三つ買い足すぞ。":"Oma, ab morgen kaufen wir drei Bambushaine dazu.","三月で、姫は大人の背丈になった。そのあいだに屋敷は三回建て替わり、三回とも金箔張りになった。":"In drei Monaten war die Prinzessin erwachsen. In der Zeit wurde das Haus dreimal neu gebaut, jedes Mal mit Blattgold.","その年の秋。姫は夜になると縁側に出て、月ばかり見るようになった。":"In jenem Herbst ging die Prinzessin jede Nacht auf die Veranda und sah nur noch den Mond an.","冷えるぞ。何ぞ、あったか。":"Es ist kalt. Ist etwas passiert?","かぐや":"Kaguya","お爺さん。わたし、月の都から来たの。次の十五夜に、迎えが来る。":"Großvater. Ich komme aus der Stadt auf dem Mond. Beim nächsten Vollmond holen sie mich.","迎えって、あんた……。":"Dich holen? Aber Kind...","……迎えの者は、手ぶらで来るんかの。":"...Kommen die, die dich holen, mit leeren Händen?","お爺さん。":"Großvater.","冗談じゃ。来るなら来ればええ。金ならある。":"War nur ein Witz. Sollen sie kommen. Geld haben wir.","そういう問題じゃないのよ。":"Darum geht es nicht.","金で片づかん問題は、たいてい金が足りとらんのじゃ。":"Wenn Geld ein Problem nicht löst, ist meistens zu wenig Geld da.","翁は黄金で兵を雇った。足軽が百人、門の前に並んだ。":"Großvater heuerte mit seinem Gold Soldaten an. Hundert Fußsoldaten standen vor dem Tor.","中将":"General","帝の命で参った中将である。……百人？ 私兵の数ではないな。":"Ich bin der General, gesandt vom Kaiser. ...Hundert? Das ist keine Hauswache mehr.","足りんかったら、また竹を切ります。百本でも千本でも。":"Wenn es nicht reicht, schneide ich mehr Bambus. Hundert Halme, tausend Halme.","あと、光る星が落ちとったら拾うてくだされ。一粒でも落としたら給金から引きますでな。":"Und wenn Lichtsterne am Boden liegen, hebt sie auf. Wer einen fallen lässt, dem zieh ich's vom Sold ab.","……この家は、どうなっておるのだ。":"...Was ist mit dieser Familie los?","一夜目を退けた朝。屋敷の前に、金ぴかの牛車が止まった。":"Am Morgen nach der ersten Nacht hielt ein goldglänzender Ochsenkarren vor dem Haus.","姫に求婚しに参った！ 見よ、蓬莱の玉の枝じゃ！":"Ich komme, um um die Prinzessin zu werben! Seht, der Juwelenzweig von Hōrai!","……枝に、職人さんの請求書が挟まってるわよ。":"...Da klemmt die Rechnung des Handwerkers im Zweig.","なっ。……ま、まあ、戦の役には立つかもしれん。置いていく！":"Was?! N-nun, im Kampf mag er nützlich sein. Ich lasse ihn hier!","……この枝、なんぼで売れるかの。":"...Was der Zweig wohl einbringt?","偽物の枝は、なぜか夜になると光り出した。":"Aus irgendeinem Grund begann der falsche Zweig nachts zu leuchten.","三日目の夜明け前。翁と姫は縁側にいた。":"Vor dem Morgengrauen des dritten Tages saßen Großvater und die Prinzessin auf der Veranda.","お爺さん。その黄金、どこから出てると思う？":"Großvater. Woher, glaubst du, kommt das Gold?","竹からじゃ。":"Aus dem Bambus.","竹の向こうはね、月の蔵なの。":"Auf der anderen Seite des Bambus liegt die Schatzkammer des Mondes.","わたしが竹に入れられてから、ずっと漏れてたのよ。":"Es leckt, seit man mich in den Bambus gesteckt hat.","つまり、わしは。":"Das heißt, ich...","毎日、月の国庫に穴をあけてたの。":"Du hast jeden Tag ein Loch in die Staatskasse des Mondes geschlagen.","……その穴、もう少し広げられんかの。":"...Könnte man das Loch nicht ein bisschen größer machen?","お爺さん！":"Großvater!","冗談じゃ。半分はな。……朝飯、何がええ。":"Nur ein Witz. Halb. ...Was willst du zum Frühstück?","話をそらさないで。……お粥。梅のやつ。":"Lenk nicht ab. ...Reisbrei. Mit Pflaume.","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"Als der Kaiser davon hörte, schickte er alle Soldaten der Hauptstadt. Zehntausend.","帝からの書状です。「面白そうだから全部出す」と。":"Ein Brief vom Kaiser: „Klingt lustig, schickt alle.“","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"Dann tauchten die fünf abgewiesenen Prinzen auf, jeder mit einem Schatz.","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"Eine leuchtende Schale! Diesmal echt. Wahrscheinlich.","龍は見つからなんだ。代わりに龍の絵を描いてきた！":"Ich habe keinen Drachen gefunden. Also habe ich einen gemalt!","日当は出来高払いじゃ。倒した数だけ払う。並んでくだされ。":"Bezahlt wird nach Leistung. Eine Münze pro Gegner. Aufstellen.","月は、目に見えて大きくなっていた。":"Der Mond wurde sichtbar größer.","十五夜。月は空の半分を覆っていた。":"Vollmond. Er bedeckte den halben Himmel.","近い……！ 月が、落ちてくる！":"So nah...! Der Mond stürzt herab!","天人の王":"Mondkönig","地上の者よ。この三月で、月の国庫から黄金が三億両消えた。":"Bewohner der Erde. In drei Monaten verschwanden dreihundert Millionen Ryō Gold aus der Mondkasse.","姫は、漏れを塞ぐ栓として竹に詰めておいたのだ。":"Wir hatten die Prinzessin als Stöpsel für das Leck in den Bambus gesteckt.","三億？ わしの帳簿じゃ、五億はあったがの。":"Dreihundert Millionen? Laut meinen Büchern waren es mindestens fünfhundert.","……いや待て。栓？ わしの娘を、栓に。":"...Moment. Ein Stöpsel? Ihr habt meine Tochter als Stöpsel benutzt.","栓を返せ。さもなくば、月ごと取り立てに参る。":"Gebt den Stöpsel zurück. Sonst kommen wir mit dem ganzen Mond eintreiben.","金は返す。……三割くらいなら。娘は一厘も返さん。":"Das Gold gebe ich zurück. ...So dreißig Prozent. Meine Tochter keinen Deut.","お爺さん……！":"Großvater...!","全軍、構え！ 相手は月だ！":"Alle Truppen bereit! Unser Gegner ist der Mond!","天の羽衣を着せかけられると、姫はもう泣かなかった。":"Als ihr das Himmelsgewand umgelegt wurde, weinte die Prinzessin nicht mehr.","お爺さん。……あれ。わたし、何を言おうとしたんだっけ。":"Großvater. ...Hm. Was wollte ich gerade sagen?","栓が戻ると、竹から黄金が出ることは二度となかった。":"Als der Stöpsel zurück war, kam nie wieder Gold aus dem Bambus.","月はゆっくりと空へ戻っていった。あとに降ってきたのは、黄金の雨だった。":"Der Mond stieg langsam zurück in den Himmel. Danach regnete es Gold.","……退いた。月が、退いたぞ！":"...Er weicht zurück. Der Mond weicht zurück!","拾え！ 全部拾え！ 腰なんぞ後でええ！":"Aufheben! Alles aufheben! Mein Rücken kann warten!","これ……あの人が置いていったの。不死の薬。「利子だ」って。":"Das hier... hat er dagelassen. Das Elixier der Unsterblichkeit. „Zinsen“, sagte er.","利子なら、元本はどこじゃ。":"Wenn das die Zinsen sind, wo ist das Kapital?","飲めば年を取らない。病にもならない。ずっと、このまま。":"Wer es trinkt, altert nicht. Wird nicht krank. Bleibt für immer so.","わしもか。":"Ich auch?","お爺さんも、お婆さんも。わたしも。":"Du, und Großmutter. Und ich.","それからというもの、月は一度も欠けなかった。":"Von da an nahm der Mond nie wieder ab.","今夜も満月だねえ。":"Heute wieder Vollmond.","昨日も、その前もね。":"Wie gestern. Und vorgestern.","……ええ月じゃ。":"...Ein schöner Mond.","三人は同じ夜を、何度でも迎えた。竹からは、今も黄金が出続けている。":"Die drei begrüßten dieselbe Nacht, wieder und wieder. Aus dem Bambus kommt bis heute Gold.","薬は、天にいちばん近い山の頂で焚かれた。":"Das Elixier wurde auf dem Gipfel des Berges verbrannt, der dem Himmel am nächsten ist.","帝も、それがよいと仰せでした。あと、黄金を少し分けてほしいと。":"Auch der Kaiser sagte, so sei es am besten. Außerdem hätte er gern etwas Gold.","煙、月まで届くかな。":"Ob der Rauch bis zum Mond reicht?","もったいない……売れば国が買えたのに。":"Schade... dafür hätten wir ein Land kaufen können.","まあええ。腹が減った。帰って粥にしよう。":"Na ja. Ich hab Hunger. Gehen wir heim, Reisbrei kochen.","梅のやつね。":"Mit Pflaume.","その山はのちに「ふじ」と呼ばれるようになった、という。":"Man sagt, dieser Berg wurde später „Fuji“ genannt.","かぐや姫 防衛記":"Kaguya: Mondlicht-Verteidigung","降臨":"erscheint","そこにはもう兵がいる":"Hier steht schon ein Soldat","光が足りない（あと{0}）":"Zu wenig Licht (noch {0})","光 +{0}":"Licht +{0}","連撃 光+{0}":"Kombo: Licht +{0}","屋敷 +{0}":"Haus +{0}","羽衣の魅了":"Bann des Schleiers","結界！":"Bann!","光の星をタップ！":"Tippe den Lichtstern!","のこり {0}":"Übrig {0}","連撃":"Kombo","黄金竹ラッシュ":"Goldbambus-Rausch","光の星が降ってくる":"Lichtsterne regnen herab","帝の援軍":"Kaiserliche Verstärkung","一万騎の矢の雨":"Ein Regen aus 10.000 Pfeilen","偽物だった！":"Es war gefälscht!","蓬莱の玉の枝（偽）が大爆発":"Der falsche Juwelenzweig explodiert","桁が上がった！":"Neue Größenordnung!","すべての数が ×{0}":"Alle Zahlen ×{0}","撤収":"Abziehen","音楽 {0}":"Musik {0}","効果音 {0}":"Effekte {0}","宝":"Sch 切ります。百本でも千本でも。":"Не хватит — нарублю ещё бамбука. Хоть сто стеблей, хоть тысячу.","あと、光る星が落ちとったら拾うてくだされ。一粒でも落としたら給金から引きますでな。":"И если увидите на земле светящиеся звёзды, подберите. Уроните хоть одну — вычту из жалованья.","……この家は、どうなっておるのだ。":"...Да что творится в этой семье?","一夜目を退けた朝。屋敷の前に、金ぴかの牛車が止まった。":"Утром после первой ночи у дома остановилась сверкающая золотом повозка.","姫に求婚しに参った！ 見よ、蓬莱の玉の枝じゃ！":"Я прибыл свататься к принцессе! Узрите ветвь с Хорая!","……枝に、職人さんの請求書が挟まってるわよ。":"...На ветке висит счёт от мастера.","なっ。……ま、まあ、戦の役には立つかもしれん。置いていく！":"Что?! Н-ну, в бою она, может, пригодится. Оставлю!","……この枝、なんぼで売れるかの。":"...Интересно, сколько дадут за эту ветку.","偽物の枝は、なぜか夜になると光り出した。":"Почему-то фальшивая ветвь по ночам начала светиться.","三日目の夜明け前。翁と姫は縁側にいた。":"Перед рассветом третьего дня дедушка и принцесса сидели на веранде.","お爺さん。その黄金、どこから出てると思う？":"Дедушка. Как думаешь, откуда это золото?","竹からじゃ。":"Из бамбука.","竹の向こうはね、月の蔵なの。":"По ту сторону бамбука — лунная кладовая.","わたしが竹に入れられてから、ずっと漏れてたのよ。":"С тех пор как меня положили в бамбук, оттуда всё время течёт.","つまり、わしは。":"То есть я...","毎日、月の国庫に穴をあけてたの。":"Каждый день пробивал дыру в лунной казне.","……その穴、もう少し広げられんかの。":"...А нельзя эту дыру сделать чуть побольше?","お爺さん！":"Дедушка!","冗談じゃ。半分はな。……朝飯、何がええ。":"Шучу. Наполовину. ...Что хочешь на завтрак?","話をそらさないで。……お粥。梅のやつ。":"Не меняй тему. ...Рисовую кашу. Со сливой.","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"Услышав слухи, император прислал всех солдат столицы. Десять тысяч.","帝からの書状です。「面白そうだから全部出す」と。":"Письмо от императора: «Звучит весело, шлите всех».","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"А потом явились пятеро отвергнутых принцев, каждый со своим сокровищем.","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"Сияющая чаша! На этот раз настоящая. Наверное.","龍は見つからなんだ。代わりに龍の絵を描いてきた！":"Дракона не нашёл. Зато нарисовал!","日当は出来高払いじゃ。倒した数だけ払う。並んでくだされ。":"Плата сдельная. Монета за врага. Становитесь в строй.","月は、目に見えて大きくなっていた。":"Луна заметно росла.","十五夜。月は空の半分を覆っていた。":"Полнолуние. Луна закрыла полнеба :"Quindi io...","毎日、月の国庫に穴をあけてたの。":"Ogni giorno bucavi il tesoro della luna.","……その穴、もう少し広げられんかの。":"...Quel buco, non si potrebbe allargare un po'?","お爺さん！":"Nonno!","冗談じゃ。半分はな。……朝飯、何がええ。":"Scherzavo. A metà. ...Cosa vuoi per colazione?","話をそらさないで。……お粥。梅のやつ。":"Non cambiare discorso. ...Porridge di riso. Con la prugna.","噂を聞いた帝は、都じゅうの兵を送ってきた。その数、一万。":"Sentite le voci, l'Imperatore mandò tutti i soldati della capitale. Diecimila.","帝からの書状です。「面白そうだから全部出す」と。":"Una lettera dell'Imperatore: «Sembra divertente, mandateli tutti».","さらに、姫に振られた五人の皇子が、それぞれの宝を担いで現れた。":"Poi arrivarono i cinque principi respinti, ognuno con un tesoro in spalla.","光る鉢じゃ！ 今度こそ本物だ。たぶん。":"Una ciotola lucente! Stavolta è vera. Probabilmente.","龍は見つからなんだ。代わりに龍の絵を描いてきた！":"Il drago non l'ho trovato. Allora l'ho dipinto!","日当は出来高払いじゃ。倒した数だけ払う。並んでくだされ。":"Paga a cottimo. Una moneta per nemico. In fila.","月は、目に見えて大きくなっていた。":"La luna diventava visibilmente più grande.","十五夜。月は空の半分を覆っていた。":"La luna piena. Copriva metà del cielo.","近い……！ 月が、落ちてくる！":"Così vicina...! La luna sta cadendo!","天人の王":"Re della luna","地上の者よ。この三月で、月の国庫から黄金が三億両消えた。":"Gente della terra. In tre mesi sono spariti trecento milioni di ryō d'oro dal tesoro della luna.","姫は、漏れを塞ぐ栓として竹に詰めておいたのだ。":"Avevamo infilato la principessa nel bambù come tappo per la perdita.","三億？ わしの帳簿じゃ、五億はあったがの。":"Trecento milioni? Nei miei registri erano almeno cinquecento.","……いや待て。栓？ わしの娘を、栓に。":"...Un momento. Un tappo? Avete usato mia figlia come tappo.","栓を返せ。さもなくば、月ごと取り立てに参る。":"Restituite il tappo. O verremo a riscuotere con tutta la luna.","金は返す。……三割くらいなら。娘は一厘も返さん。":"L'oro lo restituisco. ...Diciamo un trenta per cento. Mia figlia, neanche un briciolo.","お爺さん……！":"Nonno...!","全軍、構え！ 相手は月だ！":"Tutte le truppe, pronte! Il nemico è la luna!","天の羽衣を着せかけられると、姫はもう泣かなかった。":"Quando le posero addosso la veste celeste, la principessa non pianse più.","お爺さん。……あれ。わたし、何を言おうとしたんだっけ。":"Nonno. ...Oh. Cosa stavo per dire?","栓が戻ると、竹から黄金が出ることは二度となかった。":"Rimesso il tappo, dal bambù const AU={ac:null,bgm:store.get('jugoya_bgm',true),se:store.get('jugoya_se',true),cur:null,want:null,track:null,step:0,next:0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
 if(AU.ac){if(AU.ac.state==='suspended')AU.ac.resume();return;}
 try{AU.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AU.ac=null;return;}
 const ac=AU.ac;
 AU.comp=ac.createDynamicsCompressor();AU.comp.threshold.value=-16;AU.comp.ratio.value=4;
 AU.master=ac.createGain();AU.master.gain.value=.85;AU.master.connect(AU.comp);AU.comp.connect(ac.destination);
 AU.music=ac.createGain();AU.music.gain.value=0;AU.music.connect(AU.master);
 AU.sfx=ac.createGain();AU.sfx.gain.value=AU.se?.7:0;AU.sfx.connect(AU.master);
 AU.musicIn=ac.createGain();AU.musicIn.connect(AU.music);
 const dl=ac.createDelay(1);dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.3;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;
 const wet=ac.createGain();wet.gain.value=.32;AU.musicIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(AU.music);
 const len=ac.sampleRate;const b=ac.createBuffer(1,len,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;

}
function eg(g,t,a,peak,end){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,end);}
function noiseSrc(t,dur,type,freq,q,gain,out,dec){const ac=AU.ac;const n=ac.createBufferSource();n.buffer=AU.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(Math.max(.0002,gain),t);g.gain.exponentialRampToValueAtTime(.0001,t+dec);n.connect(f);f.connect(g);g.connect(out);n.start(t,Math.random()*.5);n.stop(t+dur);}
const INST={
 koto(t,m,d,v,out){const ac=AU.ac,f=mtof(m);const o1=ac.createOscillator(),o2=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain(),g2=ac.createGain();
  o1.type='triangle';o2.type='sawtooth';o1.frequency.value=f;o2.frequency.value=f*1.003;g2.gain.value=.3;
  fl.type='lowpass';fl.frequency.setValueAtTime(3800,t);fl.frequency.exponentialRampToValueAtTime(650,t+.45);fl.Q.value=2;
  o2.connect(g2);g2.connect(fl);o1.connect(fl);fl.connect(g);g.connect(out);const dec=Math.max(.6,d*1.5);eg(g,t,.004,.2*v,t+dec);
  o1.start(t);o2.start(t);o1.stop(t+dec+.05);o2.stop(t+dec+.05);},
 shaku(t,m,d,v,out){const ac=AU.ac,f=mtof(m);const o=ac.createOscillator(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(f*.97,t);o.frequency.exponentialRampToValueAtTime(f,t+.09);
  lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.012,t+Math.min(.5,d*.6)+.01);lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14*v,t+.07);g.gain.setValueAtTime(.14*v,t+Math.max(.08,d-.1));g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);
  o.connect(g);g.connect(out);o.start(t);lfo.start(t);o.stop(t+d+.2);lfo.stop(t+d+.2);
  noiseSrc(t,d+.1,'bandpass',f*2,3,.025*v,out,Math.max(.1,d));},
 chip(t,m,d,v,out){const ac=AU.ac;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=mtof(m);eg(g,t,.004,.045*v,t+Math.max(.08,d));o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);},

 taiko(t,m,d,v,out){const ac=AU.ac;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(m||120,t);o.frequency.exponentialRampToValueAtTime(42,t+.3);
  eg(g,t,.003,.7*v,t+.45);o.connect(g);g.connect(out);o.start(t);o.stop(t+.5);noiseSrc(t,.1,'lowpass',900,0,.28*v,out,.08);},
 rim(t,m,d,v,out){const ac=AU.ac;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(560,t);o.frequency.exponentialRampToValueAtTime(330,t+.08);eg(g,t,.003,.28*v,t+.16);o.connect(g);g.connect(out);o.start(t);o.stop(t+.2);},
 shk(t,m,d,v,out){noiseSrc(t,.06,'highpass',6500,0,.08*v,out,.05);},
 bell(t,m,d,v,out){const ac=AU.ac,f=mtof(m);[[1,.11],[2.76,.045],[5.4,.02]].forEach(([r,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*r;eg(g,t,.004,a*v,t+2.4/r+.3);o.connect(g);g.connect(out);o.start(t);o.stop(t+2.8);});},
 pad(t,m,d,v,out){const ac=AU.ac,f=mtof(m);const g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;
  [-7,7].forEach(c=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=c;o.connect(fl);o.start(t);o.stop(t+d+.8);});
  fl.connect(g);g.connect(out);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045*v,t+.5);g.gain.setValueAtTime(.045*v,t+Math.max(.55,d));g.gain.exponentialRampToValueAtTime(.0001,t+d+.75);}
};
const DRY={taiko:1,rim:1,shk:1};
function seqTick(){
 const ac=AU.ac;if(!ac||!AU.track)return;
 const tr=AU.track,sd=60/tr.bpm/4;
 if(AU.next<ac.currentTime-.2)AU.next=ac.currentTime+.05;
 while(AU.next<ac.currentTime+.15){
  const evs=tr.by[AU.step%tr.len];
  if(evs)for(const e of evs){try{INST[e.i](AU.next,e.m,e.d*sd,e.v,DRY[e.i]?AU.music:AU.musicIn);}catch(err){}}
  AU.step++;AU.next+=sd;
 }
}
function playMusic(name){
 AU.want=name;if(!AU.ac||AU.cur===name)return;AU.cur=name;
 const ac=AU.ac,g=AU.music.gain,t=ac.currentTime;
 g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+.35);
 clearTimeout(AU.sw);
 AU.sw=setTimeout(()=>{AU.track=name?TRACKS[name]:null;AU.step=0;AU.next=ac.currentTime+.05;const t2=ac.currentTime;g.cancelScheduledValues(t2);g.setValueAtTime(0,t2);g.linearRampToValueAtTime(AU.bgm&&name?.55:0,t2+.6);},380);
}

function tone(f,d=.08,type='square',v=.05,slide=0,delay=0){
 if(!AU.ac||!AU.se)return;const ac=AU.ac,t=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);
 eg(g,t,.003,v,t+d);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+d+.02);}

const cv=$('cv');let ctx=cv.getContext('2d');let S=4,P=1.333;
function layout(){
 const f=$('fit');const w=f.clientWidth||window.innerWidth,h=f.clientHeight||window.innerHeight;
 P=Math.max(.5,Math.min(w/LW,h/LH));const dpr=window.devicePixelRatio||1;

// ===== layer helpers =====
function layer(){return mk(LW,LH);}
function blurL(src,f){const [c,x]=mk(Math.ceil(LW/f),Math.ceil(LH/f));x.imageSmoothingEnabled=true;x.drawImage(src,0,0,c.width,c.height);return c;}
function drawL(c,a=1){if(a<=0)return;ctx.globalAlpha=a;ctx.drawImage(c,0,0,LW,LH);ctx.globalAlpha=1;}
function drawBlur(c,a=1){ctx.imageSmoothingEnabled=true;drawL(c,a);ctx.imageSmoothingEnabled=false;}
function gradRect(x,y0,y1,stops,K=18){
 const cs=stops.map(s=>[s[0],hex(s[1])]);
 const at=t=>{for(let i=1;i<cs.length;i++)if(t<=cs[i][0]){const a=cs[i-1],b=cs[i];return mix(a[1],b[1],(t-a[0])/((b[0]-a[0])||1));}return cs[cs.length-1][1];};
 const H=y1-y0;const img=x.createImageData(LW,H);const d=img.data;
 for(let y=0;y<H;y++){const t=y/Math.max(1,H-1),lv=t*K,l0=Math.floor(lv),fr=lv-l0;const c0=at(l0/K),c1=at(Math.min(K,l0+1)/K);
  for(let i=0;i<LW;i++){const th=(BAY[((y+y0)&3)*4+(i&3)]+.5)/16;const c=fr>th?c1:c0;const k=(y*LW+i)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}
 x.putImageData(img,0,y0);
}
function drawMoon(x,cx,cy,r,frac,rabbit=true){
 const sx=cx-2*r*frac-.5;
 for(let j=-r-14;j<=r+14;j++)for(let i=-r-14;i<=r+14;i++){const d=Math.hypot(i,j);
  if(d>r+2&&d<r+5&&((i+j)&1)===0){x.fillStyle='rgba(255,226,170,.55)';x.fillRect(cx+i,cy+j,1,1);}
  else if(d>r+8&&d<r+9.2&&((i*3+j)%3===0)){x.fillStyle='rgba(220,190,255,.45)';x.fillRect(cx+i,cy+j,1,1);}
  if(d>r)continue;
  const sh=Math.hypot(cx+i-sx,j)<r;
  let c;if(sh)c='#262052';else{const t=d/r;c=t<.5?'#FFF6CC':t<.82?'#FBE7A0':'#F2CF72';if(i+j>r*.7)c='#E9C064';}
  x.fillStyle=c;x.fillRect(cx+i,cy+j,1,1);}
 const R=seeded(r);for(let k=0;k<6;k++){const a=R()*6.28,dd=R()*r*.7,cr=1+R()*r*.12;const px=Math.round(cx+Math.cos(a)*dd),py=Math.round(cy+Math.sin(a)*dd);
  for(let j=-cr;j<=cr;j++)for(let i=-cr;i<=cr;i++){if(i*i+j*j>cr*cr)continue;if(Math.hypot(px+i-sx,py+j-cy)<r)continue;if(Math.hypot(px+i-cx,py+j-cy)>r-1)continue;x.fillStyle='#E4C26C';x.fillRect(px+i,py+j,1,1);}}
 if(rabbit){const rab=["..x.x...","..x.x...",".xxxx...","xxxxxx..",".xxxxxxx",".xxxxxx.","..x..x.."];const sc=Math.max(1,Math.round(r/14));
  rab.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='x'){const X=cx-2*sc+i*sc,Y=cy-3*sc+j*sc;if(Math.hypot(X-sx,Y-cy)>=r){x.fillStyle='#D7A94C';x.fillRect(X,Y,sc,sc);}}});}
}
function stalk(x,_u,bx,top,bot,w,lit,dark,node,step){x.fillStyle=dark;x.fillRect(bx,top,w,bot-top);x.fillStyle=lit;x.fillRect(bx,top,Math.max(1,Math.floor(w/3)),bot-top);

// ===== scene engine =====
let SC=null;
function runScene(name,onDone){
 SC={cmds:SCN[name],i:0,actors:{},stage:'house',n:0,flags:{},fadeA:1,fadeT:1,fadeSpd:1,block:null,emotes:[],flash:0,shake:0,line:null,onDone};
 setState('scene');scStep();
}
function scExec(c){
 if(c.stage){SC.stage=c.stage;SC.n=c.n!=null?c.n:SC.n;SC.flags={};}
 if(c.music)playMusic(c.music);
 if(c.del)for(const id of c.del)delete SC.actors[id];
 if(c.set)for(const id in c.set){const a=SC.actors[id]||{x:0,y:null,flip:false,scale:2,ph:Math.random()*6};Object.assign(a,c.set[id]);SC.actors[id]=a;}
 if(c.flag)SC.flags[c.flag]=1;
 if(c.sfx&&sfx[c.sfx])sfx[c.sfx]();
 if(c.flash)SC.flash=c.flash;if(c.shake)SC.shake=c.shake;
 if(c.emote)SC.emotes.push({id:c.emote,k:c.k,t:1.3});
 if(c.move){const a=SC.actors[c.move];a.mv={fx:a.x,tx:c.x!=null?c.x:a.x,fy:a.y,ty:c.y!=null?c.y:a.y,t:0,d:c.dur||1};if(c.x!=null&&c.x!==a.x)a.flip=c.x<a.x;if(c.wait!==false)SC.block={k:'move',a};}
 if(c.fade){SC.fadeT=c.fade==='out'?1:0;SC.fadeSpd=1/(c.dur||.6);SC.block={k:'fade'};}
 if(c.wait)SC.block={k:'wait',t:c.wait};
 if(c.say!==undefined||c.narr!==undefined){showLine(c);SC.block={k:'line'};}
}
function scStep(){while(SC&&!SC.block&&SC.i<SC.cmds.length)scExec(SC.cmds[SC.i++]);if(SC&&!SC.block&&SC.i>=SC.cmds.length)endScene();}
function endScene(){const cb=SC&&SC.onDone;SC=null;$('dlg').hidden=true;$('btnSkip').hidden=true;if(cb)cb();}
function skipScene(){if(!SC)return;sfx.tap();endScene();}
function showLine(c){
 const narr=c.narr!==undefined;SC.line={text:tr(narr?c.narr:c.text),shown:0,who:c.who||null,acc:0};
 $('dlg').hidden=false;$('dlgName').hidden=narr;$('dlgName').textContent=c.say?tr(c.say):'';$('dlgBox').classList.toggle('narr',narr);$('dlgText').textContent='';
}
function scTap(){
 if(!SC||!SC.block)return;
 if(SC.block.k==='line'){const L=SC.line;if(L.shown<L.text.length){L.shown=L.text.length;$('dlgText').textContent=L.text;}else{SC.block=null;SC.line=null;$('dlg').hidden=true;sfx.cursor();scStep();}}
}
function updateScene(dt){
 const s=SC;if(!s)return;
 if(s.fadeA!==s.fadeT){const d=s.fadeSpd*dt;s.fadeA=s.fadeA<s.fadeT?Math.min(s.fadeT,s.fadeA+d):Math.max(s.fadeT,s.fadeA-d);}
 for(const id in s.actors){const a=s.actors[id];a.ph+=dt*3;if(a.mv){a.mv.t+=dt;const k=clamp(a.mv.t/a.mv.d,0,1);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;a.x=lerp(a.mv.fx,a.mv.tx,e);if(a.mv.fy!=null&&a.mv.ty!=null)a.y=lerp(a.mv.fy,a.mv.ty,e);a.walk=k<1;if(k>=1)a.mv=null,a.walk=false;}}
 s.emotes=s.emotes.filter(e=>(e.t-=dt)>0);if(s.flash>0)s.flash-=dt*1.5;if(s.shake>0)s.shake-=dt;
 const L=s.line;if(L&&L.shown<L.text.length){L.acc+=dt*28;const n=Math.floor(L.acc);if(n>0){L.acc-=n;L.shown=Math.min(L.text.length,L.shown+n);$('dlgText').textContent=L.text.slice(0,L.shown);if(L.shown%2===0)sfx.type();}}
 const b=s.block;if(b){if(b.k==='move'&&!b.a.mv)s.block=null;else if(b.k==='fade'&&s.fadeA===s.fadeT)s.block=null;else if(b.k==='wait'&&(b.t-=dt)<=0)s.block=null;}
 if(!s.block)scStep();
}
function drawScene(t){
 const s=SC;let sx=0,sy=0;if(s.shake>0){sx=Math.round(rnd(-2,2));sy=Math.round(rnd(-2,2));}ctx.translate(sx,sy);
 drawStage(s.stage,s.n,t,s.flags);
 const baseY=STAGE_Y[s.stage];
 const list=Object.entries(s.actors).sort((a,b)=>(a[1].y??baseY)-(b[1].y??baseY));
 for(const [id,a] of list){const y=(a.y??baseY)-(a.float?(3+Math.sin(a.ph)*2):0)-(a.walk?Math.abs(Math.sin(a.ph*4))*2:0);
  const talking=SC.line&&SC.line.who===id&&SC.line.shown<SC.line.text.length;
  if(!a.float)shadow(a.x,(a.y??baseY),12*a.scale,.4);
  if(id==='king')glow(a.x,y-30,60,'255,226,160',.4);
  if(id==='pot')glow(a.x,y-10,24,'255,226,160',.5);
  drawSpr(a.spr,a.x,y,a.scale,{sw:a.sw,flip:a.flip,sy:1+(talking?.03*Math.sin(t*20):.015*Math.sin(a.ph))});}
 for(const e of s.emotes){const a=s.actors[e.id];if(!a)continue;const y=(a.y??baseY)-26*a.scale-6-(e.t>1.1?(e.t-1.1)*20:0);ctx.fillStyle='#FFF4DC';ctx.fillRect(a.x-6,y-10,13,12);ctx.fillStyle='#0B0618';ctx.fillRect(a.x-7,y-10,1,12);ctx.fillRect(a.x+7,y-10,1,12);ctx.fillRect(a.x-6,y-11,13,1);ctx.fillRect(a.x-6,y+2,13,1);ctx.fillRect(a.x-1,y+3,3,2);ptxt(e.k,a.x+.5,y-1,'#2A1606',8,'center','#FFF4DC');}
 if(s.stage==='house'||s.stage==='grove')drawFireflies(t,200,320);
 drawStageFg(s.stage,s.n);
 ctx.translate(-sx,-sy);
}
function drawSceneFx(){const s=SC;if(s.flash>0){ctx.globalAlpha=Math.min(1,s.flash);ctx.fillStyle='#FFF8EC';ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}
 if(s.fadeA>0){ctx.globalAlpha=s.fadeA;ctx.fillStyle='#05030C';ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}}

  {kind:'up',key:'archer',icon:'archer',tag:tr('鍛錬'),cls:'up',title:tr('弓兵を鍛える'),desc:trf('弓兵の攻撃が35%上がる。いま Lv{0}。',LV.archer)},
  {kind:'up',key:'guard',icon:'guard',tag:tr('鍛錬'),cls:'up',title:tr('槍兵を鍛える'),desc:trf('槍兵の体力と攻撃が35%上がる。いま Lv{0}。',LV.guard)},
  {kind:'up',key:'okina',icon:'okina',tag:tr('鍛錬'),cls:'up',title:tr('翁と竹を取る'),desc:trf('翁が光の星を生む間隔が短くなる。いま Lv{0}。',LV.okina)},
  {kind:'repair',icon:'pot',tag:tr('備え'),cls:'prep',title:tr('屋敷を修繕する'),desc:tr('屋敷の最大体力が20増え、体力が40もどる。')},
  {kind:'bamboo',icon:'i_take',tag:tr('備え'),cls:'prep',title:tr('光る竹を探す'),desc:trf('毎夜はじめの光が3増える。いま +{0}。',G.bonus)}];
 shuffle(pool);while(opts.length<3)opts.push(pool.pop());return opts;
}
function renderOpts(){const box=$('dayOpts');box.innerHTML='';
 dayOpts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===daySel?' sel':'');b.innerHTML=`<span class="ic">${sImg(o.icon,1)}</span><span><span class="tag t8 ${o.cls}">${o.tag}</span>${o.title}</span>`;
  b.onclick=()=>{if(daySel===i){chooseOpt();return;}daySel=i;sfx.cursor();renderOpts();};box.appendChild(b);});
 const o=dayOpts[daySel];$('dayDetT').textContent=o.title;$('dayDet').textContent=o.desc;}
function chooseOpt(){const o=dayOpts[daySel];sfx.ok();
 if(o.kind==='trial'){startTrial(o.t);return;}
 if(o.kind==='up')G.lv[o.key]++;if(o.kind==='repair'){G.houseMax+=20;G.houseHP=Math.min(G.houseMax,G.houseHP+40);}if(o.kind==='bamboo')G.bonus+=3;
 toNight();}
function toNight(){if(G.night===4)runScene('boss',()=>startNight());else startNight();}
let miniTO=null,miniItems=[],miniDone=false,miniTick=null;
function startTrial(t){
 setState('mini');showWin('wMini');miniDone=false;
 $('miniSuitor').textContent=trf('{0}の難題',tr(t.suitor));$('miniTitle').textContent=tr(t.name);
 const P=1.1;const mm=$('miniMoon');mm.src=moonURL(1,10);mm.style.cssText=`width:calc(var(--p)*46);height:calc(var(--p)*46);--pd:${P}s`;mm.classList.remove('pulse');void mm.offsetWidth;mm.classList.add('pulse');
 miniItems=shuffle([{real:1,p:P},{real:0,p:P*.62},{real:0,p:P*1.6}]);const box=$('miniItems');box.innerHTML='';
 miniItems.forEach(it=>{const b=document.createElement('button');b.className='pw item';b.innerHTML=`<span class="pulse" style="--pd:${it.p}s">${sImg(t.icon,3)}</span><span class="t8 lb">　</span>`;b.onclick=()=>resolveTrial(t,it.real,b);it.el=b;box.appendChild(b);});
 $('miniRes').textContent='';$('miniNext').hidden=true;
 const tm=$('miniTimer');tm.innerHTML='';for(let i=0;i<14;i++)tm.appendChild(document.createElement('i'));
 let left=14;clearInterval(miniTick);miniTick=setInterval(()=>{left--;[...tm.children].forEach((e,i)=>e.classList.toggle('off',i>=left));if(left<=0){clearInterval(miniTick);resolveTrial(t,0,null);}},500);
}
function resolveTrial(t,ok,btn){if(miniDone)return;miniDone=true;clearInterval(miniTick);
 miniItems.forEach(it=>{it.el.disabled=true;const lb=it.el.querySelector('.lb');lb.textContent=tr(it.real?'本物':'偽物');if(it.real)it.el.classList.add('real');});
 if(ok){G.owned.push(t.id);$('miniRes').innerHTML=`<span class="gold">${trf('本物だ。夜の技「{0}」を覚えた',tr(t.skill))}</span>`;sfx.win();}
 else{if(btn)btn.classList.add('wrong');G.consol=2;$('miniRes').innerHTML=`<span style="color:var(--red)">${tr(btn?'偽物をつかまされた。':'時間切れ。')}${trf('慰めに光 +{0}',2)}</span>`;sfx.ng();}
 $('miniNext').hidden=false;}
function startNight(){
 beginNight();VIEW={k:'battle'};setState('night');showWin(null);buildCmd();playMusic('night');hudUpdate();
 if(tut<1)showHint(tr('兵を選び、光るマスに置こう。ドラッグでも置ける'),30,330,210);
}
function onNightClear(){
 setState('result');G.kills+=N.kills;const n=G.night;G.night++;const heal=Math.min(15,G.houseMax-G.houseHP);G.houseHP+=heal;sfx.win();
 if(G.night>=5){setTimeout(()=>runScene('endA',()=>{VIEW={k:'stage',name:'field',n:4};setState('end');showWin('wChoice');}),900);return;}
 showWin('wResult');$('resHead').textContent=`${nightL(n)} ${phaseL(n)}`;
 $('resStats').innerHTML=`<div class="inset"><p class="t8 sub">${tr('退けた使い')}</p><p class="t16">${fmtBig(N.kills*INF[n])}</p></div><div class="inset"><p class="t8 sub">${tr('最大連撃')}</p><p class="t16">${G.maxCombo}</p></div>`;
 $('resLine').textContent=RES_LINE[n]?tr(RES_LINE[n]):'';$('resHeal').textContent=trf('夜明けに屋敷を手当てした（+{0}）',fmtBig(heal*INF[n]));
}
function afterDawn(){const sc={1:'gold',2:'mid',3:'alliance'}[G.night];if(sc)runScene(sc,()=>showDay());else showDay();}
function onLose(){setState('result');sfx.lose();const earned=G.night+G.owned.length+1;memory+=earned;store.set('jugoya_memory',memory);
 setTimeout(()=>runScene('over',()=>{VIEW={k:'stage',name:'sky',n:0};setState('end');showCard('月へ',trf('{0} {1}にて',nightL(G.night),phaseL(G.night)),tr('姫は月へ帰った'),trf('月の記憶 +{0}（合計 {1}）。次は、はじめの光 +{2}',earned,memory,memBonus()),tr('もう一度'));}),700);}
function finishEnd(drink){const earned=8+G.owned.length;memory+=earned;store.set('jugoya_memory',memory);
 runScene(drink?'drink':'burn',()=>{VIEW={k:'stage',name:drink?'house':'fuji',n:4};setState('end');
  showCard('end',tr(drink?'結末 その一':'結末 その二'),tr(drink?'終わらない十五夜':'限りある日々'),trf('月の記憶 +{0}（合計 {1}）',earned,memory),tr('タイトルへ'));});}
let cardMode='';function showCard(mode,head,title,mem,btn){cardMode=mode;showWin('wCard');$('cardHead').textContent=head;$('cardTitle').textContent=title;$('cardText').textContent=tr(mode==='end'?'ここまで遊んでくれて、ありがとう。':'迎えの光は、今夜も満ちる。');$('cardMem').textContent=mem;$('btnCard').textContent=btn;}

// ===== input =====
const scr=$('screen');
function toLogical(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*LW,y:(ev.clientY-r.top)/r.height*LH};}
function nearestCell(x,y){let best=null,bd=1e9;for(let r=0;r<4;r++)for(let l=0;l<3;l++){const z=ROWZ[r],s=zs(z);const p=cellPos(l,r);const hw=LN*s*.5,hh=Math.max(10,(PY(z-.05)-PY(z+.05))/2);const d=Math.hypot((x-p.x)/hw,(y-p.y)/hh);if(d<bd){bd=d;best={l,r};}}return bd<1.25?best:null;}
let drag=null;
function cardDown(ev,k){ev.preventDefault();audioInit();if(state!=='night')return;sel=k;sfx.cursor();lastHud='';hideBubble();drag={k,moved:false,id:ev.pointerId,sx:ev.clientX,sy:ev.clientY};}
window.addEventListener('pointermove',ev=>{if(!drag||state!=='night')return;if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>8)drag.moved=true;if(!drag.moved)return;const p=toLogical(ev);N.ghost=drag.k;N.hover=p.y<408?nearestCell(p.x,p.y):null;});
window.addEventListener('pointerup',ev=>{if(!drag)return;const d=drag;drag=null;if(state==='night'&&N){if(d.moved&&N.hover)placeUnit(d.k,N.hover.l,N.hover.r);N.ghost=null;N.hover=null;}});
cv.addEventListener('pointerdown',ev=>{
 ev.preventDefault();audioInit();
 if(state==='scene'){scTap();return;}
 if(state!=='night')return;const p=toLogical(ev);
 let bo=null,bd=18;for(const o of N.orbs){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;bo=o;}}
 if(bo){N.orbs.splice(N.orbs.indexOf(bo),1);absorb(bo.x,bo.y,bo.v);addText(bo.x,bo.y-8,'+'+big(bo.v),'#FFE59A',.6,12,true);burst(bo.x,bo.y,['#FFE59A','#FFFFFF','#F48FB6'],8,22,true);ring(bo.x,bo.y,'#FFE59A',12);sfx.orb();if(tut<2&&tut>=1){tut=2;store.set('jugoya_tut2',2);hideHint();}return;}
 const c=nearestCell(p.x,p.y);if(!c){hideBubble();return;}
 const u=N.units.find(u=>u.lane===c.l&&u.row===c.r);if(u){if(bubbleUnit===u)hideBubble();else showBubble(u);sfx.cursor();return;}
 hideBubble();placeUnit(sel,c.l,c.r);
});
$('dlg').addEventListener('pointerdown',()=>{});
scr.addEventListener('pointerdown',ev=>{if(state==='scene'&&ev.target!==$('btnSkip')&&ev.target!==cv){audioInit();scTap();}});
$('btnSkip').onclick=ev=>{ev.stopPropagation();skipScene();};
$('btnRetreat').onclick=()=>{if(bubbleUnit&&N){retreat(bubbleUnit);hideBubble();}};
$('btnStart').onclick=()=>{audioInit();sfx.ok();startGame();};
const tgB=()=>{audioInit();setBgm(!AU.bgm);syncSoundBtns();sfx.tap();},tgS=()=>{audioInit();setSe(!AU.se);syncSoundBtns();sfx.tap();};
$('btnBgm').onclick=tgB;$('btnBgm2').onclick=tgB;$('btnSe').onclick=tgS;$('btnSe2').onclick=tgS;
$('btnDayOk').onclick=()=>chooseOpt();
$('miniNext').onclick=()=>{sfx.ok();toNight();};
$('btnDawn').onclick=()=>{sfx.ok();afterDawn();};
$('btnDrink').onclick=()=>{sfx.ok();finishEnd(true);};$('btnBurn').onclick=()=>{sfx.ok();finishEnd(false);};
$('btnCard').onclick=()=>{sfx.ok();if(cardMode==='end')toTitle();else startRetry();};
function startRetry(){newRun();showDay();}
$('btnPause').onclick=()=>{if(state==='night'){setState('paused');showWin('wPause');syncSoundBtns();sfx.tap();}};
$('btnResume').onclick=()=>{setState('night');showWin(null);sfx.tap();};
$('btnGiveUp').onclick=()=>{setState('night');showWin(null);G.houseHP=0;};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='night'){setState('paused');showWin('wPause');syncSoundBtns();}});

// ===== main loop =====
let last=performance.now(),TT=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;TT+=dt;
 updAmb(dt);
 if(state==='night')updateNight(dt);
 if(state==='scene'&&SC)updateScene(dt);
 ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,LW,LH);
 try{
  if(state==='scene'&&SC){drawScene(TT);post(.26);drawSceneFx();}
  else if(N&&['night','paused','result'].includes(state)&&VIEW.k==='battle'){drawBattle(TT);post(.24);drawBattleOverlay(TT);}
  else if(VIEW.k==='stage'){drawStage(VIEW.name,VIEW.n,TT,{});drawStageFg(VIEW.name,VIEW.n);post(.26);ctx.fillStyle='rgba(5,3,12,.35)';ctx.fillRect(0,0,LW,LH);}
  else{drawTitle(TT);post(.3);}
 }catch(err){console.error(err);}
 if(G&&['night','paused','day','mini','result'].includes(state))hudUpdate();
 requestAnimationFrame(frame);
}
{const R=document.documentElement.style;const u=n=>`url(${sprite(n,{}).toDataURL()})`;R.setProperty('--icDown',u('ic_down'));R.setProperty('--icUp',u('ic_up'));R.setProperty('--icRight',u('ic_right'));R.setProperty('--icFF',u('ic_ff'));R.setProperty('--icPause',u('ic_pause'));R.setProperty('--icStar',u('star'));}
$('hudStar').src=sURL('star');$('hudStar').style.cssText='width:calc(var(--p)*11);height:calc(var(--p)*10)';
layout();window.addEventListener('resize',layout);if(window.ResizeObserver)new ResizeObserver(layout).observe($('fit'));
buildLogo();if(document.fonts&&document.fonts.load)document.fonts.load('40px DotGothic16').then(()=>buildLogo()).catch(()=>{});
toTitle();requestAnimationFrame(frame);

// ===== language UI =====
function applyStatic(){
 document.documentElement.lang=LANG;
 document.body.classList.toggle('nl',LANG!=='ja');
 document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.dataset.ja==null)el.dataset.ja=el.textContent;el.textContent=tr(el.dataset.ja);});
 const cur=LANGS.find(([c])=>c===LANG);$('btnLang').textContent=(LANG==='ja'?'言語：':'Language: ')+cur[1];
 syncSoundBtns();
}
function openLang(){
 showWin('wLang');const box=$('langList');box.innerHTML='';
 LANGS.forEach(([c,name])=>{const b=document.createElement('button');b.className='opt lang'+(c===LANG?' sel':'');b.lang=c;b.textContent=name;
  b.onclick=()=>{LANG=c;store.set('jugoya_lang',c);sfx.ok();applyStatic();toTitle();};box.appendChild(b);});
}
$('btnLang').onclick=()=>{audioInit();sfx.tap();openLang();};
applyStatic();

})();
</script>
