/* Layout: one full-screen pixel canvas stage; every label is a thresholded 16-dot bitmap canvas scaled by whole numbers. */
:root{
  --bg:#140b1a; --ink:#1b0e14; --cream:#fff3d6; --clay:#e8743b; --sun:#ffd23f; --sky:#5ad1ff; --pink:#ff4fa3; --danger:#ff4a4a;
  --font-ui:'HPX-ja','Hiragino Kaku Gothic ProN','Noto Sans JP',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--cream);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-ui)}
#app{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
#stage{position:relative;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.px{display:block;line-height:0}
.px canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:6px}
#hud .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gauge{display:flex;align-items:center;gap:6px}
.bar{width:min(120px,30vw);height:14px;border:2px solid var(--ink);background:#3a1e14;box-shadow:0 3px 0 var(--ink);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(var(--sun) 0 35%,var(--clay) 35% 100%)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--ink) 9px 11px);opacity:.55}
.bar.low i{background:var(--danger);animation:blink .35s steps(2) infinite}
.bar.fever i{background:linear-gradient(90deg,#ff4fa3,#ffd23f,#3ee07a,#5ad1ff,#b07bff);background-size:200% 100%;animation:rb .5s steps(8) infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes rb{to{background-position:200% 0}}
.btns{display:flex;gap:6px;pointer-events:auto}
.btn-s{width:34px;height:34px;display:grid;place-items:center;background:var(--cream);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}
.btn-s:active{transform:translateY(3px);box-shadow:none}
.chip{display:flex;align-items:center;gap:6px}
.flag{width:14px;height:10px;border:2px solid var(--ink);display:inline-block;flex:none}
.flag.JP{background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #e8243b}
.flag.BR{background:#1fa04a;box-shadow:inset 0 0 0 2px #1fa04a,inset 0 0 0 4px #ffd23f,inset 0 0 0 8px #2b49c9}
#depth{display:flex;justify-content:flex-end}
#combo{position:absolute;right:12px;top:50%;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#combo.pop{animation:hop .24s steps(3)}
@keyframes hop{0%{transform:translateY(-10px)}100%{transform:none}}
#banner{position:absolute;left:0;right:0;top:26%;pointer-events:none;opacity:0;padding-inline:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
#banner.show{animation:slam 2.8s steps(28) forwards}
@keyframes slam{0%{opacity:0;transform:scale(2)}8%{opacity:1;transform:scale(1)}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 36px);text-align:center;background:rgba(20,11,26,.62)}
#title{justify-content:space-between;background:linear-gradient(to bottom,transparent 72%,rgba(20,11,26,.7) 100%)}
#guide{background:rgba(20,11,26,.88)}
.gbox{display:flex;flex-direction:column;gap:10px;background:rgba(27,14,20,.9);border:3px solid var(--cream);box-shadow:0 0 0 3px var(--ink);padding:14px 12px;max-width:100%}
.grow{display:flex;align-items:center;gap:10px}
.grow canvas.ic{width:30px;height:30px;flex:none;image-rendering:pixelated}
#logo{margin-top:6px;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.go{display:grid;place-items:center;background:var(--sun);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:12px 26px;cursor:pointer}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.go.sub{background:var(--cream);padding:9px 18px}
.go:focus-visible,.btn-s:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;align-items:center;background:rgba(27,14,20,.8);border:2px solid var(--ink);padding:12px 14px}
.stats .r{justify-self:end}
#newRec{animation:blink .5s steps(2) infinite}
.skip{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--cream);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 10px;cursor:pointer}
#story{position:absolute;inset:0;cursor:pointer;background:linear-gradient(to bottom,transparent 55%,rgba(20,11,26,.55))}
.sbox{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);min-height:118px;background:rgba(27,14,20,.92);border:3px solid var(--cream);box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);padding:12px 12px 22px;display:flex;flex-direction:column;gap:8px}
.nxt{position:absolute;right:10px;bottom:6px;animation:blink .6s steps(2) infinite}
#narr{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(27,14,20,.82);border:2px solid var(--ink);padding:8px 10px;pointer-events:none}
.go.lang{display:flex;align-items:center;gap:8px}
.go.lang canvas.ic{width:20px;height:20px;image-rendering:pixelated}
#langSel{background:rgba(20,11,26,.9)}
.lgrid{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:min(260px,80%)}
.lgrid .go{padding:10px 14px}
.lgrid .go.on{background:var(--sun)}
.lgrid .go:not(.on){background:var(--cream)}
.rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
@media (prefers-reduced-motion:reduce){#banner.show{animation:fadeonly 2.8s steps(4) forwards}#combo.pop,#logo,#newRec{animation:none}}
@keyframes fadeonly{0%,85%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="180" height="320" aria-label="ゲーム画面"></canvas>
    <div id="hud" hidden>
      <div class="row">
        <div class="gauge"><span class="px" id="tFuel"></span><div class="bar" id="bar"><i id="fuel"></i></div></div>
        <div class="btns"><button class="btn-s" id="bMute" aria-label="音を切る"></button><button class="btn-s" id="bPause" aria-label="一時停止"></button></div>
      </div>
      <div class="row">
        <div class="chip"><i class="flag JP" id="flag"></i><span class="px" id="era"></span></div>
        <span class="px" id="score"></span>
      </div>
      <div class="row" style="align-items:flex-start"><span class="px" id="ally"></span><div class="px" id="depth"></div></div>
    </div>
    <div id="combo" hidden><span class="px" id="cNum"></span><span class="px" id="cLbl"></span></div>
    <div id="banner"></div>

    <div id="title" class="screen">
      <div class="px" id="logo"></div>
      <div class="col tb">
        <button class="go" id="bStart" aria-label="掘りはじめる"></button>
        <div class="rowb"><button class="go sub" id="bGuide" aria-label="あそびかた"></button><button class="go sub lang" id="bLang" aria-label="Language"></button></div>
        <div class="px" id="bestT"></div>
      </div>
    </div>

    <div id="langSel" class="screen" hidden>
      <div class="lgrid" id="lgrid"></div>
    </div>

    <div id="guide" class="screen" hidden>
      <div class="px" id="guideH"></div>
      <div class="gbox" id="gbox"></div>
      <button class="go" id="bGuideClose" aria-label="とじる"></button>
    </div>

    <div id="pause" class="screen" hidden>
      <div class="px" id="pauseH"></div>
      <div class="rowb"><button class="go" id="bResume" aria-label="つづける"></button><button class="go sub" id="bQuit" aria-label="タイトルへ"></button></div>
    </div>

    <div id="narr" hidden><span class="px" id="narrT"></span></div>

    <div id="story" hidden>
      <button class="skip" id="bSkip" aria-label="スキップ"></button>
      <div class="sbox"><span class="px" id="stWho"></span><span class="px" id="stText"></span><span class="px nxt" id="stNext"></span></div>
    </div>

    <div id="clear" class="screen" hidden>
      <div class="px" id="clearT"></div>
      <div class="stats" id="clearStats"></div>
      <div class="rowb"><button class="go" id="bMore" aria-label="もっと掘る"></button><button class="go sub" id="bTitle2" aria-label="タイトルへ"></button></div>
    </div>

    <div id="over" class="screen" hidden>
      <div class="px" id="overT"></div>

// haniwa sprite
function buildHaniwa(frame){
  const w=18,h=26,m=[...Array(h)].map(()=>Array(w).fill(0));
  const F=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)m[y][x]=1;};
  F(7,2,10,2);F(6,3,11,9);F(7,10,10,10);F(6,11,11,20);F(5,19,12,21);F(4,22,13,22);
  const up=s=>{if(s<0){F(4,12,5,13);F(3,6,4,13);}else{F(12,12,13,13);F(13,6,14,13);}};
  const dn=s=>{if(s<0){F(4,12,5,13);F(3,13,4,17);}else{F(12,12,13,13);F(13,13,14,17);}};
  if(frame===0){up(-1);dn(1);}else if(frame===1){dn(-1);up(1);}else if(frame===2){up(-1);up(1);}else{dn(-1);F(12,11,16,12);}
  const c=mkC(w,h),g=c.getContext('2d'),f=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&m[y][x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(f(x,y)){g.fillStyle=!f(x-1,y)?'#ffab6b':!f(x+1,y)?'#b4501f':(y===15||y===21)?'#c85a28':'#e8743b';g.fillRect(x,y,1,1);}
    else if(f(x-1,y)||f(x+1,y)||f(x,y-1)||f(x,y+1)){g.fillStyle='#3a1608';g.fillRect(x,y,1,1);}
  }
  g.fillStyle='#2a0f06';[[7,5],[7,6],[10,5],[10,6],[8,8],[9,8]].forEach(([x,y])=>g.fillRect(x,y,1,1));
  g.fillStyle='#ff8fa3';g.fillRect(6,7,1,1);g.fillRect(11,7,1,1);
  return c;}

function genRow(r){
  const row=new Uint8Array(COLS),li=layerIdx(r),s=legSeed,lg=leg,edge=Math.min(r,L-r);
  if(r===0||r===L){row.fill(GRASS);return row;}
  if(r===HALF){return row;}
  const P=[.024,.024,.021,.021,.015,.024][li];
  const WT=[[55,10,25,0,8,0.5,44.2,8],[50,10,30,0,8,0.4,44.2,8],[45,35,10,8,1.5,0.5,40.8,8],[45,25,0,28,0,0.6,40.8,8],[40,40,0,18,0,0.6,37.4,8],[35,20,0,43,0,0.6,40.8,8]][li].slice();
  WT[0]*=Math.pow(.93,lg);
  const tot=WT.reduce((a,b)=>a+b,0);
  for(let c=0;c<COLS;c++){
    const cave=fbm(c*.2,r*.1,s),vein=fbm(c*.28+40,r*.16,s+5),ore=vnoise(c*.4+90,r*.22,s+9),rr=hash(c,r,s+3);
    let t;
    switch(li){
      case 0:t=SOIL;if(edge>3&&cave>.74)t=AIR;break;
      case 1:t=CLAY;if(cave>.7)t=AIR;else if(vein>.8-lg*.01)t=HARD;break;
      case 2:t=STONE;if(cave>.64)t=AIR;else if(vein>.67-lg*.015)t=HARD;break;
      case 3:t=MANTLE;if(cave>.66)t=MAGMA;else if(cave<.24)t=AIR;else if(vein>.74-lg*.012)t=HARD;break;
      case 4:t=METAL;if(vein>.6-lg*.01)t=CORE;break;
      default:t=CORE;if(cave>.66)t=AIR;else if(vein>.8-lg*.01)t=HARD;
    }
    if(t!==AIR&&t!==HARD&&t!==MAGMA&&edge>2){
      const p=P*(ore>.64?4:.5);
      if(rr<p){let q=hash(c,r,s+11)*tot;for(let i=0;i<8;i++){q-=WT[i];if(q<=0){t=MAGA+i;break;}}}
    }
    row[c]=t;
  }
  return row;
}
function getRow(r){if(r<0||r>L)return null;return rows[r]||(rows[r]=genRow(r));}
function tileAt(c,r){if(c<0||c>=COLS)return AIR;const row=getRow(r);return row?row[c]:AIR;}

function breakTile(c,r,t,byAlly){
  const row=getRow(r);if(!row)return;row[c]=AIR;DBG.brk++;DBG.cost+=hardOf(t);
  const hv=hardOf(t),x=c*TS+5,y=r*TS+5;
  if(!byAlly&&fever<=0){if(t===HARD&&allies.length){if(T-lastLoss>.3){loseAlly();lastLoss=T;}}else{h.vy=Math.max(noFuel?0:VMIN,h.vy-hv*11/(1+allies.length*.05));fuel-=hv*hv*.015;}}
  if(t>=20){
    burst(x,y,byAlly?3:6,[ITEM[t].col,'#ffffff'],120);collect(t,x,y,byAlly);
  }else{
    const cols=TCOL[t]||['#888'];burst(x,y,byAlly?1:3,cols,90);sfx.dig(hv);
    if(!byAlly&&t===HARD&&fever<=0){shake=Math.max(shake,.12);burst(x,y,4,['#9a86e6','#ffffff'],140);}
  }
}
function collect(t,x,y,byAlly){
  const it=ITEM[t];
  if(T-lastPick<1.2)combo++;else combo=1;lastPick=T;maxCombo=Math.max(maxCombo,combo);
  const mult=Math.min(4,1+combo*.1),v=Math.round(it.score*mult);score+=v;
  fuel=Math.min(100,fuel+it.fuel*(byAlly?BAL.af:1));
  if(it.ally)addAlly(x,y,it.ally);else{pop(x,y-4,'+'+v,it.col);sfx.pick(combo);}comboUI(true);
  if(t===MIRR||t===HOUR){hitstop=.07;flash=Math.max(flash,.18);sfx.big();buzz(25);}
  if(fever<=0&&(t===HOUR||(combo>=nextFev&&feverCD<=0))){startFever();nextFev=Math.round(nextFev*1.6)+6;}
}

let TITLE_LOGO_B=40;
function titleSurface(){
  const sr=stage.getBoundingClientRect(),k=H/(sr.height||H);
  let sy=H*.56;
  const col=document.querySelector('#title .tb'),lg=$('logo');
  if(lg){const lb=(lg.getBoundingClientRect().bottom-sr.top)*k;sy=Math.max(sy,lb+96);}
  if(col){const ct=(col.getBoundingClientRect().top-sr.top)*k;sy=Math.min(sy,ct-14);}
  TITLE_LOGO_B=lg?(lg.getBoundingClientRect().bottom-sr.top)*k:40;
  return Math.round(sy);
}
// ───────── update ─────────
let keyDir=0;const DBG={brk:0,cost:0};
function update(dt){
  T+=dt;
  if(state==='title'){h.y=-12;h.x=90;h.ang=0;cam.y=-titleSurface();return;}
  if(state==='story'||state==='cleared'){shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);warp=0;cv.style.filter='';}
  if(state==='cleared')return;
  if(state==='story'){storyTick(dt);if(!ended){cam.y=-H*.5;h.y=-12;h.x=90;h.ang=0;}else{
    h.vy=Math.min(-30,h.vy*Math.exp(-1.6*dt));h.y=Math.max(-150,h.y+h.vy*dt);h.ang=0;
    for(const a of allies){const f=1-Math.exp(-a.k*dt);a.x+=(clamp(h.x+a.ox*1.4,4,W-4)-a.x)*f;a.y+=(h.y-a.oy*1.2-a.y)*f;a.f+=dt*6;}
    cam.y+=((h.y-H*.42)-cam.y)*(1-Math.exp(-4*dt));
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
    for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<.9);}
    return;}
  if(state!=='play')return;
  narrTick(dt);
  flash=Math.max(0,flash-dt*.6);
  if(slowT>0){slowT-=dt;const k=clamp(slowT/SLOW_DUR,0,1);dt*=1-.75*Math.sqrt(k);}
  if(prep>=0){prepTick(dt);return;}
  if(hitstop>0){hitstop-=dt;return;}
  // steering
  if(keyDir)h.tx=clamp(h.tx+keyDir*170*dt,7,W-7);
  const mv=clamp(h.tx-h.x,-230*dt,230*dt);h.x=clamp(h.x+mv,7,W-7);
  const r=Math.floor(h.y/TS),under=r>0&&r<L,ct=under?tileAt(Math.floor(h.x/TS),r):AIR;
  if(feverCD>0)feverCD-=dt;if(fever>0){fever-=dt;if(fever<=0){combo=0;nextFev=12;feverCD=4;comboUI(false);}}
  // fuel
  if(under&&fever<=0){const li=layerIdx(r);fuel-=dt*((BAL.d0+BAL.d1*Math.min(leg,14)+Math.max(0,leg-14)*.9+allies.length*BAL.up)+(li>=3?.5:0)+(ct===MAGMA?2.5:0));}
  if(fuel<=0&&!noFuel){fuel=0;noFuel=true;sfx.down();banner(TX.fuelOut,'','','');}
  if(fuel<25&&!lowWarned&&!noFuel){lowWarned=true;sfx.warn();}
  if(fuel>35)lowWarned=false;
  // vertical
  const boost=Math.min(240,allies.length*1.7),vmax=(fever>0?VFEV:(ct===METAL?VLIQ:VMAX))+boost;
  if(noFuel){h.vy=h.vy<0?h.vy+G*dt:h.vy*Math.exp(-2.4*dt);}
  else if(h.vy<vmax)h.vy=Math.min(vmax,h.vy+(G+boost*2)*dt);else h.vy-=(h.vy-vmax)*3*dt;
  const n=Math.max(1,Math.ceil(Math.abs(h.vy*dt)/4));
  for(let i=0;i<n;i++){h.y+=h.vy*dt/n;if(h.vy>0)digAt();}
  // allies follow in a comet tail and dig
  {const dir=allyDir();
   let byeDone=false,gone=-1;
   for(let i=0;i<allies.length;i++){const a=allies[i],tx=clamp(h.x+a.ox,4,W-4),ty=h.y+a.oy*dir,f=1-Math.exp(-a.k*dt);
     a.x+=(tx-a.x)*f;a.y+=(ty-a.y)*Math.min(1,f*1.8);a.f+=dt*(8+Math.abs(h.vy)/50);
     if(under)a.life-=dt;
     if(a.life<=0&&!byeDone&&T-lastBye>ALLY_BYE_GAP){gone=i;byeDone=true;lastBye=T;continue;}
     if(h.vy>0&&!noFuel){const c=Math.floor(a.x/TS),r2=Math.floor((a.y+6)/TS);if(r2>0&&r2<L&&c>=0&&c<COLS){const t2=tileAt(c,r2);
       if(t2===HARD&&fever<=0){getRow(r2)[c]=AIR;burst(c*TS+5,r2*TS+5,3,['#3b3352','#9a86e6'],100);if(gone<0)gone=-2-i;continue;}
       if(!passable(t2))breakTile(c,r2,t2,true);}}}
   if(gone>=0)dropAlly(gone,'bye');else if(gone<=-2)dropAlly(-2-gone,'bonk');}
  // angle: head-down while diving
  if(h.vy>0)h.ang=Math.min(Math.PI,h.ang+FLIP_RATE*dt);else if(h.vy<-60)h.ang=Math.max(0,h.ang-FLIP_RATE*dt);
  // events
  if(!leaped&&h.y>HALF*TS+5)timeLeap();
  if(h.y>(L+1)*TS+4&&h.vy>0)newLeg();
  if(noFuel){if(h.vy<14&&h.y>0){stopT+=dt;if(stopT>.9)gameOver();}else stopT=0;}
  if(T-lastPick>1.2&&combo>0&&fever<=0){combo=0;nextFev=12;comboUI(false);}
  // camera

// ───────── audio ─────────
var muted=false;let AC=null,master=null,noiseBuf=null,lastDig=0;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);
  const len=AC.sampleRate*.6|0;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function tone(f,dur,type,vol,when=0,to){if(!AC||muted)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
function nz(dur,freq,vol,q=1,type='bandpass',when=0){if(!AC||muted)return;const t=AC.currentTime+when,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.1);s.stop(t+dur+.03);}
const PENTA=[0,2,4,7,9];
const sfx={
  dig(hv){if(!AC)return;const n=AC.currentTime;if(n-lastDig<.04)return;lastDig=n;nz(.05,hv>5?380:800+Math.random()*700,.16,1.3);if(hv>5)tone(150,.09,'square',.05);},
  pick(k){const i=Math.min(k-1,14),semi=PENTA[i%5]+12*Math.floor(i/5),f=523.25*Math.pow(2,semi/12);tone(f,.09,'square',.06);tone(f*2,.14,'triangle',.05,.04);},
  big(){[0,4,7,12].forEach((s,i)=>tone(659*Math.pow(2,s/12),.18,'square',.05,i*.05));},
  fever(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.12,'square',.05,i*.045));},
  leap(){tone(180,1,'sawtooth',.07,0,2400);tone(240,1,'square',.04,.1,3200);nz(1,2000,.08,.5,'highpass');[0,7,12,19].forEach((s,i)=>tone(784*Math.pow(2,s/12),.25,'triangle',.06,.6+i*.07));},
  boom(){nz(.6,300,.35,.7,'lowpass');tone(110,.5,'sine',.25,0,40);[0,4,7].forEach((s,i)=>tone(523*Math.pow(2,s/12),.2,'square',.05,.15+i*.06));},
  warn(){tone(880,.08,'square',.05);tone(660,.1,'square',.05,.1);},
  down(){tone(440,.5,'square',.06,0,110);},
  over(){[12,7,4,0].forEach((s,i)=>tone(392*Math.pow(2,s/12),.22,'triangle',.07,i*.16));},
  join(n){const i=Math.min(n,40),f=392*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5)%36)/12);tone(Math.min(f,2400),.07,'square',.05);tone(Math.min(f*1.5,3200),.09,'triangle',.04,.05);},
  crack(){nz(.18,2600,.18,2,'bandpass');tone(900,.08,'square',.04,0,300);},
  kapo(){tone(520,.06,'square',.07,0,900);tone(1200,.05,'triangle',.05,.05);nz(.05,3000,.08,2);},
  yoshi(){tone(660,.08,'square',.06);tone(990,.14,'square',.06,.08);},
  whistle(){tone(1400,.18,'triangle',.05,0,1700);tone(1700,.12,'triangle',.04,.2,1300);},
  bye(){tone(1046,.05,'triangle',.03);tone(784,.07,'triangle',.03,.05);},
  blip(){tone(660+Math.random()*60,.03,'square',.025);},
  fanfare(){[0,4,7,12,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.22,'square',.05,i*.12));},
  start(){[0,4,7].forEach((s,i)=>tone(523*Math.pow(2,s/12),.1,'square',.05,i*.06));},
};

let drag=null;

addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keyDir=-1;else if(e.key==='ArrowRight'||e.key==='d')keyDir=1;else if((e.key===' '||e.key==='Enter')&&state==='title')$('bStart').click();else if((e.key===' '||e.key==='Enter')&&state==='story')storyTap();else if(e.key==='Escape'||e.key==='p')togglePause();});
addEventListener('keyup',e=>{if((e.key==='ArrowLeft'||e.key==='a')&&keyDir<0)keyDir=0;if((e.key==='ArrowRight'||e.key==='d')&&keyDir>0)keyDir=0;});
function start(){audioInit();if(AC&&AC.state==='suspended')AC.resume();sfx.start();$('title').hidden=true;$('over').hidden=true;$('clear').hidden=true;$('story').hidden=true;newGame();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}
function togglePause(){if(state==='story')return;if(state==='play'){state='paused';$('pause').hidden=false;}else if(state==='paused'){state='play';$('pause').hidden=true;}}
function toTitle(){state='title';$('pause').hidden=true;$('over').hidden=true;$('clear').hidden=true;$('story').hidden=true;$('narr').hidden=true;allies=[];$('title').hidden=false;showHUD(false);cv.style.filter='';era=0;eraStart=0;rows=[];legSeed=1;h.x=90;h.y=-12;h.ang=0;h.vy=0;parts=[];pops=[];comboEl.hidden=true;bestText();}
$('bStart').onclick=()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();playOpening();};$('bRetry').onclick=()=>{$('over').hidden=true;playOpening();};$('bTitle').onclick=toTitle;$('bQuit').onclick=toTitle;
$('bPause').onclick=togglePause;$('bResume').onclick=togglePause;
$('bMute').onclick=()=>{muted=!muted;px('bMute',muted?TX.muteOff:TX.muteOn,{outline:0,shadow:0,color:COL.ink});$('bMute').setAttribute('aria-label',muted?'音を出す':'音を切る');};
['bPause','bMute'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));

let last=performance.now();
function loop(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}

window.__haniwa={fontsReady:()=>pxFontReady(),setLang:l=>setLang(l),get lang(){return LANG;},get prep(){return prep;},get helm(){return helmOn;},px:(e,t,o)=>px(e,t,o||{}),feverOn:()=>startFever(),get st(){return state;},get allies(){return allies.length;},get maxAllies(){return maxAllies;},addAlly:(n)=>addAlly(h.x,h.y,n),get dbg(){const d={...DBG,seed:legSeed};DBG.brk=0;DBG.cost=0;return d;},get fever(){return fever;},get vy(){return h.vy;},tileAt:(c,r)=>tileAt(c,r),get state(){return state;},start,update,render,get h(){return h;},get era(){return era;},get fuel(){return fuel;},setFuel(v){fuel=v;},get legs(){return legsDone;},get score(){return score;}};

})();
