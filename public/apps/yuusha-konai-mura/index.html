/* Layout: two fixed regions — #screen (HUD + world + overlays) and #pad (controller). Overlays live only in #screen, so they can never cover the controls. */
:root{
  --ink0:#0b0a17; --ink:#16142a; --ink2:#1e1b37;
  --panel:#27234a; --panel2:#35305f; --line:#efe3c4;
  --text:#f6f0e0; --dim:#b6aed6; --lamp:#ffd24a; --stamp:#ff4d5e; --leaf:#7fe39a; --sky:#86c8ff;
  --paper:#f3e9cf; --paperInk:#2a2238;
  --f-body: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-disp:"Pixelify Sans",var(--f-body);
  --fs:15px; --padH:172px; --stickD:120px; --btnD:60px;
  color-scheme:dark;
}
:root:lang(ja){--f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",sans-serif;--f-disp:"DotGothic16","Noto Sans CJK JP",var(--f-body)}
:root:lang(zh-CN){--f-body:"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;--f-disp:var(--f-body)}
:root:lang(zh-TW){--f-body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC","Microsoft JhengHei",sans-serif;--f-disp:var(--f-body)}
:root:lang(ko){--f-body:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;--f-disp:var(--f-body)}
html,body{height:100%;margin:0;background:var(--ink0);overflow:hidden;overscroll-behavior:none}
body{color:var(--text);font-family:var(--f-body);font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:lang(ja) .tx,:lang(zh-CN) .tx,:lang(zh-TW) .tx{line-break:strict}
:lang(ko) .tx{word-break:keep-all}
.tx{overflow-wrap:break-word;hyphens:auto}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--ink);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}
#app.need-safe{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#screen{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}

/* HUD */
#hud{grid-row:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;background:linear-gradient(var(--ink0),var(--ink2));border-bottom:2px solid var(--ink0);font-size:13px;min-width:0}
#hud[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;min-height:24px;border:2px solid var(--ink0);background:var(--panel);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.day{font-family:var(--f-disp);font-size:14px;color:var(--lamp);letter-spacing:.04em}
.chip.raid{background:#3b1d32;color:#ffd1d6}
.chip.raid.now{background:var(--stamp);color:#fff}
.pips{display:inline-flex;gap:2px}
.pip{width:8px;height:10px;background:var(--ink0);box-shadow:inset 0 0 0 1px #4a4478}
.pip.on{background:var(--lamp);box-shadow:inset 0 -2px 0 #c99a1c}
.res{display:inline-flex;gap:8px;margin-inline-start:auto}
.res span{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;image-rendering:pixelated;flex:none}

/* Stage */
#stage{grid-row:2;position:relative;overflow:hidden;background:#10281a;min-height:0;touch-action:none}
#cv{position:absolute;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:var(--ink0);opacity:0;pointer-events:none;transition:opacity .35s steps(5);z-index:60}
#toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(92%,360px);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:15}
.toast{display:flex;align-items:center;gap:8px;padding:4px 10px;background:rgba(14,12,30,.92);border:2px solid var(--panel2);font-size:.88em;animation:tin .22s steps(3) both}
.toast.bonus{border-color:var(--lamp);color:var(--lamp)}
.toast.out{animation:tout .3s steps(3) both}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-6px);opacity:0}}
#prompt{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;background:rgba(14,12,30,.9);border:2px solid var(--ink0);box-shadow:0 0 0 1px var(--panel2);font-size:.85em;pointer-events:none;z-index:12}
#prompt[hidden]{display:none}
#prompt b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--lamp);color:var(--ink0);font-family:"Pixelify Sans",var(--f-body);font-size:12px;flex:none}

/* Dialog lives inside the stage, never over the pad */
#dlg{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px);display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:rgba(14,12,30,.96);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink0),0 6px 0 rgba(0,0,0,.35);z-index:30;box-sizing:border-box}
#dlg[hidden]{display:none}
.dlg-name{align-self:flex-start;max-width:100%;background:var(--lamp);color:var(--ink0);font-weight:700;font-size:.82em;padding:1px 8px;box-shadow:2px 2px 0 var(--ink0)}
.dlg-name[hidden]{display:none}
.dlg-body{overflow-y:auto;min-height:2.9em;white-space:pre-line;line-height:1.6;touch-action:pan-y;overscroll-behavior:contain}
.dlg-body .rest{visibility:hidden}
.dlg-foot{display:flex;justify-content:flex-end;min-height:12px}
.more{width:10px;height:8px;background:var(--lamp);clip-path:polygon(0 0,100% 0,50% 100%);animation:blink 1s steps(2) infinite}
.more[hidden]{display:none}
@keyframes blink{50%{opacity:.15}}
.choices{display:grid;gap:6px}

/* Buttons */
.btn{display:grid;grid-template-columns:1.1em minmax(0,1fr);align-items:center;gap:4px;min-height:44px;padding:8px 12px 8px 6px;background:var(--panel2);border:2px solid var(--ink0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.07);color:var(--text);text-align:start;cursor:pointer;line-height:1.3;box-sizing:border-box;min-width:0;touch-action:manipulation}
.btn::before{content:"";color:var(--lamp);font-size:.8em}
.btn.is-focus{outline:2px solid var(--lamp);outline-offset:1px}
.btn.is-focus::before{content:"▶"}
.btn:active,.btn.is-down{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.btn[disabled]{opacity:.42;cursor:default}
.btn.primary{background:#4a3f86}
.btn.danger{background:#5a2236}
.btn .lbl{display:flex;align-items:center;gap:8px;min-width:0}
.btn .lbl>span{min-width:0}
.btn img.ico{width:22px;height:22px}
.grid2>.btn,.title-row>.btn{container-type:inline-size}
@container (max-width:150px){.lbl img.ico{display:none}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;min-width:44px;padding:6px 12px;background:var(--ink2);border:2px solid var(--ink0);color:var(--dim);cursor:pointer;box-sizing:border-box;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--lamp);color:var(--ink0);font-weight:700}
.seg button.is-focus{outline:2px solid var(--lamp);outline-offset:2px}

/* Layers */
#ui{position:absolute;inset:0;pointer-events:none;z-index:40}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:rgba(9,8,20,.74);pointer-events:auto}
.panel{width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;min-height:0;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink0),5px 5px 0 2px rgba(0,0,0,.35);box-sizing:border-box}
.panel-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:2px solid var(--ink0);background:var(--ink2);flex-wrap:wrap}
.panel-title{flex:1 1 8em;min-width:0;font-family:var(--f-disp);font-size:1.15em;color:var(--lamp);letter-spacing:.03em}
.panel-head .btn{flex:none}
.panel-body{overflow-y:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;overscroll-behavior:contain}
.scroll-hint{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px;font-size:.78em;color:var(--dim);border-top:2px solid var(--ink0);background:var(--ink2)}
.scroll-hint[hidden]{display:none}
.scroll-hint::before{content:"";width:8px;height:6px;background:var(--dim);clip-path:polygon(0 0,100% 0,50% 100%)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5em),1fr));gap:8px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec-h{font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
:lang(ja) .sec-h,:lang(zh-CN) .sec-h,:lang(zh-TW) .sec-h,:lang(ko) .sec-h{letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 10px;background:var(--ink2);border:2px solid var(--ink0);min-width:0}
.row .grow{flex:1 1 7em;min-width:0}
.row .num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.desc{font-size:.84em;color:var(--dim)}
.note{font-size:.82em;color:var(--dim)}
.warn{font-size:.85em;color:#ffd1d6;background:#3b1d32;border:2px solid var(--ink0);padding:6px 10px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.set-row>.k{flex:1 1 8em;min-width:0}
.bar{display:inline-flex;gap:3px}
.bar i{width:10px;height:10px;background:var(--ink0);box-shadow:inset 0 0 0 1px #4a4478}
.bar i.on{background:var(--leaf)}
.state{display:inline-block;padding:1px 8px;font-size:.8em;border:2px solid var(--ink0);max-width:100%;box-sizing:border-box}
.state.ok{background:#1f4a35;color:var(--leaf)}
.state.no{background:var(--ink0);color:var(--dim)}
.state.great{background:#1f4a35;color:var(--leaf)}
.state.mid{background:#4a3a14;color:var(--lamp)}
.state.bad{background:#4a1626;color:#ffb3bd}
.big{font-family:var(--f-disp);font-size:2.2em;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums}

/* Letter */
.paper{background:var(--paper);color:var(--paperInk);border:2px solid var(--ink0);box-shadow:4px 4px 0 rgba(0,0,0,.35);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}

.hanko{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);padding:1px 8px;font-weight:800;transform:rotate(-6deg);letter-spacing:.06em}

/* Title */
.layer.title{background:linear-gradient(rgba(9,8,20,.15),rgba(9,8,20,.55) 45%,rgba(9,8,20,.9));align-items:stretch;flex-direction:column;justify-content:space-between;gap:10px;padding:14px;overflow-y:auto;touch-action:pan-y}
@media (max-height:520px) and (min-aspect-ratio:1/1){.layer.title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto;align-items:center;gap:8px 18px}.layer.title .logo{grid-row:1/3}.layer.title .title-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9em),1fr));gap:8px}
.title-foot{grid-column:2}.layer.title .logo h1{font-size:clamp(20px,3.8vw,32px)}.layer.title .logo p{font-size:.85em}.layer.title .title-menu{gap:6px}.layer.title .title-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9em),1fr));gap:8px}
.title-foot{font-size:.68em}}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:6px}
.logo h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(28px,9.4vw,46px);line-height:1.12;color:var(--lamp);text-wrap:balance;text-shadow:0 3px 0 var(--ink0),3px 0 0 var(--ink0),-3px 0 0 var(--ink0),0 -3px 0 var(--ink0),3px 3px 0 var(--ink0),-3px 3px 0 var(--ink0),0 7px 0 #7a1f30;max-width:100%}

.logo p{margin:0;max-width:30em;color:var(--text);font-size:.92em;text-shadow:0 2px 0 var(--ink0)}
.logo .hanko{font-size:.8em;background:rgba(243,233,207,.92)}
.title-menu{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px;margin:0 auto}
.title-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9em),1fr));gap:8px}
.title-foot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.74em;color:var(--dim)}

/* Day card */
.layer.card{background:rgba(9,8,20,.9);flex-direction:column;gap:6px;text-align:center}
.dc-kicker{font-family:var(--f-disp);color:var(--dim);letter-spacing:.2em;font-size:.9em}
.dc-num{font-family:"Pixelify Sans",var(--f-disp);font-weight:700;font-size:min(34vw,150px);line-height:.9;color:var(--lamp);text-shadow:0 6px 0 #7a1f30,6px 6px 0 var(--ink0);animation:slam .45s steps(6) both}
.dc-sub{font-family:var(--f-disp);font-size:clamp(20px,6.4vw,30px);max-width:92%;text-wrap:balance}
.kw{display:inline-block;white-space:nowrap}
.kc{display:inline-block;animation:pop .3s steps(3) both}
.dc-left{margin-top:8px}
@keyframes slam{0%{transform:scale(2.6) rotate(-8deg);opacity:0}55%{transform:scale(.9) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes pop{from{transform:translateY(10px) scale(1.4);opacity:0}to{transform:none;opacity:1}}

/* Ending */
.layer.ending{background:radial-gradient(circle at 50% 30%,#2a2450,#0b0a17 70%)}
.end-wrap{width:100%;max-width:460px;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
.end-scroll{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;touch-action:pan-y;padding:4px 2px}
.end-label{font-family:"Pixelify Sans",var(--f-disp);letter-spacing:.3em;color:var(--stamp);font-size:.9em}
.end-title{margin:0;font-family:var(--f-disp);font-size:clamp(24px,7.6vw,38px);line-height:1.2;color:var(--lamp);text-wrap:balance;text-shadow:0 4px 0 #7a1f30}
.end-title .kc{animation-name:drop;animation-duration:.5s;animation-timing-function:cubic-bezier(.2,1.6,.4,1)}
.end-lines{display:flex;flex-direction:column;gap:10px;line-height:1.7}
.end-lines p{margin:0;animation:fadein .6s both}
.end-friends{color:var(--leaf)}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Pad: fixed controller region */
#pad{position:relative;height:var(--padH);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:4px 12px 6px;box-sizing:border-box;background:linear-gradient(#1b1833,#100e22);border-top:2px solid var(--ink0);box-shadow:inset 0 2px 0 #2c2752;touch-action:none;z-index:50}

#app.lefty #pad .btnZone{order:1}
.stickZone{height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;min-width:0}
.stickBase{position:relative;width:var(--stickD);height:var(--stickD);border-radius:50%;background:radial-gradient(circle,#232046 0 55%,#2e2a5a 56% 60%,#1a1736 61%);box-shadow:inset 0 0 0 3px var(--ink0),0 3px 0 var(--ink0);flex:none}
.stickBase::before,.stickBase::after{content:"";position:absolute;left:50%;top:50%;background:#3a3570;transform:translate(-50%,-50%)}
.stickBase::before{width:60%;height:2px}.stickBase::after{width:2px;height:60%}
.stickKnob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a62b0,#3b3577 60%,#2a2558);box-shadow:inset 0 0 0 3px var(--ink0),0 4px 0 var(--ink0);will-change:transform;z-index:1}

.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pbtn{border:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.menuBtn{min-width:52px;min-height:44px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#2a2550;border:2px solid var(--ink0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);color:var(--dim);font-family:"Pixelify Sans",var(--f-body);font-size:10px;letter-spacing:.06em;border-radius:12px}
.menuBtn i{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor;margin:4px 0}
.menuBtn.is-down{transform:translateY(2px);box-shadow:none;color:var(--lamp)}
.btnZone{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:calc(var(--btnD) + 8px);min-width:0}
.bwrap.b{align-self:flex-end;margin-bottom:10%}
.bwrap.a{align-self:flex-start;margin-top:6%}
.round{width:var(--btnD);height:var(--btnD);border-radius:50%;font-family:"Pixelify Sans",var(--f-body);font-weight:700;font-size:calc(var(--btnD) * .38);color:var(--ink0);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 0 0 3px var(--ink0),0 4px 0 var(--ink0);flex:none}
#btnA{background:radial-gradient(circle at 35% 30%,#fff1a8,var(--lamp) 55%,#d9a520)}
#btnB{background:radial-gradient(circle at 35% 30%,#ffc2c9,#ff6b7a 55%,#c9374a)}
.round.is-down{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(0,0,0,.3),inset 0 0 0 3px var(--ink0),0 1px 0 var(--ink0);filter:brightness(.9)}
.plabel{max-width:100%;min-height:1.3em;font-size:11px;line-height:1.2;color:var(--dim);text-align:center;overflow-wrap:anywhere}
:lang(ko) .plabel{word-break:keep-all;overflow-wrap:anywhere}

/* v1.1 movie / fx */
.layer.movie{background:transparent;padding:0;display:block;z-index:70}
.mv-cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.mv-bar{position:absolute;left:0;right:0;height:9%;background:#000;z-index:2}
.mv-bar.top{top:0}.mv-bar.bot{bottom:0}
.mv-sub{position:absolute;left:5%;right:5%;bottom:calc(9% + 12px);z-index:3;text-align:center;font-family:var(--f-disp);font-size:clamp(15px,4.6vw,22px);line-height:1.5;color:#fff;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;text-wrap:balance}
.mv-sub .kc{animation:fadein .5s both}
.mv-big{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);z-index:3;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,10vw,52px);line-height:1.15;color:var(--lamp);text-shadow:0 4px 0 #7a1f30,4px 4px 0 #0b0a17,-3px 0 0 #0b0a17,3px 0 0 #0b0a17;text-wrap:balance}
.mv-big .kc{animation:slam .5s steps(5) both}
.mv-big[hidden]{display:none}
.mv-skip{position:absolute;right:10px;top:calc(9% + 8px);z-index:3;font-size:11px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:10px;max-width:60%}
.credits{position:absolute;left:6%;right:6%;top:100%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;font-family:var(--f-disp);text-shadow:0 2px 0 #000;animation:roll 13s linear forwards}
.cr-row{display:flex;flex-direction:column;gap:2px;min-height:1em}.cr-k{font-size:clamp(14px,4.4vw,20px)}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 80vh))}}
.impact{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:35;pointer-events:none;text-align:center;max-width:92%;--ic:var(--lamp)}
.impact-b{font-family:"Pixelify Sans",var(--f-disp);font-weight:700;font-size:clamp(48px,18vw,92px);line-height:1;color:var(--ic);text-shadow:0 5px 0 #7a1f30,5px 5px 0 #0b0a17,-3px 0 0 #0b0a17}
.impact-b .kc{animation:slam .36s steps(4) both}
.impact-s{font-family:var(--f-disp);font-size:clamp(14px,4.6vw,20px);color:#fff;text-shadow:0 2px 0 #000;animation:fadein .3s both}
.impact{animation:impOut 1.3s steps(8) both}
@keyframes impOut{0%,70%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.layer.raidcard{background:radial-gradient(circle,rgba(90,10,30,.92),rgba(9,8,20,.96) 70%)}
.raidt{font-size:clamp(38px,13vw,78px)!important;color:#ff4d5e!important;text-shadow:0 6px 0 #2a0710,6px 6px 0 #0b0a17!important;animation:none!important;text-wrap:balance;max-width:94%}
.raidt .kc{animation:slam .4s steps(5) both}
.res .bump{animation:bump .45s steps(4)}
@keyframes bump{0%{transform:scale(1.6);color:var(--lamp)}100%{transform:none}}
.paper.scorched{background:linear-gradient(135deg,#3a2a1a 0 6px,var(--paper) 14px calc(100% - 14px),#3a2a1a calc(100% - 6px));}
.paper.scorched .paper-body{font-style:italic}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* ===== v1.2 theme: translucent walnut panels, gold trim, pixel type ===== */
:root{--ink0:#120b06;--ink:#1d130b;--ink2:#2a1b10;--panel:rgba(56,35,20,.88);--panel2:rgba(98,64,36,.94);--line:#e2c27a;--trim:#8a6a32;--text:#f7ecd4;--dim:#d2bd98;--paper:#f3e6c4;--paperInk:#3a2614;
  --f-body:"YK Pixel JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-disp:var(--f-body);--fs:18px}

:root:lang(zh-CN){--f-body:"YK Pixel SC","PingFang SC","Noto Sans SC",sans-serif;--f-disp:var(--f-body)}
:root:lang(zh-TW){--f-body:"YK Pixel TC","PingFang TC","Noto Sans TC",sans-serif;--f-disp:var(--f-body)}
:root:lang(ko){--f-body:"YK Pixel KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--f-disp:var(--f-body)}
[lang="ja"]{font-family:"YK Pixel JP",sans-serif}[lang="zh-CN"]{font-family:"YK Pixel SC",sans-serif}[lang="zh-TW"]{font-family:"YK Pixel TC",sans-serif}[lang="ko"]{font-family:"YK Pixel KR",sans-serif}
html{font-family:var(--f-body)}
body,button,input,textarea{font-family:var(--f-body);-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;font-kerning:none;letter-spacing:0}
body{line-height:1.5}
.sec-h,.dc-kicker,.end-label{letter-spacing:0!important;text-transform:none}
/* type scale on the 12px pixel grid */
#hud,.chip,.chip.day,.plabel,.sec-h,.mv-skip,.title-foot,.state,.menuBtn{font-size:12px}
.desc,.note,.warn,.toast,#prompt,.dlg-name,.paper-head,.mv-who{font-size:15px}
.panel-title{font-size:18px}
.logo h1{font-size:36px;line-height:1.25}
@media (min-width:400px){.logo h1{font-size:48px}}
.dc-num{font-size:120px}.dc-sub{font-size:24px}
.end-title{font-size:24px}@media (min-width:400px){.end-title{font-size:36px}}
.impact-b{font-size:72px}.impact-s{font-size:18px}
.mv-sub{font-size:18px}.mv-big{font-size:36px}@media (min-width:400px){.mv-big{font-size:48px}}
.raidt{font-size:48px!important}

/* walnut & gold surfaces */
#app{background:var(--ink)}
#hud{background:linear-gradient(rgba(18,11,6,.96),rgba(42,27,16,.92));border-bottom:2px solid var(--trim)}
.chip{background:rgba(56,35,20,.9);border-color:var(--ink0);box-shadow:inset 0 0 0 1px rgba(226,194,122,.18)}
.chip.raid{background:rgba(92,28,24,.92);color:#ffd9c9}
.pip{background:var(--ink0);box-shadow:inset 0 0 0 1px #6a4a26}

.toast{background:rgba(40,25,14,.92);border-color:var(--trim)}

.res-rank b{font-size:48px;line-height:1}
.res-rank .rk-S{color:#c98a00}
.end-sum{margin:0;max-width:30em}

@keyframes rankIn{from{opacity:0;transform:translateX(-50%) rotate(-6deg) scale(2.4)}to{opacity:1;transform:translateX(-50%) rotate(-6deg)}}

<div id="app">
  <div id="screen">
    <header id="hud" hidden></header>

      <canvas id="cv" width="160" height="200" aria-label=""></canvas>

        <div class="dlg-name tx" id="dlgName" hidden></div>

</div>

<script>
const STR={};

ja:{'title.sub':'五日後、魔物が来る。勇者は……たぶん来ない。','letter.1':'{name}殿\n五日後、魔物の群れが貴村を通る見込み。\n勇者アルトを派遣した。安心されたし。\n――王都','intro.1':'王都から手紙が届いた。五日後、魔物の群れがこの村を通るそうじゃ。',

'letters.night':'{d}日目・真夜中','hero.5':'北の峠で、魔物の本隊と交戦中',

en:{'title.sub':'Monsters arrive in five days. The hero... probably won\'t.','letter.1':'To {name},\nA horde of monsters is expected to pass through your village in five days.\nWe have dispatched Alto the Hero. Rest assured.\n— The Capital','intro.1':'A letter came from the capital. A horde of monsters will pass through this village in five days.',

fr:{'title.sub':'Les monstres arrivent dans cinq jours. Le héros… sans doute pas.','letter.1':'À {name},\nUne horde de monstres devrait traverser votre village dans cinq jours.\nNous avons envoyé Alto le héros. Soyez rassurés.\n— La capitale','intro.1':'Une lettre de la capitale. Une horde de monstres traversera le village dans cinq jours.',
