/* PixelMplus12 (c) itouhiro, M+ FONT LICENSE; subset to the characters used here */
/* Layout: one phone-width cartridge. Board scale is chosen first (integer device pixels per art pixel), and that same step --u drives every canvas and window, so art and UI share one pixel grid. Coral fill = something you can press. Gold / mint text with no fill = information. */
:root{
  --u:3px; --fs:20px;
  --ink:#0b0d1f; --night:#141a36; --ai:#1d2650; --ai2:#283670;
  --line:#dcdaf0; --line2:#8f8ab0; --text:#f4f2ff; --sub:#a8a4c0;
  --act:#e8434a; --act-hi:#ff6a5c; --act-lip:#a8233f;
  --gold:#ffc83c; --mint:#4fd6c8; --pink:#ff8ab4; --sky:#78b4ff;
  --f:"PixelMplus12","DotGothic16","Hiragino Sans",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f);font-size:var(--fs);line-height:1.6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--ink)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.lo{position:absolute;left:0;top:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:var(--u) solid var(--gold);outline-offset:calc(var(--u)*4)}
.screen{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .5s steps(5),visibility 0s linear .5s;pointer-events:none}
.screen.on{visibility:visible;opacity:1;transition:opacity .5s steps(5);pointer-events:auto}

/* ---------- flat info window ---------- */
.win{position:relative;background:var(--night);
  box-shadow:
   0 calc(var(--u)*-1) 0 0 var(--line),0 var(--u) 0 0 var(--line),calc(var(--u)*-1) 0 0 0 var(--line),var(--u) 0 0 0 var(--line),
   0 calc(var(--u)*-2) 0 0 var(--ink),0 calc(var(--u)*2) 0 0 var(--ink),calc(var(--u)*-2) 0 0 0 var(--ink),calc(var(--u)*2) 0 0 0 var(--ink),
   calc(var(--u)*-1) calc(var(--u)*-1) 0 0 var(--ink),var(--u) calc(var(--u)*-1) 0 0 var(--ink),calc(var(--u)*-1) var(--u) 0 0 var(--ink),var(--u) var(--u) 0 0 var(--ink),
   inset 0 var(--u) 0 0 var(--ai2)}
/* speaker name: a tab of the window itself, mint text, never filled */
.nametag{position:absolute;left:calc(var(--u)*3);top:0;transform:translateY(calc(-100% - var(--u)));padding:0 calc(var(--u)*4);background:var(--night);color:var(--mint);letter-spacing:.2em;line-height:1.5;
  box-shadow:0 calc(var(--u)*-1) 0 0 var(--line),calc(var(--u)*-1) 0 0 0 var(--line),var(--u) 0 0 0 var(--line),0 calc(var(--u)*-2) 0 0 var(--ink),calc(var(--u)*-2) 0 0 0 var(--ink),calc(var(--u)*2) 0 0 0 var(--ink)}
.nametag[hidden]{display:none}

/* ---------- pressable button: thick bevel lip ---------- */
.pbtn{--face:var(--night);--lip:var(--line2);--edge:var(--line);position:relative;display:block;min-width:210px;padding:calc(var(--u)*3) calc(var(--u)*6);text-align:center;letter-spacing:.12em;color:var(--text);background:var(--face);
  box-shadow:
   0 calc(var(--u)*-1) 0 0 var(--edge),0 var(--u) 0 0 var(--edge),calc(var(--u)*-1) 0 0 0 var(--edge),var(--u) 0 0 0 var(--edge),
   0 calc(var(--u)*2) 0 0 var(--lip),calc(var(--u)*-1) var(--u) 0 0 var(--lip),var(--u) var(--u) 0 0 var(--lip),
   0 calc(var(--u)*-2) 0 0 var(--ink),calc(var(--u)*-2) 0 0 0 var(--ink),calc(var(--u)*2) 0 0 0 var(--ink),
   calc(var(--u)*-1) calc(var(--u)*-1) 0 0 var(--ink),var(--u) calc(var(--u)*-1) 0 0 var(--ink),
   0 calc(var(--u)*3) 0 0 var(--ink),calc(var(--u)*-1) calc(var(--u)*2) 0 0 var(--ink),var(--u) calc(var(--u)*2) 0 0 var(--ink),calc(var(--u)*-2) var(--u) 0 0 var(--ink),calc(var(--u)*2) var(--u) 0 0 var(--ink),
   inset 0 var(--u) 0 0 rgba(255,255,255,.16)}
.pbtn:hover{--face:var(--ai)}
.pbtn.primary{--face:var(--act);--lip:var(--act-lip);--edge:#ffb08a;color:#ffffff}
.pbtn.primary:hover{--face:var(--act-hi)}
.pbtn:active{transform:translateY(var(--u));--lip:var(--edge)}
.pbtn[hidden]{display:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* pixel triangles drawn with box-shadow (no glyphs) */
.tri-d{width:calc(var(--u)*5);height:calc(var(--u)*3);background:var(--gold);
  clip-path:polygon(0 0,100% 0,100% 33.34%,80% 33.34%,80% 66.67%,60% 66.67%,60% 100%,40% 100%,40% 66.67%,20% 66.67%,20% 33.34%,0 33.34%)}
.tri-r{display:inline-block;flex:none;width:calc(var(--u)*3);height:calc(var(--u)*5);margin-right:calc(var(--u)*3);background:var(--gold);
  clip-path:polygon(0 0,33.34% 0,33.34% 20%,66.67% 20%,66.67% 40%,100% 40%,100% 60%,66.67% 60%,66.67% 80%,33.34% 80%,33.34% 100%,0 100%)}

/* ---------- title ---------- */
#title .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14);padding-inline:16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}
.logo .big{font-size:calc(var(--fs)*4);line-height:1;color:#ffffff;text-shadow:var(--u) var(--u) 0 var(--act),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
.logo .kana{font-size:calc(var(--fs)*2);line-height:1;letter-spacing:.4em;padding-left:.4em;color:var(--mint);text-shadow:var(--u) var(--u) 0 var(--ink)}
/* subtitle is an ornament: gold text between pixel rules, no fill */
.orn{display:flex;align-items:center;gap:calc(var(--u)*4);margin-top:calc(var(--u)*3);color:var(--gold);letter-spacing:.3em;padding-left:.3em}
.orn i{display:block;width:calc(var(--u)*8);height:var(--u);background:var(--gold);box-shadow:0 var(--u) 0 var(--ink)}
.menu{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8);min-height:150px}
.titleFoot{position:absolute;left:0;right:0;bottom:calc(var(--u)*6);display:flex;justify-content:center;gap:24px;color:var(--sub)}
.titleFoot button{color:var(--sub);text-decoration:underline;text-underline-offset:4px}

/* ---------- scene ---------- */
#tbox{--tbh:calc(var(--fs)*1.8*3 + var(--u)*12);box-sizing:border-box;position:absolute;left:calc(16px + var(--u)*2);right:calc(16px + var(--u)*2);bottom:calc(var(--u)*8);min-height:var(--tbh);padding:calc(var(--u)*6) calc(var(--u)*5) calc(var(--u)*6)}
#tbox.off{visibility:hidden}
#txt{margin:0;line-height:1.8;letter-spacing:.04em}
#txt.narr{color:#dcdaf0}
#next{position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*4);visibility:hidden}
#next.on{visibility:visible}
#skip{position:absolute;top:calc(var(--u)*6);right:calc(16px + var(--u)*2);min-width:0;padding:0 calc(var(--u)*4);letter-spacing:.15em}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*7);opacity:0;transition:opacity .8s steps(6);pointer-events:none;padding-inline:16px}
#card.on{opacity:1}
#card .num{font-size:calc(var(--fs)*4);line-height:1;color:var(--gold);text-shadow:var(--u) var(--u) 0 var(--act),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
#card .ttl{font-size:calc(var(--fs)*2);line-height:1;text-align:center;color:#ffffff;text-shadow:var(--u) var(--u) 0 var(--ink),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
#card .rule{display:flex;gap:calc(var(--u)*2)}
#card .rule i{width:var(--u);height:var(--u);background:var(--mint)}
#choices{position:absolute;left:calc(16px + var(--u)*2);right:calc(16px + var(--u)*2);bottom:calc(var(--u)*18 + var(--fs)*1.8*3 + var(--u)*12);display:flex;justify-content:flex-end}
#choices[hidden]{display:none}
.menuwin{min-width:240px;padding:calc(var(--u)*3) 0;display:flex;flex-direction:column}
.mhead{padding:0 calc(var(--u)*5) calc(var(--u)*1);color:var(--sub);letter-spacing:.2em}
.mitem{display:flex;align-items:center;width:100%;padding:calc(var(--u)*3) calc(var(--u)*5);text-align:left;letter-spacing:.08em;color:var(--text)}
.mitem .tri-r{visibility:hidden}
.mitem:hover,.mitem:focus-visible,.mitem.sel{background:var(--ai2);outline:none;color:#ffffff}
.mitem:hover .tri-r,.mitem:focus-visible .tri-r,.mitem.sel .tri-r{visibility:visible}
.mitem:active{background:var(--act)}
#endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*10);padding-inline:16px}
#endcard[hidden]{display:none}
#endcard .fin{font-size:calc(var(--fs)*4);line-height:1;color:#ffffff;text-shadow:var(--u) var(--u) 0 var(--act),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
#endcard .einfo{padding:calc(var(--u)*5) calc(var(--u)*8);text-align:center;display:flex;flex-direction:column;gap:calc(var(--u)*2)}
#endcard .ename{color:var(--gold);letter-spacing:.25em;padding-left:.25em}
#endcard .eyears{color:var(--sub)}
#endcard .eyears b{color:#ffffff;font-weight:400;font-variant-numeric:tabular-nums}

/* ---------- battle ---------- */
#battle{display:flex;flex-direction:column}
#bhead{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:calc(16px + var(--u)*2)}
#money{padding:0 calc(var(--u)*3);white-space:nowrap;line-height:1.5;min-width:0;overflow:hidden}
#money span{color:var(--sub)}
#money b{font-weight:400;color:var(--gold);margin:0 .2em;font-variant-numeric:tabular-nums}
#money.pop b{color:#ffffff}
#bigcount{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);pointer-events:none;visibility:hidden;text-shadow:var(--u) var(--u) 0 var(--ink)}
#bigcount.on{visibility:visible}
#bigcount small{font-size:var(--fs);color:var(--sub)}
#bigcount b{font-weight:400;font-size:calc(var(--fs)*2);line-height:1;color:var(--gold);text-shadow:var(--u) var(--u) 0 var(--act),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink);white-space:nowrap}
#bigcount .bcrow{display:flex;align-items:baseline;gap:calc(var(--u)*2)}
#bigcount span{color:var(--gold)}
.hr{display:flex;align-items:center;gap:calc(var(--u)*6);flex:none}
#yrBox{padding:0 calc(var(--u)*3);white-space:nowrap;line-height:1.5}
#yrBox span{color:var(--sub)}

const PRGB=new Uint8Array(PAL.length*3);PAL.forEach((h,i)=>{const n=parseInt(h.slice(1),16);PRGB[i*3]=n>>16&255;PRGB[i*3+1]=n>>8&255;PRGB[i*3+2]=n&255});
const LUT=new Uint8Array(32768);
for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){const R=r*8+4,G=g*8+4,B=b*8+4;let best=0,bd=1e9;
  for(let i=0;i<PAL.length;i++){const dr=R-PRGB[i*3],dg=G-PRGB[i*3+1],db=B-PRGB[i*3+2];const d=2*dr*dr+4*dg*dg+3*db*db;if(d<bd){bd=d;best=i}}LUT[r<<10|g<<5|b]=best}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const BOFF=BAY.map(v=>((v+.5)/16-.5)*26);
const BTH=BAY.map(v=>(v+.5)/16);
function quant(ctx,w,h){if(!w||!h)return;const id=ctx.getImageData(0,0,w,h),d=id.data;
  for(let y=0;y<h;y++){const row=(y&3)*4;for(let x=0;x<w;x++){const i=(y*w+x)*4,o=BOFF[row+(x&3)];
    let r=d[i],g=d[i+1],b=d[i+2];const l=r*.3+g*.59+b*.11;r=(l+(r-l)*1.35-128)*1.06+134+o;g=(l+(g-l)*1.35-128)*1.06+134+o;b=(l+(b-l)*1.35-128)*1.06+134+o;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;
    const p=LUT[(r>>3)<<10|(g>>3)<<5|(b>>3)]*3;d[i]=PRGB[p];d[i+1]=PRGB[p+1];d[i+2]=PRGB[p+2];d[i+3]=255}}
  ctx.putImageData(id,0,0)}
function quantA(ctx,w,h){if(!w||!h)return;const id=ctx.getImageData(0,0,w,h),d=id.data;
  for(let y=0;y<h;y++){const row=(y&3)*4;for(let x=0;x<w;x++){const i=(y*w+x)*4,a=d[i+3];if(!a)continue;
    if(a/255<BTH[row+(x&3)]*.92+.04){d[i+3]=0;continue}
    const p=LUT[(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3)]*3;d[i]=PRGB[p];d[i+1]=PRGB[p+1];d[i+2]=PRGB[p+2];d[i+3]=255}}
  ctx.putImageData(id,0,0)}

const BGM={cur:null,want:null,step:0,next:0,timer:null,fast:false,fever:false,
  boot(){if(this.want){const w=this.want;this.want=null;this.play(w)}},
  play(name){if(!AU.ctx){this.want=name;return}if(this.cur===name)return;this.cur=name;this.step=0;this.next=AU.ctx.currentTime+.15;if(!this.timer)this.timer=setInterval(()=>this.tick(),25)},
  tick(){const c=AU.ctx,tr=TRACKS[this.cur];if(!c||!tr)return;const sp=60/(tr.bpm*(this.fast?1.12:1))/tr.div;
    if(this.next<c.currentTime-.2)this.next=c.currentTime+.05;
    while(this.next<c.currentTime+.12){this.stepAt(tr,this.step,this.next,sp);this.next+=sp;this.step++}},
  stepAt(tr,i,t,sp){const c=AU.ctx;
    for(const v of tr.v){if(v.layer==='fever'&&!this.fever)continue;const f=v.n[i%v.n.length];if(!f)continue;
      const o=c.createOscillator(),g=c.createGain();o.type=v.w;o.frequency.setValueAtTime(f,t);const dur=sp*v.d;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v.vol,t+.006);g.gain.setValueAtTime(v.vol,t+dur*.5);g.gain.exponentialRampToValueAtTime(.0006,t+dur);
      o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.05)}
    if(tr.dr){const j=i%16,dv=tr.dv||1;
      if(tr.dr.k[j]==='x'){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.32*dv,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+.2)}
      if(tr.dr.s[j]==='x')AU.nz(.1,1800,.16*dv,0,null,AU.mus,t);
      if(tr.dr.h[j]==='x')AU.nz(.03,7000,(this.fever?.1:.06)*dv,0,null,AU.mus,t)}}
};

function shapeIn(t,x,y){const dx=x-7.5,dy=y-7.5;switch(t){
  case 0:return dx*dx+dy*dy<6.4*6.4;
  case 1:{const r=Math.hypot(dx,dy),a=Math.atan2(dy,dx)+Math.PI/2;return r<6.9*(.76+.24*Math.cos(a*5))}
  case 2:{const v=(y-.6)/14.8;if(v<0||v>1)return false;const tx=dx+dy*.3;return Math.abs(tx)<4.9*Math.pow(Math.sin(Math.PI*v),.75)}
  case 3:{if(Math.hypot(dx,y-9.6)<5.5)return true;if(y>=1&&y<9.6)return Math.abs(dx)<(y-1)/8.6*5.3;return false}
  case 4:return Math.abs(dx)/6.6+Math.abs(dy)/7.4<1;
  case 5:{const oy=y-14.2,r=Math.hypot(dx,oy),a=Math.atan2(dx,-oy);if(y>15)return false;if(r<2.8&&y>=12)return true;return r<11.6-.7*Math.abs(Math.sin(a*7))&&Math.abs(a)<.72&&y>=1}
  case 9:{const r=Math.hypot(dx,dy*1.1),a=Math.atan2(dy,dx);return r<5.4+1.3*Math.sin(a*4+1)+.8*Math.sin(a*7)||(Math.abs(dx+2)<1&&dy>3&&dy<7)||(Math.abs(dx-3)<.8&&dy>2&&dy<6.5)}
}return false}
function makeSprite(t){
  const c=document.createElement('canvas');c.width=c.height=TS;const g=c.getContext('2d');const id=g.createImageData(TS,TS),d=id.data;
  const inside=[];for(let y=0;y<TS;y++)for(let x=0;x<TS;x++)inside[y*TS+x]=shapeIn(t,x+.5,y+.5);
  const I=(x,y)=>x>=0&&y>=0&&x<TS&&y<TS&&inside[y*TS+x];
  const R=t===9?['#3a3550','#1d2650','#141a36','#0b0d1f']:RAMPS[t];
  const put=(x,y,hex)=>{const n=parseInt(hex.slice(1),16),i=(y*TS+x)*4;d[i]=n>>16&255;d[i+1]=n>>8&255;d[i+2]=n&255;d[i+3]=255};
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    if(I(x,y)){
      const dx=x+.5-7.5,dy=y+.5-7.5;const L=-(dx*.55+dy*.8)/7;

const tbox=$('#tbox'),whoEl=$('#who'),txtEl=$('#txt'),nextEl=$('#next'),cardEl=$('#card');
let bgStart=0;
function setBg(b){if(b===sceneBg)return;prevBg=sceneBg;sceneBg=b;bgFade=0;bgStart=(performance.now()-T0)/1000;BGM.play(musicFor(b))}
function waitTap(){return new Promise(r=>advance=r)}
$('#scene').addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;AU.init();

  if(advance){const a=advance;advance=null;AU.page();a()}

async function showCard(L){
  tbox.classList.add('off');$('#cardNum').textContent=L.card;$('#cardTtl').textContent=L.title;
  cardEl.classList.add('on');await Promise.race([wait(2800),waitTap()]);advance=null;cardEl.classList.remove('on');await wait(800);

function typeLine(text){return new Promise(res=>{
  let i=0,done=false;txtEl.textContent='';nextEl.classList.remove('on');
  const fin=()=>{if(done)return;done=true;clearInterval(iv);typing=null;txtEl.textContent=text;nextEl.classList.add('on');res()};
  typing=fin;const iv=setInterval(()=>{i++;txtEl.textContent=text.slice(0,i);if(i%2)AU.blip();if(i>=text.length)fin()},RM?5:45);
})}
function say(L){tbox.classList.remove('off');whoEl.hidden=!L.who;whoEl.textContent=L.who||'';txtEl.classList.toggle('narr',!L.who);return typeLine(L.t)}
async function playScene(lines,opts={}){
  show('scene');skipFlag=false;$('#skip').hidden=!!opts.noSkip;
  if(lines[0]&&lines[0].bg)BGM.play(musicFor(lines[0].bg));
  for(const L of lines){
    if(skipFlag)break;
    if(L.bg)setBg(L.bg);
    if(L.card){await showCard(L);continue}
    await say(L);if(skipFlag)break;
    await waitTap();
  }
  advance=null;typing=null;tbox.classList.add('off');
}

  const gr=g.createRadialGradient(lx,ly,0,lx,ly,u*16);gr.addColorStop(0,'rgba(246,227,161,.7)');gr.addColorStop(1,'rgba(246,227,161,0)');g.fillStyle=gr;g.beginPath();g.arc(lx,ly,u*16,0,TAU);g.fill();
  g.fillStyle=tc('#1e3b44');g.beginPath();g.ellipse(0,0,u*24,u*19,0,0,TAU);g.fill();
  g.beginPath();g.moveTo(u*20,-u*4);g.lineTo(u*34,-u*14+Math.sin(t*3)*u*2);g.lineTo(u*34,u*10+Math.sin(t*3)*u*2);g.closePath();g.fill();
  g.fillStyle=tc('#2e5a5e');g.beginPath();g.ellipse(u*2,-u*8,u*16,u*7,0,0,TAU);g.fill();
  g.fillStyle='#0e0c16';g.beginPath();g.moveTo(-u*24,-u*2);g.quadraticCurveTo(-u*4,u*4,u*8,u*6);g.quadraticCurveTo(-u*6,u*16,-u*26,u*9);g.closePath();g.fill();
  g.fillStyle='#efe6cf';for(let i=0;i<7;i++){g.fillRect(Math.round(-u*(22-i*3.6)),Math.round(-u*1+i*u*.9),1,Math.max(2,Math.round(u*2.4)));g.fillRect(Math.round(-u*(23-i*3.6)),Math.round(u*8-i*u*.2),1,Math.max(1,Math.round(u*1.6)))}
  g.fillStyle='#c9e3ee';g.fillRect(Math.round(-u*11),Math.round(-u*9),2,2);
  g.strokeStyle=tc('#2e5a5e');g.lineWidth=1;g.beginPath();g.moveTo(-u*6,-u*17);g.quadraticCurveTo(-u*12,-u*34,lx,ly);g.stroke();
  g.fillStyle='#f6e3a1';g.fillRect(Math.round(lx)-1,Math.round(ly)-1,3,3);g.fillStyle='#fbf7ee';g.fillRect(Math.round(lx),Math.round(ly),1,1);
}

/* ================= main loop ================= */
let last=performance.now(),T0=last;
function loop(now){
  let dt=Math.min(50,now-last);last=now;const t=(now-T0)/1000;
  if(freeze>0){freeze-=dt;dt=0}
  const k=dt/16.67;
  if(screen==='title'){drawTitle(ti,tiCv.width,tiCv.height,t);quant(ti,tiCv.width,tiCv.height)}
  if(screen==='map'){drawMap(mp,mpCv.width,mpCv.height,t);quant(mp,mpCv.width,mpCv.height)}
  if(!modal.hidden){const pc=$('#prevCv');if(pc)drawPreview(pc,t)}
  if(screen==='scene'){const w=scCv.width,h=scCv.height;
    if(bgFade<1){bgFade=Math.min(1,bgFade+dt/1100);const b=Math.floor(bgFade*6)/6;drawBg(sc,w,h,prevBg,t);sc.globalAlpha=b;drawBg(sc,w,h,sceneBg,t);sc.globalAlpha=1}else drawBg(sc,w,h,sceneBg,t);
    const target=(cardEl.classList.contains('on')||!$('#choices').hidden||!$('#endcard').hidden)?.66:0;dim+=(target-dim)*Math.min(1,dt/180);
    if(dim>.01){sc.fillStyle=`rgba(14,12,22,${dim})`;sc.fillRect(0,0,w,h)}
    quant(sc,w,h)}
  if(screen==='battle'&&grid.length){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const tl=grid[r][c];if(!tl)continue;
      const dx=tl.c-tl.x;if(Math.abs(dx)>.003)tl.x+=dx*Math.min(1,.3*k);else tl.x=tl.c;
      if(tl.fall){tl.vy+=.02*k;tl.y+=tl.vy*k;if(tl.y>=tl.r){tl.y=tl.r;tl.vy=0;tl.fall=false;tl.sq=.16}}
      else{const dy=tl.r-tl.y;if(Math.abs(dy)>.003)tl.y+=dy*Math.min(1,.3*k);else tl.y=tl.r}
      if(tl.sq>0)tl.sq=Math.max(0,tl.sq-.025*k);if(tl.dying)tl.dieT=Math.min(1,tl.dieT+.085*k);if(tl.born<1)tl.born=Math.min(1,tl.born+.07*k)}
    if(settleWaiters.length&&settled()){const ws=settleWaiters;settleWaiters=[];ws.forEach(f=>f())}
    if(!busy&&inBattle&&!hintMove&&now-lastAct>6000)hintMove=findMove();
    if(timerOn&&inBattle&&!busy&&modal.hidden){turnT-=dt;const s=Math.ceil(turnT/1000);if(s<=3&&s!==lastTick&&s>0){lastTick=s;AU.tick()}if(turnT<=0)turnOut()}
    snapW($('#turnFill'),turnT/turnMax);$('#turnBar').classList.toggle('low',turnT<3000);
    if(inBattle&&P.hp/P.max<.3&&P.hp>0){hbT-=dt;if(hbT<=0){hbT=950;AU.heart();hurtT=Math.max(hurtT,.3)}BGM.fast=true}else if(inBattle&&!(E&&E.phase2))BGM.fast=false;
    drawStage(t,k);drawBoard(t);
    boxOpenT=Math.max(0,boxOpenT-dt/1000);drawChest(bx,boxOpenT>0,gauge>=100&&Math.floor(t*3)%2===0);
    const bt=$('#battle');if(shakeT>0&&!RM){shakeT=Math.max(0,shakeT-(dt||16)/1000);const m=Math.ceil(shakeT*6);bt.style.transform=`translate(${Math.round(rand(-m,m))*PX}px,${Math.round(rand(-m,m))*PX}px)`}else if(bt.style.transform)bt.style.transform='';
  }
  updFx(k,dt);
  requestAnimationFrame(loop);
}

/* ================= flow ================= */
const mpCv=$('#mapCv'),mp=ctxOf(mpCv);
let mapView=1,mapResolve=null;
function nodePos(k,n){const top=120,bot=H-90,ah=bot-top;return{x:W*(.5+.27*Math.sin(k*2.1+mapView*1.3+.4)),y:top+ah*(.9-k/(n-1)*.8)}}
function curStageOf(ch){const ids=stagesOf(ch);if(ch<save.chapter)return -1;return ids.find(i=>!(i in save.cleared))??-1}
function renderMap(){
  fitLow(mpCv,mp,W,H);
  const ch=CHAPTERS[mapView-1],ids=stagesOf(mapView),cur=curStageOf(mapView);
  $('#mnum').textContent=ch.n;$('#mname').textContent=ch.name;
  $('#chPrev').disabled=mapView<=1;$('#chNext').disabled=mapView>=Math.min(save.chapter,CHAPTERS.length);
  $('#mMoney').textContent=fmt(moneyAt(save.years));$('#mYears').textContent=save.years;
  const box=$('#nodes');box.innerHTML='';
  ids.forEach((i,k)=>{const st=STAGES[i],p=nodePos(k,ids.length);
    const state=(i in save.cleared)?'cleared':i===cur?'current':'locked';
    const el=document.createElement('div');el.className=`node ${state}${st.boss?' boss':''}`;el.style.left=p.x+'px';el.style.top=p.y+'px';
    const stars=save.cleared[i]||0;
    el.innerHTML=`<button class="pbtn" aria-label="${st.no} ${st.name}">${st.last?'乙姫':st.boss?(st.ch===4?st.no:'ぬし'):st.no}</button><div class="nname">${st.name}</div>${state==='cleared'?`<div class="nstars">${[0,1,2].map(j=>`<i class="${j<stars?'on':''}"></i>`).join('')}</div>`:''}`;
    el.querySelector('button').onclick=()=>{AU.init();if(state==='locked'){AU.bad();$('#mhint').innerHTML='前のステージを先にクリアしてください。';return}AU.tap();openPre(i)};
    box.appendChild(el)});
  const all=ids.every(i=>i in save.cleared);
  $('#mhint').innerHTML=cur>=0?`つぎ　<b>${STAGES[cur].no} ${STAGES[cur].name}</b>　をタップ`:all?'この章はクリア済み。何度でも戦えます。':'';
}
async function openPre(i){
  const st=STAGES[i],best=save.cleared[i]||0;
  const gim=GIM[st.g]+(st.dark&&st.g!=='dark'?'。灯りの外が見えない':'');
  const html=`<div class="pk">${st.no}${st.boss?'<em>ぬし</em>':''}</div><h2>${st.name}</h2><canvas id="prevCv" class="prev"></canvas>
   <dl class="pinfo"><div><dt>弱点</dt><dd><canvas id="prevWeak" width="16" height="16"></canvas>${TNAME[st.weak]}</dd></div>
   <div><dt>特性</dt><dd>${gim}</dd></div><div><dt>潮時</dt><dd>一手 ${st.turn}秒</dd></div>
   <div><dt>地上の時</dt><dd>一手ごとに +${st.yr}年</dd></div>
   <div><dt>評価</dt><dd>${best?'星 '+best+' / 3':'まだ挑んでいない'}</dd></div></dl>`;
  const pr=ask(html,[{id:'go',label:'たたかう',primary:true},{id:'back',label:'もどる'}]);
  modal.querySelector('.mcard').classList.add('pre');
  const pc=$('#prevCv');pc.width=80;pc.height=44;pc.style.width=80*PX+'px';pc.style.height=44*PX+'px';pc._st=st;
  const pw=$('#prevWeak');pw.style.width=pw.style.height=8*PX+'px';pw.getContext('2d').drawImage(sprites[st.weak],0,0);
  const r=await pr;if(r==='go'&&mapResolve){const f=mapResolve;mapResolve=null;f(i)}
}
function drawPreview(cv,t){const g=cv.getContext('2d',{willReadFrequently:true}),st=cv._st,w=cv.width,h=cv.height;
  const tones=st.tone||TONES[st.kind];
  vgrad(g,w,h,[[0,tones[0]],[1,tones[1]]]);drawMotes(g,w,h,t,'#7fb3a6',.6);tintA=0;
  const u=Math.min(w*.95,h*1.5)/100*(st.kind==='hime'?.82:.92);enemyLayer(g,w,h,st,u,Math.round(w/2),Math.round(h*(st.kind==='hime'?.6:.56)+Math.sin(t*1.4)*u),1,1,t);quant(g,w,h)}
Object.assign(DRAW,{octo:drawOcto,shark:drawShark,whale:drawWhale,jelly:drawJelly,crab:drawCrab,moray:drawMoray,angler:drawAngler,hime:drawHime});
function drawMap(g,w,h,t){
  const th=CHAPTERS[mapView-1].theme;
  if(th==='shoal'){vgrad(g,w,h,[[0,'#2e8a8a'],[.45,'#1e5a62'],[1,'#0f2a36']]);rays(g,w,h,t,5,.08);
    for(let i=0;i<9;i++){const R=seeded(i*7+3);const x=R()*w,y=h*(.25+R()*.7),r=4+R()*10;g.fillStyle='#d8b48a';g.beginPath();g.ellipse(x,y,r*1.8,r,0,0,TAU);g.fill()}
    for(let i=0;i<7;i++){const R=seeded(i*13+1);const x=R()*w,y=h*(.3+R()*.65);g.fillStyle=i%2?'#e8434a':'#ff8ab4';for(let k=0;k<4;k++)g.fillRect(Math.round(x+k*2-3),Math.round(y-k%2*3),2,5+k%3*2)}
    for(let i=0;i<6;i++)wave(g,w,h*(.06+i*.11),1,.08,t*.8+i,'#4fd6c8');drawMotes(g,w,h,t,'#ffffff',1.5)}
  else if(th==='court'){vgrad(g,w,h,[[0,'#3a1418'],[.4,'#7a2a3a'],[1,'#4a1530']]);
    const gr=g.createRadialGradient(w/2,h*.15,0,w/2,h*.15,h*.5);gr.addColorStop(0,'rgba(255,200,60,.4)');gr.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
    g.fillStyle='rgba(11,13,31,.25)';for(let y=0;y<h;y+=8)for(let x=(y/8%2)*6;x<w;x+=12)g.fillRect(x,y,11,7);
    for(let i=0;i<6;i++){const x=w*(.1+i*.16),y=h*(.2+(i%3)*.27);g.fillStyle='#0b0d1f';g.fillRect(Math.round(x),Math.round(y),2,10);const a=Math.sin(t*3+i)>-.4;g.fillStyle=a?'#ffc83c':'#d89a2a';g.fillRect(Math.round(x)-1,Math.round(y)-3,4,4)}
    drawMotes(g,w,h,t,'#ffe89a',.8)}
  else if(th==='vault'){drawVault(g,w,h,t)}
  else{vgrad(g,w,h,[[0,'#141a36'],[.6,'#0b0d1f'],[1,'#0b0d1f']]);
    const ex=w*.5,ey=h*.12,o=Math.sin(t*.4)*.5+.5;g.fillStyle=o>.3?'#d89a2a':'#8a5a1a';g.fillRect(Math.round(ex-4),Math.round(ey-1),8,3);g.fillRect(Math.round(ex-2),Math.round(ey-2),4,5);g.fillStyle='#0b0d1f';g.fillRect(Math.round(ex),Math.round(ey-2),1,5);
    drawMotes(g,w,h,t,'#4fd6c8',.4)}
  const ids=stagesOf(mapView),pts=ids.map((i,k)=>{const p=nodePos(k,ids.length);return[p.x/PX,p.y/PX]});
  for(let k=1;k<pts.length;k++){const[a,b]=pts[k-1],[c,d]=pts[k],n=Math.ceil(Math.hypot(c-a,d-b)/4),done=ids[k-1] in save.cleared;
    for(let j=1;j<n;j++){const x=a+(c-a)*j/n,y=b+(d-b)*j/n;g.fillStyle='#0b0d1f';g.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);g.fillStyle=done?'#ffc83c':'#a8a4c0';g.fillRect(Math.round(x),Math.round(y),1,1)}}
  const cur=curStageOf(mapView);const ck=ids.indexOf(cur);
  if(ck>=0){const[x,y]=pts[ck];turtle(g,x-13,y+3+Math.sin(t*2)*1.5,7,t,'#0b0d1f')}
}
function mapScreen(){return new Promise(res=>{mapResolve=res;mapView=Math.min(save.chapter,CHAPTERS.length);show('map');BGM.play(mapView===2||mapView===4?'palace':'title');renderMap();
  if(save.justEntered){save.justEntered=false;persist();const ch=CHAPTERS[mapView-1];$('#mbSub').textContent=ch.n+'　'+ch.sub;$('#mbName').textContent=ch.name;const b=$('#mbanner');b.classList.add('on');AU.fever();setTimeout(()=>b.classList.remove('on'),2200)}})}
$('#chPrev').addEventListener('click',()=>{if(mapView>1){mapView--;AU.tap();renderMap()}});
$('#chNext').addEventListener('click',()=>{if(mapView<Math.min(save.chapter,CHAPTERS.length)){mapView++;AU.tap();renderMap()}});
$('#mapMenu').addEventListener('click',async()=>{if(!modal.hidden)return;AU.tap();const r=await ask('<h2>メニュー</h2>',[{id:'back',label:'もどる',primary:true},{id:'snd',label:AU.on?'音を消す':'音を出す'},{id:'title',label:'タイトルへ'}]);if(r==='snd')toggleSnd();if(r==='title')toTitle()});

let runId=0;
async function run(){
  const id=++runId;
  if(!save.started){save.started=true;save.chapter=1;save.justEntered=true;persist();await playScene(SCRIPTS.opening);if(id!==runId)return}
  while(id===runId){
    if(save.chapter>CHAPTERS.length){await ending(id);return}
    const pick=await mapScreen();if(id!==runId)return;
    const st=STAGES[pick];
    if(st.pre&&!save.seen.includes(st.pre)){await playScene(SCRIPTS[st.pre]);if(id!==runId)return;save.seen.push(st.pre);persist()}
    let won=false;
    while(true){const res=await battle(pick);if(id!==runId)return;
      if(res.win){won=true;save.cleared[pick]=Math.max(save.cleared[pick]||0,res.stars);persist()}
      if(res.action!=='retry')break}
    if(won&&st.boss&&save.chapter===st.ch){await playScene(SCRIPTS[CHAPTERS[st.ch-1].clear]);if(id!==runId)return;save.chapter++;save.justEntered=true;persist()}
  }
}
let countIv=0;
function runCounter(from){const el=$('#bigcount'),n=$('#bigN');el.classList.add('on');const lf=Math.log10(Math.max(from,1)),t0=performance.now();let lastU=-1;
  clearInterval(countIv);countIv=setInterval(()=>{const f=Math.min(1,(performance.now()-t0)/16000);const v=Math.pow(10,lf+(68.5-lf)*Math.pow(f,1.6));n.textContent=f>=1?'無量大数':fmt(v);
    const u=Math.floor(Math.log10(v)/4);if(u!==lastU){lastU=u;AU.tick()}if(f>=1)clearInterval(countIv)},70)}
async function ending(id){
  const y=save.years,{L:lines,bg,tier}=endingLines(y);save.lastTier=tier;
  await playScene(lines);if(id!==runId)return;
  $('#skip').hidden=true;
  await say({who:'太郎',t:'玉手箱を、どうする。'});
  const ch=$('#choices');ch.hidden=false;nextEl.classList.remove('on');$('#chOpen').focus({preventScroll:true});
  const pick=await new Promise(res=>{$('#chOpen').onclick=()=>{AU.tap();res('open')};$('#chKeep').onclick=()=>{AU.tap();res('keep')}});
  ch.hidden=true;tbox.classList.add('off');
  let finalMoney=fmt(moneyAt(y));
  if(pick==='open'){AU.box();runCounter(moneyAt(y));await playScene(END_OPEN,{noSkip:true});clearInterval(countIv);$('#bigN').textContent='無量大数';finalMoney='無量大数'}
  else{setBg(bg);await playScene(END_KEEP,{noSkip:true})}
  if(id!==runId)return;
  $('#bigcount').classList.remove('on');
  const name=pick==='open'?'無量大数':'竜宮サブスク';if(!save.ends.includes(name))save.ends.push(name);
  $('#skip').hidden=true;$('#eName').textContent='「'+name+'」';$('#eYearsRow').innerHTML=pick==='open'?'地上で過ぎた時 <b>はかれない</b>':`地上で過ぎた時 <b>${y}</b> 年`;$('#eMoney').textContent=finalMoney;$('#endcard').hidden=false;AU.win();
  Object.assign(save,{started:false,chapter:1,cleared:{},seen:[],years:0,gauge:0});save.ends=save.ends.filter(e=>e==='無量大数'||e==='竜宮サブスク');persist();
}
['chOpen','chKeep'].forEach(id=>{const el=$('#'+id);el.addEventListener('pointerenter',()=>{document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('sel',m===el))});el.addEventListener('focus',()=>{document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('sel',m===el))})});
function toTitle(){runId++;mapResolve=null;$('#result').hidden=true;clearInterval(countIv);$('#bigcount').classList.remove('on');inBattle=false;ended=true;timerOn=false;battleResolve=null;advance=null;typing=null;modal.hidden=true;$('#endcard').hidden=true;$('#choices').hidden=true;BGM.fast=false;BGM.fever=false;refreshTitle();show('title')}
function refreshTitle(){$('#contBtn').hidden=!save.started;$('#endCount').textContent=save.ends.length?`見た結末 ${save.ends.length}/2`:'';$('#sndBtn').textContent=AU.on?'音 あり':'音 なし'}
function toggleSnd(){AU.setOn(!AU.on);save.snd=AU.on;persist();refreshTitle()}
$('#sndBtn').addEventListener('click',()=>{AU.init();toggleSnd()});
$('#newBtn').addEventListener('click',async()=>{AU.init();AU.tap();
  if(save.started){const r=await ask('<h2>はじめから</h2><p>いまの進み具合と預金は消えます。</p>',[{id:'y',label:'はじめから遊ぶ',primary:true},{id:'n',label:'やめておく'}]);if(r!=='y')return}
  Object.assign(save,{started:false,chapter:1,cleared:{},seen:[],years:0,gauge:0});persist();run()});
$('#contBtn').addEventListener('click',()=>{AU.init();AU.tap();run()});
$('#toTitle').addEventListener('click',()=>{AU.tap();toTitle()});
document.addEventListener('pointerdown',()=>AU.init(),{once:true});

layout();refreshTitle();BGM.play('title');requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load(`16px ${FONT}`).catch(()=>{});
})();
