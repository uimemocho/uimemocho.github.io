/* Layout: one phone-width cartridge. Board scale is chosen first (integer device pixels per art pixel), and that same step --u drives every canvas and window, so art and UI share one pixel grid. Coral fill = something you can press. Gold / mint text with no fill = information. */
:root{
  --u:3px; --fs:20px;
  --ink:#0b0d1f; --night:#141a36; --ai:#1d2650; --ai2:#283670;
  --line:#dcdaf0; --line2:#8f8ab0; --text:#f4f2ff; --sub:#a8a4c0;
  --act:#e8434a; --act-hi:#ff6a5c; --act-lip:#a8233f;
  --gold:#ffc83c; --mint:#4fd6c8; --pink:#ff8ab4; --sky:#78b4ff;
  --f:"PixelMplus12","DotGothic16","Hiragino Sans",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f);font-size:var(--fs);line-height:1.6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--ink)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.lo{position:absolute;left:0;top:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:var(--u) solid var(--gold);outline-offset:calc(var(--u)*4)}
.screen{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .5s steps(5),visibility 0s linear .5s;pointer-events:none}
.screen.on{visibility:visible;opacity:1;transition:opacity .5s steps(5);pointer-events:auto}

/* ---------- flat info window ---------- */
.win{position:relative;background:var(--night);
  box-shadow:
   0 calc(var(--u)*-1) 0 0 var(--line),0 var(--u) 0 0 var(--line),calc(var(--u)*-1) 0 0 0 var(--line),var(--u) 0 0 0 var(--line),
   0 calc(var(--u)*-2) 0 0 var(--ink),0 calc(var(--u)*2) 0 0 var(--ink),calc(var(--u)*-2) 0 0 0 var(--ink),calc(var(--u)*2) 0 0 0 var(--ink),
   calc(var(--u)*-1) calc(var(--u)*-1) 0 0 var(--ink),var(--u) calc(var(--u)*-1) 0 0 var(--ink),calc(var(--u)*-1) var(--u) 0 0 var(--ink),var(--u) var(--u) 0 0 var(--ink),
   inset 0 var(--u) 0 0 var(--ai2)}
/* speaker name: a tab of the window itself, mint text, never filled */
.nametag{position:absolute;left:calc(var(--u)*3);top:0;transform:translateY(calc(-100% - var(--u)));padding:0 calc(var(--u)*4);background:var(--night);color:var(--mint);letter-spacing:.2em;line-height:1.5;
  box-shadow:0 calc(var(--u)*-1) 0 0 var(--line),calc(var(--u)*-1) 0 0 0 var(--line),var(--u) 0 0 0 var(--line),0 calc(var(--u)*-2) 0 0 var(--ink),calc(var(--u)*-2) 0 0 0 var(--ink),calc(var(--u)*2) 0 0 0 var(--ink)}
.nametag[hidden]{display:none}

/* ---------- pressable button: thick bevel lip ---------- */
.pbtn{--face:var(--night);--lip:var(--line2);--edge:var(--line);position:relative;display:block;min-width:210px;padding:calc(var(--u)*3) calc(var(--u)*6);text-align:center;letter-spacing:.12em;color:var(--text);background:var(--face);

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const f=s=>Math.round(((a>>s)&255)*(1-t)+((b>>s)&255)*t);return `rgb(${f(16)},${f(8)},${f(0)})`}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KAN=['〇','一','二','三','四','五','六','七','八','九','十'];
const FONT='PixelMplus12';

/* ================= palette & dither ================= */
const PAL=['#0b0d1f','#141a36','#1d2650','#283670','#3a55a8','#4f86e0','#78b4ff','#b8e0ff',

 '#4a3428','#8a6448','#d8b48a','#f2e2c4'];
const PRGB=new Uint8Array(PAL.length*3);PAL.forEach((h,i)=>{const n=parseInt(h.slice(1),16);PRGB[i*3]=n>>16&255;PRGB[i*3+1]=n>>8&255;PRGB[i*3+2]=n&255});

  for(let i=0;i<PAL.length;i++){const dr=R-PRGB[i*3],dg=G-PRGB[i*3+1],db=B-PRGB[i*3+2];const d=2*dr*dr+4*dg*dg+3*db*db;if(d<bd){bd=d;best=i}}LUT[r<<10|g<<5|b]=best}

function quant(ctx,w,h){if(!w||!h)return;const id=ctx.getImageData(0,0,w,h),d=id.data;
  for(let y=0;y<h;y++){const row=(y&3)*4;for(let x=0;x<w;x++){const i=(y*w+x)*4,o=BOFF[row+(x&3)];
    let r=d[i],g=d[i+1],b=d[i+2];const l=r*.3+g*.59+b*.11;r=(l+(r-l)*1.35-128)*1.06+134+o;g=(l+(g-l)*1.35-128)*1.06+134+o;b=(l+(b-l)*1.35-128)*1.06+134+o;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;

  ctx.putImageData(id,0,0)}
function quantA(ctx,w,h){if(!w||!h)return;const id=ctx.getImageData(0,0,w,h),d=id.data;
  for(let y=0;y<h;y++){const row=(y&3)*4;for(let x=0;x<w;x++){const i=(y*w+x)*4,a=d[i+3];if(!a)continue;
    if(a/255<BTH[row+(x&3)]*.92+.04){d[i+3]=0;continue}
    const p=LUT[(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3)]*3;d[i]=PRGB[p];d[i+1]=PRGB[p+1];d[i+2]=PRGB[p+2];d[i+3]=255}}
  ctx.putImageData(id,0,0)}

/* ================= audio: sfx ================= */
const AU={ctx:null,on:save.snd,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=this.ctx=new C();
    this.out=c.createGain();this.out.gain.value=this.on?.6:0;this.out.connect(c.destination);
    this.dry=c.createGain();this.dry.connect(this.out);

    const dl=c.createDelay(1);dl.delayTime.value=.19;const fb=c.createGain();fb.gain.value=.3;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;

    if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(dest||this.dry);s.start(t);s.stop(t+dur+.05)},
  YO:[587.3,659.3,784,880,987.8,1174.7,1318.5,1568,1760,1975.5,2349.3],

const modal=$('#modal');
function ask(html,btns){return new Promise(res=>{
  modal.innerHTML=`<div class="mcard win">${html}<div class="mbtns">${btns.map((b,i)=>`<button class="pbtn ${b.primary?'primary':''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;

let sceneBg='deep',prevBg=null,bgFade=1,skipFlag=false,advance=null,typing=null,dim=0;
const tbox=$('#tbox'),whoEl=$('#who'),txtEl=$('#txt'),nextEl=$('#next'),cardEl=$('#card');
let bgStart=0;
function setBg(b){if(b===sceneBg)return;prevBg=sceneBg;sceneBg=b;bgFade=0;bgStart=(performance.now()-T0)/1000;BGM.play(musicFor(b))}
function waitTap(){return new Promise(r=>advance=r)}
$('#scene').addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;AU.init();
  if(typing){typing();return}
  if(advance){const a=advance;advance=null;AU.page();a()}
});
$('#skip').addEventListener('click',()=>{skipFlag=true;if(typing)typing();if(advance){const a=advance;advance=null;a()}});
async function showCard(L){
  tbox.classList.add('off');$('#cardNum').textContent=L.card;$('#cardTtl').textContent=L.title;
  cardEl.classList.add('on');await Promise.race([wait(2800),waitTap()]);advance=null;cardEl.classList.remove('on');await wait(800);
}
function typeLine(text){return new Promise(res=>{
  let i=0,done=false;txtEl.textContent='';nextEl.classList.remove('on');
  const fin=()=>{if(done)return;done=true;clearInterval(iv);typing=null;txtEl.textContent=text;nextEl.classList.add('on');res()};
  typing=fin;const iv=setInterval(()=>{i++;txtEl.textContent=text.slice(0,i);if(i%2)AU.blip();if(i>=text.length)fin()},RM?5:45);
})}
function say(L){tbox.classList.remove('off');whoEl.hidden=!L.who;whoEl.textContent=L.who||'';txtEl.classList.toggle('narr',!L.who);return typeLine(L.t)}
async function playScene(lines,opts={}){
  show('scene');skipFlag=false;$('#skip').hidden=!!opts.noSkip;
  if(lines[0]&&lines[0].bg)BGM.play(musicFor(lines[0].bg));
  for(const L of lines){
    if(skipFlag)break;
    if(L.bg)setBg(L.bg);
    if(L.card){await showCard(L);continue}
    await say(L);if(skipFlag)break;
    await waitTap();
  }
  advance=null;typing=null;tbox.classList.add('off');
}

const motes=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),s:Math.random()<.25?2:1,v:rand(.004,.018),p:rand(TAU)}));
function drawMotes(g,w,h,t,col,rise=1){
  for(const m of motes){const y=((m.y-t*m.v*rise)%1+1)%1,x=m.x+Math.sin(t*.3+m.p)*.01;if(Math.sin(t*1.5+m.p)<-.3)continue;
    g.fillStyle=col;g.fillRect(Math.round(x*w),Math.round(y*h),m.s,m.s)}}
function rays(g,w,h,t,n,alpha,col='#c9e3ee'){g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const x0=w*(.1+.8*i/(n-1||1))+Math.sin(t*.2+i)*w*.04,sk=w*.18;const a=alpha*(.6+.4*Math.sin(t*.5+i*1.7));
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,hexA(col,a));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;
    g.beginPath();g.moveTo(x0-w*.03,0);g.lineTo(x0+w*.03,0);g.lineTo(x0+sk+w*.1,h);g.lineTo(x0+sk-w*.1,h);g.closePath();g.fill()}g.restore()}
function vgrad(g,w,h,stops,y0=0,y1=h){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>gr.addColorStop(o,c));g.fillStyle=gr;g.fillRect(0,Math.floor(y0),w,Math.ceil(y1-y0))}
function wave(g,w,y,amp,fr,ph,col){g.fillStyle=col;for(let x=0;x<w;x++)g.fillRect(x,Math.round(y+Math.sin(x*fr+ph)*amp),1,1)}
function turtle(g,x,y,s,t,col){g.save();g.translate(Math.round(x),Math.round(y));g.fillStyle=col;const fl=Math.sin(t*2.2)*.5;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{g.save();g.translate(sx*s*.55,sy*s*.35);g.rotate(sx*(sy<0?.7:.3)+fl*sx*(sy<0?1:.5));g.beginPath();g.ellipse(sx*s*.25,0,s*(sy<0?.42:.25),s*.12,0,0,TAU);g.fill();g.restore()});
  g.beginPath();g.ellipse(s*.92,0,s*.2,s*.16,0,0,TAU);g.fill();g.beginPath();g.ellipse(0,0,s*.75,s*.5,0,0,TAU);g.fill();
  g.fillStyle='#2e5a5e';for(let i=-1;i<=1;i++)g.fillRect(Math.round(i*s*.3)-1,Math.round(-s*.25),2,1);g.restore()}
function roof(g,cx,y,wd,ht){g.beginPath();g.moveTo(cx-wd*.62,y-ht*.05);g.quadraticCurveTo(cx-wd*.45,y+ht*.12,cx-wd*.3,y-ht*.2);g.lineTo(cx,y-ht);g.lineTo(cx+wd*.3,y-ht*.2);g.quadraticCurveTo(cx+wd*.45,y+ht*.12,cx+wd*.62,y-ht*.05);g.closePath();g.fill()}
function palace(g,w,h,t,near){
  const cx=Math.round(w/2),base=Math.round(h*(near?.74:.7)),u=Math.min(w,h*.8)/100*(near?1.25:1);
  g.fillStyle='#3a1418';g.fillRect(Math.round(cx-u*44),base,Math.round(u*88),Math.max(2,Math.round(u*4)));
  let y=base;
  [[36,13],[28,11],[21,10],[14,9]].forEach(([wd,ht],i)=>{
    g.fillStyle='#3a1418';g.fillRect(Math.round(cx-u*wd*.42),Math.round(y-ht*u*.8),Math.round(u*wd*.84),Math.round(ht*u*.8));
    g.fillStyle='#8e2b24';g.fillRect(Math.round(cx-u*wd*.42),Math.round(y-ht*u*.8),Math.round(u*wd*.84),1);
    for(let k=-2;k<=2;k++){if(Math.sin(t*2+k*1.3+i)<-.6)continue;g.fillStyle=Math.sin(t*3+k+i)>0?'#e3b85a':'#b8862f';g.fillRect(Math.round(cx+k*u*wd*.16)-1,Math.round(y-ht*u*.55),2,Math.max(2,Math.round(u*2.6)))}
    y-=ht*u*.8;g.fillStyle='#0e0c16';roof(g,cx,y+u*1.5,u*wd*1.15,u*7);
    g.fillStyle='#c2452f';for(let x=-u*wd*.55;x<=u*wd*.55;x++)g.fillRect(Math.round(cx+x),Math.round(y+u*1.2-u*3*(1-(x/(u*wd*.6))**2)*.6),1,1);
    y-=u*4});
  g.fillStyle='#0e0c16';g.fillRect(cx-1,Math.round(y-u*10),2,Math.round(u*10));
  for(let i=0;i<9;i++){const lx=cx+(i-4)*u*10,ly=base-u*2+Math.sin(t+i)*u;const gr=g.createRadialGradient(lx,ly,0,lx,ly,u*6);gr.addColorStop(0,'rgba(246,227,161,.85)');gr.addColorStop(1,'rgba(246,227,161,0)');g.fillStyle=gr;g.beginPath();g.arc(lx,ly,u*6,0,TAU);g.fill()}
}
const village=[0,1,2].map(tier=>{const R=seeded(17+tier*31);const items=[];
  if(tier===0)for(let i=0;i<9;i++)items.push({k:R()<.4?'pine':'hut',x:R(),s:.6+R()*.6});
  if(tier===1){for(let i=0;i<16;i++)items.push({k:'house',x:i/15+R()*.03,s:.7+R()*.5});for(let i=0;i<5;i++)items.push({k:'pole',x:.08+i*.21,s:1})}
  if(tier===2)for(let i=0;i<14;i++)items.push({k:'tower',x:i/13,s:.3+R()*.9,win:Array.from({length:60},()=>R()<.45)});

function drawVillage(g,w,h,t,tier){
  vgrad(g,w,h,tier===2?[[0,'#5b6f80'],[.6,'#c9c0d6'],[1,'#efe6cf']]:[[0,'#8fa3b0'],[.6,'#c9d9cc'],[1,'#efe6cf']],0,h*.6);
  const sx=w*.3,sy=h*.18;const gr=g.createRadialGradient(sx,sy,0,sx,sy,w*.32);gr.addColorStop(0,'rgba(251,247,238,.9)');gr.addColorStop(1,'rgba(251,247,238,0)');g.fillStyle=gr;g.fillRect(0,0,w,h*.6);
  const base=Math.round(h*.6),u=w/100;const sil=tier===2?'#2b3f66':'#3e3026';g.fillStyle=sil;

const key=(r,c)=>r*N+c;
function mk(t,r,c,yStart){return{t,sp:0,r,c,x:c,y:yStart===undefined?r:yStart,vy:0,fall:yStart!==undefined,sq:0,dying:false,dieT:0,born:1,ink:false,lock:false}}
function genBoard(){
  do{grid=[];for(let r=0;r<N;r++){grid.push([]);for(let c=0;c<N;c++){let t;do{t=rand(6)|0}while((c>1&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>1&&grid[r-1][c].t===t&&grid[r-2][c].t===t));grid[r].push(mk(t,r,c,r-N-1-rand(2)))}}}

function findMatches(){
  const runs=[];const ok=(r,c)=>grid[r][c]&&!grid[r][c].dying;
  for(let r=0;r<N;r++){let c=0;while(c<N){if(!ok(r,c)){c++;continue}const t=grid[r][c].t;let e=c+1;while(e<N&&ok(r,e)&&grid[r][e].t===t)e++;if(e-c>=3){const cells=[];for(let i=c;i<e;i++)cells.push(key(r,i));runs.push({cells,dir:'h'})}c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){if(!ok(r,c)){r++;continue}const t=grid[r][c].t;let e=r+1;while(e<N&&ok(e,c)&&grid[e][c].t===t)e++;if(e-r>=3){const cells=[];for(let i=r;i<e;i++)cells.push(key(i,c));runs.push({cells,dir:'v'})}r=e}}

  const ids=stagesOf(mapView),pts=ids.map((i,k)=>{const p=nodePos(k,ids.length);return[p.x/PX,p.y/PX]});
  for(let k=1;k<pts.length;k++){const[a,b]=pts[k-1],[c,d]=pts[k],n=Math.ceil(Math.hypot(c-a,d-b)/4),done=ids[k-1] in save.cleared;
    for(let j=1;j<n;j++){const x=a+(c-a)*j/n,y=b+(d-b)*j/n;g.fillStyle='#0b0d1f';g.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);g.fillStyle=done?'#ffc83c':'#a8a4c0';g.fillRect(Math.round(x),Math.round(y),1,1)}}
  const cur=curStageOf(mapView);const ck=ids.indexOf(cur);
  if(ck>=0){const[x,y]=pts[ck];turtle(g,x-13,y+3+Math.sin(t*2)*1.5,7,t,'#0b0d1f')}
}
function mapScreen(){return new Promise(res=>{mapResolve=res;mapView=Math.min(save.chapter,CHAPTERS.length);show('map');BGM.play(mapView===2||mapView===4?'palace':'title');renderMap();
  if(save.justEntered){save.justEntered=false;persist();const ch=CHAPTERS[mapView-1];$('#mbSub').textContent=ch.n+'　'+ch.sub;$('#mbName').textContent=ch.name;const b=$('#mbanner');b.classList.add('on');AU.fever();setTimeout(()=>b.classList.remove('on'),2200)}})}
$('#chPrev').addEventListener('click',()=>{if(mapView>1){mapView--;AU.tap();renderMap()}});
$('#chNext').addEventListener('click',()=>{if(mapView<Math.min(save.chapter,CHAPTERS.length)){mapView++;AU.tap();renderMap()}});
$('#mapMenu').addEventListener('click',async()=>{if(!modal.hidden)return;AU.tap();const r=await ask('<h2>メニュー</h2>',[{id:'back',label:'もどる',primary:true},{id:'snd',label:AU.on?'音を消す':'音を出す'},{id:'title',label:'タイトルへ'}]);if(r==='snd')toggleSnd();if(r==='title')toTitle()});

let runId=0;
async function run(){
  const id=++runId;
  if(!save.started){save.started=true;save.chapter=1;save.justEntered=true;persist();await playScene(SCRIPTS.opening);if(id!==runId)return}
  while(id===runId){
    if(save.chapter>CHAPTERS.length){await ending(id);return}
    const pick=await mapScreen();if(id!==runId)return;
    const st=STAGES[pick];
    if(st.pre&&!save.seen.includes(st.pre)){await playScene(SCRIPTS[st.pre]);if(id!==runId)return;save.seen.push(st.pre);persist()}
    let won=false;
    while(true){const res=await battle(pick);if(id!==runId)return;
      if(res.win){won=true;save.cleared[pick]=Math.max(save.cleared[pick]||0,res.stars);persist()}
      if(res.action!=='retry')break}
    if(won&&st.boss&&save.chapter===st.ch){await playScene(SCRIPTS[CHAPTERS[st.ch-1].clear]);if(id!==runId)return;save.chapter++;save.justEntered=true;persist()}
  }
}
let countIv=0;
function runCounter(from){const el=$('#bigcount'),n=$('#bigN');el.classList.add('on');const lf=Math.log10(Math.max(from,1)),t0=performance.now();let lastU=-1;
  clearInterval(countIv);countIv=setInterval(()=>{const f=Math.min(1,(performance.now()-t0)/16000);const v=Math.pow(10,lf+(68.5-lf)*Math.pow(f,1.6));n.textContent=f>=1?'無量大数':fmt(v);
    const u=Math.floor(Math.log10(v)/4);if(u!==lastU){lastU=u;AU.tick()}if(f>=1)clearInterval(countIv)},70)}
async function ending(id){
  const y=save.years,{L:lines,bg,tier}=endingLines(y);save.lastTier=tier;
  await playScene(lines);if(id!==runId)return;
  $('#skip').hidden=true;
  await say({who:'太郎',t:'玉手箱を、どうする。'});
  const ch=$('#choices');ch.hidden=false;nextEl.classList.remove('on');$('#chOpen').focus({preventScroll:true});
  const pick=await new Promise(res=>{$('#chOpen').onclick=()=>{AU.tap();res('open')};$('#chKeep').onclick=()=>{AU.tap();res('keep')}});
  ch.hidden=true;tbox.classList.add('off');
  let finalMoney=fmt(moneyAt(y));
  if(pick==='open'){AU.box();runCounter(moneyAt(y));await playScene(END_OPEN,{noSkip:true});clearInterval(countIv);$('#bigN').textContent='無量大数';finalMoney='無量大数'}
  else{setBg(bg);await playScene(END_KEEP,{noSkip:true})}
  if(id!==runId)return;
  $('#bigcount').classList.remove('on');
  const name=pick==='open'?'無量大数':'竜宮サブスク';if(!save.ends.includes(name))save.ends.push(name);
  $('#skip').hidden=true;$('#eName').textContent='「'+name+'」';$('#eYearsRow').innerHTML=pick==='open'?'地上で過ぎた時 <b>はかれない</b>':`地上で過ぎた時 <b>${y}</b> 年`;$('#eMoney').textContent=finalMoney;$('#endcard').hidden=false;AU.win();
  Object.assign(save,{started:false,chapter:1,cleared:{},seen:[],years:0,gauge:0});save.ends=save.ends.filter(e=>e==='無量大数'||e==='竜宮サブスク');persist();
}
['chOpen','chKeep'].forEach(id=>{const el=$('#'+id);el.addEventListener('pointerenter',()=>{document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('sel',m===el))});el.addEventListener('focus',()=>{document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('sel',m===el))})});
function toTitle(){runId++;mapResolve=null;$('#result').hidden=true;clearInterval(countIv);$('#bigcount').classList.remove('on');inBattle=false;ended=true;timerOn=false;battleResolve=null;advance=null;typing=null;modal.hidden=true;$('#endcard').hidden=true;$('#choices').hidden=true;BGM.fast=false;BGM.fever=false;refreshTitle();show('title')}
function refreshTitle(){$('#contBtn').hidden=!save.started;$('#endCount').textContent=save.ends.length?`見た結末 ${save.ends.length}/2`:'';$('#sndBtn').textContent=AU.on?'音 あり':'音 なし'}
function toggleSnd(){AU.setOn(!AU.on);save.snd=AU.on;persist();refreshTitle()}
$('#sndBtn').addEventListener('click',()=>{AU.init();toggleSnd()});
$('#newBtn').addEventListener('click',async()=>{AU.init();AU.tap();
  if(save.started){const r=await ask('<h2>はじめから</h2><p>いまの進み具合と預金は消えます。</p>',[{id:'y',label:'はじめから遊ぶ',primary:true},{id:'n',label:'やめておく'}]);if(r!=='y')return}
  Object.assign(save,{started:false,chapter:1,cleared:{},seen:[],years:0,gauge:0});persist();run()});
$('#contBtn').addEventListener('click',()=>{AU.init();AU.tap();run()});
$('#toTitle').addEventListener('click',()=>{AU.tap();toTitle()});
document.addEventListener('pointerdown',()=>AU.init(),{once:true});

layout();refreshTitle();BGM.play('title');requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load(`16px ${FONT}`).catch(()=>{});
})();
</script>
