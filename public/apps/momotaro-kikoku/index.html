// ================= MAP / FIELD =================
let M=null;const PL={x:0,y:0,px:0,py:0,dir:0,fr:0,mv:0,path:[],sc:0};
let banner=0,stepsEnc=0,bumpCD=0;
const DV=[[0,1],[0,-1],[-1,0],[1,0]];
function loadMap(id,x,y,dir){const def=MAPS[id];const w=Math.max(...def.rows.map(r=>r.length));
 M={id,def,w,h:def.rows.length,rows:def.rows.map(r=>(r+'#'.repeat(w)).slice(0,w)),actors:[]};G.map=id;
 Object.assign(PL,{x,y,px:x*16,py:y*16,dir:dir??0,mv:0,path:[],fr:0});rebuildActors();banner=160;stepsEnc=0;bgm(mapBgm());}
function mapBgm(){const b=M.def.bgm;return typeof b==='function'?b(G.flags):b;}
function rebuildActors(){M.actors=M.def.npcs.filter(n=>!n.when||n.when(G.flags)).map(n=>({...n,dir:n.dir||0,px:n.x*16,py:n.y*16,mv:0,path:[],fr:0,sc:0,hx:n.x,hy:n.y,wt:ri(60,200)}));}
function tileAt(x,y){return(x<0||y<0||x>=M.w||y>=M.h)?'#':M.rows[y][x];}
function actorAt(x,y){return M.actors.find(a=>((a.x===x&&a.y===y)||(a.mv>0&&a.tx===x&&a.ty===y))&&!a.ghost);}
function plAt(x,y){return(PL.x===x&&PL.y===y)||(PL.mv>0&&PL.tx===x&&PL.ty===y);}
const NOWANDER=['boar','maga','koma','kiri','boat','shuten','onib','gara'];
function npcIdle(a){if(a.mv||a.path.length)return;if(!a.talk||a.cage||NOWANDER.includes(a.k)||a.fixed||a.hx==null){a.fr=0;return;}
 if(--a.wt>0){a.fr=0;return;}a.wt=ri(50,160);if(Math.random()<.3){a.dir=ri(0,3);return;}const d=ri(0,3),nx=a.x+DV[d][0],ny=a.y+DV[d][1];
 if(Math.abs(nx-a.hx)>1||Math.abs(ny-a.hy)>1||!WALK.includes(tileAt(nx,ny))||actorAt(nx,ny)||plAt(nx,ny)||evAt(nx,ny,'touch')){a.dir=d;return;}startStep(a,d);}
function blocked(x,y){return !WALK.includes(tileAt(x,y))||!!actorAt(x,y);}
function evAt(x,y,on){return M.def.ev.find(e=>e.on===on&&x>=e.x&&x<e.x+(e.w||1)&&y>=e.y&&y<e.y+(e.h||1)&&(!e.when||e.when(G.flags)));}
function startStep(e,d){e.dir=d;e.tx=e.x+DV[d][0];e.ty=e.y+DV[d][1];e.mvMax=e===PL?8:11;e.mv=e.mvMax;}
function updEnt(e){if(e.mv>0){e.mv--;const mm=e.mvMax||8,k=(mm-e.mv)/mm;e.px=(e.x+(e.tx-e.x)*k)*16;e.py=(e.y+(e.ty-e.y)*k)*16;e.fr=e.mv>=mm/2?1+(e.sc%2):0;
  if(e.mv===0){e.x=e.tx;e.y=e.ty;e.px=e.x*16;e.py=e.y*16;e.sc++;e.fr=0;return true;}}
 else if(e.path.length){const d=e.path.shift();if(d>=0)startStep(e,d);}return false;}
const ent=id=>id==='p'?PL:M.actors.find(a=>a.id===id);
function walk(id,s,spd){const e=ent(id);if(!e)return Promise.resolve();e.sc=e.sc||0;e.path.push(...[...s].map(c=>'dulr'.indexOf(c)));return until(()=>!e.mv&&!e.path.length);}
function face(id,d){const e=ent(id);if(e)e.dir=typeof d==='string'?'dulr'.indexOf(d):d;}
function addA(o){const a={dir:0,mv:0,path:[],fr:0,sc:0,...o,px:o.x*16,py:o.y*16};M.actors=M.actors.filter(b=>b.id!==o.id);M.actors.push(a);return a;}
function rmA(id){M.actors=M.actors.filter(a=>a.id!==id);}
function fieldUpdate(){
 if(bumpCD>0)bumpCD--;if(banner>0)banner--;
 const arrived=updEnt(PL);M.actors.forEach(updEnt);
 if(SCN||MENU||DLG||CHO)return;
 M.actors.forEach(npcIdle);
 if(arrived&&onArrive())return;
 if(P.m){openMenu();return;}
 if(PL.mv)return;
 if(P.a){const tx=PL.x+DV[PL.dir][0],ty=PL.y+DV[PL.dir][1];const a=actorAt(tx,ty);
  if(a&&a.talk){if(a.k!=='boar')a.dir=[1,0,3,2][PL.dir];run(typeof a.talk==='function'?a.talk:()=>say(a.talk));return;}
  const e=evAt(tx,ty,'check');if(e){run(e.run);return;}}
 const d=K.d?0:K.u?1:K.l?2:K.r?3:-1;
 if(d>=0){PL.dir=d;const tx=PL.x+DV[d][0],ty=PL.y+DV[d][1];
  if(!blocked(tx,ty))startStep(PL,d);else{const e=evAt(tx,ty,'bump');if(e&&!bumpCD){bumpCD=24;sfx('door');run(e.run);}}}}
function onArrive(){const e=evAt(PL.x,PL.y,'touch');if(e){run(e.run);return true;}
 const enc=M.def.enc;if(enc){stepsEnc++;if(stepsEnc>7&&Math.random()<.06){stepsEnc=0;run(()=>battle(pick(enc.groups)));return true;}}return false;}
function camera(){const mw=M.w*16,mh=M.h*16;const cxp=mw<=W?(mw-W)/2:clamp(PL.px+8-W/2,0,mw-W),cyp=mh<=H?(mh-H)/2:clamp(PL.py+8-H/2,0,mh-H);return[Math.round(cxp),Math.round(cyp)];}

 all[i]={g:JSON.parse(JSON.stringify(G)),...p,date:Date.now(),place:MAPS[p.map].name};try{localStorage.setItem(SK,JSON.stringify(all));return true;}catch(e){return false;}}

 if(it.use==='heal'){if(G.hp[id]<=0||G.hp[id]>=mx)return false;G.hp[id]=Math.min(mx,G.hp[id]+Math.ceil(mx/2));}
 else if(it.use==='revive'){if(G.hp[id]>0)return false;G.hp[id]=Math.ceil(mx/2);}else return false;
 addItem(k,-1);sfx('heal');return true;}
function menuUpdate(){const m=MENU;if(m.msgT>0){m.msgT--;if(P.a||P.b)m.msgT=0;return;}

 if(m.lv==='top'){nav(6);if(P.b||P.m){MENU=null;sfx('no');return;}
  if(P.a){sfx('ok');if(m.i===0){m.lv='item';m.j=m.i;m.i=0;}else if(m.i===1){m.lv='party';}else if(m.i===2){m.lv='save';m.i=0;}else if(m.i===3){openLangSel();}else if(m.i===4){setSound(!soundOn);if(soundOn)audioInit();}else MENU=null;}}
 else if(m.lv==='item'){const L=invList();if(P.b){m.lv='top';m.i=0;sfx('no');return;}if(!L.length)return;nav(L.length);
  if(P.a){const k=L[m.i];if(ITEMS[k].key){sfx('no');m.msg=ITEMS[k].d;m.msgT=90;}else{sfx('ok');m.lv='itgt';m.k=k;m.pi=0;}}}
 else if(m.lv==='itgt'){const n=G.party.length;if(rep('u')){m.pi=(m.pi-1+n)%n;sfx('cur');}if(rep('d')){m.pi=(m.pi+1)%n;sfx('cur');}
  if(P.b){m.lv='item';sfx('no');return;}if(P.a){if(!useItem(m.k,G.party[m.pi]))sfx('no');if(!(G.items[m.k]>0)){m.lv='item';m.i=0;}}}
 else if(m.lv==='party'){if(P.a||P.b){m.lv='top';m.i=1;sfx('no');}}

// ================= BATTLE =================
let B=null;
const ENPOS={1:[[82,146]],2:[[56,124],[112,148]],3:[[46,114],[114,126],[72,150]]};
const alive=m=>G.hp[m.id]>0;
const aliveE=()=>B.en.filter(e=>!e.dead&&!e.dying);
function battle(gid){return new Promise(res=>startBattle(gid,res));}
function mkEnemy(id,x,y){const d=EN[id];return{id,d,n:d.n,hp:d.hp,mhp:d.hp,atb:rnd(0,45),x,y,flash:0,dying:0,dead:0,st:{},ph:1,trig:{},ox:0};}
function startBattle(gid,res){const g=GROUPS[gid];const pos=g.en.length===1?ENPOS[1]:ENPOS[g.en.length];
 B={gid,g,en:g.en.map((id,i)=>mkEnemy(id,pos[i][0],pos[i][1])),pt:G.party.map((id,i)=>({id,i,atb:rnd(30,70),st:{},ox:0,pose:0,hurt:0,mark:0})),
  res,t:0,intro:28,act:null,queue:[],ready:[],menu:null,lines:[...(g.start||[])],pops:[],fx:[],fl:{},end:null,banner:null,after:null,pulse:0};
 B.pt.forEach(m=>{if(!alive(m))m.atb=0;});mode='battle';sfx('enc');bgm(g.bgm||'battle');}
function cmdsFor(id){const f=G.flags,c=k=>({k,dis:false});
 if(id==='momo'){if(B&&B.fl.finale)return[c('tento')];if(f.guard)return[c('atk'),c('shugo'),c('item')];if(f.reveal)return[{k:'onikiri',dis:true},c('tamerau'),c('item')];return[c('atk'),c('onikiri'),c('item')];}
 if(id==='koma')return[c('atk'),c('gatotsu'),c('item')];
 if(id==='sasuke')return[c('atk'),c('steal'),c('rengeki'),c('item')];
 return[c('peck'),c('hane'),c('hama'),c('item')];}
function battleItems(){return['dango','shizuku'].filter(k=>(G.items[k]||0)>0);}
// --- feedback ---


function pop(t,s,c='#fff'){const[x,y]=t.d?ecen(t):pcen(t);B.pops.push({x:x+rnd(-4,4),y,s:String(s),c,t:0});}
function fxAt(k,t,d=22){const[x,y]=t.d?ecen(t):pcen(t);B.fx.push({k,x,y,t:0,d});}
// --- damage ---
function hurtE(e,d){if(!e||e.dead||e.dying)return;e.hp-=d;e.flash=8;pop(e,d);
 if(e.id==='tokoyami'&&!B.fl.tentoDone)e.hp=Math.max(1,e.hp);
 if(e.id==='magatsu'&&!e.trig.a&&e.hp<=0){e.hp=0;bossCheck(e);return;}
 if(e.hp<=0){e.hp=0;e.dying=36;sfx('dead');}else bossCheck(e);}
function dmgE(e,atk,mult){if(!e)return;hurtE(e,Math.max(1,Math.round((atk*2-e.d.def)*rnd(.88,1.12)*mult)));}
function calcP(e,m,mult){return Math.max(1,Math.round((e.d.atk*2-stat(m.id,'def'))*rnd(.88,1.12)*mult*(B.fl.guard>0?.5:1)));}
function hurtP(m,d){if(!alive(m))return;G.hp[m.id]=Math.max(0,G.hp[m.id]-d);pop(m,d);m.hurt=10;
 if(G.hp[m.id]<=0){sfx('dead');m.st={};m.atb=0;B.ready=B.ready.filter(x=>x!==m);if(B.menu&&B.menu.m===m)B.menu=null;}else sfx('hit');}
function healP(m,n){if(!alive(m))return;const mx=stat(m.id,'hp');G.hp[m.id]=Math.min(mx,G.hp[m.id]+n);pop(m,n,'#7dffa8');fxAt('heal',m,30);}
function tgtE(e){return(e&&!e.dead&&!e.dying)?e:pick(aliveE())||null;}
// --- readiness ---
function onReady(m){if(m.st.poison>0){m.st.poison--;const d=Math.max(1,Math.round(stat(m.id,'hp')*.06));G.hp[m.id]=Math.max(1,G.hp[m.id]-d);pop(m,d,'#c890ff');}
 if(m.st.fear>0){m.st.fear--;if(Math.random()<.35){m.atb=0;pop(m,'おびえ','#c8a0ff');return;}}
 B.ready.push(m);}
// --- actions ---
function partyAct(m,k,tgt,ik){const sk=SKILL[k];const nm=(k==='atk'||k==='peck'||k==='item')?(k==='item'?ITEMS[ik].n:null):sk.n;
 const a={side:'p',src:m,t:0,dur:40,hit:16,name:nm};
 a.pre=()=>{if(!alive(m))return false;if(sk.mp)G.mp[m.id]=Math.max(0,G.mp[m.id]-sk.mp);return true;};
 const atk=stat(m.id,'atk'),mag=stat(m.id,'mag');
 a.apply=()=>{let e;switch(k){
  case 'atk':case 'peck':e=tgtE(tgt);if(e){fxAt('slash',e);sfx('slash');dmgE(e,atk,1);}break;
  case 'onikiri':e=tgtE(tgt);if(e){m.mark=50;fxAt('red',e,28);sfx('red');shake(8);dmgE(e,atk,2.3);}break;
  case 'tamerau':e=tgtE(tgt);if(Math.random()<.5||!e){pop(m,'……','#aab');B.banner={s:'手が、震える……',t:40};sfx('no');}else{fxAt('slash',e,14);sfx('slash');dmgE(e,atk,.35);}break;
  case 'gatotsu':e=tgtE(tgt);if(e){fxAt('hit',e,26);sfx('big');dmgE(e,atk,1.9);}break;
  case 'steal':e=tgtE(tgt);if(!e)break;fxAt('slash',e,12);if(e.st.stolen||e.d.spr==='magatsu'||e.d.spr==='tokoyami'){B.banner={s:'なにも持っていない',t:40};sfx('no');}else if(Math.random()<.55){e.st.stolen=1;addItem('dango',1);B.banner={s:'きびだんごを盗んだ！',t:50};sfx('item');}else{B.banner={s:'盗めなかった',t:40};sfx('no');}break;
  case 'rengeki':e=tgtE(tgt);if(e){fxAt('slash',e);sfx('slash');dmgE(e,atk,.85);}a.hit2=a.hit+9;a.apply2=()=>{const e2=tgtE(tgt);if(e2){fxAt('slash',e2);sfx('slash');dmgE(e2,atk,.85);}};break;
  case 'hane':sfx('heal');B.pt.filter(alive).forEach(x=>{x.st.poison=0;healP(x,Math.round(mag*3+10));});break;
  case 'hama':sfx('magic');flash('#fff',8);aliveE().forEach(x=>{fxAt('holy',x,26);hurtE(x,Math.max(1,Math.round((mag*2.4-x.d.def*.5)*rnd(.9,1.1))));});break;
  case 'shugo':sfx('shield');B.fl.guard=4;B.fx.push({k:'shield',x:205,y:85,t:0,d:40});B.pt.filter(alive).forEach(x=>healP(x,Math.round(stat(x.id,'hp')*.12)));B.banner={s:'守護 ― 仲間への攻撃が半減する',t:50};break;
  case 'tento':e=tgtE(tgt);B.fl.tentoDone=1;sfx('peach');flash('#fff',45);shake(30);B.fx.push({k:'peach',x:128,y:80,t:0,d:70});if(e)hurtE(e,e.hp);break;
  case 'item':{const it=ITEMS[ik];const t=tgt;if(it.use==='heal'&&alive(t)){addItem(ik,-1);sfx('heal');healP(t,Math.ceil(stat(t.id,'hp')/2));}
   else if(it.use==='revive'&&!alive(t)){addItem(ik,-1);sfx('heal');G.hp[t.id]=Math.ceil(stat(t.id,'hp')/2);t.atb=0;pop(t,'復活','#7dffa8');fxAt('heal',t,30);}else{B.banner={s:'こうかがない',t:40};sfx('no');}break;}
 }};
 if(k==='tento'){a.dur=80;a.hit=30;}
 return a;}
function chooseSkill(e){const sk=[...(e.d.sk||[])];if(e.id==='shuten'&&e.ph===2)sk.push(['血桃の炎','all',.9,2]);
 let tot=2;sk.forEach(s=>tot+=s[3]);let r=Math.random()*tot;for(const s of sk){r-=s[3];if(r<0)return{name:s[0],type:s[1],mult:s[2]};}return{name:null,type:'atk',mult:1};}
function enemyAct(e){const s=chooseSkill(e);const a={side:'e',src:e,t:0,dur:s.name?46:34,hit:14,name:s.name};
 a.pre=()=>!(e.dead||e.dying)&&!B.fl.tokoTrig;
 a.apply=()=>{const al=B.pt.filter(alive);if(!al.length)return;
  switch(s.type){
   case 'atk':case 'poison':{const m=pick(al);fxAt('claw',m);hurtP(m,calcP(e,m,s.mult));if(s.type==='poison'&&alive(m)){m.st.poison=4;pop(m,'毒','#c890ff');}break;}
   case 'all':shake(10);al.forEach(m=>{fxAt('dark',m);hurtP(m,calcP(e,m,s.mult));});break;
   case 'fear':sfx('roar');shake(16);al.forEach(m=>{m.st.fear=3;pop(m,'おびえ','#c8a0ff');});break;
   case 'summon':{const used=B.en.filter(x=>!x.dead).map(x=>x.x);const slot=ENPOS[3].find(p=>!used.includes(p[0]));if(slot&&aliveE().length<3){const n=mkEnemy('thug',slot[0],slot[1]);n.atb=0;B.en.push(n);sfx('door');B.banner={s:'ごろつきが現れた！',t:40};}else{const m=pick(al);fxAt('claw',m);hurtP(m,calcP(e,m,1));}break;}
  }if(B.fl.guard>0)B.fl.guard--;};
 return a;}
function stepAct(a){if(a.t===0){if(a.pre&&a.pre()===false){B.act=null;return;}if(a.name)B.banner={s:a.name,t:a.dur};}
 a.t++;if(a.side==='p'){const d=a.dur;a.src.ox=a.t<10?-a.t*1.6:a.t>d-10?-(d-a.t)*1.6:-16;a.src.pose=1;}else a.src.ox=(a.t<a.hit?Math.min(a.t,8):Math.max(0,8-(a.t-a.hit)))*1.3;
 if(a.t===a.hit)a.apply();if(a.hit2&&a.t===a.hit2)a.apply2();
 if(a.t>=a.dur){a.src.ox=0;if(a.side==='p')a.src.pose=0;B.act=null;if(a.done)a.done();}}
// --- boss scripting ---
function bossCheck(e){const r=e.hp/e.mhp;
 if(e.id==='nushi'&&r<.3&&!e.trig.a){e.trig.a=1;B.lines.push(['ヌシ','……カエリ……タイ……']);}
 if(e.id==='kokujo'&&r<.5&&!e.trig.a){e.trig.a=1;B.lines.push(['黒縄','てめえも鬼を斬ってきたんだろうが！ オレと何が違う！'],['桃太郎','……！']);}
 if(e.id==='soga'&&r<.5&&!e.trig.a){e.trig.a=1;B.lines.push(['蒼牙','人間に与するか、小僧……その目、どこかで……']);}
 if(e.id==='shuten'){
  if(r<=.5&&!e.trig.a){e.trig.a=1;B.lines.push(['酒呑童子','オオオオ……！ 鬼哭――！！']);B.after=()=>{sfx('roar');shake(34);flash('#a00020',24);e.ph=2;B.pulse=1;B.pt.filter(alive).forEach(m=>{m.st.fear=3;pop(m,'おびえ','#c8a0ff');});
   B.lines.push(['','酒呑童子は「血桃の王」へと姿を変えた！'],['酒呑童子','お前の母は、人と鬼が手を取り合えると信じていた']);};}
  if(r<=.22&&!e.trig.b){e.trig.b=1;B.lines.push(['酒呑童子','わしは……そんなもの、信じられなかった']);}}
 if(e.id==='magatsu'&&e.hp<=0&&!e.trig.a){e.trig.a=1;e.hp=1;B.queue=B.queue.filter(q=>q.side==='p');B.lines.push(['禍津神','……ククク。まだだ。まだ、終わらぬ']);
  B.after=()=>{sfx('horn');flash('#fff',30);shake(30);const n=mkEnemy('tokoyami',e.x,e.y);Object.assign(e,n);B.pulse=0;
   B.lines.push(['','禍津神の姿がゆらぎ――桃太郎そっくりの姿へと変わった。'],['','頭には巨大な角。手には、血に染まった刀。'],['常闇','お前も鬼を殺した。お前もまた、わたしの一部だ'],['桃太郎','……そうだ。俺は間違えた']);};}
 if(e.id==='tokoyami'&&r<=.3&&!B.fl.tokoTrig){B.fl.tokoTrig=1;B.queue=[];B.ready=[];B.menu=null;finaleSeq(e);}}
function comboAct(id,name,fk,snd,done){const m=B.pt.find(x=>x.id===id);const a={side:'p',src:m,t:0,dur:36,hit:14,name};
 a.apply=()=>{const e=aliveE()[0];if(!e)return;fxAt(fk,e,26);sfx(snd);hurtE(e,Math.round(e.mhp*.07));};a.done=done;return a;}
function finaleSeq(e){B.lines.push(['常闇','ならば、なぜ抗う？'],['桃太郎','間違えたからこそ……これ以上、間違えたくないんだ！']);
 B.after=()=>{G.party.forEach(id=>{G.hp[id]=stat(id,'hp');});B.pt.forEach(m=>{m.st={};});sfx('heal');flash('#ffd8e0',20);
  B.lines.push(['コマ','桃太郎！ 道は俺たちが開く！'],['サスケ','団子の分は、きっちり働くぜ！'],['キリ','今度こそ、わたしの意志で！']);
  B.after=()=>{B.queue.push(comboAct('koma','牙突','hit','big'),comboAct('sasuke','連撃','slash','slash'),comboAct('kiri','破魔','holy','magic',()=>{B.fl.finale=1;const mo=B.pt.find(m=>m.id==='momo');mo.atb=100;B.ready=[mo];B.lines.push(['','仲間たちの想いが、桃太郎の刀に宿る――'],['','（「天桃一閃」を選べ）']);}));};};}
// --- menu ---
const CMEM={};
function openBMenu(m){const list=cmdsFor(m.id);const mem=CMEM[m.id]||{};let i=list.findIndex(c=>c.k===mem.k&&!c.dis);if(i<0)i=Math.max(0,list.findIndex(c=>!c.dis));B.menu={m,lv:'cmd',i,list,j:mem.j||0,mti:mem.ti||0};sfx('cur');}
function tgtList(tg){return tg==='e1'?aliveE():B.pt;}
function menuB(){const mm=B.menu,m=mm.m;if(!alive(m)){B.ready=B.ready.filter(x=>x!==m);B.menu=null;return;}
 const nav=(key,n)=>{if(rep('u')){mm[key]=(mm[key]-1+n)%n;sfx('cur');}if(rep('d')){mm[key]=(mm[key]+1)%n;sfx('cur');}};
 if(mm.lv==='cmd'){nav('i',mm.list.length);
  if(P.b&&B.ready.length>1){B.ready.push(B.ready.shift());B.menu=null;sfx('cur');return;}
  if(P.a){const c=mm.list[mm.i],sk=SKILL[c.k];
   if(c.dis){sfx('no');B.banner={s:'……刀が、抜けない',t:50};return;}
   if(sk.mp&&G.mp[m.id]<sk.mp){sfx('no');B.banner={s:'MPがたりない',t:50};return;}
   if(sk.tg==='item'){if(!battleItems().length){sfx('no');B.banner={s:'どうぐがない',t:40};return;}mm.lv='item';mm.j=Math.min(mm.j||0,battleItems().length-1);sfx('ok');return;}
   sfx('ok');mm.k=c.k;if(sk.tg==='pall'||sk.tg==='eall'){commit(m,c.k,null);return;}mm.tg=sk.tg;mm.lv='tgt';mm.ti=mm.mti||0;}}
 else if(mm.lv==='item'){const L=battleItems();if(!L.length){mm.lv='cmd';return;}nav('j',L.length);
  if(P.b){mm.lv='cmd';sfx('no');return;}if(P.a){sfx('ok');mm.k='item';mm.ik=L[mm.j];mm.tg='p1';mm.lv='tgt';mm.ti=ITEMS[mm.ik].use==='revive'?Math.max(0,B.pt.findIndex(x=>!alive(x))):B.pt.indexOf(m);}}
 else if(mm.lv==='tgt'){const L=tgtList(mm.tg);if(!L.length){mm.lv='cmd';return;}mm.ti=Math.min(mm.ti,L.length-1);nav('ti',L.length);
  if(P.b){mm.lv=mm.k==='item'?'item':'cmd';sfx('no');return;}if(P.a){sfx('ok');commit(m,mm.k,L[mm.ti],mm.ik);}}}
function commit(m,k,t,ik){const mm=B.menu;CMEM[m.id]={k,j:mm?mm.j:0,ti:mm?mm.ti:0};B.queue.push(partyAct(m,k,t,ik));m.atb=0;B.ready=B.ready.filter(x=>x!==m);B.menu=null;}
// --- update ---
function battleUpdate(){const b=B;b.t++;
 b.pops.forEach(p=>p.t++);b.pops=b.pops.filter(p=>p.t<54);b.fx.forEach(f=>f.t++);b.fx=b.fx.filter(f=>f.t<f.d);
 if(b.banner&&--b.banner.t<=0)b.banner=null;
 b.en.forEach(e=>{if(e.flash>0)e.flash--;if(e.dying>0&&--e.dying===0)e.dead=1;});
 if(b.intro>0){b.intro--;return;}
 if(b.lines.length){if(P.a){sfx('cur');const nl=wrap(L(b.lines[0][1]),228).length;b.lp=(b.lp||0)+1;if(b.lp*2<nl)return;b.lp=0;b.lines.shift();if(!b.lines.length&&b.after){const f=b.after;b.after=null;f();}}return;}
 if(b.end){endUpdate();return;}
 if(b.act){stepAct(b.act);return;}
 if(b.en.some(e=>e.dying>0))return;
 if(!b.en.some(e=>!e.dead)){winBattle();return;}
 if(!b.pt.some(alive)){b.end={k:'lose',t:0,i:0};bgm('sad');return;}
 if(b.queue.length){b.act=b.queue.shift();b.act.t=0;return;}
 if(b.menu){menuB();return;}
 const k=.075;
 b.pt.forEach(m=>{if(!alive(m)){m.atb=0;return;}if(b.ready.includes(m)||b.fl.tokoTrig)return;m.atb+=stat(m.id,'spd')*k*(m.st.fear?.55:1);if(m.atb>=100){m.atb=100;onReady(m);}});
 if(!b.fl.tokoTrig)b.en.forEach(e=>{if(e.dead||e.dying)return;e.atb+=e.d.spd*k;if(e.atb>=100){e.atb=0;b.queue.push(enemyAct(e));}});
 if(b.ready.length)openBMenu(b.ready[0]);}
function winBattle(){const b=B;const msg=['たたかいに勝った！'];
 let xp=0;b.en.forEach(e=>{xp+=Math.round(e.d.hp*.3);});if(b.g.boss)xp=Math.round(xp*1.5);
 msg.push(L('経験値 {n} を獲得！',{n:xp}));let up=false;
 b.pt.filter(alive).forEach(m=>{const id=m.id;G.exp[id]=(G.exp[id]||0)+xp;const h0=stat(id,'hp'),m0=stat(id,'mp');let lv=lvOf(id);while(lv<99&&G.exp[id]>=EXPT(lv+1))lv++;
  if(lv>lvOf(id)){G.lv[id]=lv;up=true;G.hp[id]=Math.min(stat(id,'hp'),G.hp[id]+stat(id,'hp')-h0);G.mp[id]=Math.min(stat(id,'mp'),G.mp[id]+stat(id,'mp')-m0);msg.push(L('{name}はレベル {lv} に上がった！',{name:L(BASE[id].n),lv}));}});
 b.lvup=up;
 if(!b.g.boss&&Math.random()<.3){addItem('dango',1);msg.push('きびだんごを 1つ 見つけた');}
 if(!b.g.boss)b.pt.filter(alive).forEach(m=>{G.hp[m.id]=Math.min(stat(m.id,'hp'),G.hp[m.id]+Math.round(stat(m.id,'hp')*.1));G.mp[m.id]=Math.min(stat(m.id,'mp'),G.mp[m.id]+2);});
 b.end={k:'win',t:0,msg};bgm(null);sfx('win');if(b.lvup)setTimeout(()=>sfx('lvup'),900);}
function endUpdate(){const e=B.end;e.t++;
 if(e.k==='win'){if(e.t>40&&P.a){const r=B.res;B=null;mode='field';if(M)bgm(mapBgm());r();}return;}
 if(e.t<40)return;if(rep('u')||rep('d')){e.i^=1;sfx('cur');}
 if(P.a){sfx('ok');if(e.i===0){healAll();startBattle(B.gid,B.res);}else{B=null;resetScenes();toTitle();}}}
function resetScenes(){SCN=0;WAITS.length=0;DLG=null;CHO=null;MENU=null;}
// --- draw ---
function drawFx(f){const p=f.t/f.d,x=f.x,y=f.y;cx.save();
 switch(f.k){

 async c5final(){

 // ---------- ENDING ----------

  await T(N,'禍津神は、消えなかった。');

  await fade(1,30);VIEW=null;f.end=1;loadMap('village',12,14,1);bgm(null);
  addA({id:'e1',k:'vm',x:11,y:11,dir:0});addA({id:'e2',k:'vw',x:13,y:11,dir:0});addA({id:'e3',k:'kid',x:12,y:10,dir:0});
  await fade(0,40);
  await T('村人','……あれは……桃太郎か？');

  await T('おばあさん','おかえり、桃太郎');
  await T('桃太郎','……俺は、鬼なんだ');
  await T('おじいさん','知っておったよ');
  await T('桃太郎','……え？');
  await T('おじいさん','桃から生まれようが、鬼であろうが……お前は、わしらの孫じゃ');
  bgm('ending');await wait(40);
  await T(N,'桃太郎は――初めて、泣いた。');
  await fade(1,60);
  VIEW={k:'black'};await fade(0,10);
  await T(N,'しばらくして、桃太郎はふたたび旅に出た。');
  await T(N,'今度は鬼を退治するためではなく――人間と鬼が、共に暮らせる場所を探すために。');
  await fade(1,40);VIEW={k:'riverEnd',t:0};petals=[];await fade(0,90);await wait(260);
  await T(N,'鬼とは、誰のことだったのだろう。');
  await wait(60);await fade(1,90);
  await bigText(['― FIN ―'],220);
  VIEW={k:'credits',t:0};await fade(0,30);await until(()=>VIEW&&VIEW.t>CREDITS.length*26+260);
  await fade(1,60);f.cleared=1;resetScenes();toTitle();}
};
const CREDITS=['桃太郎 ― 鬼哭島 ―','','桃太郎','コマ','サスケ','キリ','','おじいさん','おばあさん','赤鬼・ガラ','穢れ猪・ヌシ','黒縄','青鬼将軍・蒼牙','鬼王・酒呑童子','禍津神・常闇','','「生まれが自分を決めるのではない。」','「何を選び、どう生きるかが自分を決める。」','','Thank you for playing.'];
// ================= MAIN LOOP =================
function update(){FR++;inputFrame();
 if(FADE.a!==FADE.to){FADE.a=FADE.a<FADE.to?Math.min(FADE.to,FADE.a+FADE.sp):Math.max(FADE.to,FADE.a-FADE.sp);}
 if(FL&&--FL.n<=0)FL=null;if(SHK>0)SHK--;
 if(VIEW){VIEW.t=(VIEW.t||0)+1;if(VIEW.k==='river'&&!VIEW.red)VIEW.prog=Math.min(1,(VIEW.prog||0)+.004);}
 if(BIG){BIG.t++;if(BIG.t>=BIG.dur)BIG=null;}
 if(LSEL)langSelUpdate();
 else if(mode==='title')titleUpdate();
 else if(mode==='battle'&&B){G.play+=1/60;battleUpdate();}
 else if(mode==='field'&&M){G.play+=1/60;if(MENU)menuUpdate();else fieldUpdate();}
 updDlg();tickWaits();}
function drawView(){const v=VIEW;
 if(v.k==='river')drawRiver(v.t,v.red?'red':'op',v.prog||0);
 else if(v.k==='riverEnd')drawRiver(v.t,'end',0);
 else if(v.k==='camp')drawCamp(v.t);
 else if(v.k==='sea')drawSea(v.t);
 else if(v.k==='black')R(0,0,W,H,'#000');
 else if(v.k==='credits'){R(0,0,W,H,'#060304');drawPetals(true);CREDITS.forEach((s,i)=>{const y=H+20+i*26-v.t*.55;if(y>-20&&y<H+10)txt(s,128,y,i===0?'#f2c6d0':s.startsWith('「')?'#c8a0a8':'#e8dcd0',i===0?13:10,'center');});}}
function draw(){cx.setTransform(PXS,0,0,PXS,0,0);
 if(SHK>0){const k=Math.min(3,SHK/6);cx.setTransform(PXS,0,0,PXS,rnd(-k,k)*PXS,rnd(-k,k)*PXS);}
 R(-8,-8,W+16,H+16,'#000');
 if(mode==='title')titleDraw();
 else if(VIEW)drawView();
 else if(mode==='battle'&&B)battleDraw();
 else if(M)fieldDraw();
 if(BIG){const a=Math.min(1,BIG.t/14,(BIG.dur-BIG.t)/14);R(0,0,W,H,'#000');cx.globalAlpha=Math.max(0,a);
  if(BIG.lines.length===2){txt(BIG.lines[0],128,96,'#c8a0a0',10,'center');txt(BIG.lines[1],128,114,'#f4e6dc',18,'center');}else txt(BIG.lines[0],128,108,'#f4e6dc',14,'center');cx.globalAlpha=1;}
 if(MENU&&mode==='field')menuDraw();
 drawDlg();drawCho();if(LSEL)langSelDraw();
 cx.setTransform(PXS,0,0,PXS,0,0);
 if(FL){cx.globalAlpha=FL.n/FL.m;R(0,0,W,H,FL.c);cx.globalAlpha=1;}
 if(FADE.a>0){cx.globalAlpha=FADE.a;R(0,0,W,H,'#000');cx.globalAlpha=1;}}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}draw();requestAnimationFrame(loop);}
function boot(){applyDomLang();mode='title';TTL={lv:'press',i:0,t:0};FADE.a=0;FADE.to=0;requestAnimationFrame(loop);}
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('10px DotGothic16'),new Promise(r=>setTimeout(r,1500))]).then(boot,boot);}else boot();
</script>
