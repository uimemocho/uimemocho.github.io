 function svg(t,px,col){const w=t.length*6-1,h=7;let r='';[...t].forEach((c,i)=>GL[c].forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='#')r+=`<rect x="${i*6+x}" y="${y}" width="1" height="1"/>`;})));return`<svg width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" fill="${col}" aria-hidden="true">${r}</svg>`;}

'use strict';
// ================= CORE =================
const W=256,H=240,PXS=2;const WALK='.,=sorp';

cx.setTransform(PXS,0,0,PXS,0,0);cx.imageSmoothingEnabled=false;

const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;};
let FR=0;

// ================= INPUT =================
const K={u:0,d:0,l:0,r:0,a:0,b:0,m:0},P={},prevK={},hold={};
function inputFrame(){for(const k in K){P[k]=!!(K[k]&&!prevK[k]);prevK[k]=K[k];hold[k]=K[k]?(hold[k]||0)+1:0;}}
function rep(k){return P[k]||(hold[k]>16&&hold[k]%5===0);}
const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',KeyZ:'a',Space:'a',Enter:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyC:'m',KeyM:'m',Tab:'m'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){K[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0;});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
function stickSet(dx,dy){const m=Math.hypot(dx,dy),R0=44;if(m>R0){dx*=R0/m;dy*=R0/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;K.u=K.d=K.l=K.r=0;if(m>13){if(Math.abs(dx)>Math.abs(dy))K[dx<0?'l':'r']=1;else K[dy<0?'u':'d']=1;}}
function stickMv(e){if(e.pointerId!==sid)return;const b=stick.getBoundingClientRect();stickSet(e.clientX-b.left-b.width/2,e.clientY-b.top-b.height/2);}
stick.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;try{stick.setPointerCapture(sid);}catch(_){}stickMv(e);});
stick.addEventListener('pointermove',stickMv);
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,e=>{if(e.pointerId===sid){sid=null;stickSet(0,0);}}));
[['bA','a'],['bB','b'],['menuBtn','m']].forEach(([id,k])=>{const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}K[k]=1;el.classList.add('on');});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{K[k]=0;el.classList.remove('on');}));});
cv.addEventListener('pointerdown',e=>{e.preventDefault();K.a=1;});
cv.addEventListener('pointerup',()=>{K.a=0;});cv.addEventListener('pointercancel',()=>{K.a=0;});

// ================= AUDIO =================

try{soundOn=localStorage.getItem('momo_kikoku_snd')!=='0';}catch(e){}

// ring/silent switch mutes it unless the page's audio session is "playback". A looping silent <audio>
// element forces that session on older iOS; navigator.audioSession covers iOS 17+.
let SILENT=null;
function silentLoop(){if(SILENT)return;try{const sr=8000,n=sr/2,b=new ArrayBuffer(44+n),v=new DataView(b);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);
 const a=document.createElement('audio');a.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));a.loop=true;a.setAttribute('playsinline','');a.setAttribute('x-webkit-airplay','deny');a.preload='auto';SILENT=a;}catch(e){}}
function audioInit(){
 try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}
 silentLoop();if(SILENT&&SILENT.paused){const p=SILENT.play();if(p&&p.catch)p.catch(()=>{});}
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e2){AC=null;return;}}
  MG=AC.createGain();MG.gain.value=soundOn?.8:0;MG.connect(AC.destination);
  BG=AC.createGain();BG.gain.value=.6;BG.connect(MG);SG=AC.createGain();SG.gain.value=.8;SG.connect(MG);
  AC.onstatechange=()=>{if(AC.state==='running'&&curBgm&&!bgmData)startBgm(curBgm);};}
 if(AC.state!=='running'){try{const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
 try{const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){}
 if(curBgm&&!bgmData)startBgm(curBgm);}
['pointerup','touchend','click','keydown'].forEach(t=>addEventListener(t,()=>audioInit(),{capture:true,passive:true}));

function osc(dst,type,f,t,d,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.03);}
let NB=null;function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}

かぶ痣と同じ形をしていた。":"was the same shape as the mark that sometimes appears on Momotaro's forehead.","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"Deep in the shrine, a twisted beast rages. Nearby, a wounded pheasant is huddled.","……にげて……ください……その獣は、もう……":"...Run... please... that beast is no longer...","でけえ猪だ……来るぞ！":"That's one huge boar... Here it comes!","穢れ猪は、静かに崩れ落ちた。":"The tainted boar quietly collapsed.","雉":"Pheasant","……助かりました。わたしはキリ。この社の神木に仕える者です":"...You saved me. I am Kiri. I serve the sacred tree of this shrine.","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"This beast was once an ordinary boar that guarded the shrine. People cut down the sacred tree, and the land's spirit fell into chaos.","鬼の仕業じゃないのか？":"It wasn't the oni's doing?","この世の災いが、すべて鬼の仕業とは限りません":"Not every misfortune in this world is the work of oni.","……あなたは、鬼ヶ島へ行くのですね":"...You are going to Onigashima, aren't you?","ああ。鬼を退治しに":"Yeah. To defeat the oni.","キリは何かを言いかけて――口をつぐんだ。":"Kiri began to say something— then fell silent.","わたしも、お供させてください。……島に、確かめたいことがあるのです":"Please let me come with you. ...There is something I must confirm on that island.","キリが仲間になった！":"Kiri joined the party!","夜の野営。":"Camp at night.","なあ、桃太郎。なんで俺たちに団子をくれた？":"Hey, Momotaro. Why'd you give us dango?","仲間になってほしかったから":"Because I wanted you to be my friends.","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"Buying friends with food? What a crafty hero.","違うって！":"That's not it!","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"...They say kibi dango were once shared when humans and oni ended their wars.","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"Not so that one would serve the other— but as a sign of a promise between equals.","……約束、か":"...A promise, huh.","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"Kiri kept gazing at Momotaro's profile, and said nothing.","鬼の涙":"Tears of the Oni","潮哭きの港。":"Harbor of Crying Tides.","鬼は人を食うんだ！ 生かしておくな！":"Oni eat people! Don't let it live!","檻の中で、小さな鬼の子が石を投げつけられている。":"In a cage, a small oni child is being pelted with stones.","……鬼か。いい気味だ":"...An oni, huh. Serves it right.","桃太郎は、黙って通り過ぎようとした――":"Momotaro tried to walk past in silence—","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"The oni child murmured softly, in a language humans don't understand.","鬼の子":"Oni Child","……おかあさん……":"...Mother...","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"...Somehow, Momotaro understood it. His feet stopped.","……サスケ。あの檻、開けられるか":"...Sasuke. Can you open that cage?","鍵がありゃな。番所――右端の建物にあるはずだ":"With a key, sure. It should be in the guardhouse— the building on the far right.","おい、本気か！？":"Hey, are you serious?!","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"Staying the night? No charge. Even in a port like this, we treat travelers kindly.","休む":"Rest","やめておく":"Not now","ぐっすり眠った。みんな元気になった！":"Everyone slept soundly and feels refreshed!","番所はもぬけの殻だ。":"The guardhouse is deserted.","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"No one's in the guardhouse. On the desk: a ring of keys... and a thick ledger.","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"Let's see... \"One oni child. To be shown, then sold.\"","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"And this: \"To Onigashima, one hundred swords\"— weapon smuggling. Kokujo, the harbor boss, is behind it.","人間が……鬼に、武器を……？":"Humans are... giving weapons... to the oni...?","番所の鍵束を手に入れた。":"Got the Guardhouse Keys.","檻には頑丈な錠がかかっている。":"The cage is fastened with a sturdy lock.","ガチャリ、と錠が外れた。":"Click— the lock came open.","……え？":"...Huh?","おいおい。オレの商品に、何をしてる":"Well, well. What are you doing with my merchandise?","鬼を殺して何が悪い！ 奴らは人間じゃない！":"What's wrong with killing oni?! They're not human!","……それでも、子供に罪はない！":"...Even so, a child is innocent!","お前だって鬼を殺してきたんだろうが！ 何が違う！":"You've been killing oni too, haven't you?! What's the difference?!","野郎ども、まとめて海に沈めろ！":"Boys, sink the lot of them in the sea!","黒縄たちは、港から逃げ去った。":"Kokujo and his men fled the harbor.","……おい。鬼をかばうのか？":"...Hey. You're protecting an oni?","あいつらが俺の村に何をしたか、知ってるだろ！":"You know what they did to my village!","でも……":"But...","お前は鬼を倒すために旅に出たんじゃなかったのか！":"Didn't you set out to defeat the oni?!","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"Koma turned away. For the first time, a crack ran between the friends.","お兄ちゃん……鬼なのに、どうして角がないの？":"Big brother... you're an oni, so why don't you have horns?","……何を言ってる？":"...What are you talking about?","だって、お兄ちゃんから、お母さんと同じ匂いがする":"Because you smell just like my mother.","キリは、黙って顔を伏せた。":"Kiri silently lowered her eyes.","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"...Right. I'll take the kid to a friend on the island. There's an old ship at the pier on the edge of the harbor.","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"A ship oni and humans once used for trade. It'll get us to Onigashima.","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"...To Onigashima? Are you mad? ...Well, fine. This old ship's been itching to go to sea.","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"With the oni child aboard, the ship rowed out onto the gray sea.","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"This ship carried cargo for oni and humans until a hundred years ago. Rice, medicine, festival masks...","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"Humans and oni both get hungry. Horns don't matter in business.","……お兄ちゃん。島に帰ったら、お母さんに会える？":"...Big brother. When we get back to the island, will I see my mother?","……ああ。きっと会えるさ":"...Yeah. I'm sure you will.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"Koma silently watched the sea. Kiri looked away from Momotaro's face.","やがて霧の向こうに、黒い島影が浮かび上がる。":"At last, beyond the mist, a black island rises into view.","見えたぞ。……鬼ヶ島だ":"There it is. ...Onigashima.","（……どうか、まだ。もう少しだけ――）":"(...Please, not yet. Just a little longer—)","鬼の血":"Oni Blood","鬼ヶ島。":"Onigashima.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"What lay before them was no paradise of savage oni— but ravaged land, and starving people.","……ここが、鬼ヶ島？":"...This is Onigashima?","人間が追い出した連中の、行き着いた先さ":"It's where everyone humans drove out ended up.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"I left the kid with a friend. ...Be careful. Some here hate humans with a passion.","おなか、すいた……":"I'm hungry...","きびだんごをあげる":"Give a kibi dango","あげない":"Don't give one" の猿だ。団子を取り返すぞ":"等等。先找那只猴子。把团子抢回来。","朽ちた神社。かつて人間が「鬼」を神として祀っていたという、古い社だ。":"荒废的神社。据说以前人们曾把“鬼”当作神来供奉。","色あせた壁画。鬼と人間が、同じ食卓を囲んでいる。":"褪色的壁画。鬼与人类围坐在同一张饭桌前。","……昔は、こうだったって話さ":"……听说以前就是这样的。","神木の絵。幹に刻まれた紋様は――":"神木之画。树干上刻着的纹样——","桃太郎の額に、ときどき浮かぶ痣と同じ形をしていた。":"与桃太郎额头上偶尔浮现的印记形状相同。","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"神社深处，一头异形野兽正在肆虐。旁边，一只受伤的雉鸡蜷缩着。","……にげて……ください……その獣は、もう……":"……快逃……那头野兽，已经……","でけえ猪だ……来るぞ！":"好大的野猪……来了！","穢れ猪は、静かに崩れ落ちた。":"秽猪静静地倒下了。","雉":"雉鸡","……助かりました。わたしはキリ。この社の神木に仕える者です":"……得救了。我叫雾。是侍奉这座神社神木的人。","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"这头野兽，原本是守护神社的普通野猪。人类砍伐了神木，土地的灵力就紊乱了。","鬼の仕業じゃないのか？":"不是鬼干的吗？","この世の災いが、すべて鬼の仕業とは限りません":"这世上的灾祸，并不全是鬼造成的。","……あなたは、鬼ヶ島へ行くのですね":"……你们要去鬼岛吧。","ああ。鬼を退治しに":"嗯。去消灭鬼。","キリは何かを言いかけて――口をつぐんだ。":"雾欲言又止——闭上了嘴。","わたしも、お供させてください。……島に、確かめたいことがあるのです":"请让我也同行吧。……在岛上，有件事我必须确认。","キリが仲間になった！":"雾加入了队伍！","夜の野営。":"夜晚的营地。","なあ、桃太郎。なんで俺たちに団子をくれた？":"喂，桃太郎。你为什么给我们团子？","仲間になってほしかったから":"因为希望你们成为我的同伴。","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"用食物收买同伴，真是个狡猾的勇者大人。","違うって！":"才不是呢！","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"……据说吉备团子，曾是人与鬼结束争斗时一起分享的食物。","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"不是为了让一方服从——而是对等之人之间约定的信物。","……約束、か":"……约定吗。","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"雾一直凝视着桃太郎的侧脸，什么也没说。","鬼の涙":"鬼之泪","潮哭きの港。":"潮哭之港。","鬼は人を食うんだ！ 生かしておくな！":"鬼会吃人！不能让它活着！","檻の中で、小さな鬼の子が石を投げつけられている。":"笼子里，一个小小的鬼孩子正被人扔石头。","……鬼か。いい気味だ":"……是鬼啊。活该。","桃太郎は、黙って通り過ぎようとした――":"桃太郎正想默默走过——","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"鬼孩子用人类听不懂的语言，小声嘟囔着。","鬼の子":"鬼孩子","……おかあさん……":"……妈妈……","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"……不知为何，桃太郎听懂了那句话。他停下了脚步。","……サスケ。あの檻、開けられるか":"……佐助。那个笼子，你能打开吗。","鍵がありゃな。番所――右端の建物にあるはずだ":"有钥匙就行。应该在番所——最右边的建筑里。","おい、本気か！？":"喂，你是认真的吗！？","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"要住一晚吗？不收钱哦。就算是这种港口，也要善待旅人嘛。","休む":"休息","やめておく":"算了","ぐっすり眠った。みんな元気になった！":"睡得很香。大家都恢复了精神！","番所はもぬけの殻だ。":"番所里空无一人。","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"番所里没有人。桌上有钥匙串……还有一本厚厚的账簿。","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"我看看……“鬼孩子一只。展览后出售”","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"还有这个“送往鬼岛，刀一百把”——是走私武器。港口的老大，黑绳干的好事。","人間が……鬼に、武器を……？":"人类……把武器……给鬼……？","番所の鍵束を手に入れた。":"得到了番所的钥匙串。","檻には頑丈な錠がかかっている。":"笼子上挂着一把结实的锁。","ガチャリ、と錠が外れた。":"咔嚓，锁开了。","……え？":"……咦？","おいおい。オレの商品に、何をしてる":"喂喂。你对我的商品干什么呢。","鬼を殺して何が悪い！ 奴らは人間じゃない！":"杀鬼有什么错！那些家伙不是人！","……それでも、子供に罪はない！":"……即便如此，孩子是无罪的！","お前だって鬼を殺してきたんだろうが！ 何が違う！":"你不也一直在杀鬼吗！有什么不同！","野郎ども、まとめて海に沈めろ！":"小的们，把他们统统沉到海里！","黒縄たちは、港から逃げ去った。":"黑绳一伙逃离了港口。","……おい。鬼をかばうのか？":"……喂。你要袒护鬼吗？","あいつらが俺の村に何をしたか、知ってるだろ！":"你知道那些家伙对我的村子做了什么吧！","でも……":"可是……","お前は鬼を倒すために旅に出たんじゃなかったのか！":"你不是为了打倒鬼才踏上旅途的吗！","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"小驹扭过头去。同伴之间，第一次出现了裂痕。","お兄ちゃん……鬼なのに、どうして角がないの？":"哥哥……你明明是鬼，为什么没有角呢？","……何を言ってる？":"……你在说什么？","だって、お兄ちゃんから、お母さんと同じ匂いがする":"因为，哥哥身上有和妈妈一样的味道。","キリは、黙って顔を伏せた。":"雾默默低下了头。","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"……好了。这孩子我会送到岛上的熟人那里。港口边的栈桥有艘旧船。","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"那是以前鬼和人类做买卖时用的船。用它就能渡到鬼岛。","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"……去鬼岛？你疯了吗。……也罢，这艘船也很久没出海了。","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"载着鬼孩子，船划向了灰色的大海。","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"这艘船啊，直到百年前都在运送鬼和人类的货物。米、药、祭典的面具……","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"人和鬼都会饿肚子嘛。做买卖跟有没有角没关系。","……お兄ちゃん。島に帰ったら、お母さんに会える？":"……哥哥。回到岛上的话，我能见到妈妈吗？","……ああ。きっと会えるさ":"……嗯。一定能见到的。","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"小驹默默望着大海。雾从桃太郎的侧脸移开了视线。","やがて霧の向こうに、黒い島影が浮かび上がる。":"不久，雾的另一边，浮现出黑色的岛影。","見えたぞ。……鬼ヶ島だ":"看到了。……是鬼岛。","（……どうか、まだ。もう少しだけ――）":"（……求求你，还不要。再多一会儿就好——）","鬼の血":"鬼之血","鬼ヶ島。":"鬼岛。","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"展现在眼前的不是凶恶群鬼的乐园——而是荒芜的土地，和饥饿的人们。","……ここが、鬼ヶ島？":"……这里，就是鬼岛？","人間が追い出した連中の、行き着いた先さ":"被人类赶走的家伙们，最后的归宿。","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"孩子我已经托付给熟人了。……小心点。岛上也有痛恨人类的激进分子。","おなか、すいた……":"肚子，好饿……","きびだんごをあげる":"给吉备团子","あげない":"不给","鬼の子は、うれしそうに団子をほおばった。":"鬼孩子开心地大口吃着团子。","……ありがとう。人間にも、あなたのような人がいるのね":"……谢谢你。原来人类之中，也有像你这样的人。","止まれ、人間ども":"站住，人类们。","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"吾乃青鬼将军苍牙。……人类让我们痛苦了百年。事到如今还要我们原谅吗！","だからって、何も知らない村人を殺していいわけじゃない！":"就算如此，也不能杀害什么都不知道的村民！","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"那我问你。被你杀死的我们的同伴，又知道些什么？","……ぐ……見事だ……":"……呜……了不起……","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"你在桃之里斩杀的赤鬼……加罗他……一直在寻找十六年前消失的王子……","王子……？":"王子……？","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"袭击村子，是加罗的罪……但是，那家伙……一直都……","蒼牙は、それ以上語らなかった。":"苍牙再没有说下去。","懐のお守りが、ずしりと重く感じられた。":"怀里的护身符，突然变得沉甸甸的。","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"血桃之城。王座深处，有一棵结着血红果实的巨树的气息。","……よくぞ戻った。我が息子よ":"……你终于回来了。我的儿子。","……何を言っている？":"……你在说什么？","お前は鬼だ。わしと、亡き妻の子だ":"你是鬼。是我和亡妻的孩子。","（暗闇。水の音。……桃の中で、眠っている）":"（黑暗。水声。……在桃子中，沉睡着）","母の声":"母亲的声音","この子だけは、憎しみを知らずに育ってほしい":"至少这个孩子，希望他能不知憎恨地长大。","桃太郎の額から――一本の角が生えた。":"桃太郎的额头上——长出了一只角。","……嘘だろ。桃太郎……":"……骗人的吧。桃太郎……","……俺が、鬼？":"……我，是鬼？","……申し訳ありません。わたしは、知っていました":"……非常抱歉。我早就知道了。","お前も……ずっと、俺を騙していたのか……！":"连你也……一直在骗我吗……！","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"你在人类的世界长大，不知道鬼的苦难。但是，血是不会说谎的。","わしと共に来い。人間どもに、百年の報いを":"跟我来吧。让人类偿还百年的报应。","血が何だ！ 俺を育ててくれたのは、人間だ！":"血算什么！养育我的，是人类！","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"那么，那些人类若知道你是鬼，还会一样爱你吗？","――「鬼斬り」が、封じられた。":"——“斩鬼”被封印了。","……強く、なったな……":"……你，变强了啊……","これを持っていけ。お前の母の……形見だ":"拿着这个。是你母亲的……遗物。","「桃の勾玉」を受け取った。":"收到了“桃之勾玉”。","その瞬間――":"就在那一瞬间——","…………ヨウヤク……":"…………终于……","いけない……！ 地下の封印が……！":"不好……！地下的封印……！","禍津神……！ ぐっ……行け、息子よ……！":"祸津……！呃……走吧，我的儿子……！","崩れゆく城の底から、黒い瘴気が噴き出した。":"从崩塌之城的底部，喷涌出漆黑的瘴气。","桃の花が散るとき":"桃花凋零之时","血桃の根――鬼門の深淵。":"血桃之根——鬼门深渊。","人は鬼を憎み、鬼は人を憎む。……わたしは、お前たちが生み出したものだ":"人憎恨鬼，鬼憎恨人。……我，就是你们创造出来的东西。","禍津神……百年前の戦で死んだ人と鬼、双方の憎しみが形を成したもの":"祸津……百年前战争中死去的人与鬼，双方的憎恨所化成的存在。","その力は、人と鬼が憎み合うほど、強くなります":"人与鬼越是互相憎恨，它的力量就越强。","……桃太郎":"……桃太郎。","俺は鬼が憎い。今だって許せねえ":"我恨鬼。现在也无法原谅。","……そうだろうな":"……我想也是。","でも、お前が鬼だからって、俺を助けてくれたことまで嘘にはならねえ":"但是，就算你是鬼，你救过我这件事也不会变成假的。","コマ……":"小驹……","だから、お前を守る。俺が決めたんだ":"所以，我会保护你。这是我自己决定的。","俺は最初からどっちでもいいけどな。団子くれた奴が仲間だろ？":"我一开始就无所谓啦。给我团子的人就是同伴，对吧？","わたしも、今度こそ自分の意志で、あなたと共に戦います":"我也是，这一次凭自己的意志，与你并肩作战。","……みんな。ありがとう":"……大家。谢谢你们。","桃太郎は、新たな力「守護」に目覚めた！":"桃太郎觉醒了新的力量“守护”！","――奪うためではなく、守るために。":"——不是为了夺取，而是为了守护。","来たか。鬼の子よ":"你来了啊。鬼之子。","禍津神は、消えなかった。":"祸津没有消失。","桃太郎の力によって、ふたたび深淵に封じられた。":"凭借桃太郎的力量，再次被封印于深渊。","争いがある限り――いつかまた、目覚めるかもしれない。":"只要争斗仍在——总有一天，它或许会再次苏醒。","酒呑童子は、崩れゆく城とともに命を落とした。":"酒吞童子随着崩塌的城池一同陨落。","鬼ヶ島の人々は、新たな指導者を選んだ。":"鬼岛的人们，选出了新的领袖。","……あれは……桃太郎か？":"……那是……桃太郎吗？","角が……生えてる……" す":"……得救了。我叫霧。是侍奉這座神社神木的人。","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"這頭野獸，原本是守護神社的普通野豬。人類砍伐了神木，土地的靈力就紊亂了。","鬼の仕業じゃないのか？":"不是鬼乾的嗎？","この世の災いが、すべて鬼の仕業とは限りません":"這世上的災禍，並不全是鬼造成的。","……あなたは、鬼ヶ島へ行くのですね":"……你們要去鬼島吧。","ああ。鬼を退治しに":"嗯。去消滅鬼。","キリは何かを言いかけて――口をつぐんだ。":"霧欲言又止——閉上了嘴。","わたしも、お供させてください。……島に、確かめたいことがあるのです":"請讓我也同行吧。……在島上，有件事我必須確認。","キリが仲間になった！":"霧加入了隊伍！","夜の野営。":"夜晚的營地。","なあ、桃太郎。なんで俺たちに団子をくれた？":"喂，桃太郎。你為什麼給我們糰子？","仲間になってほしかったから":"因為希望你們成為我的同伴。","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"用食物收買同伴，真是個狡猾的勇者大人。","違うって！":"才不是呢！","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"……據說吉備糰子，曾是人與鬼結束爭鬥時一起分享的食物。","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"不是為了讓一方服從——而是對等之人之間約定的信物。","……約束、か":"……約定嗎。","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"霧一直凝視著桃太郎的側臉，什麼也沒說。","鬼の涙":"鬼之淚","潮哭きの港。":"潮哭之港。","鬼は人を食うんだ！ 生かしておくな！":"鬼會吃人！不能讓它活著！","檻の中で、小さな鬼の子が石を投げつけられている。":"籠子裡，一個小小的鬼孩子正被人扔石頭。","……鬼か。いい気味だ":"……是鬼啊。活該。","桃太郎は、黙って通り過ぎようとした――":"桃太郎正想默默走過——","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"鬼孩子用人類聽不懂的語言，小聲嘟囔著。","鬼の子":"鬼孩子","……おかあさん……":"……媽媽……","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"……不知為何，桃太郎聽懂了那句話。他停下了腳步。","……サスケ。あの檻、開けられるか":"……佐助。那個籠子，你能開啟嗎。","鍵がありゃな。番所――右端の建物にあるはずだ":"有鑰匙就行。應該在番所——最右邊的建築裡。","おい、本気か！？":"喂，你是認真的嗎！？","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"要住一晚嗎？不收錢哦。就算是這種港口，也要善待旅人嘛。","休む":"休息","やめておく":"算了","ぐっすり眠った。みんな元気になった！":"睡得很香。大家都恢復了精神！","番所はもぬけの殻だ。":"番所裡空無一人。","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"番所裡沒有人。桌上有鑰匙串……還有一本厚厚的賬簿。","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"我看看……「鬼孩子一隻。展覽後出售」","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"還有這個「送往鬼島，刀一百把」——是走私武器。港口的老大，黑繩乾的好事。","人間が……鬼に、武器を……？":"人類……把武器……給鬼……？","番所の鍵束を手に入れた。":"得到了番所的鑰匙串。","檻には頑丈な錠がかかっている。":"籠子上掛著一把結實的鎖。","ガチャリ、と錠が外れた。":"咔嚓，鎖開了。","……え？":"……咦？","おいおい。オレの商品に、何をしてる":"喂喂。你對我的商品幹什麼呢。","鬼を殺して何が悪い！ 奴らは人間じゃない！":"殺鬼有什麼錯！那些傢伙不是人！","……それでも、子供に罪はない！":"……即便如此，孩子是無罪的！","お前だって鬼を殺してきたんだろうが！ 何が違う！":"你不也一直在殺鬼嗎！有什麼不同！","野郎ども、まとめて海に沈めろ！":"小的們，把他們統統沉到海里！","黒縄たちは、港から逃げ去った。":"黑繩一夥逃離了港口。","……おい。鬼をかばうのか？":"……喂。你要袒護鬼嗎？","あいつらが俺の村に何をしたか、知ってるだろ！":"你知道那些傢伙對我的村子做了什麼吧！","でも……":"可是……","お前は鬼を倒すために旅に出たんじゃなかったのか！":"你不是為了打倒鬼才踏上旅途的嗎！","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"小駒扭過頭去。同伴之間，第一次出現了裂痕。","お兄ちゃん……鬼なのに、どうして角がないの？":"哥哥……你明明是鬼，為什麼沒有角呢？","……何を言ってる？":"……你在說什麼？","だって、お兄ちゃんから、お母さんと同じ匂いがする":"因為，哥哥身上有和媽媽一樣的味道。","キリは、黙って顔を伏せた。":"霧默默低下了頭。","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"……好了。這孩子我會送到島上的熟人那裡。港口邊的棧橋有艘舊船。","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"那是以前鬼和人類做買賣時用的船。用它就能渡到鬼島。","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"……去鬼島？你瘋了嗎。……也罷，這艘船也很久沒出海了。","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"載著鬼孩子，船划向了灰色的大海。","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"這艘船啊，直到百年前都在運送鬼和人類的貨物。米、藥、祭典的面具……","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"人和鬼都會餓肚子嘛。做買賣跟有沒有角沒關係。","……お兄ちゃん。島に帰ったら、お母さんに会える？":"……哥哥。回到島上的話，我能見到媽媽嗎？","……ああ。きっと会えるさ":"……嗯。一定能見到的。","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"小駒默默望著大海。霧從桃太郎的側臉移開了視線。","やがて霧の向こうに、黒い島影が浮かび上がる。":"不久，霧的另一邊，浮現出黑色的島影。","見えたぞ。……鬼ヶ島だ":"看到了。……是鬼島。","（……どうか、まだ。もう少しだけ――）":"（……求求你，還不要。再多一會兒就好——）","鬼の血":"鬼之血","鬼ヶ島。":"鬼島。","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"展現在眼前的不是兇惡群鬼的樂園——而是荒蕪的土地，和飢餓的人們。","……ここが、鬼ヶ島？":"……這裡，就是鬼島？","人間が追い出した連中の、行き着いた先さ":"被人類趕走的傢伙們，最後的歸宿。","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"孩子我已經託付給熟人了。……小心點。島上也有痛恨人類的激進分子。","おなか、すいた……":"肚子，好餓……","きびだんごをあげる":"給吉備糰子","あげない":"不給","鬼の子は、うれしそうに団子をほおばった。":"鬼孩子開心地大口吃著糰子。","……ありがとう。人間にも、あなたのような人がいるのね":"……謝謝你。原來人類之中，也有像你這樣的人。","止まれ、人間ども":"站住，人類們。","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"吾乃青鬼將軍蒼牙。……人類讓我們痛苦了百年。事到如今還要我們原諒嗎！","だからって、何も知らない村人を殺していいわけじゃない！":"就算如此，也不能殺害什麼都不知道的村民！","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"那我問你。被你殺死的我們的同伴，又知道些什麼？","……ぐ……見事だ……":"……嗚……了不起……","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"你在桃之裡斬殺的赤鬼……加羅他……一直在尋找十六年前消失的王子……","王子……？":"王子……？","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"襲擊村子，是加羅的罪……但是，那傢伙……一直都……","蒼牙は、それ以上語らなかった。":"蒼牙再沒有說下去。","懐のお守りが、ずしりと重く感じられた。":"懷裡的護身符，突然變得沉甸甸的。","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"血桃之城。王座深處，有一棵結著血紅果實的巨樹的氣息。","……よくぞ戻った。我が息子よ":"……你終於回來了。我的兒子。","……何を言っている？":"……你在說什麼？","お前は鬼だ。わしと、亡き妻の子だ":"你是鬼。是我和亡妻的孩子。","（暗闇。水の音。……桃の中で、眠っている）":"（黑暗。水聲。……在桃子中，沉睡著）","母の声":"母親的聲音","この子だけは、憎しみを知らずに育ってほしい":"至少這個孩子，希望他能不知憎恨地長大。","桃太郎の額から――一本の角が生えた。":"桃太郎的額頭上——長出了一隻角。","……嘘だろ。桃太郎……":"……騙人的吧。桃太郎……","……俺が、鬼？":"……我，是鬼？","……申し訳ありません。わたしは、知っていました":"……非常抱歉。我早就知道了。","お前も……ずっと、俺を騙していたのか……！":"連你也……一直在騙我嗎……！","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"你在人類的世界長大，不知道鬼的苦難。但是，血是不會說謊的。","わしと共に来い。人間どもに、百年の報いを":"跟我來吧。讓人類償還百年的報應。","血が何だ！ 俺を育ててくれたのは、人間だ！":"血算什麼！養育我的，是人類！","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"那麼，那些人類若知道你是鬼，還會一樣愛你嗎？","――「鬼斬り」が、封じられた。":"——「斬鬼」被封印了。","……強く、なったな……":"……你，變強了啊……","これを持っていけ。お前の母の……形見だ":"拿著這個。是你母親的……遺物。","「桃の勾玉」を受け取った。":"收到了「桃之勾玉」。","その瞬間――":"就在那一瞬間——","…………ヨウヤク……":"…………終於……","いけない……！ 地下の封印が……！":"不好……！地下的封印……！","禍津神……！ ぐっ……行け、息子よ……！":"禍津……！呃……走吧，我的兒子……！","崩れゆく城の底から、黒い瘴気が噴き出した。":"從崩塌之城的底部，噴湧出漆黑的瘴氣。","桃の花が散るとき":"桃花凋零之時","血桃の根――鬼門の深淵。":"血桃之根——鬼門深淵。","人は鬼を憎み、鬼は人を憎む。……わたしは、お前たちが生み出したものだ":"人憎恨鬼，鬼憎恨人。……我，就是你們創造出來的東西。","禍津神……百年前の戦で死んだ人と鬼、双方の憎しみが形を成したもの":"禍津……百年前戰爭中死去的人與鬼，雙方的憎恨所化成的存在。","その力は、人と鬼が憎み合うほど、強くなります":"人與鬼越是互相憎恨，它的力量就越強。","……桃太郎":"……桃太郎。","俺は鬼が憎い。今だって許せねえ":"我恨鬼。現在也無法原諒。","……そうだろうな":"……我想也是。","でも、お前が鬼だからって、俺を助けてくれたことまで嘘にはならねえ":"但是，就算你是鬼，你救過我這件事也不會變成假的。","コマ……":"小駒……","だから、お前を守る。俺が決めたんだ":"所以，我會保護你。這是我自己決定的。","俺は最初からどっちでもいいけどな。団子くれた奴が仲間だろ？":"我一開始就無所謂啦。給我糰子的人就是同伴，對吧？","わたしも、今度こそ自分の意志で、あなたと共に戦います":"我也是，這一次憑自己的意志，與你並肩作戰。","……みんな。ありがとう":"……大家。謝謝你們。","桃太郎は、新たな力「守護」に目覚めた！":"桃太郎覺醒了新的力量「守護」！","――奪うためではなく、守るために。":"——不是為了奪取，而是為了守護。","来たか。鬼の子よ":"你來了啊。鬼之子。","禍津神は、消えなかった。":"禍津沒有消失。","桃太郎の力によって、ふたたび深淵に封じられた。":"憑藉桃太郎的力量，再次被封印於深淵。","争いがある限り――いつかまた、目覚めるかもしれない。":"只要爭鬥仍在——總有一天，它或許會再次甦醒。","酒呑童子は、崩れゆく城とともに命を落とした。":"酒吞童子隨著崩塌的城池一同隕落。","鬼ヶ島の人々は、新たな指導者を選んだ。":"鬼島的人們，選出了新的領袖。","……あれは……桃太郎か？":"……那是……桃太郎嗎？","角が……生えてる……":"長、長著角……","村人たちは、おびえたように距離を取った。":"村民們像是害怕一般，拉開了距離。","おかえり、桃太郎":"歡迎回來，桃太郎。","……俺は、鬼なんだ":"……我，是鬼。","知っておったよ":"我們早就知道了。","桃から生まれようが、鬼であろうが……お前は、わしらの孫じゃ":"不管是從桃子裡生出來的，還是鬼……你都是我們的孫子。","桃太郎は――初めて、泣いた。":"桃太郎——第一次，哭了。","しばらくして、桃太郎はふたたび旅に出た。":"不久之後，桃太郎再次踏上了旅途。","今度は鬼を退治するためではなく――人間と鬼が、共に暮らせる場所を探すために。":"這一次不是為了消滅鬼——而是為了尋找人與鬼能夠共同生活的地方。","鬼とは、誰のことだったのだろう。":"所謂的鬼，究竟是指誰呢。","― FIN ―":"― 完 ―","桃太郎 ― 鬼哭島 ―":"桃太郎 ― 鬼哭島 ―","禍津神・常闇":"禍津·常暗","「生まれが自分を決めるのではない。」":"「決定你是誰的，不是出身。」","「何を選び、どう生きる 는 거냐, 애송이…… 그 눈, 어디선가……","オオオオ……！ 鬼哭――！！":"오오오오……! 귀곡――!!","酒呑童子は「血桃の王」へと姿を変えた！":"슈텐도지는 \"혈도의 왕\"으로 모습을 바꿨다!","お前の母は、人と鬼が手を取り合えると信じていた":"네 어미는 인간과 오니가 손을 잡을 수 있다고 믿었다.","わしは……そんなもの、信じられなかった":"나는…… 그런 것을 믿을 수 없었다.","……ククク。まだだ。まだ、終わらぬ":"……크크크. 아직이다. 아직, 끝나지 않았다.","禍津神の姿がゆらぎ――桃太郎そっくりの姿へと変わった。":"마가쓰의 모습이 일렁이더니―― 모모타로와 똑같은 모습으로 변했다.","頭には巨大な角。手には、血に染まった刀。":"머리에는 거대한 뿔. 손에는 피로 물든 칼.","お前も鬼を殺した。お前もまた、わたしの一部だ":"너도 오니를 죽였다. 너 또한 나의 일부다.","……そうだ。俺は間違えた":"……그래. 나는 잘못했어.","ならば、なぜ抗う？":"그렇다면 어째서 저항하지?","間違えたからこそ……これ以上、間違えたくないんだ！":"잘못했기 때문에…… 더는 잘못하고 싶지 않아!","桃太郎！ 道は俺たちが開く！":"모모타로! 길은 우리가 연다!","団子の分は、きっちり働くぜ！":"경단 값은 확실히 하겠어!","今度こそ、わたしの意志で！":"이번에야말로, 나의 의지로!","仲間たちの想いが、桃太郎の刀に宿る――":"동료들의 마음이 모모타로의 칼에 깃든다――","（「天桃一閃」を選べ）":"(\"천도일섬\"을 선택하라)","……刀が、抜けない":"……칼이, 뽑히지 않아","MPがたりない":"MP가 부족하다","どうぐがない":"도구가 없다","たたかいに勝った！":"싸움에서 이겼다!","きびだんごを 1つ 見つけた":"수수경단을 1개 찾았다","時間 {t}":"시간 {t}","攻{a}　防{d}　術{m}　速{s}":"공{a}　방{d}　술{m}　속{s}","オート記録は章のはじまりに残ります":"자동 기록은 각 장의 시작에 남습니다","音が出ます（画面かボタンをタップ）":"소리가 납니다 (화면이나 버튼을 탭)","はじめから":"처음부터","つづきから":"이어서","全滅した……":"전멸했다……","もう一度たたかう":"다시 싸운다","タイトルへもどる":"타이틀로 돌아간다","？？？":"???","どうか……この子だけは……":"제발…… 이 아이만은……","十六年後――":"16년 후――","桃の子":"복숭아의 아이","カン、カン――木刀の打ち合う音が、桃の里に響く。":"탁, 탁―― 목검이 부딪치는 소리가 복숭아 마을에 울린다.","桃太郎。刀は人を守るために振るうものじゃ":"모모타로. 칼은 사람을 지키기 위해 휘두르는 것이란다.","わかってるよ。鬼が来たら、俺がみんなを守る":"알아요. 오니가 오면 내가 모두를 지킬게요.","……そうか":"……그러냐.","おじいさんは、どこか悲しそうな顔をした。":"할아버지는 어딘가 슬픈 얼굴을 했다.","今日はここまでじゃ。日が暮れたら、家に戻っておいで":"오늘은 여기까지다. 해가 지면 집으로 돌아오거라.","（村を歩いてみよう。左上の家に入ると夜になる）":"(마을을 걸어 보자. 왼쪽 위의 집에 들어가면 밤이 된다)","おじいさんとおばあさんの家だ。……今は、行かなくては。":"할아버지와 할머니의 집이다. ……지금은 가야 해.","村の蔵。勾玉が祀られていた台座は、からっぽだ。":"마을 창고. 곡옥을 모시던 받침대가 텅 비어 있다.","村の蔵。大事な「桃の勾玉」が祀られている。":"마을 창고. 소중한 \"복숭아 곡옥\"이 모셔져 있다.","……鬼はまだ村の中だ。":"……오니가 아직 마을 안에 있다.","（日が暮れたら家に戻ろう。旅に出るのはまだ早い）":"(해가 지면 집으로 돌아가자. 여행을 떠나기엔 아직 이르다)","その夜――":"그날 밤――","村人":"마을 사람","鬼だ！ 鬼が出たぞォ！":"오니다! 오니가 나타났다!","……生きて、おられたのか……":"……살아, 계셨군요……","ガラは崩れ落ちた。その懐から、古いお守りがこぼれ落ちる。":"가라가 쓰러졌다. 그 품에서 낡은 부적이 떨어졌다.","お守りには、赤子を抱いた角のある女の姿が描かれていた。":"부적에는 아기를 안은 뿔 달린 여인이 그려져 있었다.","古いお守りを拾った。":"낡은 부적을 주웠다.","……なんだ、これ":"……뭐지, 이건","腕の傷から流れた血が――一瞬だけ、黒く光った。":"팔의 상처에서 흐른 피가―― 한순간, 검게 빛났다.","……？":"……?","ガラ様が……！ 引け、引けェ！":"가라 님이……! 후퇴, 후퇴하라!","たいへんだ！ 蔵の「桃の勾玉」が盗まれた！":"큰일이다! 창고의 \"복숭아 곡옥\"을 도둑맞았다!","じいちゃん、俺、鬼ヶ島に行く。勾玉を取り返して、鬼を退治してくる":"할아버지, 나 오니가시마에 갈게. 곡옥을 되찾고 오니를 물리치고 올게.","じいちゃん？":"할아버지?","……お前が決めたことなら、止めはせん":"……네가 정한 일이라면 말리지 않으마.","おじいさんは、それ以上なにも言わなかった。":"할아버지는 더 이상 아무 말도 하지 않았다.","夜が明けた。":"날이 밝았다.","これを持っておいき。きびだんごじゃ":"이걸 가져가렴. 수수경단이란다.","きびだんごを 5つ 受け取った！":"수수경단을 5개 받았다!","「桃の雫」も 1つ 受け取った！":"\"복숭아 이슬\"도 1개 받았다!","どんな相手でも、腹が減るのは同じじゃ。困っている者がいたら、分けてやりなさい":"상대가 누구든 배고픈 건 똑같단다. 곤란한 이가 있으면 나눠 주렴.","うん。……いってきます！":"응. ……다녀오겠습니다!","（MENUボタンでセーブ・どうぐが使える。村の南から旅立とう）":"(MENU 버튼으로 저장·도구 사용을 할 수 있다. 마을 남쪽에서 출발하자)","血染めの山道。鬼たちの足跡が、峠の向こうへ続いている。":"피로 물든 산길. 오니들의 발자국이 고개 너머로 이어져 있다.","……グルルル。止まれ。お前の服、鬼の血の匂いがする":"……으르르. 멈춰. 네 옷에서 오니의 피 냄새가 나.","ゆうべ、村を襲った鬼を倒したんだ。これから鬼ヶ島へ行く":"어젯밤 마을을 습격한 오니를 쓰러뜨렸어. 지금부터 오니가시마로 가.","犬":"개","鬼ヶ島……！ 俺はコマ。故郷は鬼に焼かれた。親も、兄弟も":"오니가시마……! 난 코마. 고향은 오니에게 불탔어. 부모도, 형제도.","鬼を退治するってんなら、俺も連れていけ":"오니를 물리칠 거라면 나도 데려가.","桃太郎は、きびだんごを一つ差し出した。":"모모타로는 수수경단을 하나 내밀었다.","……うまい。約束だ。鬼を、一匹残らず倒すぞ":"……맛있군. 약속이다. 오니를 하나도 남김없이 쓰러뜨리자.","コマが仲間になった！":"코마가 동료가 되었다!","獣たちの誓い":"짐승들의 맹세","餓鬼の森。昼なお暗い木々の間に、飢えた獣の気配がする。":"아귀의 숲. 낮에도 어두운 나무 사이로 굶주린 짐승의 기척이 느껴진다.","あっ！ きびだんごが！":"앗! 수수경단이!","へへっ、いただき！":"헤헷, 잘 먹을게!","猿め……！ 匂いは西だ。追うぞ！":"원숭이 녀석……! 냄새는 서쪽이야. 쫓아가자!","崩れた廃村。痩せた子供たちに、さっきの猿が団子を分け与えていた。":"무너진 폐촌. 아까 그 원숭이가 야윈 아이들에게 경단을 나눠 주고 있었다.","おさるのおにいちゃん、ありがとう……":"원숭이 형, 고마워……","お前……それ、俺たちの団子だろ":"너…… 그거, 우리 경단이잖아.","猿":"원숭이","盗みは悪いことだって？ じゃあ、腹を空かせて死ぬのは正しいことか？":"도둑질은 나쁜 짓이라고? 그럼 배고파서 죽는 건 옳은 거야?","正しいことばっか言う奴は、だいたい腹が減ってねえんだよ":"옳은 소리만 하는 놈들은 대개 배가 안 고프더라고.","きびだんごを分ける":"수수경단을 나눈다","黙って見ている":"잠자코 지켜본다","桃太郎は、残りのきびだんごを子供たちにも分けた。":"모모타로는 남은 수수경단을 아이들에게도 나눠 주었다.","これ……川でひろったの。おにいちゃんにあげる":"이거…… 강에서 주웠어. 형한테 줄게.","「桃の雫」をもらった！":"\"복숭아 이슬\"을 받았다!","……ふん。説教しないだけマシか":"……흥. 설교 안 하는 것만도 낫군.","しばらくして、桃太郎は黙ってきびだんごを差し出した。":"잠시 후, 모모타로는 말없이 수수경단을 내밀었다.","……へえ。変わった勇者様だ":"……헤에. 별난 용사님이네.","気に入った。俺はサスケ。鬼ヶ島に行くんだろ？ あそこにはちょっとした「つて」があってな":"마음에 들었어. 난 사스케. 오니가시마에 간다며? 거기엔 좀 \"연줄\"이 있거든.","……信用できるのか、こいつ":"……믿어도 되는 거냐, 이 녀석.","団子の分だけは働くさ":"경단 값만큼은 일할게.","サスケが仲間になった！":"사스케가 동료가 되었다!","待て。まずはあの猿だ。団子を取り返すぞ":"기다려. 먼저 그 원숭이다. 경단을 되찾자.","朽ちた神社。かつて人間が「鬼」を神として祀っていたという、古い社だ。":"무너진 신사. 옛날 사람들이 \"오니\"를 신으로 모셨다는 오래된 사당이다.","色あせた壁画。鬼と人間が、同じ食卓を囲んでいる。":"빛바랜 벽화. 오니와 인간이 같은 밥상에 둘러앉아 있다.","……昔は、こうだったって話さ":"……옛날엔 이랬다는 얘기야.","神木の絵。幹に刻まれた紋様は――":"신목의 그림. 줄기에 새겨진 문양은――","桃太郎の額に、ときどき浮かぶ痣と同じ形をしていた。":"모모타로의 이마에 가끔 떠오르는 멍과 같은 모양이었다.","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"사당 안쪽에서 이형의 짐승이 날뛰고 있다. 곁에는 상처 입은 꿩이 웅크리고 있었다.","……にげて……ください……その獣は、もう……":"……도망…… 치세요…… 그 짐승은, 이미……","でけえ猪だ……来るぞ！":"엄청 큰 멧돼지다…… 온다!","穢れ猪は、静かに崩れ落ちた。":"더럽혀진 멧돼지는 조용히 쓰러졌다.","雉":"꿩","……助かりました。わたしはキリ。この社の神木に仕える者です":"……살았습니다. 저는 키리. 이 사당의 신목을 모시는 자입니다.","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"이 짐승은 원래 신사를 지키던 평범한 멧돼지였습니다. 인간이 신목을 베어 땅의 영력이 흐트러진 것입니다.","鬼の仕業じゃないのか？":"오니 짓이 아니야?","この世の災いが、すべて鬼の仕業とは限りません":"이 세상의 재앙이 모두 오니의 짓이라고는 할 수 없습니다.","……あなたは、鬼ヶ島へ行くのですね":"……당신은 오니가시마로 가는군요.","ああ。鬼を退治しに":"응. 오니를 물리치러.","キリは何かを言いかけて――口をつぐんだ。":"키리는 무언가 말하려다―― 입을 다물었다.","わたしも、お供させてください。……島に、確かめたいことがあるのです":"저도 함께 가게 해 주세요. ……섬에서 확인하고 싶은 일이 있습니다.","キリが仲間になった！":"키리가 동료가 되었다!","夜の野営。":"밤의 야영.","なあ、桃太郎。なんで俺たちに団子をくれた？":"이봐, 모모타로. 왜 우리에게 경단을 준 거야?","仲間になってほしかったから":"동료가 되어 주길 바랐으니까.","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"먹을 걸로 동료를 사다니, 꽤 교활한 용사님이네.","違うって！":"아니라니까!","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"……수수경단은 예전에 인간과 오니가 다툼을 끝낼 때 나눠 먹던 음식이었다고 합니다.","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"어느 한쪽이 따르기 위해서가 아니라―― 대등한 자들끼리의 약속의 증표로서.","……約束、か":"……약속, 이라.","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"키리는 모모타로의 옆얼굴을 바라본 채, 아무 말도 하지 않았다.","鬼の涙":"오니의 눈물","潮哭きの港。":"조곡의 항구.","鬼は人を食うんだ！ 生かしておくな！":"오니는 사람을 잡아먹어! 살려 두지 마!","檻の中で、小さな鬼の子が石を投げつけられている。":"우리 안에서 작은 오니 아이가 돌을 맞고 있다.","……鬼か。いい気味だ":"……오니인가. 꼴좋군.","桃太郎は、黙って通り過ぎようとした――":"모모타로는 말없이 지나치려 했다――","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"오니 아이가 인간은 모르는 말로 작게 중얼거렸다.","鬼の子":"오니 아이","……おかあさん……":"……엄마……","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"……어째서인지 모모타로는 그 뜻을 알아들었다. 발걸음이 멈췄다.","……サスケ。あの檻、開けられるか":"……사스케. 저 우리, 열 수 있어?","鍵がありゃな。番所――右端の建物にあるはずだ":"열쇠만 있으면. 초소―― 오른쪽 끝 건물에 있을 거야.","おい、本気か！？":"야, 진심이야!?","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"하룻밤 쉬어 가겠어? 돈은 안 받아. 이런 항구라도 나그네에겐 친절해야지.","休む":"쉰다","やめておく":"그만둔다","ぐっすり眠った。みんな元気になった！":"푹 잤다. 모두 기운을 되찾았다!","番所はもぬけの殻だ。":"초소는 텅 비어 있다.","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"초소엔 아무도 없다. 책상 위에 열쇠 꾸러미와…… 두꺼운 장부가 있다.","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"어디 보자…… \"오니 아이 한 마리. 구경거리로 쓴 뒤 매각\"","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"이쪽은 \"오니가시마행, 칼 백 자루\"―― 무기 밀수야. 항구의 두목 고쿠조의 짓이지.","人間が……鬼に、武器を……？":"인간이…… 오니에게, 무기를……?","番所の鍵束を手に入れた。":"초소의 열쇠 꾸러미를 손에 넣었다.","檻には頑丈な錠がかかっている。":"우리에는 튼튼한 자물쇠가 걸려 있다.","ガチャリ、と錠が外れた。":"철컥, 자물쇠가 풀렸다.","……え？":"……어?","おいおい。オレの商品に、何をしてる":"이봐 이봐. 내 상품에 무슨 짓이냐.","鬼を殺して何が悪い！ 奴らは人間じゃない！":"오니를 죽이는 게 뭐가 나빠! 그놈들은 인간이 아니야!","……それでも、子供に罪はない！":"……그래도 아이에겐 죄가 없어!","お前だって鬼を殺してきたんだろうが！ 何が違う！":"너도 오니를 죽여 왔잖아! 뭐가 다른데!","野郎ども、まとめて海に沈めろ！":"얘들아, 몽땅 바다에 처넣어라!","黒縄たちは、港から逃げ去った。":"고쿠조 일당은 항구에서 달아났다.","……おい。鬼をかばうのか？":"……이봐. 오니를 감싸는 거냐?","あいつらが俺の村に何をしたか、知ってるだろ！":"그놈들이 내 마을에 무슨 짓을 했는지 알잖아!","でも……":"하지만……","お前は鬼を倒すために旅に出たんじゃなかったのか！":"넌 오니를 쓰러뜨리려고 여행을 떠난 거 아니었어!","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"코마는 고개를 돌렸다. 처음으로 동료들 사이에 금이 갔다.","お兄ちゃん……鬼なのに、どうして角がないの？":"형…… 오니인데 왜 뿔이 없어?","……何を言ってる？":"……무슨 소리야?","だって、お兄ちゃんから、お母さんと同じ匂いがする":"왜냐면 형한테서 엄마랑 같은 냄새가 나.","キリは、黙って顔を伏せた。":"키리는 말없이 고개를 숙였다.","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"……자. 꼬마는 내가 섬의 아는 사람에게 데려다줄게. 항구 끝 잔교에 낡은 배가 있어.","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"옛날에 오니와 인간이 교역에 쓰던 배야. 그걸로 오니가시마에 건너갈 수 있어.","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"……오니가시마에? 제정신인가. ……뭐 좋아, 이 배도 오랜만에 바다에 나가고 싶어 했으니.","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"오니 아이를 태우고, 배는 잿빛 바다로 저어 나갔다.","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"이 배는 말이야, 백 년 전까지는 오니와 인간의 짐을 날랐지. 쌀에, 약에, 축제 가면……","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"인간도 오니도 배는 고프니까. 장사에 뿔은 상관없다는 거지.","……お兄ちゃん。島に帰ったら、お母さんに会える？":"……형. 섬에 돌아가면 엄마를 만날 수 있어?","……ああ。きっと会えるさ":"……응. 꼭 만날 수 있을 거야.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"코마는 말없이 바다를 보고 있었다. 키리는 모모타로의 옆얼굴에서 시선을 돌렸다.","やがて霧の向こうに、黒い島影が浮かび上がる。":"이윽고 안개 너머로 검은 섬 그림자가 떠올랐다.","見えたぞ。……鬼ヶ島だ":"보인다. ……오니가시마야.","（……どうか、まだ。もう少しだけ――）":"(……제발, 아직은. 조금만 더――)","鬼の血":"오니의 피","鬼ヶ島。":"오니가시마.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"그곳에 펼쳐진 것은 흉악한 오니들의 낙원이 아니라―― 황폐한 땅과 굶주린 이들이었다.","……ここが、鬼ヶ島？":"……여기가 오니가시마?","人間が追い出した連中の、行き着いた先さ":"인간이 쫓아낸 이들이 흘러온 곳이지.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"꼬마는 아는 사람에게 맡겼어. ……조심해. 섬에는 인간을 증오하는 과격한 무리도 있어.","おなか、すいた……":"배, 고파……","きびだんごをあげる":"수수경단을 준다","あげない":"주지 않는다","鬼の子は、うれしそうに団子をほおばった。":"오니 아이는 기쁜 듯이 경단을 볼이 미어지게 먹었다.","……ありがとう。人間にも、あなたのような人がいるのね":"……고마워요. 인간 중에도 당신 같은 사람이 있군요.","止まれ、人間ども":"멈춰라, 인간들.","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"나는 청귀 장군 소가. ……인간은 백 년이나 우리를 괴롭혔다. 이제 와서 용서하라는 것이냐!","だからって、何も知らない村人を殺していいわけじゃない！":"그렇다고 아무것도 모르는 마을 사람을 죽여도 되는 건 아니야!","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"그럼 묻겠다. 네가 죽인 우리 동료들은 무엇을 알고 있었지?","……ぐ……見事だ……":"……윽…… 훌륭하다……","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"네가 복숭아 마을에서 벤 적귀…… 가라는…… 16년 전에 사라진 왕자를 찾고 있었다……","王子……？":"왕자……?","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"마을을 습격한 것은 가라의 죄다…… 하지만 그 녀석은…… 줄곧……","蒼牙は、それ以上語らなかった。":"소가는 더 이상 말하지 않았다.","懐のお守りが、ずしりと重く感じられた。":"품속의 부적이 묵직하게 느껴졌다.","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"혈도성. 옥좌 안쪽에 피처럼 붉은 열매를 맺은 거목의 기척이 느껴진다.","……よくぞ戻った。我が息子よ":"……잘 돌아왔다. 내 아들아.","……何を言っている？":"……무슨 소리야?","お前は鬼だ。わしと、亡き妻の子だ":"너는 오니다. 나와, 죽은 아내의 자식이다.","（暗闇。水の音。……桃の中で、眠っている）":"(어둠. 물소리. ……복숭아 속에서 잠들어 있다)","母の声":"어머니의 목소리","この子だけは、憎しみを知らずに育ってほしい":"이 아이만은 증오를 모른 채 자라길.","桃太郎の額から――一本の角が生えた。":"모모타로의 이마에서―― 한 개의 뿔이 돋아났다.","……嘘だろ。桃太郎……":"……거짓말이지. 모모타로……","……俺が、鬼？":"……내가, 오니?","……申し訳ありません。わたしは、知っていました":"……죄송합니다. 저는 알고 있었습니다.","お前も……ずっと、俺を騙していたのか……！":"너도…… 줄곧 나를 속이고 있었던 거냐……!","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"너는 인간 세상에서 자라 오니의 고통을 모른다. 하지만 피는 거짓말을 하지 않는다.","わしと共に来い。人間どもに、百年の報いを":"나와 함께 가자. 인간들에게 백 년의 앙갚음을.","血が何だ！ 俺を育ててくれたのは、人間だ！":"피가 뭐라는 거야! 나를 키워 준 건 인간이야!","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"그렇다면 그 인간들은 네가 오니라는 걸 알고도 똑같이 사랑해 줄까?","――「鬼斬り」が、封じられた。":"―― \"오니베기\"가 봉인되었다.","……強く、なったな……":"……강해, 졌구나……","これを持っていけ。お前の母の……形見だ":"이걸 가져가라. 네 어미의…… 유품이다.","「桃の勾玉」を受け取った。":"\"복숭아 곡옥\"을 받았다.","その瞬間――":"그 순간――","…………ヨウヤク……":"…………드디어……","いけない……！ 地下の封印が……！":"안 돼……! 지하의 봉인이……!","禍津神……！ ぐっ……行け、息子よ……！":"마가쓰……! 큭…… 가라, 아들아……!","崩れゆく城の底から、黒い瘴気が噴き出した。":"무너져 가는 성 밑바닥에서 검은 장기가 뿜어져 나왔다.","桃の花が散るとき":"복숭아꽃이 질 때","血桃の根――鬼門の深淵。":"혈도의 뿌리―― 귀문의 심연.","人は鬼を憎み、鬼は人を憎む。……わたしは、お前たちが生み出したものだ":"인간은 오니를 증오하고, 오니는 인간을 증오한다. ……나는 너희가 만들어 낸 것이다.","禍津神……百年前の戦で死んだ人と鬼、双方の憎しみが形を成したもの":"마가쓰…… 백 년 전 전쟁에서 죽은 인간과 오니, 양쪽의 증오가 형태를 이룬 것.","その力は、人と鬼が憎み合うほど、強くなります":"그 힘은 인간과 오니가 서로 증오할수록 강해집니다.","……桃太郎":"……모모타로.","俺は鬼が憎い。今だって許せねえ":"난 오니가 미워. 지금도 용서 못 해.","……そうだろうな":"……그렇겠지.","でも、お前が鬼だからって、俺を助けてくれたことまで嘘にはならねえ":"하지만 네가 오니라고 해서, 날 구해 준 일까지 거짓이 되진 않아.","コマ……":"코마……","だから、お前を守る。俺が決めたんだ":"그러니까 널 지킬 거야. 내가 정한 거야.","俺は最初からどっちでもいいけどな。団子くれた奴が仲間だろ？":"난 처음부터 아무래도 상관없었어. 경단 준 녀석이 동료잖아?","わたしも、今度こそ自分の意志で、あなたと共に戦います":"저도 이번에야말로 제 의지로 당신과 함께 싸우겠습니다.","……みんな。ありがとう":"……모두. 고마워.","桃太郎は、新たな力「守護」に目覚めた！":"모모타로는 새로운 힘 \"수호\"에 눈을 떴다!","――奪うためではなく、守るために。":"―― 빼앗기 위해서가 아니라, 지키기 위해서.","来たか。鬼の子よ":"왔느냐. 오니의 아이여.","禍津神は、消えなかった。":"마가쓰는 사라지지 않았다.","桃太郎の力によって、ふたたび深淵に封じられた。":"모모타로의 힘으로 다시 심연에 봉인되었다.","争いがある限り――いつかまた、目覚めるかもしれない。":"다툼이 있는 한―― 언젠가 다시 깨어날지도 모른다.","酒呑童子は、崩れゆく城とともに命を落とした。":"슈텐도지는 무너져 가는 성과 함께 목숨을 잃었다.","鬼ヶ島の人々は、新たな指導者を選んだ。":"오니가시마 사람들은 새로운 지도자를 뽑았다.","……あれは……桃太郎か？":"……저건…… 모모타로야?","角が……生えてる……":"뿔이…… 났어……","村人たちは、おびえたように距離を取った。":"마을 사람들은 겁먹은 듯 거리를 두었다.","おかえり、桃太郎":"어서 오렴, 모모타로.","……俺は、鬼なんだ":"……나는, 오니야.","知っておったよ":"알고 있었단다.","桃から生まれようが、鬼であろうが……お前は、わしらの孫じゃ":"복숭아에서 태어났든, 오니든…… 너는 우리 손자란다.","桃太郎は――初めて、泣いた。":"모모타로는―― 처음으로 울었다.","しばらくして、桃太郎はふたたび旅に出た。":"얼마 후, 모모타로는 다시 여행을 떠났다.","今度は鬼を退治するためではなく――人間と鬼が、共に暮らせる場所を探すために。":"이번에는 오니를 물리치기 위해서가 아니라―― 인간과 오니가 함께 살 수 있는 곳을 찾기 위해.","鬼とは、誰のことだったのだろう。":"오니란, 누구를 말하는 것이었을까.","― FIN ―":"― FIN ―","桃太郎 ― 鬼哭島 ―":"모모타로 ― 귀곡도 ―","禍津神・常闇":"마가쓰·도코야미","「生まれが自分を決めるのではない。」":"\"태생이 나를 정하는 것이 아니다.\"","「何を選び、どう生きるかが自分を決める。」":"\"무엇을 고르고 어떻게 사느냐가 나를 정한다.\"","第{n}章":"제{n}장","←↑↓→ 移動 / Z 決定 / X 戻る / C メニュー":"←↑↓→ 이동 / Z 결 g » !","お前の母は、人と鬼が手を取り合えると信じていた":"Ta mère croyait que humains et oni pouvaient se tendre la main.","わしは……そんなもの、信じられなかった":"Moi... je n'ai jamais pu y croire.","……ククク。まだだ。まだ、終わらぬ":"...Hé hé hé. Pas encore. Ce n'est pas fini.","禍津神の姿がゆらぎ――桃太郎そっくりの姿へと変わった。":"La silhouette de Magatsu vacilla— et prit l'apparence de Momotaro.","頭には巨大な角。手には、血に染まった刀。":"Une immense corne sur la tête. Un sabre ensanglanté à la main.","お前も鬼を殺した。お前もまた、わたしの一部だ":"Toi aussi, tu as tué des oni. Toi aussi, tu fais partie de moi.","……そうだ。俺は間違えた":"...C'est vrai. Je me suis trompé.","ならば、なぜ抗う？":"Alors pourquoi résistes-tu ?","間違えたからこそ……これ以上、間違えたくないんだ！":"Parce que je me suis trompé... je ne veux plus jamais me tromper !","桃太郎！ 道は俺たちが開く！":"Momotaro ! On t'ouvre la voie !","団子の分は、きっちり働くぜ！":"Je vais mériter chaque dango !","今度こそ、わたしの意志で！":"Cette fois, par ma propre volonté !","仲間たちの想いが、桃太郎の刀に宿る――":"Les sentiments de ses amis habitent le sabre de Momotaro—","（「天桃一閃」を選べ）":"(Choisis « Éclair céleste »)","……刀が、抜けない":"...Je n'arrive pas à dégainer.","MPがたりない":"Pas assez de PM","どうぐがない":"Aucun objet","たたかいに勝った！":"Victoire !","きびだんごを 1つ 見つけた":"1 kibi dango trouvé","時間 {t}":"Temps {t}","攻{a}　防{d}　術{m}　速{s}":"Atq {a}  Déf {d}  Mag {m}  Vit {s}","オート記録は章のはじまりに残ります":"Sauvegarde auto au début de chaque chapitre","音が出ます（画面かボタンをタップ）":"Avec son (touche l'écran ou un bouton)","はじめから":"Nouvelle partie","つづきから":"Continuer","全滅した……":"L'équipe est vaincue...","もう一度たたかう":"Réessayer","タイトルへもどる":"Retour au titre","？？？":"???","どうか……この子だけは……":"Je vous en prie... au moins cet enfant...","十六年後――":"Seize ans plus tard—","桃の子":"L'Enfant de la pêche","カン、カン――木刀の打ち合う音が、桃の里に響く。":"Clac, clac— le bruit des sabres de bois résonne dans le village des pêches.","桃太郎。刀は人を守るために振るうものじゃ":"Momotaro. On manie le sabre pour protéger les gens.","わかってるよ。鬼が来たら、俺がみんなを守る":"Je sais. Si les oni viennent, je protégerai tout le monde.","……そうか":"...Je vois.","おじいさんは、どこか悲しそうな顔をした。":"Grand-père avait l'air triste, sans qu'on sache pourquoi.","今日はここまでじゃ。日が暮れたら、家に "血染めの山道。鬼たちの足跡が、峠の向こうへ続いている。":"Col ensanglanté. Les traces des oni mènent par-delà la crête.","……グルルル。止まれ。お前の服、鬼の血の匂いがする":"...Grrr. Halte. Tes habits sentent le sang d'oni.","ゆうべ、村を襲った鬼を倒したんだ。これから鬼ヶ島へ行く":"Hier soir, j'ai vaincu l'oni qui a attaqué mon village. Je pars pour Onigashima.","犬":"Chien","鬼ヶ島……！ 俺はコマ。故郷は鬼に焼かれた。親も、兄弟も":"Onigashima... ! Je suis Koma. Les oni ont brûlé mon pays. Mes parents, mes frères.","鬼を退治するってんなら、俺も連れていけ":"Si tu vas vaincre les oni, emmène-moi.","桃太郎は、きびだんごを一つ差し出した。":"Momotaro tendit un kibi dango.","……うまい。約束だ。鬼を、一匹残らず倒すぞ":"...C'est bon. Marché conclu. On battra jusqu'au dernier oni.","コマが仲間になった！":"Koma rejoint l'équipe !","獣たちの誓い":"Le Serment des bêtes","餓鬼の森。昼なお暗い木々の間に、飢えた獣の気配がする。":"Forêt des Gaki. Même de jour il y fait sombre, et des bêtes affamées rôdent.","あっ！ きびだんごが！":"Hé ! Les kibi dango !","へへっ、いただき！":"Hé hé, merci pour le goûter !","猿め……！ 匂いは西だ。追うぞ！":"Ce singe... ! L'odeur va vers l'ouest. Suivons-le !","崩れた廃村。痩せた子供たちに、さっきの猿が団子を分け与えていた。":"Un village en ruine. Le singe de tout à l'heure partage des dango avec des enfants maigres.","おさるのおにいちゃん、ありがとう……":"Merci, grand frère singe...","お前……それ、俺たちの団子だろ":"Toi... ce sont nos dango.","猿":"Singe","盗みは悪いことだって？ じゃあ、腹を空かせて死ぬのは正しいことか？":"Voler, c'est mal ? Alors mourir de faim, c'est bien ?","正しいことばっか言う奴は、だいたい腹が減ってねえんだよ":"Ceux qui ne parlent que de ce qui est juste ont généralement le ventre plein.","きびだんごを分ける":"Partager les dango","黙って見ている":"Regarder en silence","桃太郎は、残りのきびだんごを子供たちにも分けた。":"Momotaro partagea aussi le reste des kibi dango avec les enfants.","これ……川でひろったの。おにいちゃんにあげる":"Ça... je l'ai trouvé près de la rivière. C'est pour toi, grand frère.","「桃の雫」をもらった！":"« Rosée de pêche » obtenue !","……ふん。説教しないだけマシか":"...Hmph. Au moins, tu ne m'as pas fait la morale.","しばらくして、桃太郎は黙ってきびだんごを差し出した。":"Un peu plus tard, Momotaro tendit en silence un kibi dango.","……へえ。変わった勇者様だ":"...Tiens. Drôle de héros.","気に入った。俺はサスケ。鬼ヶ島に行くんだろ？ あそこにはちょっとした「つて」があってな":"Tu me plais. Je suis Sasuke. Vous allez à Onigashima, non ? J'y ai quelques « contacts ».","……信用できるのか、こいつ":"...On peut lui faire confiance ?","団子の分だけは働くさ":"Je travaillerai au moins pour les dango.","サスケが仲間になった！":"Sasuke rejoint l'équipe !","待て。まずはあの猿だ。団子を取り返すぞ":"Attends. D'abord, ce singe. Reprenons nos dango.","朽ちた神社。かつて人間が「鬼」を神として祀っていたという、古い社だ。":"Un sanctuaire en ruine. Jadis, on y honorait les oni comme des dieux.","色あせた壁画。鬼と人間が、同じ食卓を囲んでいる。":"Une fresque délavée. Oni et humains partagent la même table.","……昔は、こうだったって話さ":"...C'était comme ça, autrefois. Paraît-il.","神木の絵。幹に刻まれた紋様は――":"Une peinture de l'arbre sacré. Le motif gravé sur son tronc—","桃太郎の額に、ときどき浮かぶ痣と同じ形をしていた。":"avait la même forme que la marque qui apparaît parfois sur le front de Momotaro.","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"Au fond du sanctuaire, une bête difforme se déchaîne. À côté, un faisan blessé se recroqueville.","……にげて……ください……その獣は、もう……":"...Fuyez... je vous en prie... cette bête n'est plus...","でけえ猪だ……来るぞ！":"Un énorme sanglier... Le voilà !","穢れ猪は、静かに崩れ落ちた。":"Le sanglier souillé s'effondra en silence.","雉":"Faisan","……助かりました。わたしはキリ。この社の神木に仕える者です":"...Vous m'avez sauvée. Je suis Kiri. Je sers l'arbre sacré de ce sanctuaire.","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"Cette bête était un sanglier ordinaire qui gardait le sanctuaire. Les humains ont abattu l'arbre sacré, et l'esprit de la terre s'est troublé.","鬼の仕業じゃないのか？":"Ce n'était pas l'œuvre des oni ?","この世の災いが、すべて鬼の仕業とは限りません":"Tous les malheurs de ce monde ne sont pas l'œuvre des oni.","……あなたは、鬼ヶ島へ行くのですね":"...Vous allez à Onigashima, n'est-ce pas ?","ああ。鬼を退治しに":"Oui. Pour vaincre les oni.","キリは何かを言いかけて――口をつぐんだ。":"Kiri commença à dire quelque chose— puis se tut.","わたしも、お供させてください。……島に、確かめたいことがあるのです":"Laissez-moi vous accompagner. ...Je dois vérifier quelque chose sur cette île.","キリが仲間になった！":"Kiri rejoint l'équipe !","夜の野営。":"Campement de nuit.","なあ、桃太郎。なんで俺たちに団子をくれた？":"Dis, Momotaro. Pourquoi tu nous as donné des dango ?","仲間になってほしかったから":"Parce que je voulais que vous soyez mes amis.","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"Acheter des amis avec de la nourriture ? Quel héros rusé.","違うって！":"C'est pas ça !","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"...On dit que les kibi dango étaient partagés quand humains et oni mettaient fin à leurs guerres.","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"Non pas pour que l'un serve l'autre— mais comme signe d'une promesse entre égaux.","……約束、か":"...Une promesse, hein.","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"Kiri continua de regarder le profil de Momotaro, sans rien dire.","鬼の涙":"Les Larmes de l'oni","潮哭きの港。":"Port des Marées en pleurs.","鬼は人を食うんだ！ 生かしておくな！":"Les oni mangent les gens ! Faut pas le laisser vivre !","檻の中で、小さな鬼の子が石を投げつけられている。":"Dans une cage, un petit enfant oni reçoit des pierres.","……鬼か。いい気味だ":"...Un oni, hein. Bien fait.","桃太郎は、黙って通り過ぎようとした――":"Momotaro voulut passer son chemin en silence—","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"L'enfant oni murmura doucement, dans une langue que les humains ne comprennent pas.","鬼の子":"Enfant oni","……おかあさん……":"...Maman...","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"...Sans savoir pourquoi, Momotaro comprit. Ses pieds s'arrêtèrent.","……サスケ。あの檻、開けられるか":"...Sasuke. Tu peux ouvrir cette cage ?","鍵がありゃな。番所――右端の建物にあるはずだ":"Avec une clé, oui. Elle doit être au poste de garde— le bâtiment tout à droite.","おい、本気か！？":"Hé, t'es sérieux ?!","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"Une nuit ici ? C'est gratuit. Même dans un port pareil, on est gentil avec les voyageurs.","休む":"Se reposer","やめておく":"Pas maintenant","ぐっすり眠った。みんな元気になった！":"Tout le monde a bien dormi et se sent en forme !","番所はもぬけの殻だ。":"Le poste de garde est désert.","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"Personne au poste. Sur le bureau : un trousseau de clés... et un épais registre.","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"Voyons... « Un enfant oni. Exhibé, puis vendu. »","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"Et ça : « Pour Onigashima, cent sabres »— de la contrebande d'armes. C'est Kokujo, le patron du port.","人間が……鬼に、武器を……？":"Des humains... donnent des armes... aux re. Quand on sera sur l'île, je reverrai ma maman ?","……ああ。きっと会えるさ":"...Oui. J'en suis sûr.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"Koma regardait la mer en silence. Kiri détourna les yeux du visage de Momotaro.","やがて霧の向こうに、黒い島影が浮かび上がる。":"Enfin, au-delà de la brume, une île noire apparaît.","見えたぞ。……鬼ヶ島だ":"La voilà. ...Onigashima.","（……どうか、まだ。もう少しだけ――）":"(...Je vous en prie, pas encore. Encore un peu—)","鬼の血":"Le Sang des oni","鬼ヶ島。":"Onigashima.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"Ce qui s'étendait devant eux n'était pas un paradis d'oni féroces— mais une terre dévastée et des gens affamés.","……ここが、鬼ヶ島？":"...C'est ça, Onigashima ?","人間が追い出した連中の、行き着いた先さ":"C'est là qu'ont échoué tous ceux que les humains ont chassés.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"J'ai confié le petit à un ami. ...Faites attention. Certains ici haïssent les humains.","おなか、すいた……":"J'ai faim...","きびだんごをあげる":"Donner un kibi dango","あげない":"Ne rien donner","鬼の子は、うれしそうに団子をほおばった。":"L'enfant oni dévora le dango avec joie.","……ありがとう。人間にも、あなたのような人がいるのね":"...Merci. Il y a donc aussi des humains comme toi.","止まれ、人間ども":"Halte, humains.","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"Je suis Soga, général des Oni bleus. ...Les humains nous ont tourmentés pendant cent ans. Et vous voulez qu'on pardonne ?!","だからって、何も知らない村人を殺していいわけじゃない！":"Ça ne vous donne pas le droit de tuer des villageois qui ne savent rien !","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"Alors dis-moi. Que savaient nos camarades que tu as tués ?","……ぐ……見事だ……":"...Ngh... Bien joué...","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"L'oni rouge que tu as abattu au village des pêches... Gara... cherchait le prince disparu il y a seize ans...","王子……？":"Le prince... ?","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"Attaquer le village, c'était la faute de Gara... Mais lui... depuis toujours...","蒼牙は、それ以上語らなかった。":"Soga n'en dit pas plus.","懐のお守りが、ずしりと重く感じられた。":"Le talisman dans son vêtement lui parut soudain lourd.","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"Château des Pêches uder.","「桃の雫」をもらった！":"„Pfirsichtau“ erhalten!","……ふん。説教しないだけマシか":"...Hmpf. Wenigstens keine Predigt.","しばらくして、桃太郎は黙ってきびだんごを差し出した。":"Nach einer Weile hielt Momotaro schweigend einen Kibi-Dango hin.","……へえ。変わった勇者様だ":"...Na sowas. Ein seltsamer Held.","気に入った。俺はサスケ。鬼ヶ島に行くんだろ？ あそこにはちょっとした「つて」があってな":"Du gefällst mir. Ich bin Sasuke. Ihr wollt nach Onigashima, oder? Dort hab ich ein paar „Beziehungen“.","……信用できるのか、こいつ":"...Kann man dem trauen?","団子の分だけは働くさ":"Für die Dango arbeite ich wenigstens.","サスケが仲間になった！":"Sasuke hat sich der Gruppe angeschlossen!","待て。まずはあの猿だ。団子を取り返すぞ":"Warte. Erst dieser Affe. Holen wir unsere Dango zurück.","朽ちた神社。かつて人間が「鬼」を神として祀っていたという、古い社だ。":"Ein verfallener Schrein. Einst verehrten Menschen hier die Oni als Götter.","色あせた壁画。鬼と人間が、同じ食卓を囲んでいる。":"Ein verblasstes Wandbild. Oni und Menschen sitzen am selben Tisch.","……昔は、こうだったって話さ":"...So war es früher. Sagt man.","神木の絵。幹に刻まれた紋様は――":"Ein Bild des heiligen Baums. Das Muster in seinem Stamm—","桃太郎の額に、ときどき浮かぶ痣と同じ形をしていた。":"hatte die gleiche Form wie das Mal, das manchmal auf Momotaros Stirn erscheint.","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"Tief im Schrein tobt ein entstelltes Tier. Daneben kauert ein verletzter Fasan.","……にげて……ください……その獣は、もう……":"...Flieht... bitte... dieses Tier ist nicht mehr...","でけえ猪だ……来るぞ！":"Ein riesiger Keiler... Er kommt!","穢れ猪は、静かに崩れ落ちた。":"Der verdorbene Keiler brach still zusammen.","雉":"Fasan","……助かりました。わたしはキリ。この社の神木に仕える者です":"...Ihr habt mich gerettet. Ich bin Kiri. Ich diene dem heiligen Baum dieses Schreins.","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"Dieses Tier war einst ein gewöhnlicher Keiler, der den Schrein bewachte. Die Menschen fällten den heiligen Baum, und der Geist des Landes geriet in Aufruhr.","鬼の仕業じゃないのか？":"Waren das nicht die Oni?","この世の災いが、すべて鬼の仕業とは限りません":"Nicht jedes Unglück dieser Welt ist das Werk der Oni.","……あなたは、鬼ヶ島へ行くのですね":"...Ihr geht nach Onigashima, nicht wahr?","ああ。鬼を退治しに":"Ja. Um die Oni zu besiegen.","キリは何かを言いかけて――口をつぐんだ。":"Kiri wollte etwas sa ch: ein Schlüsselbund... und ein dickes Rechnungsbuch.","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"Mal sehen... „Ein Oni-Kind. Erst zur Schau gestellt, dann verkauft.“","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"Und hier: „Nach Onigashima, hundert Schwerter“— Waffenschmuggel. Kokujo, der Hafenboss, steckt dahinter.","人間が……鬼に、武器を……？":"Menschen geben... den Oni... Waffen...?","番所の鍵束を手に入れた。":"Wachhaus-Schlüssel erhalten.","檻には頑丈な錠がかかっている。":"Der Käfig ist mit einem schweren Schloss gesichert.","ガチャリ、と錠が外れた。":"Klick— das Schloss sprang auf.","……え？":"...Hä?","おいおい。オレの商品に、何をしてる":"Na, na. Was machst du da mit meiner Ware?","鬼を殺して何が悪い！ 奴らは人間じゃない！":"Was ist falsch daran, Oni zu töten?! Das sind keine Menschen!","……それでも、子供に罪はない！":"...Trotzdem ist ein Kind unschuldig!","お前だって鬼を殺してきたんだろうが！ 何が違う！":"Du hast doch auch Oni getötet! Wo ist der Unterschied?!","野郎ども、まとめて海に沈めろ！":"Jungs, versenkt sie alle im Meer!","黒縄たちは、港から逃げ去った。":"Kokujo und seine Männer flohen aus dem Hafen.","……おい。鬼をかばうのか？":"...He. Du beschützt einen Oni?","あいつらが俺の村に何をしたか、知ってるだろ！":"Du weißt, was sie meinem Dorf angetan haben!","でも……":"Aber...","お前は鬼を倒すために旅に出たんじゃなかったのか！":"Bist du nicht aufgebrochen, um die Oni zu besiegen?!","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"Koma wandte sich ab. Zum ersten Mal ging ein Riss durch die Freunde.","お兄ちゃん……鬼なのに、どうして角がないの？":"Großer Bruder... du bist doch ein Oni, warum hast du keine Hörner?","……何を言ってる？":"...Wovon redest du?","だって、お兄ちゃんから、お母さんと同じ匂いがする":"Weil du genauso riechst wie meine Mama.","キリは、黙って顔を伏せた。":"Kiri senkte schweigend den Blick.","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"...Na gut. Ich bring den Kleinen zu einem Freund auf der Insel. Am Steg am Hafenrand liegt ein altes Schiff.","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"Ein Schiff, das Oni und Menschen früher für den Handel nutzten. Damit kommen wir nach Onigashima.","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"...Nach Onigashima? Bist du verrückt? ...Na gut. Das alte Schiff will ohnehin wieder aufs Meer.","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"Mit dem Oni-Kind an Bord ruderte das Schiff hinaus aufs graue Meer.","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"Dieses Schiff transportierte bis vor hundert Jahren Waren für Oni und Menschen. Reis, Arznei, Festmasken...","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"Menschen und Oni haben beide Hunger. Im Geschäft spielen Hörner keine Rolle.","……お兄ちゃん。島に帰ったら、お母さんに会える？":"...Großer Bruder. Wenn wir auf der Insel sind, sehe ich dann Mama wieder?","……ああ。きっと会えるさ":"...Ja. Ganz bestimmt.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"Koma sah schweigend aufs Meer. Kiri wandte den Blick von Momotaros Gesicht ab.","やがて霧の向こうに、黒い島影が浮かび上がる。":"Schließlich taucht jenseits des Nebels eine schwarze Insel auf.","見えたぞ。……鬼ヶ島だ":"Da ist sie. ...Onigashima.","（……どうか、まだ。もう少しだけ――）":"(...Bitte, noch nicht. Nur noch ein wenig—)","鬼の血":"Oni-Blut","鬼ヶ島。":"Onigashima.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"Vor ihnen lag kein Paradies wilder Oni— sondern verwüstetes Land und hungernde Leute.","……ここが、鬼ヶ島？":"...Das ist Onigashima?","人間が追い出した連中の、行き着いた先さ":"Hier sind alle gelandet, die die Menschen vertrieben haben.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"Den Kleinen hab ich einem Freund gegeben. ...Seid vorsichtig. Manche hier hassen Menschen zutiefst.","おなか、すいた……":"Ich hab Hunger...","きびだんごをあげる":"Einen Kibi-Dango geben","あげない":"Nichts geben","鬼の子は、うれしそうに団子をほおばった。":"Das Oni-Kind verschlang den Dango glücklich.","……ありがとう。人間にも、あなたのような人がいるのね":"...Danke. Es gibt also auch Menschen wie dich.","止まれ、人間ども":"Halt, Menschen.","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"Ich bin Soga, General der blauen Oni. ...Die Menschen quälten uns hundert Jahre lang. Und jetzt sollen wir vergeben?!","だからって、何も知らない村人を殺していいわけじゃない！":"Das heißt nicht, dass ihr ahnungslose Dorfbewohner töten dürft!","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"Dann frage ich dich. Was wussten unsere Kameraden, die du getötet hast?","……ぐ……見事だ……":"...Ngh... Gut gemacht...","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"Der rote Oni, den du im Pfirsichdorf erschlagen hast... Gara... suchte den Prinzen, der vor sechzehn Jahren verschwand...","王子……？":"Den Prinzen...?","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"Den Überfall aufs Dorf hat Gara zu verantworten... Aber er... die ganze Zeit...","蒼牙は、それ以上語らなかった。":"Soga sagte nichts mehr.","懐のお守りが、ずしりと重く感じられた。":"Das Amulett in seinem Gewand fühlte sich plötzlich schwer an.","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"Burg der Blutpfirsiche. Hinter dem Thron spürt man einen riesigen Baum mit blutroten Früchten.","……よくぞ戻った。我が息子よ":"...Willkommen zurück, mein Sohn.","……何を言っている？":"...Was redest du da?","お前は鬼だ。わしと、亡き妻の子だ":"Du bist ein Oni. Mein Sohn und der meiner verstorbenen Frau.","（暗闇。水の音。……桃の中で、眠っている）":"(Dunkelheit. Wasserrauschen. ...Schlafend in einem Pfirsich.)","母の声":"Stimme der Mutter","この子だけは、憎しみを知らずに育ってほしい":"Möge wenigstens dieses Kind aufwachsen, ohne Hass zu kennen.","桃太郎の額から――一本の角が生えた。":"Aus Momotaros Stirn— wuchs ein einzelnes Horn.","……嘘だろ。桃太郎……":"...Das gibt's nicht. Momotaro...","……俺が、鬼？":"...Ich bin... ein Oni?","……申し訳ありません。わたしは、知っていました":"...Es tut mir so leid. Ich wusste es.","お前も……ずっと、俺を騙していたのか……！":"Du auch... Du hast mich die ganze Zeit getäuscht...!","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"Du wuchsst unter Menschen auf und kennst das Leid der Oni nicht. Doch Blut lügt nicht.","わしと共に来い。人間どもに、百年の報いを":"Komm mit mir. Lass die Menschen für hundert Jahre bezahlen.","血が何だ！ 俺を育ててくれたのは、人間だ！":"Was zählt schon Blut?! Die mich großgezogen haben, sind Menschen!","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"Würden diese Menschen dich noch genauso lieben, wenn sie wüssten, dass du ein Oni bist?","――「鬼斬り」が、封じられた。":"—„Oni-Schnitt“ wurde versiegelt.","……強く、なったな……":"...Du bist... stark geworden...","これを持っていけ。お前の母の……形見だ":"Nimm das. Es ist ein... Andenken an deine Mutter.","「桃の勾玉」を受け取った。":"„Pfirsich-Magatama“ erhalten.","その瞬間――":"In diesem Moment—","…………ヨウヤク……":"............Endlich...","いけない……！ 地下の封印が……！":"Nein...! Das Siegel in der Tiefe...!","禍津神……！ ぐっ……行け、息子よ……！":"Magatsu...! Ngh... Geh, mein Sohn...!","崩れゆく城の底から、黒い瘴気が噴き出した。":"Aus den Tiefen der einstürzenden Burg узьями пробежала трещина.","お兄ちゃん……鬼なのに、どうして角がないの？":"Братик... ты ведь они, почему у тебя нет рогов?","……何を言ってる？":"...О чём ты?","だって、お兄ちゃんから、お母さんと同じ匂いがする":"Потому что ты пахнешь так же, как моя мама.","キリは、黙って顔を伏せた。":"Кири молча опустила глаза.","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"...Ладно. Малыша я отведу к знакомому на острове. У причала на краю порта стоит старый корабль.","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"На нём когда-то торговали они и люди. На нём доберёмся до Онигасимы.","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"...На Онигасиму? Ты в своём уме? ...Ну ладно, этот корабль и сам давно рвётся в море.","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"С ребёнком-они на борту корабль вышел в серое море.","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"Этот корабль ещё сто лет назад возил грузы для они и людей. Рис, лекарства, праздничные маски...","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"И люди, и они хотят есть. В торговле рога не важны.","……お兄ちゃん。島に帰ったら、お母さんに会える？":"...Братик. Когда вернёмся на остров, я увижу маму?","……ああ。きっと会えるさ":"...Да. Обязательно увидишь.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"Кома молча смотрел на море. Кири отвела взгляд от лица Момотаро.","やがて霧の向こうに、黒い島影が浮かび上がる。":"Наконец за туманом проступил чёрный силуэт острова.","見えたぞ。……鬼ヶ島だ":"Вот он. ...Онигасима.","（……どうか、まだ。もう少しだけ――）":"(...Прошу, ещё не сейчас. Ещё совсем немного—)","鬼の血":"Кровь они","鬼ヶ島。":"Онигасима.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"Перед ними был не рай свирепых они— а разорённая земля и голодные люди.","……ここが、鬼ヶ島？":"...Это и есть Онигасима?","人間が追い出した連中の、行き着いた先さ":"Сюда попали все, кого изгнали люди.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"Малыша я оставил знакомому. ...Будьте осторожны. Здесь есть те, кто люто ненавидит людей.","おなか、すいた……":"Есть хочу...","きびだんごをあげる":"Дать кибиданго","あげない":"Не давать","鬼の子は、うれしそうに団子をほおばった。":"Ребёнок-они радостно уплетал данго.","……ありがとう。人間にも、あなたのような人がいるのね":"...Спасибо. Значит, и среди людей есть такие, как ты.","止まれ、人間ども":"Стойте, люди.","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"Я Сога, генерал синих они. ...Люди мучили нас сто лет. И теперь вы просите прощения?!","だからって、何も知らない村人を殺していいわけじゃない！":"Это не даёт права убивать селян, которые ничего не знают!","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"Тогда ответь. Что знали наши товарищи, которых ты убил?","……ぐ……見事だ……":"...Кх... Достойно...","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"Красный они, которого ты сразил в Персиковой деревне... Гара... искал принца, исчезнувшего шестнадцать лет назад...","王子……？":"Принца...?","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"Нападение на деревню — грех Гары... Но он... всё это время...","蒼牙は、それ以上語らなかった。":"Сога больше ничего не сказал.","懐のお守りが、ずしりと重く感じられた。":"Амулет за пазухой вдруг стал тяжёлым.","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"Замок кровавых персиков. За троном ощущается огромное дерево с кроваво-красными плодами.","……よくぞ戻った。我が息子よ":"...С возвращением, сын мой.","……何を言っている？":"...Что ты говоришь?","お前は鬼だ。わしと、亡き妻の子だ":"Ты — они. Мой сын и сын моей покойной жены.","（暗闇。水の音。……桃の中で、眠っている）":"(Тьма. Шум воды. ...Спящий внутри персика.)","母の声":"Голос матери","この子だけは、憎しみを知らずに育ってほしい":"Пусть хотя бы это дитя вырастет, не зная ненависти.","桃太郎の額から――一本の角が生えた。":"На лбу Момотаро— вырос рог.","……嘘だろ。桃太郎……":"...Не может быть. Момотаро...","……俺が、鬼？":"...Я... они?","……申し訳ありません。わたしは、知っていました":"...Простите меня. Я знала.","お前も……ずっと、俺を騙していたのか……！":"И ты... всё это время меня обманывала...!","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"Ты вырос среди людей и не знаешь страданий они. Но кровь не лжёт.","わしと共に来い。人間どもに、百年の報いを":"Пойдём со мной. Пусть люди заплатят за сто лет.","血が何だ！ 俺を育ててくれたのは、人間だ！":"При чём тут кровь?! Меня вырастили люди!","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"Тогда будут ли эти люди любить тебя так же, узнав, что ты они?","――「鬼斬り」が、封じられた。":"—«Удар по они» запечатан.","……強く、なったな……":"...Ты... стал сильным...","これを持っていけ。お前の母の……形見だ":"Возьми это. Это... память о твоей матери.","「桃の勾玉」を受け取った。":"Получена «Персиковая магатама».","その瞬間――":"В тот же миг—","…………ヨウヤク……":"............Наконец...","いけない… ambino...","十六年後――":"Sedici anni dopo—","桃の子":"Il bambino della pesca","カン、カン――木刀の打ち合う音が、桃の里に響く。":"Toc, toc— il suono delle spade di legno risuona nel Villaggio dei peschi.","桃太郎。刀は人を守るために振るうものじゃ":"Momotaro. La spada si brandisce per proteggere le persone.","わかってるよ。鬼が来たら、俺がみんなを守る":"Lo so. Se arrivano gli oni, proteggerò tutti.","……そうか":"...Capisco.","おじいさんは、どこか悲しそうな顔をした。":"Il volto del nonno sembrava in qualche modo triste.","今日はここまでじゃ。日が暮れたら、家に戻っておいで":"Per oggi basta. Torna a casa quando tramonta il sole.","（村を歩いてみよう。左上の家に入ると夜になる）":"(Esplora il villaggio. Entra nella casa in alto a sinistra per far calare la notte.)","おじいさんとおばあさんの家だ。……今は、行かなくては。":"La casa di nonno e nonna. ...Non ora. Devo andare.","村の蔵。勾玉が祀られていた台座は、からっぽだ。":"Il magazzino del villaggio. L'altare del magatama è vuoto.","村の蔵。大事な「桃の勾玉」が祀られている。":"Il magazzino del villaggio. Qui è custodito il prezioso «Magatama di pesca».","……鬼はまだ村の中だ。":"...Gli oni sono ancora nel villaggio.","（日が暮れたら家に戻ろう。旅に出るのはまだ早い）":"(Torna a casa al tramonto. È troppo presto per partire.)","その夜――":"Quella notte—","村人":"Paesano","鬼だ！ 鬼が出たぞォ！":"Oni! Sono arrivati gli oni!","……生きて、おられたのか……":"...Allora voi... eravate vivo...","ガラは崩れ落ちた。その懐から、古いお守りがこぼれ落ちる。":"Gara crollò. Dalla sua veste scivolò un vecchio amuleto.","お守りには、赤子を抱いた角のある女の姿が描かれていた。":"Sull'amuleto era raffigurata una donna cornuta con un neonato.","古いお守りを拾った。":"Raccolto il vecchio amuleto.","……なんだ、これ":"...Che cos'è?","腕の傷から流れた血が――一瞬だけ、黒く光った。":"Il sangue della ferita al braccio— brillò di nero, per un istante.","……？":"...?","ガラ様が……！ 引け、引けェ！":"Signor Gara...! Ritirata, ritirata!","たいへんだ！ 蔵の「桃の勾玉」が盗まれた！":"Disastro! Il «Magatama di pesca» è stato rubato dal magazzino!","じいちゃん、俺、鬼ヶ島に行く。勾玉を取り返して、鬼を退治してくる":"Nonno, vado a Onigashima. Riprenderò il magatama e sconfiggerò gli oni.","じいちゃん？":"Nonno?","……お前が決めたことなら、止めはせん":"...Se è questa la tua decisione, non ti fermerò.","おじいさんは、それ以上なにも言わなかった。":"Il nonno non disse altro.","夜が明けた。":"Venne l'alba.","これを持っておいき。きびだんごじゃ":"Porta questi con te. Kibi dango.","きびだんごを 5つ 受け取った！":"Ricevuti 5 kibi dango!","「桃の雫」も 1つ 受け取った！":"Ricevuta anche 1 «Rugiada di pesca»!","どんな相手でも、腹が減るのは同じじゃ。困っている者がいたら、分けてやりなさい":"Chiunque tu abbia davanti, la fame è uguale per tutti. Se qualcuno è in difficoltà, condividi.","うん。……いってきます！":"Sì. ...Vado!","（MENUボタンでセーブ・どうぐが使える。村の南から旅立とう）":"(Con il pulsante MENU puoi salvare e usare oggetti. Parti dal sud del villaggio.)","血染めの山道。鬼たちの足跡が、峠の向こうへ続いている。":"Passo insanguinato. Le orme degli oni proseguono oltre il crinale.","……グルルル。止まれ。お前の服、鬼の血の匂いがする":"...Grrr. Fermo. I tuoi vestiti odorano di sangue oni.","ゆうべ、村を襲った鬼を倒したんだ。これから鬼ヶ島へ行く":"Ieri notte ho sconfitto l'oni che ha attaccato il mio villaggio. Ora vado a Onigashima.","犬":"Cane","鬼ヶ島……！ 俺はコマ。故郷は鬼に焼かれた。親も、兄弟も":"Onigashima...! Io sono Koma. Gli oni hanno bruciato la mia terra. I miei genitori, i miei fratelli.","鬼を退治するってんなら、俺も連れていけ":"Se vai a sconfiggere gli oni, portami con te.","桃太郎は、きびだんごを一つ差し出した。":"Momotaro porse un kibi dango.","……うまい。約束だ。鬼を、一匹残らず倒すぞ":"...Buono. Affare fatto. Sconfiggeremo gli oni fino all'ultimo.","コマが仲間になった！":"Koma si è unito al gruppo!","獣たちの誓い":"Il giuramento delle bestie","餓鬼の森。昼なお暗い木々の間に、飢えた獣の気配がする。":"Foresta dei Gaki. È buio anche di giorno, e tra gli alberi si aggirano bestie affamate.","あっ！ きびだんごが！":"Ehi! I kibi dango!","へへっ、いただき！":"Eh eh, grazie per lo spuntino!","猿め……！ 匂いは西だ。追うぞ！":"Quella scimmia...! L'odore va a ovest. Inseguiamola!","崩れた廃村。痩せた子供たちに、さっきの猿が団子を分け与えていた。":"Un villaggio in rovina. La scimmia di prima divide i dango con dei bambini magri.","おさるのおにいちゃん、ありがとう……":"Grazie, fratellone scimmia...","お前……それ、俺たちの団子だろ":"Tu... quelli sono i nostri dango.","猿":"Scimmia","盗みは悪いことだって？ じゃあ、腹を空かせて死ぬのは正しいことか？":"Rubare è sbagliato, dici? Allora morire di fame è giusto?","正しいことばっか言う奴は、だいたい腹が減ってねえんだよ":"Chi parla solo di ciò che è giusto, di solito ha la pancia piena.","きびだんごを分ける":"Condividi i dango","黙って見ている":"Guarda in silenzio","桃太郎は、残りのきびだんごを子供たちにも分けた。":"Momotaro divise i kibi dango rimasti anche con i bambini.","これ……川でひろったの。おにいちゃんにあげる":"Questo... l'ho trovato al fiume. È per te, fratellone.","「桃の雫」をもらった！":"Ottenuta «Rugiada di pesca»!","……ふん。説教しないだけマシか":"...Hmpf. Almeno non mi hai fatto la predica.","しばらくして、桃太郎は黙ってきびだんごを差し出した。":"Dopo un po', Momotaro porse in silenzio un kibi dango.","……へえ。変わった勇者様だ":"...Però. Che eroe strano.","気に入った。俺はサスケ。鬼ヶ島に行くんだろ？ あそこにはちょっとした「つて」があってな":"Mi piaci. Io sono Sasuke. Andate a Onigashima, vero? Laggiù ho qualche «conoscenza».","……信用できるのか、こいつ":"...Possiamo fidarci di lui?","団子の分だけは働くさ":"Almeno i dango me li guadagno.","サスケが仲間になった！":"Sasuke si è unito al gruppo!","待て。まずはあの猿だ。団子を取り返すぞ":"Aspetta. Prima quella scimmia. Riprendiamoci i dango.","朽ちた神社。かつて人間が「鬼」を神として祀っていたという、古い社だ。":"Un santuario in rovina. Un tempo qui le persone onoravano gli oni come dèi.","色あせた壁画。鬼と人間が、同じ食卓を囲んでいる。":"Un affresco sbiadito. Oni e umani siedono alla stessa tavola.","……昔は、こうだったって話さ":"...Un tempo era così. O almeno, così si dice.","神木の絵。幹に刻まれた紋様は――":"Un dipinto dell'albero sacro. Il motivo inciso sul tronco—","桃太郎の額に、ときどき浮かぶ痣と同じ形をしていた。":"aveva la stessa forma del segno che a volte appare sulla fronte di Momotaro.","社の奥で、異形の獣が暴れている。そばには、傷ついた雉がうずくまっていた。":"In fondo al santuario infuria una bestia deforme. Accanto, un fagiano ferito è rannicchiato.","……にげて……ください……その獣は、もう……":"...Fuggite... vi prego... quella bestia non è più...","でけえ猪だ……来るぞ！":"Che cinghiale enorme... Arriva!","穢れ猪は、静かに崩れ落ちた。":"Il cinghiale contaminato crollò in silenzio.","雉":"Fagiano","……助かりました。わたしはキリ。この社の神木に仕える者です":"...Mi avete salvata. Sono Kiri. Servo l'albero sacro di questo santuario.","この獣は、もとは神社を守る普通の猪でした。人間が神木を伐り、土地の霊力が乱れたのです":"Questa bestia era un normale cinghiale che proteggeva il santuario. Gli umani hanno abbattuto l'albero sacro e lo spirito della terra si è sconvolto.","鬼の仕業じゃないのか？":"Non è opera degli oni?","この世の災いが、すべて鬼の仕業とは限りません":"Non tutte le sventure di questo mondo sono opera degli oni.","……あなたは、鬼ヶ島へ行くのですね":"...State andando a Onigashima, vero?","ああ。鬼を退治しに":"Sì. Per sconfiggere gli oni.","キリは何かを言いかけて――口をつぐんだ。":"Kiri fece per dire qualcosa— poi tacque.","わたしも、お供させてください。……島に、確かめたいことがあるのです":"Lasciatemi venire con voi. ...Sull'isola c'è una cosa che devo verificare.","キリが仲間になった！":"Kiri si è unita al gruppo!","夜の野営。":"Accampamento notturno.","なあ、桃太郎。なんで俺たちに団子をくれた？":"Ehi, Momotaro. Perché ci hai dato i dango?","仲間になってほしかったから":"Perché volevo che diventaste miei amici.","食い物で仲間を買うなんて、なかなか悪どい勇者様だ":"Comprare amici col cibo? Che eroe furbo.","違うって！":"Non è così!","……きびだんごは、かつて人と鬼が争いを終えるとき、分け合った食べ物だったそうです":"...Si dice che i kibi dango venissero condivisi quando umani e oni mettevano fine alle guerre.","どちらかが従うためではなく――対等な者同士の、約束のしるしとして":"Non perché uno servisse l'altro— ma come segno di una promessa tra pari.","……約束、か":"...Una promessa, eh.","キリは、桃太郎の横顔を見つめたまま、何も言わなかった。":"Kiri continuò a guardare il profilo di Momotaro, senza dire nulla.","鬼の涙":"Le lacrime degli oni","潮哭きの港。":"Porto delle Maree in pianto.","鬼は人を食うんだ！ 生かしておくな！":"Gli oni mangiano le persone! Non lasciatelo vivere!","檻の中で、小さな鬼の子が石を投げつけられている。":"In una gabbia, un piccolo bambino oni viene preso a sassate.","……鬼か。いい気味だ":"...Un oni, eh. Gli sta bene.","桃太郎は、黙って通り過ぎようとした――":"Momotaro cercò di passare oltre in silenzio—","鬼の子が、人間には分からない言葉で、小さくつぶやいた。":"Il bambino oni sussurrò piano, in una lingua che gli umani non capiscono.","鬼の子":"Bambino oni","……おかあさん……":"...Mamma...","……なぜか、桃太郎にはその意味が分かった。足が、止まった。":"...Chissà perché, Momotaro capì. I suoi piedi si fermarono.","……サスケ。あの檻、開けられるか":"...Sasuke. Riesci ad aprire quella gabbia?","鍵がありゃな。番所――右端の建物にあるはずだ":"Con una chiave sì. Dovrebbe essere al posto di guardia— l'edificio più a destra.","おい、本気か！？":"Ehi, dici sul serio?!","ひと晩休んでいくかい？ お代はいらないよ。こんな港でも、旅人には親切にってね":"Ti fermi per la notte? È gratis. Anche in un porto così, con i viaggiatori si è gentili.","休む":"Riposa","やめておく":"Non ora","ぐっすり眠った。みんな元気になった！":"Tutti hanno dormito bene e sono in forma!","番所はもぬけの殻だ。":"Il posto di guardia è deserto.","番所には誰もいない。机の上に、鍵束と……分厚い帳簿がある。":"Nessuno al posto di guardia. Sul tavolo: un mazzo di chiavi... e un grosso registro.","どれどれ……「鬼の子、一匹。見世物ののち、売却」":"Vediamo... «Un bambino oni. Esibito, poi venduto.»","こっちは「鬼ヶ島行き、刀百振り」――武器の密輸だ。港の親玉、黒縄の仕業さ":"E qui: «Per Onigashima, cento spade»— contrabbando di armi. Dietro c'è Kokujo, il boss del porto.","人間が……鬼に、武器を……？":"Degli umani... danno armi... agli oni...?","番所の鍵束を手に入れた。":"Ottenute le chiavi del posto di guardia.","檻には頑丈な錠がかかっている。":"La gabbia è chiusa da un robusto lucchetto.","ガチャリ、と錠が外れた。":"Clic— il lucchetto si aprì.","……え？":"...Eh?","おいおい。オレの商品に、何をしてる":"Bene, bene. Che fai con la mia merce?","鬼を殺して何が悪い！ 奴らは人間じゃない！":"Che c'è di male a uccidere gli oni?! Non sono umani!","……それでも、子供に罪はない！":"...Anche così, un bambino è innocente!","お前だって鬼を殺してきたんだろうが！ 何が違う！":"Anche tu hai ucciso oni, no?! Che differenza c'è?!","野郎ども、まとめて海に沈めろ！":"Ragazzi, buttateli tutti a mare!","黒縄たちは、港から逃げ去った。":"Kokujo e i suoi uomini fuggirono dal porto.","……おい。鬼をかばうのか？":"...Ehi. Stai proteggendo un oni?","あいつらが俺の村に何をしたか、知ってるだろ！":"Sai cosa hanno fatto al mio villaggio!","でも……":"Ma...","お前は鬼を倒すために旅に出たんじゃなかったのか！":"Non eri partito per sconfiggere gli oni?!","コマはそっぽを向いた。初めて、仲間のあいだに亀裂が走った。":"Koma si voltò. Per la prima volta, una crepa si aprì tra gli amici.","お兄ちゃん……鬼なのに、どうして角がないの？":"Fratellone... sei un oni, allora perché non hai le corna?","……何を言ってる？":"...Di che parli?","だって、お兄ちゃんから、お母さんと同じ匂いがする":"Perché hai lo stesso odore della mia mamma.","キリは、黙って顔を伏せた。":"Kiri abbassò lo sguardo in silenzio.","……さ。ガキは俺が島の知り合いに届ける。港の端の桟橋に、古い船がある":"...Bene. Il piccolo lo porto da un amico sull'isola. Al pontile in fondo al porto c'è una vecchia nave.","昔、鬼と人間が交易に使ってた船さ。そいつで鬼ヶ島に渡れる":"Una nave che oni e umani usavano un tempo per commerciare. Ci porterà a Onigashima.","……鬼ヶ島へ？ 正気かい。……まあいい、この船も久しぶりに海に出たがってる":"...A Onigashima? Sei matto? ...Va bene. Questa vecchia nave non vede l'ora di tornare in mare.","鬼の子を乗せ、船は灰色の海へと漕ぎ出した。":"Con il bambino oni a bordo, la nave prese il largo sul mare grigio.","この船はな、百年前までは鬼と人間の荷を運んでた。米に、薬に、祭りの面……":"Fino a cent'anni fa questa nave trasportava merci per oni e umani. Riso, medicine, maschere da festa...","人間も鬼も、腹は減るからな。商売に角は関係ねえってこった":"Umani e oni hanno fame tutti e due. Negli affari le corna non contano.","……お兄ちゃん。島に帰ったら、お母さんに会える？":"...Fratellone. Quando torniamo sull'isola, rivedrò la mamma?","……ああ。きっと会えるさ":"...Sì. Di sicuro.","コマは黙って海を見ていた。キリは、桃太郎の横顔から目をそらした。":"Koma guardava il mare in silenzio. Kiri distolse lo sguardo dal volto di Momotaro.","やがて霧の向こうに、黒い島影が浮かび上がる。":"Infine, oltre la nebbia, appare la sagoma nera di un'isola.","見えたぞ。……鬼ヶ島だ":"Eccola. ...Onigashima.","（……どうか、まだ。もう少しだけ――）":"(...Vi prego, non ancora. Solo un altro po'—)","鬼の血":"Il sangue degli oni","鬼ヶ島。":"Onigashima.","そこに広がっていたのは、凶悪な鬼たちの楽園ではなく――荒れ果てた土地と、飢えた者たちだった。":"Davanti a loro non c'era un paradiso di oni feroci— ma una terra devastata e gente affamata.","……ここが、鬼ヶ島？":"...Questa è Onigashima?","人間が追い出した連中の、行き着いた先さ":"È dove sono finiti tutti quelli che gli umani hanno cacciato.","鬼の子は知り合いに預けた。……気をつけろ。島には人間を憎む過激な連中もいる":"Il piccolo l'ho affidato a un amico. ...State attenti. Qui c'è chi odia gli umani con tutto sé stesso.","おなか、すいた……":"Ho fame...","きびだんごをあげる":"Dai un kibi dango","あげない":"Non dare nulla","鬼の子は、うれしそうに団子をほおばった。":"Il bambino oni divorò felice il dango.","……ありがとう。人間にも、あなたのような人がいるのね":"...Grazie. Allora esistono anche umani come te.","止まれ、人間ども":"Fermi, umani.","我は青鬼将軍・蒼牙。……人間は百年も我らを苦しめた。今さら許せというのか！":"Sono Soga, generale degli Oni blu. ...Gli umani ci hanno tormentati per cent'anni. E adesso dovremmo perdonare?!","だからって、何も知らない村人を殺していいわけじゃない！":"Questo non vi dà il diritto di uccidere paesani che non sanno nulla!","ならば聞こう。お前が殺した我らの仲間は、何を知っていた？":"Allora dimmi. Cosa sapevano i nostri compagni che hai ucciso?","……ぐ……見事だ……":"...Ngh... Ben fatto...","お前が桃の里で斬った赤鬼……ガラは……十六年前に消えた王子を、探していた……":"L'oni rosso che hai abbattuto al Villaggio dei peschi... Gara... cercava il principe scomparso sedici anni fa...","王子……？":"Il principe...?","村を襲ったのは、ガラの罪だ……だが、あいつは……ずっと……":"Attaccare il villaggio è stata la colpa di Gara... Ma lui... per tutto questo tempo...","蒼牙は、それ以上語らなかった。":"Soga non disse altro.","懐のお守りが、ずしりと重く感じられた。":"L'amuleto nella sua veste gli sembrò all'improvviso pesante.","血桃の城。玉座の奥に、血のように赤い実をつけた巨木の気配がする。":"Castello delle Pesche di sangue. Oltre il trono si avverte un albero immenso dai frutti rossi come il sangue.","……よくぞ戻った。我が息子よ":"...Bentornato, figlio mio.","……何を言っている？":"...Che stai dicendo?","お前は鬼だ。わしと、亡き妻の子だ":"Tu sei un oni. Figlio mio e della mia defunta moglie.","（暗闇。水の音。……桃の中で、眠っている）":"(Buio. Il suono dell'acqua. ...Dormendo dentro una pesca.)","母の声":"Voce della madre","この子だけは、憎しみを知らずに育ってほしい":"Che almeno questo bambino cresca senza conoscere l'odio.","桃太郎の額から――一本の角が生えた。":"Dalla fronte di Momotaro— spuntò un corno.","……嘘だろ。桃太郎……":"...Non è possibile. Momotaro...","……俺が、鬼？":"...Io sono... un oni?","……申し訳ありません。わたしは、知っていました":"...Mi dispiace tanto. Lo sapevo.","お前も……ずっと、俺を騙していたのか……！":"Anche tu... Mi hai ingannato per tutto il tempo...!","お前は人間の世界で育ち、鬼の苦しみを知らぬ。だが、血は嘘をつかぬ":"Sei cresciuto tra gli umani e non conosci il dolore degli oni. Ma il sangue non mente.","わしと共に来い。人間どもに、百年の報いを":"Vieni con me. Fai pagare agli umani cent'anni.","血が何だ！ 俺を育ててくれたのは、人間だ！":"Che importa il sangue?! A crescermi sono stati degli umani!","ならば、その人間はお前が鬼だと知っても、同じように愛するか？":"Allora quegli umani ti amerebbero allo stesso modo, sapendo che sei un oni?","――「鬼斬り」が、封じられた。":"—«Fendi-Oni» è stato sigillato.","……強く、なったな……":"...Sei... diventato forte...","これを持っていけ。お前の母の……形見だ":"Prendi questo. È un... ricordo di tua madre.","「桃の勾玉」を受け取った。":"Ricevuto il «Magatama di pesca».","その瞬間――":"In quell'istante—","…………ヨウヤク……":"............Finalmente...","いけない……！ 地下の封印が……！":"No...! Il sigillo sotterraneo...!","禍津神……！ ぐっ……行け、息子よ……！":"Magatsu...! Ngh... Va', figlio mio...!","崩れゆく城の底から、黒い瘴気が噴き出した。":"Dalle profondità del castello che crollava eruppe un miasma nero.","桃の花が散るとき":"Quando cadono i fiori di pesco","血桃の根――鬼門の深淵。":"Le radici del pesco di sangue— l'Abisso della Porta degli Oni.","人は鬼を憎み、鬼は人を憎む。……わたしは、お前たちが生み const CC={};
function h2r(h){if(CC[h])return CC[h];let s=h.replace('#','');if(s.length===3)s=[...s].map(c=>c+c).join('');const n=parseInt(s,16);return CC[h]=[n>>16&255,n>>8&255,n&255];}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return[h,s,l];}
function hsl2rgb(h,s,l){if(!s)return[l*255,l*255,l*255];const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;const f=t=>{t=(t%1+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};return[f(h+1/3)*255,f(h)*255,f(h-1/3)*255];}
const TONEC={};
function tone(hex,dl,hs=.6){const k0=hex+dl+hs;if(TONEC[k0])return TONEC[k0];let[h,s,l]=rgb2hsl(...h2r(hex));const tg=dl>0?.12:.70;let d=tg-h;if(d>.5)d-=1;if(d<-.5)d+=1;
 h=(h+d*Math.min(.35,Math.abs(dl)*hs)+1)%1;l=Math.max(0,Math.min(1,l+dl));s=Math.max(0,Math.min(1,s*(dl<0?1+(-dl)*.6:1-dl*.5)));return TONEC[k0]=r2h(...hsl2rgb(h,s,l));}
function mix(a,b,t){const A=h2r(a),Bc=h2r(b);return r2h(A[0]+(Bc[0]-A[0])*t,A[1]+(Bc[1]-A[1])*t,A[2]+(Bc[2]-A[2])*t);}
const rp4=c=>[tone(c,-.2),tone(c,-.09),c,tone(c,.1)];
const rp6=c=>[tone(c,-.3),tone(c,-.2),tone(c,-.1),c,tone(c,.09),tone(c,.18)];
// noise / dither
function hsh(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hsh(xi,yi,s),b=hsh(xi+1,yi,s),c=hsh(xi,yi+1,s),d=hsh(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s=0,o=3){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=vn(x*f,y*f,s+i*17)*a;n+=a;f*=2;a*=.5;}return t/n;}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];const bay=(x,y)=>(BAY[(y&3)*4+(x&3)]+.5)/16;
const dq=(v,n,x,y)=>Math.max(0,Math.min(n-1,Math.floor(v*n+bay(x,y)-.5)));
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function PB(w,h){const c=mkCanvas(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data;
 return{c,g,w,h,d,set(x,y,hex,a=255){x|=0;y|=0;if(x<0||y<0||x>=w||y>=h)return;const i=(y*w+x)*4,r=h2r(hex);d[i]=r[0];d[i+1]=r[1];d[i+2]=r[2];d[i+3]=a;},
  op(x,y){return x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>0;},put(){g.putImageData(id,0,0);return c;}};}

const OL='#140b12';
function pix(rows,pal,o={}){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const B=PB(w+2,h+2);
 const at=(x,y)=>(y<0||y>=h||x<0||x>=w)?'.':(rows[y][x]||'.');const RM={};
 for(const k in pal){const v=pal[k];if(k.length!==1||!(Array.isArray(v)||(typeof v==='string'&&v[0]==='#')))continue;RM[k]=Array.isArray(v)?{f:v[0]}:{r:rp4(v),b:v};}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const L=at(x,y),m=RM[L];if(!m)continue;let col;
  if(m.f)col=m.f;else{const up=at(x,y-1)!==L,lf=at(x-1,y)!==L,dn=at(x,y+1)!==L,rt=at(x+1,y)!==L;let t=2;
   if(up||(lf&&!dn))t=3;if(dn||(rt&&!up))t=1;if(dn&&rt)t=0;if(o.big&&t===2&&at(x,y+2)!==L)t=1;col=m.r[t];}
  B.set(x+1,y+1,col);}
 if(!o.noOl)for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(RM[at(x,y)])continue;let n=null;for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const L=at(x+dx,y+dy);if(RM[L]){n=RM[L];break;}}
  if(n)B.set(x+1,y+1,n.f?OL:mix(tone(n.b,-.34),OL,.55));}
 return B.put();}

function r3d(w,h,prims,mats,post){const N=w*h,zb=new Float32Array(N).fill(-1e9),pid=new Int16Array(N).fill(-1),NX=new Float32Array(N),NY=new Float32Array(N),NZ=new Float32Array(N);
 prims.forEach((p,i)=>{if(p.t==='e'){const[x0,y0,z0,rx,ry,rz]=p.v;for(let y=Math.max(0,Math.floor(y0-ry));y<=Math.min(h-1,Math.ceil(y0+ry));y++)for(let x=Math.max(0,Math.floor(x0-rx));x<=Math.min(w-1,Math.ceil(x0+rx));x++){
   const dx=(x+.5-x0)/rx,dy=(y+.5-y0)/ry,d2=dx*dx+dy*dy;if(d2>=1)continue;const nz=Math.sqrt(1-d2),z=z0+rz*nz,k=y*w+x;if(z>zb[k]){zb[k]=z;pid[k]=i;NX[k]=dx;NY[k]=dy;NZ[k]=nz;}}}
  else{const[a,b,r0,r1]=p.v;const ex=b[0]-a[0],ey=b[1]-a[1],L2=ex*ex+ey*ey||1e-6,mr=Math.max(r0,r1);
   for(let y=Math.max(0,Math.floor(Math.min(a[1],b[1])-mr));y<=Math.min(h-1,Math.ceil(Math.max(a[1],b[1])+mr));y++)for(let x=Math.max(0,Math.floor(Math.min(a[0],b[0])-mr));x<=Math.min(w-1,Math.ceil(Math.max(a[0],b[0])+mr));x++){
    const px=x+.5,py=y+.5;let t=((px-a[0])*ex+(py-a[1])*ey)/L2;t=t<0?0:t>1?1:t;const cx0=a[0]+ex*t,cy0=a[1]+ey*t,r=r0+(r1-r0)*t,dx=px-cx0,dy=py-cy0,d=Math.hypot(dx,dy);if(d>=r)continue;
    const dz=Math.sqrt(r*r-d*d),z=a[2]+(b[2]-a[2])*t+dz,k=y*w+x;if(z>zb[k]){zb[k]=z;pid[k]=i;NX[k]=dx/r;NY[k]=dy/r;NZ[k]=dz/r;}}}});
 const B=PB(w+2,h+2),RMP={};const ramp=m=>RMP[m]||(RMP[m]=rp6(mats[m].c));
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x,i=pid[k];if(i<0)continue;const m=prims[i].m,M=mats[m];
  let s=NX[k]*LV[0]+NY[k]*LV[1]+NZ[k]*LV[2];s=.12+.88*Math.max(0,s);if(M.fur)s+=(hsh(x,y,i)-.5)*M.fur;if(M.pat)s=M.pat(x,y,s,prims[i]);
  if(typeof s==='string'){B.set(x+1,y+1,s);continue;}
  const R6=ramp(m);let ix=dq(Math.min(.999,s),6,x,y);
  // contour vs farther neighbours
  const nb=[[1,0],[0,1],[-1,0],[0,-1]];let edge=false;for(const[dx,dy]of nb){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const kk=yy*w+xx;if(pid[kk]>=0&&pid[kk]!==i&&zb[kk]-zb[k]>(M.cl||3)){edge=true;break;}}
  let col=R6[ix];if(M.spec&&s>.93)col=tone(R6[5],.12);if(edge)col=mix(R6[0],OL,.5);B.set(x+1,y+1,col);}
 for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const inside=x>=0&&y>=0&&x<w&&y<h&&pid[y*w+x]>=0;if(inside)continue;let n=-1;for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&pid[yy*w+xx]>=0){n=pid[yy*w+xx];break;}}
  if(n>=0)B.set(x+1,y+1,mix(ramp(prims[n].m)[0],OL,.6));}
 if(post)post((x,y,c)=>B.set(x+1,y+1,c),(x,y)=>pid[(y|0)*w+(x|0)]>=0);
 return B.put();}

let mode='boot';
let G=newGame();
function newGame(){return{map:'village',x:6,y:7,dir:3,flags:{},ch:1,items:{dango:0,shizuku:0},party:['momo'],hp:{momo:120},mp:{momo:24},lv:{momo:1},exp:{momo:0},play:0};}
// EXP: total needed to reach level L. Chapter n guarantees at least level 1+4(n-1), which matches the enemy tuning.
const EXPT=L=>L<=1?0:Math.round(8*Math.pow(L-1,2.2));
const LVFLOOR=ch=>1+4*(ch-1);
function lvOf(id){return(G.lv&&G.lv[id])||1;}
function stat(id,k){return Math.round(BASE[id][k]*(1+.11*(lvOf(id)-1)));}
function ensureLv(){G.lv=G.lv||{};G.exp=G.exp||{};const f=LVFLOOR(G.ch);G.party.forEach(id=>{if(!G.lv[id]||G.lv[id]<f){G.lv[id]=Math.max(G.lv[id]||1,f);G.exp[id]=Math.max(G.exp[id]||0,EXPT(G.lv[id]));}if(G.exp[id]==null)G.exp[id]=EXPT(G.lv[id]);});}
function healAll(){G.party.forEach(id=>{G.hp[id]=stat(id,'hp');G.mp[id]=stat(id,'mp');});}
function join(id){if(!G.party.includes(id))G.party.push(id);G.lv=G.lv||{};G.exp=G.exp||{};G.lv[id]=Math.max(lvOf('momo'),LVFLOOR(G.ch));G.exp[id]=Math.max(G.exp.momo||0,EXPT(G.lv[id]));G.hp[id]=stat(id,'hp');G.mp[id]=stat(id,'mp');}
function addItem(k,n=1){G.items[k]=Math.max(0,(G.items[k]||0)+n);}

// ================= PROMISE HELPERS =================
const WAITS=[];
function until(fn){return new Promise(r=>WAITS.push({fn,r}));}
function wait(n){let c=n;return until(()=>--c<=0);}
function tickWaits(){for(let i=WAITS.length-1;i>=0;i--){const w=WAITS[i];if(w.fn()){WAITS.splice(i,1);w.r();}}}
let SCN=0;
async function run(fn){SCN++;try{await fn();}catch(e){console.error(e);}finally{SCN=Math.max(0,SCN-1);}}

function fade(to,frames=24){frames=Math.max(5,Math.round(frames*.33));FADE.to=to;FADE.sp=1/frames;return until(()=>FADE.a===to);}
