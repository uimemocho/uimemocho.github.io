<script>
(()=>{
'use strict';
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast');
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?1:ms));
const now=new Date();
const pad2=n=>String(n).padStart(2,'0');
const norm=s=>(s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();
const HER_OK=['水野灯','みずのあかり','水野あかり','みずの灯'].map(norm);
const NONE_OK=['なし','無し','ない','無い','いない','いません','不要','該当なし','空欄','none','-','ー','なしで'].map(norm);

/* ============ state ============ */
const S={started:false,prog:'login',page:'login',unl:new Set(),horror:0,glitch:0,ghost:0,ghostT:0,sx:1,sy:1,
  t0:0,solved:{},wrong:0,her:'■■ ■',successor:'',realYear:false,busy:false,ended:false};
const ORDER=['login','board','roster','phone','nippo','apply'];
const HORROR={login:.05,board:.15,roster:.3,phone:.45,nippo:.62,apply:.78};
const HINT={
  login:'付箋の指示どおり。会社名は画面のいちばん上にあります。',
  board:'「名無し」の投稿タイトルの最初の1文字を、上から順に読んでみて。',
  roster:'掲示板の【通達】に、廃止された部署の名前が出てきます。',
  phone:'名簿で見つけた内線番号にかけてみて。',
  nippo:'8月4日の日報。上は「水の野原」、下は「灯台の灯」。読みはひらがなで三文字。',
  apply:'電話の最後の言葉を思い出して。'
};

/* ============ audio ============ */
let AC=null,master,noiseBuf,drone;
function initAudio(){
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // hum
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=50;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=140;
  const g=AC.createGain();g.gain.value=.025;o.connect(lp).connect(g).connect(master);o.start();
  // hiss
  const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5000;
  const ng=AC.createGain();ng.gain.value=.008;n.connect(hp).connect(ng).connect(master);n.start();
  // drone
  drone=AC.createGain();drone.gain.value=0;drone.connect(master);
  [55,55.8,82.4].forEach(f=>{const x=AC.createOscillator();x.frequency.value=f;x.connect(drone);x.start();});
}
function noise(dur,{f=1200,q=1,g=.08,type='bandpass',f2=null}={}){
  if(!AC)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const b=AC.createBiquadFilter();b.type=type;b.frequency.setValueAtTime(f,t);b.Q.value=q;
  if(f2)b.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const v=AC.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(b).connect(v).connect(master);s.start(t,Math.random());s.stop(t+dur+.02);
}
function tone(f,dur,{g=.08,type='sine',at=0}={}){
  if(!AC)return;const t=AC.currentTime+at;
  const o=AC.createOscillator();o.type=type;o.frequency.value=f;
  const v=AC.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.setValueAtTime(g,t+dur-.02);v.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(v).connect(master);o.start(t);o.stop(t+dur+.02);
}
const click=()=>noise(.03,{f:3000,q:.7,g:.05});
const sGlitch=a=>noise(.15+a*.3,{f:400+Math.random()*3000,q:2,g:.05+a*.1,f2:80+Math.random()*200});
const DT={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};
function dtmf(k){const p=DT[k];if(!p)return;tone(p[0],.12,{g:.06});tone(p[1],.12,{g:.06});}
function ringback(){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator();o.frequency.value=400;
  const am=AC.createGain();am.gain.value=0;
  const lfo=AC.createOscillator();lfo.frequency.value=16;const lg=AC.createGain();lg.gain.value=.04;
  lfo.connect(lg).connect(am.gain);
  const env=AC.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+.02);env.gain.setValueAtTime(1,t+1);env.gain.linearRampToValueAtTime(0,t+1.02);
  o.connect(am).connect(env).connect(master);o.start(t);lfo.start(t);o.stop(t+1.1);lfo.stop(t+1.1);
}
const whisper=()=>noise(.07,{f:500+Math.random()*2200,q:6,g:.07});
function stinger(){noise(1.6,{f:2500,q:.5,g:.14,f2:60});tone(46,1.8,{g:.12,type:'sawtooth'});}

/* ============ render (HTML-in-Canvas / fallback) ============ */
let canvas=$('crt');const screen=$('screen');
function hicKind(){
  if(Q.get('mode')==='dom')return null;
  const c=document.createElement('canvas');c.setAttribute('content','drawable');
  if(c.content==='drawable')return 'new';
  if(typeof HTMLCanvasElement!=='undefined'&&'layoutSubtree' in HTMLCanvasElement.prototype)return 'legacy';
  return null;
}
let mode='dom',kind=hicKind(),G=null,uiTex=null,uiW=0,uiH=0,T=[],pp=0,painted=false;
const FLIP=Q.get('flip')==='1'?1:0;

const VS=`#version 300 es
in vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
const FS_A=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform sampler2D uUI,uPrev;uniform float uTime,uGlitch,uHorror,uTrail,uCurve,uFlip;
float h(float n){return fract(sin(n)*43758.5453);}
void main(){
  vec2 c=vUv-.5;float r2=dot(c,c);vec2 uv=c*(1.+uCurve*r2)+.5;
  float band=floor(uv.y*42.);float tt=floor(uTime*18.);
  float on=step(1.-uGlitch*.55,h(band*3.17+tt));
  uv.x+=(h(band+tt*1.3)-.5)*.09*uGlitch*on;
  vec2 e=abs(uv-.5);
  float inside=step(e.x,.5)*step(e.y,.5)*(1.-smoothstep(.0,.006,length(max(e-.47,0.))-.03));
  vec2 t=vec2(uv.x,mix(1.-uv.y,uv.y,uFlip));
  float ca=.0012+.007*uGlitch+.002*uHorror;
  vec3 col=vec3(texture(uUI,t+vec2(ca,0.)).r,texture(uUI,t).g,texture(uUI,t-vec2(ca,0.)).b)*inside;
  vec3 prev=texture(uPrev,vUv).rgb;
  o=vec4(mix(col,prev,uTrail),1.);
}`;
const FS_B=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform sampler2D uSrc;uniform float uOverlay,uTime,uHorror,uGlitch,uGhost,uSX,uSY;uniform vec2 uRes;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec2 q=(vUv-.5)/vec2(uSX,uSY)+.5;
  float inQ=step(0.,q.x)*step(q.x,1.)*step(0.,q.y)*step(q.y,1.);
  vec3 base=vec3(0.);
  if(uOverlay<.5)base=texture(uSrc,q).rgb*inQ;
  vec2 px=vUv*uRes;
  float scan=.92+.08*sin(px.y*1.5708);
  vec2 c=vUv-.5;float vig=1.-dot(c,c)*(.75+uHorror*.9);
  float flick=1.-.03*uHorror*(.5+.5*sin(uTime*57.))-uGlitch*.1*h2(vec2(floor(uTime*30.),1.));
  float m=clamp(scan*vig*flick,0.,1.);
  float n=h2(px+fract(uTime*7.)*91.);
  vec3 add=vec3(n)*(.02+.07*uGlitch+.03*uHorror);
  float rb=fract(vUv.y*.6-uTime*.07);
  add+=vec3(smoothstep(.0,.06,rb)*(1.-smoothstep(.06,.14,rb)))*.025*(.3+uHorror);
  if(uGhost>.001){
    vec2 p=(vUv-vec2(.5,.56))*vec2(uRes.x/uRes.y,1.);
    float face=1.-smoothstep(.15,.24,length(p*vec2(1.,.78)));
    float eyes=(1.-smoothstep(.018,.042,length(p-vec2(-.062,.03))))+(1.-smoothstep(.018,.042,length(p-vec2(.062,.03))));
    float mouth=1.-smoothstep(.012,.04,length((p-vec2(0.,-.085))*vec2(1.,.55)));
    float mask=face*(.45+.55*h2(floor(px/3.)+floor(uTime*24.)));
    add+=vec3(.75,.8,.86)*mask*uGhost*.32;
    m*=1.-clamp(eyes+mouth,0.,1.)*face*uGhost*.9;
  }
  float line=(1.-uSY)*exp(-abs(vUv.y-.5)*uRes.y*.12)*step(abs(vUv.x-.5),uSX*.5+.01);
  add+=vec3(.9,.95,1.)*line;
  if(uOverlay<.5)o=vec4(base*m+add,1.);else o=vec4(add,1.-m);
}`;

function mkGL(cv,overlay){
  let gl=null;
  try{gl=cv.getContext('webgl2',{alpha:overlay,premultipliedAlpha:true,antialias:false});}catch(e){}
  if(!gl)return null;
  const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;};
  const prog=fs=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
    gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
    const u={};return{p,u:n=>(n in u)?u[n]:(u[n]=gl.getUniformLocation(p,n))};};
  try{
    const A=overlay?null:prog(FS_A),B=prog(FS_B);
    const vao=gl.createVertexArray();gl.bindVertexArray(vao);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    return{gl,A,B,overlay,w:0,h:0};
  }catch(e){console.warn(e);return null;}
}
function mkTex(gl,w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function mkTarget(gl,w,h){const t=mkTex(gl,w,h),f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);return{t,f};}

function setupHIC(){
  if(kind==='new'){canvas.setAttribute('content','drawable');screen.setAttribute('drawable','');}
  else canvas.setAttribute('layoutsubtree','');
  screen.className='hic';
  G=mkGL(canvas,false);
  if(!G)return false;
  const gl=G.gl;
  if(typeof gl.texElementSubImage2D!=='function'&&typeof gl.texElementImage2D!=='function')return false;
  uiTex=mkTex(gl,1,1);
  canvas.addEventListener('paint',onPaint);
  mode='hic';
  sizeScreen();
  if(canvas.requestPaint)canvas.requestPaint();
  setTimeout(()=>{if(mode==='hic'&&!painted){console.warn('no paint event: fallback');toFallback();}},2500);
  return true;
}
function onPaint(){
  if(mode!=='hic')return;
  try{
    const gl=G.gl;
    let w,h;
    if(canvas.getElementImageDefaultSize){const s=canvas.getElementImageDefaultSize(screen);w=Math.ceil(s.width);h=Math.ceil(s.height);}
    else{w=Math.ceil(screen.offsetWidth*dpr());h=Math.ceil(screen.offsetHeight*dpr());}
    gl.bindTexture(gl.TEXTURE_2D,uiTex);
    if(typeof gl.texElementSubImage2D==='function'){
      if(w!==uiW||h!==uiH){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,Math.max(1,w),Math.max(1,h),0,gl.RGBA,gl.UNSIGNED_BYTE,null);uiW=w;uiH=h;}
      gl.texElementSubImage2D(gl.TEXTURE_2D,0,0,0,screen);
    }else{
      // Chrome < 155: (target, internalformat, element)。さらに古い6引数形にも対応
      if(gl.texElementImage2D.length<=3)gl.texElementImage2D(gl.TEXTURE_2D,gl.RGBA8,screen);
      else gl.texElementImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,screen);
    }
    if(canvas.updateElementGeometry)canvas.updateElementGeometry(screen,{canvasTransform:new DOMMatrix()});
    painted=true;
  }catch(e){console.warn('HTML-in-Canvas upload failed',e);toFallback();}
}
function toFallback(){
  if(mode==='dom'&&G&&G.overlay)return;
  mode='dom';
  if(canvas.isConnected){canvas.removeEventListener('paint',onPaint);}
  const nc=document.createElement('canvas');nc.id='crt';nc.className='overlay';
  screen.removeAttribute('drawable');screen.className='dom';screen.style.width='';screen.style.height='';
  $('wrap').appendChild(screen);
  if(canvas.parentNode)canvas.parentNode.replaceChild(nc,canvas);else $('wrap').appendChild(nc);
  canvas=nc;
  G=mkGL(canvas,true);
  if(G){G.gl.enable(G.gl.BLEND);G.gl.blendFunc(G.gl.ONE,G.gl.ONE_MINUS_SRC_ALPHA);}
  bootRenderLabel();
}
const dpr=()=>Math.min(window.devicePixelRatio||1,2);
function sizeScreen(){
  if(mode==='hic'){screen.style.width=canvas.clientWidth+'px';screen.style.height=canvas.clientHeight+'px';}
}
function resizeGL(){
  if(!G)return;
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr())),h=Math.max(1,Math.round(canvas.clientHeight*dpr()));
  if(w===G.w&&h===G.h)return;
  G.w=w;G.h=h;canvas.width=w;canvas.height=h;
  if(!G.overlay){T=[mkTarget(G.gl,w,h),mkTarget(G.gl,w,h)];sizeScreen();}
}
function render(time){
  if(!G)return;
  resizeGL();
  const gl=G.gl,H=S.horror;
  const setB=(B,ov)=>{gl.useProgram(B.p);gl.uniform1i(B.u('uSrc'),0);gl.uniform1f(B.u('uOverlay'),ov);gl.uniform1f(B.u('uTime'),time);
    gl.uniform1f(B.u('uHorror'),H);gl.uniform1f(B.u('uGlitch'),S.glitch);gl.uniform1f(B.u('uGhost'),S.ghost);
    gl.uniform1f(B.u('uSX'),Math.max(S.sx,.002));gl.uniform1f(B.u('uSY'),Math.max(S.sy,.002));gl.uniform2f(B.u('uRes'),G.w,G.h);};
  if(mode==='hic'&&!G.overlay){
    const src=T[pp],dst=T[1-pp];
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,G.w,G.h);
    const A=G.A;gl.useProgram(A.p);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,uiTex);gl.uniform1i(A.u('uUI'),0);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(A.u('uPrev'),1);
    gl.uniform1f(A.u('uTime'),time);gl.uniform1f(A.u('uGlitch'),S.glitch);gl.uniform1f(A.u('uHorror'),H);
    gl.uniform1f(A.u('uTrail'),Math.min(.8,.18+H*.6));gl.uniform1f(A.u('uCurve'),.035+H*.03);gl.uniform1f(A.u('uFlip'),FLIP);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,G.w,G.h);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dst.t);
    setB(G.B,0);gl.drawArrays(gl.TRIANGLES,0,3);
    pp=1-pp;
  }else{
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,G.w,G.h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    setB(G.B,1);gl.drawArrays(gl.TRIANGLES,0,3);
  }
}

/* ============ loop ============ */
let last=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(.1,t-last||.016);last=t;
  S.glitch=Math.max(0,S.glitch-dt*1.8);
  if(S.started&&!S.ended){
    if(Math.random()<dt*(.02+S.horror*.22))glitch(.2+Math.random()*.5*S.horror,false);
    if(S.horror>.4&&Math.random()<dt*.015)ghostFlash(.35);
  }
  S.ghostT=Math.max(0,S.ghostT-dt);
  const gt=S.ghostT>0?1:0;S.ghost+=(gt-S.ghost)*Math.min(1,dt*(gt?6:3));
  if(drone)drone.gain.value=S.ended?0:Math.max(0,S.horror-.35)*.06;
  if(mode==='dom'){
    let tf='';
    if(S.sx!==1||S.sy!==1)tf+=`scale(${Math.max(S.sx,.002)},${Math.max(S.sy,.002)}) `;
    if(S.glitch>.15)tf+=`translateX(${((Math.random()-.5)*20*S.glitch).toFixed(1)}px) skewX(${((Math.random()-.5)*6*S.glitch).toFixed(2)}deg)`;
    screen.style.transform=tf;
    screen.style.filter=S.glitch>.3?`contrast(${1+S.glitch*.6}) hue-rotate(${(Math.random()*40*S.glitch).toFixed(0)}deg)`:'';
  }
  render(t);
  requestAnimationFrame(frame);
}
function glitch(a,snd=true){S.glitch=Math.min(1,Math.max(S.glitch,a));if(snd)sGlitch(a);}
function ghostFlash(sec){S.ghostT=Math.max(S.ghostT,sec);if(sec>.3)noise(.4,{f:180,q:3,g:.06});}
function anim(ms,fn){return new Promise(r=>{const t0=performance.now(),d=FAST?1:ms;const st=()=>{const k=Math.min(1,(performance.now()-t0)/d);fn(k);k<1?requestAnimationFrame(st):r();};st();});}

const NIPPO=[
  ['2003/08/04','本日も第零開発室で検証作業。受付で名前を伝えるとき、上は「水の野原」で通じるのに、下の名前はいつも説明が要る。「灯台の灯」と書いて、読みはひらがな三文字。'],
  ['2003/09/12','室長が、わたしにポータルへ「常駐」してもらうと言っていた。意味がわからない。'],
  ['2003/09/30','部署が廃止になった。でも、わたしのアカウントは消えない。帰れない。'],
];
function renderNippo(){
  $('nippoList').innerHTML=NIPPO.map(n=>`<div class="post"><div class="meta">${n[0]}　作成者：<span class="au"></span></div><div class="pb">${n[1]}</div></div>`).join('');
  $('nippoList').querySelectorAll('.au').forEach(e=>e.textContent=S.her);
}
renderNippo();
let gk=0;
setInterval(()=>{
  if(S.page!=='nippo'||S.solved.nippo||S.ended)return;
  const ta=$('draft');ta.value+='ここにいる'[gk++%5];if(ta.value.length>90)ta.value=ta.value.slice(-90);
  if(gk%10===0)glitch(.25,false);
},FAST?5:650);
function doName(){
  const q=norm($('nameQ').value);
  if(HER_OK.includes(q)){
    if(S.solved.nippo)return;
    S.solved.nippo=true;S.her='水野 灯';renderNippo();$('nameErr').textContent='';
    glitch(1);ghostFlash(.8);stinger();$('draft').value='';
    setGreet('……水野 灯。そう、わたしの名前。ありがとう。');
    const v=document.createElement('p');v.className='voice';v.textContent='最後に、退職届を出させて。申請ページにあります。';
    $('nippoList').before(v);
    setTimeout(()=>unlock('apply'),FAST?1:1400);return;
  }
  S.wrong++;
  if(q.startsWith(norm('水野'))||q.startsWith('みずの'))$('nameErr').textContent='下の名前が一致しません';
  else $('nameErr').textContent='該当する社員が見つかりません';
  glitch(.4);
}
$('nameBtn').onclick=doName;onEnter($('nameQ'),doName);

/* ============ apply ============ */
$('apDate').value=`2003-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
function doApply(){
  if(S.busy||S.ended)return;
  const nm=norm($('apName').value),nx=$('apNext').value.trim();
  if(!nm){$('apErr').textContent='氏名を入力してください';return;}
  if(!HER_OK.includes(nm)){$('apErr').textContent='本人以外は提出できません';glitch(.5);return;}
  if(!nx){$('apErr').textContent='後任者氏名は必須項目です';glitch(.3);return;}
  $('apErr').textContent='';
  if(NONE_OK.includes(norm(nx)))endTrue();else endBad(nx.slice(0,20));
}
$('apBtn').onclick=doApply;onEnter($('apNext'),doApply);

/* ============ power ============ */
let powerArm=0;
$('powerBtn').onclick=()=>{
  if(S.busy||S.ended)return;
  const t=performance.now();
  if(t-powerArm<3000||FAST){endNormal();return;}
  powerArm=t;setStatus('もう一度押すと電源を切ります',3000);click();
};

/* ============ endings ============ */
async function showEnding(tag,title,text){
  S.ended=true;S.busy=false;
  const ms=performance.now()-S.t0,mm=Math.floor(ms/60000),ss=Math.floor(ms/1000)%60;
  $('endTag').textContent=tag;$('endTitle').textContent=title;$('endText').textContent=text;
  $('endTime').textContent=`プレイ時間 ${pad2(mm)}:${pad2(ss)}`;
  $('ending').classList.remove('hidden');
  S.endShare=`『社内ポータル、何かいる。』${tag}「${title}」に到達しました。（${pad2(mm)}:${pad2(ss)}）`;
}
async function endTrue(){
  S.busy=true;setStatus('送信中……');await sleep(900);
  glitch(1);ghostFlash(1);await sleep(900);
  S.horror=0;S.ghostT=0;S.realYear=true;tickClock();
  setGreet('退職届を受理しました。おつかれさまでした、水野 灯 さん。');setStatus('受理しました');
  tone(523,.5,{g:.05});tone(659,.5,{g:.05,at:.25});tone(784,.9,{g:.05,at:.5});
  await sleep(2600);
  showEnding('END 1','退職受理','サーバーは静かに止まった。翌朝、撤去伝票の備考欄に、だれかの字で「ありがとう」と書かれていた。');
}
async function endBad(name){
  S.busy=true;setStatus('送信中……');await sleep(900);
  S.successor=name;S.horror=1;glitch(1);ghostFlash(2.5);stinger();
  setGreet(`後任者：${name} さん。着任を確認しました。`);
  await sleep(1400);
  setGreet(`おかえりなさい、${name} さん`);unlock('roster');go('roster');$('deptQ').value='第零開発室';zeroRow();
  await sleep(2400);
  showEnding('END 3','後任着任',`第零開発室　在籍者：${name}。ポータルは今夜も、03:33に夜間バッチを走らせる。`);
}
async function endNormal(){
  S.busy=true;noise(.3,{f:3000,q:.5,g:.15,f2:100});
  await anim(220,k=>{S.sy=1-k*.996;});await anim(200,k=>{S.sx=1-k*.998;});
  await sleep(900);
  showEnding('END 2','強制終了','電源を切った。……翌朝、撤去したはずのサーバー室から、内線0444の呼び出し音が鳴り続けていたという。');
  await anim(260,k=>{S.sx=.002+k*.998;});await anim(260,k=>{S.sy=.004+k*.996;});S.sx=S.sy=1;S.horror=.2;
}
$('againBtn').onclick=()=>location.reload();
$('shareBtn').onclick=()=>{
  const u=location.href.split('?')[0];
  const text=(S.endShare||'『社内ポータル、何かいる。』')+'\n#ゲーム開発 #個人開発 #gamedev';
  window.open('https://x.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(u),'_blank');
};
$('hintBtn').onclick=()=>{click();setStatus('ヒント：'+HINT[S.prog],7000);};

/* ============ boot ============ */
if(!(kind&&setupHIC()))toFallback();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>sizeScreen()).observe(document.getElementById('wrap'));
renderTabs();
window.__S=S;window.__mode=()=>mode;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
