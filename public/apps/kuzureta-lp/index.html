<style>
:root{--ui:#0b0c10;--ui2:#14161d;--ui3:#1e212b;--line:#2a2e3a;--tx:#e8eaf0;--mut:#8a90a2;--acc:#00e0c0;--hot:#ff3d6e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ui);color:var(--tx);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);max-width:520px;margin:0 auto}
/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;height:52px;flex:none}
#top .stg{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--mut);letter-spacing:.08em}
#top .stg b{color:var(--tx);font-size:15px}
#top .tm{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;margin-left:auto;font-weight:700}
#fixCount{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--mut)}
#fixCount b{color:var(--acc)}
#peekBtn{font-size:12px;font-weight:700;padding:7px 10px;border-radius:8px;background:var(--ui3);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none}
#peekBtn.on{background:var(--acc);color:#001a16}
#peekBtn[disabled]{opacity:.35}
/* browser frame */
#frame{flex:1;min-height:0;margin:0 10px;border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;border:1px solid var(--line);position:relative}
#addr{flex:none;height:30px;background:#e9eaee;display:flex;align-items:center;gap:6px;padding:0 10px;color:#5b6070;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
#addr i{width:8px;height:8px;border-radius:50%;background:#c5c8d0;display:inline-block}
#addr span{flex:1;background:#fff;border-radius:6px;padding:3px 8px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lpScroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#lpScroll canvas{display:block;width:100%}
#ghost{position:absolute;left:0;top:0;width:100%;pointer-events:none;opacity:0;transition:opacity .12s;mix-blend-mode:multiply}
#ghost.dark{mix-blend-mode:screen}
#ghost.on{opacity:.55}
#frame.flash::after{content:'';position:absolute;inset:0;background:#fff;animation:flash .6s ease-out forwards;pointer-events:none}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* panel */
#panel{flex:none;height:min(38vh,300px);padding:10px 14px calc(10px + var(--sab));display:flex;flex-direction:column;gap:8px}
#pHead{display:flex;align-items:center;gap:10px;min-height:26px}
#pName{font-weight:900;font-size:15px}
#pMeter{flex:1;height:6px;border-radius:3px;background:var(--ui3);overflow:hidden}
#pMeter i{display:block;height:100%;background:var(--hot);width:0;transition:width .15s,background .15s}
#pState{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--mut);min-width:60px;text-align:right}
#pState.ok{color:var(--acc)}
#pBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.hint{color:var(--mut);font-size:13px;line-height:1.8;text-align:center;margin:auto 0;padding:0 8px}
.row{display:grid;grid-template-columns:88px 1fr 54px;align-items:center;gap:8px}
.row label{font-size:12px;color:var(--mut);line-height:1.3}
.row .val{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;text-align:right}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .st{width:30px;height:30px;border-radius:8px;background:var(--ui3);border:1px solid var(--line);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:16px;flex:none}
.ctl .st:active{background:var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ui3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--tx);margin-top:-8px;border:0}
input[type=range]::-moz-range-track{height:4px;background:var(--ui3);border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--tx);border:0}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;height:30px;border-radius:8px;background:var(--ui3);border:1px solid var(--line);font-size:12px}
.seg button.on{background:var(--tx);color:var(--ui);font-weight:700}
.seg .sw{border-width:2px}
.seg .sw.on{outline:2px solid var(--tx);outline-offset:2px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(8,9,12,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.show{display:flex}
.ov:not(#title){justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + var(--sat)) 20px calc(28px + var(--sab))}
.ovin{margin:auto 0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.ovin .clrT{font-size:clamp(32px,9vw,44px)}
.ovin .rank{font-size:64px;margin-top:10px}
.line{margin-top:10px;font-size:13px;color:var(--mut)}
.line b{color:var(--tx);font-weight:700}
.shot{display:block;width:100%;max-width:360px;aspect-ratio:1;margin-top:16px;border-radius:12px;background:var(--ui2);border:1px solid var(--line);object-fit:contain;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.imgHint{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.6}
.ovin .btnP{margin-top:14px;width:100%;max-width:360px}
.btnRow{display:flex;gap:8px;width:100%;max-width:360px;margin-top:10px}
.btnRow .btnS{flex:1;min-width:0;margin-top:0;padding:12px 8px;text-align:center}
.ovin>.btnS{width:100%;max-width:360px}
.ttl{margin-top:8px;font-weight:900;font-size:18px;letter-spacing:.04em}
.review{margin-top:16px;width:100%;max-width:360px;text-align:left;background:var(--ui2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rvH{font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.12em;margin-bottom:6px}
.review p{font-size:14px;line-height:1.85}
#title{background:var(--ui)}
.logoT{font-weight:900;font-size:clamp(40px,12vw,58px);line-height:1.15;letter-spacing:.02em;position:relative}
.logoT .bk{display:inline-block;animation:tglitch 2.4s infinite steps(1)}
@keyframes tglitch{0%,86%,100%{transform:none;text-shadow:none}88%{transform:translate(-4px,1px) skewX(-8deg);text-shadow:3px 0 var(--hot),-3px 0 var(--acc)}90%{transform:translate(5px,-1px);text-shadow:-4px 0 var(--hot),4px 0 var(--acc)}92%{transform:translate(-2px,0) skewX(5deg)}}
.subT{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.32em;color:var(--mut);margin-top:12px}
.btnP{margin-top:28px;min-width:220px;padding:16px 28px;border-radius:12px;background:var(--tx);color:var(--ui);font-weight:900;font-size:17px;letter-spacing:.06em}
.btnP:active{transform:scale(.97)}
.btnS{margin-top:10px;min-width:220px;padding:12px 24px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-block;text-decoration:none;color:var(--tx)}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:30px;max-width:340px}
.langs button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.langs button.on{border-color:var(--tx);color:var(--tx)}
.rmode{margin-top:18px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut);font-family:'JetBrains Mono'}
.rmode button{padding:5px 9px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-family:'JetBrains Mono'}
.rmode button.on{background:var(--ui3);color:var(--tx);border-color:var(--mut)}
.rmode button[disabled]{opacity:.3}
.howto{margin-top:22px;max-width:300px;font-size:13px;color:var(--mut);line-height:1.9}
.clrT{font-weight:900;font-size:clamp(38px,11vw,52px);letter-spacing:.04em;animation:clrIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes clrIn{0%{transform:scale(1.6);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
.rank{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:72px;line-height:1;margin-top:18px;color:var(--acc);animation:clrIn .6s .25s cubic-bezier(.2,1.4,.4,1) both}
.rank.sss{color:#ffd23d;text-shadow:0 0 24px rgba(255,210,61,.45)}
.stats{margin-top:18px;display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:14px;text-align:left}
.stats dt{color:var(--mut)}
.stats dd{font-family:'JetBrains Mono',ui-monospace,monospace;text-align:right}
.rlist{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rlist div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:54px}
.rlist small{display:block;font-size:10px;color:var(--mut);font-family:'JetBrains Mono'}
.rlist b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px}
.nb{color:#ffd23d;font-weight:700;font-size:13px;margin-top:8px;font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em}
#toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:var(--acc);color:#001a16;font-weight:900;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center;line-height:1.5}
#toast.show{opacity:1}

/* ===== LP (the page being fixed) ===== */
#lp{background:var(--bg);color:var(--fg);font-family:var(--bf);padding:0 20px 44px;width:100%;min-height:100%}
#lp h1,#ghost h1{font-weight:inherit}
.lpe{position:relative;cursor:pointer}
.lp-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px}
.lp-logo{font-family:var(--hf);font-weight:700;font-size:18px}
.lp-burger i{display:block;width:20px;height:2px;background:currentColor;margin:5px 0}
.lp-imgw{margin-top:16px}
.lp-img{aspect-ratio:16/10;overflow:hidden;background:var(--img);border-radius:12px}
.lp-h1{font-family:var(--hf);margin-top:26px;font-size:28px;line-height:1.3;font-weight:700}
.lp-p{margin-top:14px;color:var(--sub);font-size:15px;line-height:1.8}
.lp-cardsw{margin-top:24px}
.lp-cards{display:flex;gap:12px}
.lp-card{flex:1;background:var(--card);padding:14px 6px;text-align:center;font-size:12px;font-weight:700;border-radius:12px;line-height:1.4}
.lp-card .ic{width:26px;height:26px;border-radius:50%;background:var(--acc);margin:0 auto 8px;opacity:.9}
.lp-card:nth-child(2) .ic{border-radius:6px}
.lp-card:nth-child(3) .ic{border-radius:50% 50% 6px 50%}
.lp-btnw{margin-top:28px;text-align:center}
.lp-btn{display:inline-block;background:var(--acc);color:var(--btnfg);padding:14px 32px;font-weight:700;font-size:15px;text-decoration:none;border-radius:12px}
.lp-badgew{margin-top:24px;text-align:center}
.lp-badge{display:inline-block;padding:6px 16px;border:1px solid var(--acc);color:var(--acc);font-size:12px;letter-spacing:.1em;border-radius:999px;font-weight:700}
.lp-price{margin-top:28px;text-align:center}
.lp-num{font-family:var(--hf);font-size:40px;font-weight:700;color:var(--acc);line-height:1.2}
.lp-cap{font-size:12px;color:var(--sub);margin-top:2px}
.lp-foot{margin-top:48px;font-size:11px;color:var(--sub);text-align:center;line-height:1.8}
/* selection & glitch */
.lpe.sel{outline:2px dashed #00b8a0;outline-offset:4px;border-radius:2px}
.lpe.gl{animation:gj .2s steps(2) infinite;filter:drop-shadow(calc(var(--g)*4px) 0 rgba(255,0,90,.7)) drop-shadow(calc(var(--g)*-4px) 0 rgba(0,200,255,.7))}
.lpe.gl::after{content:'';position:absolute;left:-6px;right:-6px;top:0;bottom:0;pointer-events:none;opacity:calc(var(--g)*.55);mix-blend-mode:difference;
  background:linear-gradient(transparent 0 30%,rgba(0,255,200,.55) 30% 34%,transparent 34% 66%,rgba(255,0,120,.5) 66% 69%,transparent 69%);background-size:100% 260%;animation:gbar .33s steps(3) infinite}
@keyframes gj{0%{transform:translate(calc(var(--g)*-5px),0) skewX(calc(var(--g)*-7deg))}50%{transform:translate(calc(var(--g)*4px),calc(var(--g)*1px))}100%{transform:translate(calc(var(--g)*2px),calc(var(--g)*-1px)) skewX(calc(var(--g)*4deg))}}
@keyframes gbar{0%{background-position:0 0}100%{background-position:0 100%}}
.lpe.fx{animation:fx .5s ease-out}
@keyframes fx{0%{box-shadow:0 0 0 0 rgba(0,224,192,.8)}100%{box-shadow:0 0 0 14px rgba(0,224,192,0)}}
@media (prefers-reduced-motion:reduce){.lpe.gl{animation-duration:.8s}}
</style>
</head>

   const n=3+Math.floor(stageErr()*10);

document.querySelector('.rmode').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||b.disabled)return;mode=b.dataset.m;try{localStorage.setItem('klp_mode',mode)}catch(_){}updateModeBtns()});

/* ================= audio ================= */
let AC=null;
function audioInit(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d,type,vol,when=0,slide){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;
 o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}
function sfx(k,x){if(!AC)return;try{
 if(k==='tick')tone(260+x*900,.05,'square',.04);
 else if(k==='sel')tone(660,.06,'triangle',.08);
 else if(k==='peek')tone(420,.18,'sine',.08,0,840);
 else if(k==='fix'){tone(880,.09,'triangle',.1);tone(1320,.14,'triangle',.08,.07)}
 else if(k==='clear'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.1,i*.08));tone(80,.4,'sawtooth',.05,0,40)}
}catch(e){}}

showTitle();
</script>
