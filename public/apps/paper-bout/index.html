<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="裸電球ひとつのコンクリート地下室で、トイレットペーパー60mを引き出し切る3Dタイムアタック。急げば切れる、止まれば負ける。金属の蓋がカラカラ鳴る。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="uimemocho">
<meta property="og:title" content="紙闘">
<meta property="og:description" content="裸電球ひとつのコンクリート地下室で、トイレットペーパー60mを引き出し切る3Dタイムアタック。急げば切れる、止まれば負ける。金属の蓋がカラカラ鳴る。">
<meta property="og:url" content="https://uimemocho.github.io/apps/paper-bout/">
<meta property="og:image" content="https://uimemocho.github.io/apps/paper-bout/ogp.png">

<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="紙闘">
<meta name="twitter:description" content="裸電球ひとつのコンクリート地下室で、トイレットペーパー60mを引き出し切る3Dタイムアタック。急げば切れる、止まれば負ける。金属の蓋がカラカラ鳴る。">
<meta name="twitter:image" content="https://uimemocho.github.io/apps/paper-bout/ogp.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>紙闘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-bleed WebGL basement, HUD plates taped on top, menus as dark slabs centered */
:root{
  --void:#0b0b0c;
  --slab:rgba(14,14,15,.84);
  --bone:#e9e4d8;
  --ash:#9b978d;
  --line:rgba(233,228,216,.16);
  --tape:#d8cfae;
  --p1:#6d9be0;
  --p2:#d23b32;
  --warn:#e3a31b;
  --f-disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP","PingFang SC","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","PingFang SC","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  --f-hand:"Permanent Marker","Chakra Petch",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--bone);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#c{display:block;width:100%;height:100%;touch-action:none}
.fx{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(130% 95% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.32) 85%,rgba(0,0,0,.55) 100%)}
#grain{opacity:.13;mix-blend-mode:overlay;background-size:180px 180px;animation:grain .35s steps(3) infinite}
@keyframes grain{0%{background-position:0 0}33%{background-position:-61px 37px}66%{background-position:43px -71px}100%{background-position:0 0}}

/* HUD sits below the viewer's own top controls (about 52px under the status bar);
   the camera is framed so the roll always lands below it */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:8px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 54px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{--pc:var(--bone);position:relative;flex:1 1 0;min-width:0;max-width:320px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;row-gap:7px;
  padding:9px 12px 10px;background:linear-gradient(180deg,rgba(20,19,18,.86),rgba(10,10,10,.86));border:1px solid var(--line);border-top:2px solid var(--pc);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ph[data-c="1"]{--pc:var(--p1)}.ph[data-c="2"]{--pc:var(--p2)}
#hud.solo .ph{--pc:var(--bone)}
.tag{font-family:var(--f-hand);font-size:14px;line-height:1;color:#1b1a17;background:var(--tape);padding:5px 8px 4px;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.5);clip-path:polygon(2% 8%,98% 0,100% 92%,0 100%);justify-self:start}
.clock{font-family:var(--f-num);font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap;justify-self:center;color:var(--bone)}
.clock .s{font-size:34px;letter-spacing:.01em}
.clock .cs{font-size:20px;color:var(--ash)}
.remv{justify-self:end;text-align:right;line-height:1;white-space:nowrap}
.remv b{font-family:var(--f-num);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--bone)}
.remv span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--ash);margin-top:3px}
/* tape-measure ruler: small tick every 5 m, tall tick every 10 m of the 60 m roll */
.ruler{grid-column:1/-1;position:relative;height:9px;background:rgba(233,228,216,.07);overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--pc);opacity:.9;transform-origin:left;will-change:transform}
.ruler::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.75) 0 1px,transparent 1px 8.3333%) left bottom/100% 3px no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.85) 0 1.5px,transparent 1.5px 16.6667%) left top/100% 100% no-repeat}
#hud.vs .clock .s{font-size:27px}#hud.vs .clock .cs{font-size:16px}
#hud.vs .remv b{font-size:14px}#hud.vs .ph{padding:8px 9px 9px;column-gap:7px}#hud.vs .tag{font-size:12px}
@media (max-width:380px){#hud.vs .remv{display:none}#hud.vs .ph{grid-template-columns:auto 1fr}}
/* tension gauge stands beside each roll in the scene */
.tg{position:absolute;left:0;top:0;width:14px;pointer-events:none;display:grid;grid-template-rows:auto 1fr;gap:5px;justify-items:center}
.tg .tl{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ash);white-space:nowrap;text-shadow:0 1px 2px #000}
.tg .tt{position:relative;width:6px;height:100%;background:rgba(10,10,10,.7);outline:1px solid rgba(233,228,216,.22);overflow:hidden}
.tg .tt i{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--ash);transform-origin:bottom;transform:scaleY(0)}
.tg .tt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),rgba(233,228,216,.35) calc(25% - 1px) 25%)}
.tg.hot .tt i{background:var(--warn)}
.tg.crit .tt i{background:var(--p2);animation:blink .12s steps(2) infinite}
.tg.crit .tl{color:var(--p2)}
@keyframes blink{50%{opacity:.35}}
.popw{position:absolute;left:0;top:0;pointer-events:none}
.pop{display:block;transform:rotate(-3deg);white-space:nowrap;font-family:var(--f-disp);font-size:22px;color:var(--bone);background:var(--p2);padding:6px 12px 5px;box-shadow:0 4px 14px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.pop small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.06em;opacity:.9;margin-top:2px;text-align:center}
.pop.ok{background:var(--bone);color:#141311}
@keyframes pop{from{transform:rotate(-3deg) scale(.4);opacity:0}}

#corner{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;z-index:5}
.mini{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--bone);background:var(--slab);border:1px solid var(--line);border-radius:3px;padding:8px 11px;display:flex;align-items:center;gap:6px;cursor:pointer}
.mini svg{width:14px;height:14px}
.mini:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

.hint{position:absolute;left:0;top:0;pointer-events:none;display:grid;justify-items:center;opacity:.95}
.hint svg{width:34px;height:20px;animation:down 1s ease-in infinite;opacity:0}
.hint svg:nth-child(2){animation-delay:.18s}.hint svg:nth-child(3){animation-delay:.36s}
@keyframes down{0%{opacity:0;transform:translateY(-12px)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

#center{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);display:grid;place-items:center;pointer-events:none}
#center span{font-family:var(--f-disp);font-size:clamp(110px,36vw,220px);line-height:1;color:#f4f1ea;transform:skewX(-7deg);text-shadow:0 0 40px rgba(255,190,120,.3),6px 6px 0 rgba(0,0,0,.65);animation:cd .55s cubic-bezier(.2,1.4,.3,1)}
#center span.go{font-size:clamp(70px,22vw,150px);color:var(--p2);letter-spacing:-.02em;text-shadow:0 0 50px rgba(210,59,50,.6),6px 6px 0 #000;animation:fight .7s cubic-bezier(.15,1.6,.3,1)}
@keyframes cd{from{transform:skewX(-7deg) scale(2.2);opacity:0;filter:blur(6px)}}
@keyframes fight{0%{transform:skewX(-7deg) scale(3);opacity:0}60%{transform:skewX(-7deg) scale(.92)}}
#hud{transition:opacity .35s}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;text-align:center;overflow-y:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 34px) calc(env(safe-area-inset-bottom,0px) + 64px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to bottom,rgba(8,8,9,.78),rgba(8,8,9,.2) 34%,rgba(8,8,9,0) 50%,rgba(8,8,9,.55) 72%,rgba(8,8,9,.9))}
.titleblock{display:grid;justify-items:center;gap:0;margin-top:4vh}
.spec{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.32em;color:var(--ash);text-transform:uppercase}
.logo{display:block;margin:0 auto;font-family:var(--f-disp);font-weight:400;font-size:clamp(88px,28vw,172px);line-height:1;letter-spacing:-.02em;color:#f4f1ea;text-shadow:0 0 50px rgba(255,190,130,.16),0 4px 0 #000}
.cdhow{margin:14px 0 0;max-width:30ch;font-size:13px;line-height:1.7;font-weight:700;color:var(--bone);opacity:.8;text-align:center;text-wrap:balance;text-shadow:0 1px 3px #000}
.latin{font-family:var(--f-num);font-weight:600;font-size:clamp(13px,3.6vw,18px);letter-spacing:.9em;margin-right:-.9em;color:#fff;line-height:1;margin-top:16px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
h1 rt{font-family:var(--f-body);font-weight:700;font-size:.13em;letter-spacing:.6em;color:var(--ash);text-shadow:none}
h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(64px,19vw,128px);line-height:.95;letter-spacing:.02em;color:var(--bone);text-wrap:balance;text-shadow:0 0 40px rgba(255,180,110,.18),0 3px 0 #000}
.roman{font-family:var(--f-hand);font-size:16px;color:#1b1a17;background:var(--tape);padding:5px 12px 3px;transform:rotate(-2.5deg);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.sub{font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--bone);opacity:.85;max-width:30ch;text-wrap:balance;margin:0}
.panel{width:min(400px,100%);display:grid;gap:10px}
.btn{appearance:none;width:100%;min-height:54px;border-radius:3px;border:1px solid var(--line);background:var(--slab);color:var(--bone);font-family:var(--f-body);font-weight:900;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:0 16px}
.btn.primary{background:var(--bone);color:#121110;border-color:var(--bone)}
.btn[disabled]{opacity:.4;cursor:default}
.btn .dots{display:inline-flex;gap:4px}
.btn .dots i{width:9px;height:9px;border-radius:50%}
.btn:active{transform:translateY(1px)}
.dhead{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ash);text-align:center;margin-bottom:2px}
.dbtn{justify-content:space-between;padding:0 18px}
.dbtn small{font-family:var(--f-num);font-weight:600;font-size:12px;color:var(--ash);letter-spacing:.04em}
.dbtn[aria-current="true"]{border-color:var(--tape)}
.dbtn[aria-current="true"]{box-shadow:inset 3px 0 0 var(--tape)}
.btn.ghost{background:transparent;min-height:44px;font-size:14px;color:var(--ash)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:-2px}
.chip{appearance:none;min-height:36px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ash);font-family:var(--f-body);font-weight:700;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{color:#121110;background:var(--tape);border-color:var(--tape)}
.how{font-size:12.5px;line-height:1.7;color:var(--ash);max-width:34ch;margin:2px auto 0;text-wrap:balance}
.best{font-family:var(--f-num);font-size:12px;letter-spacing:.12em;color:var(--ash)}
.best b{color:var(--bone);font-weight:700;font-variant-numeric:tabular-nums}
.foot{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
select{appearance:none;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--bone);background:var(--slab);border:1px solid var(--line);border-radius:3px;padding:8px 26px 8px 11px;background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat}

/* room */
#room{justify-content:center}
.card{width:min(400px,100%);display:grid;gap:12px;background:var(--slab);border:1px solid var(--line);border-radius:4px;padding:22px 18px 18px}
.card h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.1;text-wrap:balance}
.code{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.code input{width:100%;box-sizing:border-box;height:64px;text-align:center;font-family:var(--f-num);font-weight:700;font-size:34px;color:var(--bone);background:rgba(233,228,216,.06);border:1px solid var(--line);border-radius:3px;caret-color:var(--warn)}
.roomno{font-family:var(--f-num);font-weight:700;font-size:44px;letter-spacing:.18em;font-variant-numeric:tabular-nums;color:var(--bone)}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--ash)}
.status{font-size:13px;line-height:1.6;color:var(--ash);min-height:1.6em;text-wrap:balance}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seat{border:1px solid var(--line);border-radius:3px;padding:10px;display:grid;gap:6px;justify-items:center}
.seat .st{font-size:12px;font-weight:700;color:var(--ash)}
.seat.on .st{color:var(--bone)}
.seat.rdy{border-color:var(--bone)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#result{justify-content:center}
.rank{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;text-align:left;padding:14px 12px;border-block:1px solid var(--line)}
.rl{font-family:var(--f-disp);font-size:clamp(56px,17vw,84px);line-height:.9;color:transparent;-webkit-text-stroke:2px #f4f1ea;transform:skewX(-8deg);letter-spacing:-.04em;min-width:1.1em;text-align:center}
.rank.top .rl{color:#f4f1ea;-webkit-text-stroke:0;text-shadow:0 0 24px rgba(210,59,50,.55)}
.rn{display:grid;gap:4px;min-width:0}
.rn b{font-weight:900;font-size:clamp(20px,6vw,26px);line-height:1.2;color:#fff;text-wrap:balance}
.rn em{font-style:normal;font-size:12.5px;line-height:1.6;color:var(--ash);text-wrap:balance}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.badge{font-family:var(--f-hand);font-size:13px;line-height:1;color:#1b1a17;background:var(--tape);padding:4px 8px 3px;transform:rotate(-2deg)}
.badge.rec{background:var(--p2);color:#fff;font-family:var(--f-body);font-weight:900;font-size:11px;padding:5px 8px 4px}
a.btn{text-decoration:none}
.three{display:grid;grid-template-columns:1.5fr 1fr .8fr;gap:8px}
.three .btn{font-size:14px;padding:0 10px;min-height:48px}
.shot{margin:0;justify-self:center;width:min(220px,58vw);aspect-ratio:4/5;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6);transform:rotate(-1.5deg);border:1px solid var(--line)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
#shareStatus:empty{display:none}
.rows{display:grid;gap:8px;text-align:left}
.rrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:3px}
.rrow.win{border-color:var(--bone);background:rgba(233,228,216,.06)}
.rrow .rt{font-family:var(--f-num);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;text-align:right}
.rrow .rs{font-size:11px;color:var(--ash);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){#grain,.hint svg,.bar.ten.crit i{animation:none}.hint svg{opacity:.8}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="fx" id="vig"></div>
  <div class="fx" id="grain"></div>
  <div id="hints"></div>
  <div id="hud" hidden></div>
  <div id="center"></div>

  <section class="screen" id="title">
    <div class="titleblock">
      <h1 class="logo">紙闘</h1>
      <div class="latin" lang="en">SHI · TŌ</div>
    </div>
    <div class="panel" id="diffPanel" hidden>
      <div class="dhead">CPUの強さ</div>
      <button class="btn dbtn" type="button" id="dEasy" data-d="easy"><b>やさしい</b><small>約47秒で出し切る</small></button>
      <button class="btn dbtn" type="button" id="dNormal" data-d="normal"><b>ふつう</b><small>約33秒で出し切る</small></button>
      <button class="btn dbtn" type="button" id="dHard" data-d="hard"><b>つよい</b><small>約24秒で出し切る</small></button>
      <button class="btn ghost" type="button" id="bDiffBack">戻る</button>
    </div>
    <div class="panel" id="mainPanel">
      <button class="btn primary" id="bSolo" type="button"><span data-i="solo"></span></button>
      <button class="btn" id="bCpu" type="button"><span data-i="cpu"></span></button>
      <button class="btn" id="bOnline" type="button"><span class="dots"><i style="background:var(--p1)"></i><i style="background:var(--p2)"></i></span><span data-i="online"></span></button>
      <div class="best"><span data-i="best"></span> <b id="bestT">--.--</b></div>
    </div>
  </section>

  <section class="screen" id="room" hidden>
    <div class="card" id="roomEntry">
      <h2 data-i="roomTitle"></h2>
      <div class="lbl" data-i="roomHint"></div>
      <div class="code" id="codeBox">
        <input id="c0" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="1">
        <input id="c1" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="2">
        <input id="c2" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="3">
        <input id="c3" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="4">
      </div>
      <div class="two">
        <button class="btn primary" id="bJoin" type="button" data-i="join"></button>
        <button class="btn" id="bCreate" type="button" data-i="create"></button>
      </div>
      <div class="status" id="entryStatus"></div>
      <button class="btn" id="bRoomBack" type="button" data-i="back"></button>
    </div>
    <div class="card" id="roomLobby" hidden>
      <div class="lbl" data-i="roomNo"></div>
      <div class="roomno" id="roomNo">0000</div>
      <div class="seats">
        <div class="seat on" id="seatMe"><span class="tag">YOU</span><span class="st" id="stMe"></span></div>
        <div class="seat" id="seatOpp"><span class="tag">RIVAL</span><span class="st" id="stOpp"></span></div>
      </div>
      <div class="status" id="lobbyStatus"></div>
      <button class="btn primary" id="bReady" type="button" data-i="ready"></button>
      <button class="btn" id="bLeave" type="button" data-i="leave"></button>
    </div>
  </section>

  <section class="screen" id="result" hidden>
    <div class="card res">
      <h2 id="rHead"></h2>
      <div class="rank" id="rRank" hidden>
        <div class="rl" id="rLetter">S</div>

function stepPlayer(p,dt,now){
 if(p.ctrl==='remote'){stepRemote(p,dt,now);return;}
 const I=.5+1.0*Math.pow(p.r/RMAX,2),pv=p.v;
 const coast=()=>{const a=p.v;const dec=(.5+.6*a+.45)*dt/I;p.v=Math.max(0,a-dec);};
 if(p.state==='race'){
  if(p.ctrl==='cpu')cpuThink(p,dt,now);
  const tc=p.touch;let active=tc.active,vf=tc.vf;
  if(p.kb>0){p.kb-=dt;active=true;vf=2.75;}
  if(active){if(p.ctrl==='human'&&p.kb<=0&&now-tc.lastMove>55)tc.vf*=Math.exp(-dt*14);p.v+=(Math.max(0,vf)-p.v)*(1-Math.exp(-dt*13/I));}else coast();
  p.v=clamp(p.v,0,8);

  const T=Math.pow(p.v/VLIM,2)+Math.max(0,p.accS)*I/36;

 }else if(p.state==='torn'){p.v*=Math.exp(-dt*22);p.tornT-=dt;if(p.tornT<=0){p.state='race';p.touch.vf=0;p.touch.active=false;}}
 else coast();
 p.out+=p.v*dt;
 if(p.out>=p.L){p.out=p.L;if(p.state==='race'||p.state==='torn')finishIt(p,now);}
 if(p.state==='race'||p.state==='torn')p.time=(now-raceStart)/1000;
 commonStep(p,dt);}
function commonStep(p,dt){p.r=rollR(p.L-p.out);p.angle+=p.v/p.r*dt;if(p.state==='done')p.fallT+=dt;
 // cover: rests on the roll, kicked up by the roll's lumps, lands with a tap
 const w=p.v/p.r;p.rattleAcc+=w*dt*(.7+Math.random()*.6);
 if(p.rattleAcc>2.6){p.rattleAcc=Math.random()*.6;if(p.out<p.L)p.cbv-=(.12+Math.random()*.32)*Math.min(1,w/40);}
 p.cbv+=(-1500*p.cb-10*p.cbv)*dt;p.cb+=p.cbv*dt;
 if(p.cb>0){const imp=p.cbv;p.cb=0;p.cbv=-p.cbv*.35;if(imp>.03)coverTap(p,imp);}
 p.cb=Math.max(p.cb,-.05);}
function stepRemote(p,dt,now){const r=p.remote;
 if(r){const tgt=clamp(+r.out||OUT0,OUT0,p.L);const vt=clamp(+r.v||0,0,8);const err=tgt-p.out;p.v=Math.max(0,vt+err*6);p.out=Math.min(p.L,p.out+p.v*dt);p.meter=clamp(+r.meter||0,0,1);
  const rt=Math.max(0,r.tears|0);while(p.remTears<rt){p.remTears++;tearIt(p,false);}
  if(r.st==='torn'&&p.state==='race')p.state='torn';else if(r.st==='race'&&p.state==='torn')p.state='race';
  if(typeof r.fin==='number'&&p.fin==null&&phase==='race'){p.out=p.L;p.fin=r.fin;p.time=r.fin;p.state='done';showPop(p,tr('done'),null,true);if(players.filter(q=>q.fin!=null).length===1)sfxFinish();checkAllDone();}
 }else p.v*=Math.exp(-dt*4);
 if((p.state==='race'||p.state==='torn')&&phase==='race')p.time=(now-raceStart)/1000;
 commonStep(p,dt);}
function cpuThink(p,dt,now){const c=p.cpu,d=DIFF[diff];c.t-=dt;const tc=p.touch;tc.lastMove=now;
 if(c.phase==='stroke'){tc.active=true;tc.vf=c.vs;if(c.t<=0){c.phase='gap';c.t=d.gap*(.75+Math.random()*.5);tc.active=false;}}
 else{tc.active=false;if(c.t<=0){c.phase='stroke';c.t=.12+Math.random()*.05;let vs=VLIM*d.skill*(.9+Math.random()*.22);if(p.meter>d.care)vs*=.62;c.vs=vs;}}}
function tearIt(p,penalty){if(penalty){p.state='torn';p.tornT=1.8;p.tears++;p.meter=0;p.touch.active=false;p.touch.vf=0;}

 const s=p.slot;s.pts.visible=true;s.pT=1.2;const a=s.pts.geometry.attributes.position.array;const y=YC-(mcRoll-m),z=ZC+p.r+.01;for(let k=0;k<s.NP;k++){a[k*3]=p.x0+(Math.random()-.5)*PW;a[k*3+1]=y+(Math.random()-.5)*.01;a[k*3+2]=z;s.pv[k*3]=(Math.random()-.5)*.35;s.pv[k*3+1]=Math.random()*.5;s.pv[k*3+2]=.1+Math.random()*.4;}
 sfxTear(p);showPop(p,tr('torn'),tr('pick'),false);}

/* ---- room over public MQTT brokers (used outside claude.ai): first digit of the code picks the broker ---- */
const MQ_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
class MiniMQTT{constructor(url){this.url=url;this.ws=null;this.buf=new Uint8Array(0);this.onmessage=null;this.onclose=null;this.ping=null;this.byUs=false;}
 static str(s){const b=new TextEncoder().encode(s),o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;}
 static vl(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return new Uint8Array(o);}
 static cat(a){const L=a.reduce((x,y)=>x+y.length,0),o=new Uint8Array(L);let k=0;a.forEach(x=>{o.set(x,k);k+=x.length;});return o;}
 static pkt(type,...parts){const b=MiniMQTT.cat(parts),r=MiniMQTT.vl(b.length),o=new Uint8Array(1+r.length+b.length);o[0]=type;o.set(r,1);o.set(b,1+r.length);return o;}
 connect(id,willTopic,willPayload,ms){return new Promise((res,rej)=>{let done=false;const fail=e=>{if(!done){done=true;try{this.ws.close()}catch(_){}rej(e);}};const tm=setTimeout(()=>fail(new Error('timeout')),ms||6000);
  let ws;try{ws=new WebSocket(this.url,'mqtt');}catch(e){clearTimeout(tm);rej(e);return;}this.ws=ws;ws.binaryType='arraybuffer';
  ws.onerror=()=>fail(new Error('ws'));ws.onclose=()=>{clearInterval(this.ping);if(!done)fail(new Error('closed'));else if(!this.byUs&&this.onclose)this.onclose();};
  ws.onopen=()=>{const w=MiniMQTT.str(willPayload);ws.send(MiniMQTT.pkt(0x10,MiniMQTT.str('MQTT'),Uint8Array.of(4),Uint8Array.of(0x06),Uint8Array.of(0,60),MiniMQTT.str(id),MiniMQTT.str(willTopic),w));};
  ws.onmessage=ev=>{this.buf=MiniMQTT.cat([this.buf,new Uint8Array(ev.data)]);let p;while((p=this.read())!==null){const t=p[0]>>4;
   if(t===2){if(p[3]===0){if(!done){done=true;clearTimeout(tm);this.ping=setInterval(()=>{try{this.ws.send(Uint8Array.of(0xC0,0))}catch(_){}},25000);res();}}else fail(new Error('connack'));}
   else if(t===3)this.pub(p);}};});}
 read(){if(this.buf.length<2)return null;let rl=0,m=1,i=1;for(;;){if(i>=this.buf.length)return null;const d=this.buf[i];rl+=(d&127)*m;m*=128;i++;if(!(d&128))break;if(i>5){this.buf=new Uint8Array(0);return null;}}
  const tot=i+rl;if(this.buf.length<tot)return null;const p=this.buf.slice(0,tot);this.buf=this.buf.slice(tot);return p;}
 pub(p){let i=1;while(p[i]&128)i++;i++;const tl=(p[i]<<8)|p[i+1];i+=2;const topic=new TextDecoder().decode(p.slice(i,i+tl));i+=tl;if((p[0]>>1)&3)i+=2;if(this.onmessage)this.onmessage(topic,new TextDecoder().decode(p.slice(i)));}
 sub(t){this.ws.send(MiniMQTT.pkt(0x82,Uint8Array.of(0,1),MiniMQTT.str(t),Uint8Array.of(0)));}
 send(t,s){this.ws.send(MiniMQTT.pkt(0x30,MiniMQTT.str(t),new TextEncoder().encode(s)));}
 close(){this.byUs=true;clearInterval(this.ping);try{this.ws.send(Uint8Array.of(0xE0,0))}catch(_){}try{this.ws.close()}catch(_){}}}
async function mqttRoom(code){const d=parseInt(code[0],10);const bi=((isNaN(d)?1:d)+MQ_BROKERS.length-1)%MQ_BROKERS.length;
 const order=[bi];const id='s'+Math.random().toString(36).slice(2,10),topic='shito/1/'+code;
 const mq=new MiniMQTT(MQ_BROKERS[bi]);await mq.connect('shito-'+id,topic,JSON.stringify({i:id,t:'leave'}),6000);mq.sub(topic);
 let mine={},others=new Map(),subs=[],closed=false,snap=[];
 const rebuild=()=>{snap=[{peer:id,sameTab:true,isMe:true,kind:'viewer',presence:mine},...[...others].map(([k,v])=>({peer:k,sameTab:false,isMe:false,kind:'viewer',presence:v.p}))];};
 const notify=()=>{rebuild();subs.forEach(f=>{try{f({peers:snap})}catch(_){}});};
 const say=()=>{if(!closed)try{mq.send(topic,JSON.stringify({i:id,t:'p',p:mine}));}catch(_){}};
 mq.onmessage=(t,raw)=>{let m;try{m=JSON.parse(raw);}catch(_){return;}if(!m||m.i===id||typeof m.i!=='string')return;
  if(m.t==='leave'){if(others.delete(m.i))notify();return;}
  if(m.t==='p'&&m.p&&typeof m.p==='object'){const fresh=!others.has(m.i);others.set(m.i,{p:m.p,at:Date.now()});if(fresh)say();notify();}};
 mq.onclose=()=>{closed=true;others.clear();notify();};
 const hb=setInterval(()=>{say();let ch=false;const now=Date.now();for(const [k,v] of others)if(now-v.at>9000){others.delete(k);ch=true;}if(ch)notify();},2000);
 rebuild();
 return {presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}mine={...mine};rebuild();say();return Promise.resolve();},
  peers(){return snap;},onPeers(f){subs.push(f);return ()=>{subs=subs.filter(x=>x!==f);};},
  leave(){if(closed)return Promise.resolve();try{mq.send(topic,JSON.stringify({i:id,t:'leave'}));}catch(_){}closed=true;clearInterval(hb);mq.close();return Promise.resolve();}};}

async function joinRoom(code,creating){setEntry(tr('connecting'));$('#bJoin').disabled=$('#bCreate').disabled=true;const lobby=await getLobby();
 let room=null;
 if(lobby){try{room=await lobby.join('kk-'+code);}catch(e){room=null;}}
 /* a new room may move to the next broker when one is down; the code's first digit follows it */
 if(!room){const tries=creating?MQ_BROKERS.length:1;for(let k=0;k<tries&&!room;k++){const c2=k?String(((parseInt(code[0],10)-1+k)%MQ_BROKERS.length)+1)+code.slice(1):code;
  try{room=await mqttRoom(c2);code=c2;}catch(e){room=null;}}
  if(room)code.split('').forEach((ch,k)=>codeInputs[k].value=ch);}
 $('#bJoin').disabled=$('#bCreate').disabled=false;
 if(!room){setEntry(tr('noRoom'));return;}
 if(NET.room&&NET.room!==room)leaveRoom();NET.room=room;NET.code=code;NET.ready=false;NET.lastGo=0;
 NET.offs.push(room.onPeers(()=>onRoomChange()));
 pushPresence({st:'lobby',ready:false,go:0,seed:0,out:OUT0,v:0,meter:0,tears:0,fin:null});
 $('#roomEntry').hidden=true;$('#roomLobby').hidden=false;$('#roomNo').textContent=code;setEntry('');renderLobby();}
function leaveRoom(){NET.offs.forEach(f=>{try{f()}catch(e){}});NET.offs=[];if(NET.room){try{NET.room.leave()}catch(e){}}NET.room=null;NET.ready=false;}
function pushPresence(patch){if(!NET.room)return;NET.room.presence(patch).catch(()=>{});}
function peerList(){if(!NET.room)return [];return NET.room.peers().filter(p=>p.kind==='viewer');}
function oppPeer(){const ps=peerList().filter(p=>!p.sameTab);ps.sort((a,b)=>a.peer<b.peer?-1:1);return ps[0]||null;}
function mySelf(){return peerList().find(p=>p.sameTab)||null;}
function amHost(){const o=oppPeer(),m=mySelf();if(!o||!m)return false;return m.peer<o.peer;}
function isFull(){const ps=peerList();if(ps.length<=2)return false;const sorted=[...ps].sort((a,b)=>a.peer<b.peer?-1:1);const m=mySelf();return m&&sorted.indexOf(m)>1;}
function renderLobby(){if(!NET.room||$('#roomLobby').hidden)return;const o=oppPeer(),op=o?o.presence:{};const full=isFull();

function onRoomChange(){const o=oppPeer(),op=o?o.presence:null;
 if(phase==='room'){renderLobby();if(!o||isFull())return;
  if(amHost()){if(NET.ready&&op.ready&&op.st==='lobby'){NET.go=Math.max(NET.go,NET.lastGo,(op.go|0))+1;const seed=(Math.random()*1e9)>>>0;NET.lastGo=NET.go;NET.ready=false;pushPresence({st:'count',ready:false,go:NET.go,seed,fin:null,tears:0,out:OUT0,v:0,meter:0});startOnline(seed);}}
  else{if(NET.ready&&op.st==='count'&&(op.go|0)>NET.lastGo){NET.lastGo=op.go|0;NET.ready=false;pushPresence({st:'count',ready:false,go:NET.lastGo,fin:null,tears:0,out:OUT0,v:0,meter:0});startOnline(op.seed>>>0);}}
  return;}

  if(!o){if(phase!=='result'&&rp.state!=='done'){rp.state='done';rp.ctrl='idle';showPop(rp,tr('oppLeft'),null,false);rp.popT=3;checkAllDone();}return;}
  rp.remote=op;}}
function startOnline(seed){startGame('online',seed);const o=oppPeer();if(o)players[1].remote=null;}
function sendNet(force){if(gameMode!=='online'||!NET.room)return;const p=players[0];if(!p)return;const t=performance.now();if(!force&&t-NET.lastSend<70)return;NET.lastSend=t;
 pushPresence({st:p.state==='done'?'done':p.state==='torn'?'torn':(phase==='race'?'race':'count'),out:+p.out.toFixed(3),v:+p.v.toFixed(2),meter:+p.meter.toFixed(2),tears:p.tears,fin:p.fin==null?null:+p.fin.toFixed(3)});}
