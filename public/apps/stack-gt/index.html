    <!-- ポップ＆アーケードフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #120929;
            font-family: 'Press Start 2P', 'DotGothic16', monospace;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* ポップ＆ネオンなアーケードボタン */
        .arcade-btn {
            background: linear-gradient(135deg, #ff2e93 0%, #ff6b35 50%, #ffbe0b 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #9d174d, 0 0 22px rgba(255, 46, 147, 0.65);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #9d174d, 0 0 12px rgba(255, 46, 147, 0.55);
        }
        .drift-btn {
            background: linear-gradient(145deg, #ffbe0b 0%, #ff5400 60%, #ff0054 100%);
            border: 3px solid #fff7ed;
            box-shadow: 0 5px 0 #9a1b43, 0 0 18px rgba(255, 84, 0, 0.55);
        }
        .drift-btn.active-touch {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 0 #9a1b43;
            background: linear-gradient(145deg, #fef08a 0%, #fb7185 100%);
        }
        .item-btn {
            background: linear-gradient(145deg, #22d3ee 0%, #06b6d4 55%, #6366f1 100%);
            border: 3px solid #ecfeff;
            box-shadow: 0 5px 0 #312e81, 0 0 16px rgba(34, 211, 238, 0.55);
        }
        .item-btn.active-touch {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 0 #312e81;
        }
        .pop-glass {
            background: linear-gradient(135deg, rgba(24, 16, 56, 0.72), rgba(15, 23, 62, 0.58));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .title-logo {
            transform: skewX(-10deg);
            color: #fefe33;
            -webkit-text-stroke: 1.5px #4a044e;
            text-shadow: 0 4px 0 #831843, 0 0 6px rgba(254, 254, 51, 0.35);
        }
        @keyframes pulsePop {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 46, 147, 0.75)); }
            50% { filter: drop-shadow(0 0 18px rgba(255, 190, 11, 0.95)); }
        }
        .glow-pulse {
            animation: pulsePop 1.3s infinite ease-in-out;
        }
        .course-card {
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
        }
        .course-card.active {
            border-color: #fefe33;
            box-shadow: 0 0 22px rgba(254, 254, 51, 0.55), 0 8px 20px rgba(0, 0, 0, 0.45);
            transform: scale(1.02);
        }
        #result-screen {
            transition: opacity 0.75s ease;
        }
        #result-card {
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.75s ease;
        }
    </style>
</head>
<body class="text-white">
    <!-- ゲーム全体コンテナ -->
    <div id="game-wrapper" class="relative w-full h-full overflow-hidden">
        <!-- メイン描画キャンバス -->
        <canvas id="game-canvas"></canvas>

        <!-- レース中HUDオーバーレイ -->
        <div id="hud" class="hidden absolute inset-0 pointer-events-none flex flex-col justify-between p-3 sm:p-5 z-10">
            <!-- 上段HUD：ポップ＆スタイリッシュ -->
            <div class="flex items-start justify-between gap-2 w-full">
                <!-- 左上：順位・ラップ・スピード -->
                <div class="flex flex-col gap-1.5">
                    <div class="pop-glass flex items-center gap-2.5 border-2 border-cyan-300/60 rounded-2xl px-3 py-1.5 shadow-[0_0_16px_rgba(34,211,238,0.3)]">
                        <span id="hud-rank" class="text-lg sm:text-2xl text-amber-300 drop-shadow-[0_2px_0_rgba(190,24,93,0.9)] leading-none">1st</span>
                        <div class="flex flex-col text-[9px] sm:text-[10px] leading-tight border-l border-white/25 pl-2.5">
                            <span id="hud-lap" class="text-pink-300">LAP 1/3</span>
                            <span id="hud-time" class="text-cyan-100">00:00.0</span>
                        </div>
                    </div>
                    <div id="hud-speed-box" class="pop-glass border border-pink-400/50 rounded-xl px-2.5 py-1 text-[9px] sm:text-[10px] text-cyan-300 w-fit tracking-wider transition-all">
                        <span id="hud-speed">0</span> <span class="text-pink-200 text-[8px]">KM/H</span>
                    </div>
                </div>

                <!-- 中央上：アイテムスロット -->
                <div id="item-slot" class="pop-glass w-12 h-12 sm:w-14 sm:h-14 border-2 border-pink-400/90 rounded-2xl flex items-center justify-center text-xl sm:text-2xl shadow-[0_0_18px_rgba(244,114,182,0.45)]">
                    <span id="hud-item-icon" class="opacity-35 text-xs">---</span>
                </div>

                <!-- 右上：カメラ・サウンド・ミニマップ -->
                <div class="flex flex-col items-end gap-2">
                    <div class="flex gap-1.5 pointer-events-auto">
                        <button id="btn-cam" class="pop-glass border border-cyan-300/60 rounded-xl px-2.5 py-1 text-[9px] text-cyan-100 hover:bg-white/10 active:scale-95 cursor-pointer" title="カメラ切替">
                            3D
                        </button>
                        <button id="btn-sound" class="pop-glass border border-pink-300/60 rounded-xl px-2 py-1 text-[10px] hover:bg-white/10 active:scale-95 cursor-pointer" title="音声切替">
                            <svg viewBox="0 0 24 24" width="12" height="12" style="display:block"><path fill="#fff" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                    <canvas id="minimap-canvas" width="96" height="96" class="pop-glass w-16 h-16 sm:w-20 sm:h-20 border-2 border-white/30 rounded-2xl shadow-lg"></canvas>
                </div>
            </div>

            <!-- 中央アナウンス（カウントダウン・LAP表示など） -->
            <div class="flex flex-col items-center justify-center my-auto">
                <div id="center-banner" class="hidden text-3xl sm:text-5xl text-yellow-300 drop-shadow-[0_4px_0_rgba(190,24,93,0.95)] tracking-wider text-center italic"></div>
                <div id="sub-banner" class="hidden mt-2 text-xs text-white bg-gradient-to-r from-pink-500/85 to-cyan-500/85 px-4 py-1 rounded-full font-['DotGothic16'] shadow-lg"></div>
            </div>

            <!-- 下段HUD：右下にアクションボタンのみ -->
            <div class="flex items-end justify-end w-full pb-1 sm:pb-2">
                <div class="flex items-center gap-2.5 sm:gap-3 pointer-events-auto">
                    <button id="btn-item" class="item-btn w-14 h-14 sm:w-16 sm:h-16 rounded-2xl flex items-center justify-center text-white cursor-pointer">
                        <span id="btn-item-emoji" class="text-xl sm:text-2xl leading-none"><svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path fill="#fde047" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span>
                    </button>
                    <button id="btn-drift" class="drift-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center text-white cursor-pointer">
                        <span class="text-xs sm:text-sm font-bold tracking-wider">DRIFT</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- タイトルオーバーレイ（ポップ＆スタイリッシュ・車体とUIが被らないレイアウト） -->
        <div id="title-screen" class="absolute inset-0 flex flex-col items-center justify-between px-4 sm:px-6 pt-12 sm:pt-16 pb-6 sm:pb-8 z-20 pointer-events-none">
            <!-- 上部：ネオンイエローのロゴ（少し下に配置） -->
            <div class="flex flex-col items-center w-full max-w-md pointer-events-auto mt-2 sm:mt-4">
                <h1 class="title-logo text-4xl sm:text-6xl tracking-wider">
                    STACK GT
                </h1>
            </div>

            <!-- 中央：車体ショーケース用の完全なクリアスペース -->
            <div class="flex-1"></div>

            <!-- 下部：マシン選択（形状＆性能表示）＋スタートボタン -->
            <div class="w-full max-w-xs sm:max-w-sm flex flex-col items-center gap-3 pointer-events-auto">
                <!-- マシン選択＆コンパクト性能パネル -->
                <div class="pop-glass w-full border-2 border-white/25 rounded-2xl px-3.5 py-2.5 shadow-[0_8px_24px_rgba(0,0,0,0.45)] flex flex-col gap-2">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <button data-color="red" class="kart-color-btn w-7 h-7 rounded-full bg-gradient-to-br from-rose-400 to-pink-600 border-2 border-white ring-2 ring-yellow-300 cursor-pointer transition-transform active:scale-90" title="APEX GT"></button>
                            <button data-color="blue" class="kart-color-btn w-7 h-7 rounded-full bg-gradient-to-br from-cyan-300 to-blue-600 border-2 border-white/40 cursor-pointer transition-transform active:scale-90" title="AERO F1"></button>
                            <button data-color="green" class="kart-color-btn w-7 h-7 rounded-full bg-gradient-to-br from-lime-300 to-emerald-600 border-2 border-white/40 cursor-pointer transition-transform active:scale-90" title="RALLY-Z"></button>
                            <button data-color="yellow" class="kart-color-btn w-7 h-7 rounded-full bg-gradient-to-br from-yellow-200 to-amber-500 border-2 border-white/40 cursor-pointer transition-transform active:scale-90" title="HYPER-V"></button>
                        </div>
                        <div class="text-right">
                            <div id="machine-name" class="text-[10px] sm:text-xs text-yellow-300 tracking-wider">APEX GT</div>

                        </div>
                    </div>

                    <!-- 3項目スペックバー -->
                    <div class="grid grid-cols-3 gap-2 text-[8px] text-white/80">
                        <div class="flex flex-col gap-1">
                            <span>SPD</span>
                            <div class="h-1.5 bg-white/15 rounded-full overflow-hidden">
                                <div id="stat-spd" class="h-full bg-gradient-to-r from-pink-500 to-yellow-300 rounded-full transition-all duration-200" style="width: 75%"></div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span>ACC</span>
                            <div class="h-1.5 bg-white/15 rounded-full overflow-hidden">
                                <div id="stat-acc" class="h-full bg-gradient-to-r from-cyan-400 to-emerald-300 rounded-full transition-all duration-200" style="width: 70%"></div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span>HDL</span>
                            <div class="h-1.5 bg-white/15 rounded-full overflow-hidden">
                                <div id="stat-hdl" class="h-full bg-gradient-to-r from-violet-400 to-pink-400 rounded-full transition-all duration-200" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="btn-start" class="arcade-btn glow-pulse w-full py-3.5 sm:py-4 rounded-2xl text-base sm:text-lg text-white tracking-widest cursor-pointer">

            </div>
        </div>

            <div class="w-full max-w-md flex items-center justify-between">
                <button id="btn-course-back" class="pop-glass border border-white/30 rounded-xl px-3 py-2 text-[10px] text-cyan-200 active:scale-95 cursor-pointer">

                <div class="w-14"></div>

            <div class="w-full max-w-md flex flex-col gap-3 my-auto py-3">

        // ============================================================================
        // 1. サウンドエンジン（Web Audio APIによるシンセ効果音＆爽快レースBGM）
        // ============================================================================
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.engineOsc = null;
                this.engineGain = null;
                this.bgmTimer = null;
                this.bgmStep = 0;
                this.bgmPlaying = false;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!AudioCtx) return;
                        this.ctx = new AudioCtx();
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    if (!this.engineOsc && this.ctx) {
                        this.engineOsc = this.ctx.createOscillator();
                        this.engineGain = this.ctx.createGain();
                        this.engineOsc.type = 'sawtooth';
                        this.engineOsc.frequency.value = 68;
                        this.engineGain.gain.value = 0;

                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.value = 360;

                        this.engineOsc.connect(filter);
                        filter.connect(this.engineGain);
                        this.engineGain.connect(this.ctx.destination);
                        this.engineOsc.start();
                    }
                } catch (e) {}
            }

            // 爽快感あるアップテンポ・アーケードレースBGM（コースごとに少しピッチを変化）
            startBgm(pitchMult = 1.0) {
                this.init();
                this.stopBgm();
                this.bgmPlaying = true;
                this.bgmStep = 0;

                const stepMs = (60 / 148 / 4) * 1000;
                const melody = [
                    523.25, 0, 659.25, 0, 783.99, 0, 659.25, 783.99,
                    880.00, 0, 783.99, 659.25, 587.33, 0, 659.25, 0,
                    698.46, 0, 880.00, 0, 1046.50, 0, 880.00, 783.99,
                    659.25, 783.99, 880.00, 987.77, 1046.50, 0, 783.99, 0
                ];
                const bass = [
                    130.81, 130.81, 261.63, 130.81, 130.81, 130.81, 261.63, 130.81,
                    110.00, 110.00, 220.00, 110.00, 110.00, 110.00, 220.00, 110.00,
                    174.61, 174.61, 349.23, 174.61, 174.61, 174.61, 349.23, 174.61,
                    196.00, 196.00, 392.00, 196.00, 196.00, 246.94, 293.66, 392.00
                ];
                const arp = [
                    523.25, 659.25, 783.99, 1046.50,
                    440.00, 523.25, 659.25, 880.00,
                    349.23, 440.00, 523.25, 698.46,
                    392.00, 493.88, 587.33, 783.99
                ];

                const playStep = () => {
                    if (!this.bgmPlaying) return;
                    if (!this.muted && this.ctx && this.ctx.state === 'running') {
                        const now = this.ctx.currentTime;
                        const s = this.bgmStep % 32;

                        if (s % 4 === 0) {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(145, now);
                            osc.frequency.exponentialRampToValueAtTime(38, now + 0.09);
                            gain.gain.setValueAtTime(0.11, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.11);
                        }

                        if (s % 2 === 1) {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(s % 4 === 2 ? 2600 : 5400, now);
                            gain.gain.setValueAtTime(0.015, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.024);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.03);
                        }

                        const bFreq = bass[s] * pitchMult;
                        if (bFreq > 0) {
                            const osc = this.ctx.createOscillator();
                            const filter = this.ctx.createBiquadFilter();
                            const gain = this.ctx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(bFreq, now);
                            filter.type = 'lowpass';
                            filter.frequency.setValueAtTime(680, now);
                            gain.gain.setValueAtTime(0.044, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                            osc.connect(filter);
                            filter.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.095);
                        }

                        const chordIdx = Math.floor(s / 8);
                        const aFreq = arp[chordIdx * 4 + (s % 4)] * pitchMult;
                        if (aFreq) {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(aFreq, now);
                            gain.gain.setValueAtTime(0.025, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.09);
                        }

                        const mFreq = melody[s] * pitchMult;
                        if (mFreq > 0) {
                            const osc = this.ctx.createOscillator();
                            const filter = this.ctx.createBiquadFilter();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(mFreq, now);
                            filter.type = 'lowpass';
                            filter.frequency.setValueAtTime(2400, now);
                            gain.gain.setValueAtTime(0.038, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                            osc.connect(filter);
                            filter.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.17);
                        }
                    }
                    this.bgmStep++;
                };

                playStep();
                this.bgmTimer = setInterval(playStep, stepMs);
            }

            stopBgm() {
                this.bgmPlaying = false;
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }

            updateEngine(speedRatio, isBoosting, isActive) {
                if (!this.ctx || !this.engineOsc || !this.engineGain) return;
                const now = this.ctx.currentTime;
                if (this.muted || !isActive) {
                    this.engineGain.gain.setTargetAtTime(0, now, 0.05);
                    return;
                }
                const targetFreq = 60 + speedRatio * 150 + (isBoosting ? 65 : 0);
                this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.06);
                this.engineGain.gain.setTargetAtTime(0.03, now, 0.08);
            }

            playBeep(freq = 440, duration = 0.12, type = 'square', vol = 0.08) {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {}
            }

            playBoost() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);

                    gain.gain.setValueAtTime(0.095, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch (e) {}
            }

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } catch (e) {}
            }

            }
        }

        function buildSpriteStack(layerStrings, palette) {
            return layerStrings.map(rows => {
                const h = rows.length;
                const w = rows[0].length;
                const c = document.createElement('canvas');
                c.width = w;
                c.height = h;
                const cctx = c.getContext('2d');
                for (let y = 0; y < h; y++) {
                    const row = rows[y];
                    for (let x = 0; x < w; x++) {
                        const ch = row[x];
                        if (ch !== '.' && palette[ch]) {
                            cctx.fillStyle = palette[ch];
                            cctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
                return c;
            });

        function drawSpriteStack(ctx, stack, screenX, screenY, angle, scale = 2.6, layerSpacing = 1.6, liftZ = 0, squashY = 1.0) {
            const first = stack[0];
            const drawW = first.width * scale;
            const drawH = first.height * scale;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.fillStyle = 'rgba(10, 6, 30, 0.38)';
            ctx.beginPath();
            ctx.ellipse(0, 2, drawW * 0.44, drawH * 0.36 * squashY, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            for (let i = 0; i < stack.length; i++) {
                const yOffset = screenY - liftZ - i * layerSpacing;
                ctx.save();
                ctx.translate(screenX, yOffset);
                if (squashY !== 1.0) {
                    ctx.scale(1, squashY);
                }
                ctx.rotate(angle);
                ctx.drawImage(stack[i], -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();
            }
        }

                mountainColor: '#ea580c',
                cityColor: '#9a3412',
                fogColor: 'rgba(251, 146, 60, 0.45)',
                groundBase: '#f97316',
                groundAlt: '#ea580c',
                runoffColor: '#fde047',
                curbA: '#ffffff',
                curbB: '#06b6d4',
                roadOuter: '#475569',
                roadInner: '#334155',
                centerLine: 'rgba(253, 224, 71, 0.8)',
                outerColor32A: 0xff1658c2,
                outerColor32B: 0xff1c68d8,
                // ダイナミックな連続S字＆ビッグバンク
                controlPoints: [
                    { x: 460,  y: 1620 },
                    { x: 340,  y: 1120 },
                    { x: 680,  y: 880  },

        };

        let selectedCourseId = 'coast';
        let currentCourse = COURSES.coast;
        let ROAD_HALF_WIDTH = currentCourse.roadHalfWidth;
        let WAYPOINTS = [];
        let START_POS = { x: 0, y: 0 };
        let START_ANGLE = 0;
        let BOOST_PADS = [];
        let STATIC_PROPS = [];

        function buildTrackWaypoints(points, samplesPerSegment = 24) {
            const result = [];
            const n = points.length;
            for (let i = 0; i < n; i++) {
                const p0 = points[(i - 1 + n) % n];
                const p1 = points[i];
                const p2 = points[(i + 1) % n];
                const p3 = points[(i + 2) % n];
                for (let j = 0; j < samplesPerSegment; j++) {
                    const t = j / samplesPerSegment;
                    const t2 = t * t;
                    const t3 = t2 * t;
                    const x = 0.5 * (
                        (2 * p1.x) +
                        (-p0.x + p2.x) * t +
                        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
                    );
                    const y = 0.5 * (
                        (2 * p1.y) +
                        (-p0.y + p2.y) * t +
                        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
                    );
                    result.push({ x, y });
                }
            }
            return result;
        }

        function findNearestWaypoint(x, y) {
            let bestIdx = 0;
            let bestDistSq = Infinity;
            for (let i = 0; i < WAYPOINTS.length; i++) {
                const dx = x - WAYPOINTS[i].x;
                const dy = y - WAYPOINTS[i].y;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestDistSq) {
                    bestDistSq = d2;
                    bestIdx = i;
                }
            }
            return { index: bestIdx, dist: Math.sqrt(bestDistSq) };
        }

        const trackCanvas = document.createElement('canvas');
        trackCanvas.width = WORLD_SIZE;
        trackCanvas.height = WORLD_SIZE;
        let trackPixels32 = null;

        const groundCanvas = document.createElement('canvas');
        groundCanvas.width = 240;
        groundCanvas.height = 160;
        const groundCtx = groundCanvas.getContext('2d');
        let groundImgData = groundCtx.createImageData(groundCanvas.width, groundCanvas.height);
        let groundPixels32 = new Uint32Array(groundImgData.data.buffer);

        /**
         * 選択コースのウェイポイント・プロップ・テクスチャをすべて構築
         */
        function loadCourse(courseId) {
            selectedCourseId = courseId;
            currentCourse = COURSES[courseId] || COURSES.coast;
            ROAD_HALF_WIDTH = currentCourse.roadHalfWidth;

            WAYPOINTS = buildTrackWaypoints(currentCourse.controlPoints, 22);
            START_POS = WAYPOINTS[0];
            const startNext = WAYPOINTS[1];
            START_ANGLE = Math.atan2(startNext.y - START_POS.y, startNext.x - START_POS.x) + Math.PI / 2;

            // ダッシュパネル配置（コースごとに4箇所配置して爽快感アップ！）
            BOOST_PADS = [0.18, 0.42, 0.66, 0.86].map(r => {
                const idx = Math.floor(WAYPOINTS.length * r);
                const p = WAYPOINTS[idx];
                const next = WAYPOINTS[(idx + 1) % WAYPOINTS.length];
                const angle = Math.atan2(next.y - p.y, next.x - p.x) + Math.PI / 2;
                return { x: p.x, y: p.y, angle };
            });

            // 静的オブジェクト生成
            STATIC_PROPS = [];
            const nx = Math.cos(START_ANGLE);
            const ny = Math.sin(START_ANGLE);
            STATIC_PROPS.push({ type: 'pillar', x: START_POS.x - nx * (ROAD_HALF_WIDTH + 22), y: START_POS.y - ny * (ROAD_HALF_WIDTH + 22), angle: START_ANGLE });
            STATIC_PROPS.push({ type: 'pillar', x: START_POS.x + nx * (ROAD_HALF_WIDTH + 22), y: START_POS.y + ny * (ROAD_HALF_WIDTH + 22), angle: START_ANGLE });

            let seed = currentCourse.propSeed;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            };
            for (let i = 0; i < 90; i++) {
                const tx = 130 + rand() * (WORLD_SIZE - 260);
                const ty = 130 + rand() * (WORLD_SIZE - 260);
                const near = findNearestWaypoint(tx, ty);
                if (near.dist > ROAD_HALF_WIDTH + 66) {
                    STATIC_PROPS.push({ type: currentCourse.propType, x: tx, y: ty, angle: rand() * Math.PI * 2 });
                }
            }

            bakeTrackTexture();
        }

        function bakeTrackTexture() {
            const tctx = trackCanvas.getContext('2d');
            const c = currentCourse;

            // 1. ベース地面
            tctx.fillStyle = c.groundBase;
            tctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // 2. 市松模様またはネオングリッド（スピード感を視覚化）
            const tile = 64;
            tctx.fillStyle = c.groundAlt;
            for (let y = 0; y < WORLD_SIZE; y += tile) {
                for (let x = 0; x < WORLD_SIZE; x += tile) {
                    if (((x / tile + y / tile) & 1) === 0) {
                        tctx.fillRect(x, y, tile, tile);
                    }
                }
            }
            if (c.id === 'metro') {
                // NEON METROにはサイバーグリッド線を焼き込む
                tctx.strokeStyle = 'rgba(236, 72, 153, 0.28)';
                tctx.lineWidth = 3;
                for (let g = 0; g < WORLD_SIZE; g += 64) {
                    tctx.beginPath(); tctx.moveTo(g, 0); tctx.lineTo(g, WORLD_SIZE); tctx.stroke();
                    tctx.beginPath(); tctx.moveTo(0, g); tctx.lineTo(WORLD_SIZE, g); tctx.stroke();
                }
            }

            const tracePath = () => {
                tctx.beginPath();
                tctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
                for (let i = 1; i < WAYPOINTS.length; i++) {
                    tctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
                }
                tctx.closePath();
            };

            // ランオフエリア
            tracePath();
            tctx.strokeStyle = c.runoffColor;
            tctx.lineWidth = ROAD_HALF_WIDTH * 2 + 44;
            tctx.lineJoin = 'round';
            tctx.stroke();

            // 縁石（ポップな2色ストライプ）
            tracePath();
            tctx.strokeStyle = c.curbA;
            tctx.lineWidth = ROAD_HALF_WIDTH * 2 + 18;
            tctx.stroke();

            tracePath();
            tctx.strokeStyle = c.curbB;
            tctx.lineWidth = ROAD_HALF_WIDTH * 2 + 18;
            tctx.setLineDash([28, 28]);
            tctx.stroke();
            tctx.setLineDash([]);

            // アスファルト路面
            tracePath();
            tctx.strokeStyle = c.roadOuter;
            tctx.lineWidth = ROAD_HALF_WIDTH * 2;
            tctx.stroke();

            tracePath();
            tctx.strokeStyle = c.roadInner;
            tctx.lineWidth = ROAD_HALF_WIDTH * 1.45;
            tctx.stroke();

            // センターライン
            tracePath();
            tctx.strokeStyle = c.centerLine;
            tctx.lineWidth = 6;
            tctx.setLineDash([36, 36]);
            tctx.stroke();
            tctx.setLineDash([]);

            // スタート／フィニッシュライン
            tctx.save();
            tctx.translate(START_POS.x, START_POS.y);
            tctx.rotate(START_ANGLE);
            const sq = 16;
            const cols = Math.floor((ROAD_HALF_WIDTH * 2) / sq);
            for (let r = 0; r < 2; r++) {
                for (let col = 0; col < cols; col++) {
                    tctx.fillStyle = (r + col) % 2 === 0 ? '#ffffff' : '#0f172a';
                    tctx.fillRect(-ROAD_HALF_WIDTH + col * sq, -sq + r * sq, sq, sq);
                }
            }
            tctx.restore();

            // ビビッドなダッシュパネル
            for (const pad of BOOST_PADS) {
                tctx.save();
                tctx.translate(pad.x, pad.y);
                tctx.rotate(pad.angle);
                tctx.fillStyle = '#ff2e93';
                tctx.fillRect(-32, -26, 64, 52);
                tctx.fillStyle = '#fde047';
                for (let y = -16; y <= 14; y += 14) {
                    tctx.beginPath();
                    tctx.moveTo(0, y - 10);
                    tctx.lineTo(24, y + 6);
                    tctx.lineTo(13, y + 6);
                    tctx.lineTo(0, y - 2);
                    tctx.lineTo(-13, y + 6);
                    tctx.lineTo(-24, y + 6);
                    tctx.closePath();
                    tctx.fill();
                }
                tctx.restore();
            }

            const imgData = tctx.getImageData(0, 0, WORLD_SIZE, WORLD_SIZE);
            trackPixels32 = new Uint32Array(imgData.data.buffer);
        }

        /**
         * コース選択画面用のポップなサムネイル（空＋山＋トラック全体図）を事前描画
         */
        function renderCourseThumbnails() {
            Object.values(COURSES).forEach(c => {
                const tc = document.getElementById(`thumb-${c.id}`);
                if (!tc) return;
                const tctx = tc.getContext('2d');
                const tw = tc.width;
                const th = tc.height;

                // 空グラデーション
                const skyH = Math.floor(th * 0.42);
                const skyGrad = tctx.createLinearGradient(0, 0, 0, skyH);
                skyGrad.addColorStop(0, c.skyStops[0]);
                skyGrad.addColorStop(0.55, c.skyStops[1]);
                skyGrad.addColorStop(1, c.skyStops[3]);
                tctx.fillStyle = skyGrad;
                tctx.fillRect(0, 0, tw, skyH);

                // 太陽
                tctx.fillStyle = c.sunColor;
                tctx.beginPath();
                tctx.arc(tw * 0.78, skyH * 0.55, 10, 0, Math.PI * 2);
                tctx.fill();

                // 山シルエット
                tctx.fillStyle = c.mountainColor;
                tctx.beginPath();
                tctx.moveTo(0, skyH);
                for (let x = 0; x <= tw; x += 12) {
                    const mh = Math.sin(x * 0.09 + c.propSeed) * 6 + 9;
                    tctx.lineTo(x, skyH - mh);
                }
                tctx.lineTo(tw, skyH);
                tctx.closePath();
                tctx.fill();

                // 地面エリア
                tctx.fillStyle = c.groundBase;
                tctx.fillRect(0, skyH, tw, th - skyH);
                tctx.fillStyle = c.groundAlt;
                for (let y = skyH; y < th; y += 12) {
                    for (let x = 0; x < tw; x += 12) {
                        if (((x / 12 + y / 12) & 1) === 0) tctx.fillRect(x, y, 12, 12);
                    }
                }

                // コース形状（ミニコースレイアウトを俯瞰配置）
                const wps = buildTrackWaypoints(c.controlPoints, 10);
                const padX = 18;
                const padTop = skyH + 6;
                const padBottom = 6;
                const mapW = tw - padX * 2;
                const mapH = th - padTop - padBottom;

                const traceThumbTrack = () => {
                    tctx.beginPath();
                    for (let i = 0; i < wps.length; i++) {
                        const px = padX + (wps[i].x / WORLD_SIZE) * mapW;
                        const py = padTop + (wps[i].y / WORLD_SIZE) * mapH;
                        if (i === 0) tctx.moveTo(px, py);
                        else tctx.lineTo(px, py);
                    }
                    tctx.closePath();
                };

                traceThumbTrack();
                tctx.strokeStyle = c.curbB;
                tctx.lineWidth = 8;
                tctx.lineJoin = 'round';
                tctx.stroke();

                traceThumbTrack();
                tctx.strokeStyle = c.roadOuter;
                tctx.lineWidth = 5;
                tctx.stroke();

                traceThumbTrack();
                tctx.strokeStyle = c.centerLine;
                tctx.lineWidth = 1.5;
                tctx.setLineDash([4, 4]);
                tctx.stroke();
                tctx.setLineDash([]);

                // スタート地点ドット
                const sx = padX + (wps[0].x / WORLD_SIZE) * mapW;
                const sy = padTop + (wps[0].y / WORLD_SIZE) * mapH;
                tctx.fillStyle = '#fefe33';
                tctx.beginPath();
                tctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
                tctx.fill();
            });
        }

        // ============================================================================
        // 4. ゲーム状態・エンティティ・ダッシュエフェクト管理
        // ============================================================================
        const ITEMS = {
            NITRO:     { id: 'NITRO',     icon: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path fill="#fde047" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>', name: 'ニトロブースト' },
            OIL:       { id: 'OIL',       icon: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path fill="#a855f7" d="M12 2C8 8 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-3-7-7-13z"/></svg>', name: 'オイルスリック' },
            MISSILE:   { id: 'MISSILE',   icon: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path fill="#ff2e93" d="M12 2c3 2 4 6 4 10l2 3v4l-3-1-1 2h-4l-1-2-3 1v-4l2-3c0-4 1-8 4-10z"/></svg>', name: 'EMPミサイル' },
            OVERDRIVE: { id: 'OVERDRIVE', icon: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path fill="#22d3ee" d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5z"/></svg>', name: 'オーバードライブ' }
        };
        const ITEM_LIST = [ITEMS.NITRO, ITEMS.OIL, ITEMS.MISSILE, ITEMS.OVERDRIVE];

        let gameState = 'TITLE';
        let selectedColor = 'red';
        let cameraMode = '3D';
        let cameraX = 0;
        let cameraY = 0;
        let cameraAngle = 0;

        let globalTime = 0;
        let titleAngle = 0;
        let countdownTimer = 0;
        let lastCountdownInt = 4;
        let raceTime = 0;
        let goalCameraTimer = 0; // ゴール後の追従カメラ演出用タイマー

        // ダッシュ時エフェクト用の状態変数
        let boostVisual = 0;     // 0.0〜1.0 スピードライン・FOV強度
        let boostFlash = 0;      // 瞬間フラッシュ＆衝撃波用
        let cameraShake = 0;     // マイクロシェイク強度
        const shockwaves = [];   // ダッシュ発動時のリング衝撃波

        const karts = [];
        const itemBoxes = [];
        const hazards = [];
        const particles = [];

        function initItemBoxes() {
            itemBoxes.length = 0;
            const ratios = [0.13, 0.45, 0.75];
            for (const r of ratios) {
                const idx = Math.floor(WAYPOINTS.length * r);
                const wp = WAYPOINTS[idx];
                const next = WAYPOINTS[(idx + 1) % WAYPOINTS.length];
                const ang = Math.atan2(next.y - wp.y, next.x - wp.x) + Math.PI / 2;
                const nx = Math.cos(ang);
                const ny = Math.sin(ang);
                for (const offset of [-38, 0, 38]) {
                    itemBoxes.push({
                        x: wp.x + nx * offset,
                        y: wp.y + ny * offset,
                        respawnTimer: 0
                    });
                }
            }
        }

        const input = {
            steer: 0,
            keyLeft: false,
            keyRight: false,
            drift: false,
            useItemQueued: false,
            swipeActive: false,
            swipeTouchId: null,
            swipeAnchorX: 0,
            swipeCurrentX: 0,
            swipeCurrentY: 0,
            swipeSteer: 0
        };

        class Kart {
            constructor(name, color, isPlayer, gridIndex) {
                this.name = name;
                this.color = color;
                this.isPlayer = isPlayer;
                this.spec = MACHINE_SPECS[color];

                const row = Math.floor(gridIndex / 2);
                const col = (gridIndex % 2 === 0 ? -1 : 1);
                const backDist = 42 + row * 56;
                const sideDist = col * 28;
                const nx = Math.cos(START_ANGLE);
                const ny = Math.sin(START_ANGLE);
                const fx = Math.sin(START_ANGLE);
                const fy = -Math.cos(START_ANGLE);

                this.x = START_POS.x - fx * backDist + nx * sideDist;
                this.y = START_POS.y - fy * backDist + ny * sideDist;
                this.angle = START_ANGLE;
                this.visualAngleOffset = 0;

                // マシンごとの性能差を物理挙動へ反映
                this.speed = 0;
                const aiVariance = isPlayer ? 1.0 : (0.93 + Math.random() * 0.06);
                this.maxSpeed = this.spec.maxSpeed * aiVariance;
                this.accel = this.spec.accel;
                this.handling = this.spec.handling;
                this.offRoadFactor = this.spec.offRoadFactor;
                this.driftBonus = this.spec.driftBonus;

                this.isDrifting = false;
                this.driftDir = 0;
                this.driftCharge = 0;

                this.boostTimer = 0;
                this.starTimer = 0;
                this.spinTimer = 0;
                this.padCooldown = 0;
                this.item = null;

                this.lap = 1;
                this.waypointIdx = 0;
                this.maxProgressInLap = 0;
                this.totalProgress = 0;
                this.finished = false;
                this.finishTime = 0;
                this.rank = gridIndex + 1;

                this.aiLaneOffset = (Math.random() - 0.5) * 62;
                this.aiItemDelay = 1.5;
            }

            triggerBoost(duration, color = '#22d3ee') {
                this.boostTimer = Math.max(this.boostTimer, duration);
                this.spawnBurstParticles(color, 18);
                if (this.isPlayer) {
                    sound.playBoost();
                    boostFlash = 1.0;
                    cameraShake = Math.max(cameraShake, 0.35);
                    shockwaves.push({ life: 0.42, maxLife: 0.42, color });
                }
            }

            triggerSpin() {
                if (this.starTimer > 0 || this.spinTimer > 0) return;
                this.spinTimer = 1.05;
                this.speed *= 0.35;
                this.isDrifting = false;
                this.driftCharge = 0;
                if (this.isPlayer) {
                    sound.playSpin();
                    cameraShake = Math.max(cameraShake, 0.45);
                }
                this.spawnBurstParticles('#fde047', 14);
            }

            spawnBurstParticles(color, count) {
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const spd = 45 + Math.random() * 125;
                    particles.push({
                        x: this.x,
                        y: this.y,
                        z: 6,
                        vx: Math.cos(a) * spd,
                        vy: Math.sin(a) * spd,
                        vz: 32 + Math.random() * 55,
                        color,
                        size: 5.5,
                        life: 0.35 + Math.random() * 0.22,
                        maxLife: 0.57
                    });
                }
            }

            useItem() {
                const it = this.item;
                this.item = null;
                if (!it) return;

                if (it.id === 'NITRO') {
                    this.triggerBoost(1.55, '#22d3ee');
                } else if (it.id === 'OVERDRIVE') {
                    this.starTimer = 5.5;
                    if (this.isPlayer) {
                        sound.playLap();
                        boostFlash = 1.0;
                        shockwaves.push({ life: 0.5, maxLife: 0.5, color: '#ff2e93' });
                    }
                    this.spawnBurstParticles('#ff2e93', 22);
                } else if (it.id === 'OIL') {
                    const bx = this.x - Math.sin(this.angle) * 38;
                    const by = this.y + Math.cos(this.angle) * 38;
                    hazards.push({
                        type: 'oil', x: bx, y: by, vx: 0, vy: 0,
                        owner: this, life: 25, angle: Math.random() * Math.PI * 2
                    });
                    if (this.isPlayer) sound.playBeep(260, 0.12, 'triangle', 0.1);
                } else if (it.id === 'MISSILE') {
                    const sx = this.x + Math.sin(this.angle) * 36;
                    const sy = this.y - Math.cos(this.angle) * 36;
                    const missileSpeed = 600;
                    hazards.push({
                        type: 'missile', x: sx, y: sy,
                        vx: Math.sin(this.angle) * missileSpeed,
                        vy: -Math.cos(this.angle) * missileSpeed,
                        owner: this, life: 5, angle: this.angle
                    });
                    if (this.isPlayer) sound.playBeep(740, 0.12, 'sawtooth', 0.09);
                }
            }

            update(dt) {
                if (this.padCooldown > 0) this.padCooldown -= dt;
                if (this.boostTimer > 0) this.boostTimer -= dt;
                if (this.starTimer > 0) this.starTimer -= dt;

                if (this.spinTimer > 0) {
                    this.spinTimer -= dt;
                    this.visualAngleOffset += dt * 16;
                    this.speed *= Math.pow(0.25, dt);
                    this.moveAndClamp(dt);
                    return;
                }

                let steer = 0;
                let wantDrift = false;

                if (this.isPlayer && !this.finished) {
                    steer = input.steer;
                    wantDrift = input.drift;
                    if (input.useItemQueued) {
                        input.useItemQueued = false;
                        if (this.item) this.useItem();
                    }
                } else {
                    const targetIdx = (this.waypointIdx + 7) % WAYPOINTS.length;
                    const wp = WAYPOINTS[targetIdx];
                    const next = WAYPOINTS[(targetIdx + 1) % WAYPOINTS.length];
                    const wpAngle = Math.atan2(next.y - wp.y, next.x - wp.x) + Math.PI / 2;
                    const tx = wp.x + Math.cos(wpAngle) * this.aiLaneOffset;
                    const ty = wp.y + Math.sin(wpAngle) * this.aiLaneOffset;

                    const desiredAngle = Math.atan2(ty - this.y, tx - this.x) + Math.PI / 2;
                    let diff = desiredAngle - this.angle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;

                    steer = Math.max(-1, Math.min(1, diff * 2.4));
                    wantDrift = Math.abs(diff) > 0.45 && this.speed > 240;

                    if (this.item) {
                        this.aiItemDelay -= dt;
                        if (this.aiItemDelay <= 0) {
                            this.useItem();
                            this.aiItemDelay = 1.2 + Math.random() * 2.0;
                        }
                    }
                }

                const near = findNearestWaypoint(this.x, this.y);
                const offRoad = near.dist > ROAD_HALF_WIDTH + 8;

                // 最高速計算（マシン固有のオフロード耐性を使用）
                let topSpeed = this.maxSpeed;
                if (offRoad && this.boostTimer <= 0 && this.starTimer <= 0) {
                    topSpeed *= this.offRoadFactor;
                }
                if (this.boostTimer > 0) topSpeed *= 1.42;
                if (this.starTimer > 0) topSpeed *= 1.30;

                if (this.speed < topSpeed) {
                    this.speed = Math.min(topSpeed, this.speed + this.accel * (this.boostTimer > 0 ? 2.6 : 1) * dt);
                } else {
                    this.speed += (topSpeed - this.speed) * Math.min(1, dt * 3.5);
                }

                // ドリフト＆ミニターボ（マシン固有のハンドリング＆ドリフトボーナスを反映）
                const speedFactor = Math.min(1, this.speed / 155);
                if (wantDrift && this.speed > 165) {
                    if (!this.isDrifting && Math.abs(steer) > 0.14) {
                        this.isDrifting = true;
                        this.driftDir = steer > 0 ? 1 : -1;
                        this.driftCharge = 0;
                    }
                    if (this.isDrifting) {
                        const turnRate = (this.handling * 0.92 * this.driftDir + steer * 0.98) * speedFactor;
                        this.angle += turnRate * dt;
                        this.visualAngleOffset += (this.driftDir * 0.36 - this.visualAngleOffset) * Math.min(1, dt * 10);
                        this.driftCharge += dt * this.driftBonus;

                        if (this.driftCharge > 0.32 && Math.random() < 0.72) {
                            const sparkColor = this.driftCharge > 1.3 ? '#ff2e93' : '#22d3ee';
                            const rearX = this.x - Math.sin(this.angle) * 20;
                            const rearY = this.y + Math.cos(this.angle) * 20;
                            particles.push({
                                x: rearX + (Math.random() - 0.5) * 14,
                                y: rearY + (Math.random() - 0.5) * 14,
                                z: 2,
                                vx: (Math.random() - 0.5) * 50,
                                vy: (Math.random() - 0.5) * 50,
                                vz: 28 + Math.random() * 28,
                                color: sparkColor,
                                size: 4.5,
                                life: 0.22,
                                maxLife: 0.22
                            });
                        }
                    } else {
                        this.angle += steer * this.handling * speedFactor * dt;
                        this.visualAngleOffset *= Math.pow(0.05, dt);
                    }
                } else {
                    if (this.isDrifting) {
                        if (this.driftCharge > 1.3) {
                            this.triggerBoost(1.22, '#ff2e93');
                        } else if (this.driftCharge > 0.5) {
                            this.triggerBoost(0.72, '#22d3ee');
                        }
                        this.isDrifting = false;
                        this.driftDir = 0;
                        this.driftCharge = 0;
                    }
                    this.angle += steer * this.handling * speedFactor * dt;
                    this.visualAngleOffset *= Math.pow(0.02, dt);
                }

                // ダッシュ中のツイン・アフターバーナー排気炎パーティクル
                if ((this.boostTimer > 0 || this.starTimer > 0)) {
                    const fx = Math.sin(this.angle);
                    const fy = -Math.cos(this.angle);
                    const rx = Math.cos(this.angle);
                    const ry = Math.sin(this.angle);
                    for (const side of [-7, 7]) {
                        if (Math.random() < 0.85) {
                            const px = this.x - fx * 22 + rx * side;
                            const py = this.y - fy * 22 + ry * side;
                            const flameColor = this.starTimer > 0
                                ? (Math.random() < 0.5 ? '#ff2e93' : '#fde047')
                                : (Math.random() < 0.55 ? '#22d3ee' : '#fde047');
                            particles.push({
                                x: px,
                                y: py,
                                z: 5,
                                vx: -fx * 110 + (Math.random() - 0.5) * 28,
                                vy: -fy * 110 + (Math.random() - 0.5) * 28,
                                vz: 10 + Math.random() * 14,
                                color: flameColor,
                                size: 6.5,
                                life: 0.19,
                                maxLife: 0.19
                            });
                        }
                    }
                }

                this.moveAndClamp(dt);

                // ダッシュパネル判定
                if (this.padCooldown <= 0) {
                    for (const pad of BOOST_PADS) {
                        if (Math.hypot(this.x - pad.x, this.y - pad.y) < 40) {
                            this.triggerBoost(1.05, '#fde047');
                            this.padCooldown = 0.9;
                            break;
                        }
                    }
                }

                // サプライポッド取得
                for (const box of itemBoxes) {
                    if (box.respawnTimer <= 0 && Math.hypot(this.x - box.x, this.y - box.y) < 30) {
                        box.respawnTimer = 6.0;
                        if (!this.item) {
                            this.item = ITEM_LIST[Math.floor(Math.random() * ITEM_LIST.length)];
                            if (this.isPlayer) sound.playItemGet();
                        }
                    }
                }

                // ラップ＆進行度
                const prevIdx = this.waypointIdx;
                const newIdx = near.index;
                const n = WAYPOINTS.length;
                if (newIdx > this.maxProgressInLap && newIdx - this.maxProgressInLap < n * 0.4) {
                    this.maxProgressInLap = newIdx;
                }
                if (prevIdx > n * 0.8 && newIdx < n * 0.2 && this.maxProgressInLap > n * 0.7) {
                    this.lap++;
                    this.maxProgressInLap = newIdx;
                    if (this.lap > TOTAL_LAPS && !this.finished) {
                        this.finished = true;
                        this.finishTime = raceTime;
                        if (this.isPlayer) finishRace();
                    } else if (this.isPlayer) {
                        sound.playLap();
                        showBanner(this.lap === TOTAL_LAPS ? 'FINAL LAP!' : `LAP ${this.lap}/${TOTAL_LAPS}`, '', 1.6);
                    }
                }
                this.waypointIdx = newIdx;
                this.totalProgress = (this.lap - 1) * n + this.waypointIdx;
            }

            moveAndClamp(dt) {
                this.x += Math.sin(this.angle) * this.speed * dt;
                this.y -= Math.cos(this.angle) * this.speed * dt;
                this.x = Math.max(50, Math.min(WORLD_SIZE - 50, this.x));
                this.y = Math.max(50, Math.min(WORLD_SIZE - 50, this.y));
            }
        }

        // ============================================================================
        // 5. UI制御＆レース進行
        // ============================================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const mmCtx = minimapCanvas.getContext('2d');

        const elTitleScreen = document.getElementById('title-screen');
        const elCourseScreen = document.getElementById('course-screen');
        const elHud = document.getElementById('hud');
        const elResultScreen = document.getElementById('result-screen');
        const elResultCard = document.getElementById('result-card');
        const elHudRank = document.getElementById('hud-rank');
        const elHudLap = document.getElementById('hud-lap');
        const elHudTime = document.getElementById('hud-time');
        const elHudSpeed = document.getElementById('hud-speed');
        const elHudSpeedBox = document.getElementById('hud-speed-box');
        const elHudItemIcon = document.getElementById('hud-item-icon');
        const elBtnItemEmoji = document.getElementById('btn-item-emoji');
        const elCenterBanner = document.getElementById('center-banner');
        const elSubBanner = document.getElementById('sub-banner');

        let bannerTimer = 0;
        let lastHudItem = undefined;
        function showBanner(mainText, subText = '', duration = 1.2) {
            elCenterBanner.textContent = mainText;
            elCenterBanner.classList.remove('hidden');
            if (subText) {
                elSubBanner.textContent = subText;
                elSubBanner.classList.remove('hidden');
            } else {
                elSubBanner.classList.add('hidden');
            }
            bannerTimer = duration;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            const t = Math.floor((sec * 10) % 10);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${t}`;
        }

        function getRankSuffix(rank) {
            return ['1st', '2nd', '3rd', '4th'][rank - 1] || `${rank}th`;
        }

        function updateMachineUI() {
            const spec = MACHINE_SPECS[selectedColor];
            if (!spec) return;
            document.getElementById('machine-name').textContent = spec.name;
            document.getElementById('machine-tag').textContent = spec.tag;
            document.getElementById('stat-spd').style.width = `${spec.stats.spd}%`;
            document.getElementById('stat-acc').style.width = `${spec.stats.acc}%`;
            document.getElementById('stat-hdl').style.width = `${spec.stats.hdl}%`;
        }

        function openCourseSelect() {
            gameState = 'COURSE_SELECT';
            sound.stopBgm();
            elTitleScreen.classList.add('hidden');
            elHud.classList.add('hidden');
            elResultScreen.classList.add('hidden');
            elResultScreen.classList.add('opacity-0');
            elResultCard.classList.add('opacity-0', 'translate-y-4');
            elCourseScreen.classList.remove('hidden');

            document.querySelectorAll('.course-card').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.course === selectedCourseId);
            });
        }

        function startRace() {
            sound.init();
            sound.startBgm(currentCourse.bgmPitch);
            karts.length = 0;
            hazards.length = 0;
            particles.length = 0;
            shockwaves.length = 0;
            boostVisual = 0;
            boostFlash = 0;
            cameraShake = 0;
            goalCameraTimer = 0;
            initItemBoxes();

            const allColors = ['red', 'blue', 'green', 'yellow'];
            const aiColors = allColors.filter(c => c !== selectedColor);

            karts.push(new Kart(`YOU (${MACHINE_SPECS[selectedColor].name})`, selectedColor, true, 0));
            for (let i = 0; i < 3; i++) {
                const c = aiColors[i];
                karts.push(new Kart(MACHINE_SPECS[c].name, c, false, i + 1));
            }

            const player = karts[0];
            cameraX = player.x - Math.sin(player.angle) * 96;
            cameraY = player.y + Math.cos(player.angle) * 96;
            cameraAngle = player.angle;

            raceTime = 0;
            countdownTimer = 3.2;
            lastCountdownInt = 4;
            gameState = 'COUNTDOWN';

            elTitleScreen.classList.add('hidden');
            elCourseScreen.classList.add('hidden');
            elResultScreen.classList.add('hidden');
            elResultScreen.classList.add('opacity-0');
            elResultCard.classList.add('opacity-0', 'translate-y-4');
            elHud.classList.remove('hidden');
        }

        /**
         * ゴール直後：まずはカメラで自車をしばらく追い、余韻を残してからリザルトへ
         */
        function finishRace() {
            gameState = 'GOAL_CAMERA';
            goalCameraTimer = 0;
            sound.playLap();
            showBanner('FINISH!!', getRankSuffix(karts[0].rank) + ' PLACE', 2.2);
        }

        /**
         * 追従カメラ演出後にさりげなくリザルトカードをフェードイン表示
         */
        function showResultOverlay() {
            gameState = 'FINISHED';
            sound.stopBgm();
            elHud.classList.add('hidden');

            const player = karts[0];
            const sorted = [...karts].sort((a, b) => {
                if (a.finished && b.finished) return a.finishTime - b.finishTime;
                if (a.finished) return -1;
                if (b.finished) return 1;
                return b.totalProgress - a.totalProgress;
            });

            document.getElementById('result-course').textContent = currentCourse.name;
            document.getElementById('result-rank').textContent = `${getRankSuffix(player.rank)} PLACE`;
            document.getElementById('result-time').textContent = `TIME: ${formatTime(player.finishTime)}`;

            const standingsEl = document.getElementById('result-standings');
            standingsEl.innerHTML = '';
            sorted.forEach((k, idx) => {
                const row = document.createElement('div');
                row.className = `flex justify-between items-center px-3 py-2 rounded-xl ${k.isPlayer ? 'bg-gradient-to-r from-pink-500/35 to-cyan-500/35 border border-yellow-300 text-yellow-200' : 'bg-white/10 text-slate-100'}`;
                row.innerHTML = `<span>${getRankSuffix(idx + 1)}  ${k.name}</span><span>${k.finished ? formatTime(k.finishTime) : 'RUNNING'}</span>`;
                standingsEl.appendChild(row);
            });

            elResultScreen.classList.remove('hidden');
            // 1フレーム待ってからトランジションを発火させてさりげなくフェードイン
            requestAnimationFrame(() => {
                elResultScreen.classList.remove('opacity-0');
                elResultCard.classList.remove('opacity-0', 'translate-y-4');
            });
        }

        // ============================================================================
        // 6. ゲームループ更新
        // ============================================================================
        function update(dt) {
            globalTime += dt;

            if (gameState === 'TITLE' || gameState === 'COURSE_SELECT') {
                titleAngle += dt * 0.95;
                sound.updateEngine(0, false, false);
                return;
            }

            if (input.keyLeft && !input.keyRight) {
                input.steer = -1;
            } else if (input.keyRight && !input.keyLeft) {
                input.steer = 1;
            } else if (input.swipeActive) {
                input.steer = input.swipeSteer;
            } else {
                input.steer = 0;
            }

            if (bannerTimer > 0) {
                bannerTimer -= dt;
                if (bannerTimer <= 0) {
                    elCenterBanner.classList.add('hidden');
                    elSubBanner.classList.add('hidden');
                }
            }

            if (gameState === 'COUNTDOWN') {
                countdownTimer -= dt;
                const sec = Math.ceil(countdownTimer);
                if (sec !== lastCountdownInt && sec > 0) {
                    lastCountdownInt = sec;
                    showBanner(String(sec), currentCourse.name, 0.95);
                    sound.playBeep(440, 0.14, 'square', 0.08);
                }
                if (countdownTimer <= 0) {
                    gameState = 'RACING';
                    showBanner('GO!!', '', 0.9);
                    sound.playBeep(880, 0.25, 'square', 0.1);
                }
                updateCamera(dt);
                return;
            }

            if (gameState === 'RACING' || gameState === 'GOAL_CAMERA' || gameState === 'FINISHED') {
                if (gameState === 'RACING') raceTime += dt;

                // ゴール後は約2.6秒間、自車をカメラで追従した後にさりげなくリザルトを表示
                if (gameState === 'GOAL_CAMERA') {
                    goalCameraTimer += dt;
                    if (goalCameraTimer >= 2.6) {
                        showResultOverlay();
                    }
                }

                for (const k of karts) k.update(dt);

                // カート同士の衝突
                for (let i = 0; i < karts.length; i++) {
                    for (let j = i + 1; j < karts.length; j++) {
                        const a = karts[i];
                        const b = karts[j];
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;
                        const dist = Math.hypot(dx, dy);
                        const minDist = 30;
                        if (dist > 0 && dist < minDist) {
                            const overlap = (minDist - dist) * 0.5;
                            const nx = dx / dist;
                            const ny = dy / dist;
                            a.x -= nx * overlap;
                            a.y -= ny * overlap;
                            b.x += nx * overlap;
                            b.y += ny * overlap;

                            if (a.starTimer > 0 && b.starTimer <= 0) b.triggerSpin();
                            if (b.starTimer > 0 && a.starTimer <= 0) a.triggerSpin();
                        }
                    }
                }

                for (const box of itemBoxes) {
                    if (box.respawnTimer > 0) box.respawnTimer -= dt;
                }

                for (let i = hazards.length - 1; i >= 0; i--) {
                    const h = hazards[i];
                    h.life -= dt;
                    h.x += h.vx * dt;
                    h.y += h.vy * dt;
                    if (h.type === 'missile') {
                        h.angle = Math.atan2(h.vy, h.vx) + Math.PI / 2;
                        if (Math.random() < 0.7) {
                            particles.push({
                                x: h.x, y: h.y, z: 6,
                                vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, vz: 10,
                                color: '#22d3ee', size: 4.5, life: 0.2, maxLife: 0.2
                            });
                        }
                        if (h.x < 40 || h.x > WORLD_SIZE - 40) h.vx *= -1;
                        if (h.y < 40 || h.y > WORLD_SIZE - 40) h.vy *= -1;
                    }

                    let hit = false;
                    for (const k of karts) {
                        if (k === h.owner && h.life > (h.type === 'missile' ? 4.6 : 24.5)) continue;
                        if (Math.hypot(k.x - h.x, k.y - h.y) < 26) {
                            k.triggerSpin();
                            hit = true;
                            break;
                        }
                    }
                    if (hit || h.life <= 0) hazards.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i];
                    pt.life -= dt;
                    pt.x += pt.vx * dt;
                    pt.y += pt.vy * dt;
                    pt.z = Math.max(0, pt.z + pt.vz * dt);
                    pt.vz -= 90 * dt;
                    if (pt.life <= 0) particles.splice(i, 1);
                }

                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    shockwaves[i].life -= dt;
                    if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
                }

                // 順位計算
                const sorted = [...karts].sort((a, b) => {
                    if (a.finished && b.finished) return a.finishTime - b.finishTime;
                    if (a.finished) return -1;
                    if (b.finished) return 1;
                    return b.totalProgress - a.totalProgress;
                });
                sorted.forEach((k, idx) => { k.rank = idx + 1; });

                // ダッシュエフェクト補間
                const player = karts[0];
                const isBoosting = player.boostTimer > 0 || player.starTimer > 0;
                const targetBoostVis = isBoosting ? 1.0 : 0.0;
                boostVisual += (targetBoostVis - boostVisual) * Math.min(1, dt * 8.5);
                boostFlash = Math.max(0, boostFlash - dt * 3.2);
                cameraShake = Math.max(0, cameraShake - dt * 1.8);

                updateCamera(dt);

                // HUD更新
                elHudRank.textContent = getRankSuffix(player.rank);
                elHudLap.textContent = `LAP ${Math.min(player.lap, TOTAL_LAPS)}/${TOTAL_LAPS}`;
                elHudTime.textContent = formatTime(raceTime);
                elHudSpeed.textContent = String(Math.round(player.speed * 0.74));

                if (isBoosting) {
                    elHudSpeedBox.classList.add('border-yellow-300', 'text-yellow-300');
                    elHudSpeedBox.classList.remove('border-pink-400/50', 'text-cyan-300');
                } else {
                    elHudSpeedBox.classList.remove('border-yellow-300', 'text-yellow-300');
                    elHudSpeedBox.classList.add('border-pink-400/50', 'text-cyan-300');
                }

                if (player.item !== lastHudItem) { lastHudItem = player.item;
                if (player.item) {
                    elHudItemIcon.innerHTML = player.item.icon;
                    elHudItemIcon.classList.remove('opacity-35', 'text-xs');
                    elBtnItemEmoji.innerHTML = player.item.icon;
                } else {
                    elHudItemIcon.textContent = '---';
                    elHudItemIcon.classList.add('opacity-35', 'text-xs');
                    elBtnItemEmoji.innerHTML = ITEMS.NITRO.icon;
                }
                }

                sound.updateEngine(player.speed / player.maxSpeed, isBoosting, gameState === 'RACING' || gameState === 'GOAL_CAMERA');
            }
        }

        function updateCamera(dt) {
            const player = karts[0];
            if (!player) return;

            // ゴール後のウィニングラン追従カメラ（自車の斜め後ろ〜横へゆったり回り込みながら追う）
            if (gameState === 'GOAL_CAMERA' || gameState === 'FINISHED') {
                const orbitAngle = player.angle + Math.sin(globalTime * 0.85) * 0.75;
                let diff = orbitAngle - cameraAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                cameraAngle += diff * Math.min(1, dt * 3.5);

                const followDist = 118;
                const targetX = player.x - Math.sin(cameraAngle) * followDist;
                const targetY = player.y + Math.cos(cameraAngle) * followDist;
                cameraX += (targetX - cameraX) * Math.min(1, dt * 7);
                cameraY += (targetY - cameraY) * Math.min(1, dt * 7);
                return;
            }

            if (cameraMode === '3D') {
                const targetAngle = player.angle;
                let diff = targetAngle - cameraAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                cameraAngle += diff * Math.min(1, dt * 8.5);

                // ダッシュ時はカメラがわずかに後ろへ引いてスピード感を強調
                const followDist = 96 + boostVisual * 14;
                const targetX = player.x - Math.sin(cameraAngle) * followDist;
                const targetY = player.y + Math.cos(cameraAngle) * followDist;
                cameraX += (targetX - cameraX) * Math.min(1, dt * 14);
                cameraY += (targetY - cameraY) * Math.min(1, dt * 14);
            } else {
                const lookAhead = 68 + boostVisual * 20;
                const targetX = player.x + Math.sin(player.angle) * lookAhead;
                const targetY = player.y - Math.cos(player.angle) * lookAhead;
                cameraX += (targetX - cameraX) * Math.min(1, dt * 8);
                cameraY += (targetY - cameraY) * Math.min(1, dt * 8);

                const targetAngle = player.angle;
                let diff = targetAngle - cameraAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                cameraAngle += diff * Math.min(1, dt * 7);
            }
        }

        // ============================================================================
        // 7. レンダリング（擬似3D + Sprite Stacking + ダッシュ時エフェクト）
        // ============================================================================
        function render() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.imageSmoothingEnabled = false;

            if (gameState === 'TITLE' || gameState === 'COURSE_SELECT') {
                renderTitleShowcase(w, h);
                return;
            }

            // カメラマイクロシェイク適用
            const shakeAmt = cameraShake * 7 + boostVisual * 1.4;
            const shakeX = shakeAmt > 0.1 ? (Math.random() - 0.5) * shakeAmt : 0;
            const shakeY = shakeAmt > 0.1 ? (Math.random() - 0.5) * shakeAmt : 0;

            ctx.save();
            ctx.translate(shakeX, shakeY);
            if (cameraMode === '3D') {
                renderPseudo3D(w, h);
            } else {
                renderTopDown(w, h);
            }
            ctx.restore();

            // ダッシュ時エフェクト（スピードライン・ネオングロー・衝撃波）
            renderDashEffects(w, h);

            // スワイプ中インジケーター（操作中の指元のみ軽く表示）
            if (input.swipeActive) {
                ctx.save();
                ctx.strokeStyle = 'rgba(34, 211, 238, 0.55)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(input.swipeAnchorX, input.swipeCurrentY);
                ctx.lineTo(input.swipeCurrentX, input.swipeCurrentY);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 46, 147, 0.25)';
                ctx.beginPath();
                ctx.arc(input.swipeCurrentX, input.swipeCurrentY, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#22d3ee';
                ctx.stroke();
                ctx.restore();
            }

            renderMinimap();
        }

        /**
         * ダッシュ時フルスクリーンエフェクト（集中線スピードライン・画面端ネオン発光・衝撃波リング）
         */
        function renderDashEffects(w, h) {
            const player = karts[0];
            if (!player) return;
            const isOverdrive = player.starTimer > 0;

            // 1. 衝撃波リング（ダッシュ開始直後）
            for (const sw of shockwaves) {
                const progress = 1 - (sw.life / sw.maxLife);
                const radius = (0.12 + progress * 0.72) * Math.max(w, h);
                ctx.save();
                ctx.globalAlpha = (1 - progress) * 0.65;
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = 6 * (1 - progress) + 2;
                ctx.beginPath();
                ctx.arc(w * 0.5, h * 0.66, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            if (boostVisual <= 0.02 && boostFlash <= 0.02) return;

            // 2. 放射状スピードライン（集中線）
            if (boostVisual > 0.05) {
                ctx.save();
                const cx = w * 0.5;
                const cy = h * 0.44;
                const maxR = Math.hypot(w, h) * 0.65;
                const lineCount = 26;

                for (let i = 0; i < lineCount; i++) {
                    const seed = i * 7.31 + Math.floor(globalTime * 28) * 1.13;
                    const angle = (i / lineCount) * Math.PI * 2 + Math.sin(seed) * 0.09;
                    const phase = ((globalTime * 4.5 + i * 0.37) % 1);
                    const rStart = maxR * (0.28 + phase * 0.32);
                    const rEnd = maxR * (0.68 + phase * 0.45);

                    const x1 = cx + Math.cos(angle) * rStart;
                    const y1 = cy + Math.sin(angle) * rStart;
                    const x2 = cx + Math.cos(angle) * rEnd;
                    const y2 = cy + Math.sin(angle) * rEnd;

                    ctx.strokeStyle = isOverdrive
                        ? (i % 2 === 0 ? '#ff2e93' : '#fde047')
                        : (i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? '#22d3ee' : '#fde047'));
                    ctx.globalAlpha = boostVisual * (0.38 + (1 - phase) * 0.42);
                    ctx.lineWidth = 2 + boostVisual * 2.5;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                // 3. 画面端のポップネオン・ブーストビネット
                const grad = ctx.createRadialGradient(cx, h * 0.52, Math.min(w, h) * 0.28, cx, h * 0.52, maxR);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(0.75, 'rgba(0,0,0,0)');
                grad.addColorStop(1, isOverdrive
                    ? `rgba(255, 46, 147, ${0.42 * boostVisual})`
                    : `rgba(34, 211, 238, ${0.38 * boostVisual})`);
                ctx.globalAlpha = 1;
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }

            // 4. 発動直後のホワイト／シアンフラッシュ
            if (boostFlash > 0.02) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${boostFlash * 0.24})`;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }
        }

        /**
         * 擬似3Dビュー（コース別の空・太陽・遠景＋Mode 7路面＋Sprite Stacking）
         */
        function renderPseudo3D(w, h) {
            const c = currentCourse;
            const horizonY = Math.floor(h * 0.32);
            // ダッシュ時はわずかに広角(FOV拡大)にして奥行きとスピード感を強調
            const baseFocal = Math.min(Math.max(w * 0.92, 320), h * 0.62);
            const focal = baseFocal * (1 - boostVisual * 0.09);
            const followDist = 96 + boostVisual * 14;
            const targetPlayerY = h * 0.78;
            const camHeight = Math.max(42, Math.min(105, ((targetPlayerY - horizonY) * followDist) / focal));

            // 1. コース別ポップ空グラデーション
            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, c.skyStops[0]);
            skyGrad.addColorStop(0.45, c.skyStops[1]);
            skyGrad.addColorStop(0.82, c.skyStops[2]);
            skyGrad.addColorStop(1, c.skyStops[3]);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizonY + 4);

            // パララックス太陽（ポップなレトロシンセサン）
            const normAngle = ((cameraAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const skyScroll = (normAngle / (Math.PI * 2)) * w * 2.2;
            const sunX = ((w * 0.65 - skyScroll * 0.28) % (w * 1.4) + w * 1.4) % (w * 1.4) - w * 0.2;
            const sunR = Math.min(w, h) * 0.085;
            ctx.save();
            ctx.fillStyle = c.sunColor;
            ctx.beginPath();
            ctx.arc(sunX, horizonY - sunR * 0.75, sunR, 0, Math.PI * 2);
            ctx.fill();
            // レトロポップな太陽の横スリット
            ctx.fillStyle = c.skyStops[2];
