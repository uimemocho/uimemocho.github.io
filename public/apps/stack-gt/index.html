            for (let sy = 0; sy < 3; sy++) {
                ctx.fillRect(sunX - sunR, horizonY - sunR * (0.2 + sy * 0.22), sunR * 2, 2 + sy);
            }
            ctx.restore();

            // パララックス山並み
            ctx.fillStyle = c.mountainColor;
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            for (let sx = 0; sx <= w + 40; sx += 30) {
                const wx = sx + skyScroll * 0.5;
                const mh = Math.sin(wx * 0.0085) * 26 + Math.cos(wx * 0.022) * 14 + 34;
                ctx.lineTo(sx, horizonY - mh);
            }
            ctx.lineTo(w, horizonY);
            ctx.closePath();
            ctx.fill();

            // パララックス都市／渓谷シルエット
            ctx.fillStyle = c.cityColor;
            const bldgW = Math.max(18, Math.floor(w / 26));
            const offsetBldg = Math.floor(skyScroll) % bldgW;
            for (let i = -1; i <= Math.ceil(w / bldgW) + 1; i++) {
                const idx = Math.floor(Math.floor(skyScroll) / bldgW) + i;
                const bh = ((Math.abs(Math.sin(idx * 12.9898) * 43758.5453) % 1) * 34 + 10) * (h / 700);
                const bx = i * bldgW - offsetBldg;
                ctx.fillRect(bx, horizonY - bh, bldgW - 2, bh + 2);
                // METROコースはネオン窓を点滅表示
                if (c.id === 'metro' && (idx & 1) === 0) {
                    ctx.fillStyle = (idx % 3 === 0) ? '#22d3ee' : '#ff2e93';
                    ctx.fillRect(bx + 3, horizonY - bh + 4, bldgW - 8, 3);
                    ctx.fillStyle = c.cityColor;
                }
            }

            // 2. Mode 7 スキャンライン路面
            const gw = 240;
            const gh = Math.max(100, Math.min(220, Math.round(gw * (h - horizonY) / Math.max(1, w))));
            if (groundCanvas.width !== gw || groundCanvas.height !== gh) {
                groundCanvas.width = gw;
                groundCanvas.height = gh;
                groundImgData = groundCtx.createImageData(gw, gh);
                groundPixels32 = new Uint32Array(groundImgData.data.buffer);
            }

            if (trackPixels32) {
                const sinC = Math.sin(cameraAngle);
                const cosC = Math.cos(cameraAngle);
                const scaleToBuf = gw / Math.max(1, w);
                const gFocal = focal * scaleToBuf;
                const halfGW = gw * 0.5;
                const outA = c.outerColor32A;
                const outB = c.outerColor32B;

                for (let py = 0; py < gh; py++) {
                    const syFromHorizon = py + 0.8;
                    const z = (camHeight * gFocal) / syFromHorizon;
                    const xLeft = (-halfGW / gFocal) * z;
                    const xStep = (1 / gFocal) * z;

                    let wx = cameraX + z * sinC + xLeft * cosC;
                    let wy = cameraY - z * cosC + xLeft * sinC;
                    const stepWX = xStep * cosC;
                    const stepWY = xStep * sinC;

                    const rowOffset = py * gw;
                    for (let px = 0; px < gw; px++) {
                        const ix = wx | 0;
                        const iy = wy | 0;
                        if (ix >= 0 && ix < WORLD_SIZE && iy >= 0 && iy < WORLD_SIZE) {
                            groundPixels32[rowOffset + px] = trackPixels32[iy * WORLD_SIZE + ix];
                        } else {
                            groundPixels32[rowOffset + px] = ((ix ^ iy) & 32) ? outB : outA;
                        }
                        wx += stepWX;
                        wy += stepWY;
                    }
                }
                groundCtx.putImageData(groundImgData, 0, 0);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(groundCanvas, 0, horizonY, w, h - horizonY);
            }

            // 地平線グロー
            const fogGrad = ctx.createLinearGradient(0, horizonY - 2, 0, horizonY + h * 0.08);
            fogGrad.addColorStop(0, c.fogColor);
            fogGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, horizonY - 2, w, h * 0.08 + 2);

            // 3. 3D透視投影
            const sinC = Math.sin(cameraAngle);
            const cosC = Math.cos(cameraAngle);
            const project3D = (wx, wy) => {
                const dx = wx - cameraX;
                const dy = wy - cameraY;
                const z = dx * sinC - dy * cosC;
                if (z <= 14 || z > 1050) return null;
                const x = dx * cosC + dy * sinC;
                const sx = w * 0.5 + (x / z) * focal;
                const sy = horizonY + (camHeight / z) * focal;
                const pScale = focal / z;
                return { sx, sy, z, pScale };
            };

            const renderList = [];
            const squashY = 0.54;

            for (const p of STATIC_PROPS) {
                const proj = project3D(p.x, p.y);
                if (!proj || proj.sx < -220 || proj.sx > w + 220) continue;
                renderList.push({
                    z: proj.z,
                    draw: () => {
                        const stack = SPRITE_STACKS.props[p.type];
                        if (p.type === 'pillar') {
                            const s = proj.pScale * 2.5;
                            drawSpriteStack(ctx, stack, proj.sx, proj.sy, p.angle - cameraAngle, s, s * 1.25, 0, squashY);
                        } else if (p.type === 'tower') {
                            const s = proj.pScale * 2.9;
                            drawSpriteStack(ctx, stack, proj.sx, proj.sy, p.angle - cameraAngle, s, s * 1.35, 0, squashY);
                        } else {
                            const s = proj.pScale * 3.1;
                            drawSpriteStack(ctx, stack, proj.sx, proj.sy, p.angle - cameraAngle, s, s * 1.15, 0, squashY);
                        }
                    }
                });
            }

            for (const box of itemBoxes) {
                if (box.respawnTimer > 0) continue;
                const proj = project3D(box.x, box.y);
                if (!proj || proj.sx < -160 || proj.sx > w + 160) continue;
                renderList.push({
                    z: proj.z,
                    draw: () => {
                        const s = proj.pScale * 1.9;
                        const bob = (Math.sin(globalTime * 4.5 + box.x) * 3 + 6) * (proj.pScale * 0.35);
                        drawSpriteStack(ctx, SPRITE_STACKS.itemBox, proj.sx, proj.sy, globalTime * 2.5 - cameraAngle, s, s * 0.92, bob, squashY);
                    }
                });
            }

            for (const hz of hazards) {
                const proj = project3D(hz.x, hz.y);
                if (!proj || proj.sx < -160 || proj.sx > w + 160) continue;
                renderList.push({
                    z: proj.z,
                    draw: () => {
                        const s = proj.pScale * 1.75;
                        const stack = hz.type === 'oil' ? SPRITE_STACKS.oil : SPRITE_STACKS.missile;
                        drawSpriteStack(ctx, stack, proj.sx, proj.sy, hz.angle - cameraAngle, s, s * 0.85, 0, squashY);
                    }
                });
            }

            for (const k of karts) {
                const proj = project3D(k.x, k.y);
                if (!proj || proj.sx < -220 || proj.sx > w + 220) continue;
                renderList.push({
                    z: proj.z,
                    draw: () => {
                        let stack = SPRITE_STACKS.karts[k.color];
                        if (k.starTimer > 0 && Math.floor(globalTime * 16) % 2 === 0) {
                            stack = SPRITE_STACKS.kartsOverdrive[k.color];
                        }
                        const renderAngle = k.angle + k.visualAngleOffset - cameraAngle;
                        const s = proj.pScale * 1.88;
                        const bounce = k.speed > 40 ? Math.sin(globalTime * 28 + k.x) * 0.22 * s : 0;

                        // ダッシュ中の車体オーラ（地面のネオンリング）
                        if (k.boostTimer > 0 || k.starTimer > 0) {
                            ctx.save();
                            ctx.translate(proj.sx, proj.sy);
                            ctx.strokeStyle = k.starTimer > 0 ? '#ff2e93' : '#22d3ee';
                            ctx.lineWidth = Math.max(2, s * 0.45);
                            ctx.globalAlpha = 0.72;
                            ctx.beginPath();
                            ctx.ellipse(0, 0, s * 10.5, s * 5.8, 0, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.restore();
                        }

                        drawSpriteStack(ctx, stack, proj.sx, proj.sy, renderAngle, s, s * 0.82, Math.max(0, bounce), squashY);

                        if (!k.isPlayer && proj.z < 560) {
                            const tagW = Math.max(26, 5.6 * s);
                            const tagH = Math.max(11, 2.4 * s);
                            const tagY = proj.sy - 13 * s;
                            ctx.fillStyle = 'rgba(24, 16, 56, 0.84)';
                            ctx.fillRect(proj.sx - tagW / 2, tagY - tagH, tagW, tagH);
                            ctx.fillStyle = '#fde047';
                            ctx.font = `bold ${Math.max(8, Math.round(1.6 * s))}px "Press Start 2P", monospace`;
                            ctx.textAlign = 'center';
                            ctx.fillText(getRankSuffix(k.rank), proj.sx, tagY - tagH * 0.22);
                        }
                    }
                });
            }

            for (const pt of particles) {
                const proj = project3D(pt.x, pt.y);
                if (!proj) continue;
                renderList.push({
                    z: proj.z - 0.5,
                    draw: () => {
                        const alpha = Math.max(0, pt.life / pt.maxLife);
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = pt.color;
                        const s = Math.max(2, pt.size * proj.pScale * 0.38);
                        const lift = pt.z * proj.pScale * 0.45;
                        ctx.fillRect(proj.sx - s / 2, proj.sy - lift - s / 2, s, s);
                        ctx.globalAlpha = 1;
                    }
                });
            }

            renderList.sort((a, b) => b.z - a.z);
            for (const item of renderList) item.draw();
        }

        /**
         * 上空俯瞰ビュー
         */
        function renderTopDown(w, h) {
            ctx.fillStyle = currentCourse.groundBase;
            ctx.fillRect(0, 0, w, h);

            const minDim = Math.min(w, h);
            const zoom = Math.max(0.85, Math.min(1.65, minDim / 480)) * (1 - boostVisual * 0.08);
            const screenCenterX = w * 0.5;
            const screenCenterY = h * 0.60;

            ctx.save();
            ctx.translate(screenCenterX, screenCenterY);
            ctx.scale(zoom, zoom);
            ctx.rotate(-cameraAngle);
            ctx.translate(-cameraX, -cameraY);
            ctx.drawImage(trackCanvas, 0, 0);
            ctx.restore();

            const cosA = Math.cos(-cameraAngle);
            const sinA = Math.sin(-cameraAngle);
            const worldToScreen = (wx, wy) => {
                const dx = wx - cameraX;
                const dy = wy - cameraY;
                return {
                    sx: screenCenterX + (dx * cosA - dy * sinA) * zoom,
                    sy: screenCenterY + (dx * sinA + dy * cosA) * zoom
                };
            };

            const renderList = [];
            const cullMargin = 140 * zoom;

            for (const p of STATIC_PROPS) {
                const pos = worldToScreen(p.x, p.y);
                if (pos.sx < -cullMargin || pos.sx > w + cullMargin || pos.sy < -cullMargin || pos.sy > h + cullMargin) continue;
                renderList.push({
                    sy: pos.sy,
                    draw: () => {
                        const stack = SPRITE_STACKS.props[p.type];
                        drawSpriteStack(ctx, stack, pos.sx, pos.sy, p.angle - cameraAngle, 3.3 * zoom, 3.0 * zoom, 0, 1.0);
                    }
                });
            }

            for (const box of itemBoxes) {
                if (box.respawnTimer > 0) continue;
                const pos = worldToScreen(box.x, box.y);
                if (pos.sx < -cullMargin || pos.sx > w + cullMargin || pos.sy < -cullMargin || pos.sy > h + cullMargin) continue;
                const bob = (Math.sin(globalTime * 4.5 + box.x) * 4 + 8) * zoom;
                renderList.push({
                    sy: pos.sy,
                    draw: () => {
                        drawSpriteStack(ctx, SPRITE_STACKS.itemBox, pos.sx, pos.sy, globalTime * 2.5 - cameraAngle, 2.5 * zoom, 2.2 * zoom, bob, 1.0);
                    }
                });
            }

            for (const hz of hazards) {
                const pos = worldToScreen(hz.x, hz.y);
                if (pos.sx < -cullMargin || pos.sx > w + cullMargin || pos.sy < -cullMargin || pos.sy > h + cullMargin) continue;
                renderList.push({
                    sy: pos.sy,
                    draw: () => {
                        const stack = hz.type === 'oil' ? SPRITE_STACKS.oil : SPRITE_STACKS.missile;
                        drawSpriteStack(ctx, stack, pos.sx, pos.sy, hz.angle - cameraAngle, 2.3 * zoom, 1.8 * zoom, 0, 1.0);
                    }
                });
            }

            for (const k of karts) {
                const pos = worldToScreen(k.x, k.y);
                if (pos.sx < -cullMargin || pos.sx > w + cullMargin || pos.sy < -cullMargin || pos.sy > h + cullMargin) continue;
                renderList.push({
                    sy: pos.sy,
                    draw: () => {
                        let stack = SPRITE_STACKS.karts[k.color];
                        if (k.starTimer > 0 && Math.floor(globalTime * 16) % 2 === 0) {
                            stack = SPRITE_STACKS.kartsOverdrive[k.color];
                        }
                        const renderAngle = k.angle + k.visualAngleOffset - cameraAngle;
                        const bounce = k.speed > 40 ? Math.sin(globalTime * 28 + k.x) * 0.8 * zoom : 0;
                        drawSpriteStack(ctx, stack, pos.sx, pos.sy, renderAngle, 2.7 * zoom, 2.0 * zoom, Math.max(0, bounce), 1.0);
                    }
                });
            }

            for (const pt of particles) {
                const pos = worldToScreen(pt.x, pt.y);
                renderList.push({
                    sy: pos.sy + 1,
                    draw: () => {
                        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
                        ctx.fillStyle = pt.color;
                        const s = pt.size * zoom;
                        ctx.fillRect(pos.sx - s / 2, pos.sy - pt.z * zoom - s / 2, s, s);
                        ctx.globalAlpha = 1;
                    }
                });
            }

            renderList.sort((a, b) => a.sy - b.sy);
            for (const item of renderList) item.draw();
        }

        /**
         * ポップ＆ビビッドなタイトル画面ショーケース（選択中コース＆専用形状マシンが連動）
         */
        function renderTitleShowcase(w, h) {
            const c = currentCourse;

            // 1. コースカラー連動のビビッド・グラデーション背景
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, c.skyStops[0]);
            bgGrad.addColorStop(0.5, c.skyStops[1]);
            bgGrad.addColorStop(1, '#1e1042');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 2. ポップな斜めストライプ装飾
            ctx.save();
            ctx.globalAlpha = 0.14;
            ctx.fillStyle = '#ffffff';
            const stripeGap = 54;
            const scroll = (globalTime * 26) % stripeGap;
            for (let x = -h; x < w + h; x += stripeGap) {
                ctx.beginPath();
                ctx.moveTo(x + scroll, 0);
                ctx.lineTo(x + scroll + 16, 0);
                ctx.lineTo(x + scroll - h * 0.35 + 16, h);
                ctx.lineTo(x + scroll - h * 0.35, h);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            // 3. 選択中コースのシルエットをうっすら背後に回転表示
            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.translate(w / 2, h * 0.45);
            ctx.rotate(titleAngle * 0.14);
            ctx.drawImage(trackCanvas, -WORLD_SIZE / 2, -WORLD_SIZE / 2);
            ctx.restore();

            // 4. ホログラム・ターンテーブル台座（上部UIと下部UIの完全な中間）
            const cx = w / 2;
            const cy = h * 0.46;
            const scale = Math.min(w, h) < 520 ? 4.4 : 5.8;

            // 放射グロースポットライト
            const glowGrad = ctx.createRadialGradient(cx, cy + 12, scale * 3, cx, cy + 12, scale * 22);
            glowGrad.addColorStop(0, 'rgba(34, 211, 238, 0.42)');
            glowGrad.addColorStop(0.55, 'rgba(255, 46, 147, 0.18)');
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(cx, cy + 12, scale * 22, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy + 16);
            ctx.fillStyle = 'rgba(19, 11, 46, 0.85)';
            ctx.beginPath();
            ctx.ellipse(0, 0, scale * 14.5, scale * 8.0, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.strokeStyle = '#ff2e93';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, scale * 12.2, scale * 6.5, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 5. 選択中マシン（4車種専用形状）を360度ターンテーブル回転描画
            const stack = SPRITE_STACKS.karts[selectedColor];
            drawSpriteStack(ctx, stack, cx, cy + 12, titleAngle, scale, scale * 0.85, 0, 0.62);
        }

        function renderMinimap() {
            const mw = minimapCanvas.width;
            const mh = minimapCanvas.height;
            mmCtx.clearRect(0, 0, mw, mh);

            const s = mw / WORLD_SIZE;
            mmCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            mmCtx.lineWidth = 6;
            mmCtx.beginPath();
            mmCtx.moveTo(WAYPOINTS[0].x * s, WAYPOINTS[0].y * s);
            for (let i = 1; i < WAYPOINTS.length; i += 3) {
                mmCtx.lineTo(WAYPOINTS[i].x * s, WAYPOINTS[i].y * s);
            }
            mmCtx.closePath();
            mmCtx.stroke();

            for (const k of karts) {
                mmCtx.fillStyle = k.isPlayer ? '#fde047' : KART_PALETTES[k.color].L;
                mmCtx.beginPath();
                mmCtx.arc(k.x * s, k.y * s, k.isPlayer ? 4.5 : 3, 0, Math.PI * 2);
                mmCtx.fill();
            }
        }

        // ============================================================================
        // 8. 入力イベント設定（スワイプ・マルチタッチ・キーボード・コース＆マシン選択）
        // ============================================================================
        function setupControls() {
            const SWIPE_MAX_PX = 82;

            canvas.addEventListener('touchstart', (e) => {
                if (gameState !== 'RACING' && gameState !== 'COUNTDOWN') return;
                e.preventDefault();
                if (input.swipeTouchId === null && e.changedTouches.length > 0) {
                    const t = e.changedTouches[0];
                    input.swipeTouchId = t.identifier;
                    input.swipeActive = true;
                    input.swipeAnchorX = t.clientX;
                    input.swipeCurrentX = t.clientX;
                    input.swipeCurrentY = t.clientY;
                    input.swipeSteer = 0;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (!input.swipeActive) return;
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === input.swipeTouchId) {
                        input.swipeCurrentX = t.clientX;
                        input.swipeCurrentY = t.clientY;
                        let dx = t.clientX - input.swipeAnchorX;
                        if (Math.abs(dx) > SWIPE_MAX_PX) {
                            input.swipeAnchorX = t.clientX - Math.sign(dx) * SWIPE_MAX_PX;
                            dx = Math.sign(dx) * SWIPE_MAX_PX;
                        }
                        input.swipeSteer = Math.max(-1, Math.min(1, dx / SWIPE_MAX_PX));
                        break;
                    }
                }
            }, { passive: false });

            const endTouchSwipe = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === input.swipeTouchId) {
                        input.swipeTouchId = null;
                        input.swipeActive = false;
                        input.swipeSteer = 0;
                        break;
                    }
                }
            };
            canvas.addEventListener('touchend', endTouchSwipe);
            canvas.addEventListener('touchcancel', endTouchSwipe);

            let mouseDown = false;
            canvas.addEventListener('mousedown', (e) => {
                if (gameState !== 'RACING' && gameState !== 'COUNTDOWN') return;
                mouseDown = true;
                input.swipeActive = true;
                input.swipeAnchorX = e.clientX;
                input.swipeCurrentX = e.clientX;
                input.swipeCurrentY = e.clientY;
                input.swipeSteer = 0;
            });
            window.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                input.swipeCurrentX = e.clientX;
                input.swipeCurrentY = e.clientY;
                let dx = e.clientX - input.swipeAnchorX;
                if (Math.abs(dx) > SWIPE_MAX_PX) {
                    input.swipeAnchorX = e.clientX - Math.sign(dx) * SWIPE_MAX_PX;
                    dx = Math.sign(dx) * SWIPE_MAX_PX;
                }
                input.swipeSteer = Math.max(-1, Math.min(1, dx / SWIPE_MAX_PX));
            });
            window.addEventListener('mouseup', () => {
                if (!mouseDown) return;
                mouseDown = false;
                input.swipeActive = false;
                input.swipeSteer = 0;
            });

            const btnDrift = document.getElementById('btn-drift');
            const setDrift = (active) => {
                input.drift = active;
                btnDrift.classList.toggle('active-touch', active);
            };
            btnDrift.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); setDrift(true); }, { passive: false });
            btnDrift.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); setDrift(false); }, { passive: false });
            btnDrift.addEventListener('touchcancel', () => setDrift(false));
            btnDrift.addEventListener('mousedown', (e) => { e.stopPropagation(); setDrift(true); });
            window.addEventListener('mouseup', () => setDrift(false));

            const btnItem = document.getElementById('btn-item');
            const triggerItem = (e) => {
                e.preventDefault();
                e.stopPropagation();
                input.useItemQueued = true;
                btnItem.classList.add('active-touch');
                setTimeout(() => btnItem.classList.remove('active-touch'), 120);
            };
            btnItem.addEventListener('touchstart', triggerItem, { passive: false });
            btnItem.addEventListener('mousedown', triggerItem);

            // キーボード操作（PCプレイ用）
            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.keyLeft = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') input.keyRight = true;
                if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') setDrift(true);
                if (e.code === 'KeyE' || e.code === 'KeyZ' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    input.useItemQueued = true;
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.keyLeft = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') input.keyRight = false;
                if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') setDrift(false);
            });

            // コース選択カード（サムネイル付き画面）
            document.querySelectorAll('.course-card').forEach(btn => {
                btn.addEventListener('click', () => {
                    loadCourse(btn.dataset.course);
                    document.querySelectorAll('.course-card').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    sound.init();
                    sound.playBeep(660, 0.06, 'triangle', 0.06);
                });
            });

            // マシン選択（形状＋性能切替）
            document.querySelectorAll('.kart-color-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedColor = btn.dataset.color;
                    document.querySelectorAll('.kart-color-btn').forEach(b => {
                        b.classList.remove('ring-2', 'ring-yellow-300', 'border-white');
                        b.classList.add('border-white/40');
                    });
                    btn.classList.remove('border-white/40');
                    btn.classList.add('ring-2', 'ring-yellow-300', 'border-white');
                    updateMachineUI();
                    sound.init();
                    sound.playBeep(523, 0.06, 'triangle', 0.06);
                });
            });

            // STARTボタン → コース選択画面へ遷移
            document.getElementById('btn-start').addEventListener('click', () => {
                sound.init();
                sound.playBeep(660, 0.08, 'square', 0.07);
                openCourseSelect();
            });
            document.getElementById('btn-course-back').addEventListener('click', () => {
                gameState = 'TITLE';
                elCourseScreen.classList.add('hidden');
                elTitleScreen.classList.remove('hidden');
                sound.playBeep(440, 0.06, 'triangle', 0.06);
            });
            document.getElementById('btn-go-race').addEventListener('click', startRace);

            document.getElementById('btn-retry').addEventListener('click', startRace);
            document.getElementById('btn-result-course').addEventListener('click', openCourseSelect);
            document.getElementById('btn-title').addEventListener('click', () => {
                gameState = 'TITLE';
                sound.stopBgm();
                elResultScreen.classList.add('hidden');
                elResultScreen.classList.add('opacity-0');
                elResultCard.classList.add('opacity-0', 'translate-y-4');
                elHud.classList.add('hidden');
                elTitleScreen.classList.remove('hidden');
            });

            const btnCam = document.getElementById('btn-cam');
            btnCam.addEventListener('click', () => {
                cameraMode = cameraMode === '3D' ? 'TOP' : '3D';
                btnCam.textContent = cameraMode === '3D' ? '3D' : 'TOP';
            });

            const btnSound = document.getElementById('btn-sound');
            btnSound.addEventListener('click', () => {
                sound.init();
                sound.muted = !sound.muted;
                btnSound.innerHTML = sound.muted ? '<svg viewBox="0 0 24 24" width="12" height="12" style="display:block"><path fill="#fff" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9l6 6M21 9l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" width="12" height="12" style="display:block"><path fill="#fff" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
            });
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            canvas.width = wrapper.clientWidth || window.innerWidth;
            canvas.height = wrapper.clientHeight || window.innerHeight;
            render();
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            try {
                update(dt);
                render();
            } catch (err) {
                console.error(err);
            }
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            loadCourse('coast');
            renderCourseThumbnails();
            updateMachineUI();
            setupControls();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(gameLoop);
        };
    })();
    </script>
</body>
</html>
