<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0910">
<title>あのカクテル</title>
<meta name="description" content="あのカクテル。スマホを振ってシェイクすると、振り方で質感も名前も変わる不思議なカクテルができる3Dゲーム。">
<meta property="og:type" content="website"><meta property="og:site_name" content="uimemocho"><meta property="og:title" content="あのカクテル">
<meta property="og:description" content="スマホを振って、まだ名前のない一杯を。振りすぎるとドロドロ、つぶつぶ、カチカチ、けむりに。">
<meta property="og:url" content="https://uimemocho.github.io/apps/ano-cocktail/"><meta property="og:image" content="https://uimemocho.github.io/apps/ano-cocktail/ogp.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="あのカクテル"><meta name="twitter:image" content="https://uimemocho.github.io/apps/ano-cocktail/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Unbounded:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 深夜のバー。静かでスタイリッシュ、でも名前でちゃんと笑わせる
   IDEA: カウンター越しにシェイカーとグラスだけを照らすスポットライト
   PICTURE: 3Dのシェイカーとグラス、液体そのものが主役
   COLOUR and TYPE: 墨の地＋液体色のスポット／Dela Gothic One・Zen Kaku Gothic New・Unbounded
   LAYOUT: 縦画面。上にタイトル、中央に3D、下に操作。リザルトは下からシート */
:root{--tint:#6a2a7a;--ground:#0b0910;--ink:#f7f3ff;--sub:rgba(247,243,255,.64);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);overflow:hidden;font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
#bg{position:fixed;inset:0;background:radial-gradient(110% 70% at 50% 36%,var(--tint) 0%,color-mix(in srgb,var(--tint) 26%,var(--ground)) 48%,var(--ground) 82%)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(0,0,0,.55),transparent)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 22px)}
.layer.on{opacity:1;visibility:visible}
.layer.on .hit{pointer-events:auto}
.btn{appearance:none;border:0;height:56px;padding:0 30px;border-radius:999px;background:#fff;color:#140c1c;font:900 17px/1 "Zen Kaku Gothic New",sans-serif;letter-spacing:.02em;box-shadow:0 12px 32px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn.small{height:44px;padding:0 18px;font-size:14px}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:5}
#logo{font:400 15px/1 "Dela Gothic One",sans-serif;opacity:0;transition:opacity .4s}
body:not([data-phase=title]) #logo{opacity:.85}
#snd{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 2px);pointer-events:auto;height:44px;padding:0 12px;border:0;background:none;color:var(--sub);font:600 11px/1 Unbounded,sans-serif;cursor:pointer}
/* title */
#titleUI{justify-content:space-between}
.tt{margin-top:9vh;text-align:center}
.tt small{display:block;font:600 12px/1 Unbounded,sans-serif;color:var(--sub);letter-spacing:.12em;margin-bottom:14px}
.tt h1{margin:0;font:400 clamp(46px,14vw,84px)/1.05 "Dela Gothic One",sans-serif;text-shadow:0 6px 40px rgba(0,0,0,.5)}
.tt p{margin:16px 0 0;font:700 15px/1.6 "Zen Kaku Gothic New";color:var(--sub)}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.col .btn{width:min(320px,86vw)}
.fine{font-size:12px;color:var(--sub);margin-top:4px;text-align:center;line-height:1.6}
/* prep */
#prepUI{justify-content:space-between}
#chips{margin-top:52px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:440px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line);font:700 14px/1 "Zen Kaku Gothic New";animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
#lidBtn{opacity:0;transform:translateY(16px);transition:.35s}
#lidBtn.show{opacity:1;transform:none}
/* shake */
#shakeUI{justify-content:space-between}
.st{margin-top:54px;text-align:center}
#stLabel{font:400 clamp(24px,7.4vw,34px)/1.2 "Dela Gothic One",sans-serif;transition:color .3s}
#stPct{margin-top:6px;font:800 14px/1 Unbounded,sans-serif;color:var(--sub)}
.bot{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
#meter{margin-top:20px}
#hint{font:700 14px/1.6 "Zen Kaku Gothic New";color:var(--sub);text-align:center}
#meter{position:relative;width:min(420px,86vw);height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:visible}
#mFill{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,#fff 0 38.4%,#ffd36b 38.4% 50%,#ff8a5c 50% 67.3%,#ff4f8b 67.3% 88.5%,#b58bff 88.5%);clip-path:inset(0 100% 0 0 round 99px)}
.mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:rgba(255,255,255,.55);border-radius:2px}
.mk span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:700 11px/1 "Zen Kaku Gothic New";color:var(--sub);white-space:nowrap}
#pourBtn{opacity:0;transform:translateY(16px) scale(.9);transition:.35s cubic-bezier(.2,1.5,.4,1);pointer-events:none!important}
#pourBtn.show{opacity:1;transform:none;pointer-events:auto!important;animation:breath 1.6s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 0 10px rgba(255,255,255,.12),0 12px 32px rgba(0,0,0,.4)}}
#pop{position:fixed;left:0;right:0;top:40%;text-align:center;font:800 clamp(52px,17vw,110px)/1 Unbounded,sans-serif;pointer-events:none;opacity:0;z-index:6;text-shadow:0 10px 40px rgba(0,0,0,.45)}
#pop.jp{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(46px,14vw,90px)}
#pop.go{animation:popT 1.1s cubic-bezier(.2,1.4,.3,1) both}
@keyframes popT{0%{opacity:0;transform:scale(.3) skewX(-8deg)}25%{opacity:1;transform:scale(1.08) skewX(-8deg)}70%{opacity:1;transform:scale(1) skewX(-8deg)}100%{opacity:0;transform:scale(1.25) skewX(-8deg)}}
/* result */
#resultUI{justify-content:flex-end;padding:0}
.sheet{width:100%;max-height:58vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:28px 20px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(to top,rgba(11,9,16,.97) 78%,rgba(11,9,16,0));display:flex;flex-direction:column;align-items:center;transform:translateY(30px);transition:transform .5s cubic-bezier(.2,1,.3,1)}
#resultUI.on .sheet{transform:none}
.sw{width:100%;max-width:520px;text-align:center}
.rk{display:flex;justify-content:center;align-items:baseline;gap:10px}
.rk small{font:600 11px/1 Unbounded;color:var(--sub)}
.rk b{font:800 54px/1 Unbounded,sans-serif}
.rk b.r-SSS{background:linear-gradient(100deg,#ffe58a,#ff7ab8,#9b8cff,#7ff0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rk b.r-SS{color:#ffd76a}.rk b.r-S{color:#e8f1ff}
.nm{margin:10px 0 0;font:400 clamp(28px,8.6vw,44px)/1.18 "Dela Gothic One",sans-serif;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.en{margin-top:8px;font:600 11px/1.4 Unbounded;color:var(--sub)}
.fl{margin:16px 0 4px;font:700 16px/1.7 "Zen Kaku Gothic New"}
.nt{font-size:13px;color:var(--sub);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.tag{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;border:1px solid var(--line);font:700 13px/1 "Zen Kaku Gothic New";background:rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;text-align:left;margin:8px 0 16px;padding:16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.grid div{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 13px/1.4 "Zen Kaku Gothic New"}
.pips{display:flex;gap:3px}.pips i{width:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}.pips i.on{background:#fff}
.val{font:800 13px/1 Unbounded;white-space:nowrap}
.rec{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font:700 13px/1.6 "Zen Kaku Gothic New";color:var(--sub);margin-bottom:16px}
.rec span{display:inline-flex;align-items:center;gap:6px}.rec i{width:9px;height:9px;border-radius:50%}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:6px}
.acts .btn{width:100%;padding:0 10px}
.acts .wide{grid-column:1/-1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,4,8,.86);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal.on{display:flex}
#shImg{max-width:min(420px,90vw);max-height:56vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.modal p{margin:0;font:700 14px/1.6 "Zen Kaku Gothic New";color:var(--sub);text-align:center}
.mrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#bookUI .box{width:min(480px,92vw);max-height:76vh;overflow-y:auto;touch-action:pan-y;background:#15111d;border:1px solid var(--line);border-radius:22px;padding:20px}
#bookUI h2{margin:0 0 12px;font:400 22px/1.2 "Dela Gothic One";text-align:center}
.bk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font:700 15px/1.4 "Zen Kaku Gothic New"}
.bk i{width:18px;height:18px;border-radius:50%}
.bk b{font:800 13px/1 Unbounded}
.bk small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:24px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);transform:translateX(-50%);background:rgba(255,255,255,.95);color:#140c1c;padding:10px 16px;border-radius:12px;font:700 13px/1.4 "Zen Kaku Gothic New";opacity:0;transition:opacity .3s;pointer-events:none;z-index:12;max-width:86vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px) and (orientation:landscape){
 #resultUI{align-items:flex-end;justify-content:center}
 .sheet{width:460px;max-height:100vh;height:100%;justify-content:center;background:linear-gradient(to left,rgba(11,9,16,.96) 80%,rgba(11,9,16,0));padding:30px 34px}
}
#dbgBtn{display:none;position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 2px);z-index:9;height:44px;padding:0 12px;border:0;background:none;color:#ffd36b;font:800 11px/1 Unbounded,sans-serif;cursor:pointer}
#dbg{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 46px);z-index:9;width:min(300px,calc(100vw - 20px));max-height:calc(100vh - 80px);overflow-y:auto;touch-action:pan-y;background:rgba(18,14,26,.94);border:1px solid rgba(255,211,107,.4);border-radius:16px;padding:14px;display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dbg.on{display:block}
#dbg h3{margin:0 0 10px;font:800 12px/1 Unbounded;color:#ffd36b}
#dbg .lb{font:700 12px/1 "Zen Kaku Gothic New";color:var(--sub);margin:10px 0 6px}
#dbg .seg{display:flex;flex-wrap:wrap;gap:6px}
#dbg .seg button{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:700 12px/1 "Zen Kaku Gothic New";cursor:pointer}
#dbg .seg button.on{background:#ffd36b;color:#140c1c;border-color:#ffd36b}
#dbg .acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#dbg .acts2 button{height:42px;border-radius:12px;border:0;font:900 13px/1 "Zen Kaku Gothic New";cursor:pointer;background:#fff;color:#140c1c}
#dbg .acts2 button.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line)}
#dbg .acts2 .w{grid-column:1/-1}
#dbg small{display:block;margin-top:10px;font-size:11px;color:var(--sub);line-height:1.5}
@media(prefers-reduced-motion:reduce){#pourBtn.show{animation:none}.chip{animation:none}}
</style>
</head>
<body data-phase="title">
<div id="bg"></div>
<canvas id="gl"></canvas>
<div id="top"><div id="logo">あのカクテル</div><button id="snd" aria-label="サウンド切替">SOUND ON</button></div>

<section id="titleUI" class="layer on">

 <div class="col">
  <button id="startBtn" class="btn hit">シェイクをはじめる</button>

 </div>

 <div id="chips"></div>

</section>

 <div class="st"><div id="stLabel">シェイク中</div><div id="stPct">0%</div></div>

  <div id="meter"><div id="mFill"></div><b class="mk" style="left:38.4%"><span>完成</span></b><b class="mk" style="left:50%"></b><b class="mk" style="left:67.3%"></b><b class="mk" style="left:88.5%"></b></div>
  <button id="pourBtn" class="btn hit">グラスに注ぐ</button>
 </div>
</section>

<section id="resultUI" class="layer"><div class="sheet hit"><div class="sw" id="resBody"></div></div></section>

<div id="pop"></div>

<div id="shareUI" class="modal">
 <img id="shImg" alt="シェア画像">
 <p id="shTip">画像を長押しで保存して、投稿に添付してね</p>

</div>

 <div class="lb">質感</div><div class="seg" id="dTex"></div>
 <div class="lb">グラス</div><div class="seg" id="dGlass"></div>

 <div class="acts2"><button class="w" id="dPour">この設定で注ぐ</button><button class="g" id="dShaker">シェイカーで見る</button><button class="g" id="dRand">全部ランダム</button></div>
 <small>おまかせ＝通常の判定。注ぐとシェイクを飛ばしてリザルトまで進みます。シェイカーで見るは、その質感になるシェイク量で止めた状態を表示します。</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{

function seg(id,key,items){const el=$('#'+id);const all=[[null,'おまかせ'],...items];el.innerHTML=all.map(([v,l])=>`<button data-v="${v===null?'':esc(v)}" class="${DBG[key]===v?'on':''}">${esc(l)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;DBG[key]=b.dataset.v||null;[...el.children].forEach(c=>c.classList.toggle('on',c===b));};}
function dbgUI(){seg('dTex','tex',Object.keys(TEX).map(k=>[k,TEX[k].jp]));seg('dGlass','glass',Object.keys(GLASSES).map(k=>[k,GLASS_JP[k]]));seg('dTone','tone',[['stylish','スタイリッシュ'],['trend','トレンド'],['baka','バカネタ']]);seg('dRank','rank',RANKS.map(r=>[r,r]));}
function dbgPrime(tex){AU.init();AU.resume();HP.init();$('#shareUI').classList.remove('on');$('#bookUI').classList.remove('on');newRound();
 const o=TEX_O[tex];SH.frac=SH.fill;SH.liq.frac=SH.fill*VPT[tex].fracMul;SH.tin.position.y=0;[S.A,S.B]=baseColors(S.ings,3);
 $('#chips').innerHTML=S.ings.map(g=>`<span class="chip"><i style="background:${g.c};color:${g.c}"></i>${esc(g.n)}</span>`).join('');
 Object.assign(S,{dbg:true,energy:o*S.target,o,done:true,stage:stageOf(o),time:5.2,half:44,active:5,mSum:5*18,peak:24,ax:[1,4,0.5],intervals:[.24,.25,.23,.26,.24,.25],over:(tex==='doro'||tex==='tsubu')?tex:null});
 setVP(tex==='galaxy'?'liquid':tex);for(const k in S.vt)VP[k]=S.vt[k];const [a,b]=texColors(tex==='galaxy'?'liquid':tex,S.A,S.B);curA.copy(a);curB.copy(b);
 go('shake');$('#pourBtn').classList.add('show');$('#stPct').textContent=Math.round(o*100)+'%';$('#mFill').style.clipPath=`inset(0 ${(100-Math.min(100,o/2.6*100)).toFixed(1)}% 0 0 round 99px)`;}
function dbgTex(){return DBG.tex||pick(Object.keys(TEX));}
$('#dbgBtn').onclick=()=>$('#dbg').classList.toggle('on');
$('#dPour').onclick=()=>{const t=dbgTex(),keep=DBG.tex;DBG.tex=t;dbgPrime(t);startPour();DBG.tex=keep;$('#dbg').classList.remove('on');};
$('#dShaker').onclick=()=>{const t=dbgTex();dbgPrime(t==='galaxy'?'liquid':t);$('#dbg').classList.remove('on');toast('シェイカー：'+TEX[t==='galaxy'?'liquid':t].jp+'（振ると先に進みます）');};
$('#dRand').onclick=()=>{const keep={...DBG};DBG.tex=pick(Object.keys(TEX));DBG.glass=pick(Object.keys(GLASSES));DBG.tone=pick(['stylish','trend','baka']);DBG.rank=null;dbgPrime(DBG.tex);startPour();Object.assign(DBG,keep);$('#dbg').classList.remove('on');};
dbgUI();
(()=>{let q="";try{q=location.search+location.hash;}catch(e){}if(/debug/i.test(q))$("#dbgBtn").style.display="block";})();

/* ================= boot ================= */
function titleLiquid(){const pool=[...INGS].sort(()=>Math.random()-0.5);S.ings=pool.slice(0,3);[S.A,S.B]=baseColors(S.ings,3);curA.copy(S.A);curB.copy(S.B);tgtA.copy(S.A);tgtB.copy(S.B);setVP('liquid');SH.frac=SH.fill;}
titleLiquid();
document.documentElement.style.setProperty('--tint','#'+S.A.clone().lerp(new THREE.Color('#0b0910'),0.45).getHexString());
$('#startBtn').onclick=()=>{AU.init();AU.resume();HP.init();HP.tap(20);askMotion().then(ok=>{if(!ok)toast('モーションの許可がないので、画面をこすってシェイクできます');});newRound();go('prep');
 document.documentElement.style.setProperty('--tint','#3a2448');};
$('#lidBtn').onclick=()=>{AU.resume();closeLid();};
$('#pourBtn').onclick=()=>{AU.resume();startPour();};
$('#bookBtn').onclick=showBook;$('#bkClose').onclick=()=>$('#bookUI').classList.remove('on');
$('#shClose').onclick=()=>$('#shareUI').classList.remove('on');
$('#snd').onclick=()=>{AU.init();AU.setOn(!AU.on);$('#snd').textContent=AU.on?'SOUND ON':'SOUND OFF';};
requestAnimationFrame(frame);
}
</script>
</body>
</html>
