<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>セロ活</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 静か・余白・上質。何もしないことを肯定する
   IDEA: 夕暮れの床の間。線香一本ぶんの時間
   PICTURE: 3Dの香立てと一本の線香、煙、灰
   COLOUR and TYPE: 墨・聚楽壁の青鼠・生成り、差し色は金と朱 / 明朝＋角ゴシック
   LAYOUT: 上に段位、中央に香立て、下に選択パネル。燃焼中はUIを消す */
:root{--ink:#efe9de;--sub:rgba(239,233,222,.64);--dim:rgba(239,233,222,.4);--line:rgba(239,233,222,.14);--gold:#dcb76c;--shu:#c8442f;--glass:rgba(13,14,16,.62);--mincho:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;--goth:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0c0d;color:var(--ink);overflow:hidden;font:15px/1.6 var(--goth);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 42%,transparent 50%,rgba(0,0,0,.6))}
.ui{position:fixed;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.ui.show{opacity:1;visibility:visible;transition:opacity .9s ease}
.ui.show .pe{pointer-events:auto}
/* home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dan{width:min(220px,60vw)}
.danName{font:800 24px/1.15 var(--mincho);letter-spacing:.06em}
.bar{height:2px;background:var(--line);margin:9px 0 6px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.danSub{font-size:12px;color:var(--sub)}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.icon svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5}
.titleW{text-align:center;margin-top:4vh;filter:drop-shadow(0 4px 18px rgba(0,0,0,.55))}
.title{margin:0;font:800 clamp(46px,13vw,68px)/1 var(--mincho);letter-spacing:.14em;text-indent:.14em}
.tag{margin:12px 0 0;font:600 15px/1.5 var(--mincho);color:var(--sub);letter-spacing:.08em;text-indent:.08em}
.panel{margin-top:auto;align-self:center;width:min(460px,100%);background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px 14px 14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lbl{font-size:12px;color:var(--dim);margin:0 2px 8px;letter-spacing:.06em}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.chip{height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);font:700 15px/1 var(--goth);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:background .25s,color .25s}
.chip.on{background:var(--ink);color:#141414;border-color:var(--ink)}
.chip.lock{opacity:.38}
.chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.custom{display:none;align-items:center;gap:12px;margin:-4px 2px 12px}
.custom.on{display:flex}
.custom input{flex:1;accent-color:var(--gold);height:32px}
.custom b{font:800 18px var(--mincho);width:64px;text-align:right}
.skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.skin{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:12px;border:1px solid transparent;transition:border-color .25s,background .25s}
.skin.on{border-color:rgba(220,183,108,.55);background:rgba(220,183,108,.08)}
.skin.lock{opacity:.33}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -5px 8px rgba(0,0,0,.45),inset 0 3px 5px rgba(255,255,255,.18);position:relative}
.skin.lock .sw::after{content:'';position:absolute;inset:9px;border:2px solid rgba(255,255,255,.6);border-radius:3px}
.skin span{font-size:12px;line-height:1.2;text-align:center;color:var(--sub)}
.lockMsg{min-height:20px;font-size:12px;color:var(--gold);text-align:center;margin:8px 0 6px}
.primary{width:100%;height:56px;border-radius:14px;background:var(--ink);color:#151515;font:800 19px/1 var(--mincho);letter-spacing:.24em;text-indent:.24em;transition:transform .15s}
.primary:active{transform:scale(.98)}
.stats{text-align:center;font-size:12px;color:var(--dim);margin-top:10px}
/* hud */
.hint{position:absolute;left:0;right:0;top:18%;text-align:center;opacity:0;transition:opacity 1.6s ease;padding:0 20px}
.hint.on{opacity:1}
.hint div{font:600 18px/1.6 var(--mincho);letter-spacing:.12em;filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
.hint small{display:block;margin-top:6px;font-size:12px;color:var(--sub)}
#abort{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(239,233,222,.1);font-size:12px;color:var(--dim);overflow:hidden;opacity:.55}
#abort i{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--shu);transform:scaleX(0);transform-origin:left;transition:transform .2s}
#abort.h i{transform:scaleX(1);transition:transform 1.2s linear}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05)}
.prog i{display:block;height:100%;width:0;background:rgba(239,233,222,.35)}
.pop{position:fixed;pointer-events:none;font:600 13px var(--mincho);color:rgba(239,233,222,.75);transform:translate(-50%,-50%);animation:pop 1.6s ease-out forwards}
.pop::before{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:1px solid rgba(239,233,222,.35);border-radius:50%;animation:rip 1.2s ease-out forwards}
@keyframes pop{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-30px}}
@keyframes rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* result */
#result{background:linear-gradient(to top,rgba(9,9,10,.94) 46%,rgba(9,9,10,.35) 78%,rgba(9,9,10,.1));justify-content:flex-end;overflow-y:auto}
.card{width:min(460px,100%);align-self:center;padding:8px 4px 4px}
.rHead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.rHead span{font:800 22px var(--mincho);letter-spacing:.1em}
.rHead b{font:700 15px var(--goth);color:var(--sub)}
.quote{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.qk{writing-mode:vertical-rl;font:800 40px/1.1 var(--mincho);letter-spacing:.08em;padding:4px 14px 4px 0;border-right:1px solid var(--line);flex:none;max-height:260px}
.qt{flex:1}
.qLbl{font-size:12px;color:var(--gold);letter-spacing:.08em}
.qr{font:600 15px var(--mincho);color:var(--sub);margin:4px 0 8px}
.qm{margin:0;font:600 17px/1.75 var(--mincho)}
.rStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rStats>div{padding:10px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.rStats>div+div{border-left:1px solid var(--line)}
.rStats span{font-size:12px;color:var(--dim)}
.rStats b{font:800 28px/1.2 var(--mincho)}
.rStats .rk b{font-size:40px;color:var(--ink)}
.rStats .rk b.hi{color:var(--gold)}
.rDan{margin:14px 2px 4px}
.rowsb{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowsb b{font:800 18px var(--mincho)}
.rowsb span{font-size:12px;color:var(--sub)}
.unl{display:flex;flex-wrap:wrap;gap:6px;min-height:8px;margin:8px 0}
.unl span{font-size:13px;padding:4px 10px;border-radius:20px;border:1px solid rgba(220,183,108,.5);color:var(--gold)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.x{background:#000;border-color:rgba(255,255,255,.25)}
.btns .primary{height:48px;font-size:17px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.mIn{width:min(440px,100%);text-align:center;max-height:100%;overflow:auto}
.mIn img{max-width:100%;max-height:68vh;border-radius:10px;display:block;margin:0 auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.mIn p{font-size:13px;color:var(--sub)}
.sm{background:#141517;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left}
.sm h3{margin:0 0 12px;font:800 20px var(--mincho)}
.row{display:flex;justify-content:space-between;align-items:center;height:52px;border-bottom:1px solid var(--line)}
.tog{height:36px;min-width:72px;border-radius:18px;border:1px solid var(--line);font-weight:700}
.tog.on{background:var(--ink);color:#151515}
select{height:40px;border-radius:10px;background:#1d1e21;border:1px solid var(--line);padding:0 10px;font-size:16px}
.sm .btn{width:100%;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,22,.9);border:1px solid var(--line);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;z-index:30}
#toast.on{opacity:1}
#dbg{position:fixed;left:8px;bottom:8px;z-index:40;display:none;gap:4px;flex-wrap:wrap;max-width:240px}
#dbg button{font-size:12px;padding:6px 8px;border:1px solid #555;border-radius:6px;background:#222}
@media (min-aspect-ratio:1/1){.titleW{margin-top:2vh}.panel{align-self:flex-end;margin-right:2vw}}
@media (prefers-reduced-motion:reduce){.ui,.hint,.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>

<div id="home" class="ui">
  <div class="top">
    <div class="dan pe"><div class="danName" id="danName"></div><div class="bar"><i id="danBar"></i></div><div class="danSub" id="danSub"></div></div>
    <button class="icon pe" id="btnSet" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </div>
  <div class="titleW"><h1 class="title">セロ活</h1><p class="tag" data-i="tag"></p></div>
  <div class="panel pe">
    <div class="lbl" data-i="timeT"></div>
    <div class="chips" id="chips"></div>
    <div class="custom" id="customRow"><input type="range" id="cust" min="1" max="60" step="1"><b id="custV"></b></div>
    <div class="lbl" data-i="skinT"></div>
    <div class="skins" id="skins"></div>
    <div class="lockMsg" id="lockMsg"></div>
    <button class="primary" id="btnLight" data-i="light"></button>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div id="hud" class="ui">
  <div class="hint" id="hint"><div data-i="hint"></div><small data-i="hint2"></small></div>
  <button id="abort" class="pe"><span data-i="hold"></span><i></i></button>
  <div class="prog"><i id="prog"></i></div>
</div>

<div id="result" class="ui">
  <div class="card pe">
    <div class="rHead"><span data-i="burned"></span><b id="rTime"></b></div>
    <div class="quote"><div class="qk" id="qK"></div><div class="qt"><div class="qLbl" data-i="word"></div><div class="qr" id="qR"></div><p class="qm" id="qM"></p></div></div>
    <div class="rStats">
      <div><span data-i="zat"></span><b id="rZat"></b></div>
      <div class="rk"><span data-i="rank"></span><b id="rRank"></b></div>
      <div><span data-i="xp"></span><b id="rXp"></b></div>
    </div>
    <div class="rDan"><div class="rowsb"><b id="rDan"></b><span id="rDanSub"></span></div><div class="bar"><i id="rBar"></i></div></div>
    <div class="unl" id="rUnl"></div>
    <div class="btns">
      <a class="btn x" id="btnX" target="_blank" rel="noopener"><span data-i="post"></span></a>
      <button class="btn" id="btnImg" data-i="img"></button>
      <button class="btn" id="btnHome" data-i="home"></button>
      <button class="primary" id="btnAgain" data-i="again"></button>
    </div>
  </div>
</div>

<div id="imgView" class="modal"><div class="mIn"><img id="shot" alt=""><p data-i="save"></p><button class="btn" id="imgClose" style="width:100%" data-i="close"></button></div></div>
<div id="setM" class="modal"><div class="mIn sm"><h3 data-i="settings"></h3>
  <div class="row"><span data-i="sound"></span><button class="tog" id="tgSound"></button></div>
  <div class="row"><span data-i="lang"></span><select id="selLang"></select></div>
  <button class="btn" id="setClose" data-i="close"></button></div></div>
<div id="toast"></div>
<div id="dbg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

if(location.hash==='#debug'){const d=$('#dbg');d.style.display='flex';[['x1',()=>SPD=1],['x30',()=>SPD=30],['x120',()=>SPD=120],['+500XP',()=>{S.xp+=500;save();renderHome()}],['ALL',()=>{S.done={1:1,3:1,5:1,10:1};S.xp=Math.max(S.xp,2200);save();renderHome()}],['RESET',()=>{S=JSON.parse(JSON.stringify(DEF));save();buildBowl(0);renderHome()}]].forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;d.appendChild(b)})}

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.6?47:w/h<1?42:31;camera.updateProjectionMatrix();
  sMat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360))}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;TM+=dt;
  // camera
  const k=1-Math.exp(-dt*(state==='burning'?.6:1.2));
  const orb=state==='home'?Math.sin(TM*.07)*.22:Math.sin(TM*.05)*.04,br=Math.sin(TM*.4)*.12;
  const tp=_v.set(Math.sin(orb)*camPos.z,camPos.y+br,Math.cos(orb)*camPos.z);cP.lerp(tp,k);cT.lerp(camTgt,k);camera.position.copy(cP);camera.lookAt(cT);
  let target=0;
  if(state==='burning'){const nowMs=Date.now();sess.acc+=(nowMs-sess.lastNow)*SPD;sess.lastNow=nowMs;const p=Math.min(1,sess.acc/1000/sess.dur);
    const L=L0*(1-p),dl=curL-L;ashLen+=dl*.92;if(ashLen>ashTh)dropAsh();target=1;setStick(L);$('#prog').style.width=(p*100)+'%';
    if(AC&&TM>nextCrk){crackle();nextCrk=TM+.6+Math.random()*3}
    if(p>=1){state='ending';sess.endT=TM;captureNext=true;setTimeout(()=>rin(.7),900)}}
  else if(state==='ending'){const e=TM-sess.endT;target=e<1.2?1-e/1.2*.6:Math.max(0,.4-(e-1.2)*.25);if(e>.9&&ashLen>0)dropAsh();setStick(0);if(e>4.2)finish()}
  emberLv+=(target-emberLv)*(1-Math.exp(-dt*(target>emberLv?3:1.5)));
  const fl=.82+.18*vn(TM*4,3.3)+.06*Math.sin(TM*13);const e=emberLv*fl;
  ember.visible=emberLv>.02;ember.material.color.setRGB(1.6*e+.05,.5*e*e+.02,.12*e);
  glow.material.opacity=Math.min(1,e*1.1);glow.scale.setScalar(1.1+e*1.4);eLight.intensity=1.5*e;
  charM.visible=emberLv>.02&&curL>.15;
  updSmoke(dt,TM,state==='burning'?emberLv:state==='ending'?emberLv*.8:0);updFalling(dt);
  for(let i=0;i<dustN;i++){dP[i*3+1]+=dt*(.06+.04*Math.sin(i+TM*.3));dP[i*3]+=dt*.05*Math.sin(TM*.2+i);if(dP[i*3+1]>32)dP[i*3+1]=0}dustG.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
  if(captureNext){captureNext=false;snapC.width=renderer.domElement.width;snapC.height=renderer.domElement.height;snapC.getContext('2d').drawImage(renderer.domElement,0,0)}}

applyI18n();buildBowl(S.skin<5?S.skin:0);resetStick();renderHome();show('#home',true);requestAnimationFrame(loop);
window.__sero={get state(){return state},start:startSession,set spd(v){SPD=v}};
}
