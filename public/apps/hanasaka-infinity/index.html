   ========================================================= */
function fmtP(n){
  if(!isFinite(n))return['∞',''];
  const U=NUM[LANG];
  if(U){
    if(n<1e4)return[n<100&&n%1>0.05?n.toFixed(1):Math.floor(n).toLocaleString('ja-JP'),''];
    const lg=Math.log10(n),e=Math.floor(lg/4);
    if(e>=U.length){const ex=Math.floor(lg);return[(n/Math.pow(10,ex)).toFixed(2)+'e'+ex,''];}
    const m=n/Math.pow(10,e*4);
    return[m>=1000?Math.floor(m).toString():m>=100?m.toFixed(1):m>=10?m.toFixed(2):m.toFixed(3),U[e]];
  }
  if(n<1e3)return[n<100&&n%1>0.05?n.toFixed(1):Math.floor(n).toString(),''];
  const lg=Math.log10(n),e=Math.floor(lg/3);
  if(e>=WEST.length){const ex=Math.floor(lg);return[(n/Math.pow(10,ex)).toFixed(2)+'e'+ex,''];}
  const m=n/Math.pow(10,e*3);
  return[m>=100?m.toFixed(1):m>=10?m.toFixed(2):m.toFixed(3),WEST[e]];
}
const fmt=n=>{const[a,b]=fmtP(n);return a+b;};

const AU={ctx:null,mute:false,step:0,next:0,last:0,lastShot:0};
function initAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();AU.ctx=c;
    AU.master=c.createGain();AU.master.gain.value=S.sound?.55:0;
    const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
    AU.bgm=c.createGain();AU.bgm.gain.value=.32;AU.bgm.connect(AU.master);
    AU.sfx=c.createGain();AU.sfx.gain.value=.7;AU.sfx.connect(AU.master);
    AU.dly=c.createDelay(1);AU.dly.delayTime.value=.36;AU.fb=c.createGain();AU.fb.gain.value=.42;
    AU.dlp=c.createBiquadFilter();AU.dlp.type='lowpass';AU.dlp.frequency.value=2600;
    AU.dly.connect(AU.dlp);AU.dlp.connect(AU.fb);AU.fb.connect(AU.dly);AU.dlp.connect(AU.bgm);
    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
    AU.next=c.currentTime+.1;setInterval(sched,25);
  }catch(e){AU.ctx=null;}
}
const SCL=[0,2,5,7,9];
const mtof=m=>440*Math.pow(2,(m-69)/12);
const sm=(i,b)=>b+SCL[((i%5)+5)%5]+12*Math.floor(i/5);
function osc(f,t,dur,vol,type,dest,glide,f1){const c=AU.ctx,o=c.createOscillator(),gn=c.createGain();o.type=type||'triangle';
  o.frequency.setValueAtTime(f*(1+(glide||0)),t);if(glide)o.frequency.exponentialRampToValueAtTime(f,t+.05);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.05);return gn;}
function nz(t,dur,vol,ft,fr,dest,q,att){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),gn=c.createGain();s.buffer=AU.noise;f.type=ft;f.frequency.value=fr;f.Q.value=q||1;
  if(att){gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+att);}else gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(dest||AU.sfx);s.start(t,Math.random()*.4);s.stop(t+dur+.05);}
const pluck=(f,t,dur,vol,dest)=>{osc(f,t,dur,vol,'triangle',dest,.02);osc(f*2,t,dur*.35,vol*.3,'sine',dest);};
const kick=(t,v,d)=>osc(150,t,.16,v,'sine',d,0,40);
const taiko=(t,v,d)=>{osc(110,t,.45,v,'sine',d,0,55);nz(t,.08,v*.3,'lowpass',500,d);};
const MEL=[0,-1,2,-1,3,-1,2,1,0,-1,-1,-1,4,3,2,-1,5,-1,4,-1,3,2,1,-1,2,-1,0,-1,-1,-1,-1,-1];
const ARP=[0,2,4,7,5,4,2,4,0,2,4,7,9,7,5,4];
function sched(){const c=AU.ctx;if(!c)return;
  while(AU.next<c.currentTime+.12){playStep(AU.step,AU.next);
    const gp=GRP(S.tier),bpm=[84,100,140,128][gp]*(RT.feverT>0?1.2:1);AU.next+=60/bpm/4;AU.step=(AU.step+1)%64;}}
function playStep(s,t){
  if(AU.mute||RT.ending)return;const gp=GRP(S.tier),B=AU.bgm,s32=s%32,fv=RT.feverT>0;
  const m=MEL[s32];
  if(gp<=1){
    if(m>=0)pluck(mtof(sm(m,62)),t,.6,.16,B);
    if(s32%8===0)osc(mtof(s32<16?38:45),t,.7,.22,'sine',B);
    if(gp===0&&s===16)osc(mtof(sm(7,74)),t,1.6,.05,'sine',B,.01);
    if(gp===1){if(s32===0||s32===10||s32===16)taiko(t,.5,B);if(s32%8===4)nz(t,.05,.12,'bandpass',2400,B,4);if(s32%2===1)nz(t,.02,.03,'highpass',8000,B);}
  }else if(gp===2){
    if(s%4===0)kick(t,.55,B);if(s%4===2)nz(t,.03,.08,'highpass',9000,B);if(s%8===4)nz(t,.09,.14,'bandpass',1800,B,1.2);
    osc(mtof(s%2?50:38),t,.1,.09,'sawtooth',B);
    pluck(mtof(sm(ARP[s%16],74)),t,.14,.07,B);
    if(m>=0&&s%2===0)pluck(mtof(sm(m,74)),t,.3,.08,B);
  }else{
    if(s%4===0)kick(t,.55,B);if(s%2===1)nz(t,.02,.04,'highpass',10000,B);if(s%8===4)nz(t,.07,.1,'bandpass',2200,B,1.5);
    if(s%3===0){const f=mtof(sm(ARP[(s*5)%16]+(s%32<16?0:2),74));osc(f,t,.16,.06,'square',AU.dly);osc(f,t,.16,.05,'square',B);}
    if(s%32===0)[0,2,4].forEach(i=>{osc(mtof(sm(i,50)),t,2.4,.03,'sawtooth',B);osc(mtof(sm(i,50))*1.007,t,2.4,.03,'sawtooth',B);});
    if(s===0)[1,2.76,5.4].forEach((k,i)=>osc(110*k,t,3,.06/(i+1),'sine',B));
    if(m>=0&&s%2===0)pluck(mtof(sm(m,62)),t,.5,.08,AU.dly);
  }
  if(fv&&s%2===0)osc(mtof(sm((s*3)%12,86)),t,.08,.04,'square',B);
}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
const SFX={
  tap(c){if(!AU.ctx)return;const t=Math.max(now(),AU.last+.028);AU.last=t;if(t-now()>.25)return;const f=mtof(sm(c%15,69)),gp=GRP(S.tier);
    pluck(f,t,.5,.17);if(gp>=2)osc(f*2,t,.12,.04,'square');if(gp>=3)osc(f*2.76,t,.4,.03,'sine');},
  bark(){if(!AU.ctx)return;const t=now();[0,.16].forEach(o=>{osc(720,t+o,.11,.18,'square',AU.sfx,0,330);nz(t+o,.06,.08,'bandpass',1400,AU.sfx,3);});},
  buy(){if(!AU.ctx)return;const t=now();[0,2,4].forEach((i,k)=>pluck(mtof(sm(i+5,74)),t+k*.04,.4,.12));},
  no(){if(!AU.ctx)return;osc(180,now(),.12,.08,'square');},
  shot(){if(!AU.ctx)return;const t=now();if(t-AU.lastShot<.12)return;AU.lastShot=t;nz(t,.12,.05,'lowpass',900);},
  mankai(){if(!AU.ctx)return;const t=now();[0,2,4,5,7,9,10].forEach((i,k)=>{osc(mtof(sm(i,62)),t+k*.015,2.6,.08,'triangle');osc(mtof(sm(i,62))*1.006,t,1.8,.025,'sawtooth');});nz(t,2,.25,'highpass',5000,AU.sfx,.7,.05);taiko(t,.8);},
  fever(){if(!AU.ctx)return;const t=now();osc(200,t,.8,.12,'sawtooth',AU.sfx,0,1600);for(let i=0;i<8;i++)pluck(mtof(sm(i,74)),t+.4+i*.04,.4,.1);},
  silence(d){if(!AU.ctx)return;AU.mute=true;const t=now();AU.bgm.gain.cancelScheduledValues(t);AU.bgm.gain.setValueAtTime(AU.bgm.gain.value,t);AU.bgm.gain.linearRampToValueAtTime(0,t+.05);
    setTimeout(()=>{AU.mute=false;if(!AU.ctx)return;const t2=now();AU.bgm.gain.cancelScheduledValues(t2);AU.bgm.gain.setValueAtTime(0,t2);AU.bgm.gain.linearRampToValueAtTime(.32,t2+.6);},d*1000);},
  bell(){if(!AU.ctx)return;const t=now();[0,4,7,9].forEach((i,k)=>{osc(mtof(sm(i,74)),t+k*.25,2.2,.07,'sine');osc(mtof(sm(i,74))*2.76,t+k*.25,1,.02,'sine');});},
};
function setSound(on){S.sound=on;const b=$('snd');b.textContent=on?tt('snd_on'):tt('snd_off');b.setAttribute('aria-pressed',String(on));if(AU.master)AU.master.gain.value=on?.55:0;}

/* =========================================================
   Palettes / sakura drawing
   ========================================================= */
const PALS=[
  {nm:'ソメイヨシノ',sh:'#e47aa2',mn:'#ffb3cf',hi:'#fff0f5'},
  {nm:'夜桜',       sh:'#9a3f86',mn:'#ff86c4',hi:'#ffe2ff'},
  {nm:'八重桜',     sh:'#b81f58',mn:'#ff5c94',hi:'#ffd0e0'},
  {nm:'虹桜',rainbow:true},
];
let T=0;
function pal(sh){const P=PALS[Math.min(S.loops,3)];if(!P.rainbow)return P;const h=((T*50+(sh||0))%360+360)%360;return{sh:`hsl(${(h+30)%360},85%,55%)`,mn:`hsl(${h},95%,73%)`,hi:`hsl(${h},100%,93%)`};}
function puff(x,y,r,P){P=P||pal(x*2+y);x=Math.round(x);y=Math.round(y);
  if(r<=1){R(x,y,2,2,P.mn);R(x,y,1,1,P.hi);return;}
  disc(x,y+1,r,P.sh);disc(x,y,r,P.mn);R(x-Math.round(r*.4),y-r+1,1,1,P.hi);if(r>=3){R(x-Math.round(r*.4)+1,y-r+1,1,1,P.hi);R(x+Math.round(r*.3),y-Math.round(r*.2),1,1,P.hi);}}
function flower(cx,cy,Rr,rot,P,ctx){
  const c=ctx||g;P=P||pal();const pc=[],nc=[];
  for(let k=0;k<5;k++){const a=rot+k*Math.PI*2/5-Math.PI/2;pc.push([Math.cos(a)*Rr*.5,Math.sin(a)*Rr*.5]);nc.push([Math.cos(a)*Rr*.95,Math.sin(a)*Rr*.95]);}
  const pr2=Math.pow(Rr*.45,2),nr2=Math.pow(Rr*.14,2),cr2=Math.pow(Rr*.22,2);
  for(let y=-Rr;y<=Rr;y++)for(let x=-Rr;x<=Rr;x++){
    let inP=-1;for(let k=0;k<5;k++){const dx=x-pc[k][0],dy=y-pc[k][1];if(dx*dx+dy*dy<pr2){const ex=x-nc[k][0],ey=y-nc[k][1];if(ex*ex+ey*ey>nr2){inP=k;break;}}}
    const d2=x*x+y*y;if(inP<0&&d2>cr2)continue;
    let col=d2<cr2*1.6?P.sh:P.mn;if(inP>=0&&d2>Rr*Rr*.5&&(x+y)%5===0)col=P.hi;
    c.fillStyle=col;c.fillRect(Math.round(cx+x),Math.round(cy+y),1,1);
  }
  c.fillStyle='#ffd34d';for(let k=0;k<5;k++){const a=rot+k*Math.PI*2/5;c.fillRect(Math.round(cx+Math.cos(a)*Rr*.18),Math.round(cy+Math.sin(a)*Rr*.18),1,1);}
}

/* =========================================================
   Backgrounds
   ========================================================= */
function makeBG(o){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const id=x.createImageData(W,H),d=id.data,sk=o.sky.map(hex),gd=o.gnd?o.gnd.map(hex):null,hz=o.gnd?o.hz:H;
  for(let y=0;y<H;y++){let a,b,f;if(!gd||y<hz){a=sk[0];b=sk[1];f=y/Math.max(1,hz);}else{a=gd[0];b=gd[1];f=(y-hz)/Math.max(1,PT-hz);}f=clamp(f,0,1);
    for(let xx=0;xx<W;xx++){const th=(BAY[(y&3)*4+(xx&3)]+.5)/16,q=Math.min(7,Math.floor(f*7+th))/7,k=(y*W+xx)*4;
      d[k]=a[0]+(b[0]-a[0])*q;d[k+1]=a[1]+(b[1]-a[1])*q;d[k+2]=a[2]+(b[2]-a[2])*q;d[k+3]=255;}}
  x.putImageData(id,0,0);
  const r=rng(o.seed||7),Rx=(X,Y,w,h,col)=>{x.fillStyle=col;x.fillRect(X,Y,w,h);};
  if(o.stars)for(let i=0;i<o.stars;i++){const v=r();Rx((r()*W)|0,(r()*(o.starH||H))|0,1,1,v<.15?'#ffffff':v<.5?'#a9a6d8':'#5b5890');}
  if(o.gnd)for(let i=0;i<360;i++){const y=hz+2+((r()*(PT-hz))|0);Rx((r()*W)|0,y,1,1,r()<.5?'#00000026':'#ffffff14');}
  if(o.deco)o.deco(x,Rx,r);
  return c;
}

/* =========================================================
   Tree generator
   ========================================================= */
function genTree(r,x,y,len,ang,w,depth,segs,tips){
  const x1=x+Math.cos(ang)*len,y1=y+Math.sin(ang)*len;segs.push([x,y,x1,y1,Math.max(1,Math.round(w))]);
  if(depth<=0){tips.push([x1,y1]);return;}
  const n=depth>3?2:(r()<.5?2:3);
  for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*lerp(.35,.7,r())+lerp(-.15,.15,r());genTree(r,x1,y1,len*lerp(.68,.82,r()),a,w*.68,depth-1,segs,tips);}
  if(depth<=2)tips.push([x1,y1]);
}
function drawSegs(segs,dark,light){
  for(const [x0,y0,x1,y1,w] of segs){const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))||1;
    for(let i=0;i<=n;i++){const t=i/n,x=Math.round(x0+(x1-x0)*t-w/2),y=Math.round(y0+(y1-y0)*t-w/2);g.fillStyle=dark;g.fillRect(x,y,w,w);if(w>=3){g.fillStyle=light;g.fillRect(x,y,1,w);}}}
}
function spotsDraw(sp,c){for(const s of sp){if(s.o>=c)break;if(s.kind&&s.kind!=='p')continue;puff(s.x,s.y,s.r);}}
const sortO=a=>a.sort((p,q)=>p.o-q.o);

/* =========================================================
   Scenes
   ========================================================= */

function noiseMap(seed,oct){const r=rng(seed),out=new Float32Array(MW*MH);let amp=1,tot=0;
  for(let o=0;o<oct;o++){const gw=4<<o,gh=2<<o,grid=new Float32Array(gw*(gh+1));for(let i=0;i<grid.length;i++)grid[i]=r();

      const a=grid[y0*gw+x0%gw],b=grid[y0*gw+(x0+1)%gw],c=grid[Math.min(gh,y0+1)*gw+x0%gw],d=grid[Math.min(gh,y0+1)*gw+(x0+1)%gw];
      out[y*MW+x]+=amp*((a*(1-sx)+b*sx)*(1-sy)+(c*(1-sx)+d*sx)*sy);}tot+=amp;amp*=.5;}
  for(let i=0;i<out.length;i++)out[i]/=tot;return out;}

  const sm2=a=>{const b=new Float32Array(a.length);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let s=0,c=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const yy=y+dy;if(yy<0||yy>=MH)continue;s+=a[yy*MW+((x+dx+MW)%MW)];c++;}b[y*MW+x]=s/c;}

const ashOn=()=>S.total>=300||S.all>=3e5;
const feverOn=()=>S.L.pochi>0;
function tapAt(x,y,kind){
  const tn=performance.now()/1000;
  if(kind!=='swipe'){if(tn-RT.lastTap<.8)RT.combo++;else RT.combo=1;RT.lastTap=tn;}
  const cm=CMf(),cmb=1+Math.min(RT.combo,100)*.01*cm;
  let v=kind==='swipe'?TPf()*cm*2:TPf()*cmb*(kind==='blast'?.8:1);
  if(RT.feverT>0&&kind!=='swipe')v*=3+cm;
  add(v);
  if(feverOn()&&RT.feverT<=0){RT.fever=Math.min(100,RT.fever+(kind==='tap'?1.6:kind==='blast'?.5:0));if(RT.fever>=100)startFever();}
  burst(x,y,false);RT.shake=Math.min(2,RT.shake+.15);
  if(kind==='tap'||(kind==='blast'&&RT.combo%3===0)||(kind==='swipe'&&Math.random()<.35))popup(x,y-6,'+'+fmt(v),{fs:Math.min(10,5.4+RT.combo*.04),col:RT.feverT>0?'#ffd34d':'#ffffff'});
  if(RT.combo>=10&&RT.combo%10===0&&kind!=='swipe')popup(x,y-16,tt('combo',RT.combo),{fs:Math.min(12,7+RT.combo*.02),col:'#ffb3cf'});
  SFX.tap(RT.combo);
  if(GRP(S.tier)>=3&&kind!=='swipe'&&Math.random()<.6){const e=RT.eyes;if(e){beams.push({x0:e.eyeL[0],y0:e.eyeL[1],x1:x,y1:y,t:0});beams.push({x0:e.eyeR[0],y0:e.eyeR[1],x1:x+2,y1:y,t:0});}}
  RT.tapGlow=1;

    // long press

    if(RT.blasting&&q){RT.blastAcc+=dt*14;while(RT.blastAcc>=1&&RT.ash>0){RT.blastAcc--;RT.ash-=2.5;tapAt(q.x+rnd(-8,8),clamp(q.y+rnd(-8,8),SY0,PT-4),'blast');}if(RT.ash<=0){RT.blasting=false;RT.ash=0;}}
    else RT.ash=Math.min(100,RT.ash+12*dt);
    if(performance.now()/1000-RT.lastTap>.8)RT.combo=0;
    // device shots (visual)
    if(S.L.dev>0){RT.devAcc+=dt*Math.min(6,AUTOf()+.3);while(RT.devAcc>=1){RT.devAcc--;const[mx,my]=devMouth();const sp=scene.spots.length&&RT.spotN?scene.spots[(Math.random()*RT.spotN)|0]:null;
      shots.push({x0:mx,y0:my,x1:sp?sp.x:rnd(40,W-30),y1:sp?sp.y:rnd(SY0+20,PT-20),t:0,dur:rnd(.5,.8)});SFX.shot();}}
    if(!RT.trans&&!RT.ending&&!S.ended&&S.total>=TIERS[S.tier].goal){if(S.tier<11)startMankai();else startEnding();}
    RT.saveT+=dt;if(RT.saveT>5){RT.saveT=0;save();}
  }

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max||p.y>PT+4){parts.splice(i,1);continue;}

  for(const b of beams){g.globalAlpha=1-b.t/.16;const n=Math.ceil(Math.hypot(b.x1-b.x0,b.y1-b.y0));g.fillStyle=`hsl(${(T*500)%360},100%,75%)`;for(let i=0;i<n;i+=1){const t=i/n;g.fillRect(Math.round(lerp(b.x0,b.x1,t)),Math.round(lerp(b.y0,b.y1,t)),2,2);}}g.globalAlpha=1;
  // petals
  for(const p of parts){g.globalAlpha=Math.min(1,(p.max-p.life)*3);const P=pal(p.h);g.fillStyle=p.k===3?`hsl(${(p.h+T*200)%360},100%,75%)`:(p.h<160?P.mn:P.hi);g.fillRect(Math.round(p.x),Math.round(p.y),p.w,p.hh);}g.globalAlpha=1;
  // characters
  drawDevice();RT.eyes=drawJii();drawPochi();
  // blast ring
  const q=RT.down!=null?ptrs.get(RT.down):null;
  if(RT.blasting&&q){g.fillStyle='#ffffffaa';const rr=10+Math.sin(T*30)*2;for(let a=0;a<Math.PI*2*(RT.ash/100);a+=.1)g.fillRect(Math.round(q.x+Math.sin(a)*rr),Math.round(q.y-Math.cos(a)*rr),1,1);}
  // first-tap hint: pixel hand
  if(RT.started&&S.total<3&&!RT.trans){const hx=CX+16,hy=CY+8+Math.round(Math.sin(T*6)*2);R(hx,hy,3,7,'#fff');R(hx+3,hy+3,6,6,'#fff');R(hx+1,hy+1,1,5,'#f2c39b');R(hx+4,hy+4,4,4,'#f2c39b');}
  // fever frame
  if(RT.feverT>0){for(let i=0;i<W;i+=3){g.fillStyle=`hsl(${(i*4+T*400)%360},100%,65%)`;g.fillRect(i,SY0-2,3,2);g.fillRect(i,PT-2,3,2);}for(let j=SY0;j<PT;j+=3){g.fillStyle=`hsl(${(j*4+T*400)%360},100%,65%)`;g.fillRect(0,j,2,3);g.fillRect(W-2,j,2,3);}}
  if(RT.flash>0){g.setTransform(1,0,0,1,0,0);g.globalAlpha=Math.min(1,RT.flash)*.7;g.fillStyle=RT.flashCol;g.fillRect(0,0,W,PT);g.globalAlpha=1;}
  g.setTransform(1,0,0,1,0,0);
}

/* =========================================================
   HUD
   ========================================================= */
const HC={};const setT=(id,v)=>{if(HC[id]!==v){HC[id]=v;$(id).textContent=v;}};
function hud(dt){
  const[a,b]=fmtP(S.p);setT('pm',a);setT('pu',b);setT('pps',fmt(idlePPS()*(RT.feverT>0?3:1))+' '+tt('unit'));
  setT('toku',S.toku?tt('toku',S.toku,fmt(tokuM()))+(S.loops?' · '+tt('pal'+Math.min(S.loops,3)):''):'');
  setT('tch',tCh(S.tier));setT('tnm',tName(S.tier));const c=prog();
  setT('tpct',S.ended?tt('uni_full'):tt('full_in',Math.floor(c*100)));$('tbar').style.width=(c*100)+'%';
  const ao=ashOn(),fo=feverOn();if($('ashw').hidden===ao)$('ashw').hidden=!ao;if($('fevw').hidden===fo)$('fevw').hidden=!fo;
  $('ashf').style.width=RT.ash+'%';$('fevf').style.width=(RT.feverT>0?RT.feverT*10:RT.fever)+'%';
  uiT-=dt;if(uiDirty||uiT<=0){uiT=.2;uiDirty=false;renderUI();}
}

/* =========================================================
   Loop / boot
   ========================================================= */
let last=performance.now();
let errN=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;
  try{update(dt);}catch(e){if(errN++<5)console.error(e);}
  try{render(false);}catch(e){if(errN++<5)console.error(e);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';}
  try{hud(dt);}catch(e){if(errN++<5)console.error(e);}}
function fit(){const aw=wrap.clientWidth,ah=wrap.clientHeight;const w=Math.floor(Math.min(aw,ah*W/H)),h=Math.floor(w*H/W);stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(w/180)+'px');}
addEventListener('resize',fit);fit();
$('panel').style.top=(PT/H*100)+'%';
labelEl=document.createElement('span');labelEl.className='pop';labelEl.style.cssText='animation:none;transform:none;--fs:4.6;--pc:#ff3b5c';labelEl.hidden=true;popsEl.after(labelEl);labelEl.classList.add('ol');
const had=load();LANG=S.lang||detectLang();setSound(S.sound);buildScene();
applyLang();
$('start').addEventListener('click',()=>{
  initAudio();$('title').hidden=true;RT.started=true;
  const away=had?Math.min(8*3600,(Date.now()-S.t)/1000):0,gain=idlePPS()*away*.5;
  if(had&&away>30&&gain>0){modal(`<h2>${tt('off_t')}</h2><p>${tt('off_d')}</p><p class="num">+${fmt(gain)} ${tt('unit')}</p><p class="note">${tt('off_min',Math.floor(away/60))}</p>`,[[tt('receive'),'',()=>{add(gain);burst(CX,CY,true);SFX.buy();}]]);}
  say(had?pick(tLines(S.tier)):tLines(0)[0]);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('pagehide',save);
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=tt(e.dataset.i);});
  $('start').textContent=had?tt('cont'):tt('start');
  $('tnote').textContent=had?tt('note_cont',tCh(S.tier),tName(S.tier),fmt(S.all)):tt('note_save');
  setSound(S.sound);for(const k in HC)delete HC[k];uiDirty=true;
}
function openLang(){
  modal(`<h2>${tt('lang')}</h2><div class="langs">${LANGS.map(([c,n])=>`<button type="button" data-lang="${c}" aria-pressed="${c===LANG}">${n}</button>`).join('')}</div>`,[[tt('close'),'ghost']]);
  $('mcard').querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;S.lang=LANG;save();applyLang();$('modal').hidden=true;openLang();}));
}
$('lng').addEventListener('click',()=>{initAudio();openLang();});
$('tlng').addEventListener('click',openLang);
requestAnimationFrame(frame);
})();
</script>
