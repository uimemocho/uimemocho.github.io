<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="小さなツールとゲームを集めた、個人制作のプレイグラウンド。"
    />
    <meta property="og:title" content="uimemocho — Tools & Games" />
    <meta
      property="og:description"
      content="小さなツールとゲームを集めた、個人制作のプレイグラウンド。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <title>uimemocho — Tools &amp; Games</title>
    <link rel="canonical" href="https://uimemocho.github.io/" />
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace(`https://uimemocho.github.io/${window.location.hash}`);
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20261102-7" />
    <script defer src="/app.js?v=20261102-5"></script>
  </head>
  <body>
    <dialog id="project-dialog" class="project-dialog" aria-labelledby="dialog-title">
      <img class="dialog-thumbnail" width="640" height="400" alt="" />
      <div class="dialog-body">
        <div class="dialog-meta">
          <span class="type"></span>
          <button type="button" class="like-project" aria-pressed="false" disabled>
            <span class="like-heart" aria-hidden="true">♡</span><span class="like-count">—</span>
          </button>
        </div>
        <h2 id="dialog-title" tabindex="-1"></h2>
        <p class="dialog-description"></p>
        <p class="dialog-status like-status" role="status" aria-live="polite"></p>
        <a class="open-project"><span></span><span class="arrow" aria-hidden="true">↗</span></a>
        <button type="button" class="dialog-close">閉じる</button>
      </div>
    </dialog>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#top" aria-label="uimemocho ホーム">
          <span class="brand-mark" aria-hidden="true"></span>
          uimemocho
        </a>
        <span class="header-label">Small ideas. Big fun.</span>
        <span class="header-index">Tokyo / 2026</span>
      </header>

      <main id="top">
        <section class="catalog" aria-labelledby="catalog-title">
          <div class="catalog-bar">
            <div>
              <h1 class="section-title" id="catalog-title">
                作品一覧 <span id="visible-count">00</span>
              </h1>
            </div>
            <div class="filters" role="group" aria-label="作品を種類で絞り込む">
              <button class="filter" type="button" data-filter="all" aria-pressed="true">
                すべて
              </button>
              <button class="filter" type="button" data-filter="game" aria-pressed="false">
                ゲーム
              </button>
              <button class="filter" type="button" data-filter="tool" aria-pressed="false">
                ツール
              </button>
            </div>
            <label class="sort-control" for="project-sort">
              並び順
              <select id="project-sort">
                <option value="newest">新しい順</option>
                <option value="oldest">古い順</option>
                <option value="popular">人気順</option>
              </select>
            </label>
          </div>

          <p class="like-status" id="likes-status" role="status" aria-live="polite"></p>
          <div class="project-grid" id="project-grid" aria-live="polite"></div>
          <p class="catalog-notice" id="catalog-notice" role="status" aria-live="polite">
            作品情報を読み込んでいます。
          </p>
        </section>
      </main>

      <footer>
        <span>© uimemocho</span>
        <span>Made with curiosity in Japan</span>
        <span><a href="/privacy.html">プライバシーポリシー</a></span>
      </footer>
    </div>
  </body>
</html>
